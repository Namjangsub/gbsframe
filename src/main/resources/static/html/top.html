<script type="text/javascript">
	$(document).ready(function() {
		//일정현황 간트차트의 스크립트 오류로 메뉴 숨김 처리
		if ($("#pgmId").val() == 'WB0501M01') $('#topShortLinkMenu').hide();
		
		//authChk();
		if(jwt.authInfo?.indexOf("AUTH999") < 0) {
			// $("#btnAdmin").hide();
			$("#btnAdmin").addClass("admin_controls");
		} else {
			// $("#btnAdmin").show();
			$("#btnAdmin").removeClass("admin_controls");
		}
		
		//개인별 상태현황 정보 처리
		userStatusRtv();

		$("#topUserNm").click(function() {topinsertDailyWorkModal("C");});
		$("#personalStatus").click(function() {callPersonalStatus();});

		//결재미완료 / 공유미확인 건수 처리 (최초 조회 + 3분 간격 갱신 + 탭간 동기화)
		window.addEventListener("storage", function(e) {
			var key = getTodoCacheKey();
			if (key && e.key === key && e.newValue) {
				try {
					var cached = JSON.parse(e.newValue);
					renderMyTodoCount(cached.approvalCnt, cached.shareCnt);
				} catch (err) {}
			}
		});

		document.addEventListener("visibilitychange", function() {
			if (!document.hidden) {
				myTodoStatusRtv(false);
			}
		});

		renderFromCache();
		myTodoStatusRtv(false);
		setInterval(function() { myTodoStatusRtv(false); }, TODO_TTL_MS);

	});

	var TODO_TTL_MS = 600000;       // 10분
	var FETCH_LOCK_TTL_MS = 5000;   // 5초

	var TODO_TAB_ID =
		Date.now() + "_" +
		Math.random().toString(36).substring(2);

	function getTodoCacheKey() {
		if (!jwt || !jwt.userId) {
			return null;
		}
		return "GBS:todoCnt:" +
			(jwt.coCd || "") + ":" +
			jwt.userId;
	}

	function getTodoCache() {
		var key = getTodoCacheKey();
		if (!key) {
			return null;
		}
		var raw = localStorage.getItem(key);
		if (!raw) {
			return null;
		}
		try {
			return JSON.parse(raw);
		} catch (e) {
			localStorage.removeItem(key);
			return null;
		}
	}

	function renderMyTodoCount(approvalCnt, shareCnt) {
		$("#myApprovalCount").text(approvalCnt || 0);
		$("#myShareCount").text(shareCnt || 0);
	}

	function renderFromCache() {
		var cached = getTodoCache();
		if (!cached) {
			return null;
		}
		renderMyTodoCount(
			cached.approvalCnt,
			cached.shareCnt
		);
		return cached;
	}

	function myTodoStatusRtv(isForce) {
		if (!localStorage.getItem("access_token") ||
			!jwt ||
			!jwt.userId) {
			return;
		}

		if (document.hidden && !isForce) {
			return;
		}

		var cacheKey = getTodoCacheKey();
		if (!cacheKey) {
			return;
		}

		var lockKey = cacheKey + ":fetching";
		var now = Date.now();
		var cached = getTodoCache();

		// 캐시 먼저 화면 반영
		if (cached) {
			renderMyTodoCount(
				cached.approvalCnt,
				cached.shareCnt
			);
		}

		// 일반 조회는 TTL 이내면 종료
		if (!isForce &&
			cached &&
			now - cached.at < TODO_TTL_MS) {
			return;
		}

		// ★ Force 여부와 관계없이 Lock 확인
		var fetchLock = localStorage.getItem(lockKey);
		if (fetchLock &&
			now - Number(fetchLock) < FETCH_LOCK_TTL_MS) {
			return;
		}

		// 만료 Lock 정리
		if (fetchLock) {
			localStorage.removeItem(lockKey);
		}

		// Fetching Lock
		localStorage.setItem(
			lockKey,
			String(now)
		);

		var formData = {
			coCd: jwt.coCd,
			salesMngId: jwt.userId,
			boardParam: "BOARD",
			sanctnSttus: "N"
		};

		postAjax(
			"/user/wb/wb20/selectToDoCountGrouped",
			formData,
			null,
			function(data) {
				var result = data.result || {};
				var appCnt = Number(result.approvalCnt || 0);
				var shareCnt = Number(result.shareCnt || 0);

				var cacheObj = {
					approvalCnt: appCnt,
					shareCnt: shareCnt,
					at: Date.now()
				};

				// 현재 탭 즉시 갱신
				renderMyTodoCount(
					appCnt,
					shareCnt
				);

				// 다른 탭으로 전달
				localStorage.setItem(
					cacheKey,
					JSON.stringify(cacheObj)
				);

				// Lock 해제
				localStorage.removeItem(lockKey);
			}
		);
	}

	//결재화면(TO-DO LIST)으로 이동
	function goToApprovalScreen() {
		window.open("/static/html/user/wb/wb20/WB2001M01.html", "_blank");
	}
	
	function userStatusRtv() {
		var formData = {
			"userId": jwt.userId
		};
		postAjax("/admin/cm/cm06/selectUserStatusList", formData, null, function(data) {
			if (Array.isArray(data?.result) && data.result.length > 0) {
				var list = data.result[0];
				if (list == undefined ) {
					list = {
						"scdLoad"  : "COMM1",
						"qcLoad"   : "COMM1",
						"jobLoad"  : "COMM1",
						"commLoad" : "COMM1"
					}
				}

				$("#lastLoginTime").text(list.lastLoginTime);
				for (var key in list) {
					if (list.hasOwnProperty(key)) {
						changeStatus(key, list[key]);
					}
				}
	
				if (list.userStatus == "Y") { //처음 로그인시 상태코드 수정화면 뛰우기 
					callPersonalStatus();
				}
			}
		});
	}
	
	function updatePwModal() {
		openModal("/static/html/cmn/modal/updatePw.html", 500, 200, "비밀번호 변경");
	}
	
	function callPersonalStatus() {
		openModal("/static/html/cmn/modal/changeUserStatus.html", 500, 250, "개인별 부하 정도 체크", null, function (data) {
			// debugger;
			if (data != undefined ) {
				for (var key in data) {
					if (key !="userId" && data.hasOwnProperty(key)) {
						changeStatus(key, data[key]);
					}
				}
			}
		});
	}
	
	function changeStatus(obj, set) {
		if (set.includes('COMM')) {
			const setClass = (set == "COMM3") ? "status_red" : (set == "COMM2") ? "status_orange" : "status_green";
			$("#" + obj).removeClass();
			$("#" + obj).addClass(setClass);
		}
	}
	
	function allEmployee() {
		openModal("/static/html/cmn/modal/displayUserStatusImage.html", 1200, 870, "전직원 상태 현황 ", null, function (data) {
			
		});
	}
	
	function topinsertDailyWorkModal(type) {
		var paramObj = {
			"actionType" : type,
			"fileTrgtKey" : 0,
			"coCd" 	   : jwt.coCd,
			"userId"   : jwt.userId,
			"pgmId"    : "PM0101M01"
		}
		openModal("/static/html/user/pm/pm01/PM0101P01.html", 1100, 750, "", paramObj, function(data) {
			if (typeof gridView !== 'undefined' && gridView !== null) {
				gridView.setData(0);
			}
		});
	}

</script>
