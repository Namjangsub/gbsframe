<style>
.resizable-wrapper {
  display: flex;
  width: 100%;
  height: 100%;
}

.resizable-panel {
  min-width: 300px;
  flex: 1;
  overflow: hidden;
}

.drag-bar {
  width: 6px;
  background-color: #ccc;
  cursor: ew-resize;
}

#scndTable thead tr td {
	position: relative;
}
.col-resizer {
	position: absolute;
	right: -3px;
	top: 0;
	width: 6px;
	height: 100%;
	cursor: col-resize;
	z-index: 10;
	background-color: transparent;
	border-right: 2px dashed #bbb;
	user-select: none;
	-webkit-user-select: none;
	transition: background-color 0.2s, border-color 0.2s;
}
.col-resizer:hover {
	background-color: rgba(0, 123, 255, 0.2);
	border-right: 2px solid #007bff;
}
.col-resizer::after {
	content: "⋮";
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	font-size: 14px;
	color: #888;
	font-weight: bold;
	pointer-events: none;
	opacity: 0.7;
	transition: color 0.2s, opacity 0.2s;
}
.col-resizer:hover::after {
	color: #007bff;
	opacity: 1;
}
.grid-splitter {
	height: 8px;
	cursor: row-resize;
	background-color: #f1f1f1;
	border-top: 1px solid #ccc;
	border-bottom: 1px solid #ccc;
	margin: 5px 0;
	text-align: center;
	line-height: 6px;
	user-select: none;
	-webkit-user-select: none;
	position: relative;
	transition: background-color 0.2s, border-color 0.2s;
}
.grid-splitter:hover {
	background-color: rgba(0, 123, 255, 0.1);
	border-top: 1px solid #007bff;
	border-bottom: 1px solid #007bff;
}
.grid-splitter span {
	font-size: 10px;
	color: #888;
	letter-spacing: 2px;
	transition: color 0.2s;
}
.grid-splitter:hover span {
	color: #007bff;
}


/* ===== 패널 헤더 최첨단 컴팩트 모드 (높이 최소화) ===== */
#scndTable thead tr td {
	padding: 1px 3px !important;
	vertical-align: middle;
}
.panel_head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	flex-wrap: nowrap;
	gap: 4px;
	margin-bottom: 0px;
	padding: 1px 0;
	min-height: 22px;
}
.panel_head h3.location {
	margin: 0 !important;
	padding: 0 !important;
	font-size: 13px !important;
	line-height: 20px !important;
	display: inline-flex;
	align-items: center;
}
.panel_head h3.location .page_tit {
	font-size: 13px !important;
	font-weight: bold;
	line-height: 20px !important;
}
.panel_head select {
	height: 22px !important;
	padding: 0 4px !important;
	font-size: 11px !important;
	line-height: 20px !important;
	margin-left: 3px;
}
.panel_cnt {
	display: inline-flex;
	align-items: center;
	justify-content: center;
	min-width: 16px;
	height: 18px;
	max-height: 20px;
	padding: 0 5px;
	margin-left: 3px;
	font-size: 10px;
	font-weight: bold;
	color: #fff;
	background: #6c757d;
	border-radius: 9px;
	vertical-align: middle;
	box-sizing: border-box;
}
.panel_tools { display: inline-flex; gap: 2px; align-items: center; }
.panel_tools .btn { font-size: 10px; padding: 1px 5px; height: 22px; line-height: 18px; }
.panel_help {
	display: inline-block;
	width: 13px;
	height: 13px;
	line-height: 13px;
	margin-left: 3px;
	font-size: 9px;
	font-weight: bold;
	text-align: center;
	color: #fff;
	background: #adb5bd;
	border-radius: 50%;
	cursor: help;
	vertical-align: middle;
}

/* ===== 빈 데이터 안내 ===== */
.grid_wrap { position: relative; }
.grid_empty_msg {
	position: absolute;
	left: 0;
	right: 0;
	top: 45%;
	text-align: center;
	font-size: 13px;
	color: #999;
	pointer-events: none;
	display: none;
}

<script type="text/javascript">
	// 순차 미결재(순차 결재 전용 문서 중 이전 결재자가 1명 이상 미결인 상태) 여부 판정
	function checkSequentialPending(item) {
		if (!item || item.todoDiv1CodeNm !== '결재') return false;

		// 순차 결재 규칙이 명확히 적용된 전용 문서 코드만 지정 (동시/병렬 결재 건 오판 방지)
		var seqStrictDocCodes = [
			"TODODIV2190", "TODODIV2191", "TODODIV2200", "TODODIV2201", // 출장신청서 / 출장복명서
			"TODODIV2100", // 수주복표원가
			"TODODIV2120"  // PFU 결재
		];

		if (seqStrictDocCodes.indexOf(item.todoDiv2CodeId) < 0) {
			return false;
		}

		return Number(item.beforeNotConfirm || 0) > 0;
	}
	var isUserResized1 = localStorage.getItem('cm1002_row_ratio1') ? true : false; // 첫번째 컬럼 상하 그리드 수동 크기 조정 여부
	var isUserResized2 = localStorage.getItem('cm1002_row_ratio2') ? true : false; // 세번째 컬럼 상하 그리드 수동 크기 조정 여부

	var odrSeq = null;
	var odrDtlSeqArr = [];

	ax5.ui.grid.formatter["bilgYn"] = function () {
		var color = this.value == "Y" ? "color-circle_02.png" : "color-circle_01.png";
		if (this.value == "E"){
			return 'E';
		} else {
			return '<img src="/static/img/'+color+'" style="width: 10px;height: 10px;"></img>';
		}
	};
	function styleCountChk(row){
		if (parseInt(row.bomCnt) < 2)  {return "grid-font-blue-bold";}
		if (parseInt(row.matrCnt) == 0) {return "grid-font-blue-bold";}
		if (parseInt(row.matrCnt) < parseInt(row.orderCnt)){ return "grid-font-blue-bold";}
		return "";
	}

	// 미발주 그리드 기본 컬럼 정의 (사용자별 컬럼설정 병합 대상)
	var clmnDefaultColumns = [
		{key: "clntNm",  					label: "고객사",      align: "left",   width: 170, formatter: function () {
				return this.value + "(" + this.item.clntPjtNm + ")"}},
		{key: "salesCd",  				label: "Sales Code",      align: "center",   width: 120},
		{key: "bomCnt",  					label: "BOM건수",      align: "center",   width: 60
			, styleClass: function () {return (parseInt(this.item.bomCnt) < 2)?"grid-cell-orange-bold":""}},
		{key: "matrCnt",      			label: "자재건수",      align: "center",   width: 60, formatter: "money"
			, styleClass: function () {return (parseInt(this.item.matrCnt) == 0)?"grid-cell-orange-bold":""}},
		{key: "orderCnt",      			label: "발주건수",      align: "center",   width: 60, formatter: "money"
			, styleClass: function () {return (parseInt(this.item.matrCnt) < parseInt(this.item.orderCnt) || parseInt(this.item.orderCnt)==0)?"grid-cell-orange-bold":""}},
		{key: "reqDt",	      			label: "요구일",      align: "center",   width: 75},
		{key: "reqStNm",	      			label: "상태",      align: "center",   width: 60},
		{key: "eqpNm",  					label: "설비명",      align: "left",   width: 250},
		{key: "fileTrgtKey",  			label: "유니크",      align: "center",   width: 100, hidden: true},
		{key: "reqNo",  					label: "요청번호",      align: "center",   width: 90, hidden: false},
		{key: "ordrgId",  				label: "발행자",      align: "center",   width: 60, hidden: true},
		{key: "ordrgIdNm",  				label: "발행자",      align: "center",   width: 60, hidden: false},
		{key: "ordrgDt",	      			label: "발행일",      align: "center",   width: 75},
		{key: "rsltNo",  					label: "결과",      align: "center",   width: 100, hidden: true},
		{key: "coCd",  					label: "회사",      align: "center",   width: 100, hidden: true}
	];

	// 미발주 그리드
	var clmnGridView = {
		initView : function() {
			var cols = GridColumnConfig.apply("CM1002M01", "clmn-grid", clmnDefaultColumns);
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showRowSelector : false,
				multipleSelect : false,
				sortable : true,
				target : $('[data-ax5grid="clmn-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
// 						inserOrderModal("U", this.item);
						openNonOrderDetail(this.item);
					},
					mergeCells : ["clntNm", "salesCd", "dsgnNo", "ordrsClntNm", "reaminBalQty"],
				},
				page : {
					display : true,
				},
				footSum: [
					GridColumnConfig.buildSumRow(cols, {
						label: "[ 합계 ]",
						sums: {
							"bomCnt"   : {collector: "sum", formatter: "money", align: "center"},
							"matrCnt"  : {collector: "sum", formatter: "money", align: "center"},
							"orderCnt" : {collector: "sum", formatter: "money", align: "center"}
						}
					})
				],
				columns: cols
			});
			return this;
		},
		setData : function() {
			var targetObj = this.target;

	function openTodoDetail(item) {
		var row = item;
		if (!row) {
			row = gridView.target.getList("selected")[0];
		}
		if (!row) {
			alert("행을 선택해 주십시오.");
			return;
		}

		let addParam = {"viewMode": 1, "todoView": "INQ", "todoKey":row.todoKey, "gridObj" :row};
		let paramObj = {};
		if (row.todoDiv2CodeId != "TODODIV9999") {
			paramObj = JSON.parse(row.pgParam);
			Object.assign(paramObj, addParam);
		}

		var reloadCallback = function() {
			if (gridView && gridView.target && gridView.target.page) {
				gridView.setData(gridView.target.page.currentPage);
			} else {
				gridView.setData(0);
			}
		};

		if (row.todoDiv2CodeId =="TODODIV1030" || row.todoDiv2CodeId =="TODODIV2060" ||
			row.todoDiv2CodeId =="TODODIV1090" || row.todoDiv2CodeId =="TODODIV2090" ) { //이슈현황 화면 call
			openModal("/static/html" + row.pgPath, 1200, 870, "", paramObj, reloadCallback);
		} else if (row.todoDiv2CodeId =="TODODIV1060"){	//프로젝트 이슈 call
			openModal("/static/html" + row.pgPath, 900, 880, "프로젝트이슈 To-Do", paramObj, reloadCallback);
		} else if (row.todoDiv2CodeId =="TODODIV2100"){	//수주현황 결재 call
			openModal("/static/html" + row.pgPath, $('body').width(), $('body').height()-40, "수주복표원가  To-Do", paramObj, reloadCallback);
		} else if (row.todoDiv2CodeId =="TODODIV1120" || row.todoDiv2CodeId =="TODODIV2120"){	//PFU 결재 call
			openModal("/static/html" + row.pgPath, 1700, $('body').height()-40, "PFU 결재 화면", paramObj, reloadCallback);
		} else if (row.todoDiv2CodeId == "TODODIV2170") {
			openModal("/static/html" + row.pgPath, 1600, 850, "", paramObj, reloadCallback);
		} else if (row.todoDiv2CodeId == "TODODIV9999") {			//문제현황임
			toDoListWbsIssModal(row);

		}
	}

	var _dashboardRawTodoList = [];
	var _currentDashboardQFilter = 'ready';

	function updateDashboardQFilterBadges() {
		var readyCnt = 0, pendingCnt = 0, shareCnt = 0, allCnt = _dashboardRawTodoList.length;
		$.each(_dashboardRawTodoList, function(_, item) {
			if (item.todoDiv1CodeNm === '결재') {
				if (checkSequentialPending(item)) pendingCnt++;
				else readyCnt++;
			} else if (item.todoDiv1CodeNm === '공유') {
				shareCnt++;
			}
		});
		$('#qReadyCnt').text(readyCnt);
		$('#qPendingCnt').text(pendingCnt);
		$('#qShareCnt').text(shareCnt);
		$('#qAllCnt').text(allCnt);
	}

	function filterDashboardTodo(filterType, btnElem) {
		_currentDashboardQFilter = filterType;
		$('.todo_qfilter_btn').each(function() {
			var f = $(this).attr('data-qfilter');
			if (f === filterType) {
				$(this).addClass('active');
				var bg = '#5cb85c';
				if (f === 'pending') bg = '#d9534f';
				if (f === 'share') bg = '#0275d8';
				if (f === 'all') bg = '#6c757d';
				$(this).css({ background: bg, color: '#fff', border: 'none' });
			} else {
				$(this).removeClass('active');
				var c = '#333';
				if (f === 'pending') c = '#d9534f';
				if (f === 'share') c = '#0275d8';
				if (f === 'ready') c = '#5cb85c';
				$(this).css({ background: '#fff', color: c, border: '1px solid #ddd' });
			}
		});

		var filtered = $.grep(_dashboardRawTodoList, function(item) {
			var isPending = checkSequentialPending(item);
			if (_currentDashboardQFilter === 'ready') return item.todoDiv1CodeNm === '결재' && !isPending;
			if (_currentDashboardQFilter === 'pending') return item.todoDiv1CodeNm === '결재' && isPending;
			if (_currentDashboardQFilter === 'share') return item.todoDiv1CodeNm === '공유';
			return true;
		});

		if (gridView && gridView.target) {
			gridView.target.setData({
				list: filtered,
				page: { totalElements: filtered.length }
			});
		}
		updatePanelCount("Todo", filtered);
	}

	// 납기 초과 판정 기준일수 (사용자 확정 : 10일)
	var OVERDUE_DAYS = 10;

	// 기준일자가 오늘보다 OVERDUE_DAYS 초과하여 경과했는지 판정
	function isOverdue(dtVal) {
		if (!dtVal) return false;
		var d = moment(String(dtVal).replace(/[^0-9]/g, ''), 'YYYYMMDD');
		if (!d.isValid()) return false;
		return moment().startOf('day').diff(d.startOf('day'), 'days') > OVERDUE_DAYS;
	}

	// 패널별 건수 배지 + 상단 KPI + 빈 자료 안내 갱신
	function updatePanelCount(panelKey, list) {
		var cnt = (list && list.length) ? list.length : 0;
		$('#cnt' + panelKey).text(cnt);
		$('#kpi' + panelKey).text(cnt);
		$('#empty' + panelKey).css('display', cnt > 0 ? 'none' : 'block');
	}

	function initColResizer() {
		var isDragging = false;
		var currentResizer = null;
		var startX = 0;
		var startWidth1 = 0;
		var startWidth2 = 0;
		var colIndex = -1;

		$('#scndTable').css('table-layout', 'fixed');

		// 로컬스토리지 저장값으로 가로폭 복원
		var savedColWidths = localStorage.getItem('cm1002_col_widths');
		if (savedColWidths) {
			var widths = JSON.parse(savedColWidths);
			var $cols = $('#scndTable colgroup col');
			$cols.eq(0).attr('width', widths[0]);
			$cols.eq(1).attr('width', widths[1]);
			$cols.eq(2).attr('width', widths[2]);
		}

		$('.col-resizer').on('mousedown', function(e) {
			isDragging = true;
			currentResizer = $(this);
			startX = e.pageX;

			var $td = currentResizer.closest('td');
			colIndex = $td.index();

			var $cols = $('#scndTable colgroup col');
			var width0 = $('#scndTable thead tr td').eq(0).outerWidth();
			var width1 = $('#scndTable thead tr td').eq(1).outerWidth();
			var width2 = $('#scndTable thead tr td').eq(2).outerWidth();

			$cols.eq(0).attr('width', width0);
			$cols.eq(1).attr('width', width1);
			$cols.eq(2).attr('width', width2);

			startWidth1 = parseInt($cols.eq(colIndex).attr('width'));
			startWidth2 = parseInt($cols.eq(colIndex + 1).attr('width'));

			$('body').css({
				'user-select': 'none',
				'-webkit-user-select': 'none',
				'cursor': 'col-resize'
			});

			$(document).on('mousemove.colResize', function(e) {
				if (!isDragging) return;

				var deltaX = e.pageX - startX;
				var newWidth1 = startWidth1 + deltaX;
				var newWidth2 = startWidth2 - deltaX;

				if (newWidth1 > 150 && newWidth2 > 150) {
					var $cols = $('#scndTable colgroup col');
					$cols.eq(colIndex).attr('width', newWidth1);
					$cols.eq(colIndex + 1).attr('width', newWidth2);
					
					// 그리드 리사이징 강제 유발
					if(clmnGridView.target) clmnGridView.target.align();
					if(taxGridView.target) taxGridView.target.align();
					if(issueGridView.target) issueGridView.target.align();
					if(gridView.target) gridView.target.align();
					if(workGridView.target) workGridView.target.align();
				}
			});

			$(document).on('mouseup.colResize', function() {
				isDragging = false;
				$(document).off('mousemove.colResize mouseup.colResize');
				$('body').css({
					'user-select': '',
					'-webkit-user-select': '',
					'cursor': ''
				});

				// 가로 폭 세팅값 로컬스토리지 저장
				var w0 = $('#scndTable thead tr td').eq(0).outerWidth();
				var w1 = $('#scndTable thead tr td').eq(1).outerWidth();
				var w2 = $('#scndTable thead tr td').eq(2).outerWidth();
				localStorage.setItem('cm1002_col_widths', JSON.stringify([w0, w1, w2]));
			});
		});
	}

	// 화면 해상도에 맞추어 5개 그리드의 세로 높이를 비율로 분배하여 꽉 채워주는 함수
	function adjustGridHeight() {
		var winHeight = $(window).height();
		var isIframe = (window.self !== window.top);

		if (isIframe) {
			try {
				winHeight = window.top.innerHeight;
			} catch (e) {
				winHeight = $(window).height();
			}
		}

		// 동적 오프셋 측정 (상단 헤더 마진, 탭 영역 높이 차감)
		var occupiedOffset = isIframe ? 190 : 130;
		var availableHeight = winHeight - occupiedOffset;

		// 최소 해상도 가드
		if (availableHeight < 400) {
			availableHeight = 400;
		}

		// 상하 그리드 사이 영역(스플리터 + 하단 패널 헤더)의 실제 높이를 측정해서 차감
		var titleOffset = ($('#gridSplitter1').outerHeight(true) || 0)
						+ ($('#gridSplitter1').nextAll('.panel_head').first().outerHeight(true) || 0);
		if (titleOffset < 30) {
			titleOffset = 55; // 렌더 전 등 측정 실패 시 기존 기본값 사용
		}
		var halfHeight = Math.floor((availableHeight - titleOffset) / 2);

		if (halfHeight < 150) {
			halfHeight = 150;
		}

		var heightTop = halfHeight;
		var heightBottom = availableHeight - titleOffset - heightTop;

		// 첫 번째 컬럼 그리드 높이 적용
		if (!isUserResized1) {
			if (clmnGridView.target) clmnGridView.target.setHeight(heightTop);
			if (taxGridView.target) taxGridView.target.setHeight(heightBottom);
		} else {
			var ratio = localStorage.getItem('cm1002_row_ratio1') ? parseFloat(localStorage.getItem('cm1002_row_ratio1')) : 0.5;
			var newH1 = Math.floor((availableHeight - titleOffset) * ratio);
			var newH2 = availableHeight - titleOffset - newH1;
			if (clmnGridView.target) clmnGridView.target.setHeight(newH1);
			if (taxGridView.target) taxGridView.target.setHeight(newH2);
		}

		// 세 번째 컬럼 그리드 높이 적용
		if (!isUserResized2) {
			if (gridView.target) gridView.target.setHeight(heightTop);
			if (workGridView.target) workGridView.target.setHeight(heightBottom);
		} else {
			var ratio = localStorage.getItem('cm1002_row_ratio2') ? parseFloat(localStorage.getItem('cm1002_row_ratio2')) : 0.5;
			var newH1 = Math.floor((availableHeight - titleOffset) * ratio);
			var newH2 = availableHeight - titleOffset - newH1;
			if (gridView.target) gridView.target.setHeight(newH1);
			if (workGridView.target) workGridView.target.setHeight(newH2);
		}

		// 일정관리 문제현황 그리드는 단독 열로 전체 사용
		if (issueGridView.target) issueGridView.target.setHeight(availableHeight);
	}

	function initRowSplitter() {
		// 첫 번째 컬럼 상하 그리드 분할 스플리터 드래그 이벤트
		var isDragging1 = false;
		var startY1 = 0;
		var startH1_top = 0;
		var startH1_bottom = 0;

		$('#gridSplitter1').on('mousedown', function(e) {
			isDragging1 = true;
			startY1 = e.pageY;
			startH1_top = $('[data-ax5grid="clmn-grid"]').height();
			startH1_bottom = $('[data-ax5grid="tax-grid"]').height();

			$('body').css({
				'user-select': 'none',
				'-webkit-user-select': 'none'
			});

			$(document).on('mousemove.rowSplitter1', function(e) {
				if (!isDragging1) return;
				var deltaY = e.pageY - startY1;
				var newH_top = startH1_top + deltaY;
				var newH_bottom = startH1_bottom - deltaY;

				// 두 그리드의 최소 세로크기가 100px을 보장하도록 가드
				if (newH_top > 100 && newH_bottom > 100) {
					clmnGridView.target.setHeight(newH_top);
					taxGridView.target.setHeight(newH_bottom);
					isUserResized1 = true;
				}
			});

			$(document).on('mouseup.rowSplitter1', function() {
				isDragging1 = false;
				$(document).off('mousemove.rowSplitter1 mouseup.rowSplitter1');
				$('body').css({
					'user-select': '',
					'-webkit-user-select': ''
				});

				// 현재 조정된 비율 계산하여 로컬스토리지 저장
				var h1 = $('[data-ax5grid="clmn-grid"]').height();
				var h2 = $('[data-ax5grid="tax-grid"]').height();
				if (h1 + h2 > 0) {
					localStorage.setItem('cm1002_row_ratio1', h1 / (h1 + h2));
				}
			});
		});

		// 세 번째 컬럼 상하 그리드 분할 스플리터 드래그 이벤트
		var isDragging2 = false;
		var startY2 = 0;
		var startH2_top = 0;
		var startH2_bottom = 0;

		$('#gridSplitter2').on('mousedown', function(e) {
			isDragging2 = true;
			startY2 = e.pageY;
			startH2_top = $('[data-ax5grid="todo-grid"]').height();
			startH2_bottom = $('[data-ax5grid="work-grid"]').height();

			$('body').css({
				'user-select': 'none',
				'-webkit-user-select': 'none'
			});

			$(document).on('mousemove.rowSplitter2', function(e) {
				if (!isDragging2) return;
				var deltaY = e.pageY - startY2;
				var newH_top = startH2_top + deltaY;
				var newH_bottom = startH2_bottom - deltaY;

				if (newH_top > 100 && newH_bottom > 100) {
					gridView.target.setHeight(newH_top);
					workGridView.target.setHeight(newH_bottom);
					isUserResized2 = true;
				}
			});

			$(document).on('mouseup.rowSplitter2', function() {
				isDragging2 = false;
				$(document).off('mousemove.rowSplitter2 mouseup.rowSplitter2');
				$('body').css({
					'user-select': '',
					'-webkit-user-select': ''
				});

				// 현재 조정된 비율 계산하여 로컬스토리지 저장
				var h1 = $('[data-ax5grid="todo-grid"]').height();
				var h2 = $('[data-ax5grid="work-grid"]').height();
				if (h1 + h2 > 0) {
					localStorage.setItem('cm1002_row_ratio2', h1 / (h1 + h2));
				}
			});
		});
	}
