<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.6, user-scalable=no">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5toast.css">
	<link rel="stylesheet" href="/static/css/jstree/style.min.css">
	<link rel="stylesheet" href="/static/css/gnb.css">
	<link rel="stylesheet" href="/static/css/main.css">
	<link rel="stylesheet" href="/static/css/sub.css">
	<link rel="stylesheet" href="/static/css/common.css">

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/ax5/ax5toast.min.js"></script>
	<script src="/static/js/jstree/jstree.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/common/GridColumnConfig.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
	<!-- 도움말 팝업 -->
	<script src="/static/js/manualPopup.js"></script>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">
		<input type="hidden" id="pgmId" name="pgmId" value="CM2501M01">
		<input type="hidden" id="userId" name="userId">
		<input type="hidden" id="coCd" name="coCd">

		<!-- 페이지 상단 버튼 -->
		<div class="contents no_bg">
			<ul class="btn_ul">
				<li class="btn_r">
					<a onclick="manualPopup();"><button type="button" class="bg_gray">도움말</button></a>
					<a onclick="initSearch();"><button type="button" class="bg_gray">초기화</button></a>
					<a onclick="gridView.setData(0);"><button type="button" class="bg_gray">검 색</button></a>
				</li>
			</ul>
		</div>

		<!-- 검색 조건 콘텐츠 -->
		<div class="contents search">
			<div class="">
				<table class="table_input type05">
					<tr>
						<th class="hit">회사</th>
						<td>
							<select id="coCd_S" name="coCd_S" data-kind="CO" data-search="coCd" onchange="gridView.setData(0);">
								<option value="">전체</option>
							</select>
						</td>

						<th class="hit">결의일자</th>
						<td>
							<div class="date_input" style="display: flex; align-items: center;">
								<input type="text" class="input_calendar" id="expendDtFrom_S" name="expendDtFrom_S" data-search="expendDtFrom" autocomplete="off" onkeyup="dateMask(this);" onchange="gridView.setData(0);">
								<span>~</span>
								<input type="text" class="input_calendar" id="expendDtTo_S" name="expendDtTo_S" data-search="expendDtTo" autocomplete="off" onkeyup="dateMask(this);" onchange="gridView.setData(0);">
							</div>
						</td>

						<th>발의자</th>
						<td>
							<div class="search_form">
								<input type="hidden" id="reqId_S" name="reqId_S" data-search="reqId">
								<input type="text" id="reqNm_S" name="reqNm_S" readonly onkeyup="if(event.keyCode==8||event.keyCode==46){$('#reqId_S').val('');$('#reqNm_S').val('');}else if(event.keyCode==13){gridView.setData(0);}">
								<a onclick="openReqUserSearch();"><i class="i_search_w"></i></a>
							</div>
						</td>

						<th>지급방법</th>
						<td>
							<select id="pmntDiv_S" name="pmntDiv_S" data-kind="PMNTDIV" data-search="pmntDiv" onchange="gridView.setData(0);">
								<option value="">전체</option>
							</select>
						</td>

						<th>결재상태</th>
						<td>
							<select id="expendSts_S" name="expendSts_S" data-search="expendSts" onchange="gridView.setData(0);">
								<option value="">전체</option>
								<option value="expendSts01">미결재</option>
								<option value="expendSts02">결재진행중</option>
								<option value="expendSts03">결재완료</option>
							</select>
						</td>
					</tr>
				</table>
			</div>
		</div>

		<!-- 콘텐츠 타이틀 & 상단 기능 버튼 -->
		<div class="contents no_bg">
			<div class="contents_tit">
				<span style="height: 30px; line-height: 30px; font-size: 15px; margin-left: 15px;">지출결의서 목록</span>
				<div class="add_btn_small pdl10">
					<a onclick="openExpendModal('C');" style="height: 30px; line-height: 28px;" authchk>+</a>
					<a onclick="deleteExpend();" style="height: 30px; line-height: 28px;" authchk>-</a>
					<a onclick="printExpend();" style="height: 30px; line-height: 28px; width: 110px;"><i class="fas fa-print"></i> 지출결의서출력</a>
					<a onclick="excelDown();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-file-excel"></i> 엑셀다운로드</a>
					<a onclick="openGridColumnEdit();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-cog"></i> 그리드설정</a>
				</div>
				<select id="recordCnt" class="prae_select" data-search="recordCnt" onchange="gridView.setData(0);">
					<option value="25">25</option>
					<option value="50">50</option>
					<option value="100">100</option>
					<option value="500">500</option>
					<option value="9999999">전체</option>
				</select>
			</div>
		</div>

		<!-- 그리드 콘텐츠 -->
		<div class="contents">
			<div class="ax5_grid" data-ax5grid="first-grid" data-ax5grid-config="{}" style="height: 725px; width: 100%;"></div>
			<div data-ax5grid="excel-grid" data-ax5grid-config="{}" style="display: none;"></div>
		</div>
	</div>
</body>
</html>

<script type="text/javascript">
	ax5.ui.grid.tmpl.page_status = function() {
		return '<span>{{{progress}}} {{fromRowIndex}} - {{toRowIndex}} of {{dataRowCount}} {{#dataRealRowCount}} 현재페이지 {{.}}{{/dataRealRowCount}} {{#totalElements}} 전체갯수 {{.}}{{/totalElements}}</span>';
	};

	// 기본 그리드 컬럼 설정
	var defaultColumns = [
		{key: "expendNo",    label: "지출결의번호",       align: "center", width: 110},
		{key: "expendDt",    label: "결의일자",           align: "center", width: 90},
		{key: "reqDeptNm",   label: "발의부서",           align: "center", width: 120},
		{key: "reqNm",       label: "발의자",             align: "center", width: 80},
		{key: "reqJik",      label: "직급",               align: "center", width: 70},
		{key: "pmntDivNm",   label: "지급방법",           align: "center", width: 90},
		{key: "payDueNm",    label: "지급기한",           align: "center", width: 95},
		{key: "costInfo",    label: "원가정보",           align: "left",   width: 180},
		{key: "payClntNm",   label: "지급거래처",         align: "left",   width: 170},
		{key: "currCdNm",    label: "통화종류",           align: "center", width: 80},
		{key: "payAmt",      label: "지급금액",           align: "right",  width: 110, formatter: "money"},
		{key: "vatYn",       label: "VAT포함",            align: "center", width: 70},
		{key: "expendStsNm", label: "발의부서 결재상태",  align: "center", width: 120},
		{key: "creatDttm",   label: "등록일시",           align: "center", width: 135}
	];

	// 메인 그리드 객체
	var gridView = {
		initView: function() {
			this.target = new ax5.ui.grid();
			var cols = GridColumnConfig.apply("CM2501M01", "first-grid", defaultColumns);
			this.target.setConfig({
				target: $('[data-ax5grid="first-grid"]'),
				showLineNumber: true,
				showRowSelector: false,
				multipleSelect: false,
				sortable: true,
				header: {
					align: "center",
					selector: false
				},
				body: {
					onClick: function() {
						this.self.clearSelect();
						this.self.select(this.dindex);
					},
					onDBLClick: function() {
						openExpendModal("U");
					}
				},
				page: {
					navigationItemCount: 9,
					height: 30,
					display: true,
					firstIcon: '<i class="fa fa-step-backward" aria-hidden="true"></i>',
					prevIcon: '<i class="fa fa-caret-left" aria-hidden="true"></i>',
					nextIcon: '<i class="fa fa-caret-right" aria-hidden="true"></i>',
					lastIcon: '<i class="fa fa-step-forward" aria-hidden="true"></i>',
					onChange: function() {
						gridView.setData(this.page.selectPage);
					}
				},
				columns: cols
			});
			return this;
		},

		setData: function(_pageNo) {
			var targetObj = this.target;
			var paramObj = {
				pageNo: _pageNo + 1,
				userId: jwt.userId
			};

			$.each($('#main_area [data-search]'), function(idx, elem) {
				paramObj[$(elem).data('search')] = elem.value;
			});

			postAjax("/admin/cm/cm25/selectExpendList", paramObj, null, function(data) {
				try {
					targetObj.setData({
						list: data.result || [],
						page: {
							currentPage: _pageNo,
							pageSize: data.paginationInfo.pageSize,
							totalElements: data.paginationInfo.totalRecordCount,
							totalPages: data.paginationInfo.totalPageCount
						}
					});
					gridHeightResize(gridView, 194);
				} catch (error) {
					alert("오류 발생!! 전산실 연락 바랍니다: " + error.message);
					return null;
				}
			});
		}
	};

	// 엑셀 그리드 객체
	var excelView = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				target: $('[data-ax5grid="excel-grid"]'),
				columns: defaultColumns
			});
			return this;
		}
	};

	// 문서 준비 이벤트
	$(document).ready(function() {
		mainDefaultLoad("기준관리", "지출결의서");
		setCommonSelect($("#main_area select[data-kind]"));

		// 검색조건 기본값 세팅
		$("#coCd_S").val(jwt.coCd);
		$("#expendDtFrom_S").val(moment().startOf("month").format("YYYY-MM-DD"));
		$("#expendDtTo_S").val(moment().endOf("month").format("YYYY-MM-DD"));

		// 달력 데이트피커 바인딩
		$("#expendDtFrom_S, #expendDtTo_S").datepicker({
			format: "yyyy-mm-dd",
			language: "ko",
			autoclose: true
		});

		// 그리드 초기화 및 초기 조회
		gridView.initView().setData(0);
		excelView.initView();

		// 검색조건 변경 이벤트
		$('[data-search]').on("change", function() {
			gridView.setData(0);
		});

		// 권한 체크
		authChk();
	});

	// 선택 행 반환
	function selectedRow() {
		var row = gridView.target.getList("selected")[0];
		if (!row) {
			alert("대상을 선택해 주세요.");
			return null;
		}
		return row;
	}

	// 검색조건 초기화
	function initSearch() {
		$("#coCd_S").val(jwt.coCd);
		$("#pmntDiv_S, #expendSts_S").val("");
		$("#reqId_S, #reqNm_S").val("");
		$("#expendDtFrom_S").val(moment().startOf("month").format("YYYY-MM-DD"));
		$("#expendDtTo_S").val(moment().endOf("month").format("YYYY-MM-DD"));
		gridView.setData(0);
	}

	// 지출결의서 등록/수정 모달 오픈
	function openExpendModal(type) {
		var row = null;
		if (type === "U") {
			row = selectedRow();
			if (!row) return;
		}

		var paramObj = {
			actionType: type,
			coCd: row ? row.coCd : jwt.coCd,
			expendNo: row ? row.expendNo : ""
		};

		openModal("/static/html/admin/cm/cm25/CM2501P01.html", 1100, 850, "", paramObj, function() {
			gridView.setData(0);
		});
	}

	// 지출결의서 삭제
	function deleteExpend() {
		var row = selectedRow();
		if (!row) return;

		if (row.reqId !== jwt.userId) {
			alert("발의자만 삭제할 수 있습니다.");
			return;
		}

		if (!confirm("삭제하시겠습니까?")) {
			return;
		}

		var paramObj = {
			coCd: row.coCd,
			expendNo: row.expendNo,
			userId: jwt.userId
		};

		postAjax("/admin/cm/cm25/deleteExpend", paramObj, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode === 200) {
				gridView.setData(0);
			}
		});
	}

	// 지출결의서 출력
	function printExpend() {
		var row = selectedRow();
		if (!row) return;

		var arg = "coCd#" + row.coCd + "#expendNo#" + row.expendNo + "#";
		callReport("CM2501R01.jrf", arg, 1150, 720, "지출결의서");
	}

	// 발의자 검색 팝업
	function openReqUserSearch() {
		var paramObj = {
			coCd: $("#coCd_S").val() || jwt.coCd,
			useYn: "Y"
		};

		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "발의자 검색", paramObj, function(tree) {
			var row = tree.target.getList("selected")[0];
			if (!row) return;
			$("#reqId_S").val(row.id);
			$("#reqNm_S").val(row.name);
			gridView.setData(0);
		});
	}

	// 엑셀 다운로드
	function excelDown() {
		var paramObj = {
			pageNo: 1,
			recordCnt: 9999999
		};

		$.each($('#main_area [data-search]'), function(idx, elem) {
			paramObj[$(elem).data('search')] = elem.value;
		});

		postAjax("/admin/cm/cm25/selectExpendList", paramObj, null, function(data) {
			excelView.target.setData(data.result || []);
			excelView.target.exportExcel("지출결의서목록_" + moment().format("YYYYMMDDHHmmss") + ".xls");
		});
	}

	// 그리드 컬럼 설정 팝업
	function openGridColumnEdit() {
		GridColumnConfig.openEditor("CM2501M01", "first-grid", defaultColumns, function() {
			if (gridView.target) {
				var cols = GridColumnConfig.apply("CM2501M01", "first-grid", defaultColumns);
				gridView.target.config.columns = cols;
				gridView.target.rePlot();
			}
		});
	}
</script>
