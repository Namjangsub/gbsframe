<div class="popup_area of_a" style="width: 100%; height: 100%;">
	<!-- 타이틀 -->
	<div class="tit_contents">
		<h4 class="tit">지출결의서 등록</h4>
	</div>

	<!-- 입력 폼 -->
	<div class="popup_table">
		<form id="popForm" onSubmit="return false;">
			<input type="hidden" id="actionType" name="actionType">
			<input type="hidden" id="pgmId" name="pgmId" value="CM2501P01">
			<input type="hidden" id="userId" name="userId">
			<input type="hidden" id="expendSts" name="expendSts">
			<input type="hidden" id="fileTrgtKey" name="fileTrgtKey">
			<input type="hidden" id="payDueDt" name="payDueDt">
			<input type="hidden" id="reqDeptId" name="reqDeptId">
			<input type="hidden" id="reqId" name="reqId">
			<input type="hidden" id="payClntCd" name="payClntCd">
			<input type="hidden" id="pmntDiv" name="pmntDiv">

			<table class="popup_table">
				<colgroup>
					<col width="15%">
					<col width="35%">
					<col width="15%">
					<col width="35%">
				</colgroup>
				<tr>
					<th class="hit">회사</th>
					<td>
						<select id="coCd" name="coCd" data-kind="CO" required msg="회사"></select>
					</td>
					<th>지출결의번호</th>
					<td>
						<input type="text" id="expendNo" name="expendNo" readonly style="background-color: #e6e6e6 !important;">
					</td>
				</tr>
				<tr>
					<th class="hit">결의일</th>
					<td>
						<input type="text" id="expendDt" name="expendDt" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" required msg="결의일">
					</td>
					<th class="hit">발의자</th>
					<td>
						<div class="search_form">
							<input type="text" id="reqNm" name="reqNm" readonly required msg="발의자">
							<a onclick="openReqUserSearch();"><i class="i_search_w"></i></a>
						</div>
					</td>
				</tr>
				<tr>
					<th class="hit">지급처</th>
					<td>
						<div class="search_form">
							<input type="text" id="payClntNm" name="payClntNm" readonly required msg="지급처">
							<a onclick="openPayClntSearch();"><i class="i_search_w"></i></a>
						</div>
					</td>
					<th class="hit">지급방법</th>
					<td>
						<div id="pmntDivArea" style="display: flex; align-items: center; flex-wrap: nowrap; gap: 4px 12px; text-align: left; white-space: nowrap;"></div>
					</td>
				</tr>
				<tr>
					<th class="hit">지급기한</th>
					<td>
						<div style="display: flex; gap: 4px;">
							<select id="payDueDiv" name="payDueDiv" onchange="changePayDueDiv();" required msg="지급기한" style="width: 50%;">
								<option value="REGULAR">정기결제</option>
								<option value="OTHER">기타</option>
							</select>
							<select id="payDueDay" style="width: 50%;">
								<option value="10">10일</option>
								<option value="25">25일</option>
							</select>
							<input type="text" id="payDueDtOther" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" style="display: none; width: 50%;">
						</div>
					</td>
					<th class="hit">지급금액</th>
					<td>
						<input type="text" id="payAmt" name="payAmt" comma onkeyup="onlyNumber(this);" required msg="지급금액" style="text-align: right;">
					</td>
				</tr>
				<tr>
					<th class="hit">통화종류</th>
					<td>
						<select id="currCd" name="currCd" data-kind="CURR" required msg="통화종류">
							<option value="">선택</option>
						</select>
					</td>
					<th class="hit">부가세</th>
					<td>
						<select id="vatYn" name="vatYn" required msg="부가세">
							<option value="Y">포함</option>
							<option value="N">별도</option>
						</select>
					</td>
				</tr>
				<tr>
					<th>원가정보</th>
					<td colspan="3">
						<input type="text" id="costInfo" name="costInfo" maxlength="200" placeholder="고객사 / 프로젝트 / 설비명">
					</td>
				</tr>
				<tr>
					<th class="hit">내용</th>
					<td colspan="3">
						<textarea id="expendContents" name="expendContents" maxlength="4000" required msg="내용" style="height: 165px; overflow-y: auto;"></textarea>
					</td>
				</tr>
				<tr>
					<th class="hit">첨부서류 유형</th>
					<td colspan="3">
						<div style="display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 4px 0;">
							<label style="margin-bottom: 0; cursor: pointer;"><input type="checkbox" name="atchDocDiv" value="CARD"> 법인카드 결제 - 신용카드 결제 영수증</label>
							<label style="margin-bottom: 0; cursor: pointer;"><input type="checkbox" name="atchDocDiv" value="TRNS"> 송금 결제 - 세금계산서 또는 현금영수증</label>
							<label style="margin-bottom: 0; cursor: pointer;"><input type="checkbox" name="atchDocDiv" value="CASH"> 현금 결제(개인카드 포함) - 결제 영수증</label>
							<div style="display: flex; align-items: center; gap: 8px;">
								<label style="margin-bottom: 0; cursor: pointer;"><input type="checkbox" id="atchDocDivEtc" name="atchDocDiv" value="ETC" onchange="toggleAtchDocEtc();"> 기타</label>
								<input type="text" id="atchDocEtc" name="atchDocEtc" maxlength="500" disabled msg="기타 첨부서류" style="width: 70%;">
							</div>
						</div>
					</td>
				</tr>
			</table>

			<!-- 결재선 영역 -->
			<div id="approvalAreaWrap" style="display: flex; justify-content: space-between; margin-top: 12px; width: 100%;">
				<!-- 발의부서 결재 및 공유 -->
				<div style="width: 49.5%;">
					<div style="font-weight: bold; text-align: left; margin-bottom: 5px;">
						발의부서 결재 및 공유
						<span class="add_btn_small">
							<a onclick="addApprovalUser(1);" authchk>+</a>
							<a onclick="deleteApprovalUser(1);" authchk>-</a>
						</span>
					</div>
					<div data-ax5grid="first-grid-modal" data-ax5grid-config="{}" style="height: 140px; width: 100%;"></div>
				</div>

				<!-- 관리부서 결재 및 공유 -->
				<div style="width: 49.5%;">
					<div style="font-weight: bold; text-align: left; margin-bottom: 5px;">
						관리부서 결재 및 공유
						<span class="add_btn_small">
							<a onclick="addApprovalUser(2);" authchk>+</a>
							<a onclick="deleteApprovalUser(2);" authchk>-</a>
						</span>
					</div>
					<div data-ax5grid="second-grid-modal" data-ax5grid-config="{}" style="height: 140px; width: 100%;"></div>
				</div>
			</div>
		</form>
	</div>

	<!-- 공통 첨부파일 영역 -->
	<div id="fileList_area" style="margin-top: 10px; margin-bottom: 20px;"></div>

	<!-- 하단 버튼 영역 -->
	<div class="popup_bottom_btn">
		<button type="button" id="actionBtn" authchk>등록</button>
		<button type="button" class="close_btn" onclick="modalStack.close();">닫기</button>
		<button type="button" id="reportBtn" class="report_btn" style="display: none;" onclick="printExpend();">지출결의서출력</button>
	</div>
</div>

<script src="/static/js/jquery.blockUI.js"></script>
<script src="/static/js/fileTree.js"></script>
<script src="/static/js/commApproval.js"></script>

<script type="text/javascript">
	var actionType = "";
	var expendNo = "";
	var fileParam = {};
	var saving = false;

	// 결재선 그리드 공통 컬럼 설정
	var approvalColumns = [
		{key: "gb",          label: "구분",     align: "center", width: 50},
		{key: "sanctnSn",    label: "순번",     align: "center", width: 45},
		{key: "usrNm",       label: "ID",       hidden: true},
		{key: "name",        label: "성명",     align: "center", width: 75},
		{key: "jik",         label: "직위",     align: "center", width: 65},
		{key: "todoCfDt",    label: "확인일자", align: "center", width: 85},
		{key: "todoCfOpn",   label: "확인의견", align: "left",   width: "*"},
		{key: "sanctnSttus", label: "상태",     hidden: true}
	];

	// 발의부서 결재 그리드
	var gridViewPop = {
		target: null,
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				target: $('[data-ax5grid="first-grid-modal"]'),
				showRowSelector: true,
				multipleSelect: false,
				sortable: false,
				header: {
					align: "center"
				},
				body: {
					onClick: function() {
						this.self.select(this.dindex);
					}
				},
				columns: approvalColumns
			});
			return this;
		},
		setData2: function(list) {
			this.target.setData(list || []);
			this.target.align();
		}
	};

	// 관리부서 결재 그리드
	var gridViewPop2 = {
		target: null,
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				target: $('[data-ax5grid="second-grid-modal"]'),
				showRowSelector: true,
				multipleSelect: false,
				sortable: false,
				header: {
					align: "center"
				},
				body: {
					onClick: function() {
						this.self.select(this.dindex);
					}
				},
				columns: approvalColumns
			});
			return this;
		},
		setData2: function(list) {
			this.target.setData(list || []);
			this.target.align();
		}
	};

	// 문서 준비 이벤트
	$(document).ready(function() {
		setCommonSelect($(".popup_area select[data-kind]"));
		loadPmntDivCheckboxes();

		actionType = modalStack.last().paramObj.actionType;
		expendNo = modalStack.last().paramObj.expendNo || "";

		$("#actionType").val(actionType);
		$("#userId").val(jwt.userId);
		$("#coCd").val(modalStack.last().paramObj.coCd || jwt.coCd);

		// 달력 데이트피커 초기화
		$("#expendDt, #payDueDtOther").datepicker({
			format: "yyyy-mm-dd",
			language: "ko",
			autoclose: true
		});

		// 결재선 그리드 초기화
		gridViewPop.initView();
		gridViewPop2.initView();

		// 첨부파일 트리 모듈 초기화
		fileParam = {
			fileTrgtTyp: "CM2501P01",
			fileTrgtKey: expendNo || "0",
			todoNo: expendNo || "0"
		};
		treeModule.initAll("deptTreeOrdars", "file-grid", "FILETREE", fileParam, "fileList_area");

		// 등록 / 수정 모드 분기
		if (actionType === "C") {
			initCreate();
			$("#actionBtn").text("등록").on("click", saveExpend);
		} else {
			$('.tit').text('지출결의서 수정')
			selectExpendInfo();
			$("#actionBtn").text("수정").on("click", saveExpend);
			$("#reportBtn").show();
			if (actionType === "S" || actionType === "T") {
				setReadOnly();
			}
		}

		// 권한 체크
		authChk();
	});

	// 신규 등록 초기화
	function initCreate() {
		var today = moment().format("YYYY-MM-DD");
		$("#expendDt, #payDueDtOther").val(today);
		$("#currCd").val("CURR01");
		$("#vatYn").val("Y");
		$("#payDueDiv").val("REGULAR");
		$("#payDueDay").val("10");
		$("#expendContents").val("■ 제목: \n■ 내용: ");

		// 기안자 기본 정보 조회 및 바인딩
		postAjaxSync("/admin/cm/cm06/selectUserInfo", {userId: jwt.userId}, null, function(data) {
			var u = data.userInfo;
			if (!u) return;
			$("#reqId").val(u.id);
			$("#reqNm").val(u.name);
			$("#reqDeptId").val(u.deptId);
		});

		// 기본 결재선 설정
		gridViewPop.setData2(makeDefaultApprovalLine());
		setDefaultMngApprovalLine();
	}

	// 상세 정보 조회
	function selectExpendInfo() {
		var paramObj = {
			coCd: $("#coCd").val(),
			expendNo: expendNo
		};

		postAjaxSync("/admin/cm/cm25/selectExpendInfo", paramObj, null, function(data) {
			var r = data.result;
			if (!r) {
				alert("자료가 존재하지 않습니다.");
				modalStack.close();
				return;
			}

			$.each(r, function(key, val) {
				if ($("#" + key).length) {
					$("#" + key).val(val);
				}
			});

			$("#fileTrgtKey").val(r.expendNo);
			$("#payAmt").val(r.payAmt);
			onlyNumber($("#payAmt")[0]);
			setPmntDivCheckboxes(r.pmntDiv);

			// 첨부서류 유형 체크박스 복원
			$('input[name="atchDocDiv"]').prop("checked", false);
			$.each((r.atchDocDiv || "").split(","), function(i, v) {
				$('input[name="atchDocDiv"][value="' + $.trim(v) + '"]').prop("checked", true);
			});
			toggleAtchDocEtc();

			// 지급기한 구분 복원
			if (r.payDueDiv === "REGULAR") {
				$("#payDueDay").val(r.payDueDt);
			} else {
				$("#payDueDtOther").val(r.payDueDt);
			}
			changePayDueDiv();

			// 결재상태가 미결재가 아닌 경우 읽기 전용 처리
			if (r.expendSts !== "expendSts01") {
				setReadOnly();
				$('.tit').text('지출결의서 조회')
			}
		});

		// 결재선 목록 조회
		loadApprovalLines();
	}

	// 결재선 목록 로드
	function loadApprovalLines() {
		var paramObj = {
			fileTrgtKey: expendNo,
			reqNo: expendNo,
			pageNo: 1
		};

		postAjax("/user/wb/wb20/selectSignResUserlst", paramObj, null, function(data) {
			var first = [];
			var second = [];
			var list = data.resultList || data.result || [];

			$.each(list, function(i, r) {
				if (r.todoDiv2CodeId === "TODODIV1202" || r.todoDiv2CodeId === "TODODIV2202") {
					first.push(r);
				}
				if (r.todoDiv2CodeId === "TODODIV1203" || r.todoDiv2CodeId === "TODODIV2204") {
					second.push(r);
				}
			});

			gridViewPop.setData2(first);
			gridViewPop2.setData2(second);
		});
	}

	// 읽기 전용 모드 전환
	function setReadOnly() {
		$("#actionBtn").hide();

		// 결재가 시작된 자료는 입력만 막고, 내용란의 스크롤과 텍스트 확인은 허용한다.
		$("#popForm input, #popForm textarea")
			.prop("readonly", true)
			.css("background-color", "#e6e6e6");

		$("#popForm input, #popForm textarea")
			.not("#expendContents")
			.css("pointer-events", "none");

		$("#expendContents").css({
			"pointer-events": "auto",
			"overflow-y": "auto",
			"cursor": "default"
		});

		$("#popForm select").css({
			"background-color": "#e6e6e6",
			"pointer-events": "none"
		});

		$("#popForm input[type='checkbox'], #popForm input[type='radio']")
			.css("pointer-events", "auto")
			.off("click.cm25ReadOnly")
			.on("click.cm25ReadOnly", function(e) {
				e.preventDefault();
			});

		$("#popForm .search_form a").css("pointer-events", "none");
		$(".popup_area .add_btn_small").hide();
	}

	// 지급기한 구분 변경 이벤트
	function changePayDueDiv() {
		var isOther = ($("#payDueDiv").val() === "OTHER");
		$("#payDueDay").toggle(!isOther);
		$("#payDueDtOther").toggle(isOther);
	}

	// 지급방법 공통코드를 복수 선택 체크박스로 구성
	function loadPmntDivCheckboxes() {
		postAjaxSync("/admin/cm/cm05/selectChildCodeList", {codeKind: "PMNTDIV"}, null, function(data) {
			var html = "";
			$.each(data.childCodeList || [], function(i, item) {
				html += '<label style="margin-bottom: 0; cursor: pointer;">'
					+ '<input type="checkbox" name="pmntDivChk" value="' + item.codeId + '"> '
					+ item.codeNm
					+ '</label>';
			});
			$("#pmntDivArea").html(html);
		});
	}

	// 저장된 지급방법 코드를 수정 화면에 복원
	function setPmntDivCheckboxes(value) {
		var selected = (value || "").split(",");
		$('input[name="pmntDivChk"]').prop("checked", false);
		$.each(selected, function(i, code) {
			$('input[name="pmntDivChk"][value="' + $.trim(code) + '"]').prop("checked", true);
		});
	}

	// 기타 첨부서류 활성화 토글
	function toggleAtchDocEtc() {
		var isChecked = $("#atchDocDivEtc").is(":checked");
		$("#atchDocEtc")
			.prop("disabled", !isChecked)
			.prop("required", isChecked);
		if (!isChecked) {
			$("#atchDocEtc").val("");
		}
	}

	// 발의자 검색 팝업
	function openReqUserSearch() {
		var paramObj = {
			coCd: $("#coCd").val(),
			useYn: "Y"
		};

		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "발의자 검색", paramObj, function(tree) {
			var r = tree.target.getList("selected")[0];
			if (!r) return;

			postAjaxSync("/admin/cm/cm06/selectUserInfo", {userId: r.id}, null, function(data) {
				var u = data.userInfo;
				if (!u) return;
				$("#reqId").val(u.id);
				$("#reqNm").val(u.name);
				$("#reqDeptId").val(u.deptId);
			});

			gridViewPop.setData2(makeDefaultApprovalLine());
		});
	}

	// 지급거래처 검색 팝업
	function openPayClntSearch() {
		var paramObj = {
			coCd: $("#coCd").val()
		};

		openSecondModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "지급거래처 검색", paramObj, function(grid) {
			var target = grid && (grid.target || grid);
			var r = target && typeof target.getList === "function"
				? target.getList("selected")[0]
				: (grid && grid.clntCd ? grid : null);
			if (!r) return;
			$("#payClntCd").val(r.clntCd);
			$("#payClntNm").val(r.clntNm);
		});
	}

	// 기본 발의부서 결재선 생성 (기안자 본인 + 소속 팀장)
	function makeDefaultApprovalLine(selected) {
		var rows = [];
		var today = moment().format("YYYY-MM-DD");
		var u = null;

		if (selected) {
			u = {
				id: selected.id,
				name: selected.name,
				empNo: selected.empNo,
				levelNm: selected.levelNm || selected.jik,
				deptNm: selected.deptNm,
				coCd: selected.coCd
			};
		} else {
			postAjaxSync("/admin/cm/cm06/selectUserInfo", {userId: $("#reqId").val() || jwt.userId}, null, function(d) {
				u = d.userInfo;
			});
		}

		if (u) {
			rows.push({
				gb: "결재",
				sanctnSn: 1,
				usrNm: u.id,
				empNo: u.empNo || u.id,
				name: u.name,
				jik: u.levelNm || "",
				dtNm: u.deptNm || "",
				coCd: u.coCd || $("#coCd").val(),
				creatDttm: today
			});
		}

		postAjaxSync("/user/wb/wb24/selectTeamManagerInfo", {userId: $("#reqId").val() || jwt.userId}, null, function(d) {
			var m = d.result;
			if (m && m.id && (!u || m.id !== u.id)) {
				rows.push({
					gb: "결재",
					sanctnSn: rows.length + 1,
					usrNm: m.id,
					empNo: m.empNo || m.id,
					name: m.name,
					jik: m.levelNm || "",
					dtNm: m.deptNm || "",
					coCd: m.coCd || $("#coCd").val(),
					creatDttm: today
				});
			}
		});

		return rows;
	}

	// 기본 관리부서 결재선 설정 (공통코드 SPECRTS14 기준)
	function setDefaultMngApprovalLine() {
		var ids = [];
		postAjaxSync("/admin/cm/cm05/selectChildCodeList", {codeId: "SPECRTS14"}, null, function(data) {
			var list = data.childCodeList || data.resultList || data.result || [];
			$.each(list, function(i, x) {
				if (x.codeEtc) {
					ids = ids.concat(x.codeEtc.replace(/\s/g, "").split(","));
				}
			});
		});

		var rows = [];
		$.each(ids, function(i, id) {
			if (!id) return;
			postAjaxSync("/admin/cm/cm06/selectUserInfo", {userId: id}, null, function(data) {
				var u = data.userInfo;
				if (u) {
					rows.push({
						gb: "결재",
						sanctnSn: rows.length + 1,
						usrNm: u.id,
						empNo: u.empNo || u.id,
						name: u.name,
						jik: u.levelNm || "",
						dtNm: u.deptNm || "",
						telNo: u.telNo || "",
						email: u.email || "",
						coCd: u.coCd || $("#coCd").val(),
						sanctnSttus: "N"
					});
				}
			});
		});

		gridViewPop2.setData2(rows);
	}

	// 결재자/공유자 추가 팝업 오픈
	function addApprovalUser(which) {
		var holder = (which === 1) ? gridViewPop : gridViewPop2;
		var list = holder.target.getList() || [];

		var paramObj = {
			coCd: $("#coCd").val(),
			useYn: "Y",
			userId: jwt.userId,
			userNm: jwt.userNm,
			approvalGrid: $.grep(list, function(x) { return x.gb === "결재"; }).map(userModalRow),
			shareGrid: $.grep(list, function(x) { return x.gb === "공유"; }).map(userModalRow)
		};

		openSecondModal("/static/html/cmn/modal/userLstSearch.html", 900, 500, "결재 및 공유 대상자 검색", paramObj, function(app, share) {
			var rows = [];
			$.each(app.target.list || [], function(i, x) {
				rows.push(fromUserModal(x, "결재", rows.length + 1));
			});
			$.each(share.target.list || [], function(i, x) {
				rows.push(fromUserModal(x, "공유", i + 1));
			});
			holder.setData2(rows);
		});
	}

	function userModalRow(x) {
		return {
			gb: x.gb,
			id: x.usrNm,
			text: x.name,
			parent: x.jik,
			deptNm: x.dtNm,
			telNo: x.telNo,
			email: x.email
		};
	}

	function fromUserModal(x, gb, sn) {
		return {
			gb: gb,
			sanctnSn: sn,
			usrNm: x.id,
			name: x.text,
			jik: x.parent,
			dtNm: x.deptNm,
			telNo: x.telNo,
			email: x.email,
			coCd: $("#coCd").val(),
			creatDttm: moment().format("YYYY-MM-DD")
		};
	}

	// 결재자/공유자 행 삭제
	function deleteApprovalUser(which) {
		var holder = (which === 1) ? gridViewPop : gridViewPop2;
		var idx = holder.target.selectedDataIndexs;
		if (!idx || !idx.length) {
			alert("삭제할 행을 선택해 주세요.");
			return;
		}
		holder.target.removeRow(idx[0]);
	}

	// 저장용 FormData 생성 및 유효성 검증
	function makeFormData() {
		var pmntDivs = [];
		$('input[name="pmntDivChk"]:checked').each(function() {
			pmntDivs.push(this.value);
		});
		if (!pmntDivs.length) {
			alert("지급방법을 하나 이상 선택해 주세요.");
			return false;
		}
		$("#pmntDiv").val(pmntDivs.join(","));

		if (!inputValidation($(".popup_area [required]"))) {
			return false;
		}

		var firstRows = gridViewPop.target.getList() || [];
		var firstApproval = $.grep(firstRows, function(x) { return x.gb === "결재"; });
		if (!firstApproval.length) {
			alert("발의부서 결재자를 한 명 이상 등록해 주세요.");
			return false;
		}

		var docs = [];
		$('input[name="atchDocDiv"]:checked').each(function() {
			docs.push(this.value);
		});
		if (!docs.length) {
			alert("첨부서류 유형을 하나 이상 선택해 주세요.");
			return false;
		}
		var dt = "";
		if ($("#payDueDiv").val() === "REGULAR") {
			dt = $("#payDueDay").val();
		} else {
			dt = $("#payDueDtOther").val();
		}
		if (!dt) {
			alert("지급기한일자를 입력해 주세요.");
			return false;
		}
		$("#payDueDt").val(dt);

		deleteComma($("#payAmt")[0]);

		var fd = new FormData($("#popForm")[0]);
		fd.set("atchDocDiv", docs.join(","));
		fd.set("atchDocEtc", $("#atchDocDivEtc").is(":checked") ? $.trim($("#atchDocEtc").val()) : "");

		// 결재선 데이터 추가
		appendApproval(fd, firstRows, "rowSharngListArr", "rowApprovalListArr");
		appendApproval(fd, gridViewPop2.target.getList() || [], "rowSharngListArr2", "rowApprovalListArr2");

		// 첨부파일 데이터 추가
		var arr = [];
		$.each(treeModule.getFileArr() || [], function(i, o) {
			if (o.fileKey == 0) {
				fd.append("files", o.file);
				var c = $.extend({}, o);
				c.file = "";
				arr.push(c);
			}
		});
		fd.append("uploadFileArr", JSON.stringify(arr));

		var del = [];
		$.each(treeModule.getDeleteFileArr() || [], function(i, x) {
			del.push(typeof x === "object" ? x : {fileKey: String(x)});
		});
		fd.append("deleteFileArr", JSON.stringify(del));

		fd.set("comonCd", treeModule.getFileNodeId());
		fd.set("userId", jwt.userId);
		fd.set("pgmId", "CM2501P01");

		return fd;
	}

	// 결재 및 공유 리스트 분리 추가
	function appendApproval(fd, list, shareKey, approvalKey) {
		var s = [];
		var a = [];
		$.each(list, function(i, x) {
			var r = $.extend({}, x);
			r.todoId = r.usrNm;
			if (r.gb === "공유") {
				s.push(r);
			} else {
				a.push(r);
			}
		});
		fd.set(shareKey, JSON.stringify(s));
		fd.set(approvalKey, JSON.stringify(a));
	}

	// 지출결의서 저장 처리
	function saveExpend() {
		if (saving) return;

		var fd = makeFormData();
		if (!fd) return;

		saving = true;
		$.blockUI({message: "<h4>저장 중입니다.</h4>"});

		var url = (actionType === "C") ? "/admin/cm/cm25/insertExpend" : "/admin/cm/cm25/updateExpend";

		filePostAjax(url, fd, function(data) {
			alert(data.resultMessage);
			if (data.resultCode === 200) {
				modalStack.last().callback("1");
				modalStack.close();
			}
			saving = false;
			$.unblockUI();
		});
	}

	// 지출결의서 출력
	function printExpend() {
		var no = $("#expendNo").val();
		var arg = "coCd#" + $("#coCd").val() + "#expendNo#" + no + "#";
		callReport("CM2501R01.jrf", arg, 1150, 720, "지출결의서");
	}
</script>
