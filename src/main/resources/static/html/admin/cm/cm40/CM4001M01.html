<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.6, user-scalable=no">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5toast.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5calendar.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5picker.css" />
	<link rel="stylesheet" href="/static/css/jstree/style.min.css" />
	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />
	<link rel="stylesheet" href="/static/css/common.css" />

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/ax5/ax5toast.min.js"></script>
	<script src="/static/js/ax5/ax5calendar.min.js"></script>
	<script src="/static/js/ax5/ax5picker.min.js"></script>
	<script src="/static/js/jstree/jstree.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/manualPopup.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">
		<!-- 페이지 상단 버튼 -->
		<div class="contents no_bg">
			<ul class="btn_ul">
				<li class="btn_r">
					<a onclick="manualPopup('CM4001M01');"><button type="button" class="bg_gray">도움말</button></a>
					<a onclick="initSearch();"><button type="button" class="bg_gray">초기화</button></a>
					<a onclick="DataSearch();"><button type="button" class="bg_gray">검 색</button></a>
				</li>
			</ul>
		</div>

		<!-- 검색 콘텐츠 -->
		<div class="contents search">
			<input type="hidden" id="pgmId" name="pgmId" value="CM4001M01">
			<div class="">
				<table class="table_input type05">
					<colgroup>
						<col width="6%">
						<col width="12%">
						<col width="5%">
						<col width="10%">
						<col width="6%">
						<col width="20%">
						<col width="6%">
						<col width="15%">
						<col width="6%">
						<col width="14%">
					</colgroup>
					<tr>
						<th>공유폴더</th>
						<td>
							<input type="text" id="shareName_S" name="shareName_S" data-search="shareName" autocomplete="off"
								onkeyup="event.keyCode == 13 ? DataSearch() : '';">
						</td>
						<th>구분</th>
						<td>
							<select id="entryKind_S" name="entryKind_S" data-search="entryKind" onchange="gridView.applyFilter();">
								<option value="">전체</option>
								<option value="FILE" selected>파일만</option>
								<option value="DIR">폴더만</option>
							</select>
						</td>
						<th>파일명</th>
						<td>
							<input type="text" id="fileName_S" name="fileName_S" data-search="fileName" autocomplete="off"
								onkeyup="event.keyCode == 13 ? DataSearch() : '';">
						</td>
						<th>사용자</th>
						<td>
							<input type="text" id="clientUserName_S" name="clientUserName_S" data-search="clientUserName" autocomplete="off"
								onkeyup="event.keyCode == 13 ? DataSearch() : '';">
						</td>
						<th>접속PC</th>
						<td>
							<input type="text" id="clientComputerName_S" name="clientComputerName_S" data-search="clientComputerName" autocomplete="off"
								onkeyup="event.keyCode == 13 ? DataSearch() : '';">
						</td>
					</tr>
				</table>
			</div>
		</div>
		<!-- 검색 콘텐츠 END -->

		<!-- 콘텐츠 -->
		<div class="contents no_bg">
			<!-- 콘텐츠 타이틀 -->
			<div class="contents_tit">
				<span style="height: 30px; line-height: 30px; font-size: 15px;">열린 파일 목록</span>
				<span id="cm4001Status" class="label label-default" style="margin-left: 10px; font-size: 12px;">조회 중...</span>
				<label style="font-weight: normal; margin: 0; cursor: pointer;">
					<input type="checkbox" id="autoRefresh_S" name="autoRefresh_S" checked onchange="toggleAutoRefresh();"> 자동 갱신(5초)
				</label>
				<div style="float: right; height: 30px; line-height: 30px;">
					<a id="btnCloseHandle" class="btn btn-default btn-sm" style="margin-left: 10px; display: none;" onclick="closeHandleOpen();"><i class="fas fa-unlock"></i> 점유해제</a>
					<a id="btnTreeToggle" class="btn btn-default btn-sm" style="margin-left: 10px;" onclick="toggleViewMode();"><i class="fas fa-list"></i> 목록보기</a>
				</div>
			</div>
		</div>

		<!-- 콘텐츠: 목록 그리드 -->
		<div class="contents" id="flatGridWrap" style="display: none;">
			<div class="ax5_grid" style="width: 100%">
				<div data-ax5grid="first-grid" data-ax5grid-config="{}" style="height: 100%; width: 100%; min-height: 400px;"></div>
			</div>
		</div>

		<!-- 콘텐츠: 트리 그리드 (트리보기 시 표시) -->
		<div class="contents" id="treeGridWrap">
			<div class="ax5_grid" style="width: 100%">
				<div data-ax5grid="tree-grid" data-ax5grid-config="{}" style="height: 100%; width: 100%; min-height: 400px;"></div>
			</div>
		</div>
	</div>

	<!-- 점유해제 모달 (#main_area 밖, body 마지막 - applyFilter 검색조건 범위와 분리) -->
	<div class="modal fade" id="closeModal" tabindex="-1" role="dialog" aria-labelledby="closeModalTitle" aria-hidden="true">
		<div class="modal-dialog" role="document">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
					<h4 class="modal-title" id="closeModalTitle"><i class="fas fa-unlock"></i> 파일 점유해제</h4>
				</div>
				<div class="modal-body">
					<p style="margin-bottom: 4px;">대상 파일 : <strong id="closeModalFileName">-</strong></p>
					<p style="margin-bottom: 10px; word-break: break-all;">상대경로 : <span id="closeModalPath">-</span></p>
					<table class="table table-bordered" style="margin-bottom: 10px;">
						<thead>
							<tr>
								<th style="width: 50px; text-align: center;">선택</th>
								<th>사용자</th>
								<th>접속PC</th>
							</tr>
						</thead>
						<tbody id="closeModalHandleBody"></tbody>
					</table>
					<div class="alert alert-warning" style="margin-bottom: 10px;">
						강제 종료하면 사용자가 저장하지 않은 작업이 손실되거나 파일이 손상될 수 있습니다.
					</div>
					<div class="form-group" style="margin-bottom: 0;">
						<label for="closeReason">사유 <span style="color: red;">*</span></label>
						<textarea id="closeReason" name="closeReason" class="form-control" rows="3" maxlength="200" placeholder="점유해제 사유를 입력하십시오. (최대 200자)"></textarea>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-danger" id="btnCloseHandleConfirm" onclick="closeHandleConfirm();"><i class="fas fa-unlock"></i> 점유해제</button>
					<button type="button" class="btn btn-default" data-dismiss="modal">취소</button>
				</div>
			</div>
		</div>
	</div>
</body>
</html>

<script type="text/javascript">

	var POLL_MS = 5000;
	var pollTimer = null;
	var inFlight = false;
	var lastFiles = [];
	var hScrollFixed = false;
	var treeHScrollFixed = false;
	var viewMode = 'tree';        // 'tree'(기본) | 'list'
	var treeCollapse = {};        // 트리 노드별 접힘 상태 보존 (자동 갱신 시 유지)
	var UNKNOWN_SHARE = '(공유폴더 미확인)';
	var closeHandleState = null;  // 점유해제 모달이 열릴 때의 선택 정보 스냅샷 (자동 갱신 재렌더와 분리)

	// HTML 이스케이프 (그리드 formatter 는 HTML 로 렌더링됨)
	function esc(v) {
		return String(v == null ? '' : v)
			.replace(/&/g, '&amp;')
			.replace(/</g, '&lt;')
			.replace(/>/g, '&gt;')
			.replace(/"/g, '&quot;')
			.replace(/'/g, '&#39;');
	}

	// 서버 UTC 수집시각(ISO) -> 로컬 'YYYY-MM-DD HH:mm:ss'
	function fmtUtc(s) {
		if (!s) return '-';
		var m = moment(String(s).replace(/\.\d+/, ''));
		return m.isValid() ? m.format('YYYY-MM-DD HH:mm:ss') : String(s);
	}

	// 상태 배지 표시
	function setStatus(kind, text) {
		$('#cm4001Status')
			.removeClass('label-default label-success label-warning label-danger')
			.addClass('label-' + kind)
			.text(text);
	}

	// 동적 반응형 그리드 높이 조절 함수 (보이는 그리드만 대상)
	function adjustGridHeight() {
		var winHeight = $(window).height();
		var isIframe = (window.self !== window.top);
		if (isIframe) {
			try {
				if (window.top.innerHeight) winHeight = window.top.innerHeight;
			} catch (e) {
				winHeight = $(window).height();
			}
		}

		var targets = [{sel: 'first-grid', view: gridView}];
		if (typeof treeView !== 'undefined') targets.push({sel: 'tree-grid', view: treeView});

		$.each(targets, function(_, t) {
			var $grid = $('[data-ax5grid="' + t.sel + '"]');
			if ($grid.length === 0 || !$grid.is(':visible')) return;

			var gridTop = $grid.offset().top || 200;
			var availableH = winHeight - gridTop - 20;
			if (availableH < 350) availableH = 350;
			$grid.css("height", availableH + "px");

			if (t.view && t.view.target && t.view.target.align) {
				t.view.target.align();
			}
		});
	}

	$(window).on("resize", function() {
		adjustGridHeight();
	});

	// 페이징 없는 그리드용 page 값 (docs/AX5-Grid.md §2)
	function noPage(count) {
		return {currentPage: 0, pageSize: count || 1, totalElements: count, totalPages: 1};
	}

	// ----------------------------------------------------------------
	// 목록 그리드
	// ----------------------------------------------------------------
	var gridView = {
		initView : function() {
			adjustGridHeight();

			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber : true,
				lineNumberColumnWidth : 40,
				showRowSelector : true,
				multipleSelect : false,
				sortable : true,
				target : $('[data-ax5grid="first-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						if (!this.item || this.item.isDirectory === true) {
							return false;
						}
						var selfGrid = gridView.target;
						var targetIndex = this.dindex;
						$.each(selfGrid.list || [], function(idx, obj) {
							if (obj && obj.__index !== targetIndex && obj.__selected__) {
								selfGrid.select(obj.__index, {selected: false});
							}
						});
						selfGrid.select(targetIndex, {selected: true});
					},
					onDataChanged : function() {
						if (this.key === '__selected__') {
							var selfGrid = gridView.target;
							if (this.item && this.item.__selected__) {
								if (this.item.isDirectory === true) {
									selfGrid.select(this.dindex, {selected: false});
									return;
								}
								var targetIndex = this.dindex;
								$.each(selfGrid.list || [], function(idx, obj) {
									if (obj && obj.__index !== targetIndex && obj.__selected__) {
										selfGrid.select(obj.__index, {selected: false});
									}
								});
							}
						}
					}
				},
				page : {
					display : false
				},
				columns : [
					 {key: "shareName",          label: "공유폴더",  width: 100, align: "left",
						formatter: function() {
							var v = this.value;
							return (v == null || String(v).trim() === '') ? '-' : esc(v);
						}}
					,{key: "entryKindNm",        label: "구분",      width: 70,  align: "center"}
					,{key: "fileName",           label: "파일명",    width: 360, align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "shareRelativePath",  label: "상대경로",  width: "*", align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "clientUserName",     label: "사용자",    width: 160, align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "clientComputerName", label: "접속PC",    width: 150, align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "collectedAt",        label: "수집시각",  width: 140, align: "center", formatter: function() { return esc(this.value); }}
				]
			});
			return this;
		},

		// 서버 조회 (스냅샷 전체를 받아 화면에서 검색조건으로 필터)
		setData : function() {
			if (inFlight) return;
			inFlight = true;
			stopTimer();

			postAjax("/admin/cm/cm40/selectFileOpenStatus", {}, null, function(data) {
				inFlight = false;

				// postAjax 는 HTTP 오류 시 xhr 객체를 callback 으로 넘긴다 (status 가 숫자)
				if (!data || typeof data.status === 'number') {
					setStatus('danger', '오류 · 조회 실패');
					scheduleNext();
					return;
				}

				var rows = data.files || [];
				var collectedAt = fmtUtc(data.collectedAtUtc);

				for (var i = 0; i < rows.length; i++) {
					rows[i].collectedAt = collectedAt;
					var rawRel = String(rows[i].shareRelativePath || '').replace(/\//g, '\\').trim();

					// 판정: 수집기가 실제 파일시스템(MFT/속성)에서 확인한 물리 속성 그대로 반영 (계층/확장자 임의 추정 금지)
					var isDir = (rows[i].isDirectory === true) || (rawRel === '');
					rows[i].isDirectory = isDir;
					rows[i].entryKind   = isDir ? 'DIR' : 'FILE';
					rows[i].entryKindNm = isDir ? '폴더' : '파일';
					// 파일인 경우에만 선택 및 점유해제 가능
					rows[i].__disable_selection__ = isDir;
				}
				lastFiles = rows;

				renderStatus(data, collectedAt);
				// 서버가 계산한 현재 사용자 권한에 따라 점유해제 버튼 표시 (기본 숨김)
				closeHandleApplyPermission(data.canClose === true);
				gridView.applyFilter();
				scheduleNext();
			}, false);   // 자동 갱신 조회이므로 blockUI 사용 안 함
		},

		// 검색조건 필터 후 현재 보기(목록/트리)에 반영
		applyFilter : function() {
			var conds = [];
			$('#main_area .contents.search [data-search]').each(function() {
				var val = $.trim($(this).val() || '').toLowerCase();
				if (val) conds.push({key: $(this).data('search'), val: val});
			});

			var list = [];
			for (var i = 0; i < lastFiles.length; i++) {
				var row = lastFiles[i] || {};
				var ok = true;
				for (var j = 0; j < conds.length; j++) {
					var cell = String(row[conds[j].key] == null ? '' : row[conds[j].key]).toLowerCase();
					if (cell.indexOf(conds[j].val) < 0) {
						ok = false;
						break;
					}
				}
				if (ok) list.push(row);
			}

			if (viewMode === 'tree') {
				// 검색 중에는 일치 항목이 보이도록 전체 펼침
				treeView.render(list, conds.length > 0);
				return;
			}

			if (!this.target) return;
			var keepKey = closeHandleSelectedKey(this, false);   // 자동 갱신 재렌더 전 선택 보존
			this.target.setData({
				list : list,
				page : noPage(list.length)
			});

			// AX5-Grid 최초 setData 시 우측 끝 스크롤 버그 대응 (docs/AX5-Grid.md §14)
			if (!hScrollFixed) {
				hScrollFixed = true;
				try {
					this.target.setConfig(this.target.config);
				} catch (e) {}
			}
			closeHandleRestoreSelect(this, false, keepKey);
		}
	};

	// ----------------------------------------------------------------
	// 트리 그리드 (공유폴더 > 폴더 > 열린 항목)
	// ----------------------------------------------------------------
	var treeView = {
		target : null,
		lastExpandAll : false,

		initView : function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber : false,
				showRowSelector : true,
				multipleSelect : true,
				sortable : false,      // 정렬하면 계층이 깨지므로 사용 안 함
				target : $('[data-ax5grid="tree-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						if (!this.item || this.item.closeType !== 'FILE') {
							// 파일이 아닌 폴더나 공유 루트는 점유해제 대상이 아니므로 선택 불가
							return false;
						}
						var selfGrid = treeView.target;
						var targetIndex = this.doindex;
						$.each(selfGrid.list || [], function(idx, obj) {
							if (obj && obj.__index !== targetIndex && obj.__selected__) {
								selfGrid.select(obj.__index, {selected: false});
							}
						});
						selfGrid.select(targetIndex, {selected: true});
					},
					onDataChanged : function() {
						if (this.key === '__selected__') {
							var selfGrid = treeView.target;
							if (this.item && this.item.__selected__) {
								// 폴더나 공유 루트가 체크된 경우 즉시 해제
								if (this.item.closeType !== 'FILE') {
									selfGrid.select(this.dindex, {selected: false});
									return;
								}
								// 다른 모든 행의 선택 해제 (마지막 체크된 행만 유지)
								var targetIndex = this.dindex;
								$.each(selfGrid.list || [], function(idx, obj) {
									if (obj && obj.__index !== targetIndex && obj.__selected__) {
										selfGrid.select(obj.__index, {selected: false});
									}
								});
							}
						}
					}
				},
				page : {
					display : false
				},
				tree : {
					use : true,
					indentWidth : 15,
					arrowWidth : 15,
					iconWidth : 18,
					icons : {
						openedArrow : '<i class="fa fa-caret-down" aria-hidden="true"></i>',
						collapsedArrow : '<i class="fa fa-caret-right" aria-hidden="true"></i>',
						groupIcon : '<i class="fa fa-folder-open" aria-hidden="true"></i>',
						collapsedGroupIcon : '<i class="fa fa-folder" aria-hidden="true"></i>',
						itemIcon : '<i class="fa fa-file" aria-hidden="true"></i>'
					},
					columnKeys : {
						parentKey : "pid",
						selfKey : "id"
					}
				},
				columns : [
					 {key: "nodeName",           label: "이름",     width: 620, align: "left", treeControl: true, formatter: function() { return esc(this.value); }}
					,{key: "kind",               label: "종류",     width: 90,  align: "center"}
					,{key: "clientUserName",     label: "사용자",   width: 220, align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "clientComputerName", label: "접속PC",   width: 240, align: "left",   formatter: function() { return esc(this.value); }}
					,{key: "collectedAt",        label: "수집시각", width: 140, align: "center", formatter: function() { return esc(this.value); }}
				]
			});
			return this;
		},

		// 자동 갱신 시 사용자가 접거나 펼친 상태 보존
		captureCollapse : function() {
			if (!this.target || this.lastExpandAll) return;
			var cur = this.target.getList() || [];
			for (var i = 0; i < cur.length; i++) {
				var item = cur[i];
				if (item && item.id != null && item.collapse !== undefined) {
					treeCollapse[item.id] = !!item.collapse;
				}
			}
		},

		render : function(list, expandAll) {
			if (!this.target) return;
			this.captureCollapse();
			var keepKey = closeHandleSelectedKey(this, true);   // 자동 갱신 재렌더 전 선택 보존

			var rows = buildTreeRows(list, expandAll);
			this.lastExpandAll = expandAll;

			this.target.setData({
				list : rows,
				page : noPage(rows.length)
			});

			// AX5-Grid 최초 setData 시 우측 끝 스크롤 버그 대응 (docs/AX5-Grid.md §14)
			if (!treeHScrollFixed) {
				treeHScrollFixed = true;
				try {
					this.target.setConfig(this.target.config);
				} catch (e) {}
			}
			closeHandleRestoreSelect(this, true, keepKey);
		}
	};

	var firstRendered = false;

	// shareRelativePath 를 폴더 계층으로 분해해 트리 행(id/pid) 목록으로 변환
	// 같은 경로를 여러 사용자가 열고 있으면 한 노드에 사용자/PC 를 모아서 표시
	function buildTreeRows(list, expandAll) {
		var nodes = {};
		var rootIds = [];

		function ensureNode(id, pid, name, depth, isRoot) {
			var key = id.toLowerCase();
			var node = nodes[key];
			if (!node) {
				node = nodes[key] = {
					id: key, pid: pid, name: name, depth: depth, isRoot: !!isRoot,
					opened: false, users: {}, pcs: {}, children: [], openCount: 0, handles: []
				};
				if (pid) {
					nodes[pid].children.push(key);
				} else {
					rootIds.push(key);
				}
			}
			return node;
		}

		function addOpener(node, row) {
			node.opened = true;
			if (row.isDirectory === true || row.entryKind === 'DIR' || row.entryKindNm === '폴더') node.isDir = true;
			if (row.clientUserName) node.users[row.clientUserName] = true;
			if (row.clientComputerName) node.pcs[row.clientComputerName] = true;
			node.collectedAt = row.collectedAt;
			// 점유해제 대상: 파일 핸들만 모은다 (폴더 핸들은 제외)
			if (row.isDirectory !== true && row.entryKind !== 'DIR') {
				node.handles.push({
					fileId: row.fileId,
					sessionId: row.sessionId,
					clientUserName: row.clientUserName,
					clientComputerName: row.clientComputerName,
					shareRelativePath: row.shareRelativePath,
					isDirectory: row.isDirectory
				});
			}
		}

		for (var i = 0; i < list.length; i++) {
			var row = list[i] || {};
			var rootLabel = (row.shareName && String(row.shareName).trim()) ? String(row.shareName).trim() : UNKNOWN_SHARE;
			var rootId = 'S|' + rootLabel;
			var rootNode = ensureNode(rootId, null, rootLabel, 0, true);

			var segs = String(row.shareRelativePath || '').replace(/\//g, '\\').split('\\');
			var clean = [];
			for (var s = 0; s < segs.length; s++) {
				if (segs[s] !== '') clean.push(segs[s]);
			}

			if (clean.length === 0) {
				addOpener(rootNode, row);   // 공유 루트 자체가 열려 있는 경우
				continue;
			}

			var parentKey = rootNode.id;
			var node = rootNode;
			for (var k = 0; k < clean.length; k++) {
				var path = rootId + '\\' + clean.slice(0, k + 1).join('\\');
				node = ensureNode(path, parentKey, clean[k], k + 1, false);
				parentKey = node.id;
			}
			addOpener(node, row);
		}

		// 하위 열린 항목 건수 집계 (자식이 나중에 생성되므로 생성 순서의 역순으로 누적)
		var allKeys = [];
		(function collect(keys) {
			for (var a = 0; a < keys.length; a++) {
				allKeys.push(keys[a]);
				collect(nodes[keys[a]].children);
			}
		})(rootIds);
		for (var r = allKeys.length - 1; r >= 0; r--) {
			var n = nodes[allKeys[r]];
			if (n.opened) n.openCount += 1;
			if (n.pid) nodes[n.pid].openCount += n.openCount;
		}

		// 부모가 자식보다 먼저 오도록 이름순 선위 순회로 행 생성
		var out = [];
		function byName(a, b) {
			return nodes[a].name.localeCompare(nodes[b].name, 'ko');
		}
		function emit(keys) {
			keys.sort(byName);
			for (var e = 0; e < keys.length; e++) {
				var nd = nodes[keys[e]];
				var hasChildren = nd.children.length > 0;
				var collapse = false;
				if (hasChildren && !expandAll) {
					// 최초 렌더링 시에는 열려 있는 파일/폴더 내용이 바로 보이도록 펼침(collapse=false)
					if (!firstRendered) {
						collapse = false;
					} else {
						collapse = (treeCollapse[nd.id] !== undefined) ? treeCollapse[nd.id] : false;
					}
				}
				// 루트이거나, 하위 자식 노드를 거느린 부모이거나, 수집기가 실제 디렉토리로 판정한 경우에만 폴더로 취급
				var isDirectoryNode = nd.isRoot || hasChildren || nd.isDir;
				var rowOut = {
					id: nd.id,
					nodeName: nd.name + (hasChildren ? ' (' + nd.openCount + ')' : ''),
					kind: nd.isRoot ? '공유' : (hasChildren ? (nd.opened ? '폴더(열림)' : '폴더') : (nd.opened ? (isDirectoryNode ? '폴더(열림)' : '파일') : '폴더')),
					clientUserName: Object.keys(nd.users).join(', '),
					clientComputerName: Object.keys(nd.pcs).join(', '),
					collectedAt: nd.collectedAt || ''
				};
				if (nd.pid) rowOut.pid = nd.pid;     // 최상위는 pid 를 두지 않는다
				if (hasChildren) rowOut.collapse = collapse;
				// 점유해제 정보: 자식이 없는 리프 파일 핸들만 모은 노드인 경우에만 FILE 유형으로 지정
				rowOut.handles = isDirectoryNode ? [] : nd.handles.slice();
				rowOut.closeType = nd.isRoot ? '' : (!isDirectoryNode && nd.handles.length > 0 ? 'FILE' : (nd.opened ? 'DIR' : ''));
				// 대상이 파일인 경우에만 선택 및 점유해제 가능 (폴더, 공유는 선택 비활성화)
				rowOut.__disable_selection__ = (rowOut.closeType !== 'FILE');
				out.push(rowOut);
				emit(nd.children.slice());
			}
		}
		emit(rootIds.slice());
		firstRendered = true;
		return out;
	}

	// 목록 <-> 트리 보기 전환
	function toggleViewMode() {
		viewMode = (viewMode === 'list') ? 'tree' : 'list';
		var isTree = (viewMode === 'tree');

		$('#btnTreeToggle').html(isTree
			? '<i class="fas fa-list"></i> 목록보기'
			: '<i class="fas fa-sitemap"></i> 트리보기');
		$('#flatGridWrap').toggle(!isTree);
		$('#treeGridWrap').toggle(isTree);

		if (isTree && !treeView.target) {
			treeView.initView();
		}
		if (!isTree && !gridView.target) {
			gridView.initView();
		}
		adjustGridHeight();
		gridView.applyFilter();
	}

	// 수집 상태 표시 (정상 / 지연 / 오류)
	function renderStatus(data, collectedAt) {
		var cnt = (data.count != null) ? data.count : (data.files || []).length;
		if (data.status === 'OK') {
			setStatus('success', '정상 · ' + cnt + '건 · 수집 ' + collectedAt);
		} else if (data.status === 'STALE') {
			setStatus('warning', '지연 · ' + (data.message || '수집 데이터가 오래되었습니다') + ' · 마지막 수집 ' + collectedAt);
		} else {
			setStatus('danger', '오류 · ' + (data.message || '조회할 수 없습니다'));
		}
	}

	// 자동 갱신 타이머
	function stopTimer() {
		if (pollTimer !== null) {
			clearTimeout(pollTimer);
			pollTimer = null;
		}
	}

	function scheduleNext() {
		stopTimer();
		if (document.hidden || !$('#autoRefresh_S').is(':checked')) return;
		pollTimer = setTimeout(function() {
			gridView.setData();
		}, POLL_MS);
	}

	function toggleAutoRefresh() {
		if ($('#autoRefresh_S').is(':checked')) {
			gridView.setData();
		} else {
			stopTimer();
		}
	}

	// 탭 비활성 시 폴링 중지, 복귀 시 즉시 조회
	document.addEventListener('visibilitychange', function() {
		if (document.hidden) {
			stopTimer();
		} else if ($('#autoRefresh_S').is(':checked')) {
			gridView.setData();
		}
	});

	// ----------------------------------------------------------------
	// 점유해제 기능
	// ----------------------------------------------------------------

	// 서버가 내려준 권한(canClose)에 따라 점유해제 버튼 표시/숨김
	function closeHandleApplyPermission(canClose) {
		if (canClose) {
			$('#btnCloseHandle').show();
		} else {
			$('#btnCloseHandle').hide();
		}
	}

	// 상대경로에서 파일명(마지막 경로조각) 추출
	function closeHandleBaseName(path) {
		if (!path) return '';
		var p = String(path).replace(/\//g, '\\');
		var parts = p.split('\\');
		for (var i = parts.length - 1; i >= 0; i--) {
			if (parts[i] !== '') return parts[i];
		}
		return p;
	}

	// 행에서 재선택용 안정 키 생성 (트리=노드 id, 목록=fileId|sessionId).
	// 식별자가 없으면(구버전 JSON 등) null 을 반환해 엉뚱한 행(0번) 복원을 막는다.
	function closeHandleRowKey(row, isTree) {
		if (!row) return null;
		if (isTree) {
			return (row.id == null || row.id === '') ? null : ('T|' + row.id);
		}
		if (row.fileId == null || row.fileId === '' || row.sessionId == null || row.sessionId === '') return null;
		return 'L|' + row.fileId + '|' + row.sessionId;
	}

	// 자동 갱신 재렌더 전 현재 선택행의 안정 키 추출
	function closeHandleSelectedKey(view, isTree) {
		if (!view || !view.target || !view.target.getList) return null;
		var sel;
		try { sel = view.target.getList('selected') || []; } catch (e) { return null; }
		return closeHandleRowKey(sel[0], isTree);
	}

	// 재렌더 후 같은 키의 행을 다시 선택 (폴링으로 선택이 풀리지 않도록)
	function closeHandleRestoreSelect(view, isTree, key) {
		if (!key || !view || !view.target || !view.target.getList) return;
		var list;
		try { list = view.target.getList() || []; } catch (e) { return; }
		for (var i = 0; i < list.length; i++) {
			if (closeHandleRowKey(list[i], isTree) === key) {
				try {
					if (isTree) {
						var selfGrid = view.target;
						$.each($.extend({}, selfGrid.list), function(idx, obj) {
							selfGrid.select(obj.__index, {selected: false});
						});
						selfGrid.select(i, {selected: true});
					} else {
						view.target.select(i, {selected: true});
					}
				} catch (e) {}
				return;
			}
		}
	}

	// 현재 보기의 선택행에서 해제 가능한 파일 핸들/유형 판정
	function closeHandleResolveSelection() {
		var isTree = (viewMode === 'tree');
		var view = isTree ? treeView : gridView;
		var sel = (view && view.target && view.target.getList) ? (view.target.getList('selected') || []) : [];
		var row = sel[0];
		if (!row) return {ok: false, msg: '점유 중인 파일을 목록에서 먼저 선택하십시오.'};

		var handles, type;
		if (isTree) {
			handles = row.handles || [];
			type = row.closeType || '';
		} else {
			if (row.isDirectory === true) {
				handles = [];
				type = 'DIR';
			} else {
				handles = [{
					fileId: row.fileId,
					sessionId: row.sessionId,
					clientUserName: row.clientUserName,
					clientComputerName: row.clientComputerName,
					shareRelativePath: row.shareRelativePath,
					isDirectory: row.isDirectory
				}];
				type = 'FILE';
			}
		}

		if (type === 'DIR') return {ok: false, msg: '폴더는 점유해제할 수 없습니다. 점유 중인 파일을 선택하십시오.'};
		if (type !== 'FILE' || handles.length === 0) return {ok: false, msg: '선택한 항목은 점유 중인 파일이 아닙니다.'};
		return {ok: true, handles: handles};
	}

	// 점유해제 버튼 클릭 -> 선택 정보 스냅샷 후 모달 오픈
	function closeHandleOpen() {
		var res = closeHandleResolveSelection();
		if (!res.ok) {
			alert(res.msg);
			return;
		}

		var handles = res.handles;
		var relPath = (handles[0] && handles[0].shareRelativePath != null) ? String(handles[0].shareRelativePath) : '';
		var fileName = closeHandleBaseName(relPath);

		// 선택 정보를 복사해 보관 (이후 폴링 재렌더에 영향받지 않게)
		closeHandleState = {handles: handles, fileName: fileName, relativePath: relPath};

		$('#closeModalFileName').text(fileName || '-');
		$('#closeModalPath').text(relPath || '-');
		$('#closeReason').val('');

		var html = '';
		for (var i = 0; i < handles.length; i++) {
			var h = handles[i];
			var checked = (i === 0) ? ' checked' : '';
			html += '<tr style="cursor: pointer;">'
				+ '<td style="text-align: center;"><input type="radio" name="closeHandlePick" value="' + i + '"' + checked + '></td>'
				+ '<td>' + esc(h.clientUserName) + '</td>'
				+ '<td>' + esc(h.clientComputerName) + '</td>'
				+ '</tr>';
		}
		$('#closeModalHandleBody').html(html);
		$('#btnCloseHandleConfirm').prop('disabled', false);
		$('#closeModal').modal('show');
	}

	// 모달 [점유해제] 확인 -> 검증 후 서버 요청
	function closeHandleConfirm() {
		var st = closeHandleState;
		if (!st || !st.handles || st.handles.length === 0) {
			alert('점유 중인 파일을 선택하십시오.');
			return;
		}

		var reason = $.trim($('#closeReason').val() || '');
		if (reason === '') {
			alert('사유를 입력하십시오.');
			return;
		}

		var picked = $('input[name="closeHandlePick"]:checked').val();
		if (picked === undefined || picked === null || picked === '') {
			alert('해제할 사용자/접속PC 를 선택하십시오.');
			return;
		}
		var h = st.handles[parseInt(picked, 10)];
		if (!h) {
			alert('해제할 사용자/접속PC 를 선택하십시오.');
			return;
		}

		if (!confirm('정말 점유를 해제하시겠습니까?')) return;

		var $btn = $('#btnCloseHandleConfirm');
		if ($btn.prop('disabled')) return;      // 이중 클릭 방지
		$btn.prop('disabled', true);

		var payload = {
			fileId:       String(h.fileId == null ? '' : h.fileId),
			sessionId:    String(h.sessionId == null ? '' : h.sessionId),
			expectedPath: String(h.shareRelativePath == null ? '' : h.shareRelativePath),
			expectedUser: String(h.clientUserName == null ? '' : h.clientUserName),
			reason:       reason
		};

		// 사용자 조작이므로 blockUI 기본값(표시) 허용
		postAjax('/admin/cm/cm40/closeOpenFile', payload, null, function(data) {
			$btn.prop('disabled', false);

			// HTTP 오류 시 postAjax 가 xhr 객체(data.status 가 숫자)를 넘긴다.
			// 단, 서버가 본문(JSON)을 함께 내려주면 responseJSON 으로 결과를 우선 처리한다.
			var body = data;
			if (data && typeof data.status === 'number') {
				body = (data.responseJSON && data.responseJSON.resultCode !== undefined) ? data.responseJSON : null;
			}
			if (!body || body.resultCode === undefined) {
				alert('요청에 실패했습니다.');
				return;
			}

			var code = body.resultCode;
			var msg = body.resultMessage;
			if (code === 200) {
				alert(msg || '점유가 해제되었습니다.');
				$('#closeModal').modal('hide');
				gridView.setData();      // 즉시 목록 재조회
			} else {
				alert(msg || '점유 해제에 실패했습니다.');
				gridView.setData();      // 409/404 등도 상태 변화 반영 위해 재조회, 모달은 유지
			}
		});
	}

	function DataSearch() {
		gridView.setData();
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search select").val("");
		gridView.applyFilter();
	}

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("기준관리", "열린 파일 사용자 조회");

		// 기본 보기는 트리 (목록 그리드는 목록보기로 전환할 때 처음 생성)
		treeView.initView();
		adjustGridHeight();
		gridView.setData();

		// 점유해제 모달 열림 시 자동 갱신 중지, 닫힘 시 재개
		$('#closeModal').on('show.bs.modal', function() {
			stopTimer();
		});
		$('#closeModal').on('hidden.bs.modal', function() {
			closeHandleState = null;
			scheduleNext();
		});

		// 모달 내부 사용자/접속PC 테이블 행 클릭 시 라디오 선택 연동
		$('#closeModalHandleBody').on('click', 'tr', function(e) {
			if ($(e.target).is('input[type="radio"]')) return;
			$(this).find('input[name="closeHandlePick"]').prop('checked', true);
		});
	});

</script>
