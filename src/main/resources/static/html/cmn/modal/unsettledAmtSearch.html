<div id="commonPopup">
	<div class="popup_area_unsettled">
		<div class="popup_table">
			<table>
				<colgroup>
					<col width="16%">
					<col width="32%">
					<col width="12%">
					<col width="">
				</colgroup>
				<tr>
					<td>
						<select id="coCd_PS" name="coCd_PS" class="form-control input-sm" data-kind="CO" data-search="coCd" required msg="회사" onchange="ModalSalesCodeGridView.setData(0);">
						</select>
					</td>
					<td>
						<div class="search_form">
							<input type="hidden" id="clntCd" name="clntCd">
							<input type="text" id="clntNm" name="clntNm" class="form-control input-sm" placeholder="고객사 검색" oninput="$('#commonPopup #clntCd').val('');" onkeydown="onClntNmKeyDown(event);">
							<a onclick="openClntSearchModal();"><i class="i_search_w"></i></a>
						</div>
					</td>
					<td>
						<button type="button" class="btn btn-default btn-sm" onclick="clearClntSearch();" style="height: 24px; line-height: 12px; font-size: 11px;">전체 고객사</button>
					</td>
					<td></td>
				</tr>
			</table>
			<div class="ax5_grid" data-ax5grid="ModalSalesCode-grid" data-ax5grid-config="{}" style="height: 630px; width: 100%"></div>
		</div>
	</div>
	<div class="popup_bottom_btn">
		<button type="button" onclick="executeCallback();">선택</button>
		<button type="button" class="close_btn" onclick="modalStack.close();">닫기</button>
	</div>
</div>

<script type="text/javascript">

	function gridColor(dataValue) {
		let cellColorSet = "";
		let row = dataValue.item;
		if (row.ordrsDiv == "ORDRSDIV8" || row.ordrsDiv == "ORDRSDIV9") {
			cellColorSet = "grid-cell-red";
		}
		return cellColorSet
	}
	var ModalSalesCodeGridView = {
		initView : function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber  : true,
				showRowSelector : true,
				multipleSelect  : false,
				target : $('[data-ax5grid="ModalSalesCode-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
						executeCallback();
					}
				},
				page : {
					navigationItemCount : 10,
					height    : 30,
					display   : false,
					firstIcon : '<i class="fa fa-step-backward" aria-hidden="true"></i>',
					prevIcon  : '<i class="fa fa-caret-left" aria-hidden="true"></i>',
					nextIcon  : '<i class="fa fa-caret-right" aria-hidden="true"></i>',
					lastIcon  : '<i class="fa fa-step-forward" aria-hidden="true"></i>',
					onChange  : function() {
						ModalSalesCodeGridView.setData(this.page.selectPage);
					}
				},
				columns : [
					{key : "ordrsNo", 		  label : "수주번호",      align : "center", width : 60, styleClass: function () {return gridColor(this);}},
					{key : "ordrsSeq", 		  label : "순번",   	   align : "center", width : 40, styleClass: function () {return gridColor(this);}},
					{key : "clntNm", 	  	  label : "고객사명",      align : "left", width : 130, styleClass: function () {return gridColor(this);}},
					{key : "clntPjtNm", 	  label : "고객사 PJT",    align : "left", width : 90, styleClass: function () {return gridColor(this);}},
					{key : "ordrsDivNm", 	  label : "수주구분",      align : "center", width : 80, styleClass: function () {return gridColor(this);}},
					{key : "ordrsAmt",	  	  label : "수주금액",      align : "right", width: 90, formatter: "money", styleClass: function () {return gridColor(this);}},
					{key : "eqpNm", 		  label : "설비명",        align : "left", width : "*", styleClass: function () {return gridColor(this);}},
					{key : "ordrsPrc",	  	  label : "추후정산금액",  align : "right", width: 90, formatter: "money", styleClass: function () {return gridColor(this);}},
					{key : "unOrdrsPrc",	  label : "정산상계금액",  align : "right", width: 90, formatter: "money", styleClass: function () {return gridColor(this);}},
					{key : "remOrdrsPrc",	  label : "잔여금액",      align : "right", width: 90, formatter: "money", styleClass: function () {return gridColor(this);}},
				]
			});
			return this;
		},
		setData : function(_pageNo) {
			var targetObj = this.target;
			var paramObj = {
				coCd    : $('#coCd_PS').val(),
				clntCd  : $('#commonPopup #clntCd').val(),
				ordrsNo : (modalStack.last().paramObj ? modalStack.last().paramObj.ordrsNo : ''),	//자기자신의 추후정산은 제외처리함.
			};
			postAjax("/user/cr/cr02/selectUnsettledAmtSalesCodeList", paramObj, null, function(data) {
				var list = data.result;
				for (let i = 0; i < list.length; i++) {
					list[i].ordrsAmt = gPasFloatChk(list[i].ordrsAmt);
					list[i].ordrsPrc = gPasFloatChk(list[i].ordrsPrc);
					list[i].unOrdrsPrc = gPasFloatChk(list[i].unOrdrsPrc);
					list[i].remOrdrsPrc = gPasFloatChk(list[i].remOrdrsPrc);
				}
				targetObj.setData({
					list : list,
					page : {
						totalElements : list.length,
					}
				});
			});
		}
	}

	function openClntSearchModal() {
		var paramObj = {
			"searchValue" : $('#commonPopup #clntNm').val(),
			"clntDivCd"   : "CLNTDIV12"
		};
		openAutoModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "거래처 검색", paramObj, function(grid) {
			var row = grid.target.getList("selected")[0];
			if (row) {
				$('#commonPopup #clntCd').val(row.clntCd);
				$('#commonPopup #clntNm').val(row.clntNm);
				ModalSalesCodeGridView.setData(0);
			}
		});
	}

	function clearClntSearch() {
		$('#commonPopup #clntCd').val('');
		$('#commonPopup #clntNm').val('');
		ModalSalesCodeGridView.setData(0);
	}

	function onClntNmKeyDown(event) {
		if (event.keyCode == 13) {
			if (!$('#commonPopup #clntCd').val() && $('#commonPopup #clntNm').val().trim() !== '') {
				openClntSearchModal();
			} else {
				ModalSalesCodeGridView.setData(0);
			}
		}
	}

	$(document).ready(function() {
		setCommonSelect($('#commonPopup select[data-kind]'));

		var initParam = modalStack.last().paramObj || {};
		if (initParam.coCd) {
			$('#coCd_PS').val(initParam.coCd);
		}
		if (initParam.clntCd) {
			$('#commonPopup #clntCd').val(initParam.clntCd);
		}
		if (initParam.clntNm) {
			$('#commonPopup #clntNm').val(initParam.clntNm);
		}

		ModalSalesCodeGridView.initView().setData(0);
	});

	function executeCallback(){
		if(selectGridValidation(ModalSalesCodeGridView.target)) return;
		modalStack.last().callback(ModalSalesCodeGridView);
		modalStack.close();
	}
</script>
