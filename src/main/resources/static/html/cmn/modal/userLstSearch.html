<link rel="stylesheet" href="/static/css/ax5/ax5select.css" />
<script src="/static/js/ax5/ax5select.min.js"></script>

<style>
	#userLstTree .jstree-open > .jstree-anchor > .jstree-checkbox,
	#userLstTree .jstree-closed > .jstree-anchor > .jstree-checkbox { display:none; }

    .user-lst-container {
        display: grid;
        grid-template-columns: 45% 10% 45%;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
    }
    .user-lst-container > div {min-width: 0; max-width: 100%; padding: 0 6px; box-sizing: border-box;}
    .user-lst-container > .user-lst-left {grid-column: 1; width: 100%; min-width: 0; overflow: hidden;}
    .user-lst-container > .user-lst-actions {
        grid-column: 2;
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        box-sizing: border-box;
    }
    /* 우측 결재/공유 그리드: 가용 높이 내 세로 스크롤 허용, 가로스크롤 방지 */
    .user-lst-container > .user-lst-right {
        grid-column: 3;
        width: 100%;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
        box-sizing: border-box;
        padding-right: 2px;
    }
    .user-lst-right::-webkit-scrollbar {
        width: 6px;
    }
    .user-lst-right::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 3px;
    }
    .user-lst-right::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    /* main.css의 .contents { min-width: 800px; } 강제 상속 차단 및 컨테이너 내 비율 유지 */
    .user-lst-container .contents {
        min-width: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box !important;
    }
    .user-lst-container .treeView,
    .user-lst-container #userLstTree,
    .user-lst-container .appLineView,
    .user-lst-container #appLst,
    .user-lst-right [data-ax5grid] {
        min-width: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    /* 결재/공유 버튼 각각의 상단 기준 정렬 섹션 */
    .user-lst-action-section {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        width: 100% !important;
        box-sizing: border-box;
    }
    .user-lst-actions .user-lst-btn {
        display: block !important; width: 80px !important; height: 32px !important; line-height: 30px !important;
        margin: 3px 0; padding: 0 4px; text-align: center; font-size: 12px;
        font-weight: bold !important; color: #333 !important; background: #f4f4f4 !important; border: 1px solid #ccc !important;
        border-radius: 4px; text-decoration: none !important; box-sizing: border-box; cursor: pointer !important;
    }
    .user-lst-actions .user-lst-btn:hover, .user-lst-actions .user-lst-btn:focus {
        background-color: #e6e6e6; border-color: #adadad; color: #111; text-decoration: none;
    }
    #commonPopup {text-align: center; padding: 6px 0 2px 0; height: 38px; width: 100%; box-sizing: border-box; clear: both;}

    /* 결재구분 안내 가이드 테이블 */
    .line-type-guide-box {
        margin-bottom: 6px;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        background: #fbfbfb;
        padding: 4px 6px;
        box-sizing: border-box;
    }
    .line-type-guide-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        color: #444;
        line-height: 1.35;
    }
    .line-type-guide-table th {
        background: #eaeaea;
        color: #222;
        font-weight: bold;
        text-align: center;
        padding: 2px 4px;
        border: 1px solid #d5d5d5;
        white-space: nowrap;
    }
    .line-type-guide-table td {
        padding: 2px 5px;
        border: 1px solid #e2e2e2;
        background: #fff;
    }
    .line-type-guide-table td.col-name {
        text-align: center;
        font-weight: bold;
        color: #0b58a2;
        background: #fdfdfd;
        white-space: nowrap;
        width: 48px;
    }

    /* 결재 그리드 인라인 select로 인한 좌/우 패널(aside-body vs body) 행 높이 어긋남 방지 */
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="body"] tr,
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="aside-body"] tr {
        height: 26px !important;
    }
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="body"] td,
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="aside-body"] td {
        height: 25px !important;
        max-height: 25px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        vertical-align: middle !important;
    }
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="body"] [data-ax5grid-cellHolder],
    .user-lst-right [data-ax5grid="approval-grid"] [data-ax5grid-panel="aside-body"] [data-ax5grid-cellHolder] {
        height: 25px !important;
        line-height: 24px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        overflow: hidden !important;
    }
    .approval-line-type-sel {
        display: inline-block;
        width: 100%;
        height: 20px;
        line-height: 18px;
        padding: 0 2px;
        margin: 0;
        font-size: 12px;
        color: #333;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 2px;
        box-sizing: border-box;
        vertical-align: middle;
    }

    /* 트리 → 우측 그리드 Drag & Drop 시각 피드백 */
    body.tree-dnd-dragging,
    body.tree-dnd-dragging * {
        user-select: none !important;
        -webkit-user-select: none !important;
        cursor: grabbing !important;
    }
    .tree-dnd-ghost {
        position: fixed;
        z-index: 999999;
        pointer-events: none;
        padding: 4px 10px;
        border-radius: 12px;
        background: #1f6fb2;
        color: #fff;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        white-space: nowrap;
    }
    .tree-dnd-ghost.tree-dnd-ghost--remove {
        background: #c9302c;
    }
    .user-lst-left.dnd-remove-ready #userLstTree,
    .user-lst-left.dnd-remove-ready #appLst {
        outline: 1px dashed #d97a78;
        outline-offset: -1px;
    }
    .user-lst-left.dnd-remove-over #userLstTree,
    .user-lst-left.dnd-remove-over #appLst {
        outline: 2px dashed #c9302c !important;
        outline-offset: -2px;
        background-color: rgba(201, 48, 44, 0.04) !important;
    }
    .user-lst-right [data-ax5grid].dnd-drop-ready {
        outline: 1px dashed #7aa7d9;
        outline-offset: -1px;
    }
    .user-lst-right [data-ax5grid].dnd-drop-over {
        outline: 2px dashed #1f6fb2 !important;
        outline-offset: -2px;
        background-color: rgba(31, 111, 178, 0.04);
    }
    .user-lst-right [data-ax5grid] tr.dnd-row-insert-before td {
        box-shadow: inset 0 2px 0 0 #1f6fb2 !important;
    }
    .user-lst-right [data-ax5grid] tr.dnd-row-insert-after td {
        box-shadow: inset 0 -2px 0 0 #1f6fb2 !important;
    }
</style>

<script type="text/javascript">
	approvalData =[];
	shareData =[];
	var modal_userId = null;

	// 호출 프로그램 ID(pgmId) 기준 결재구분(결재/합의/협조/후결/참조) 변경 가능 여부 (기본 허용, 명시적 false/'N' 시에만 비활성)
	function isLineTypeEditable() {
		var paramObj = (modalStack.last() && modalStack.last().paramObj) ? modalStack.last().paramObj : {};
		if (paramObj.lineTypeEditable === false || paramObj.lineTypeEditable === "N") {
			return false;
		}
		return true;
	}

	// 결재구분 코드 <-> 명칭 매핑 (저장값은 실제 코드 APPR/AGREE/COOP/POST/REF)
	function lineTypeNmToCode(nm) {
		if (nm === "합의") return "AGREE";
		if (nm === "협조") return "COOP";
		if (nm === "후결") return "POST";
		if (nm === "참조" || nm === "공유") return "REF";
		return "APPR"; // 결재/기타
	}
	function lineTypeCodeToNm(code) {
		if (code === "AGREE") return "합의";
		if (code === "COOP") return "협조";
		if (code === "POST") return "후결";
		if (code === "REF" || code === "SHARE") return "참조";
		return "결재"; // APPR/APPROVAL/기타
	}
	function onChangeApprovalLineType(selectEl) {
		if (!selectEl) return;
		var idx = parseInt(selectEl.getAttribute("data-dindex"), 10);
		if (isNaN(idx)) return;
		var code = selectEl.value || "APPR";
		var nm = lineTypeCodeToNm(code);
		var list = (approvalGrid && approvalGrid.target && approvalGrid.target.list) ? approvalGrid.target.list : [];
		if (list[idx]) {
			list[idx].lineType = code;
			list[idx].lineTypeNm = nm;
		}
		if (approvalData && approvalData[idx]) {
			approvalData[idx].lineType = code;
			approvalData[idx].lineTypeNm = nm;
		}
	}

	function cm06UseYnGridColor(dataValue) {
		let rtnColor = "";
		let row = dataValue.item;
		if (row.cm06UseYn == "N") {
			rtnColor = "grid-cell-orange";
		}
		return rtnColor;
	}

	// 공통 히든 컬럼
	var baseHiddenColumns = [
		{key: "id", 	label: "ID", 	align: "center", width: 80, 	hidden:true},
        {key: "todoKey", 	label: "todoKey", 	align: "center", width: 100, 	hidden:true},
        {key: "sanctnSn", 	label: "sanctnSn", 	align: "center", width: 100, 	hidden:true},
        {key: "sanctnSttus", 	label: "sanctnSttus", 	align: "center", width: 100, 	hidden:true},
        {key: "todoCfDt", 	label: "todoCfDt", 	align: "center", width: 100, 	hidden:true},
        {key: "todoCfOpn", 	label: "todoCfOpn", 	align: "center", width: 100, 	hidden:true},
        {key: "lineType", 	label: "구분코드", 	align: "center", width: 80, 	hidden:true}
	];
	var baseVisibleColumns = [
        {key: "text", 	label: "성명", 	align: "center", width: 80},
        {key: "parent", label: "직책", 	align: "center", width: 60},
        {key: "deptNm", label: "부서", 	align: "left",   width: "*"},
        {key: "flag", 	label: "flag", 	align: "center", width: 100, 	hidden:true},
        {key: "coCd", 	label: "coCd", 	align: "center", width: 100, 	hidden:true},
        {key: "useYn", 	label: "useYn", 	align: "center", width: 100, 	hidden:true}
	];
	// 결재 라인: 인라인 select로 결재/합의/협조/후결/참조 단일 클릭 선택 가능
	var approvalColumns = baseHiddenColumns.concat([
		{key: "lineTypeNm", label: "구분", align: "center", width: 80, formatter: function() {
			var item = this.item || {};
			var code = item.lineType || lineTypeNmToCode(item.lineTypeNm || this.value || "결재");
			if (code === "APPROVAL") code = "APPR";
			if (code === "SHARE") code = "REF";
			var nm = lineTypeCodeToNm(code);
			if (!isLineTypeEditable()) {
				return nm;
			}
			var opts = [
				{ value: "APPR", text: "결재" },
				{ value: "AGREE", text: "합의" },
				{ value: "COOP", text: "협조" },
				{ value: "POST", text: "후결" },
				{ value: "REF", text: "참조" }
			];
			var html = '<select class="approval-line-type-sel" data-dindex="' + this.dindex + '" onclick="event.stopPropagation();" onchange="onChangeApprovalLineType(this);">';
			for (var i = 0; i < opts.length; i++) {
				html += '<option value="' + opts[i].value + '"' + (code === opts[i].value ? ' selected' : '') + '>' + opts[i].text + '</option>';
			}
			html += '</select>';
			return html;
		}}
	]).concat(baseVisibleColumns);
	// 공유 라인: 구분은 항상 참조(편집 불가)
	var shareColumns = baseHiddenColumns.concat([
		{key: "lineTypeNm", label: "구분", align: "center", width: 80}
	]).concat(baseVisibleColumns);

	var approvalGrid = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber: true,
				lineNumberColumnWidth: 30,
				showRowSelector: true,
				multipleSelect: true,
				sortable: false,
				target: $('[data-ax5grid="approval-grid"]'),
				header: {
					align: "center",
					selector: true
				},
				body: {
					onClick: function () {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
					},
					onDataChanged: function () {
						// 구분(명칭) 변경 시 히든 코드(lineType)만 동기화. 명칭은 사용자 선택 유지(값 사라짐 방지)
						if (this.key === "lineTypeNm") {
							this.self.setValue(this.dindex, "lineType", lineTypeNmToCode(this.item.lineTypeNm));
						}
					},
				},
				columns : approvalColumns,
			});
			return this;
		},
		setData: function(_list) {
			var target = this.target;
			var list = _list || [];
			target.setData({
				list : list,
				page : {
					totalElements : list.length
				}
			});
			applyDynamicHeight();
			setTimeout(function() { try { target.align(); } catch (e) {} }, 60);
		}
	}

	var shareGrid = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber: true,
				lineNumberColumnWidth: 30,
				showRowSelector: true,
				multipleSelect: true,
				sortable: false,
				target: $('[data-ax5grid="share-grid"]'),
				header: {
					align: "center",
					selector: true
				},
				body: {
					onClick: function () {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
					},
					onDataChanged: function () {
					},
				},
				columns : shareColumns,
			});
			return this;
		},
		setData: function(_list) {
			var target = this.target;
			var list = _list || [];
			target.setData({
				list : list,
				page : {
					totalElements : list.length
				}
			});
			applyDynamicHeight();

	function normalizeLineType(item, defaultCode) {
		var code = item.lineType;
		if (code === "APPROVAL") code = "APPR";
		if (code === "SHARE") code = "REF";
		if (!code) code = defaultCode;
		item.lineType = code;
		item.lineTypeNm = lineTypeCodeToNm(code);
		return item;
	}

	// 그리드 행 수 취득 헬퍼 함수
	function getGridRowCount(gridObj, dataArr) {
		var cnt = 0;
		if (gridObj && gridObj.target && gridObj.target.list) {
			cnt = Math.max(cnt, gridObj.target.list.length);
		}
		if (dataArr && dataArr.length) {
			cnt = Math.max(cnt, dataArr.length);
		}
		return cnt;
	}

	// 디바운스 적용된 동적 높이 조절
	var dynamicHeightTimer = null;
	function applyDynamicHeight() {
		clearTimeout(dynamicHeightTimer);
		executeDynamicHeight();
		dynamicHeightTimer = setTimeout(executeDynamicHeight, 40);
	}

	function executeDynamicHeight() {
		var $container = $('.user-lst-container');
		var bodyH = 0;

		// 1) ax5modal 내부 실제 가용 바디 높이 탐색
		var $bodyFrame = $container.closest('[data-ax-body="body-frame"]');
		if ($bodyFrame.length && $bodyFrame.height() > 100) {
			bodyH = $bodyFrame.height();
		} else {
			var $modalBody = $container.closest('.ax-modal-body');
			if ($modalBody.length && $modalBody.height() > 100) {
				bodyH = $modalBody.height();
			} else {
				var lastModal = (typeof modalStack !== 'undefined') ? modalStack.last() : null;
				if (lastModal && lastModal.target && lastModal.target.config && lastModal.target.config.height) {
					bodyH = parseInt(lastModal.target.config.height, 10) - 40;
				} else {
					var $modal = $container.closest('.ax5modal');
					if ($modal.length && $modal.height() > 100) {
						bodyH = $modal.height() - 40;
					}
				}
			}
		}

		if (!bodyH || bodyH < 250) {
			bodyH = 460;
		}

		// 하단 버튼 영역(#commonPopup 38px) 제외 가용 높이를 꽉 채움
		var availTotalH = Math.max(bodyH - 42, 350);

		// 좌측: 검색바(28px + margin-bottom 6px = 34px)
		var treeH = availTotalH - 34;

		// 1. 자료 행 수 정확 감지
		var apprRowCount = getGridRowCount(approvalGrid, approvalData);
		var shareRowCount = getGridRowCount(shareGrid, shareData);

		// 2. 자료 건수에 따른 높이 계산 (헤더 26px + 페이저 30px + 보더 여유 4px = 기본 60px, 행당 26px)
		var apprContentH = (apprRowCount * 26) + 60;
		var shareContentH = (shareRowCount * 26) + 60;

		// 3. 기본 크기(결재 135px, 공유 85px)를 최소 보장하면서, 자료가 많아지면 행 수에 비례하여 즉시 자동 확장
		var finalApprH = Math.max(135, apprContentH);
		var finalShareH = Math.max(85, shareContentH);

		// 좌측 영역 높이 적용
		$('#userLstTree').css('height', treeH + 'px');
		$('#appLst').css('height', treeH + 'px');
		setAx5GridHeight(appListgridView, $('[data-ax5grid="appList-grid"]'), treeH);

		// 우측 영역 높이 제한: 모달 가용 높이 내에서 스크롤되도록 설정 (자료가 많아져 그리드가 늘어난 만큼 우측 스크롤 발생)
		$('.user-lst-right').css({
			'height': availTotalH + 'px',
			'max-height': availTotalH + 'px',
			'overflow-y': 'auto',
			'overflow-x': 'hidden'
		});

		// 결재/공유 그리드 높이 적용
		setAx5GridHeight(approvalGrid, $('[data-ax5grid="approval-grid"]'), finalApprH);
		setAx5GridHeight(shareGrid, $('[data-ax5grid="share-grid"]'), finalShareH);

		// 중앙 결재/공유 버튼 위치 정렬 (결재/공유 헤더 위치에 맞춰 자연스럽게 배치)
		var guideH = $('.line-type-guide-box').outerHeight(true) || 0;
		var appBtnTop = Math.max(0, guideH + 10);
		$('.approval-action-sec').css({
			'height': 'auto',
			'padding-top': appBtnTop + 'px'
		});
		$('.share-action-sec').css({
			'height': 'auto',
			'padding-top': '20px'
		});

		setTimeout(function() {
			try { if (approvalGrid && approvalGrid.target) approvalGrid.target.align(); } catch(e) {}
			try { if (shareGrid && shareGrid.target) shareGrid.target.align(); } catch(e) {}
			try { if (appListgridView && appListgridView.target) appListgridView.target.align(); } catch(e) {}
		}, 30);
	}

			if (!nodeId) return;

			if (!nodeObj) return;

			if (nodeObj.original && nodeObj.original.type === 'person') {
				// 사원 더블클릭: 해당 사원을 선택 후 결재 라인에 추가 (모달 닫힘 방지)
				tree.deselect_all();
				tree.select_node(nodeId);
				addApproval('approval');
			} else {

				tree.toggle_node(nodeObj);

	// 팀원(person)이 없는 빈 부서(unit) 필터링 제거 함수
	function filterEmptyDeptTree(treeList) {
		if (!treeList || !treeList.length) return [];

		var personNodes = [];
		var unitMap = {};
		treeList.forEach(function(node) {
			if (node.type === 'person') {
				if (node.useYn !== 'N') {
					personNodes.push(node);
				}
			} else {
				unitMap[node.id] = node;
			}
		});

		// 팀원이 있는 부서 및 그 상위 부서 추적 마킹
		var activeDeptIds = {};
		personNodes.forEach(function(person) {
			var deptId = person.parent;
			while (deptId && deptId !== '#' && unitMap[deptId]) {
				activeDeptIds[deptId] = true;
				deptId = unitMap[deptId].parent;
			}
		});

		// 팀원이 존재하는 부서 및 팀원 노드만 필터링하여 반환
		return treeList.filter(function(node) {
			if (node.type === 'person') {
				return activeDeptIds[node.parent] === true;
			} else {
				return activeDeptIds[node.id] === true;
			}
		});
	}

	/** 표준 후보 목록을 결재/공유 그리드에 추가(중복/퇴사자 검증 및 insertIndex 삽입 공통 처리). */
	function appendCandidatesToGrid(candidates, _type, insertIndex) {
		if (!candidates || !candidates.length) return false;
		var hasRetired = false;
		var newItems = [];
		var sanctnSn = 1;

		candidates.forEach(function(cand) {
			if (!cand || !cand.id) return;
			if (cand.useYn === 'N') {
				hasRetired = true;
				return;
			}
			var duplicates = (_type === "approval")
				? getDupChk(approvalData, 'id', cand.id)
				: getDupChk(shareData, 'id', cand.id);
			if (duplicates.length) {
				return;
			}
			if (_type !== "approval") {
				var isAlreadyInApproval = approvalData.some(function(item) {
					var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
					return uid === cand.id;
				});
				if (isAlreadyInApproval) {
					return;
				}
			}
			newItems.push({
				id: cand.id,
				text: cand.text,
				parent: cand.parent,
				deptNm: cand.deptNm,
				telNo: cand.telNo,
				offTelNo: cand.offTelNo,
				email: cand.email,
				coCd: cand.coCd,
				useYn: cand.useYn || 'Y',
				sanctnSn: sanctnSn,
				lineType: (_type === "approval") ? "APPR" : "REF",
				lineTypeNm: (_type === "approval") ? "결재" : "참조"
			});
			sanctnSn++;
		});

		var targetArr = (_type === "approval") ? approvalData : shareData;
		var insertedAtEnd = (typeof insertIndex !== "number" || isNaN(insertIndex) || insertIndex < 0 || insertIndex > targetArr.length);
		var focusIdx = "END";
		if (newItems.length > 0) {
			if (insertedAtEnd) {
				Array.prototype.push.apply(targetArr, newItems);
			} else {
				Array.prototype.splice.apply(targetArr, [insertIndex, 0].concat(newItems));
				focusIdx = insertIndex + newItems.length - 1;
			}
		}

		if (hasRetired) {
			alert("퇴사자가 존재합니다.");
		}

		if (_type === "approval") {
			var appIds = {};
			approvalData.forEach(function(item) {
				var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
				if (uid) appIds[uid] = true;
			});
			var prevShareLen = shareData.length;
			shareData = shareData.filter(function(item) {
				var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
				return !uid || !appIds[uid];
			});
			if (shareData.length !== prevShareLen) {
				shareGrid.setData(shareData);
			}
			approvalGrid.setData(approvalData);
			approvalGrid.target.focus(focusIdx);
		} else {
			shareGrid.setData(shareData);
			shareGrid.target.focus(focusIdx);
		}
		return true;
	}

	function appListRowToCandidate(row) {

		return {

	/** 트리에서 선택(체크) 또는 드래그한 사원 노드 목록을 결재/공유 그리드에 추가. */
	function appendTreeNodesToGrid(nodeIds, _type, insertIndex) {
		if (!nodeIds || !nodeIds.length) return false;
		var tree = $('#userLstTree').jstree(true);
		if (!tree) return false;

		var candidates = [];
		nodeIds.forEach(function(nodeId) {
			var node = tree.get_node(nodeId);
			if (!node || !node.original || node.original.type !== 'person') {
				return;
			}
			candidates.push({
				id: nodeId,
				text: node.text,
				parent: node.original.levelNm,
				deptNm: node.original.deptNm,
				telNo: node.original.telNo,
				offTelNo: node.original.offTelNo,
				email: node.original.email,
				coCd: node.original.coCd,
				useYn: node.original.useYn || 'Y'
			});
		});
		return appendCandidatesToGrid(candidates, _type, insertIndex);
	}

	/** 좌측 조직도/결재라인 ↔ 우측 결재/공유 그리드 양방향 Drag & Drop 바인딩. */
	function initTreeToGridDnd() {
		var $tree = $('#userLstTree');

		var $shareGrid = $('[data-ax5grid="share-grid"]');
		var pendingDrag = null;
		var activeDrag = null;
		var $ghost = null;
		var suppressClickUntil = 0;

		function clearDndVisuals() {
			$('body').removeClass('tree-dnd-dragging');
			if ($ghost) {
				$ghost.remove();
				$ghost = null;
			}
			$leftPane.removeClass('dnd-remove-ready dnd-remove-over');
			$apprGrid.removeClass('dnd-drop-ready dnd-drop-over');
			$shareGrid.removeClass('dnd-drop-ready dnd-drop-over');
			$apprGrid.find('tr.dnd-row-insert-before, tr.dnd-row-insert-after')
				.removeClass('dnd-row-insert-before dnd-row-insert-after');
			$shareGrid.find('tr.dnd-row-insert-before, tr.dnd-row-insert-after')
				.removeClass('dnd-row-insert-before dnd-row-insert-after');
		}

		function resolveRightGridDragPayload(pending) {
			var isApproval = (pending.source === 'rightApproval');
			var gridTarget = isApproval ? (approvalGrid && approvalGrid.target) : (shareGrid && shareGrid.target);
			var dataArr = isApproval ? approvalData : shareData;
			if (!gridTarget || !dataArr || !dataArr[pending.dindex]) return null;

			var selectedRows = gridTarget.getList("selected") || [];
			var isStartSelected = selectedRows.some(function(r) { return r && r.__index === pending.dindex; });
			var indexMap = {};
			if (isStartSelected && selectedRows.length > 0) {
				selectedRows.forEach(function(r) {
					if (r && typeof r.__index === 'number' && r.__index >= 0 && r.__index < dataArr.length) {
						indexMap[r.__index] = true;
					}
				});
			} else {
				indexMap[pending.dindex] = true;
			}
			var indices = Object.keys(indexMap).map(function(k) { return parseInt(k, 10); }).sort(function(a, b) { return a - b; });
			if (!indices.length) return null;

			var firstItem = dataArr[indices[0]];
			var label = (firstItem && (firstItem.text || firstItem.name || firstItem.id)) || '선택 행';
			if (indices.length > 1) {
				label = label + ' 외 ' + (indices.length - 1) + '명';
			}
			return {
				source: pending.source,
				mode: 'remove',
				targetType: isApproval ? 'approval' : 'share',
				indices: indices,
				label: label + ' 제거'
			};
		}

		function resolveDragPayload(pending) {
			if (!pending) return null;
			if (pending.source === 'rightApproval' || pending.source === 'rightShare') {
				return resolveRightGridDragPayload(pending);
			}
			if (pending.source === 'appList') {
				var gridTarget = appListgridView && appListgridView.target;
				if (!gridTarget || !gridTarget.list) return null;
				var startRow = gridTarget.list[pending.dindex];
				if (!startRow || !startRow.appId) return null;

				var selectedRows = gridTarget.getList("selected") || [];
				var isStartSelected = selectedRows.some(function(r) { return r && r.__index === pending.dindex; });
				var targetRows = [];
				var fromSelected = false;

				if (isStartSelected && selectedRows.length > 0) {
					targetRows = selectedRows;
					fromSelected = true;
				} else if (pending.isMergedLineCol && startRow.appLineNm) {
					targetRows = gridTarget.list.filter(function(r) {
						return r && r.appLineNm === startRow.appLineNm;
					});
				} else {
					targetRows = [startRow];
				}

				var candidates = [];
				targetRows.forEach(function(r) {
					var cand = appListRowToCandidate(r);
					if (cand) candidates.push(cand);
				});
				if (!candidates.length) return null;

				var appLabel = candidates[0].text || candidates[0].id;
				if (candidates.length > 1) {
					appLabel = (pending.isMergedLineCol && startRow.appLineNm && !fromSelected)
						? (startRow.appLineNm + ' (' + candidates.length + '명)')
						: (appLabel + ' 외 ' + (candidates.length - 1) + '명');
				}
				return { source: 'appList', mode: 'add', candidates: candidates, fromSelected: fromSelected, label: appLabel };
			}

			var startNodeId = pending.nodeId;
			var tree = $tree.jstree(true);
			if (!tree) return null;
			var startNode = tree.get_node(startNodeId);
			if (!startNode || !startNode.original || startNode.original.type !== 'person') {
				return null;
			}
			var selected = tree.get_selected() || [];
			var personIds = [];
			var fromTreeSelected = selected.indexOf(startNodeId) !== -1;
			if (fromTreeSelected) {
				selected.forEach(function(id) {
					var n = tree.get_node(id);
					if (n && n.original && n.original.type === 'person') {
						personIds.push(id);
					}
				});
			} else {
				personIds.push(startNodeId);
			}
			if (!personIds.length) return null;
			var label = startNode.text || startNodeId;
			if (personIds.length > 1) {
				var firstNode = tree.get_node(personIds[0]);
				label = ((firstNode && firstNode.text) ? firstNode.text : label) + ' 외 ' + (personIds.length - 1) + '명';
			}
			return { source: 'tree', mode: 'add', nodeIds: personIds, fromSelected: fromTreeSelected, label: label };
		}

		function removeGridRowsByIndices(targetType, indices) {
			if (!indices || !indices.length) return;
			var isApproval = (targetType === 'approval');
			var dataArr = isApproval ? approvalData : shareData;
			var gridObj = isApproval ? approvalGrid : shareGrid;
			var lastIndex = 0;
			for (var i = indices.length - 1; i >= 0; i--) {
				var idx = indices[i];
				if (idx >= 0 && idx < dataArr.length) {
					lastIndex = idx;
					dataArr.splice(idx, 1);
				}
			}
			gridObj.setData(dataArr);
			if (dataArr.length > 0 && gridObj && gridObj.target && typeof gridObj.target.focus === 'function') {
				gridObj.target.focus(lastIndex === 0 ? 0 : Math.min(lastIndex - 1, dataArr.length - 1));
			}
		}

		function isInsideRect(rect, x, y) {
			return rect && rect.width > 0 && rect.height > 0
				&& x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
		}

		function calcGridDropTarget(clientX, clientY) {
			var candidates = [
				{ type: 'approval', $el: $apprGrid, count: approvalData.length },
				{ type: 'share', $el: $shareGrid, count: shareData.length }
			];
			for (var i = 0; i < candidates.length; i++) {
				var c = candidates[i];
				var el = c.$el[0];
				if (!el) continue;
				var rect = el.getBoundingClientRect();
				if (!isInsideRect(rect, clientX, clientY)) continue;

				var insertIndex = c.count;
				var rowIndex = null;
				var before = false;
				var $rows = c.$el.find('[data-ax5grid-panel="body"] tr[data-ax5grid-tr-data-index]');
				$rows.each(function() {
					var trRect = this.getBoundingClientRect();
					if (clientY >= trRect.top && clientY <= trRect.bottom) {
						var idx = parseInt(this.getAttribute('data-ax5grid-tr-data-index'), 10);
						if (!isNaN(idx)) {
							rowIndex = idx;
							before = clientY < (trRect.top + trRect.height / 2);
							insertIndex = before ? idx : (idx + 1);
						}
						return false;
					}
				});
				return {
					type: c.type,
					$el: c.$el,
					insertIndex: insertIndex,
					rowIndex: rowIndex,
					before: before
				};
			}
			return null;
		}

		// 드래그 직후 jsTree / 결재라인 그리드 클릭 오작동 차단
		$tree.off('.treeDnd').on('click.treeDnd', function(e) {
			if (Date.now() < suppressClickUntil) {
				e.preventDefault();
				e.stopImmediatePropagation();
				return false;
			}
		}).on('mousedown.treeDnd', 'li.jstree-node', function(e) {
			if (e.which !== 1) return;
			if ($(e.target).hasClass('jstree-ocl')) return;
			var tree = $tree.jstree(true);
			if (!tree) return;
			var nodeId = this.id;
			var node = nodeId ? tree.get_node(nodeId) : null;
			if (!node || !node.original || node.original.type !== 'person') return;
			// 다른 하위 li로 버블링되지 않도록 가장 가까운 person li만 처리
			if ($(e.target).closest('li.jstree-node')[0] !== this) return;
			pendingDrag = {
				source: 'tree',
				startX: e.clientX,
				startY: e.clientY,
				nodeId: nodeId
			};
		});

		$appListGrid.off('.treeDnd').on('click.treeDnd', function(e) {
			if (Date.now() < suppressClickUntil) {
				e.preventDefault();
				e.stopImmediatePropagation();
				return false;
			}
		}).on('mousedown.treeDnd', '[data-ax5grid-panel="body"] tr[data-ax5grid-tr-data-index], [data-ax5grid-panel="aside-body"] tr[data-ax5grid-tr-data-index]', function(e) {
			if (e.which !== 1) return;
			var dindex = parseInt(this.getAttribute('data-ax5grid-tr-data-index'), 10);
			if (isNaN(dindex)) return;
			var $td = $(e.target).closest('td[data-ax5grid-column-col]');
			var isMergedLineCol = ($td.attr('data-ax5grid-column-col') === '0' && $td.closest('[data-ax5grid-panel="body"]').length > 0);
			pendingDrag = {
				source: 'appList',
				startX: e.clientX,
				startY: e.clientY,
				dindex: dindex,
				isMergedLineCol: isMergedLineCol
			};
		});

		function bindRightGridDrag($gridEl, sourceName) {
			$gridEl.off('.treeDnd').on('click.treeDnd', function(e) {
				if (Date.now() < suppressClickUntil) {
					e.preventDefault();
					e.stopImmediatePropagation();
					return false;
				}
			}).on('mousedown.treeDnd', '[data-ax5grid-panel="body"] tr[data-ax5grid-tr-data-index], [data-ax5grid-panel="aside-body"] tr[data-ax5grid-tr-data-index]', function(e) {
				if (e.which !== 1) return;
				if ($(e.target).closest('select, option, input, button, a').length > 0) return;
				var dindex = parseInt(this.getAttribute('data-ax5grid-tr-data-index'), 10);
				if (isNaN(dindex)) return;
				pendingDrag = {
					source: sourceName,
					startX: e.clientX,
					startY: e.clientY,
					dindex: dindex
				};
			});
		}
		bindRightGridDrag($apprGrid, 'rightApproval');
		bindRightGridDrag($shareGrid, 'rightShare');

		$(document).off('.treeDnd').on('mousemove.treeDnd', function(e) {
			if (!pendingDrag && !activeDrag) return;
			if (!document.body.contains($tree[0])) {
				pendingDrag = null;
				activeDrag = null;
				clearDndVisuals();
				$(document).off('.treeDnd');
				$(window).off('blur.treeDnd');
				return;
			}
			if (pendingDrag && !activeDrag) {
				var dx = e.clientX - pendingDrag.startX;
				var dy = e.clientY - pendingDrag.startY;
				if ((dx * dx + dy * dy) < 36) return; // 6px 임계치 미만은 일반 클릭/더블클릭 유지
				var payload = resolveDragPayload(pendingDrag);
				if (!payload) {
					pendingDrag = null;
					return;
				}
				activeDrag = payload;
				$('body').addClass('tree-dnd-dragging');
				$ghost = $('<div class="tree-dnd-ghost"></div>')
					.toggleClass('tree-dnd-ghost--remove', payload.mode === 'remove')
					.text(payload.label)
					.appendTo('body');
				if (payload.mode === 'remove') {
					$leftPane.addClass('dnd-remove-ready');
				} else {
					$apprGrid.addClass('dnd-drop-ready');
					$shareGrid.addClass('dnd-drop-ready');
				}
			}
			if (!activeDrag) return;

			if ($ghost) {
				$ghost.css({ left: (e.clientX + 12) + 'px', top: (e.clientY + 12) + 'px' });
			}
			if (activeDrag.mode === 'remove') {
				var leftEl = $leftPane[0];
				var overLeft = !!(leftEl && isInsideRect(leftEl.getBoundingClientRect(), e.clientX, e.clientY));
				$leftPane.toggleClass('dnd-remove-over', overLeft);
				return;
			}

			$apprGrid.removeClass('dnd-drop-over');
			$shareGrid.removeClass('dnd-drop-over');
			$apprGrid.find('tr.dnd-row-insert-before, tr.dnd-row-insert-after')
				.removeClass('dnd-row-insert-before dnd-row-insert-after');
			$shareGrid.find('tr.dnd-row-insert-before, tr.dnd-row-insert-after')
				.removeClass('dnd-row-insert-before dnd-row-insert-after');

			var target = calcGridDropTarget(e.clientX, e.clientY);
			if (target) {
				target.$el.addClass('dnd-drop-over');
				if (target.rowIndex !== null) {
					target.$el.find('tr[data-ax5grid-tr-data-index="' + target.rowIndex + '"]')
						.addClass(target.before ? 'dnd-row-insert-before' : 'dnd-row-insert-after');
				}
			}
		}).on('mouseup.treeDnd', function(e) {
			if (!pendingDrag && !activeDrag) return;
			var finishedDrag = activeDrag;
			pendingDrag = null;
			activeDrag = null;
			if (!finishedDrag) return;

			suppressClickUntil = Date.now() + 120;
			if (finishedDrag.mode === 'remove') {
				var leftEl = $leftPane[0];
				var overLeft = !!(leftEl && isInsideRect(leftEl.getBoundingClientRect(), e.clientX, e.clientY));
				clearDndVisuals();
				if (overLeft) {
					removeGridRowsByIndices(finishedDrag.targetType, finishedDrag.indices);
				}
				return;
			}

			var target = calcGridDropTarget(e.clientX, e.clientY);
			clearDndVisuals();
			if (target) {
				if (finishedDrag.source === 'appList') {
					appendCandidatesToGrid(finishedDrag.candidates, target.type, target.insertIndex);
					if (finishedDrag.fromSelected && appListgridView && appListgridView.target) {
						appListgridView.target.clearSelect();
					}
				} else {
					appendTreeNodesToGrid(finishedDrag.nodeIds, target.type, target.insertIndex);
					if (finishedDrag.fromSelected) {
						$tree.jstree('deselect_all');
					}
				}
			}
		}).on('keydown.treeDnd', function(e) {
			if (e.key === 'Escape' && (pendingDrag || activeDrag)) {
				pendingDrag = null;
				activeDrag = null;
				clearDndVisuals();
			}
		});

		$(window).off('blur.treeDnd').on('blur.treeDnd', function() {
			pendingDrag = null;
			activeDrag = null;
			clearDndVisuals();
		});
	}

	//결재자 또는 공유자 추가
	function addApproval(_type) {
		if ($("#toggleButton").text() == "결재라인") {
			var userLstTree = $('#userLstTree').jstree('get_selected');
			if(userLstTree.length == 0){
				alert("선택된 데이터가 없습니다.");
				return false;
			}
			appendTreeNodesToGrid(userLstTree, _type);
			$('#userLstTree').jstree("deselect_all");
		} else { //결재자 리스트인경우
			var rows = appListgridView.target.getList("selected");
			var candidates = [];
			rows.forEach(function(row) {
				var cand = appListRowToCandidate(row);
				if (cand) candidates.push(cand);
			});
			appendCandidatesToGrid(candidates, _type);
			appListgridView.target.clearSelect();
		}
	}

	//idx값 max get
	function setIdx(_type) {
		if (_type === "approval" && approvalGrid && approvalGrid.target) {
			var gridList = approvalGrid.target.getList();
			if (gridList && gridList.length > 0) {
				$.each(gridList, function (idx, elem) {
					approvalGrid.target.setValue(idx, "sanctnSn", idx + 1);
					if (!elem.flag) {
						approvalGrid.target.setValue(idx, "flag", "I");
					}
				});
			}
		}
	}

	//Array에서 특정키에 값이 있는지 확인
	function getDupChk(arr, keyName, valueToCheck) {
		return arr.filter(item => item[keyName] === valueToCheck);
	}

	//결재자 또는 공유자 삭제
	function removeApproval(_type) {
		var lastIndex = 0;
		if (_type == "approval") {
			var row = approvalGrid.target.getList("selected");
			for (var i = row.length - 1; i >= 0; i--) {
				lastIndex = row[i].__index;
				approvalData.splice(lastIndex, 1);
			}
			approvalGrid.setData(approvalData);
			approvalGrid.target.focus(lastIndex == 0 ? 0 : lastIndex - 1);
		} else {
			var row = shareGrid.target.getList("selected");
			for (var i = row.length - 1; i >= 0; i--) {
				lastIndex = row[i].__index;
			    shareData.splice(lastIndex, 1);
			}
			shareGrid.setData(shareData);
			shareGrid.target.focus(lastIndex == 0 ? 0 : lastIndex - 1);
		}
	}
	//결재자 공유자 순서 바꾸기(위로, 아래로 순서 변경)
	function arraySort(_type, ascDesc) {
		ascDesc = ascDesc || "+";
		if (_type == "approval") {
			var selectedRows = approvalGrid.target.getList("selected");
			if (!selectedRows || selectedRows.length === 0) return;
			var row = selectedRows[0];
			var indexA = row.__index;
			var indexB = ascDesc == "+" ?  row.__index + 1 : row.__index - 1;
			indexB = indexB > approvalData.length-1 ? approvalData.length-1 : indexB;
			indexB = indexB < 0 ? 0 : indexB;

			var temp = approvalData[indexA];
			approvalData[indexA] = approvalData[indexB];
			approvalData[indexB] = temp;

			approvalGrid.setData(approvalData);
			approvalGrid.target.focus(indexB);
		} else {
			var selectedRows = shareGrid.target.getList("selected");
			if (!selectedRows || selectedRows.length === 0) return;
			var row = selectedRows[0];
			var indexA = row.__index;
			var indexB = ascDesc == "+" ?  row.__index + 1 : row.__index - 1;
			indexB = indexB > shareData.length-1 ? shareData.length-1 : indexB;
			indexB = indexB < 0 ? 0 : indexB;

			var temp = shareData[indexA];
			shareData[indexA] = shareData[indexB];
			shareData[indexB] = temp;

			shareGrid.setData(shareData);
			shareGrid.target.focus(indexB);
		}
	}

	function executeCallback9(){
		var list = approvalGrid.target.getList() || []; //결재그리드

		// 인라인 select DOM 선택값과 그리드 모델 동기화 및 lineType/lineTypeNm 보정
		$('[data-ax5grid="approval-grid"] select.approval-line-type-sel').each(function() {
			onChangeApprovalLineType(this);
		});
		$.each(list, function(idx, item) {
			if (!item.lineType && item.lineTypeNm) {
				item.lineType = lineTypeNmToCode(item.lineTypeNm);
			} else if (!item.lineType) {
				item.lineType = "APPR";
			}
			if (item.lineType === "APPROVAL") item.lineType = "APPR";
			if (item.lineType === "SHARE") item.lineType = "REF";
			if (!item.lineTypeNm && item.lineType) {
				item.lineTypeNm = lineTypeCodeToNm(item.lineType);
			} else if (!item.lineTypeNm) {
				item.lineTypeNm = "결재";
			}
			if (item.lineTypeNm && item.lineType !== lineTypeNmToCode(item.lineTypeNm)) {
				item.lineType = lineTypeNmToCode(item.lineTypeNm);
			}
		});

		// 결재 라인 상세에서 '참조(REF)'로 지정한 항목은 기존 공유결재(공유 라인)로 자동 이관
		var appList = [];
		var movedRefList = [];
		$.each(list, function(idx, item) {
			if (item && item.lineType === "REF") {
				var refCopy = $.extend({}, item, { lineType: "REF", lineTypeNm: "참조" });
				movedRefList.push(refCopy);
			} else if (item) {
				appList.push(item);
			}
		});

		// 동일아이디가 결재라인, 공유라인에 같이 존재하면 공유라인에 있는 자료는 제거처리
		var appIds = {};
		$.each(appList, function(idx, item) {
			var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
			if (uid) {
				appIds[uid] = true;
			}
		});

		var mergedShare = [];
		var shareSeen = {};
		$.each((shareData || []).concat(movedRefList), function(idx, item) {
			var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
			if (uid && !appIds[uid] && !shareSeen[uid]) {
				shareSeen[uid] = true;
				item.lineType = "REF";
				item.lineTypeNm = "참조";
				mergedShare.push(item);
			}
		});
		approvalData = appList;
		shareData = mergedShare;
		approvalGrid.setData(approvalData);
		shareGrid.setData(shareData);

		list = approvalGrid.target.getList() || [];
		var list1 = shareGrid.target.getList() || []; //공유그리드

		if (list.length === 0 && list1.length === 0){
			alert("선택된 공유&결재대상자가 없습니다.");
			return false;
		}

		var hasRetiredUser = list.some(function(item) { return item.useYn === 'N' || item.cm06UseYn === 'N'; }) 
		                  || list1.some(function(item) { return item.useYn === 'N' || item.cm06UseYn === 'N'; });
		if (hasRetiredUser) {
			alert("퇴사자는 선택할 수 없습니다.");
			return false;
		}

		setIdx("approval");
		setIdx("share");

		modalStack.last().callback(approvalGrid, shareGrid);
		modalStack.close();
	}
