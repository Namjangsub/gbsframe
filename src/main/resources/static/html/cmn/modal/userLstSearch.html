<link rel="stylesheet" href="/static/css/ax5/ax5select.css" />
<script src="/static/js/ax5/ax5select.min.js"></script>

<style>
	#userLstTree .jstree-open > .jstree-anchor > .jstree-checkbox,
	#userLstTree .jstree-closed > .jstree-anchor > .jstree-checkbox { display:none; }

    .user-lst-container {
        display: grid;
        grid-template-columns: 45% 10% 45%;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow: hidden;
    }
    .user-lst-container > div {min-width: 0; max-width: 100%; padding: 0 6px; box-sizing: border-box;}
    .user-lst-container > .user-lst-left {grid-column: 1; width: 100%; min-width: 0; overflow: hidden;}
    .user-lst-container > .user-lst-actions {
        grid-column: 2;
        width: 100%;
        min-width: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        box-sizing: border-box;
    }
    /* 우측 결재/공유 그리드: 가용 높이 내 세로 스크롤 허용, 가로스크롤 방지 */
    .user-lst-container > .user-lst-right {
        grid-column: 3;
        width: 100%;
        min-width: 0;
        overflow-y: auto;
        overflow-x: hidden;
        box-sizing: border-box;
        padding-right: 2px;
    }
    .user-lst-right::-webkit-scrollbar {
        width: 6px;
    }
    .user-lst-right::-webkit-scrollbar-thumb {
        background: #bbb;
        border-radius: 3px;
    }
    .user-lst-right::-webkit-scrollbar-track {
        background: #f1f1f1;
    }

    /* main.css의 .contents { min-width: 800px; } 강제 상속 차단 및 컨테이너 내 비율 유지 */
    .user-lst-container .contents {
        min-width: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        box-shadow: none !important;
        border-radius: 0 !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        box-sizing: border-box !important;
    }
    .user-lst-container .treeView,
    .user-lst-container #userLstTree,
    .user-lst-container .appLineView,
    .user-lst-container #appLst,
    .user-lst-right [data-ax5grid] {
        min-width: 0 !important;
        max-width: 100% !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    /* 결재/공유 버튼 각각의 상단 기준 정렬 섹션 */
    .user-lst-action-section {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: flex-start !important;
        width: 100% !important;
        box-sizing: border-box;
    }
    .user-lst-actions .user-lst-btn {
        display: block !important; width: 80px !important; height: 32px !important; line-height: 30px !important;
        margin: 3px 0; padding: 0 4px; text-align: center; font-size: 12px;
        font-weight: bold !important; color: #333 !important; background: #f4f4f4 !important; border: 1px solid #ccc !important;
        border-radius: 4px; text-decoration: none !important; box-sizing: border-box; cursor: pointer !important;
    }
    .user-lst-actions .user-lst-btn:hover, .user-lst-actions .user-lst-btn:focus {
        background-color: #e6e6e6; border-color: #adadad; color: #111; text-decoration: none;
    }
    #commonPopup {text-align: center; padding: 6px 0 2px 0; height: 38px; width: 100%; box-sizing: border-box; clear: both;}

    /* 결재구분 안내 가이드 테이블 */
    .line-type-guide-box {
        margin-bottom: 6px;
        border: 1px solid #dcdcdc;
        border-radius: 4px;
        background: #fbfbfb;
        padding: 4px 6px;
        box-sizing: border-box;
    }
    .line-type-guide-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
        color: #444;
        line-height: 1.35;
    }
    .line-type-guide-table th {
        background: #eaeaea;
        color: #222;
        font-weight: bold;
        text-align: center;
        padding: 2px 4px;
        border: 1px solid #d5d5d5;
        white-space: nowrap;
    }
    .line-type-guide-table td {
        padding: 2px 5px;
        border: 1px solid #e2e2e2;
        background: #fff;
    }
    .line-type-guide-table td.col-name {
        text-align: center;
        font-weight: bold;
        color: #0b58a2;
        background: #fdfdfd;
        white-space: nowrap;
        width: 48px;
    }
</style>


<div class="user-lst-container">
    <div class="user-lst-left">
    	<div style="text-align: left; margin-bottom: 6px; white-space: nowrap; height: 28px; width: 100%; display: flex; align-items: center;">
			<button type="button" class="btn btn-default btn-sm" style="flex: 0 0 62px; height: 28px; padding: 0 2px; font-size: 11px; vertical-align: middle;" id="toggleButton">결재라인</button>
	        <input type="text" class="form-control input-sm" id="nodeName" data-search="searchValue" style="flex: 1 1 auto; min-width: 0; height: 28px; margin: 0 4px; vertical-align: middle;" placeholder="성명/부서 검색" onkeypress="if(event.keyCode == 13){searchUser();}">
	        <a id="search" onclick="searchUser();" style="flex: 0 0 20px; vertical-align: middle; cursor: pointer; text-align: center;"><i class="i_search_w"></i></a>
        </div>
	    <div class="contents" style="text-align: left; margin: 0; padding: 0; width: 100%;">

		      		<div class="ax5_grid" data-ax5grid="appList-grid" data-ax5grid-config="{}" style="width: 100%; height: 100%;"></div>
		     	</div>
			</div>

    </div>
    <div class="user-lst-actions">

         <a class="user-lst-btn" aria-label="결재자 추가" title="결재자 추가" onclick="addApproval('approval');">결재 <i class="fas fa-angle-right"></i></a>
         <a class="user-lst-btn" aria-label="결재자 제거" title="결재자 제거" onclick="removeApproval('approval');">결재 <i class="fas fa-angle-left"></i></a>

    	<div class="user-lst-action-section share-action-sec">

         <a class="user-lst-btn" aria-label="공유자 제거" title="공유자 제거" onclick="removeApproval('share');">공유 <i class="fas fa-angle-left"></i></a>
        </div>
    </div>
    <div class="user-lst-right">
        <div class="contents" style="margin: 0; padding: 0; width: 100%;">
            <!-- 결재구분 참고 가이드 -->
            <div class="line-type-guide-box">
                <table class="line-type-guide-table">
                    <thead>
                        <tr>
                            <th style="width: 50px;">구분</th>
                            <th>의미(일반)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="col-name">결재</td>

                </table>
            </div>

            <div class="approval-header-sec">
                <h3 class="location" style="display: flex; justify-content: space-between; align-items: center; margin: 0 0 4px 0; height: 26px;">
                    <span class="page_tit" style="font-size: 13px; font-weight: bold; color: #222;">결재 라인 상세</span>
                    <div class="add_btn_small" style="display: flex; align-items: center;">
                        <a onclick="arraySort('approval', '-');" style="height: 24px; line-height: 24px; width: 26px; padding: 0;" title="위로"><i class="fas fa-angle-up"></i></a>
                        <a onclick="arraySort('approval', '+');" style="height: 24px; line-height: 24px; width: 26px; padding: 0; margin-left: 3px;" title="아래로"><i class="fas fa-angle-down"></i></a>
                    </div>

            <div data-ax5grid="approval-grid" data-ax5grid-config="{}" style="width: 100%;"></div>

            <div class="share-header-sec">
                <h3 class="location" style="display: flex; justify-content: space-between; align-items: center; margin: 6px 0 4px 0; height: 26px;">
                    <span class="page_tit" style="font-size: 13px; font-weight: bold; color: #222;">공유 라인 상세</span>
                    <div class="add_btn_small" style="display: flex; align-items: center;">
                        <a onclick="arraySort('share', '-');" style="height: 24px; line-height: 24px; width: 26px; padding: 0;" title="위로"><i class="fas fa-angle-up"></i></a>
                        <a onclick="arraySort('share', '+');" style="height: 24px; line-height: 24px; width: 26px; padding: 0; margin-left: 3px;" title="아래로"><i class="fas fa-angle-down"></i></a>

</div>
<div id="commonPopup">
	<div>
		<button type="button" class="btn btn-primary btn-sm" style="min-width: 70px; height: 30px;" onclick="executeCallback9();"><i class="fa fa-check"></i> 선택</button>
		<button type="button" class="btn btn-default btn-sm" style="min-width: 70px; height: 30px; margin-left: 8px;" onclick="modalStack.close();"><i class="fa fa-times"></i> 닫기</button>
	</div>
</div>

<script type="text/javascript">
	approvalData =[];
	shareData =[];
	var modal_userId = null;

	// 호출 프로그램 ID(pgmId) 기준 결재구분(합의/협조/후결) 변경 가능 여부 (PM51, PM07, PM08, CR02만 가능)
	function isLineTypeEditable() {
		var pgmId = "";
		if (modalStack.last() && modalStack.last().paramObj && modalStack.last().paramObj.pgmId) {
			pgmId = String(modalStack.last().paramObj.pgmId).toUpperCase();
		}
		return (pgmId.indexOf("PM51") !== -1 || pgmId.indexOf("PM07") !== -1 || pgmId.indexOf("PM08") !== -1 || pgmId.indexOf("CR02") !== -1);
	}

	// 결재구분 코드 <-> 명칭 매핑 (저장값은 실제 코드 APPR/AGREE/COOP/POST/REF)
	function lineTypeNmToCode(nm) {
		if (nm === "합의") return "AGREE";
		if (nm === "협조") return "COOP";
		if (nm === "후결") return "POST";
		if (nm === "참조" || nm === "공유") return "REF";
		return "APPR"; // 결재/기타
	}
	function lineTypeCodeToNm(code) {
		if (code === "AGREE") return "합의";
		if (code === "COOP") return "협조";
		if (code === "POST") return "후결";
		if (code === "REF" || code === "SHARE") return "참조";
		return "결재"; // APPR/APPROVAL/기타
	}

	function cm06UseYnGridColor(dataValue) {
		let rtnColor = "";
		let row = dataValue.item;
		if (row.cm06UseYn == "N") {
			rtnColor = "grid-cell-orange";
		}
		return rtnColor;
	}

	// 결재 라인 상세 구분 select 에디터 (isLineTypeEditable 일 때만 변경 가능, ax5select 플러그인 로드 검증)
	var lineTypeEditorConfig = (isLineTypeEditable() && typeof $.fn.ax5select === "function") ? {
		type: "select",
		config: {
			columnKeys: { optionValue: "value", optionText: "text" },
			options: [
				{ value: "결재", text: "결재" },
				{ value: "합의", text: "합의" },
				{ value: "협조", text: "협조" },
				{ value: "후결", text: "후결" }
			]
		}
	} : false;

	// 공통 히든 컬럼
	var baseHiddenColumns = [
		{key: "id", 	label: "ID", 	align: "center", width: 80, 	hidden:true},
        {key: "todoKey", 	label: "todoKey", 	align: "center", width: 100, 	hidden:true},
        {key: "sanctnSn", 	label: "sanctnSn", 	align: "center", width: 100, 	hidden:true},
        {key: "sanctnSttus", 	label: "sanctnSttus", 	align: "center", width: 100, 	hidden:true},
        {key: "todoCfDt", 	label: "todoCfDt", 	align: "center", width: 100, 	hidden:true},
        {key: "todoCfOpn", 	label: "todoCfOpn", 	align: "center", width: 100, 	hidden:true},
        {key: "lineType", 	label: "구분코드", 	align: "center", width: 80, 	hidden:true}
	];
	var baseVisibleColumns = [
        {key: "text", 	label: "성명", 	align: "center", width: 90},
        {key: "parent", label: "직책", 	align: "center", width: 90},
        {key: "deptNm", label: "부서", 	align: "left",   width: "*"},
        {key: "flag", 	label: "flag", 	align: "center", width: 100, 	hidden:true},
        {key: "coCd", 	label: "coCd", 	align: "center", width: 100, 	hidden:true},
        {key: "useYn", 	label: "useYn", 	align: "center", width: 100, 	hidden:true}
	];
	// 결재 라인: 구분 select 편집 가능
	var approvalColumns = baseHiddenColumns.concat([
		{key: "lineTypeNm", label: "구분", align: "center", width: 80, editor: lineTypeEditorConfig}
	]).concat(baseVisibleColumns);
	// 공유 라인: 구분은 항상 참조(편집 불가)
	var shareColumns = baseHiddenColumns.concat([
		{key: "lineTypeNm", label: "구분", align: "center", width: 80}
	]).concat(baseVisibleColumns);

	var approvalGrid = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber: true,
				lineNumberColumnWidth: 30,
				showRowSelector: true,
				multipleSelect: true,
				sortable: false,
				target: $('[data-ax5grid="approval-grid"]'),
				header: {
					align: "center",
					selector: true
				},
				body: {
					onClick: function () {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
					},
					onDataChanged: function () {
						// 구분(명칭) 변경 시 히든 코드(lineType)만 동기화. 명칭은 사용자 선택 유지(값 사라짐 방지)
						if (this.key === "lineTypeNm") {
							this.self.setValue(this.dindex, "lineType", lineTypeNmToCode(this.item.lineTypeNm));
						}
					},
				},
				columns : approvalColumns,
			});
			return this;
		},
		setData: function(_list) {
			var target = this.target;
			var list = _list || [];
			target.setData({
				list : list,
				page : {
					totalElements : list.length
				}
			});
			applyDynamicHeight();
			setTimeout(function() { try { target.align(); } catch (e) {} }, 60);
		}
	}

	var shareGrid = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber: true,
				lineNumberColumnWidth: 30,
				showRowSelector: true,
				multipleSelect: true,
				sortable: false,
				target: $('[data-ax5grid="share-grid"]'),
				header: {
					align: "center",
					selector: true
				},
				body: {
					onClick: function () {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
					},
					onDataChanged: function () {
					},
				},
				columns : shareColumns,
			});
			return this;
		},
		setData: function(_list) {
			var target = this.target;
			var list = _list || [];
			target.setData({
				list : list,
				page : {
					totalElements : list.length
				}
			});
			applyDynamicHeight();
			setTimeout(function() { try { target.align(); } catch (e) {} }, 60);
		}
	}

	var appListgridView = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showRowSelector: true,
				multipleSelect: true,
				sortable: false,
				target: $('[data-ax5grid="appList-grid"]'),
				header: {
					align: "center",
					selector: true
				},
				body: {
					mergeCells : ["appLineNm"],
					onClick: function() {
						if (this.column.key === "appLineNm") {
							var selfGrid = this.self;
							var clickedLineNm = this.item.appLineNm;
							if (clickedLineNm) {
								selfGrid.list.forEach(function(row, index) {
									if (row.appLineNm === clickedLineNm) {
										selfGrid.select(index);
									}
								});
							}
						} else {
							this.self.select(this.dindex);
						}
					},
					onDBLClick: function () {
					},
				},
				page: {
					navigationItemCount: 9,
					height: 30,
					display: false,
				},
				columns: [
					{key: "appNo",      			label: "결재선번호",      align: "center",   width: 80, hidden: true},
					{key: "appSeq",      			label: "결재순번",      align: "center",   width: 80, hidden: true},
					{key: "appDiv",    			label: "결재선구분",      align: "center",   width: 120, hidden: true},
					{key: "appDivNm",    			label: "결재선구분",      align: "center",   width: 120, hidden: true},
					{key: "appLineNm",      		label: "결재선",      align: "left",   width: 75},
					{key: "appId",      			label: "결재자",      align: "center",   width: 80, hidden: true},
					{key: "cm06UseYn",      		label: "아이디사용여부",   hidden: true},
					{key: "appUserNm",      		label: "성명",      align: "center",   width: 60,  styleClass: function () {return cm06UseYnGridColor(this);}},
					{key: "levelNm",      		label: "직급",      align: "center",   width: 55,  styleClass: function () {return cm06UseYnGridColor(this);}},
					{key: "deptNm",      			label: "부서",      align: "left",     width: "*", styleClass: function () {return cm06UseYnGridColor(this);}},
					{key: "coCd",      			label: "coCd",      align: "center",   width: 80, hidden: true},
				]
			});
			return this;
		},
		setData: function(_pageNo) {
			var targetObj = this.target;
			var paramObj = {
				"userId" : (modal_userId || jwt.userId),
				"userNm" : "",
				"appNo" : "",
				"appId" : "",
				"recordCnt" : 99999
			};
			postAjax("/user/bm/bm13/selectApprovalList", paramObj, null, function(data) {
				var list = (data && data.resultList) ? data.resultList : [];
				targetObj.setData({
					list : list,
					page : {
						totalElements : list.length
					}
				});
				applyDynamicHeight();
				setTimeout(function() {
					try { targetObj.align(); } catch (e) {}
				}, 60);
			});
		}
	}

	// 결재/공유 항목의 결재구분 기본값 정규화 (레거시 APPROVAL/SHARE 포함)
	function normalizeLineType(item, defaultCode) {
		var code = item.lineType;
		if (code === "APPROVAL") code = "APPR";
		if (code === "SHARE") code = "REF";
		if (!code) code = defaultCode;
		item.lineType = code;
		item.lineTypeNm = lineTypeCodeToNm(code);
		return item;
	}

	// 그리드 행 수 취득 헬퍼 함수
	function getGridRowCount(gridObj, dataArr) {
		var cnt = 0;
		if (gridObj && gridObj.target && gridObj.target.list) {
			cnt = Math.max(cnt, gridObj.target.list.length);
		}
		if (dataArr && dataArr.length) {
			cnt = Math.max(cnt, dataArr.length);
		}
		return cnt;
	}

	// AX5-Grid 높이 반영 헬퍼 함수
	function setAx5GridHeight(gridObj, $selector, height) {
		$selector.css('height', height + 'px');
		if (gridObj && gridObj.target && typeof gridObj.target.setHeight === 'function') {

	function executeDynamicHeight() {
		var $container = $('.user-lst-container');
		var bodyH = 0;

		// 1) ax5modal 내부 실제 가용 바디 높이 탐색
		var $bodyFrame = $container.closest('[data-ax-body="body-frame"]');
		if ($bodyFrame.length && $bodyFrame.height() > 100) {
			bodyH = $bodyFrame.height();
		} else {
			var $modalBody = $container.closest('.ax-modal-body');
			if ($modalBody.length && $modalBody.height() > 100) {
				bodyH = $modalBody.height();
			} else {
				var lastModal = (typeof modalStack !== 'undefined') ? modalStack.last() : null;
				if (lastModal && lastModal.target && lastModal.target.config && lastModal.target.config.height) {
					bodyH = parseInt(lastModal.target.config.height, 10) - 40;
				} else {
					var $modal = $container.closest('.ax5modal');
					if ($modal.length && $modal.height() > 100) {
						bodyH = $modal.height() - 40;
					}
				}
			}
		}

		if (!bodyH || bodyH < 250) {
			bodyH = 460;
		}

		// 하단 버튼 영역(#commonPopup 38px) 제외 가용 높이를 꽉 채움
		var availTotalH = Math.max(bodyH - 42, 350);

		// 좌측: 검색바(28px + margin-bottom 6px = 34px)
		var treeH = availTotalH - 34;

		// 1. 자료 행 수 정확 감지
		var apprRowCount = getGridRowCount(approvalGrid, approvalData);
		var shareRowCount = getGridRowCount(shareGrid, shareData);

		// 2. 자료 건수에 따른 높이 계산 (헤더 29px + 행당 27px + 패딩/보더 27px = 기본 여유 56px)
		var apprContentH = (apprRowCount * 27) + 56;
		var shareContentH = (shareRowCount * 27) + 56;

		// 3. 기본 크기(결재 135px, 공유 85px)를 최소 보장하면서, 자료가 많아지면 행 수에 비례하여 즉시 자동 확장
		var finalApprH = Math.max(135, apprContentH);
		var finalShareH = Math.max(85, shareContentH);

		// 좌측 영역 높이 적용
		$('#userLstTree').css('height', treeH + 'px');
		$('#appLst').css('height', treeH + 'px');
		setAx5GridHeight(appListgridView, $('[data-ax5grid="appList-grid"]'), treeH);

		// 우측 영역 높이 제한: 모달 가용 높이 내에서 스크롤되도록 설정 (자료가 많아져 그리드가 늘어난 만큼 우측 스크롤 발생)
		$('.user-lst-right').css({
			'height': availTotalH + 'px',
			'max-height': availTotalH + 'px',
			'overflow-y': 'auto',
			'overflow-x': 'hidden'
		});

		// 결재/공유 그리드 높이 적용
		setAx5GridHeight(approvalGrid, $('[data-ax5grid="approval-grid"]'), finalApprH);
		setAx5GridHeight(shareGrid, $('[data-ax5grid="share-grid"]'), finalShareH);

		// 중앙 결재/공유 버튼 위치 정렬 (결재/공유 헤더 위치에 맞춰 자연스럽게 배치)
		var guideH = $('.line-type-guide-box').outerHeight(true) || 0;
		var appBtnTop = Math.max(0, guideH + 10);
		$('.approval-action-sec').css({
			'height': 'auto',
			'padding-top': appBtnTop + 'px'
		});
		$('.share-action-sec').css({
			'height': 'auto',
			'padding-top': '20px'
		});

		setTimeout(function() {
			try { if (approvalGrid && approvalGrid.target) approvalGrid.target.align(); } catch(e) {}
			try { if (shareGrid && shareGrid.target) shareGrid.target.align(); } catch(e) {}
			try { if (appListgridView && appListgridView.target) appListgridView.target.align(); } catch(e) {}
		}, 30);
	}

	// 트리 초기화
	function initUserLstTree() {
		$("#userLstTree").jstree("destroy");
		$("#userLstTree").jstree(
		{
			"plugins": ['types', 'checkbox', 'search', 'sort'],
			"core": {
				"multiple": true,
				"data": setuserLstTree(),
				"dblclick_toggle": false
			},
			"types": {
				"person": {"icon" : "glyphicon glyphicon-user"},
				"unit": {
					"icon": "glyphicon glyphicon-folder-close"
				},
				"unit-open": {
					"icon": "glyphicon glyphicon-folder-open"
				}
			},
			"checkbox": {
		    	"keep_selected_style": false,
		    	"three_state": false
		    },
		    "search": {
		      	show_only_matches: false
		    },
		    "sort": function(a, b){
		    	var nodeA = this.get_node(a);
		    	var nodeB = this.get_node(b);
		    	if(nodeA.original.type=="person" && nodeB.original.type=="unit"){

		    	}

		}).on('dblclick.jstree', function(e, data) {
			var $target = $(e.target || (window.event && window.event.target));
			var $node = $target.closest("li");
			var nodeId = $node.attr("id");
			if (!nodeId) return;

			var tree = $('#userLstTree').jstree(true);
			var nodeObj = tree.get_node(nodeId);
			if (!nodeObj) return;

			if (nodeObj.original && nodeObj.original.type === 'person') {
				// 사원 더블클릭: 해당 사원을 선택 후 결재 라인에 추가 (모달 닫힘 방지)
				tree.deselect_all();

				addApproval('approval');
			} else {
				// 부서 더블클릭: 하위 노드 펼치기/접기 토글
				tree.toggle_node(nodeObj);
			}

			data.instance.set_type(data.node, 'unit-open');

		});
	}

	// 팀원(person)이 없는 빈 부서(unit) 필터링 제거 함수
	function filterEmptyDeptTree(treeList) {
		if (!treeList || !treeList.length) return [];

		var personNodes = [];
		var unitMap = {};
		treeList.forEach(function(node) {
			if (node.type === 'person') {
				if (node.useYn !== 'N') {
					personNodes.push(node);
				}
			} else {
				unitMap[node.id] = node;
			}
		});

		// 팀원이 있는 부서 및 그 상위 부서 추적 마킹
		var activeDeptIds = {};
		personNodes.forEach(function(person) {
			var deptId = person.parent;
			while (deptId && deptId !== '#' && unitMap[deptId]) {
				activeDeptIds[deptId] = true;
				deptId = unitMap[deptId].parent;
			}
		});

		// 팀원이 존재하는 부서 및 팀원 노드만 필터링하여 반환
		return treeList.filter(function(node) {
			if (node.type === 'person') {
				return activeDeptIds[node.parent] === true;
			} else {
				return activeDeptIds[node.id] === true;
			}
		});
	}

	//결재자 또는 공유자 추가
	function addApproval(_type) {
		let duplicates = [];
		let hasRetired = false;
		if ($("#toggleButton").text() == "결재라인") {
			var userLstTree = $('#userLstTree').jstree('get_selected');
			if(userLstTree.length == 0){

			}
			let sanctnSn = 1;
			userLstTree.forEach(function(nodeId) {
			    var node = $('#userLstTree').jstree(true).get_node(nodeId);

				if (node.original.type != 'person'){
					return
				}

				if (node.original.useYn === 'N') {
					hasRetired = true;
					return;
				}

	  			var nodeInfo = {};
	  			if (_type == "approval") {
	  				duplicates = getDupChk(approvalData, 'id', nodeId);
	  			} else {
	  				duplicates = getDupChk(shareData, 'id', nodeId);
	  			}

	  			if (duplicates.length) {
	  			} else {
			  		nodeInfo.id	= nodeId;
		  			nodeInfo.text	= node.text;
		  			nodeInfo.parent	= node.original.levelNm;
		  			nodeInfo.deptNm	= node.original.deptNm;
		  			nodeInfo.telNo	= node.original.telNo;
		  			nodeInfo.offTelNo	= node.original.offTelNo;
		  			nodeInfo.email	= node.original.email;
		  			nodeInfo.coCd	= node.original.coCd;
		  			nodeInfo.useYn	= node.original.useYn || 'Y';
		  			nodeInfo.sanctnSn	= sanctnSn;
		  			if (_type == "approval") {
		  				nodeInfo.lineType = "APPR";
		  				nodeInfo.lineTypeNm = "결재";
		  				approvalData.push(nodeInfo);
		  			} else {
		  				var isAlreadyInApproval = approvalData.some(function(item) {
		  					var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
		  					return uid === nodeId;
		  				});
		  				if (!isAlreadyInApproval) {
		  					nodeInfo.lineType = "REF";
		  					nodeInfo.lineTypeNm = "참조";
		  					shareData.push(nodeInfo);
		  				}
		  			}
		  			sanctnSn++;
	  			}
			});

		} else { //결재자 리스트인경우
			var rows = appListgridView.target.getList("selected");
			let sanctnSn = 1;
			rows.forEach(function(row) {
				if (row.cm06UseYn === 'N') {
					hasRetired = true;
					return;
				}

	  			var nodeInfo = {};
	  			if (_type == "approval") {
	  				duplicates = getDupChk(approvalData, 'id', row.appId);
	  			} else {
	  				duplicates = getDupChk(shareData, 'id', row.appId);
	  			}

	  			if (duplicates.length) {
	  			} else {
		  			nodeInfo.id	= row.appId;
		  			nodeInfo.text	= row.appUserNm;
		  			nodeInfo.parent	= row.levelNm;
		  			nodeInfo.deptNm	= row.deptNm;
		  			nodeInfo.telNo	= row.telNo;
		  			nodeInfo.offTelNo	= row.offTelNo;
		  			nodeInfo.email	= row.email;
		  			nodeInfo.coCd	= row.coCd;
		  			nodeInfo.useYn	= row.cm06UseYn || 'Y';

		  			if (_type == "approval") {
		  				nodeInfo.lineType = "APPR";
		  				nodeInfo.lineTypeNm = "결재";
		  				approvalData.push(nodeInfo);
		  			} else {
		  				var isAlreadyInApproval = approvalData.some(function(item) {
		  					var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
		  					return uid === row.appId;
		  				});
		  				if (!isAlreadyInApproval) {
		  					nodeInfo.lineType = "REF";
		  					nodeInfo.lineTypeNm = "참조";
		  					shareData.push(nodeInfo);
		  				}
		  			}
		  			nodeInfo.sanctnSn	= sanctnSn;
		  			sanctnSn++;
	  			}
			});
			appListgridView.target.clearSelect();
		}

		if (hasRetired) {
			alert("퇴사자가 존재합니다.");
		}

		// 결재선에 동일 ID가 추가되었으면 공유선에서 자동 제거
		if (_type == "approval") {
			var appIds = {};
			approvalData.forEach(function(item) {
				var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
				if (uid) appIds[uid] = true;
			});
			var prevShareLen = shareData.length;
			shareData = shareData.filter(function(item) {
				var uid = item ? (item.id || item.usrNm || item.todoId || item.empNo) : null;
				return !uid || !appIds[uid];
			});

		} else {

		}

	//Array에서 특정키에 값이 있는지 확인
	function getDupChk(arr, keyName, valueToCheck) {
		return arr.filter(item => item[keyName] === valueToCheck);
	}

	//결재자 또는 공유자 삭제
	function removeApproval(_type) {
		var lastIndex = 0;
		if (_type == "approval") {
			var row = approvalGrid.target.getList("selected");
			for (var i = row.length - 1; i >= 0; i--) {
				lastIndex = row[i].__index;
				approvalData.splice(lastIndex, 1);
			}
			approvalGrid.setData(approvalData);
			approvalGrid.target.focus(lastIndex == 0 ? 0 : lastIndex - 1);
		} else {
			var row = shareGrid.target.getList("selected");
			for (var i = row.length - 1; i >= 0; i--) {
				lastIndex = row[i].__index;
			    shareData.splice(lastIndex, 1);
			}
			shareGrid.setData(shareData);
			shareGrid.target.focus(lastIndex == 0 ? 0 : lastIndex - 1);
		}
	}
	//결재자 공유자 순서 바꾸기(위로, 아래로 순서 변경)
	function arraySort(_type, ascDesc) {
		ascDesc = ascDesc || "+";
		if (_type == "approval") {
			var selectedRows = approvalGrid.target.getList("selected");
			if (!selectedRows || selectedRows.length === 0) return;
			var row = selectedRows[0];
			var indexA = row.__index;
			var indexB = ascDesc == "+" ?  row.__index + 1 : row.__index - 1;
			indexB = indexB > approvalData.length-1 ? approvalData.length-1 : indexB;
			indexB = indexB < 0 ? 0 : indexB;

			var temp = approvalData[indexA];
			approvalData[indexA] = approvalData[indexB];
			approvalData[indexB] = temp;

			approvalGrid.setData(approvalData);
			approvalGrid.target.focus(indexB);
		} else {
			var selectedRows = shareGrid.target.getList("selected");
			if (!selectedRows || selectedRows.length === 0) return;
			var row = selectedRows[0];
			var indexA = row.__index;
			var indexB = ascDesc == "+" ?  row.__index + 1 : row.__index - 1;
			indexB = indexB > shareData.length-1 ? shareData.length-1 : indexB;
			indexB = indexB < 0 ? 0 : indexB;

			var temp = shareData[indexA];
			shareData[indexA] = shareData[indexB];
			shareData[indexB] = temp;

			shareGrid.setData(shareData);
			shareGrid.target.focus(indexB);
		}
	}

	function executeCallback9(){

		// 동일아이디가 결재라인, 공유라인에 같이 존재하면 공유라인에 있는 자료는 제거처리

		// 결재선 lineType, lineTypeNm 무결성 보정
		$.each(list, function(idx, item) {
			if (!item.lineType && item.lineTypeNm) {
				item.lineType = lineTypeNmToCode(item.lineTypeNm);
			} else if (!item.lineType) {
				item.lineType = "APPR";
			}
			if (!item.lineTypeNm && item.lineType) {
				item.lineTypeNm = lineTypeCodeToNm(item.lineType);
			} else if (!item.lineTypeNm) {
				item.lineTypeNm = "결재";
			}
			if (item.lineTypeNm && item.lineType !== lineTypeNmToCode(item.lineTypeNm)) {
				item.lineType = lineTypeNmToCode(item.lineTypeNm);
			}
		});

		modalStack.last().callback(approvalGrid, shareGrid);
		modalStack.close();
	}
</script>
