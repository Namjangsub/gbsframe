<script type="text/javascript">
	var currentDocDetail = null;
	var currentCoCd = null;

	// 모달 닫기 공통 처리 (윈도우 리사이즈 이벤트 해제 및 콜백 전달)
	function closeApprovalDetailModal(result) {
		$(window).off('resize.am1201p01');
		if (typeof modalStack !== 'undefined' && modalStack.last && modalStack.last()) {
			var curModal = modalStack.last();
			if (typeof curModal.callback === 'function') {
				try {
					curModal.callback(result || "승인완료");
				} catch(e) {
					console.warn("modal callback execution failed:", e);
				}
			}
		}
		modalStack.close();
	}

	// 팝업 크기가 브라우저 뷰포트보다 클 경우 화면 밖으로 넘치지 않도록 자동 조정
	function adjustApprovalDetailModalSize() {
		try {
			if (typeof modalStack !== 'undefined' && modalStack.last && modalStack.last()) {
				var curModal = modalStack.last();
				if (curModal && curModal.target) {
					var winH = $(window).height();
					var winW = $(window).width();
					var modalH = Math.min(840, winH - 40);
					var modalW = Math.min(980, winW - 30);
					if (modalH > 0 && modalW > 0) {
						if (typeof curModal.target.css === 'function') {
							curModal.target.css({ width: modalW, height: modalH });
						} else if (curModal.target.$ && curModal.target.$["dialog"]) {
							curModal.target.$["dialog"].css({ width: modalW, height: modalH });
						}
					}
				}
			}
		} catch (e) {
			console.warn("adjustApprovalDetailModalSize failed:", e);
		}
	}

	$(document).ready(function() {
		adjustApprovalDetailModalSize();
		$(window).on('resize.am1201p01', adjustApprovalDetailModalSize);

		var param = (modalStack.last && modalStack.last()) ? (modalStack.last().paramObj || {}) : {};
		currentCoCd = param.coCd || jwt.coCd || "GUN";

		if (param.docId) {
			$('#detailForm').find('#docId').val(param.docId);
			loadDocDetail(param.docId);
		} else if (param.todoNo || param.erpBizKey || param.todoKey) {
			var searchParam = {
				erpBizKey: param.erpBizKey || param.todoNo || "",
				todoKey: param.todoKey || "",
				todoDiv2CodeId: param.todoDiv2CodeId || "",
				coCd: currentCoCd,
				userId: jwt.userId
			};
			postAjax("/user/am/am12/selectDocIdByBizKey", searchParam, null, function(res) {
				if (res && res.resultCode === '200' && res.docId) {
					$('#detailForm').find('#docId').val(res.docId);
					loadDocDetail(res.docId);
				} else {
					alert("해당 업무와 연계된 전자결재 문서를 찾을 수 없습니다.");
					closeApprovalDetailModal();
				}
			});
		}
	});

	// 문서 상세 데이터 로드
	function loadDocDetail(docId) {
		postAjax("/user/am/am12/selectApprovalDocDetail", { docId: docId, coCd: currentCoCd || jwt.coCd || "GUN" }, null, function(data) {
			if (!data || data.resultCode !== '200') {
				alert(data ? data.resultMessage : "문서 로드 실패");
				closeApprovalDetailModal();
				return;
			}
			currentDocDetail = data;
			renderDocInfo(data.docInfo);
			renderLineFlow(data.lineList, data.docInfo);
			renderHistory(data.histList);
			checkUserApprovalAuthority(data.docInfo, data.lineList);
		});
	}

	// 기본 헤더 및 본문 렌더링
	function renderDocInfo(doc) {
		$('#viewDocNo').text(doc.docNo || "-");
		$('#viewDocTitle').text(doc.docTitle || "-");
		$('#viewFormNm').text(doc.formNm || "-");
		$('#viewDraUserNm').text(doc.draUserNm || "-");
		$('#viewDraDeptNm').text(doc.draDeptNm || "-");
		$('#viewDraLevelNm').text(doc.draLevelNm || "-");
		$('#viewDraftDt').text(doc.draftDt || "-");

		var badgeHtml = (typeof gbsFormatApprovalStatus === 'function')
				? gbsFormatApprovalStatus({
					stsCd: doc.docStatus,
					stsNm: doc.docStatusNm,
					value: doc.docStatusNm || doc.docStatus
				})
				: null;

		if (badgeHtml) {
			$('#viewStatusBadge').replaceWith($(badgeHtml).attr('id', 'viewStatusBadge').css('margin-left', '8px'));
		} else {
			var statusCls = "default";
			if (doc.docStatus === 'REQUEST') statusCls = "secondary";
			else if (doc.docStatus === 'PROGRESS') statusCls = "success";
			else if (doc.docStatus === 'POST_PROGRESS') statusCls = "warning";
			else if (doc.docStatus === 'COMPLETED') statusCls = "primary";
			else if (doc.docStatus === 'REJECTED') statusCls = "danger";
			else if (doc.docStatus === 'CANCELLED') statusCls = "warning";

			var statusName = doc.docStatusNm;
			if (!statusName || /^[A-Za-z0-9_]+$/.test(statusName)) {
				if (doc.docStatus === 'REQUEST') statusName = "상신";
				else if (doc.docStatus === 'PROGRESS') statusName = "진행중";
				else if (doc.docStatus === 'POST_PROGRESS') statusName = "후결진행";
				else if (doc.docStatus === 'COMPLETED') statusName = "최종완료";
				else if (doc.docStatus === 'REJECTED') statusName = "반려";
				else if (doc.docStatus === 'CANCELLED') statusName = "상신취소";
				else statusName = "-";
			}

			var $badge = $('#viewStatusBadge')
				.removeClass()
				.addClass('label label-' + statusCls)
				.text(statusName);
			if (doc.docStatus === 'REQUEST' || statusName === '상신') {
				$badge.css({ 'background-color': '#546e7a', 'color': '#ffffff' });
			}
		}

		// 본문 HTML 주입
		if (doc.docRenderHtml && doc.docRenderHtml.trim().length > 0) {
			var renderHtml = cleanVacationRenderHtml(doc.docRenderHtml, doc);
			$('#viewRenderedHtml').html(renderHtml);
		} else {
			$('#viewRenderedHtml').html('<div class="text-muted" style="text-align:center;">본문 내용이 없습니다.</div>');
		}

		// 원천문서 조회 링크 표시
		if (doc.erpBizKey) {
			var linkHtml = '<a href="javascript:void(0)" id="viewSourceDocLink" style="font-size:12px; color:#1565c0; text-decoration:underline;">📄 원천문서 조회</a>';
			$('#viewSourceLinkArea').html(linkHtml);
		} else {
			$('#viewSourceLinkArea').empty();
		}
	}

	// 휴가신청서 및 출장신청서 본문 HTML 정제 헬퍼 (신청일자 공백 보정, 휴가유형 정제)
	function cleanVacationRenderHtml(html, doc) {
		if (!html) return html;
		try {
			// 출장신청서/복명서 신청일자/복명일자 공백 및 기형 포맷(2026--0-9- 등) 자동 정제
			html = html.replace(/(<th[^>]*>\s*(신청일자|복명일자)\s*<\/th>\s*<td[^>]*>)([\s\S]*?)(<\/td>)/i, function(match, p1, label, rawText, p3) {
				var text = $.trim(rawText);
				var clean = text.replace(/[^0-9]/g, '');
				if (clean.length >= 8) {
					return p1 + clean.substring(0, 4) + '-' + clean.substring(4, 6) + '-' + clean.substring(6, 8) + p3;
				}
				var fallbackDate = '';
				var docData = null;
				if (doc && doc.docDataJson) {
					try {
						docData = (typeof doc.docDataJson === 'string') ? JSON.parse(doc.docDataJson) : doc.docDataJson;
					} catch(e) {}
				}
				if (docData) {
					var d = docData.reqDt || docData.rptDt || docData.creatDttm;
					if (d) {
						var cleanD = String(d).replace(/[^0-9]/g, '').trim();
						if (cleanD.length >= 8) {
							fallbackDate = cleanD.substring(0, 4) + '-' + cleanD.substring(4, 6) + '-' + cleanD.substring(6, 8);
						}
					}
				}
				if (!fallbackDate && doc && doc.draftDt) {
					var cleanDraft = String(doc.draftDt).replace(/[^0-9]/g, '').trim();
					if (cleanDraft.length >= 8) {
						fallbackDate = cleanDraft.substring(0, 4) + '-' + cleanDraft.substring(4, 6) + '-' + cleanDraft.substring(6, 8);
					}
				}
				if (fallbackDate) {
					return p1 + fallbackDate + p3;
				}
				return match;
			});

			return html.replace(/(<th[^>]*>\s*휴가유형\s*<\/th>\s*<td[^>]*>)([\s\S]*?)(<\/td>)/i, function(match, p1, rawText, p3) {
				var text = $.trim(rawText);
				var baseNm = text.replace(/\s*\(.*$/, '').trim() || text;

				var ampmLabel = '';
				var docData = null;
				if (doc && doc.docDataJson) {
					try {
						docData = (typeof doc.docDataJson === 'string') ? JSON.parse(doc.docDataJson) : doc.docDataJson;
					} catch(e) {}
				}
				if (docData) {
					var ac = docData.ampmCd || docData.ampm || '';
					var an = docData.ampmNm || '';
					if (an.indexOf('오전') !== -1 || ac === 'PM07AMPM01' || ac === 'PM07AMPM10' || ac === 'AM') {
						ampmLabel = '오전';
					} else if (an.indexOf('오후') !== -1 || ac === 'PM07AMPM02' || ac === 'PM07AMPM20' || ac === 'PM') {
						ampmLabel = '오후';
					}
				}
				if (!ampmLabel) {
					if (text.indexOf('오전') !== -1 && text.indexOf('오후') === -1) {
						ampmLabel = '오전';
					} else if (text.indexOf('오후') !== -1 && text.indexOf('오전') === -1) {
						ampmLabel = '오후';
					} else if (docData && docData.stTm) {
						var stHour = parseInt(String(docData.stTm).replace(':', ''), 10);
						if (stHour < 1200) ampmLabel = '오전';
						else ampmLabel = '오후';
					}
				}

				var isHalf = (baseNm.indexOf('반차') !== -1)
					|| (docData && (docData.vacTypeCd === 'PM07TYPE02' || docData.vacTypeCd === 'PM07TYPE08' || docData.vacTypeCd === 'PM07TYPE12'));

				var resultNm = baseNm;
				if (isHalf && ampmLabel) {
					resultNm = baseNm + ' (' + ampmLabel + ')';
				}
				return p1 + resultNm + p3;
			});
		} catch (e) {
			return html;
		}
	}

	// 결재자 권한 및 버튼 노출 판정 (후결 단계 포함)
	function checkUserApprovalAuthority(doc, lineList) {
		var isMyTurn = false;
		var isMyArbit = false;
		$('#btnCancelArbit').hide();
		$('#btnCancelDraft').hide();
		$('#btnChangeLine').hide();
		$('.appr-action-btn').hide();
		var docId = doc.docId;
		var currLineSeq = Number(doc.currLineSeq || 0);
		$.each(lineList || [], function(idx, line) {
			if (line.arbitYn === 'Y' && (line.actualUserId === jwt.userId || line.approverId === jwt.userId)) {
				isMyArbit = true;
				return false;
			}
		});
		if (isMyArbit) $('#btnCancelArbit').show();

		// 1. 진행 중인 문서인지 확인 (REQUEST, PROGRESS, POST_PROGRESS)
		if (doc.docStatus === 'REQUEST' || doc.docStatus === 'PROGRESS' || doc.docStatus === 'POST_PROGRESS') {
			$.each(lineList, function(idx, line) {
				if (Number(line.lineSeq) === currLineSeq) {
					// 현재 결재자이거나 대결 권한인지
					if (line.approverId === jwt.userId) {
						isMyTurn = true;
					}
					return false;
				}
			});

			// 기안자 본인이면 1차 결재 승인 전까지 상신취소 버튼 노출
			if (doc.draUserId === jwt.userId && currLineSeq === 1) {
				$('#btnCancelDraft').show();
			}

			// 기안자 본인이거나 현재 결재자이면 결재선 변경 버튼 노출
			if (doc.draUserId === jwt.userId || isMyTurn || jwt.authCd === 'AUTH001') {
				$('#btnChangeLine').show();
			}
		}

		if (isMyTurn) {
			$('#apprActionArea').show();
			$('.appr-action-btn').show();
			var opinionRequired = String(currentDocDetail.docInfo.pm08TeamManagerOpinionRequired || '').toUpperCase() === 'Y';
			$('#apprOpinion').toggleClass('team-manager-opinion-required', opinionRequired).attr('placeholder', opinionRequired ? '결재 의견을 입력하세요. (담당팀장 필수)' : '결재 의견 또는 반려 사유를 입력하세요. (반려 시 필수)');
		} else {
			$('#apprActionArea').hide();
			$('.appr-action-btn').hide();
		}
	}

	function openChangeApproverSearchModal() {
		var paramObj = {
			coCd: currentCoCd || jwt.coCd || "GUN",
			useYn: "Y",
			userId: jwt.userId,
			pgmId: "AM1201M01",
			pm20Flag: "N"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "결재자 검색", paramObj, function(tree) {
			if (!tree || typeof tree.get_checked !== 'function') {
				alert("사용자 검색 결과를 가져오지 못했습니다.");
				return;
			}
			var checkedIds = tree.get_checked();
			if (!checkedIds || checkedIds.length === 0) {
				alert("추가할 결재자를 선택하십시오.");
				return;
			}
			var node = tree.get_node(checkedIds[0]);
			var nodeType = node && (node.type || (node.original && node.original.type));
			if (!node || nodeType !== "person") {
				alert("부서가 아닌 결재자(사용자)를 선택하십시오.");
				return;
			}
			var orig = node.original || {};
			var user = {
				approverId: node.id,
				approverNm: node.text,
				deptId: orig.originDeptId || orig.deptId || orig.parent || "",
				deptNm: orig.deptNm || "",
				levelCd: orig.levelCd || "",
				levelNm: orig.levelNm || "",
				lineType: "APPR"
			};
			var exists = false;
			$.each(modifiableLineList, function(idx, item) {
				if (item.approverId === user.approverId) {
					exists = true;
					return false;
				}
			});
			if (exists) {
				alert("이미 결재선에 추가된 사용자입니다.");
				return;
			}
			modifiableLineList.push(user);
			renderChangeLineTable();
		});

	function removeChangeSelectedApprover() {
		var selIdx = $('input[name="selChangeLineRow"]:checked').val();
		if (selIdx === undefined) {
			alert("삭제할 결재자를 선택하십시오.");
			return;
		}
		if (modifiableLineList.length <= 1) {
			alert("최소 1명 이상의 결재자가 유지되어야 합니다.");
			return;
		}
		modifiableLineList.splice(Number(selIdx), 1);
		renderChangeLineTable();
	}

	function moveChangeLine(direction) {
		var selected = $('input[name="selChangeLineRow"]:checked').val();
		if (selected === undefined) {
			alert("이동할 결재자를 선택해 주세요.");
			return;
		}
		var from = Number(selected);
		var to = from + direction;
		if (to < 0 || to >= modifiableLineList.length) return;
		var moved = modifiableLineList.splice(from, 1)[0];
		modifiableLineList.splice(to, 0, moved);
		renderChangeLineTable();
		$('input[name="selChangeLineRow"][value="' + to + '"]').prop('checked', true);
	}

	// 승인 / 반려 / 전결 실행
	function processApproval(actionType) {
		var docId = $('#detailForm').find('#docId').val();
		var opinion = $('#apprOpinion').val();
		if ((actionType === 'APPROVE' || actionType === 'ARBIT')
				&& currentDocDetail.docInfo.pm08TeamManagerOpinionRequired === 'Y'
				&& (!opinion || opinion.trim().length === 0)) {
			alert('담당팀장 결재는 결재의견을 입력해야 합니다.');
			$('#apprOpinion').focus();
			return;
		}

		if (actionType === 'REJECT' && (!opinion || opinion.trim().length === 0)) {
			alert("반려 시에는 반드시 반려 사유를 입력해야 합니다.");
			$('#apprOpinion').focus();
			return;
		}

		var confirmMsg = "승인하시겠습니까?";
		var url = "/user/am/am12/approveDocument";

		if (actionType === 'REJECT') {
			confirmMsg = "이 결재문서를 반려하시겠습니까?";
			url = "/user/am/am12/rejectDocument";
		} else if (actionType === 'ARBIT') {
			confirmMsg = "전결 처리하시겠습니까? (해당 결재단계의 잔여 결재선은 종결 처리됩니다)";
			url = "/user/am/am12/arbitDocument";
		}

		if (!confirm(confirmMsg)) return;

		var param = {
			docId: docId,
			coCd: currentCoCd || jwt.coCd || "GUN",
			userId: jwt.userId,
			userNm: jwt.userNm,
			apprOpinion: opinion
		};

		postAjax(url, param, null, function(data) {
			if (data && data.resultCode === '200') {
				alert(data.resultMessage || "처리가 완료되었습니다.");
				closeApprovalDetailModal("승인완료");
			} else {
				alert(data.resultMessage || "오류가 발생하였습니다.");
			}
		});
	}

	// 상신 취소 실행
	function processCancelDraft() {
		if (!confirm("상신을 취소(회수)하시겠습니까? 취소된 문서는 수정 후 재상신할 수 있습니다.")) return;

		var docId = $('#detailForm').find('#docId').val();
		var param = {
			docId: docId,
			coCd: currentCoCd || jwt.coCd || "GUN",
			userId: jwt.userId
		};

		postAjax("/user/am/am12/cancelApproval", param, null, function(data) {
			if (data && data.resultCode === '200') {
				alert(data.resultMessage || "상신이 취소되었습니다.");
				closeApprovalDetailModal("상신취소");
			} else {
				alert(data.resultMessage || "상신 취소 실패");
			}
		});
	}

	function processCancelArbit() {
		if (!currentDocDetail || !confirm('전결을 취소하고 이후 결재를 다시 진행하시겠습니까?')) return;
		var actor = getCurrentArbitActor();
		var param = { docId: $('#detailForm').find('#docId').val(), coCd: currentCoCd || jwt.coCd || 'GUN', userId: jwt.userId,
			userNm: actor.actualUserNm || actor.approverNm || '', deptNm: actor.actualDeptNm || actor.deptNm || '',
			levelNm: actor.actualLevelNm || actor.levelNm || '' };
		postAjax('/user/am/am12/cancelArbitDocument', param, null, function(data) {
			$('#btnCancelArbit').hide();
			if (data && data.resultCode === '200') {
				alert(data.resultMessage || '전결이 취소되었습니다.');
				loadDocDetail(param.docId);
			} else alert(data && data.resultMessage ? data.resultMessage : '전결 취소에 실패했습니다.');
		});
	}

	function getCurrentArbitActor() {
		var actor = {};
		$.each(currentDocDetail.lineList || [], function(idx, line) {
			if (line.arbitYn === 'Y' && (line.actualUserId === jwt.userId || line.approverId === jwt.userId)) {
				actor = line;
				return false;
			}
		});
		return actor;
	}

	// 원천문서 조회 링크 클릭 핸들러
	$(document).off('click', '#viewSourceDocLink').on('click', '#viewSourceDocLink', function(e) {
		e.preventDefault();
		if (!currentDocDetail || !currentDocDetail.docInfo) return;
		var doc = currentDocDetail.docInfo;
		var srcKey = doc.erpBizKey;
		var srcCoCd = doc.coCd || jwt.coCd || 'GUN';
		postAjax("/user/wb/wb20/selectGetApprovalList", { todoNo: srcKey, coCd: srcCoCd }, null, function(res){
			var rows = res.resultList || [];
			var line = null;
			for (var i=0;i<rows.length;i++){
				if (rows[i].pgPath && rows[i].gb !== '공유' && rows[i].todoDiv1CodeId !== 'TODODIV10'){
					line = rows[i];
					break;
				}
			}
			if (!line){
				for (var j=0;j<rows.length;j++){
					if (rows[j].pgPath){
						line = rows[j];
						break;
					}
				}
			}
			if (!line || !line.pgPath){
				alert("원천문서를 찾을 수 없습니다.");
				return;
			}
			openApprovalSourceDoc(line, function(){});
		});
	});
</script>
