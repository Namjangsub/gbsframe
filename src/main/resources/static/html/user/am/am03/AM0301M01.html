<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5toast.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5menu.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5calendar.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5picker.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5select.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5combobox.css">
	<link rel="stylesheet" href="/static/css/jstree/style.min.css">
	<link rel="stylesheet" href="/static/css/gnb.css">
	<link rel="stylesheet" href="/static/css/main.css">
	<link rel="stylesheet" href="/static/css/sub.css">
	<link rel="stylesheet" href="/static/css/common.css">

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/ax5/ax5toast.min.js"></script>
	<script src="/static/js/ax5/ax5formatter.min.js"></script>
	<script src="/static/js/ax5/ax5calendar.min.js"></script>
	<script src="/static/js/ax5/ax5picker.min.js"></script>
	<script src="/static/js/ax5/ax5select.min.js"></script>
	<script src="/static/js/jstree/jstree.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/fileTree.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>

	<style>
		/* GBS 표준 분할 레이아웃 */
		.split-container {
			display: flex;
			gap: 10px;
			width: 100%;
			margin-top: 4px;
		}
		.split-left {
			flex: 0 0 420px;
			min-width: 320px;
		}
		.split-right {
			flex: 1;
			min-width: 0;
		}
		.split-contents {
			position: relative;
			width: 100%;
			min-width: 0 !important;
			padding: 10px;
			background: #ffffff;
			border: 1px solid #d4d8dc;
		}

		/* 탭 네비게이션 톤앤매너 */
		.tab-nav-btn {
			padding: 7px 18px;
			background: #f1f3f5;
			border: 1px solid #d0d5dd;
			border-bottom: none;
			border-radius: 4px 4px 0 0;
			cursor: pointer;
			font-size: 13px;
			font-weight: bold;
			color: #555;
			margin-right: 4px;
			transition: all 0.15s ease-in-out;
		}
		.tab-nav-btn:hover {
			background: #e4e7eb;
			color: #333;
		}
		.tab-nav-btn.active {
			background: #337ab7;
			color: #ffffff;
			border-color: #337ab7;
		}
		.tab-content-pane {
			display: none;
		}
		.tab-content-pane.active {
			display: block;
		}

		/* GBS 프레임워크 표준 table_input 톤앤매너 */
		.table_input {
			width: 100%;
			border-collapse: collapse;
			border-top: 2px solid #5d7593;
			margin-bottom: 0;
		}
		.table_input th {
			background: #f4f6f8;
			font-size: 12px;
			color: #333;
			font-weight: 600;
			border: 1px solid #d4d8dc;
			height: 30px;
			vertical-align: middle;
			padding: 4px 8px;
			text-align: left;
		}
		.table_input th.hit::before {
			content: "*";
			color: #ff0000;
			margin-right: 4px;
			font-weight: bold;
			font-size: 13px;
		}
		.table_input td {
			border: 1px solid #d4d8dc;
			background: #ffffff;
			font-size: 12px;
			padding: 4px 6px;
			vertical-align: middle;
		}
		.table_input input.form-control,
		.table_input select.form-control {
			width: 100% !important;
			max-width: 100% !important;
			height: 26px !important;
			font-size: 12px !important;
			padding: 2px 6px !important;
			border-radius: 2px !important;
			border: 1px solid #ccc !important;
		}
		.table_input input[readonly],
		.table_input select[disabled] {
			background: #fafafa !important;
			cursor: default;
		}
		.table_input .search_form {
			position: relative;
			display: inline-block;
			width: 100%;
		}
		.table_input .search_form input {
			width: 100% !important;
			max-width: 100% !important;
			padding-right: 28px !important;
		}
		.table_input .search_form a {
			position: absolute;
			right: 5px;
			top: 50%;
			transform: translateY(-50%);
			cursor: pointer;
		}

		/* 결재선 목록 전용 테이블 톤앤매너 */
		.table-scroll-container {
			border: 1px solid #d4d8dc;
			overflow-y: auto;
			background: #ffffff;
			width: 100%;
			min-height: 250px;
		}
		.line-table-header th {
			position: sticky;
			top: 0;
			z-index: 2;
			background: #f4f6f8;
			color: #333;
			font-weight: bold;
			text-align: center !important;
			font-size: 12px;
			padding: 5px;
			border: 1px solid #d4d8dc;
			vertical-align: middle !important;
			height: 30px;
			box-shadow: inset 0 -1px 0 #d4d8dc;
		}
		.line-table-body td {
			text-align: center !important;
			font-size: 12px;
			padding: 3px 5px;
			border: 1px solid #e1e5e8;
			vertical-align: middle !important;
			height: 30px;
		}
		.line-table-body tr:hover {
			background-color: #f1f7fd;
		}
	</style>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>

	<div id="main_area">
		<!-- 상단 탭 네비게이션 -->
		<div class="contents no_bg" style="margin-bottom: 6px;">
			<div style="border-bottom: 2px solid #337ab7; display: flex; align-items: flex-end;">
				<button type="button" class="tab-nav-btn active" id="tabBtnPreset" onclick="switchMainTab('PRESET');">
					<i class="fa fa-sitemap"></i> 자주 쓰는 결재선 프리셋
				</button>
				<button type="button" class="tab-nav-btn" id="tabBtnDelegate" onclick="switchMainTab('DELEGATE');">
					<i class="fa fa-user-clock"></i> 대결(부재/위임) 설정
				</button>
			</div>
		</div>

		<!-- =================================================================== -->
		<!-- 탭 1: 자주 쓰는 결재선 프리셋 관리 -->
		<!-- =================================================================== -->
		<div id="panePreset" class="tab-content-pane active">
			<!-- 본문: Flex Split 레이아웃 -->
			<div class="split-container">
				<!-- 좌측: 프리셋 목록 그리드 -->
				<div class="split-left">
					<div class="split-contents">
						<div class="contents_tit">
							<span style="font-weight: bold; font-size: 13px; color: #333;"><i class="fa fa-list"></i> 나의 결재선 목록</span>
							<div class="add_btn_small pdl10">
								<a onclick="newPreset();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-plus"></i> 신규</a>
								<a onclick="loadPresetList();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-sync-alt"></i> 새로고침</a>
							</div>
						</div>
						<div data-ax5grid="preset-grid" style="width: 100%; min-height: 320px;"></div>
					</div>
				</div>

				<!-- 우측: 프리셋 상세 및 결재선 편집 -->
				<div class="split-right">
					<div class="split-contents">
						<div class="contents_tit">
							<span style="font-weight: bold; font-size: 13px; color: #333;"><i class="fa fa-edit"></i> 결재선 상세 정보</span>
							<div class="add_btn_small pdl10">
								<a onclick="saveCurrentPreset();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-save"></i> 저장</a>
								<a onclick="deleteCurrentPreset();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-trash-alt"></i> 삭제</a>
							</div>
						</div>

						<!-- 기본 정보 입력 폼 -->
						<form id="presetForm" onsubmit="return false;">
							<input type="hidden" id="linePresetId" name="linePresetId">
							<table class="table_input" style="margin-bottom: 8px;">
								<colgroup>
									<col style="width: 90px;">
									<col style="width: *;">
									<col style="width: 80px;">
									<col style="width: 90px;">
								</colgroup>
								<tr>
									<th class="hit">결재선 명칭</th>
									<td>
										<input type="text" id="linePresetNm" name="linePresetNm" class="form-control input-sm" placeholder="예: 일반품의 기본결재선" required>
									</td>
									<th>사용여부</th>
									<td>
										<select id="useYn" name="useYn" class="form-control input-sm">
											<option value="Y">Y</option>
											<option value="N">N</option>
										</select>
									</td>
								</tr>
								<tr>
									<th>설명(비고)</th>
									<td colspan="3">
										<input type="text" id="presetDesc" name="presetDesc" class="form-control input-sm" placeholder="결재선에 대한 설명을 입력하세요.">
									</td>
								</tr>
							</table>
						</form>

						<!-- 결재자 목록 구성 타이틀 및 조작 버튼 -->
						<div class="contents_tit" style="margin-top: 8px; margin-bottom: 6px;">
							<span style="font-weight: bold; font-size: 13px; color: #333;"><i class="fa fa-users"></i> 지정 결재자 순서</span>
							<div class="add_btn_small pdl10">
								<a onclick="openPresetUserModal();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-user-plus"></i> 결재자 추가</a>
								<a onclick="removeSelectedPresetLine();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-user-minus"></i> 행 삭제</a>
							</div>
						</div>

						<div class="table-scroll-container">
							<table class="table table-bordered" style="margin-bottom: 0; width: 100%;">
								<thead>
									<tr class="line-table-header">
										<th style="width: 45px;">선택</th>
										<th style="width: 50px;">순번</th>
										<th style="width: 95px;">결재구분</th>
										<th style="width: 130px;">결재자명</th>
										<th style="width: 80px;">직급</th>
										<th style="width: *;">부서명</th>
										<th style="width: 85px;">순서이동</th>
									</tr>
								</thead>
								<tbody id="presetLineTbody" class="line-table-body">
									<tr>
										<td colspan="7" style="color: #888; padding: 35px 10px; text-align: center;">지정된 결재자가 없습니다. 우측 상단 [결재자 추가] 버튼을 클릭하세요.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</div>
		</div>

		<!-- =================================================================== -->
		<!-- 탭 2: 대결(위임) 설정 관리 -->
		<!-- =================================================================== -->
		<div id="paneDelegate" class="tab-content-pane">
			<div style="display: flex; flex-direction: column; gap: 8px;">
				<!-- 대결 설정 등록 영역 -->
				<div class="split-contents">
					<div class="contents_tit">
						<span style="font-weight: bold; font-size: 13px; color: #333;"><i class="fa fa-calendar-alt"></i> 신규 대결(위임) 등록</span>
						<div class="add_btn_small pdl10">
							<a onclick="saveDelegateSetting();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-save"></i> 대결 등록</a>
							<a onclick="loadDelegateList();" style="height: 26px; line-height: 24px; padding: 0 8px; width: auto;"><i class="fas fa-sync-alt"></i> 새로고침</a>
						</div>
					</div>
					<form id="delegateForm" onsubmit="return false;">
						<table class="table_input" style="width: 100%;">
							<colgroup>
								<col style="width: 90px;">
								<col style="width: 220px;">
								<col style="width: 90px;">
								<col style="width: 250px;">
								<col style="width: 80px;">
								<col style="width: *;">
							</colgroup>
							<tr>
								<th class="hit">대결자 지정</th>
								<td>
									<input type="hidden" id="agentUserId" name="agentUserId">
									<div class="search_form" style="width: 100%;">
										<input type="text" id="agentUserNm" name="agentUserNm" class="form-control input-sm" placeholder="사용자 검색" readonly style="background:#fafafa; cursor:pointer;" onclick="openAgentUserModal();">
										<a onclick="openAgentUserModal();"><i class="i_search_w"></i></a>
									</div>
								</td>
								<th class="hit">부재 기간</th>
								<td>
									<div class="input-daterange" style="display: flex; align-items: center; gap: 4px; width: 100%;">
										<input type="text" class="input_calendar form-control input-sm" id="startDt" name="startDt" autocomplete="off" style="cursor: pointer;">
										<span style="font-weight: bold; color: #777;">~</span>
										<input type="text" class="input_calendar form-control input-sm" id="endDt" name="endDt" autocomplete="off" style="cursor: pointer;">
									</div>
								</td>
								<th>사유</th>
								<td>
									<input type="text" id="delegateReason" name="delegateReason" class="form-control input-sm" placeholder="예: 연차 휴가, 장기 출장, 교육 등">
								</td>
							</tr>
						</table>
					</form>
				</div>

				<!-- 대결 설정 이력 목록 그리드 -->
				<div class="split-contents">
					<div class="contents_tit">
						<span style="font-weight:bold; font-size:13px; color:#333;"><i class="fa fa-history"></i> 대결(부재/위임) 설정 이력</span>
						<span style="font-size:12px; color:#777; margin-left: 10px;">* 현재 날짜가 부재 기간에 해당하고 사용여부가 'Y'인 경우 대결이 활성화됩니다.</span>
					</div>
					<div data-ax5grid="delegate-grid" style="width: 100%; min-height: 300px;"></div>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		var currentLines = []; // 현재 우측 프리셋 결재선 목록

		// 1. 프리셋 목록 그리드
		var presetGridView = {
			initView: function() {
				this.target = new ax5.ui.grid();
				this.target.setConfig({
					target: $('[data-ax5grid="preset-grid"]'),
					showLineNumber: true,
					showRowSelector: false,
					multipleSelect: false,
					header: { align: "center" },
					body: {
						onClick: function() {
							this.self.clearSelect();
							this.self.select(this.dindex);
							loadPresetDetail(this.item.linePresetId, this.item);
						}
					},
					columns: [
						{key: "presetNm", label: "결재선 명칭", align: "left", width: 180, formatter: function() { return this.value || this.item.linePresetNm; }},
						{key: "presetDesc", label: "설명", align: "left", width: 140},
						{key: "useYn", label: "사용", align: "center", width: 50}
					]
				});
				return this;
			},
			setData: function(list) {
				this.target.setData(list || []);
			}
		};

		// 2. 대결 설정 목록 그리드
		var delegateGridView = {
			initView: function() {
				var _this = this;
				this.target = new ax5.ui.grid();
				this.target.setConfig({
					target: $('[data-ax5grid="delegate-grid"]'),
					showLineNumber: true,
					showRowSelector: false,
					header: { align: "center" },
					columns: [
						{key: "delegateUserNm", label: "대결자(위임자)", align: "center", width: 110, formatter: function() { return this.value || this.item.agentUserNm; }},
						{key: "startDt", label: "시작일자", align: "center", width: 110},
						{key: "endDt", label: "종료일자", align: "center", width: 110},
						{key: "delegateRsn", label: "부재/대결 사유", align: "left", width: 250, formatter: function() { return this.value || this.item.delegateReason; }},
						{key: "statusNm", label: "상태", align: "center", width: 80,
							formatter: function() {
								if (this.value === '진행중') return '<span class="label label-success">진행중</span>';
								if (this.value === '예정') return '<span class="label label-info">예정</span>';
								return '<span class="label label-default">종료</span>';
							}
						},
						{key: "creatDttm", label: "등록일시", align: "center", width: 130},
						{key: "action", label: "관리", align: "center", width: 90,
							formatter: function() {
								if (this.item.useYn === 'Y') {
									return '<button type="button" class="btn btn-warning btn-xs" onclick="disableDelegate(\'' + this.item.delegateId + '\');">해제</button>';
								}
								return '<span style="color:#aaa;">해제됨</span>';
							}
						}
					]
				});
				return this;
			},
			setData: function(list) {
				this.target.setData(list || []);
			}
		};

		var resizeTimer = null;

		// 화면 크기에 맞춘 동적 그리드 및 테이블 높이 자동 조절 (하단 여백 최소화)
		function resizeAllGrids() {
			var winHeight = $(window).height();
			var bottomReserve = 18; // GBS 표준 하단 여백

			// 1. 탭 1: 자주 쓰는 결재선 프리셋 관리
			if ($('#panePreset').is(':visible')) {
				// 좌측 프리셋 그리드 동적 높이
				var $presetGrid = $('[data-ax5grid="preset-grid"]');
				if ($presetGrid.length > 0 && presetGridView && presetGridView.target) {
					var pTop = $presetGrid.offset().top;
					var pH = Math.max(300, winHeight - pTop - bottomReserve);
					$presetGrid.css('height', pH + 'px');
					presetGridView.target.setHeight(pH);
				}

				// 우측 결재자 목록 테이블 컨테이너 동적 높이
				var $tableScroll = $('.table-scroll-container');
				if ($tableScroll.length > 0) {
					var tTop = $tableScroll.offset().top;
					var tH = Math.max(250, winHeight - tTop - bottomReserve);
					$tableScroll.css('height', tH + 'px');
				}
			}

			// 2. 탭 2: 대결(위임) 설정 관리
			if ($('#paneDelegate').is(':visible')) {
				var $delegateGrid = $('[data-ax5grid="delegate-grid"]');
				if ($delegateGrid.length > 0 && delegateGridView && delegateGridView.target) {
					var dTop = $delegateGrid.offset().top;
					var dH = Math.max(300, winHeight - dTop - bottomReserve);
					$delegateGrid.css('height', dH + 'px');
					delegateGridView.target.setHeight(dH);
				}
			}
		}

		$(document).ready(function() {
			// GBS 기본 상단/좌측 메뉴 로드
			mainDefaultLoad("전자결재", "개인 결재선 관리");
			setCommonSelect($("#main_area select[data-kind]"));

			presetGridView.initView();
			delegateGridView.initView();

			$('.input-daterange').datepicker({
				format: "yyyy-mm-dd",
				language: "ko",
				autoclose: true
			});

			// 브라우저 리사이즈 시 동적 높이 자동 재계산 (디바운스 100ms)
			$(window).on('resize', function() {
				if (resizeTimer) clearTimeout(resizeTimer);
				resizeTimer = setTimeout(resizeAllGrids, 100);
			});

			// 기본 프리셋 목록 로드
			loadPresetList();
			setTimeout(resizeAllGrids, 150);
		});

		// 탭 전환
		function switchMainTab(tabType) {
			if (tabType === 'PRESET') {
				$('#tabBtnPreset').addClass('active');
				$('#tabBtnDelegate').removeClass('active');
				$('#panePreset').addClass('active');
				$('#paneDelegate').removeClass('active');
				loadPresetList();
			} else {
				$('#tabBtnPreset').removeClass('active');
				$('#tabBtnDelegate').addClass('active');
				$('#panePreset').removeClass('active');
				$('#paneDelegate').addClass('active');
				loadDelegateList();
			}
			setTimeout(resizeAllGrids, 50);
		}

		// -------------------------------------------------------------
		// 결재선 프리셋 로직
		// -------------------------------------------------------------
		function loadPresetList() {
			var param = { userId: jwt.userId, coCd: jwt.coCd || "GUN" };
			postAjax("/user/am/am03/selectLinePresetList", param, null, function(data) {
				if (data && data.resultList) {
					presetGridView.setData(data.resultList);
					if (data.resultList.length > 0) {
						presetGridView.target.select(0);
						loadPresetDetail(data.resultList[0].linePresetId, data.resultList[0]);
					} else {
						newPreset();
					}
				}
				setTimeout(resizeAllGrids, 50);
			});
		}

		function newPreset() {
			$('#presetForm')[0].reset();
			$('#linePresetId').val('');
			$('#useYn').val('Y');
			currentLines = [];
			renderPresetLineTable();
		}

		function loadPresetDetail(presetId, item) {
			if (!presetId) return;

			// 1. 전달된 item 또는 현재 그리드 선택 행으로부터 마스터 기본 정보 즉시 폼 바인딩
			if (!item && presetGridView && presetGridView.target) {
				var sel = presetGridView.target.getList("selected");
				if (sel && sel.length > 0) item = sel[0];
			}

			if (item) {
				$('#linePresetId').val(item.linePresetId || presetId);
				$('#linePresetNm').val(item.presetNm || item.linePresetNm || '');
				$('#presetDesc').val(item.presetDesc || '');
				$('#useYn').val(item.useYn || 'Y');
			}

			// 2. 서버에서 결재자 라인 상세 목록 비동기 조회
			postAjax("/user/am/am03/selectLinePresetDetail", { linePresetId: presetId, coCd: jwt.coCd || "GUN" }, null, function(data) {
				if (data && data.resultList) {
					var list = data.resultList;
					if (list.length > 0) {
						var m = list[0];
						if (m.linePresetId) $('#linePresetId').val(m.linePresetId);
						if (m.presetNm) $('#linePresetNm').val(m.presetNm);
						if (m.useYn) $('#useYn').val(m.useYn);
						if (m.presetDesc) $('#presetDesc').val(m.presetDesc);
					}
					currentLines = [];
					$.each(list, function(idx, row) {
						var uid = row.apprUserId || row.approverId;
						if (uid) {
							currentLines.push({
								lineSeq: row.lineSeq || (idx + 1),
								lineType: row.apprType || row.lineType || 'APPR',
								approverId: uid,
								approverNm: row.apprUserNm || row.approverNm || uid,
								levelCd: row.levelCd,
								levelNm: row.levelNm || '',
								deptId: row.apprDeptId || row.deptId || '',
								deptNm: row.apprDeptNm || row.deptNm || ''
							});
						}
					});
					renderPresetLineTable();
					setTimeout(resizeAllGrids, 50);
				}
			});
		}

		function renderPresetLineTable() {
			var $tbody = $('#presetLineTbody');
			$tbody.empty();

			if (!currentLines || currentLines.length === 0) {
				$tbody.html('<tr><td colspan="7" style="color:#888; padding:35px 10px; text-align: center;">지정된 결재자가 없습니다. 우측 상단 [결재자 추가] 버튼을 클릭하세요.</td></tr>');
				setTimeout(resizeAllGrids, 30);
				return;
			}

			$.each(currentLines, function(idx, item) {
				item.lineSeq = idx + 1;
				var html = '<tr>' +
					'<td style="text-align: center; vertical-align: middle;"><input type="radio" name="chkPresetLine" value="' + idx + '" style="vertical-align: middle; margin: 0 auto; display: block;"></td>' +
					'<td style="text-align: center; vertical-align: middle;">' + item.lineSeq + '</td>' +
					'<td style="text-align: center; vertical-align: middle;">' +
						'<select class="form-control input-sm" style="text-align: center; text-align-last: center; display: inline-block; height: 24px; padding: 2px 4px;" onchange="changeLineType(' + idx + ', this.value);">' +
							'<option value="APPR"' + (item.lineType === 'APPR' ? ' selected' : '') + '>결재</option>' +
							'<option value="AGREE"' + (item.lineType === 'AGREE' ? ' selected' : '') + '>합의</option>' +
							'<option value="COOP"' + (item.lineType === 'COOP' ? ' selected' : '') + '>협조</option>' +
							'<option value="REF"' + (item.lineType === 'REF' ? ' selected' : '') + '>참조</option>' +
						'</select>' +
					'</td>' +
					'<td style="text-align: center; vertical-align: middle;"><strong>' + item.approverNm + '</strong></td>' +
					'<td style="text-align: center; vertical-align: middle;">' + (item.levelNm || '') + '</td>' +
					'<td style="text-align: center; vertical-align: middle;">' + (item.deptNm || '') + '</td>' +
					'<td style="text-align: center; vertical-align: middle;">' +
						'<button type="button" class="btn btn-default btn-xs" style="height: 22px; width: 22px; padding: 0; line-height: 20px; text-align: center; border-radius: 2px;" onclick="moveLineOrder(' + idx + ', -1);"><i class="fa fa-arrow-up"></i></button> ' +
						'<button type="button" class="btn btn-default btn-xs" style="height: 22px; width: 22px; padding: 0; line-height: 20px; text-align: center; border-radius: 2px;" onclick="moveLineOrder(' + idx + ', 1);"><i class="fa fa-arrow-down"></i></button>' +
					'</td>' +
				'</tr>';
				$tbody.append(html);
			});
			setTimeout(resizeAllGrids, 30);
		}

		function changeLineType(idx, val) {
			if (currentLines[idx]) currentLines[idx].lineType = val;
		}

		function moveLineOrder(idx, dir) {
			var targetIdx = idx + dir;
			if (targetIdx < 0 || targetIdx >= currentLines.length) return;
			var temp = currentLines[idx];
			currentLines[idx] = currentLines[targetIdx];
			currentLines[targetIdx] = temp;
			renderPresetLineTable();
		}

		function removeSelectedPresetLine() {
			var selIdx = $('input[name="chkPresetLine"]:checked').val();
			if (selIdx === undefined) {
				alert("삭제할 결재선 행을 선택하십시오.");
				return;
			}
			currentLines.splice(Number(selIdx), 1);
			renderPresetLineTable();
		}

		// 결재선 사용자 추가 모달
		function openPresetUserModal() {
			var paramObj = {
				coCd: jwt.coCd || "GUN",
				useYn: "Y"
			};
			openModal("/static/html/cmn/modal/userSearch.html", 450, 650, "결재자 검색", paramObj, function(tree) {
				if (!tree || typeof tree.get_checked !== 'function') return;
				var checkedIds = tree.get_checked();
				if (!checkedIds || checkedIds.length === 0) {
					alert("선택된 사용자가 없습니다.");
					return;
				}
				var node = tree.get_node(checkedIds[0]);
				if (!node || node.type !== "person") {
					alert("부서가 아닌 결재자(사용자)를 선택하십시오.");
					return;
				}

				var userId = node.id;
				var userNm = node.text;
				var orig = node.original || {};
				var deptId = orig.originDeptId || orig.deptId || orig.parent || "";
				var deptNm = orig.deptNm || "";
				var levelCd = orig.levelCd || "";
				var levelNm = orig.levelNm || "";

				// 중복 체크
				for (var i = 0; i < currentLines.length; i++) {
					if (currentLines[i].approverId === userId) {
						alert("이미 결재선에 포함된 사용자입니다.");
						return;
					}
				}

				currentLines.push({
					lineSeq: currentLines.length + 1,
					lineType: "APPR",
					approverId: userId,
					approverNm: userNm,
					levelCd: levelCd,
					levelNm: levelNm,
					deptId: deptId,
					deptNm: deptNm
				});
				renderPresetLineTable();
			});
		}

		// 프리셋 저장
		function saveCurrentPreset() {
			var nm = $('#linePresetNm').val();
			if (!nm || nm.trim().length === 0) {
				alert("결재선 명칭을 입력하십시오.");
				$('#linePresetNm').focus();
				return;
			}
			if (!currentLines || currentLines.length === 0) {
				alert("최소 1명 이상의 결재자를 등록해야 합니다.");
				return;
			}

			var lineListPayload = [];
			$.each(currentLines, function(idx, item) {
				lineListPayload.push({
					lineSeq: idx + 1,
					apprType: item.lineType,
					apprUserId: item.approverId,
					apprDeptId: item.deptId
				});
			});

			var param = {
				linePresetId: $('#linePresetId').val(),
				userId: jwt.userId,
				presetNm: nm,
				coCd: jwt.coCd || 'GUN',
				presetDesc: $('#presetDesc').val(),
				useYn: $('#useYn').val(),
				lineList: lineListPayload
			};

			postAjax("/user/am/am03/saveLinePreset", param, null, function(data) {
				if (data && data.resultCode === '200') {
					alert(data.resultMessage || "저장되었습니다.");
					loadPresetList();
				} else {
					alert(data ? data.resultMessage : "저장 실패");
				}
			});
		}

		// 프리셋 삭제
		function deleteCurrentPreset() {
			var presetId = $('#linePresetId').val();
			if (!presetId) {
				alert("삭제할 결재선이 선택되지 않았습니다.");
				return;
			}
			if (!confirm("선택한 결재선 프리셋을 삭제하시겠습니까?")) return;

			postAjax("/user/am/am03/deleteLinePreset", { linePresetId: presetId, userId: jwt.userId, coCd: jwt.coCd || "GUN" }, null, function(data) {
				if (data && data.resultCode === '200') {
					alert("삭제되었습니다.");
					loadPresetList();
				} else {
					alert(data ? data.resultMessage : "삭제 실패");
				}
			});
		}

		// -------------------------------------------------------------
		// 대결(위임) 설정 로직
		// -------------------------------------------------------------
		function loadDelegateList() {
			postAjax("/user/am/am03/selectDelegateList", { userId: jwt.userId, coCd: jwt.coCd || "GUN" }, null, function(data) {
				if (data && data.resultList) {
					delegateGridView.setData(data.resultList);
				}
				setTimeout(resizeAllGrids, 50);
			});
		}

		function openAgentUserModal() {
			var paramObj = {
				coCd: jwt.coCd || "GUN",
				useYn: "Y"
			};
			openModal("/static/html/cmn/modal/userSearch.html", 450, 650, "대결자 검색", paramObj, function(tree) {
				if (!tree || typeof tree.get_checked !== 'function') return;
				var checkedIds = tree.get_checked();
				if (!checkedIds || checkedIds.length === 0) {
					alert("선택된 사용자가 없습니다.");
					return;
				}
				var node = tree.get_node(checkedIds[0]);
				if (!node || node.type !== "person") {
					alert("대결자로 지정할 사용자를 선택하십시오.");
					return;
				}
				if (node.id === jwt.userId) {
					alert("본인을 대결자로 지정할 수 없습니다.");
					return;
				}
				var orig = node.original || {};
				var deptNm = orig.deptNm || "";
				$('#agentUserId').val(node.id);
				$('#agentUserNm').val(node.text + (deptNm ? " (" + deptNm + ")" : ""));
			});
		}

		function saveDelegateSetting() {
			var agentId = $('#agentUserId').val();
			var startDt = $('#startDt').val();
			var endDt = $('#endDt').val();

			if (!agentId) {
				alert("대결자를 지정하십시오.");
				openAgentUserModal();
				return;
			}
			if (!startDt) {
				alert("부재 시작일자를 입력하십시오.");
				$('#startDt').focus();
				return;
			}
			if (!endDt) {
				alert("부재 종료일자를 입력하십시오.");
				$('#endDt').focus();
				return;
			}
			if (startDt > endDt) {
				alert("시작일자가 종료일자보다 클 수 없습니다.");
				$('#startDt').focus();
				return;
			}

			var param = {
				userId: jwt.userId,
				delegateUserId: agentId,
				startDt: startDt,
				endDt: endDt,
				delegateRsn: $('#delegateReason').val(),
				coCd: jwt.coCd || 'GUN'
			};

			postAjax("/user/am/am03/saveDelegate", param, null, function(data) {
				if (data && data.resultCode === '200') {
					alert("대결 설정이 등록되었습니다.");
					$('#delegateForm')[0].reset();
					$('#agentUserId').val('');
					loadDelegateList();
				} else {
					alert(data ? data.resultMessage : "대결 등록 실패");
				}
			});
		}

		function disableDelegate(delegateId) {
			if (!confirm("대결 설정을 해제하시겠습니까?")) return;
			postAjax("/user/am/am03/updateDelegateStatus", { delegateId: delegateId, useYn: "N", userId: jwt.userId, coCd: jwt.coCd || "GUN" }, null, function(data) {
				if (data && data.resultCode === '200') {
					alert("대결 설정이 해제되었습니다.");
					loadDelegateList();
				} else {
					alert(data ? data.resultMessage : "해제 실패");
				}
			});
		}
	</script>
</body>
</html>
