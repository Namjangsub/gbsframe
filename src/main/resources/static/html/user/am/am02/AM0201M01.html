<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5toast.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5menu.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5calendar.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5picker.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5select.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5combobox.css">
	<link rel="stylesheet" href="/static/css/jstree/style.min.css">
	<link rel="stylesheet" href="/static/css/gnb.css">
	<link rel="stylesheet" href="/static/css/main.css">
	<link rel="stylesheet" href="/static/css/sub.css">
	<link rel="stylesheet" href="/static/css/common.css">

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/ax5/ax5toast.min.js"></script>
	<script src="/static/js/ax5/ax5formatter.min.js"></script>
	<script src="/static/js/ax5/ax5calendar.min.js"></script>
	<script src="/static/js/ax5/ax5picker.min.js"></script>
	<script src="/static/js/ax5/ax5select.min.js"></script>
	<script src="/static/js/jstree/jstree.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/fileTree.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>

	<style>
		/* GBS 표준 분할 레이아웃 */
		.split-container {
			display: flex;
			gap: 10px;
			width: 100%;
			margin-top: 5px;
		}
		.split-left {
			flex: 0 0 460px;
			min-width: 360px;
		}
		.split-right {
			flex: 1;
			min-width: 0;
		}
		.split-contents {
			position: relative;
			width: 100%;
			min-width: 0 !important;
			padding: 10px;
			background: #ffffff;
			border: 1px solid #d4d8dc;
		}

		/* GBS 프레임워크 표준 table_input 톤앤매너 */
		.table_input {
			width: 100%;
			border-collapse: collapse;
			border-top: 2px solid #5d7593;
			margin-bottom: 0;
		}
		.table_input th {
			background: #f4f6f8;
			font-size: 12px;
			color: #333;
			font-weight: 600;
			border: 1px solid #d4d8dc;
			height: 30px;
			vertical-align: middle;
			padding: 4px 8px;
			text-align: left;
		}
		.table_input th.hit::before {
			content: "*";
			color: #ff0000;
			margin-right: 4px;
			font-weight: bold;
			font-size: 13px;
		}
		.table_input td {
			border: 1px solid #d4d8dc;
			background: #ffffff;
			font-size: 12px;
			padding: 4px 6px;
			vertical-align: middle;
		}
		.table_input input.form-control,
		.table_input select.form-control {
			width: 100% !important;
			max-width: 100% !important;
			height: 26px !important;
			font-size: 12px !important;
			padding: 2px 6px !important;
			border-radius: 2px !important;
			border: 1px solid #ccc !important;
		}
		.table_input input[readonly],
		.table_input select[disabled] {
			background: #fafafa !important;
			cursor: default;
		}

		/* 템플릿 에디터 탭 및 프리뷰 톤앤매너 */
		.editor-tabs {
			display: flex;
			gap: 4px;
			margin-top: 8px;
			margin-bottom: 6px;
			border-bottom: 2px solid #337ab7;
		}
		.editor-tab-btn {
			padding: 6px 14px;
			font-size: 12px;
			font-weight: bold;
			border: 1px solid #d0d5dd;
			border-bottom: none;
			background: #f1f3f5;
			color: #555;
			cursor: pointer;
			border-radius: 3px 3px 0 0;
			transition: all 0.15s ease-in-out;
		}
		.editor-tab-btn:hover {
			background: #e4e7eb;
			color: #333;
		}
		.editor-tab-btn.active {
			background: #337ab7;
			color: #fff;
			border-color: #337ab7;
		}
		.tmpl-preview-area {
			border: 1px solid #d4d8dc;
			background: #fff;
			padding: 15px;
			min-height: 250px;
			overflow-y: auto;
		}
	</style>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>

	<div id="main_area">
		<!-- 페이지 타이틀 및 상단 버튼 -->
		<div class="contents no_bg">
			<ul class="btn_ul">
				<li class="btn_r">
					<a onclick="newForm();"><button type="button" class="bg_blue">신규등록</button></a>
					<a onclick="initSearch();"><button type="button" class="bg_gray">초기화</button></a>
					<a onclick="formGridView.setData(0);"><button type="button" class="bg_gray">검 색</button></a>
				</li>
			</ul>
		</div>

		<!-- 검색 조건 영역 -->
		<div class="contents search">
			<table class="table_input type04">
				<colgroup>
					<col style="width: 70px;">
					<col style="width: 160px;">
					<col style="width: 70px;">
					<col style="width: 160px;">
					<col style="width: 70px;">
					<col style="width: 130px;">
					<col style="width: 70px;">
					<col style="width: *;">
				</colgroup>
				<tr>
					<th>회사</th>
					<td>
						<select id="coCd_S" name="coCd_S" data-search="coCd" class="form-control input-sm" onchange="formGridView.setData(0);">
							<option value="">전체</option>
							<option value="GUN" selected>건양ITT</option>
						</select>
					</td>
					<th>양식분류</th>
					<td>
						<select id="formCat_S" name="formCat_S" data-search="formCat" class="form-control input-sm" onchange="formGridView.setData(0);">
							<option value="">전체</option>
							<option value="GENERAL">일반/공통</option>
							<option value="HR">인사/총무</option>
							<option value="PCHS">구매/자재</option>
							<option value="SALES">영업/수주</option>
						</select>
					</td>
					<th>사용여부</th>
					<td>
						<select id="useYn_S" name="useYn_S" data-search="useYn" class="form-control input-sm" onchange="formGridView.setData(0);">
							<option value="">전체</option>
							<option value="Y" selected>사용 (Y)</option>
							<option value="N">미사용 (N)</option>
						</select>
					</td>
					<th>양식명</th>
					<td>
						<input type="text" id="searchValue_S" name="searchValue_S" data-search="searchValue" class="form-control input-sm" placeholder="양식명 또는 코드 검색" onkeyup="if(event.keyCode===13) formGridView.setData(0);">
					</td>
				</tr>
			</table>
		</div>

		<!-- 본문: 좌측 목록 그리드 / 우측 양식 상세 및 템플릿 편집 (Flex Split 레이아웃) -->
		<div class="split-container">
			<!-- 좌측: 결재 양식 목록 그리드 -->
			<div class="split-left">
				<div class="split-contents">
					<div class="contents_tit">
						<span style="font-weight:bold; font-size:13px; color:#333;"><i class="fa fa-list"></i> 전자결재 양식 목록</span>
						<div class="add_btn_small">
							<a onclick="formGridView.setData(0);" style="height: 26px; line-height: 24px; width: 75px;"><i class="fas fa-sync-alt"></i>새로고침</a>
						</div>
					</div>
					<div data-ax5grid="form-grid" style="width: 100%; min-height: 320px;"></div>
				</div>
			</div>

			<!-- 우측: 선택된 양식 상세 폼 -->
			<div class="split-right">
				<div class="split-contents">
					<div class="contents_tit">
						<span style="font-weight:bold; font-size:13px; color:#333;"><i class="fa fa-file-alt"></i> 결재 양식 상세 설정</span>
						<div class="add_btn_small">
							<a onclick="saveFormSetting(false);" style="height: 26px; line-height: 24px; width: 65px;"><i class="fas fa-save"></i>저장</a>
							<a onclick="saveFormSetting(true);" style="height: 26px; line-height: 24px; width: 105px;" id="btnVersionUp"><i class="fas fa-code-branch"></i>새 버전 개정</a>
						</div>
					</div>

					<form id="formDetailForm" onsubmit="return false;">
						<table class="table_input type02" style="margin-bottom: 8px;">
							<colgroup>
								<col style="width: 90px;">
								<col style="width: 200px;">
								<col style="width: 90px;">
								<col style="width: *;">
							</colgroup>
							<tr>
								<th class="hit">양식코드</th>
								<td>
									<input type="text" id="formCd" name="formCd" class="form-control input-sm" placeholder="예: FORM_GENERAL_01" required>
								</td>
								<th class="hit">양식명칭</th>
								<td>
									<input type="text" id="formNm" name="formNm" class="form-control input-sm" placeholder="예: 일반 품의서" required>
								</td>
							</tr>
							<tr>
								<th class="hit">양식분류</th>
								<td>
									<select id="formCat" name="formCat" class="form-control input-sm" required>
										<option value="GENERAL">일반/공통</option>
										<option value="HR">인사/총무</option>
										<option value="PCHS">구매/자재</option>
										<option value="SALES">영업/수주</option>
									</select>
								</td>
								<th>버전 / 사용여부</th>
								<td>
									<div style="display:flex; gap:8px; align-items:center;">
										<input type="number" id="formVer" name="formVer" class="form-control input-sm" style="width:65px;" value="1" readonly>
										<span style="font-size:12px;">버전</span>
										<select id="useYn" name="useYn" class="form-control input-sm" style="width:85px;">
											<option value="Y">Y (사용)</option>
											<option value="N">N (중지)</option>
										</select>
									</div>
								</td>
							</tr>
							<tr>
								<th>양식설명</th>
								<td colspan="3">
									<input type="text" id="formDesc" name="formDesc" class="form-control input-sm" placeholder="양식의 용도 및 설명 기재">
								</td>
							</tr>
						</table>

						<!-- 템플릿 HTML 에디터 / 미리보기 탭 -->
						<div class="editor-tabs">
							<button type="button" class="editor-tab-btn active" id="tabBtnHtml" onclick="switchEditorTab('HTML');">
								<i class="fa fa-code"></i> 서식 HTML 템플릿 편집
							</button>
							<button type="button" class="editor-tab-btn" id="tabBtnPreview" onclick="switchEditorTab('PREVIEW');">
								<i class="fa fa-eye"></i> 실시간 서식 미리보기
							</button>
						</div>

						<div id="paneHtmlEditor">
							<textarea id="formTmplHtml" name="formTmplHtml" class="form-control" style="width: 100%; font-family: Consolas, Monaco, monospace; font-size: 12px; min-height: 250px;" placeholder="서식 HTML 코드를 입력하세요."></textarea>
						</div>
						<div id="paneHtmlPreview" style="display:none;">
							<div class="tmpl-preview-area" id="previewContainer"></div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		var isNewMode = true;

		var formGridView = {
			initView: function() {
				var _this = this;
				this.target = new ax5.ui.grid();
				this.target.setConfig({
					target: $('[data-ax5grid="form-grid"]'),
					showLineNumber: true,
					showRowSelector: false,
					multipleSelect: false,
					header: { align: "center" },
					body: {
						onClick: function() {
							this.self.clearSelect();
							this.self.select(this.dindex);
							loadFormDetail(this.item.formCd);
						}
					},
					columns: [
						{key: "formCd", label: "양식코드", align: "center", width: 120},
						{key: "formNm", label: "양식명칭", align: "left", width: 150},
						{key: "formCatNm", label: "분류", align: "center", width: 80},
						{key: "currVer", label: "Ver", align: "center", width: 50, formatter: function() { return this.value || this.item.formVer || 1; }},
						{key: "useYn", label: "사용", align: "center", width: 50}
					],
					page: {
						navigationItemCount: 8,
						height: 30,
						display: true,
						firstIcon: '<i class="fa fa-step-backward"></i>',
						prevIcon: '<i class="fa fa-caret-left"></i>',
						nextIcon: '<i class="fa fa-caret-right"></i>',
						lastIcon: '<i class="fa fa-step-forward"></i>',
						onChange: function() {
							_this.setData(this.page.selectPage);
						}
					}
				});
				return this;
			},
			setData: function(pageNo) {
				var _this = this;
				var param = {
					pageNo: (pageNo || 0) + 1,
					recordCnt: 20
				};

				$('[data-search]').each(function() {
					var key = $(this).data('search');
					var val = $(this).val();
					if (val) param[key] = val;
				});

				postAjax("/user/am/am02/selectFormList", param, null, function(data) {
					if (data && data.resultList) {
						_this.target.setData({
							list: data.resultList,
							page: {
								currentPage: (data.paginationInfo ? data.paginationInfo.currentPageNo - 1 : 0),
								pageSize: (data.paginationInfo ? data.paginationInfo.recordCountPerPage : 20),
								totalElements: (data.paginationInfo ? data.paginationInfo.totalRecordCount : 0),
								totalPages: (data.paginationInfo ? data.paginationInfo.totalPageCount : 1)
							}
						});
					}
					setTimeout(resizeAllGrids, 50);
				});
			}
		};

		var resizeTimer = null;

		// 화면 크기에 맞춘 동적 그리드 및 에디터 높이 자동 조절 (하단 여백 최소화)
		function resizeAllGrids() {
			var winHeight = $(window).height();
			var bottomReserve = 18; // GBS 표준 하단 여백

			// 1. 좌측 그리드 동적 높이
			var $formGrid = $('[data-ax5grid="form-grid"]');
			if ($formGrid.length > 0 && formGridView && formGridView.target) {
				var gTop = $formGrid.offset().top;
				var gH = Math.max(320, winHeight - gTop - bottomReserve);
				$formGrid.css('height', gH + 'px');
				formGridView.target.setHeight(gH);
			}

			// 2. 우측 템플릿 HTML 에디터 및 미리보기 영역 동적 높이
			var $editor = $('#formTmplHtml');
			if ($editor.length > 0 && $editor.is(':visible')) {
				var eTop = $editor.offset().top;
				var eH = Math.max(250, winHeight - eTop - bottomReserve - 10);
				$editor.css('height', eH + 'px');
			}
			var $preview = $('#previewContainer');
			if ($preview.length > 0 && $preview.is(':visible')) {
				var pTop = $preview.offset().top;
				var pH = Math.max(250, winHeight - pTop - bottomReserve - 10);
				$preview.css('height', pH + 'px');
			}
		}

		$(document).ready(function() {
			// GBS 상단/좌측 메뉴 로드
			mainDefaultLoad("전자결재", "결재 양식 관리");
			setCommonSelect($("#main_area select[data-kind]"));

			formGridView.initView();
			formGridView.setData(0);

			// 브라우저 리사이즈 시 동적 높이 자동 재계산 (디바운스 100ms)
			$(window).on('resize', function() {
				if (resizeTimer) clearTimeout(resizeTimer);
				resizeTimer = setTimeout(resizeAllGrids, 100);
			});

			setTimeout(resizeAllGrids, 150);
		});

		function initSearch() {
			$('#searchValue_S').val('');
			$('#formCat_S').val('');
			$('#useYn_S').val('Y');
			formGridView.setData(0);
		}

		// 신규 양식 등록 모드 전환
		function newForm() {
			isNewMode = true;
			$('#formDetailForm')[0].reset();
			$('#formCd').prop('readonly', false).css('background', '#ffffff');
			$('#formVer').val(1);
			$('#useYn').val('Y');
			$('#formTmplHtml').val(getDefaultFormTemplate());
			$('#btnVersionUp').hide();
			switchEditorTab('HTML');
		}

		// 양식 상세 조회
		function loadFormDetail(formCd) {
			if (!formCd) return;
			postAjax("/user/am/am02/selectFormDetail", { formCd: formCd, coCd: jwt.coCd || "GUN" }, null, function(data) {
				if (data && data.formInfo) {
					isNewMode = false;
					var f = data.formInfo;
					$('#formCd').val(f.formCd).prop('readonly', true).css('background', '#fafafa');
					$('#formNm').val(f.formNm);
					$('#formCat').val(f.formCat);
					$('#formVer').val(f.currVer || f.formVer || 1);
					$('#useYn').val(f.useYn || 'Y');
					$('#formDesc').val(f.formDesc || '');
					$('#formTmplHtml').val(f.formTmplHtml || '');
					$('#btnVersionUp').show();
					switchEditorTab('HTML');
				}
			});
		}

		// 에디터 탭 전환
		function switchEditorTab(tabType) {
			if (tabType === 'HTML') {
				$('#tabBtnHtml').addClass('active');
				$('#tabBtnPreview').removeClass('active');
				$('#paneHtmlEditor').show();
				$('#paneHtmlPreview').hide();
			} else {
				$('#tabBtnHtml').removeClass('active');
				$('#tabBtnPreview').addClass('active');
				$('#paneHtmlEditor').hide();
				$('#paneHtmlPreview').show();
				$('#previewContainer').html($('#formTmplHtml').val() || '<div class="text-muted" style="text-align:center; padding:30px;">입력된 서식 내용이 없습니다.</div>');
			}
			setTimeout(resizeAllGrids, 50);
		}

		// 양식 저장 (신규/수정/버전업)
		function saveFormSetting(isVersionUp) {
			var formCd = $('#formCd').val();
			var formNm = $('#formNm').val();
			var formCat = $('#formCat').val();

			if (!formCd || formCd.trim().length === 0) {
				alert("양식 코드를 입력하십시오.");
				$('#formCd').focus();
				return;
			}
			if (!formNm || formNm.trim().length === 0) {
				alert("양식 명칭을 입력하십시오.");
				$('#formNm').focus();
				return;
			}

			var currentVer = Number($('#formVer').val() || 1);
			var targetVer = isVersionUp ? (currentVer + 1) : currentVer;

			var confirmMsg = isVersionUp 
				? "현재 양식을 새 버전(v" + targetVer + ")으로 개정 저장하시겠습니까?" 
				: "양식 설정을 저장하시겠습니까?";

			if (!confirm(confirmMsg)) return;

			var param = {
				isNew: isNewMode ? "Y" : "N",
				isNewVer: isVersionUp ? "Y" : "N",
				coCd: jwt.coCd || 'GUN',
				formCd: formCd,
				formNm: formNm,
				formCat: formCat,
				currVer: currentVer,
				formVer: targetVer,
				formDesc: $('#formDesc').val(),
				formTmplHtml: $('#formTmplHtml').val(),
				useYn: $('#useYn').val(),
				userId: jwt.userId,
				userNm: jwt.userNm
			};

			postAjax("/user/am/am02/saveForm", param, null, function(data) {
				if (data && data.resultCode === '200') {
