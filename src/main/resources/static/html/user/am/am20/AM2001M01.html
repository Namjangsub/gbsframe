<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5toast.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5menu.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5calendar.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5picker.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5select.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5combobox.css">
	<link rel="stylesheet" href="/static/css/jstree/style.min.css">
	<link rel="stylesheet" href="/static/css/gnb.css">
	<link rel="stylesheet" href="/static/css/main.css">
	<link rel="stylesheet" href="/static/css/sub.css">
	<link rel="stylesheet" href="/static/css/common.css">

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/ax5/ax5toast.min.js"></script>
	<script src="/static/js/ax5/ax5formatter.min.js"></script>
	<script src="/static/js/ax5/ax5calendar.min.js"></script>
	<script src="/static/js/ax5/ax5picker.min.js"></script>
	<script src="/static/js/ax5/ax5select.min.js"></script>
	<script src="/static/js/jstree/jstree.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/commApproval.js"></script>
	<script src="/static/js/fileTree.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>

	<style>
		.box-tabs {
			margin-bottom: 12px;
			border-bottom: 2px solid #337ab7;
			display: flex;
			gap: 4px;
		}
		.box-tab-btn {
			padding: 8px 16px;
			background: #f1f3f5;
			border: 1px solid #d9d9d9;
			border-bottom: none;
			border-radius: 4px 4px 0 0;
			cursor: pointer;
			font-size: 13px;
			font-weight: bold;
			color: #555;
			transition: all 0.2s;
		}
		.box-tab-btn:hover {
			background: #e9ecef;
			color: #337ab7;
		}
		.box-tab-btn.active {
			background: #337ab7;
			color: #ffffff;
			border-color: #337ab7;
		}
		.box-tab-btn .badge-cnt {
			margin-left: 6px;
			font-size: 11px;
			background: #ffffff;
			color: #337ab7;
			padding: 2px 6px;
			border-radius: 10px;
		}
		.box-tab-btn.active .badge-cnt {
			background: #ffffff;
			color: #337ab7;
		}
	</style>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>

	<div id="main_area">
		<!-- 페이지 타이틀 및 상단 버튼 -->
		<div class="contents no_bg">
			<ul class="btn_ul">
				<li class="btn_r">
					<a onclick="openDraftModal();"><button type="button" class="bg_blue"><i class="fas fa-pencil-alt"></i> 새 결재 진행</button></a>
					<a onclick="initSearch();"><button type="button" class="bg_gray">초기화</button></a>
					<a onclick="gridView.setData(0);"><button type="button" class="bg_gray">검 색</button></a>
				</li>
			</ul>
		</div>

		<!-- 결재함 탭 선택 영역 -->
		<div class="contents no_bg" style="padding-bottom: 0;">
			<div class="box-tabs">
				<button type="button" class="box-tab-btn active" data-box="INBOX" onclick="switchBox('INBOX', this);">
					<i class="fa fa-inbox"></i> 결재 대기함
				</button>
				<button type="button" class="box-tab-btn" data-box="PROGRESS" onclick="switchBox('PROGRESS', this);">
					<i class="fa fa-spinner"></i> 진행 문서함
				</button>
				<button type="button" class="box-tab-btn" data-box="DRAFTED" onclick="switchBox('DRAFTED', this);">
					<i class="fa fa-paper-plane"></i> 상신 문서함
				</button>
				<button type="button" class="box-tab-btn" data-box="COMPLETED" onclick="switchBox('COMPLETED', this);">
					<i class="fa fa-check-circle"></i> 완료 문서함
				</button>
				<button type="button" class="box-tab-btn" data-box="REJECTED" onclick="switchBox('REJECTED', this);">
					<i class="fa fa-times-circle"></i> 반려 문서함
				</button>
				<button type="button" class="box-tab-btn" data-box="REFERENCED" onclick="switchBox('REFERENCED', this);">
					<i class="fa fa-eye"></i> 참조 문서함
				</button>
				<button type="button" class="box-tab-btn" data-box="TEMP" onclick="switchBox('TEMP', this);">
					<i class="fa fa-save"></i> 임시 저장함
				</button>
			</div>
		</div>

		<!-- 검색 조건 영역 (Legacy 규칙: _S 접미사 준수) -->
		<div class="contents search">
			<div>
				<table class="table_input type03">
					<tr>
						<th>회사</th>
						<td>
							<select id="coCd_S" name="coCd_S" data-kind="CO" data-search="coCd"></select>
						</td>
						<th>문서번호</th>
						<td>
							<input type="text" id="docNo_S" name="docNo_S" data-search="docNo" onkeyup="event.keyCode == 13 && gridView.setData(0);">
						</td>
						<th>문서제목</th>
						<td>
							<input type="text" id="docTitle_S" name="docTitle_S" data-search="docTitle" onkeyup="event.keyCode == 13 && gridView.setData(0);">
						</td>
					</tr>
					<tr>
						<th>기안자</th>
						<td>
							<input type="text" id="draUserNm_S" name="draUserNm_S" data-search="draUserNm" onkeyup="event.keyCode == 13 && gridView.setData(0);">
						</td>
						<th>기안부서</th>
						<td>
							<input type="text" id="draDeptNm_S" name="draDeptNm_S" data-search="draDeptNm" onkeyup="event.keyCode == 13 && gridView.setData(0);">
						</td>
						<th>기안기간</th>
						<td>
							<div class="date_input">
								<input type="text" class="input_calendar" onkeyup="dateMask(this);" id="fromDt_S" name="fromDt_S" data-search="fromDt" autocomplete="off" style="cursor:pointer;">
								<span>~</span>
								<input type="text" class="input_calendar" onkeyup="dateMask(this);" id="toDt_S" name="toDt_S" data-search="toDt" autocomplete="off" style="cursor:pointer;">
							</div>
						</td>
					</tr>
				</table>
			</div>
		</div>

		<!-- 결재함 그리드 콘텐츠 -->
		<div class="contents">
			<div class="contents_tit" style="margin-bottom: 6px;">
				<span id="currentBoxTitle" style="font-weight:bold; font-size:14px; color:#337ab7;">결재 대기함</span>
				<span style="font-size:12px; color:#777; margin-left:10px;">* 문서를 더블클릭하면 상세 결재 화면이 나타납니다.</span>
			</div>
			<!-- AX5 Grid -->
			<div data-ax5grid="approval-grid" data-ax5grid-config="{}" style="height: 480px;"></div>
		</div>
	</div>

	<script type="text/javascript">
		var currentBox = "INBOX";

		var boxTitles = {
			"INBOX": "결재 대기함",
			"PROGRESS": "진행 문서함",
			"DRAFTED": "상신 문서함",
			"COMPLETED": "완료 문서함",
			"REJECTED": "반려 문서함",
			"REFERENCED": "참조 문서함",
			"TEMP": "임시 저장함"
		};

		var boxUrls = {
			"INBOX": "/user/am/am20/selectInboxList",
			"PROGRESS": "/user/am/am20/selectProgressList",
			"DRAFTED": "/user/am/am20/selectDraftedList",
			"COMPLETED": "/user/am/am20/selectCompletedList",
			"REJECTED": "/user/am/am20/selectRejectedList",
			"REFERENCED": "/user/am/am20/selectReferencedList",
			"TEMP": "/user/am/am20/selectTempList"
		};

		var gridView = {
			initView: function() {
				var _this = this;
				this.target = new ax5.ui.grid();
				this.target.setConfig({
					target: $('[data-ax5grid="approval-grid"]'),
					showLineNumber: true,
					showRowSelector: false,
					multipleSelect: false,
					sortable: true,
					header: {
						align: "center"
					},
					body: {
						onClick: function() {
							this.self.clearSelect();
							this.self.select(this.dindex);
						},
						onDBLClick: function() {
							var item = this.item;
							if (currentBox === 'TEMP') {
								// 임시저장 건은 기안문서 작성 팝업에서 수정
								openDraftModal(item.docId, item.coCd);
							} else {
								// 일반 결재 건은 상세 결재 팝업 호출
								openApprovalDetailModal(item.docId, item.coCd);
							}
						}
					},
					page: {
						navigationItemCount: 9,
						height: 30,
						display: true,
						firstIcon: '<i class="fa fa-step-backward"></i>',
						prevIcon: '<i class="fa fa-caret-left"></i>',
						nextIcon: '<i class="fa fa-caret-right"></i>',
						lastIcon: '<i class="fa fa-step-forward"></i>',
						onChange: function() {
							_this.setData(this.page.selectPage);
						}
					},
					columns: [
						{key: "coNm", label: "회사", align: "center", width: 80},
						{key: "docNo", label: "문서번호", align: "center", width: 140},
						{key: "formNm", label: "양식명", align: "center", width: 130},
						{key: "docTitle", label: "문서제목", align: "left", width: 350, styleClass: "grid-cell-blue"},
						{key: "docStatusNm", label: "상태", align: "center", width: 80, formatter: "sanctnStsFormatter"},
						{key: "draUserNm", label: "기안자", align: "center", width: 90},
						{key: "draDeptNm", label: "기안부서", align: "center", width: 120},
						{key: "draftDt", label: "기안일시", align: "center", width: 130},
						{key: "currApproverNm", label: "현재결재자", align: "center", width: 90},
						{key: "completeDt", label: "완료일시", align: "center", width: 130}
					]
				});
				return this;
			},
			setData: function(pageNo) {
				var _this = this;
				var param = {
					pageNo: (pageNo || 0) + 1,
					recordCnt: 20,
					userId: jwt.userId,
					coCd: jwt.coCd || "GUN"
				};

				// 검색 조건 바인딩
				$('[data-search]').each(function() {
					var key = $(this).data('search');
					var val = $(this).val();
					if (val) param[key] = val;
				});

				var url = boxUrls[currentBox];
				postAjax(url, param, null, function(data) {
					if (data && data.resultList) {
						_this.target.setData({
							list: data.resultList,
							page: {
								currentPage: (data.paginationInfo ? data.paginationInfo.currentPageNo - 1 : 0),
								pageSize: (data.paginationInfo ? data.paginationInfo.recordCountPerPage : 20),
								totalElements: (data.paginationInfo ? data.paginationInfo.totalRecordCount : 0),
								totalPages: (data.paginationInfo ? data.paginationInfo.totalPageCount : 1)
							}
						});
					}
				});
			}
		};

		$(document).ready(function() {
			// GBS 기본 메뉴(header.html / top.html) 로드
			mainDefaultLoad("전자결재", "통합 결재함");
			setCommonSelect($("#main_area select[data-kind]"));

			gridView.initView();

			// URL 쿼리스트링에서 boxType 확인
			var urlParams = new URLSearchParams(window.location.search);
			var paramBox = urlParams.get('boxType');
			if (paramBox && boxTitles[paramBox]) {
				$('.box-tab-btn').removeClass('active');
				$('.box-tab-btn[data-box="' + paramBox + '"]').addClass('active');
				currentBox = paramBox;
			}
			$('#currentBoxTitle').text(boxTitles[currentBox]);

			// 기본 기안일자 (최근 1개월)
			var today = moment().format('YYYY-MM-DD');
			var monthAgo = moment().subtract(1, 'month').format('YYYY-MM-DD');
			$('#fromDt_S').val(monthAgo);
			$('#toDt_S').val(today);

			// 기안기간 DateRangePicker
			$('#fromDt_S, #toDt_S').on('click', function () {
				DateRangePicker.open({
					startDt: $('#fromDt_S').val() || null,
					endDt: $('#toDt_S').val() || null,
					excludeSelectors: ['#fromDt_S', '#toDt_S'],
					onApply: function (sd, ed) {
						$('#fromDt_S').val(sd);
						$('#toDt_S').val(ed);
						gridView.setData(0);
					}
				});
			});

			// 검색조건 변경 시 자동 검색
			$('[data-search]').on("change", function () {
				gridView.setData(0);
			});

			gridView.setData(0);
		});

		// 탭 전환
		function switchBox(boxKey, btn) {
			currentBox = boxKey;
			$('.box-tab-btn').removeClass('active');
			$(btn).addClass('active');
			$('#currentBoxTitle').text(boxTitles[boxKey]);
			gridView.setData(0);
		}

		// 검색 초기화
		function initSearch() {
			$('.contents.search input[type="text"]').val('');
			$('#coCd_S').val('');
			var today = moment().format('YYYY-MM-DD');
			var monthAgo = moment().subtract(1, 'month').format('YYYY-MM-DD');
			$('#fromDt_S').val(monthAgo);
			$('#toDt_S').val(today);
			gridView.setData(0);
		}

		// 기안문 작성 모달
		function openDraftModal(docId, coCd) {
			var paramObj = {
				actionType: docId ? "U" : "C",
				docId: docId || "",
				userId: jwt.userId,
				userNm: jwt.userNm,
				coCd: coCd || jwt.coCd,
				deptId: jwt.deptId
			};
			openModal("/static/html/user/am/am11/AM1101P01.html", 950, 750, "기안문 작성", paramObj, function() {
				gridView.setData(0);
			});
		}

		// 결재 상세 모달
		function openApprovalDetailModal(docId, coCd) {
			if (!docId) return;
			var paramObj = {
				docId: docId,
				userId: jwt.userId,
				userNm: jwt.userNm,
				coCd: coCd || jwt.coCd
			};
			openModal("/static/html/user/am/am12/AM1201P01.html", 980, 840, "전자결재 문서 상세", paramObj, function() {
				gridView.setData(0);
			});
		}
	</script>
</body>
</html>
