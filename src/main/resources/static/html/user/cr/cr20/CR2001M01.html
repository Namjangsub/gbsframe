<script type="text/javascript">
	var isFirst = true;
	var group_text = "";
	var cr20RawList = [];

	function ensureMultiselect(callback) {
		if ($.fn.multiselect) {
			callback();
		} else {
			$('<link/>', {
				rel: 'stylesheet',
				type: 'text/css',
				href: '/static/bootstrap/css/bootstrap-multiselect.css'
			}).appendTo('head');
			$.getScript('/static/bootstrap/js/bootstrap-multiselect.min.js', function() {
				callback();
			});
		}
	}

	function buildOrdererOptionsAndFilter() {
		var ordererSet = new Set();
		var hasEmptyOrderer = false;

		for (var i = 0; i < cr20RawList.length; i++) {
			var ord = String(cr20RawList[i].ordrger || '').trim();
			if (ord) {
				ordererSet.add(ord);
			} else {
				hasEmptyOrderer = true;
			}
		}

		var sortedOrderers = Array.from(ordererSet).sort();
		var ordererOptions = [];
		for (var k = 0; k < sortedOrderers.length; k++) {
			ordererOptions.push({
				code: sortedOrderers[k],
				name: sortedOrderers[k]
			});
		}
		if (hasEmptyOrderer) {
			ordererOptions.push({
				code: "__EMPTY__",
				name: "(발주자 미입력)"
			});
		}

		var prevSelected = $('#ordrger_S').val() || [];

		var $sel = $('#ordrger_S');
		$sel.empty();
		for (var m = 0; m < ordererOptions.length; m++) {
			var opt = ordererOptions[m];
			$sel.append('<option value="' + opt.code + '">' + opt.name + '</option>');
		}

		if ($sel.data('multiselect')) {
			$sel.multiselect('rebuild');
		}

		if (prevSelected.length > 0) {
			$sel.multiselect('select', prevSelected);
		}

		applyOrdererFilter();
	}

	function applyOrdererFilter() {
		var selectedOrderers = $('#ordrger_S').val() || [];
		var isFiltered = (selectedOrderers.length > 0);
		var filterSet = new Set(selectedOrderers);
		var allowEmpty = filterSet.has('__EMPTY__');

		function matchesOrderer(row) {
			if (!isFiltered) return true;
			var o = String(row.ordrger || '').trim();
			if (!o) return allowEmpty;
			return filterSet.has(o);
		}

		var filteredList = [];
		var seenNo2 = new Set();

		for (var i = 0; i < cr20RawList.length; i++) {
			var item = cr20RawList[i];
			if (!matchesOrderer(item)) continue;

			var rowCopy = $.extend({}, item);
			rowCopy.ordrsAmt = gPasFloatChk(rowCopy.ordrsAmt);
			rowCopy.ordrsPrc = gPasFloatChk(rowCopy.ordrsPrc);
			rowCopy.unOrdrsPrc = gPasFloatChk(rowCopy.unOrdrsPrc) * (-1);
			rowCopy.unUnsettledAmt = gPasFloatChk(rowCopy.unUnsettledAmt);

			var key = (rowCopy.ordrsNo || '') + '_' + (rowCopy.ordrsSeq || '');
			if (seenNo2.has(key)) {
				rowCopy.sumOrdrsAmt = 0;
				rowCopy.sumOrdrsPrc = 0;
				rowCopy.sumUnUnsettledAmt = 0;
			} else {
				seenNo2.add(key);
				rowCopy.sumOrdrsAmt = rowCopy.ordrsAmt;
				rowCopy.sumOrdrsPrc = rowCopy.ordrsPrc;
				rowCopy.sumUnUnsettledAmt = rowCopy.unUnsettledAmt;
			}
			filteredList.push(rowCopy);
		}

		if (gridView && gridView.target) {
			gridView.target.setData({
				list : filteredList,
				page : {
					currentPage : 0,
					pageSize : filteredList.length,
					totalElements : filteredList.length,
					totalPages : 1
				}
			});
		}

		if (excelView && excelView.target) {
			excelView.target.setData({
				list : filteredList,
				page : {
					totalElements : filteredList.length
				}
			});
		}
	}
	ax5.ui.grid.formatter["useYn"] = function () {
		var color = this.value == "Y" ? "color-circle_02.png" : "color-circle_01.png";
		if (this.value == "E"){
			return 'E';
		} else {
			return '<img src="/static/img/'+color+'" style="width: 10px;height: 10px;"></img>';
		}
	};

	var cr2001SumCells = {
		"ordrsAmt": {key: "sumOrdrsAmt", collector: "sum", formatter: "money", align: "right"},
		"ordrsPrc": {key: "sumOrdrsPrc", collector: "sum", formatter: "money", align: "right"},
		"unOrdrsPrc": {collector: "sum", formatter: "money", align: "right"},
		"unUnsettledAmt": {key: "sumUnUnsettledAmt", collector: "sum", formatter: "money", align: "right"}
	};

	var defaultColumns = [
		{key: "ordrger"				, label: "발주자"	, align: "center", width:80},
		{key: "clntNm"				, label: "고객사"	, align: "left", width:120},
		{key: "clntPjtNm"			, label: "프로젝트"	, align: "left", width:80},
		{key: undefined				, label: "미정산 발생 수주정보",
			columns: [
				{key: "ordrsDivNm"	, label: "수주구분"	, align: "center", width:70},
				{key: "eqpNm"		, label: "발생설비명"	, align: "left", width:200},
				{key: "ordrsAmt"	, label: "수주금액"	, align: "right", width: 90, formatter: "money"},
				{key: "pmntMtdNm"	, label: "결재방법"	, align: "center", width: 60},
				{key: "mngIdNm"		, label: "담당자"	, align: "center", width: 60},
				{key: "ordrsNo"		, label: "번호"		, align: "center", width: 60, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
				{key: "ordrsSeq"	, label: "순번"		, align: "center", width: 50, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
				{key: "ordrsDt"		, label: "수주일자"	, align: "center", width: 80, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
			]
		},
		{key: undefined				, label: "정산내역"	, columns: [
			{key: "billYn"			, label: "완료"		, align: "center", width: 60, formatter: "useYn"},
			{key: "ordrsPrc"		, label: "발생금액"	, align: "right", width: 100, formatter: "money", styleClass: function () { return "grid-row-blue grid-font-red-bold"; }},
			{key: "unOrdrsPrc"		, label: "정산금액"	, align: "right", width: 100, formatter: "money", styleClass: function () { return "grid-row-blue grid-no-msg-font-blue-bold"; }},
			{key: "unUnsettledAmt"	, label: "미정산잔액", align: "right", width: 100, formatter: "money"},
		]},
		{key: undefined				, label: "정산상계 수주정보"		,
			columns: [
				{key: "unOrdrsNo"	, label: "번호"		, align: "center", width: 60, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
				{key: "unOrdrsSeq"	, label: "순번"		, align: "center", width: 50, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
				{key: "unOrdrsDt"	, label: "수주일자"	, align: "center", width: 80, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : "";}},
				{key: "unPmntMtdNm"	, label: "결재방법"	, align: "center", width: 60},
				{key: "unClntNm"	, label: "고객사"	, align: "left", width: 120},
				{key: "unClntPjtNm"	, label: "프로젝트"	, align: "left", width: 80},
				{key: "unEqpNm"		, label: "정산설비명"	, align: "left", width: 200},
			]
		},
	];

	var gridView = {
		initView : function() {
			this.target = new ax5.ui.grid();
			var cols = GridColumnConfig.apply("CR2001M01", "grid1", defaultColumns);
			this.target.setConfig({
                frozenColumnIndex: 5,
				lineNumberColumnWidth: 40,
				showLineNumber    : true,
				showRowSelector   : false,
				multipleSelect    : false,
				sortable          : true,
				target : $('[data-ax5grid="grid1"]'),
				header : {
					align: "center",
					selector: false
				},
				body: {
					grouping: {
						by: ["ordrger"],
						columns: GridColumnConfig.buildSumRow(cols, {
							label: function () {
								return "[ " + (this.groupBy.labels[0] || "발주자 미입력") + " 소계 ]";
							},
							labelColspan: 5,
							sums: cr2001SumCells
						})
					},
					onClick: function () {
					},
					onDBLClick: function () {
						if (!this.item || this.item.__isGrouping) {
							return;
						}
						if( this.colIndex > 13) {	//정산수주번호 이후 컬럼 더블클릭이면
							updateProjectModal(this.item, 'BILL');	//정상처리용 수주내역 불러오기
						} else {
							updateProjectModal(this.item, '');		//왼쪽 추후정산 등록 수주 불러오기
						}
					},
					onDataChanged: function () {
					},
					mergeCells : [ "ordrger", "clntNm", "clntPjtNm", "ordrsDivNm", "eqpNm", "ordrsAmt",  "pmntMtdNm"
					             , "mngIdNm", "yyyy", "ordrsNo", "ordrsSeq", "ordrsMmdd"
								 , "billYn", "ordrsPrc", "unUnsettledAmt"],
				},
				columns : cols,
				footSum: [
					GridColumnConfig.buildSumRow(cols, {label: "총계", labelColspan: 5, sums: cr2001SumCells})
  			    ],
				page: {
	                navigationItemCount: 10,
	                height: 30,
	                display: true,
	                firstIcon: '<i class="fa fa-step-backward" aria-hidden="true"></i>',
	                prevIcon: '<i class="fa fa-caret-left" aria-hidden="true"></i>',
	                nextIcon: '<i class="fa fa-caret-right" aria-hidden="true"></i>',
	                lastIcon: '<i class="fa fa-step-forward" aria-hidden="true"></i>',
	                onChange: function () {
	                    gridView.setData(this.page.selectPage);
	                }
	            }
			});
			return this;
		},
		setData : function(_pageNo) {
			if (isFirst) return;
			var targetObj = this.target;
			if (inputValidation($('input[required]'))) {
				var formData = {};
				$.each($('[data-search]'), function(idx, elem){
					formData[$(elem).data("search")] = $(elem).val();
				});
				formData["pageNo"]    = _pageNo + 1;
				formData["recordCnt"] = $('#recordCnt').val();
				postAjax("/user/cr/cr20/select_cr20m01_List", formData, null, function(data) {
					try {
						gridHeightResize(gridView, 195);
						cr20RawList = data.result || [];
						buildOrdererOptionsAndFilter();
					} catch (error) {
						alert("오류 발생!! 전산실 연락 바랍니다", error.message);
						return null;
					}
				});
  			}
  		}
  	}

    var excelView = {
		initView: function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				target: $('[data-ax5grid="grid1_excel"]'),

				body: {
				},
				columns : [
					{key: "ordrger"				, label: "발주자"	, align: "center", width: 80},
					{key: "clntNm"				, label: "고객사"	, align: "left", width:140},
					{key: "clntPjtNm"			, label: "프로젝트"	, align: "left", width:100},
					{key: "ordrsDivNm"			, label: "수주구분"	, align: "center", width:70},

	//화면로드시
	$(document).ready(function() {
		mainDefaultLoad("영업관리", "수주 미정산현황 관리"); // 페이지 타이틀 설정
		setCommonSelect($("#main_area select[data-kind]")); // 공통코드 set

		//회사 기본값지정
		$("#coCd_S").val(jwt.coCd);
		setByCoCd($("#coCd_S").val());

		ensureMultiselect(function() {
			$('#ordrger_S').multiselect({
				includeSelectAllOption: true,
				selectAllText: '전체 선택',
				nonSelectedText: '발주자 전체',
				allSelectedText: '발주자 전체',
				nSelectedText: '명 선택',
				numberDisplayed: 1,
				maxHeight: 250,
				buttonWidth: '100%',
				onChange: function() {
					applyOrdererFilter();
				},
				onSelectAll: function() {
					applyOrdererFilter();
				},
				onDeselectAll: function() {
					applyOrdererFilter();
				}
			});

			isFirst = false;
			//그리드 초기화
			gridView.initView();
			excelView.initView();

			// 검색조건 이벤트 bind
	  		$('[data-search]').on("change", function(){
	  			DataSearch();
	  		});

	  		DataSearch();
	  		//권한체크
	  		authChk();
		});
	});

	// 초기화 버튼
	function initSearch() {
		$('[data-search]').off("change");	//바인딩기능 오프
		$('.contents.search select, .contents.search input').val("");
		// 회사 선택 상자 값 설정
		$("#coCd_S").val(jwt.coCd);

		if ($('#ordrger_S').data('multiselect')) {
			$('#ordrger_S').multiselect('deselectAll', false);
			$('#ordrger_S').multiselect('updateButtonText');
		}

		// 검색조건 이벤트 bind
		$('[data-search]').on("change", function(){
			gridView.setData(0);
		});

		gridView.initView().setData(0);
		excelView.initView();
	}

	// 검색 버튼
    function DataSearch() {
		gridView.initView().setData(0);
    }

	function excelDown() {
		var todayDate = new Date().format('yyyyMMddHHmmss');
		excelView.target.exportExcel("수주 미정산현황 관리_" + todayDate + ".xls");
	}

	// 거래처 검색
	function openClntSearch(openType) {
		var searchValueM = null;
		searchValueM = $('#ordrsClntNm_S').val();

		var paramObj = {
			"searchValue" :  searchValueM
			, "clntDivCd" : "CLNTDIV12"  /*거래처 검색 기본값 고객사로 세팅 */
			, "pchsClntCd" : "CLNTDIV12" /*구매처 팝업일 경우 구분자 고객사 제외하고 세팅 */
		}
		if(openType == "S") {
			paramObj.clntDivCd = null;
		}
		//발주관리에서 호출 플래그 추가
		paramObj.orderFlag = "Y";

		openSecondModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "거래처 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$('#ordrsClntCd_S').val(row.clntCd);
			$('#ordrsClntNm_S').val(row.clntNm);
			DataSearch();
		});
	}

	//수주번호
	function opendOrdrsSearch() {
		var paramObj = {
			"coCd"    : $('#coCd_S').val(),
			"ordrsNo" : $('#ordrsNo_S').val()
		};

		openSecondModal("/static/html/cmn/modal/ordrsSearch.html", 1200, 800, "수주번호 검색", paramObj, function(grid) {
			//debugger;
			var row = grid.target.getList("selected")[0];
			$('#ordrsNo_S').val(row.ordrsNo);
			DataSearch();
		});
	}

    // 판매법인 set
	function setByCoCd(value) {
		$('#coCd_S option:not([value="'+value+'"])').remove();
    }

	// 담당자 검색
	function openUserTree() {
		var paramObj = {
			"coCd"   : $('#coCd_S').val(),
			"userId" : $('#searchid_S').val(),
			"userNm" : $('#searchidnm_S').val(),
			"useYn"  : "Y"
		};

		openModal("/static/html/cmn/modal/userSearch.html", 450, 650, "사용자 검색", paramObj, function (tree){
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#searchid_S').val(checkedNode.id);
			$('#searchidnm_S').val(checkedNode.text);
			DataSearch();
		});
	}


    function updateProjectModal(row, part='') {
   		var paramObj = {
   			actionType  : 'U',
   			fileTrgtKey : row.fileTrgtKey,
   			coCd        : row.coCd,
   			ordrsNo	    : row.ordrsNo,
   			histNo	    : row.histNo,
   			userId      : jwt.userId,
   			pgmId       : "CR0201M02"
   		};

   		if (part == 'BILL') {
			if (!row.unFileTrgtKey) return false;
   			paramObj.coCd 		 = row.unCoCd;
   			paramObj.fileTrgtKey = row.unFileTrgtKey;
   			paramObj.ordrsNo	 = row.unOrdrsNo;
   			paramObj.histNo	     = row.unHistNo;
		}

        openModal("/static/html/user/cr/cr02/CR0202P01.html", $('body').width(), $('body').height()-40, "", paramObj,  function(data) {
        	DataSearch();
        });
    }

	function openGridColumnEdit() {
		GridColumnConfig.openEditor("CR2001M01", "grid1", defaultColumns, function() {
			if (gridView.target) {
				try { gridView.target.destroy(); } catch(e) {}
			}
			$('[data-ax5grid="grid1"]').empty();
			gridView.initView().setData(0);
		});
	}

	// 고객사PJT 팝업
	function opendClntPjtSearch(inputValue) {
		var paramObj = {
			"searchValue" : inputValue
		};

		openModal("/static/html/cmn/modal/pjtSearch.html", 600, 700, "프로젝트 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$('#clntPjt_S').val(row.codeId);
			$('#clntPjtNm_S').val(row.codeNm);
			DataSearch();
		});
	}
