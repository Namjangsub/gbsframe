	.badge-issue {
		display: inline-block;
		padding: 1px 5px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		margin-left: 4px;
		vertical-align: middle;
		cursor: default;
	}
	.badge-issue.badge-issue-has-unresolved {
		background-color: #d9534f; /* 미완료 이슈 있음 (붉은색) */

		background-color: #5cb85c; /* 전체 완료 (초록색) */

		display: inline-block;
		padding: 1px 5px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		background-color: #e67e22; /* 미확정 주황/경고 */

		vertical-align: middle;
		cursor: default;
	}
	.badge-unsettled {
		display: inline-block;
		padding: 1px 5px;
		font-size: 10px;

		line-height: 1.3;

		margin-left: 4px;
		vertical-align: middle;
		cursor: default;
	}

		display: inline-block;
		padding: 1px 5px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		background-color: #3498db; /* 정산상계 파란색 */

		vertical-align: middle;
		cursor: default;
	}

    ul.ul_list.type03-est li {
        width: calc(100% - 6px);

    }

    ul.ul_list.type03-est li:nth-child(odd) {

    } */

    @media only screen and (max-width: 767px) {

        .file, .ordar {

<script type="text/javascript">
    var isFirst = true;
    let select_index = null;

	// 합계대상 컬럼 정의 (footSum 총계행, buildSumRow가 최종 컬럼 순서에 맞춰 위치 자동 생성)
	// 중복 수주 정보가 포함된 2레벨 데이터이므로, 중복되지 않는 가상 key(sum*)를 기반으로 집계해야 합니다.
	var cr0201SumCells = {
		"ordrsAmt"                  : { key: "sumOrdrsAmt", collector: "sum", formatter: "money", align: "right" },
		"exchangeAmt"               : { key: "sumExchangeAmt", collector: "sum", formatter: "money", align: "right" },
		"unsettledAmt"              : { key: "sumUnsettledAmt", collector: "sum", formatter: "money", align: "right" },
		"settlementAmt"             : { key: "sumSettlementAmt", collector: "sum", formatter: "money", align: "right" },
		"cnfmYnAmt"                 : { key: "sumCnfmYnAmt", collector: "sum", formatter: "money", align: "right" },
		"ordrsPrcMach"              : { key: "sumOrdrsPrcMacht", collector: "sum", formatter: "money", align: "right" },
		"ordrsPrcElcty"             : { key: "sumOrdrsPrcElcty", collector: "sum", formatter: "money", align: "right" },
		"ordrsPrc"                  : { key: "sumOrdrsPrc", collector: "sum", formatter: "money", align: "right" },
		"estEpctMatPrc"             : { key: "sumEstEpctMatPrc", collector: "sum", formatter: "money", align: "right" },
		"trgtMchMnr"                : { key: "sumTrgtMchMnr", collector: "sum", formatter: "money", align: "right" },
		"trgtElcMnr"                : { key: "sumTrgtElcMnr", collector: "sum", formatter: "money", align: "right" },
		"trgtPchsPcostMach"         : { key: "sumTrgtPchsPcostMach", collector: "sum", formatter: "money", align: "right" },
		"trgtPchsPcostElcty"        : { key: "sumTrgtPchsPcostElcty", collector: "sum", formatter: "money", align: "right" },
		"sum"                       : { key: "sumSum", collector: "sum", formatter: "money", align: "right" },
		"trgtPchsPcostInHousePrcsn" : { key: "sumTrgtPchsPcostInHousePrcsn", collector: "sum", formatter: "money", align: "right" },
		"machineValueAfterDeduction": { key: "sumMachineValueAfterDeduction", collector: "sum", formatter: "money", align: "right" }
	};

	// 합계 컬럼명이 sum용 가상key이므로 setData 시 그대로 유지 (footSum collector가 해당 key로 집계)
	var cr0201SumKeyMap = {
		"sumOrdrsAmt"                   : "ordrsAmt",
		"sumExchangeAmt"                 : "exchangeAmt",
		"sumUnsettledAmt"                : "unsettledAmt",
		"sumSettlementAmt"               : "settlementAmt",
		"sumCnfmYnAmt"                  : "cnfmYnAmt",
		"sumOrdrsPrcMacht"               : "ordrsPrcMach",
		"sumOrdrsPrcElcty"               : "ordrsPrcElcty",
		"sumEstEpctMatPrc"               : "estEpctMatPrc",
		"sumTrgtPchsPcostMach"           : "trgtPchsPcostMach",
		"sumTrgtPchsPcostElcty"          : "trgtPchsPcostElcty",
		"sumTrgtPchsPcostInHousePrcsn"   : "trgtPchsPcostInHousePrcsn",
		"sumTrgtMchMnr"					 : "trgtMchMnr",
		"sumTrgtElcMnr"					 : "trgtElcMnr"
	};

	ax5.ui.grid.formatter["appStatus"] = function () {
		if(this.value == undefined || this.value == "" || this.value == "N") {
	        return ' ';
		}else if(this.value == "Y"){
	    	return '<img src="/static/img/color-circle_02.png" style="width: 10px;height: 10px;"></img>';
	    }
		else if(this.value == "0"){
 	    	return '<span style="font-size:11px;color:silver">●</span>';
 	    }
		else {
	    	return '<span style="font-size:11px;color:red">●</span>';
	    }
	};
	function gridColorSet(_itemOrCollapse) {
		var _collapse = "";
		var _cnfmYnAmt = 0;
		if (typeof _itemOrCollapse === "object" && _itemOrCollapse !== null) {
			_collapse = _itemOrCollapse.collapse;
			_cnfmYnAmt = gPasFloatChk(_itemOrCollapse.cnfmYnAmt);
		} else {
			_collapse = _itemOrCollapse;
		}

		if (String(_collapse) === "2") {
			styleClass = "grid-cell-yellow";
		} else if (String(_collapse) === "3" || _cnfmYnAmt > 0){
			styleClass = "grid-cell-red";
		} else {
			styleClass = "";
		}
		return styleClass;
	}



	/**
	 * 수주/SalesCd 그리드 뱃지 통합 생성 및 관리 함수
	 * @param {Object} item 행 데이터
	 * @returns {string} 뱃지 HTML 문자열
	 */
	function getSalesCdBadgesHtml(item) {
		if (!item) return '';
		var badges = '';

		// 1) 이슈 뱃지 (미완료문제건수 / 발생건수)
		var totIss = parseInt(item.issueTotCnt, 10);
		var uncompIss = parseInt(item.issueUncompCnt, 10);
		if (!isNaN(totIss) && totIss > 0) {
			var uncomp = isNaN(uncompIss) ? 0 : uncompIss;
			var cls = uncomp > 0 ? "badge-issue-has-unresolved" : "badge-issue-all-resolved";
			badges += '<span class="badge-issue ' + cls + '" title="미완료문제 ' + uncomp + '건 / 발생 ' + totIss + '건">' + uncomp + '/' + totIss + '</span>';
		}

		// 2) 미확정 뱃지 (기준: 확정여부 미확정 cnfmYn === 'N' 인 경우)
		if (item.cnfmYn === 'N') {
			badges += '<span class="badge-unconfirmed" title="미확정 건 존재">미확정</span>';
		}

		// 3) 미정산 뱃지 (추후정산 항목이 있는 경우: unsettledAmt > 0 또는 ordrsDtlDiv10 === 'ORDRSDTLDIV1040')
		var unsettledAmt = gPasFloatChk(item.unsettledAmt);
		var isUnsettledItem = (item.ordrsDtlDiv10 === 'ORDRSDTLDIV1040');
		if (unsettledAmt > 0 || isUnsettledItem) {
			var unsettledTitle = "추후정산: " + (unsettledAmt > 0 ? unsettledAmt.toLocaleString() + "천원" : "항목존재");

						if (salesCdArr.length > 0) {
							var reqCoCd = $("#coCd_S").val() || (list[0] && list[0].coCd) || jwt.coCd;
							// ordrsIssueList 팝업 및 작업일보/WBS 이슈 전체 대상과 동일하게 조회
							var issueParam = {
								"coCd"      : reqCoCd,
								"salesCd"   : "",
								"reqDtFrom" : "20200101",
								"reqDtTo"   : "20991231",

								"issSts"    : ""
							};
							postAjax("/user/pm/pm01/selectAllIssueWorkList", issueParam, null, function(issData) {
								try {
									var allIssues = issData.result || [];
									// 현재 페이지의 수주번호 및 salesCd 목록 필터링 및 집계
									var issMap = {};
									for (var m = 0; m < allIssues.length; m++) {
										var rowIss = allIssues[m];
										var isSalesCd = String(rowIss.salesCd || '').trim();
										var isOrdrsNo = String(rowIss.ordrsNo || '').trim();
										if (!isSalesCd && !isOrdrsNo) continue;

										// 상태 판별: ISSSTS03(완료) 또는 REQST03(완료)가 아니면 미완료
										var isUncomp = (rowIss.issSts !== 'ISSSTS03' && rowIss.issSts !== 'REQST03' && rowIss.reqSt !== 'REQST03');

										// salesCd 키 기준 누적
										if (isSalesCd) {
											if (!issMap[isSalesCd]) issMap[isSalesCd] = { totCnt: 0, uncompCnt: 0 };
											issMap[isSalesCd].totCnt += 1;
											if (isUncomp) issMap[isSalesCd].uncompCnt += 1;
										}

										// ordrsNo 키 기준 누적 (수주번호 접두사 또는 일치)
										var targetOrdrsNo = isOrdrsNo;
										if (!targetOrdrsNo && isSalesCd.indexOf('-') > 0) {
											targetOrdrsNo = isSalesCd.split('-')[0];
										}
										if (targetOrdrsNo) {
											if (!issMap[targetOrdrsNo]) issMap[targetOrdrsNo] = { totCnt: 0, uncompCnt: 0 };
											issMap[targetOrdrsNo].totCnt += 1;
											if (isUncomp) issMap[targetOrdrsNo].uncompCnt += 1;
										}
									}

									// 자식(lvl 2) 행의 이슈 건수 합산하여 부모(lvl 1)에 반영
									var parentIssueMap = {};
									for (var p = 0; p < list.length; p++) {
										var pSc = String(list[p].salesCd || '').trim();
										var pOn = String(list[p].ordrsNo || '').trim();
										var hit = issMap[pSc] || (pSc ? issMap[pSc.split('-')[0]] : null);
										if (hit && list[p].lvl == '2') {
											if (!parentIssueMap[pOn]) {
												parentIssueMap[pOn] = { totCnt: 0, uncompCnt: 0 };
											}
											parentIssueMap[pOn].totCnt += hit.totCnt;
											parentIssueMap[pOn].uncompCnt += hit.uncompCnt;
										}
									}

									for (var n = 0; n < list.length; n++) {
										var curSc = String(list[n].salesCd || '').trim();
										var curOn = String(list[n].ordrsNo || '').trim();
										var matched = null;

										if (list[n].lvl == '1') {
											// 마스터 수주번호 기준 매핑 (직접 매핑 또는 자식들 합산)
											matched = issMap[curOn] || issMap[curSc] || parentIssueMap[curOn];
										} else {
											// 상세 행: salesCd 정확 매칭
											matched = issMap[curSc];
										}

										if (matched && matched.totCnt > 0) {
											list[n].issueTotCnt = matched.totCnt;
											list[n].issueUncompCnt = matched.uncompCnt;
										} else {
											list[n].issueTotCnt = 0;
											list[n].issueUncompCnt = 0;
										}
									}
								} catch (e) {
									console.error("이슈 집계 매핑 오류", e);
								} finally {
									renderGrid();
								}
							});
						} else {
							renderGrid();
						}
                    } catch (error) {
                        alert("오류 발생!! 전산실 연락 바랍니다", error.message);

                    }

       			userVisiable = true;

       			userVisiable = false;
            }
   			

			const seenNo2 = new Set();
			for (let i = 0; i < list.length; i++) {
				if (userVisiable) {	//ex.  영업팀은 조회가능하나 타팀은 금액확인 못하게

                    list[i].exchangeAmt = 0;		//
                    list[i].estTrgtCost = 0;		//수주목표
                    list[i].ordrsPrcMach = 0;		//기계PART
                    list[i].ordrsPrcElcty = 0;		//전기PART
                    list[i].ordrsPrc = 0;			//전기PART
				}
				list[i].exrate = gPasFloatChk(list[i].exrate);
				list[i].unsettledAmt = gPasFloatChk(list[i].unsettledAmt);
				list[i].settlementAmt = gPasFloatChk(list[i].settlementAmt);
				list[i].ordrsQty = gPasFloatChk(list[i].ordrsQty);
				list[i].estEpctMatPrc = gPasFloatChk(list[i].estEpctMatPrc);
				list[i].trgtMchMnr = gPasFloatChk(list[i].trgtMchMnr);
				list[i].trgtElcMnr = gPasFloatChk(list[i].trgtElcMnr);
				list[i].trgtPchsPcostMach = gPasFloatChk(list[i].trgtPchsPcostMach);
				list[i].trgtPchsPcostElcty = gPasFloatChk(list[i].trgtPchsPcostElcty);
				list[i].sum = gPasFloatChk(list[i].sum);
				list[i].trgtPchsPcostInHousePrcsn = gPasFloatChk(list[i].trgtPchsPcostInHousePrcsn);
				list[i].machineValueAfterDeduction = gPasFloatChk(list[i].machineValueAfterDeduction);

				if (jwt.deptId == "GUN70" || jwt.deptId.startsWith("GUN60")) {
					list[i].estEpctMatPrc = 0;
					list[i].trgtPchsPcostMach = 0;

					list[i].sum = 0;
					list[i].trgtPchsPcostInHousePrcsn = 0;
					list[i].machineValueAfterDeduction = 0;
				}
				list[i].ordrsNo = gPasIntChk(list[i].ordrsNo);
				list[i].histNo = gPasIntChk(list[i].histNo);
				if (seenNo2.has(list[i].ordrsNo)) {
					list[i].sumOrdrsAmt = 0;            				// 중복 번호면 합계용 금액 0

					list[i].sumOrdrsPrcElcty = 0;            			// 중복 번호면 합계용 금액 0
					list[i].sumOrdrsPrc = 0;            				// 중복 번호면 합계용 금액 0
					list[i].sumEstEpctMatPrc = 0;            			// 중복 번호면 합계용 금액 0
					list[i].sumTrgtMchMnr = 0;
					list[i].sumTrgtElcMnr = 0;
					list[i].sumTrgtPchsPcostMach = 0;           		// 중복 번호면 합계용 금액 0
					list[i].sumTrgtPchsPcostElcty = 0;           	 	// 중복 번호면 합계용 금액 0
					list[i].sumSum = 0;            						// 중복 번호면 합계용 금액 0

					list[i].sumMachineValueAfterDeduction = 0;          // 중복 번호면 합계용 금액 0
				} else {
				    seenNo2.add(list[i].ordrsNo);
