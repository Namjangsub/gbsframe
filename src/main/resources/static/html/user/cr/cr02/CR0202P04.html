<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-multiselect.css">
<script src="/static/bootstrap/js/bootstrap-multiselect.min.js"></script>

<style>
	#cr0202p04Form .cr0202p04-highlight-row {
		background: #ff9b46 !important;
	}
	/* Multiselect 버튼 톤앤매너 */
	#cr0202p04Form .btn-group {
		width: 100%;
	}
	#cr0202p04Form button.multiselect.dropdown-toggle {
		font-size: 12px;
		padding: 2px 8px;
		height: 24px;
		width: 100%;
		color: #333;
		background: #ffffff;
		border: 1px solid #ccc;
		border-radius: 3px;
		text-align: left;
		line-height: 18px;
	}
	#cr0202p04Form button.multiselect.dropdown-toggle .caret {
		float: right;
		margin-top: 7px;
	}
	#cr0202p04Form ul.multiselect-container.dropdown-menu {
		font-size: 12px;
		max-height: 320px;
		overflow-y: auto;
		z-index: 1050;
	}
</style>

<div id="cr0202p04Form" class="popup_area of_a" style="width: 100%; height: 100%;">
	<div class="tit_contents">
		<h4 class="tit">미확정 설비원가 조회</h4>
		<div class="add_btn_small pdl10">
			<a onclick="cr0202p04ExportExcel();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-file-excel"></i> 엑셀다운로드</a>
		</div>
	</div>

	<table>
		<colgroup>
			<col width="6%">
			<col width="12%">
			<col width="6%">
			<col width="22%">
			<col width="6%">
			<col width="16%">
			<col width="6%">
			<col width="14%">
			<col width="12%">
		</colgroup>
		<tr style="height:28px;">
			<th>회사</th>
			<td>
				<select id="p04CoCd" name="p04CoCd" data-kind="CO" data-search="coCd" onchange="cr0202p04Load();"></select>
			</td>
			<th>고객사</th>
			<td style="white-space:nowrap;">
				<input type="hidden" id="p04OrdrsClntCd" name="p04OrdrsClntCd" data-search="ordrsClntCd">
				<div class="search_form">
					<input type="text" id="p04OrdrsClntNm" name="p04OrdrsClntNm" class="form-control input-sm" data-search="ordrsClntNm" placeholder="전체고객사" oninput="cr0202p04OnClntNmInput();" onkeydown="if (event.keyCode == 13) cr0202p04Load();">
					<a onclick="cr0202p04OpenClntSearch();"><i class="i_search_w"></i></a>
				</div>
			</td>
			<th>발주자</th>
			<td>
				<select id="p04Ordrger" name="p04Ordrger" multiple="multiple" class="form-control input-sm"></select>
			</td>
			<th>수주구분</th>
			<td>
				<select id="p04OrdrsDiv" name="p04OrdrsDiv" data-kind="ORDRSDIV" data-search="ordrsDiv" onchange="cr0202p04Load();">
					<option value="">전체</option>
				</select>
			</td>
			<td style="text-align:right; white-space:nowrap;">
				<button type="button" class="bg_gray" style="margin-right:4px;" onclick="cr0202p04ClearClnt();">전체고객사</button>
				<button type="button" class="bg_gray" onclick="cr0202p04Load();">조회</button>
			</td>
		</tr>
	</table>

	<table style="margin: 8px 0;">
		<colgroup>
			<col width="14%">
			<col width="11%">
			<col width="14%">
			<col width="11%">
			<col width="14%">
			<col width="11%">
			<col width="14%">
			<col width="11%">
		</colgroup>
		<tr style="height:28px;">
			<th>미확정 건수</th>
			<td><span id="cr0202p04CntSum">0</span> 건</td>
			<th>수주목표가 합계</th>
			<td style="text-align:right;"><span id="cr0202p04EstTrgtCostSum">0</span></td>
			<th>수주가 합계</th>
			<td style="text-align:right;"><span id="cr0202p04OrdrsPrcSum">0</span></td>
			<th>견적 예상 재료비 합계</th>
			<td style="text-align:right;"><span id="cr0202p04EstEpctMatPrcSum">0</span></td>
		</tr>
	</table>

	<div class="contents">
		<div class="ax5_grid">
			<div data-ax5grid="cr0202p04Grid" data-ax5grid-config="{}" style="height: 640px; min-height:200px;"></div>
			<div style="text-align:right; margin-top:4px;">전체 <span id="cr0202p04TotalCnt">0</span>건</div>
		</div>
	</div>
</div>

<!-- 하단 버튼 -->
<div class="popup_bottom_btn">
	<button type="button" class="close_btn" onclick="modalStack.close();">닫기</button>
</div>

<script type="text/javascript">
	var cr0202p04Grid = null;
	var p04CoCd = "";
	var p04OrdrsNo = "";
	var p04OrdrsClntCd = "";
	var p04OrdrsClntNm = "";
	var p04Ordrger = "";
	var p04RawList = [];

	function cr0202p04EnsureMultiselect(callback) {
		if ($.fn.multiselect) {
			callback();
		} else {
			$('<link/>', {
				rel: 'stylesheet',
				type: 'text/css',
				href: '/static/bootstrap/css/bootstrap-multiselect.css'
			}).appendTo('head');
			$.getScript('/static/bootstrap/js/bootstrap-multiselect.min.js', function() {
				callback();
			});
		}
	}

	function cr0202p04CnfmName(value) {
		var v = String(value || "").trim();
		return (v == "N" || v == "미확정") ? "미확정" : "확정";
	}

	function cr0202p04CanViewAmt(coCd) {
		var deptId = jwt.deptId || "";
		if (coCd == 'GUN') {
			return deptId.includes('GUN00') || deptId.includes('GUN30') || deptId.includes('GUN20') || deptId.includes('GUN80');
		}
		if (coCd == 'TRN') {
			return deptId.includes('GUN00') || deptId.includes('TRN') || deptId.includes('GUN20') || deptId.includes('GUN80');
		}
		return false;
	}

	function cr0202p04ExportExcel() {
		var dateStr = (new Date()).format ? (new Date()).format("yyyyMMdd") : "";
		if (cr0202p04Grid) {
			cr0202p04Grid.exportExcel("미확정설비원가조회_" + dateStr + ".xls");
		}
	}

	function cr0202p04InitGrid() {
		cr0202p04Grid = new ax5.ui.grid();
		cr0202p04Grid.setConfig({
			target: $('#cr0202p04Form [data-ax5grid="cr0202p04Grid"]'),
			showLineNumber: true,
			showRowSelector: false,
			multipleSelect: false,
			sortable: false,
			header: {
				align: "center",
				selector: false
			},
			body: {
				mergeCells: ["ordrger", "clntNm", "clntPjtNm", "ordrsNo", "ordrsDt", "ordrsDivNm", "ordrsSeq", "ordrsDtlDiv10Nm", "cnfmYn", "salesCd", "eqpNm"],
				grouping: {
					by: ["ordrger"],
					columns: [
						{
							label: function () {
								return "[ " + (this.groupBy.labels[0] || "발주자 미입력") + " 소계 ]";
							},
							colspan: 11,
							align: "center"
						},
						{key: "estTrgtCost", collector: "sum", formatter: "money", align: "right"},
						{key: "ordrsPrc", collector: "sum", formatter: "money", align: "right"},
						{key: "estEpctMatPrc", collector: "sum", formatter: "money", align: "right"},
						{}, {}, {}
					]
				},
				onDBLClick: function () {
					var item = this.item;
					if (!item || !item.ordrsNo) return;
					var paramObj = {
						actionType: "U",
						coCd: item.coCd,
						ordrsNo: item.ordrsNo,
						fileTrgtKey: item.fileTrgtKey || 0,
						histNo: item.histNo,
						userId: jwt.userId,
						pgmId: "CR0201M02",
						hideUnsettledButtons: "Y"
					};
					openAutoModal("/static/html/user/cr/cr02/CR0202P02.html", 1600, 850, "수주 상세", paramObj);
				}
			},
			columns: [
				/* 공통 11개 컬럼 정렬 */
				{key: "ordrger", label: "발주자", align: "center", width: 75},
				{key: "clntNm", label: "고객사", align: "left", width: 140},
				{key: "clntPjtNm", label: "고객사PJT", align: "left", width: 80},
				{key: "ordrsNo", label: "수주번호", align: "center", width: 60},
				{key: "ordrsDt", label: "수주일자", align: "center", width: 80},
				{key: "ordrsDivNm", label: "수주구분", align: "center", width: 85, styleClass: function () { return this.item.ordrsDiv == 'ORDRSDIV9' ? 'grid-font-blue-bold' : ''; }},
				{key: "ordrsSeq", label: "순번", align: "center", width: 40},
				{key: "ordrsDtlDiv10Nm", label: "입력구분", align: "center", width: 65},
				{key: "cnfmYn", label: "확정구분", align: "center", width: 60, formatter: function () { return cr0202p04CnfmName(this.value); }},
				{key: "salesCd", label: "SALES CODE", align: "center", width: 110},
				{key: "eqpNm", label: "설비명", align: "left", width: 220},

				/* 미확정 특화 컬럼 */
				{key: "estTrgtCost", label: "수주목표가", align: "right", width: 95, formatter: "money"},
				{key: "ordrsPrc", label: "수주가", align: "right", width: 95, formatter: "money"},
				{key: "estEpctMatPrc", label: "견적 예상 재료비", align: "right", width: 95, formatter: "money"},
				{key: "outtkClntNm", label: "외주턴키", align: "left", width: 100},
				{key: "remark", label: "비고", align: "left", width: 120},
				{key: "mngNm", label: "수주담당자", align: "center", width: 60}
			],
			footSum: [
				[
					{label: "합계", colspan: 11, align: "center"},
					{key: "estTrgtCost", collector: "sum", formatter: "money", align: "right"},
					{key: "ordrsPrc", collector: "sum", formatter: "money", align: "right"},
					{key: "estEpctMatPrc", collector: "sum", formatter: "money", align: "right"},
					{}, {}, {}
				]
			],
			page: {
				display: false
			}
		});
		$('#cr0202p04Form [data-ax5grid="cr0202p04Grid"]').css('height', '640px');
		cr0202p04Grid.setHeight(640);
	}

	function cr0202p04OpenClntSearch() {
		var paramObj = {
			"searchValue" : $("#cr0202p04Form #p04OrdrsClntNm").val(),
			"clntDivCd"   : "CLNTDIV12"
		};
		openAutoModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "거래처 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$("#cr0202p04Form #p04OrdrsClntCd").val(row.clntCd);
			$("#cr0202p04Form #p04OrdrsClntNm").val(row.clntNm);
			cr0202p04Load();
		});
	}

	function cr0202p04ClearClnt() {
		$("#cr0202p04Form #p04OrdrsClntCd").val("");
		$("#cr0202p04Form #p04OrdrsClntNm").val("");
		if ($('#cr0202p04Form #p04Ordrger').data('multiselect')) {
			$('#cr0202p04Form #p04Ordrger').multiselect('deselectAll', false);
			$('#cr0202p04Form #p04Ordrger').multiselect('updateButtonText');
		}
		cr0202p04Load();
	}

	function cr0202p04OnClntNmInput() {
		$("#cr0202p04Form #p04OrdrsClntCd").val("");
	}

	function cr0202p04Load() {
		var formData = {};
		$.each($('#cr0202p04Form [data-search]'), function (idx, elem) {
			formData[$(elem).data("search")] = $(elem).val();
		});

		postAjax("/user/cr/cr02/selectOrdrsUnconfirmedDetails", formData, null, function (data) {
			p04RawList = (data && data.result) ? data.result : [];
			cr0202p04BuildOrdererOptionsAndFilter();
		});
	}

	function cr0202p04BuildOrdererOptionsAndFilter() {
		var ordererSet = new Set();
		var hasEmptyOrderer = false;

		for (var i = 0; i < p04RawList.length; i++) {
			var ord = String(p04RawList[i].ordrger || '').trim();
			if (ord) {
				ordererSet.add(ord);
			} else {
				hasEmptyOrderer = true;
			}
		}

		var sortedOrderers = Array.from(ordererSet).sort();
		var ordererOptions = [];
		for (var k = 0; k < sortedOrderers.length; k++) {
			ordererOptions.push({
				code: sortedOrderers[k],
				name: sortedOrderers[k]
			});
		}
		if (hasEmptyOrderer) {
			ordererOptions.push({
				code: "__EMPTY__",
				name: "(발주자 미입력)"
			});
		}

		var prevSelected = $('#cr0202p04Form #p04Ordrger').val() || [];
		if (prevSelected.length === 0 && p04Ordrger) {
			prevSelected = [p04Ordrger];
			p04Ordrger = '';
		}

		var $sel = $('#cr0202p04Form #p04Ordrger');
		$sel.empty();
		for (var m = 0; m < ordererOptions.length; m++) {
			var opt = ordererOptions[m];
			$sel.append('<option value="' + opt.code + '">' + opt.name + '</option>');
		}

		if ($sel.data('multiselect')) {
			$sel.multiselect('rebuild');
		}

		if (prevSelected.length > 0) {
			$sel.multiselect('select', prevSelected);
		}

		cr0202p04ApplyFilter();
	}

	function cr0202p04ApplyFilter() {
		var currentCoCd = p04CoCd || $('#cr0202p04Form #p04CoCd').val();
		var canViewAmt = cr0202p04CanViewAmt(currentCoCd);
		var deptId = jwt.deptId || "";
		var maskMatPrc = !canViewAmt && (deptId == "GUN70" || deptId.startsWith("GUN60"));

		var selectedOrderers = $('#cr0202p04Form #p04Ordrger').val() || [];
		var isFiltered = (selectedOrderers.length > 0);
		var filterSet = new Set(selectedOrderers);
		var allowEmpty = filterSet.has('__EMPTY__');

		function matchesOrderer(row) {
			if (!isFiltered) return true;
			var o = String(row.ordrger || '').trim();
			if (!o) return allowEmpty;
			return filterSet.has(o);
		}

		var filteredList = [];
		var sumEstTrgtCost = 0, sumOrdrsPrc = 0, sumEstEpctMatPrc = 0;

		for (var i = 0; i < p04RawList.length; i++) {
			var row = p04RawList[i];
			if (cr0202p04CnfmName(row.cnfmYn) != "미확정") continue;
			if (!matchesOrderer(row)) continue;

			var rowCopy = $.extend({}, row);
			rowCopy.estTrgtCost = canViewAmt ? gPasFloatChk(rowCopy.estTrgtCost) : 0;
			rowCopy.ordrsPrc = canViewAmt ? gPasFloatChk(rowCopy.ordrsPrc) : 0;
			rowCopy.estEpctMatPrc = maskMatPrc ? 0 : gPasFloatChk(rowCopy.estEpctMatPrc);

			sumEstTrgtCost += rowCopy.estTrgtCost;
			sumOrdrsPrc += rowCopy.ordrsPrc;
			sumEstEpctMatPrc += rowCopy.estEpctMatPrc;

			filteredList.push(rowCopy);
		}

		if (cr0202p04Grid) {
			cr0202p04Grid.setData({
				list: filteredList,
				page: {
					totalElements: filteredList.length
				}
			});
		}

		$("#cr0202p04CntSum").text(addCommaStr(filteredList.length));
		$("#cr0202p04TotalCnt").text(addCommaStr(filteredList.length));
		$("#cr0202p04EstTrgtCostSum").text(addCommaStr(sumEstTrgtCost));
		$("#cr0202p04OrdrsPrcSum").text(addCommaStr(sumOrdrsPrc));
		$("#cr0202p04EstEpctMatPrcSum").text(addCommaStr(sumEstEpctMatPrc));
	}

	$(document.body).ready(function () {
		var pObj = (modalStack && modalStack.last() && modalStack.last().paramObj) ? modalStack.last().paramObj : {};
		p04CoCd = pObj.coCd || '';
		p04OrdrsNo = pObj.ordrsNo || '';
		p04OrdrsClntCd = pObj.ordrsClntCd || '';
		p04OrdrsClntNm = pObj.ordrsClntNm || '';
		p04Ordrger = pObj.ordrger || '';

		if (p04CoCd) {
			$("#cr0202p04Form #p04CoCd").val(p04CoCd);
		}
		if (p04OrdrsClntCd) {
			$("#cr0202p04Form #p04OrdrsClntCd").val(p04OrdrsClntCd);
		}
		if (p04OrdrsClntNm) {
			$("#cr0202p04Form #p04OrdrsClntNm").val(p04OrdrsClntNm);
		}

		setCommonSelect($("#cr0202p04Form select[data-kind]"));

		cr0202p04EnsureMultiselect(function() {
			$('#cr0202p04Form #p04Ordrger').multiselect({
				includeSelectAllOption: true,
				selectAllText: '전체 선택',
				nonSelectedText: '발주자 전체',
				allSelectedText: '발주자 전체',
				nSelectedText: '명 선택',
				numberDisplayed: 1,
				maxHeight: 250,
				buttonWidth: '100%',
				onChange: function() {
					cr0202p04ApplyFilter();
				},
				onSelectAll: function() {
					cr0202p04ApplyFilter();
				},
				onDeselectAll: function() {
					cr0202p04ApplyFilter();
				}
			});

			cr0202p04InitGrid();
			cr0202p04Load();
		});
	});
</script>
