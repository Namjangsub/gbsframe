<div id="cr0202p03popForm" class="popup_area of_a" style="width: 100%; height: 100%;">
	<div class="tit_contents">
		<h4 class="tit">미정산잔액 조회</h4>
		<div class="add_btn_small pdl10">
			<a onclick="cr0202p03ExportExcel();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-file-excel"></i> 엑셀다운로드</a>
		</div>
	</div>
	
	<table>
		<colgroup>
			<col width="6%">
			<col width="12%">
			<col width="6%">
			<col width="22%">
			<col width="6%">
			<col width="16%">
			<col width="6%">
			<col width="14%">
			<col width="12%">
		</colgroup>
		<tr style="height:28px;">
			<th>회사</th>
			<td>
				<select id="p03CoCd" name="p03CoCd" data-kind="CO" data-search="coCd" onchange="gridViewCr02P03.setData(0);"></select>
			</td>
			<th>고객사</th>
			<td style="white-space:nowrap;">
				<input type="hidden" id="p03OrdrsClntCd" name="p03OrdrsClntCd" data-search="ordrsClntCd">
				<div class="search_form">
					<input type="text" id="p03OrdrsClntNm" name="p03OrdrsClntNm" class="form-control input-sm" data-search="ordrsClntNm" placeholder="고객사" oninput="cr0202p03OnClntNmInput();" onkeydown="if (event.keyCode == 13) gridViewCr02P03.setData(0);">
					<a onclick="cr0202p03OpenClntSearch();"><i class="i_search_w"></i></a>
				</div>
			</td>
			<th>발주자</th>
			<td>
				<select id="p03Ordrger" name="p03Ordrger" multiple="multiple" class="form-control input-sm"></select>
			</td>
			<th>수주구분</th>
			<td>
				<select id="p03OrdrsDiv" name="p03OrdrsDiv" data-kind="ORDRSDIV" data-search="ordrsDiv" onchange="gridViewCr02P03.setData(0);">
					<option value="">전체</option>
				</select>
			</td>
			<td style="text-align:right; white-space:nowrap;">
				<button type="button" class="bg_gray" style="margin-right:4px;" onclick="cr0202p03ClearClnt();">전체고객사</button>

	</table>

	<!-- 그리드 -->
	<div class="contents">
		<div class="ax5_grid">
			<div data-ax5grid="unsettled-grid" data-ax5grid-config="{}" style="height: 640px; min-height:200px;"></div>
		</div>
	</div>
</div>

<!-- 하단 버튼 -->
<div class="popup_bottom_btn">
	<button type="button" class="close_btn" onclick="modalStack.close();">닫기</button>
</div>

<script type="text/javascript">
	var coCd = "";
	var ordrsNo = "";
	var ordrsClntCd = "";
	var ordrsClntNm = "";
	var ordrger = "";
	var p03RawList = [];

	function cr0202p03EnsureMultiselect(callback) {
		if ($.fn.multiselect) {
			callback();
		} else {
			$('<link/>', {
				rel: 'stylesheet',
				type: 'text/css',
				href: '/static/bootstrap/css/bootstrap-multiselect.css'
			}).appendTo('head');
			$.getScript('/static/bootstrap/js/bootstrap-multiselect.min.js', function() {
				callback();
			});
		}
	}

	function cr0202p03CnfmName(value) {
		var v = String(value || "").trim();
		return (v == "N" || v == "미확정") ? "미확정" : "확정";
	}

	function cr0202p03OpenClntSearch() {
		var paramObj = {
			"searchValue" : $("#cr0202p03popForm #p03OrdrsClntNm").val(),
			"clntDivCd"   : "CLNTDIV12"
		};
		openAutoModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "거래처 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$("#cr0202p03popForm #p03OrdrsClntCd").val(row.clntCd);
			$("#cr0202p03popForm #p03OrdrsClntNm").val(row.clntNm);
			gridViewCr02P03.setData(0);
		});
	}

	function cr0202p03ClearClnt() {
		$("#cr0202p03popForm #p03OrdrsClntCd").val("");
		$("#cr0202p03popForm #p03OrdrsClntNm").val("");
		if ($('#cr0202p03popForm #p03Ordrger').data('multiselect')) {
			$('#cr0202p03popForm #p03Ordrger').multiselect('deselectAll', false);
			$('#cr0202p03popForm #p03Ordrger').multiselect('updateButtonText');
		}
		gridViewCr02P03.setData(0);
	}

	function cr0202p03OnClntNmInput() {
		$("#cr0202p03popForm #p03OrdrsClntCd").val("");
	}

	function cr0202p03ExportExcel() {
		var dateStr = (new Date()).format ? (new Date()).format("yyyyMMdd") : "";
		if (gridViewCr02P03 && gridViewCr02P03.target) {
			gridViewCr02P03.target.exportExcel("미정산잔액조회_" + dateStr + ".xls");
		}
	}

	if (!ax5.ui.grid.formatter["useYn"]) {
		ax5.ui.grid.formatter["useYn"] = function () {
			var color = this.value == "Y" ? "color-circle_02.png" : "color-circle_01.png";
			if (this.value == "E"){
				return 'E';
			} else {
				return '<img src="/static/img/' + color + '" style="width: 10px; height: 10px;"></img>';
			}
		};
	}

	function cr0202p03popFormGridColor(dataValue) {
		let rtnColor = "";
		let row = dataValue.item || {};

		if (ordrsNo && row.ordrsNo == ordrsNo) {
			rtnColor = "cr0202p03-highlight-row";
		}
		return rtnColor;
	}

	function applyCr0202P03GridColor(columns) {
		$.each(columns, function (idx, column) {
			if (column.columns) {
				applyCr0202P03GridColor(column.columns);
				return true;
			}

			let styleClass = column.styleClass;
			column.styleClass = function () {
				let rtnClass = "";
				let baseClass = "";

				if (typeof styleClass == "function") {
					baseClass = styleClass.call(this);
				} else if (styleClass) {
					baseClass = styleClass;
				}

				if (baseClass) {
					rtnClass += baseClass;
				}

				let colorClass = cr0202p03popFormGridColor(this);
				if (colorClass) {
					rtnClass += (rtnClass ? " " : "") + colorClass;
				}

				return rtnClass;
			};
		});

		return columns;
	}

	var gridViewCr02P03 = {
		initView : function() {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				lineNumberColumnWidth: 40,
				showLineNumber    : true,
				showRowSelector   : false,
				multipleSelect    : false,
				sortable          : false,
				target : $('[data-ax5grid="unsettled-grid"]'),
				header : {
					align: "center",
					selector: false
				},
				body: {
					mergeCells : [
						"ordrger", "clntNm", "clntPjtNm", "ordrsNo", "ordrsDt", "ordrsDivNm", "ordrsSeq", "ordrsDtlDiv10Nm", "cnfmYn", "salesCd", "eqpNm",
						"ordrsAmt", "pmntMtdNm", "mngIdNm", "billYn", "ordrsPrc", "unUnsettledAmt"
					],
					grouping: {
						by: ["ordrger"],
						columns: [
							{
								label: function () {
									return "[ " + (this.groupBy.labels[0] || "발주자 미입력") + " 소계 ]";
								},
								colspan: 11,
								align: "center"
							},
							{key: "sumOrdrsAmt", collector: "sum", formatter: "money", align: "right"},
							{},
							{},
							{},
							{key: "sumOrdrsPrc", collector: "sum", formatter: "money", align: "right"},
							{key: "unOrdrsPrc", collector: "sum", formatter: "money", align: "right"},
							{key: "sumUnUnsettledAmt", collector: "sum", formatter: "money", align: "right"},
						]
					},
					onClick: function () {
					},
					onDBLClick: function () {
						var item = this.item;
						if (!item || item.__isGrouping) return;

						var colKey = this.column ? (this.column.key || '') : '';
						var isSettlePart = (colKey === 'unOrdrsPrc') || (colKey && colKey.indexOf('un') === 0 && colKey !== 'unUnsettledAmt') || (typeof this.colIndex === 'number' && this.colIndex >= 16 && this.colIndex !== 17);

						var targetOrdrsNo = isSettlePart ? item.unOrdrsNo : item.ordrsNo;
						var targetCoCd = isSettlePart ? (item.unCoCd || item.coCd) : item.coCd;
						var targetHistNo = isSettlePart ? (item.unHistNo || 0) : (item.histNo || 0);
						var targetFileTrgtKey = isSettlePart ? (item.unFileTrgtKey || 0) : (item.fileTrgtKey || 0);

						if (!targetOrdrsNo) {
							if (isSettlePart) {
								alert("정산상계 수주정보가 없습니다.");
							}
							return;
						}

						var paramObj = {
							actionType: "U",
							coCd: targetCoCd,
							ordrsNo: targetOrdrsNo,
							fileTrgtKey: targetFileTrgtKey,
							histNo: targetHistNo,
							userId: jwt.userId,
							pgmId: "CR0201M02",
							hideUnsettledButtons: "Y"
						};
						openAutoModal("/static/html/user/cr/cr02/CR0202P02.html", 1600, 850, "수주 상세", paramObj);
					},
					onDataChanged: function () {
					},
				},
				columns : applyCr0202P03GridColor([
					/* 공통 11개 컬럼 */
					{key: "ordrger", label: "발주자", align: "center", width: 75},
					{key: "clntNm", label: "고객사", align: "left", width: 140},
					{key: "clntPjtNm", label: "고객사PJT", align: "left", width: 80},
					{key: "ordrsNo", label: "수주번호", align: "center", width: 60, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
					{key: "ordrsDt", label: "수주일자", align: "center", width: 80, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
					{key: "ordrsDivNm", label: "수주구분", align: "center", width: 85, styleClass: function () { return this.item.ordrsDiv == 'ORDRSDIV9' ? 'grid-font-blue-bold' : ''; }},
					{key: "ordrsSeq", label: "순번", align: "center", width: 40, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
					{key: "ordrsDtlDiv10Nm", label: "입력구분", align: "center", width: 65},
					{key: "cnfmYn", label: "확정구분", align: "center", width: 60, formatter: function () { return cr0202p03CnfmName(this.value); }},
					{key: "salesCd", label: "SALES CODE", align: "center", width: 110},
					{key: "eqpNm", label: "설비명", align: "left", width: 220},

					/* 미정산 특화 컬럼 */
					{key: "ordrsAmt", label: "수주금액", align: "right", width: 90, formatter: "money"},
					{key: "pmntMtdNm", label: "결재방법", align: "center", width: 60},
					{key: "mngIdNm", label: "담당자", align: "center", width: 60},
					{key: undefined, label: "정산내역",
						columns: [
							{key: "billYn", label: "완료", align: "center", width: 50, formatter: "useYn"},
							{key: "ordrsPrc", label: "발생금액", align: "right", width: 95, formatter: "money", styleClass: function () { return "grid-row-blue grid-font-red-bold"; }},
							{key: "unOrdrsPrc", label: "정산금액", align: "right", width: 95, formatter: "money", styleClass: function () { return "grid-row-blue grid-no-msg-font-blue-bold"; }},
							{key: "unUnsettledAmt", label: "미정산잔액", align: "right", width: 95, formatter: "money"}
						]
					},
					{key: undefined, label: "정산상계 수주정보",
						columns: [
							{key: "unOrdrsNo", label: "번호", align: "center", width: 60, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
							{key: "unOrdrsSeq", label: "순번", align: "center", width: 40, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
							{key: "unOrdrsDt", label: "수주일자", align: "center", width: 80, styleClass: function () { return (this.item.ctrtDoc == "CONTRACT01") ? "grid-font-blue-bold" : ""; }},
							{key: "unPmntMtdNm", label: "결재방법", align: "center", width: 60},
							{key: "unClntPjtNm", label: "프로젝트", align: "left", width: 80},
							{key: "unEqpNm", label: "정산설비명", align: "left", width: 220}
						]
					}
				]),
				footSum: [
					[
						{label: "총계", colspan: 11, align:"center"},
						{key: "sumOrdrsAmt", collector: "sum", formatter: "money", align: "right"},
						{},
						{},
						{},
						{key: "sumOrdrsPrc", collector: "sum", formatter: "money", align: "right"},
						{key: "unOrdrsPrc", collector: "sum", formatter: "money", align: "right"},
						{key: "sumUnUnsettledAmt", collector: "sum", formatter: "money", align: "right"}
					]
				],
				page: {
					display: false
				}
			});
			return this;
		},
		setData : function(_pageNo) {
			var formData = {};
			$.each($('#cr0202p03popForm [data-search]'), function(idx, elem){
				formData[$(elem).data("search")] = $(elem).val();
			});
			formData["pageNo"] = 1;
			formData["recordCnt"] = 99999999;
			formData["billyn"] = "N";

			postAjax("/user/cr/cr20/select_cr20m01_List", formData, null, function(data) {
				try {
					p03RawList = (data && data.result) ? data.result : [];
					cr0202p03BuildOrdererOptionsAndFilter();
				} catch (error) {
					alert("오류 발생!! 전산실 연락 바랍니다", error.message);
					return null;
				}
			});
		}
	};

	function cr0202p03BuildOrdererOptionsAndFilter() {
		var ordererSet = new Set();
		var hasEmptyOrderer = false;

		for (var i = 0; i < p03RawList.length; i++) {
			var ord = String(p03RawList[i].ordrger || '').trim();
			if (ord) {
				ordererSet.add(ord);
			} else {
				hasEmptyOrderer = true;
			}
		}

		var sortedOrderers = Array.from(ordererSet).sort();
		var ordererOptions = [];
		for (var k = 0; k < sortedOrderers.length; k++) {
			ordererOptions.push({
				code: sortedOrderers[k],
				name: sortedOrderers[k]
			});
		}
		if (hasEmptyOrderer) {
			ordererOptions.push({
				code: "__EMPTY__",
				name: "(발주자 미입력)"
			});
		}

		var prevSelected = $('#cr0202p03popForm #p03Ordrger').val() || [];
		if (prevSelected.length === 0 && ordrger) {
			prevSelected = [ordrger];
			ordrger = '';
		}

		var $sel = $('#cr0202p03popForm #p03Ordrger');
		$sel.empty();
		for (var m = 0; m < ordererOptions.length; m++) {
			var opt = ordererOptions[m];
			$sel.append('<option value="' + opt.code + '">' + opt.name + '</option>');
		}

		if ($sel.data('multiselect')) {
			$sel.multiselect('rebuild');
		}

		if (prevSelected.length > 0) {
			$sel.multiselect('select', prevSelected);
		}

		cr0202p03ApplyFilter();
	}

	function cr0202p03ApplyFilter() {
		var selectedOrderers = $('#cr0202p03popForm #p03Ordrger').val() || [];
		var isFiltered = (selectedOrderers.length > 0);
		var filterSet = new Set(selectedOrderers);
		var allowEmpty = filterSet.has('__EMPTY__');

		function matchesOrderer(row) {
			if (!isFiltered) return true;
			var o = String(row.ordrger || '').trim();
			if (!o) return allowEmpty;
			return filterSet.has(o);
		}

		var filteredList = [];
		var seenNo = new Set();

		for (var i = 0; i < p03RawList.length; i++) {
			var item = p03RawList[i];
			if (!matchesOrderer(item)) continue;

			var rowCopy = $.extend({}, item);
			rowCopy.ordrsAmt = gPasFloatChk(rowCopy.ordrsAmt);
			rowCopy.ordrsPrc = gPasFloatChk(rowCopy.ordrsPrc);
			rowCopy.unOrdrsPrc = gPasFloatChk(rowCopy.unOrdrsPrc) * (-1);
			rowCopy.unUnsettledAmt = gPasFloatChk(rowCopy.unUnsettledAmt);

			var key = (rowCopy.ordrsNo || '') + '_' + (rowCopy.ordrsSeq || '');
			if (seenNo.has(key)) {
				rowCopy.sumOrdrsAmt = 0;
				rowCopy.sumOrdrsPrc = 0;
				rowCopy.sumUnUnsettledAmt = 0;
			} else {
				seenNo.add(key);
				rowCopy.sumOrdrsAmt = rowCopy.ordrsAmt;
				rowCopy.sumOrdrsPrc = rowCopy.ordrsPrc;
				rowCopy.sumUnUnsettledAmt = rowCopy.unUnsettledAmt;
			}
			filteredList.push(rowCopy);
		}

		if (gridViewCr02P03 && gridViewCr02P03.target) {
			gridViewCr02P03.target.setData({
				list: filteredList,
				page: {
					totalElements: filteredList.length
				}
			});
		}
	}
		
	$(document.body).ready(function () {
		setCommonSelect($("#cr0202p03popForm select[data-kind]"));
		coCd = modalStack.last().paramObj.coCd;
		ordrsNo = modalStack.last().paramObj.ordrsNo;
		ordrsClntCd = modalStack.last().paramObj.ordrsClntCd;
		ordrsClntNm = modalStack.last().paramObj.ordrsClntNm;
		ordrger = modalStack.last().paramObj.ordrger || "";

		$("#cr0202p03popForm #p03CoCd").val(coCd);
		$("#cr0202p03popForm #p03CoCd").css({'background-color':'#e6e6e6', 'pointer-events':'none'});
		$("#cr0202p03popForm #p03OrdrsClntCd").val(ordrsClntCd);
		$("#cr0202p03popForm #p03OrdrsClntNm").val(ordrsClntNm);

		cr0202p03EnsureMultiselect(function() {
			$('#cr0202p03popForm #p03Ordrger').multiselect({
				includeSelectAllOption: true,
				selectAllText: '전체 선택',
				nonSelectedText: '발주자 전체',
				allSelectedText: '발주자 전체',
				nSelectedText: '명 선택',
				numberDisplayed: 1,
				maxHeight: 250,
				buttonWidth: '100%',
				onChange: function() {
					cr0202p03ApplyFilter();
				},
				onSelectAll: function() {
					cr0202p03ApplyFilter();
				},
				onDeselectAll: function() {
					cr0202p03ApplyFilter();
				}
			});

			gridViewCr02P03.initView();
			gridViewCr02P03.setData(0);
		});
	});
</script>
