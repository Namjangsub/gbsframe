	.badge-issue {
		display: inline-block;
		padding: 1px 4px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		margin-left: 3px;
		vertical-align: middle;
		cursor: pointer;
	}
	.badge-issue.badge-issue-has-unresolved {
		background-color: #d9534f; /* 미완료 이슈 있음 (붉은색) */
	}
	.badge-issue.badge-issue-all-resolved {
		background-color: #5cb85c; /* 전체 완료 (초록색) */
	}
	.badge-unconfirmed {
		display: inline-block;
		padding: 1px 4px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		background-color: #e67e22; /* 미확정 주황/경고 */
		margin-left: 3px;
		vertical-align: middle;
		cursor: pointer;
	}
	.badge-unsettled {
		display: inline-block;
		padding: 1px 4px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		background-color: #9b59b6; /* 미정산(추후정산) 보라색 */
		margin-left: 3px;
		vertical-align: middle;
		cursor: pointer;
	}
	.badge-settlement {
		display: inline-block;
		padding: 1px 4px;
		font-size: 10px;
		font-weight: bold;
		line-height: 1.3;
		border-radius: 9px;
		color: #fff;
		background-color: #3498db; /* 정산상계 파란색 */
		margin-left: 3px;
		vertical-align: middle;
		cursor: pointer;
	}

	/* 마우스 호버 시 표시되는 수주 뱃지 상세 팝오버 툴팁 레이어 (BM1901M01 스타일) */
	.cr02-badge-popover {
		position: fixed;
		z-index: 999999;
		display: none;
		background: #ffffff;
		border: 1px solid #3b62b1;
		border-radius: 6px;
		box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
		padding: 10px 14px;
		min-width: 320px;
		max-width: 480px;
		max-height: 520px;
		overflow-y: auto;
		font-size: 12px;
		color: #333333;
		pointer-events: auto;
		line-height: 1.45;
	}
	.cr02-badge-popover .popover-title {
		font-weight: bold;
		border-bottom: 2px solid #3b62b1;
		padding-bottom: 6px;
		margin-bottom: 8px;
		font-size: 13px;
		display: flex;
		justify-content: space-between;
		align-items: center;
	}
	.cr02-badge-popover .popover-badge {
		font-size: 11px;
		font-weight: bold;
		color: #ffffff;
		padding: 2px 7px;
		border-radius: 3px;
		white-space: nowrap;
		margin-left: 8px;
	}
	.cr02-badge-popover .popover-item {
		padding: 2.5px 0;
		color: #444444;
		word-break: break-all;
	}
	.cr02-badge-popover .popover-item b {
		color: #222222;
		display: inline-block;
		min-width: 78px;
		font-weight: 600;
	}
	.cr02-badge-popover .popover-box {
		margin-top: 5px;
		margin-bottom: 5px;
		padding: 6px 9px;
		background: #f8f9fa;

		word-break: break-all;
		max-height: 130px;
		overflow-y: auto;
		color: #333333;
		font-size: 11.5px;
		line-height: 1.4;
	}
	.cr02-badge-popover .popover-divider {
		margin: 6px 0;
		border-top: 1px dashed #dadce0;

<script type="text/javascript">
    var isFirst = true;
    let select_index = null;
	ax5.ui.grid.formatter["appStatus"] = function () {
		if(this.value == undefined) {
	        return ' ';
		}else if(this.value == "Y"){
	    	return '<img src="/static/img/color-circle_02.png" style="width: 10px;height: 10px;"></img>';
	    }
		else if(this.value == "0"){
 	    	return '<span style="font-size:11px;color:silver">●</span>';
 	    }
		else {
	    	return '<span style="font-size:11px;color:red">●</span>';
	    }
	};


	function gridColorSet(_itemOrCollapse) {
		var _collapse = "";
		var _cnfmYnAmt = 0;
		if (typeof _itemOrCollapse === "object" && _itemOrCollapse !== null) {
			_collapse = _itemOrCollapse.collapse;
			_cnfmYnAmt = gPasFloatChk(_itemOrCollapse.cnfmYnAmt);
		} else {
			_collapse = _itemOrCollapse;
		}

		if (String(_collapse) === "2") {
			styleClass = "grid-cell-yellow";
		} else if (String(_collapse) === "3" || _cnfmYnAmt > 0){
			styleClass = "grid-cell-red";
		} else {
			styleClass = "";
		}
		return styleClass;
	};

	/**
	 * 수주/SalesCd 그리드 뱃지 통합 생성 및 관리 함수
	 * @param {Object} item 행 데이터
	 * @returns {string} 뱃지 HTML 문자열
	 */
	function getSalesCdBadgesHtml(item) {
		if (!item) return '';
		var badges = '';
		var ordrsNoAttr = escapeHtml(item.ordrsNo || '');
		var salesCdAttr = escapeHtml((item.salesCd && item.salesCd !== '-') ? item.salesCd : '');
		var lvlAttr = escapeHtml(item.lvl || '');
		var ioSeqAttr = escapeHtml(item.ioSeq !== undefined && item.ioSeq !== null ? item.ioSeq : '');
		var dataAttrs = ' data-ordrs-no="' + ordrsNoAttr + '"'
		              + ' data-sales-cd="' + salesCdAttr + '"'
		              + ' data-lvl="' + lvlAttr + '"'
		              + ' data-io-seq="' + ioSeqAttr + '"';

		// 1) 이슈 뱃지 (미완료문제건수 / 발생건수)
		var totIss = parseInt(item.issueTotCnt, 10);
		var uncompIss = parseInt(item.issueUncompCnt, 10);
		if (!isNaN(totIss) && totIss > 0) {
			var uncomp = isNaN(uncompIss) ? 0 : uncompIss;
			var cls = uncomp > 0 ? "badge-issue-has-unresolved" : "badge-issue-all-resolved";
			badges += '<span class="badge-issue ' + cls + '" data-badge-type="issue"' + dataAttrs + '>' + uncomp + '/' + totIss + '</span>';
		}

		// 2) 미확정 뱃지 (기준: 확정구분이 미확정(cnfmYn === 'N')이거나 미확정금액 존재 시 금액 유무와 무관하게 표시)
		var cnfmV = String(item.cnfmYn || '').trim();
		var isUnconfirmed = (cnfmV === 'N' || cnfmV === '미확정' || item.hasUnconfirmed === true || Math.abs(gPasFloatChk(item.rawCnfmYnAmt !== undefined ? item.rawCnfmYnAmt : item.cnfmYnAmt)) > 0);
		if (isUnconfirmed) {
			badges += '<span class="badge-unconfirmed" data-badge-type="unconfirmed"' + dataAttrs + '>미확정</span>';
		}

		// 3) 미정산 뱃지 (추후정산 항목이 있는 경우: unsettledAmt != 0 또는 ordrsDtlDiv10 === 'ORDRSDTLDIV1040' 또는 하위 추후정산 존재)
		var unsettledAmt = gPasFloatChk(item.unsettledAmt);
		var isUnsettledItem = (item.ordrsDtlDiv10 === 'ORDRSDTLDIV1040' || item.hasUnsettled === true);
		if (Math.abs(unsettledAmt) > 0 || isUnsettledItem) {
			badges += '<span class="badge-unsettled" data-badge-type="unsettled"' + dataAttrs + '>미정산</span>';
		}

		// 4) 정산상계 뱃지 (정산상계 항목이 있는 경우: settlementAmt != 0 또는 ordrsDtlDiv10 === 'ORDRSDTLDIV1050' 또는 하위 정산상계 존재)
		var settlementAmt = gPasFloatChk(item.settlementAmt);
		var isSettlementItem = (item.ordrsDtlDiv10 === 'ORDRSDTLDIV1050' || item.hasSettlement === true);
		if (Math.abs(settlementAmt) > 0 || isSettlementItem) {
			badges += '<span class="badge-settlement" data-badge-type="settlement"' + dataAttrs + '>정산상계</span>';
		}

		return badges;
	}

	/* =========================================================================
	 *  BM1901M01 스타일 뱃지 상세 팝오버 툴팁 함수군
	 * ========================================================================= */
	function escapeHtml(text) {
		if (text === null || text === undefined) return "";
		return String(text)
			.replace(/&/g, "&amp;")
			.replace(/</g, "&lt;")
			.replace(/>/g, "&gt;")
			.replace(/"/g, "&quot;")
			.replace(/'/g, "&#039;");
	}

	/**
	 * AX5-Grid 트리 구조에서 숨겨진 하위 행(collapsed)으로 인해 dindex(화면 표시 행)와 doindex(전체 list 인덱스)가
	 * 어긋나는 문제를 방지하기 위해, doindex 및 뱃지 자체 data-* 속성으로 정확한 행 데이터를 조회한다.
	 */
	function getFullGridList() {
		if (gridView && gridView.target && gridView.target.list && gridView.target.list.length > 0) {
			return gridView.target.list;
		}
		if (gridView && gridView.target && typeof gridView.target.getList === "function") {

	function resolveGridItem($badge, $tr) {
		var list = getFullGridList();
		if (!list || list.length === 0) return null;

		var bOrdrsNo = String($badge.attr("data-ordrs-no") || "").trim();
		var bSalesCd = String($badge.attr("data-sales-cd") || "").trim();
		var bLvl     = String($badge.attr("data-lvl") || "").trim();
		var bIoSeq   = String($badge.attr("data-io-seq") || "").trim();

		function isMatch(row) {
			if (!row) return false;
			if (bOrdrsNo && String(row.ordrsNo || "").trim() !== bOrdrsNo) return false;
			if (bLvl && String(row.lvl || "").trim() !== bLvl) return false;
			if (bLvl === "2") {
				var rSc = (row.salesCd && row.salesCd !== "-") ? String(row.salesCd).trim() : "";
				if (bSalesCd && rSc !== bSalesCd) return false;
				if (!bSalesCd && bIoSeq && String(row.ioSeq !== undefined && row.ioSeq !== null ? row.ioSeq : "").trim() !== bIoSeq) return false;
			}
			return true;
		}

		// 1순위: tr의 data-ax5grid-tr-data-o-index (doindex: 원본 list 인덱스)
		if ($tr && $tr.length > 0) {
			var doindexAttr = $tr.attr("data-ax5grid-tr-data-o-index");
			if (doindexAttr !== undefined && doindexAttr !== null && doindexAttr !== "") {
				var doIdx = parseInt(doindexAttr, 10);
				if (!isNaN(doIdx) && list[doIdx] && isMatch(list[doIdx])) {
					return list[doIdx];
				}
			}
			// 2순위: proxyList(화면 표시용 트리 배열)에서 dindex로 조회
			var dindexAttr = $tr.attr("data-ax5grid-tr-data-index");
			if (dindexAttr !== undefined && dindexAttr !== null && dindexAttr !== "" && gridView.target && gridView.target.proxyList) {
				var dIdx = parseInt(dindexAttr, 10);
				if (!isNaN(dIdx) && gridView.target.proxyList[dIdx] && isMatch(gridView.target.proxyList[dIdx])) {
					var proxyRow = gridView.target.proxyList[dIdx];
					if (proxyRow.__origin_index__ !== undefined && list[proxyRow.__origin_index__]) {
						return list[proxyRow.__origin_index__];
					}
					return proxyRow;
				}
			}
		}

		// 3순위: 뱃지 data-* 속성(ordrsNo, salesCd, lvl, ioSeq)으로 원본 list에서 직접 탐색
		if (bOrdrsNo) {
			for (var i = 0; i < list.length; i++) {
				if (isMatch(list[i])) {
					return list[i];
				}
			}
		}

		// 4순위 fallback
		if ($tr && $tr.length > 0) {
			var fallbackDo = $tr.attr("data-ax5grid-tr-data-o-index");
			if (fallbackDo !== undefined && fallbackDo !== "") {
				return list[parseInt(fallbackDo, 10)] || null;
			}
			var fallbackD = $tr.attr("data-ax5grid-tr-data-index");
			if (fallbackD !== undefined && fallbackD !== "") {
				return list[parseInt(fallbackD, 10)] || null;
			}
		}
		return null;
	}

	/**
	 * 특정 수주번호(ordrsNo)에 속한 모든 하위(lvl=2) 상세 행 목록 반환 (트리가 접혀 있어도 원본 list에서 모두 조회)
	 */
	function getChildSalesCdRows(ordrsNo) {

		}

	}

	function bindBadgePopover() {

		$(document).on("mousemove", function(e) {

		$(document).on("wheel mousewheel", function(e) {

	function moveBadgePopover(e) {
		// 마우스가 툴팁 위로 쉽게 이동하여 스크롤할 수 있도록 위치를 고정 유지
	}

	function positionBadgePopover(e, $badge, keepPositionIfVisible) {
		var $pop = $("#cr02BadgePopover");
		if (!$pop.is(":visible")) return;

		var popW = $pop.outerWidth() || 340;
		var popH = $pop.outerHeight() || 240;
		var winW = $(window).width();
		var winH = $(window).height();

		if (keepPositionIfVisible) {
			var curLeft = parseFloat($pop.css("left")) || 10;
			var curTop = parseFloat($pop.css("top")) || 10;
			if (curLeft + popW > winW - 10) curLeft = Math.max(10, winW - popW - 10);
			if (curTop + popH > winH - 10) curTop = Math.max(10, winH - popH - 10);
			$pop.css({ "top": curTop + "px", "left": curLeft + "px" });
			return;
		}

		var posX = 0;
		var posY = 0;

		// 뱃지 엘리먼트 바로 우측(6px 간격)에 고정 배치하여 마우스가 툴팁 위로 즉시 진입 가능하게 처리
		if ($badge && $badge.length > 0 && $badge[0].getBoundingClientRect) {
			var rect = $badge[0].getBoundingClientRect();
			posX = rect.right + 6;
			posY = rect.top - 4;
			if (posX + popW > winW - 10) {
				posX = rect.left - popW - 6;
			}
		} else if (e) {
			var mouseX = e.clientX || (e.originalEvent ? e.originalEvent.clientX : 0);
			var mouseY = e.clientY || (e.originalEvent ? e.originalEvent.clientY : 0);
			posX = mouseX + 10;
			posY = mouseY - 4;
			if (posX + popW > winW - 10) {
				posX = mouseX - popW - 10;
			}
		}

		if (posY + popH > winH - 10) {
			posY = winH - popH - 10;
		}
		if (posX < 10) posX = 10;
		if (posY < 10) posY = 10;

		$pop.css({
			"top": posY + "px",
			"left": posX + "px"
		});
	}

	/**
	 * 하위(lvl=2) 상세 행들의 뱃지 조건(미확정, 미정산, 정산상계, 이슈건수)을 상위(lvl=1) 마스터 행으로 집계/전파
	 */
	function applyBadgeAggregation(list) {
		if (!list || !list.length) return;
		var parentStateMap = {};
		for (var i = 0; i < list.length; i++) {
			var row = list[i];
			var on = String(row.ordrsNo || '').trim();
			if (!on) continue;
			if (!parentStateMap[on]) {
				parentStateMap[on] = {
					hasUnconfirmed: false,
					hasUnsettled: false,
					hasSettlement: false,
					issueTotCnt: 0,
					issueUncompCnt: 0
				};
			}
			var st = parentStateMap[on];
			var cnfmV = String(row.cnfmYn || '').trim();
			var rawAmt = gPasFloatChk(row.rawCnfmYnAmt !== undefined ? row.rawCnfmYnAmt : row.cnfmYnAmt);
			if (cnfmV === 'N' || cnfmV === '미확정' || Math.abs(rawAmt) > 0) {
				row.cnfmYn = 'N';
				row.hasUnconfirmed = true;
				st.hasUnconfirmed = true;
			}
			if (row.ordrsDtlDiv10 === 'ORDRSDTLDIV1040' || Math.abs(gPasFloatChk(row.unsettledAmt)) > 0) {
				row.hasUnsettled = true;
				st.hasUnsettled = true;
			}
			if (row.ordrsDtlDiv10 === 'ORDRSDTLDIV1050' || Math.abs(gPasFloatChk(row.settlementAmt)) > 0) {
				row.hasSettlement = true;
				st.hasSettlement = true;
			}
			if (String(row.lvl) === '2') {
				st.issueTotCnt += gPasIntChk(row.issueTotCnt);
				st.issueUncompCnt += gPasIntChk(row.issueUncompCnt);
			}
		}
		for (var j = 0; j < list.length; j++) {
			var r = list[j];
			if (String(r.lvl) === '1') {
				var pOn = String(r.ordrsNo || '').trim();
				var pSt = parentStateMap[pOn];
				if (pSt) {
					if (pSt.hasUnconfirmed) {
						r.cnfmYn = 'N';
						r.hasUnconfirmed = true;
					}
					if (pSt.hasUnsettled) r.hasUnsettled = true;
					if (pSt.hasSettlement) r.hasSettlement = true;
					if (gPasIntChk(r.issueTotCnt) === 0 && pSt.issueTotCnt > 0) {
						r.issueTotCnt = pSt.issueTotCnt;
						r.issueUncompCnt = pSt.issueUncompCnt;
					}
				}
			}
		}
	}

											if (uCnfm !== 'N' && uCnfm !== '미확정') continue;
											var uOn = String(uRow.ordrsNo || '').trim();

											var uSc = String(uRow.salesCd || '').trim();
											if (uOn) unconfOrdrsNoSet.add(uOn);
											if (uOn && uSeq) unconfSeqSet.add(uOn + "_" + uSeq);
											if (uSc) unconfSalesCdSet.add(uSc);

												if (((cOn && cSeq && unconfSeqSet.has(cOn + "_" + cSeq)) || (cSc && unconfSalesCdSet.has(cSc))) && itemRow.cnfmYn !== 'N') {
													itemRow.cnfmYn = 'N';

													var dSc = String(dRow.salesCd || '').trim();

													}
												}
												for (var n = 0; n < list.length; n++) {
													if (String(list[n].lvl) === '2') {
														var curSc = String(list[n].salesCd || '').trim();
														var matched = issMap[curSc];

    function excelDown() {
		var paramObj = {"pageNo": 1};
		$.each($('#main_area [data-search]'), function(idx, elem){
			paramObj[$(elem).data('search')] = elem.value;
		});
		paramObj.recordCnt = 99999999;
		paramObj["strtDt"] = $("#strtDt_S").val().replace(/\-/g, '');
		paramObj["endDt"]  = $("#endDt_S").val().replace(/\-/g, '');

        postAjax("/user/cr/cr02/selectOrdrsList", paramObj, null, function (data) {
			//var list = data.result;
			var list = data.ordrsList;
//          if ($("#coCd_S").val() != jwt.coCd) {
   			//****************************************************
   			// 2025.07.15 남장서 수정 적용
   			//회사코드가 GUN 인경우 임원실(GUN00), 영업(GUN30), 회계팀(GUN20), 전산팀(GUN80)
   			//회사코드가 TRN 인경우 임원실(GUN00), 트루넷(TRN),  회계팀(GUN20), 전산팀(GUN80)만 수주목표가 및 수주금액 조회가능 함.
			let passChkDeptId = jwt.deptId;
   			if (($("#coCd_S").val() == 'GUN' && (passChkDeptId.includes('GUN00') || passChkDeptId.includes('GUN30') || passChkDeptId.includes('GUN20') || passChkDeptId.includes('GUN80'))) ||
   			    ($("#coCd_S").val() == 'TRN' && (passChkDeptId.includes('GUN00') || passChkDeptId.includes('TRN')   || passChkDeptId.includes('GUN20') || passChkDeptId.includes('GUN80')))) {
   				//정상 조회가능함
   			} else {
            	for (var i = 0; i < list.length; i++) {
                    list[i].estTrgtCost = 0;		//수주목표
            		list[i].ordrsAmt = 0;
                    list[i].exchangeAmt = 0;
                    list[i].ordrsPrcMach = 0;
                    list[i].ordrsPrcElcty = 0;
                    list[i].ordrsPrc = 0;
                }
            }
			if (jwt.deptId == "GUN70" || jwt.deptId.startsWith("GUN60")) {
				for (var i = 0; i < list.length; i++) {
					list[i].estEpctMatPrc = 0;
					list[i].trgtPchsPcostMach = 0;
					list[i].trgtPchsPcostElcty = 0;
					list[i].sum = 0;
					list[i].trgtPchsPcostInHousePrcsn = 0;
					list[i].machineValueAfterDeduction = 0;
				}
			}
			excelView.target.setData({
				list : list,
				page : {
					totalElements : list.length,
				}
			});
			var todayDate = new Date().format('yyyyMMddHHmmss');
			excelView.target.exportExcel("수주관리_"+todayDate+".xls");
		});
	}

    function openIssueList(pIdxOrItem) {
        var row = null;
        if (pIdxOrItem && typeof pIdxOrItem === "object") {
            row = pIdxOrItem;
        } else if (typeof pIdxOrItem === "number" && pIdxOrItem >= 0) {
            var list = getFullGridList();
            row = list ? list[pIdxOrItem] : null;
        }
        if (!row) {
            var selectedList = gridView.target.getList("selected");
            if (selectedList && selectedList.length > 0) {
                row = selectedList[0];
            } else if (typeof select_index === "number" && select_index >= 0) {
                var fullList = getFullGridList();
                row = fullList ? fullList[select_index] : null;
            }
        }
        if (!row) {
            var allList = getFullGridList();
            if (allList && allList.length > 0) {
                row = allList[0];
            }
        }

        var isMaster = (row && (String(row.lvl) === "1" || !row.salesCd || row.salesCd === "-"));
        var searchVal = (!isMaster && row && row.salesCd && row.salesCd !== "-") ? row.salesCd : ((row && row.ordrsNo) ? row.ordrsNo : "");
        var clntNm = (row && (row.clntNm || row.ordrsClntNm)) ? (row.clntNm || row.ordrsClntNm) : "";
        var modalTitle = searchVal ? ((!isMaster && row && row.salesCd && row.salesCd !== "-") ? ("Sales Code 검색 (" + searchVal + ")") : ("수주번호 검색 (" + searchVal + ")")) : "미완료 이슈 전체 현황";
        var paramObj = {
            "coCd"        : $('#coCd_S').val() || (row ? row.coCd : ""),
            "searchValue" : searchVal,
            "salesCd"     : (!isMaster && row && row.salesCd && row.salesCd !== "-") ? row.salesCd : "",
            "ordrsNo"     : (row && row.ordrsNo) ? row.ordrsNo : "",
            "clntNm"      : clntNm
        };
        openModal("/static/html/cmn/modal/ordrsIssueList.html", 1700, $('body').height()-40, modalTitle, paramObj, function (grid) {
        });
    }
