<script type="text/javascript">
    var isFirst = true;
    let select_index = null;
	ax5.ui.grid.formatter["appStatus"] = function () {
		if(this.value == undefined) {
	        return ' ';
		}else if(this.value == "Y"){

 	    }
		else {

	};


	function gridColorSet(_itemOrCollapse) {
		var _collapse = "";
		var _cnfmYnAmt = 0;
		if (typeof _itemOrCollapse === "object" && _itemOrCollapse !== null) {
			_collapse = _itemOrCollapse.collapse;
			_cnfmYnAmt = gPasFloatChk(_itemOrCollapse.cnfmYnAmt);
		} else {
			_collapse = _itemOrCollapse;
		}

		if (String(_collapse) === "2") {
			styleClass = "grid-cell-yellow";
		} else if (String(_collapse) === "3" || _cnfmYnAmt > 0){
			styleClass = "grid-cell-red";
		} else {
			styleClass = "";
		}
		return styleClass;
	};

	/**
	 * 수주/SalesCd 그리드 뱃지 통합 생성 및 관리 함수
	 * @param {Object} item 행 데이터
	 * @returns {string} 뱃지 HTML 문자열
	 */
	function getSalesCdBadgesHtml(item) {
		if (!item) return '';
		var badges = '';

		// 1) 이슈 뱃지 (미완료문제건수 / 발생건수)
		var totIss = parseInt(item.issueTotCnt, 10);
		var uncompIss = parseInt(item.issueUncompCnt, 10);
		if (!isNaN(totIss) && totIss > 0) {
			var uncomp = isNaN(uncompIss) ? 0 : uncompIss;
			var cls = uncomp > 0 ? "badge-issue-has-unresolved" : "badge-issue-all-resolved";
			badges += '<span class="badge-issue ' + cls + '" title="미완료문제 ' + uncomp + '건 / 발생 ' + totIss + '건">' + uncomp + '/' + totIss + '</span>';
		}

		// 2) 미확정 뱃지 (기준: 확정구분이 미확정(cnfmYn === 'N')이거나 미확정금액 존재 시 금액 유무와 무관하게 표시)
		var cnfmV = String(item.cnfmYn || '').trim();
		var isUnconfirmed = (cnfmV === 'N' || cnfmV === '미확정' || item.hasUnconfirmed === true || Math.abs(gPasFloatChk(item.rawCnfmYnAmt !== undefined ? item.rawCnfmYnAmt : item.cnfmYnAmt)) > 0);
		if (isUnconfirmed) {
			badges += '<span class="badge-unconfirmed" title="미확정 건 존재">미확정</span>';
		}

		// 3) 미정산 뱃지 (추후정산 항목이 있는 경우: unsettledAmt != 0 또는 ordrsDtlDiv10 === 'ORDRSDTLDIV1040' 또는 하위 추후정산 존재)
		var unsettledAmt = gPasFloatChk(item.unsettledAmt);
		var isUnsettledItem = (item.ordrsDtlDiv10 === 'ORDRSDTLDIV1040' || item.hasUnsettled === true);
		if (Math.abs(unsettledAmt) > 0 || isUnsettledItem) {
			var unsettledTitle = "추후정산: " + (Math.abs(unsettledAmt) > 0 ? unsettledAmt.toLocaleString() + "천원" : "항목존재");
			badges += '<span class="badge-unsettled" title="' + unsettledTitle + '">미정산</span>';
		}

		// 4) 정산상계 뱃지 (정산상계 항목이 있는 경우: settlementAmt != 0 또는 ordrsDtlDiv10 === 'ORDRSDTLDIV1050' 또는 하위 정산상계 존재)
		var settlementAmt = gPasFloatChk(item.settlementAmt);
		var isSettlementItem = (item.ordrsDtlDiv10 === 'ORDRSDTLDIV1050' || item.hasSettlement === true);
		if (Math.abs(settlementAmt) > 0 || isSettlementItem) {
			var settlementTitle = "정산상계: " + (Math.abs(settlementAmt) > 0 ? settlementAmt.toLocaleString() + "천원" : "항목존재");
			badges += '<span class="badge-settlement" title="' + settlementTitle + '">정산상계</span>';
		}

		return badges;
	}

	/**
	 * 하위(lvl=2) 상세 행들의 뱃지 조건(미확정, 미정산, 정산상계, 이슈건수)을 상위(lvl=1) 마스터 행으로 집계/전파
	 */
	function applyBadgeAggregation(list) {
		if (!list || !list.length) return;
		var parentStateMap = {};
		for (var i = 0; i < list.length; i++) {
			var row = list[i];
			var on = String(row.ordrsNo || '').trim();
			if (!on) continue;
			if (!parentStateMap[on]) {
				parentStateMap[on] = {
					hasUnconfirmed: false,
					hasUnsettled: false,
					hasSettlement: false,
					issueTotCnt: 0,
					issueUncompCnt: 0
				};
			}
			var st = parentStateMap[on];
			var cnfmV = String(row.cnfmYn || '').trim();
			var rawAmt = gPasFloatChk(row.rawCnfmYnAmt !== undefined ? row.rawCnfmYnAmt : row.cnfmYnAmt);
			if (cnfmV === 'N' || cnfmV === '미확정' || Math.abs(rawAmt) > 0) {
				row.cnfmYn = 'N';
				row.hasUnconfirmed = true;
				st.hasUnconfirmed = true;
			}
			if (row.ordrsDtlDiv10 === 'ORDRSDTLDIV1040' || Math.abs(gPasFloatChk(row.unsettledAmt)) > 0) {
				row.hasUnsettled = true;
				st.hasUnsettled = true;
			}
			if (row.ordrsDtlDiv10 === 'ORDRSDTLDIV1050' || Math.abs(gPasFloatChk(row.settlementAmt)) > 0) {
				row.hasSettlement = true;
				st.hasSettlement = true;
			}
			if (String(row.lvl) === '2') {
				st.issueTotCnt += gPasIntChk(row.issueTotCnt);
				st.issueUncompCnt += gPasIntChk(row.issueUncompCnt);
			}
		}
		for (var j = 0; j < list.length; j++) {
			var r = list[j];
			if (String(r.lvl) === '1') {
				var pOn = String(r.ordrsNo || '').trim();
				var pSt = parentStateMap[pOn];
				if (pSt) {
					if (pSt.hasUnconfirmed) {
						r.cnfmYn = 'N';
						r.hasUnconfirmed = true;
					}
					if (pSt.hasUnsettled) r.hasUnsettled = true;
					if (pSt.hasSettlement) r.hasSettlement = true;
					if (gPasIntChk(r.issueTotCnt) === 0 && pSt.issueTotCnt > 0) {
						r.issueTotCnt = pSt.issueTotCnt;
						r.issueUncompCnt = pSt.issueUncompCnt;
					}
				}
			}
		}
	}

	ax5.ui.grid.formatter["salesCdBadge"] = function () {
		var val = this.value || "";
		var item = this.item;
		if (!item) return val;
		return '<span>' + val + '</span>' + getSalesCdBadgesHtml(item);
	};

            this.target.setConfig({

                body: {

									pageSize: data.paginationInfo.pageSize,
									totalElements: data.paginationInfo.totalRecordCount,
									totalPages: data.paginationInfo.totalPageCount
								}
							});
						}

						renderGrid();

						var reqCoCd = $("#coCd_S").val() || (list[0] && list[0].coCd) || jwt.coCd;

						// 백엔드 selectOrdrsList 에 cnfmYn 필드가 아직 반영되지 않은 경우(서버 미재기동 시) 금액 0원 미확정건 보강 조회
						if (!hasServerCnfmYn && list.length > 0) {
							postAjax("/user/cr/cr02/selectOrdrsUnconfirmedDetails", { coCd: reqCoCd }, null, function(unconfData) {
								try {
									var unconfList = (unconfData && unconfData.result) ? unconfData.result : [];
									if (unconfList.length > 0) {
										var unconfOrdrsNoSet = new Set();
										var unconfSeqSet = new Set();
										var unconfSalesCdSet = new Set();
										for (var u = 0; u < unconfList.length; u++) {
											var uRow = unconfList[u];
											var uCnfm = String(uRow.cnfmYn || '').trim();
											if (uCnfm !== 'N' && uCnfm !== '미확정') continue;
											var uOn = String(uRow.ordrsNo || '').trim();
											var uSeq = String(uRow.ordrsSeq !== undefined && uRow.ordrsSeq !== null ? uRow.ordrsSeq : '').trim();
											var uSc = String(uRow.salesCd || '').trim();
											if (uOn) unconfOrdrsNoSet.add(uOn);
											if (uOn && uSeq) unconfSeqSet.add(uOn + "_" + uSeq);
											if (uSc) unconfSalesCdSet.add(uSc);
										}
										var changedCnfm = false;
										for (var idx = 0; idx < list.length; idx++) {
											var itemRow = list[idx];
											var cOn = String(itemRow.ordrsNo || '').trim();
											var cSeq = String(itemRow.ioSeq !== undefined && itemRow.ioSeq !== null ? itemRow.ioSeq : '').trim();
											var cSc = String(itemRow.salesCd || '').trim();
											if (String(itemRow.lvl) === '1') {
												if (cOn && unconfOrdrsNoSet.has(cOn) && itemRow.cnfmYn !== 'N') {
													itemRow.cnfmYn = 'N';
													itemRow.hasUnconfirmed = true;
													changedCnfm = true;
												}
											} else {
												if (((cOn && cSeq && unconfSeqSet.has(cOn + "_" + cSeq)) || (cSc && unconfSalesCdSet.has(cSc))) && itemRow.cnfmYn !== 'N') {
													itemRow.cnfmYn = 'N';
													itemRow.hasUnconfirmed = true;
													changedCnfm = true;
												}
											}
										}
										if (changedCnfm) {
											applyBadgeAggregation(list);
											renderGrid();
										}
									}
								} catch (e) {
									console.error("미확정 뱃지 보강 조회 오류", e);
								}
							}, false);
						}

						// 백엔드 selectOrdrsList 에 issueTotCnt 필드가 아직 반영되지 않은 경우(서버 미재기동 시) 경량 API로 보강 조회
						if (!hasServerIssueCnt && list.length > 0) {
							var salesCdSet = new Set();
							for (var k = 0; k < list.length; k++) {
								if (String(list[k].lvl) === '2') {
									var sc = String(list[k].salesCd || '').trim();
									if (sc && sc.indexOf('상세없음') === -1) salesCdSet.add(sc);
								}
							}
							var salesCdArr = Array.from(salesCdSet);
							if (salesCdArr.length > 0) {
								postAjax("/user/wb/wb24/selectWbsIssueCountBySalesCds", { coCd: reqCoCd, salesCds: salesCdArr }, null, function(cntData) {
									try {
										var cntRows = (cntData && cntData.result) ? cntData.result : [];
										if (cntRows.length === 0) return;
										var issMap = {};
										for (var c = 0; c < cntRows.length; c++) {
											var cSc = String(cntRows[c].salesCd || cntRows[c].SALES_CD || '').trim();
											var cTot = gPasIntChk(cntRows[c].cnt !== undefined ? cntRows[c].cnt : cntRows[c].CNT);
											if (cSc && cTot > 0) {
												issMap[cSc] = { totCnt: cTot, uncompCnt: 0 };
											}
										}
										postAjax("/user/wb/wb24/selectWbsIssueListDashboard", { coCd: reqCoCd }, null, function(dashData) {
											try {
												var dashRows = (dashData && dashData.result) ? dashData.result : [];
												for (var d = 0; d < dashRows.length; d++) {
													var dRow = dashRows[d];
													if (dRow.gubun !== '계획' && dRow.gubun !== '실적') continue;
													var dSc = String(dRow.salesCd || '').trim();
													if (dSc && issMap[dSc]) {
														issMap[dSc].uncompCnt += 1;
													}
												}
												for (var n = 0; n < list.length; n++) {
													if (String(list[n].lvl) === '2') {
														var curSc = String(list[n].salesCd || '').trim();
														var matched = issMap[curSc];
														if (matched) {
															list[n].issueTotCnt = matched.totCnt;
															list[n].issueUncompCnt = matched.uncompCnt;
														}
													}
												}
												applyBadgeAggregation(list);
												renderGrid();
											} catch (e2) {
												console.error("이슈 미완료 집계 오류", e2);
											}
										}, false);
									} catch (e1) {
										console.error("이슈 건수 조회 오류", e1);
									}
								}, false);
							}
						}
                    } catch (error) {
                        alert("오류 발생!! 전산실 연락 바랍니다", error.message);
                        return null; // 오류 발생 시 null 반환
                    } finally {
                        // console.log("함수 실행 완료.");
                    }
                });
            }
        }
    }

 //       var row = gridView.target.getList("selected")[0];

        	alert("결재가 완료되어 삭제 할 수 없습니다.");

        } else {
           	if (confirm("수주정보 전부를 삭제합니다. 삭제하시겠습니까?")) {
                deleteAjax("/user/cr/cr02/deleteOrdrs", formData, null, function (data) {

                    gridView.setData(0);

          	}
        }
    }

    function excelDown() {
		var paramObj = {"pageNo": 1};
		$.each($('#main_area [data-search]'), function(idx, elem){
			paramObj[$(elem).data('search')] = elem.value;
		});
		paramObj.recordCnt = 99999999;
		paramObj["strtDt"] = $("#strtDt_S").val().replace(/\-/g, '');
		paramObj["endDt"]  = $("#endDt_S").val().replace(/\-/g, '');

        postAjax("/user/cr/cr02/selectOrdrsList", paramObj, null, function (data) {
			//var list = data.result;
			var list = data.ordrsList;
//          if ($("#coCd_S").val() != jwt.coCd) {
   			//****************************************************
   			// 2025.07.15 남장서 수정 적용
   			//회사코드가 GUN 인경우 임원실(GUN00), 영업(GUN30), 회계팀(GUN20), 전산팀(GUN80)
   			//회사코드가 TRN 인경우 임원실(GUN00), 트루넷(TRN),  회계팀(GUN20), 전산팀(GUN80)만 수주목표가 및 수주금액 조회가능 함.
			let passChkDeptId = jwt.deptId;
   			if (($("#coCd_S").val() == 'GUN' && (passChkDeptId.includes('GUN00') || passChkDeptId.includes('GUN30') || passChkDeptId.includes('GUN20') || passChkDeptId.includes('GUN80'))) ||
   			    ($("#coCd_S").val() == 'TRN' && (passChkDeptId.includes('GUN00') || passChkDeptId.includes('TRN')   || passChkDeptId.includes('GUN20') || passChkDeptId.includes('GUN80')))) {
   				//정상 조회가능함
   			} else {
            	for (var i = 0; i < list.length; i++) {
                    list[i].estTrgtCost = 0;		//수주목표
            		list[i].ordrsAmt = 0;
                    list[i].exchangeAmt = 0;
                    list[i].ordrsPrcMach = 0;
                    list[i].ordrsPrcElcty = 0;
                    list[i].ordrsPrc = 0;
                }
            }
			if (jwt.deptId == "GUN70" || jwt.deptId.startsWith("GUN60")) {
				for (var i = 0; i < list.length; i++) {
					list[i].estEpctMatPrc = 0;
					list[i].trgtPchsPcostMach = 0;
					list[i].trgtPchsPcostElcty = 0;
					list[i].sum = 0;
					list[i].trgtPchsPcostInHousePrcsn = 0;
					list[i].machineValueAfterDeduction = 0;
				}
			}
			excelView.target.setData({
				list : list,
				page : {
					totalElements : list.length,
				}
			});
			var todayDate = new Date().format('yyyyMMddHHmmss');
			excelView.target.exportExcel("수주관리_"+todayDate+".xls");
		});
	}
