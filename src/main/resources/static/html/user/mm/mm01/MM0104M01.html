    <script type="text/javascript">
    const blueGradient = ['#0d47a1', '#1565c0', '#1976d2', '#1e88e5', '#2196f3', '#42a5f5', '#64b5f6', '#90caf9', '#bbdefb', '#e3f2fd'];
    const greenHarmony = ['#10451d', '#155d27', '#1a7431', '#208b3a', '#25a244', '#2dc653', '#4ad66d', '#6ede8a', '#92e6a7', '#b7efc5'];
    // index = dataType. 7(장애유형분류)은 원본 '#ffbc42'(노랑)이 흰 글씨와 대비가 낮아 진한 보라로 변경
    const sunsetBliss = ['#0d47a1', '#0d47a1', '#006494', '#006d77', '#166088', '#218380', '#73d2de', '#5e35b1', '#d81159', '#8f2d56', '#218380', '#73d2de'];

    var jm = null;

    // 줌 & 팬 상태 제어 변수
    var zoomScale = 1.0;
    var zoomOffset = { x: 0, y: 0 };
    var isDragging = false;
    var isSpacePressed = false;
    var dragStartPos = { x: 0, y: 0 };
    var dragStartOffset = { x: 0, y: 0 };

    // 마인드맵 노드들의 좌표 범위(bounding box)를 계산하는 함수
    function getMapBounds() {
        if (!jm || !jm.mind) return null;

        var nodes = jm.mind.nodes;
        var minX = Infinity, maxX = -Infinity;
        var minY = Infinity, maxY = -Infinity;
        var hasNodes = false;

        for (var id in nodes) {
            var node = nodes[id];
            var view = node._data.view;
            if (!view) continue;

            var x = view.abs_x;
            var y = view.abs_y;
            var w = view.width;
            var h = view.height;

            if (typeof x === 'number' && typeof y === 'number' && w > 0 && h > 0) {
                hasNodes = true;
                if (x < minX) minX = x;
                if (x + w > maxX) maxX = x + w;
                if (y < minY) minY = y;
                if (y + h > maxY) maxY = y + h;
            }
        }

        if (!hasNodes) return null;
        return { minX: minX, maxX: maxX, minY: minY, maxY: maxY };
    }

    // 줌 & 팬 CSS transform 적용 함수
    function updateTransform() {
        var $inner = $('#jsmind_container .jsmind-inner');
        if ($inner.length > 0) {
            $inner.css({
                'transform': 'translate(' + zoomOffset.x + 'px, ' + zoomOffset.y + 'px) scale(' + zoomScale + ')',
                'transform-origin': '0 0'
            });
        }
    }

    function load_jsmind() {
        var actId = $('#actId_S').val();

        if (!actId) {
            return false;
        }

        var param = {
            coCd: $('#coCd_S').val() || jwt.coCd,
            actId: actId,
            fromDt: $('#fromDt_S').val(),
            toDt: $('#toDt_S').val()
        };

        var mindMapData = [];

        // Fetch MindMap by User
        postAjax('/user/mm/mm01/selectMindMapByUserList', param, null, function(data) {
            if (data.mindMapData) {
                mindMapData = data.mindMapData;
            }

            if (mindMapData.length > 0) {
                renderMind(mindMapData);
            } else {
                alert("데이터 조회 실패 또는 데이터가 없습니다.");
            }
        });
    }


 	$(document).ready(function() {
 		//초기설정들
 		mainDefaultLoad("공통정보", "담당자별 마인드맵현황");
 		setCommonSelect($("#main_area select[data-kind]"));

 		// 화면 크기 조절
//  		$("#top_area").hide();
 		$('#head_area').toggleClass('off');
 		$('#main_area').toggleClass('on');


 		// [권한] AUTH001 권한이 있어야 담당자 선택/변경 가능. 그 외에는 로그인 사용자로 고정.
        var canChangeAct = !!(jwt.authInfo && jwt.authInfo.indexOf('AUTH001') > -1);

        if (!canChangeAct) {
            // 담당자 변경 불가: 검색 아이콘 숨기고 로그인 사용자로 고정
            $('#actSearchBtn').hide();
            $('#actId_S').val(jwt.userId);
            $('#actNm_S').val(jwt.userNm);
        } else {
            // 담당자 변경 가능: 다른 화면에서 명시적으로 전달한 URL 파라미터가 있으면 그 담당자를 사용.
            // (브라우저에 남아있는 이전 검색 이력(localStorage)은 로그인 사용자가 바뀌어도 그대로 남아
            //  화면을 열 때마다 엉뚱한 담당자가 기본값으로 보이는 문제가 있어 초기 로딩에는 사용하지 않는다.)
    		const urlParams = new URLSearchParams(window.location.search);
    		const actId = urlParams.get('actId') || "";
    		const actNm = urlParams.get('actNm') || "";
    		const coCd = urlParams.get('coCd') || "";
    		if (actId) {
    		    $('#actId_S').val(actId);
    		    $('#actNm_S').val(actNm);
    		}
    		if (coCd) $('#coCd_S').val(coCd);

            // Set default user if not already set
            if (!$('#actId_S').val()) {
                $('#actId_S').val(jwt.userId);
                $('#actNm_S').val(jwt.userNm);
            }
        }

        // Set default dates if not already set
        if (!$('#fromDt_S').val()) {
            $('#fromDt_S').val(moment().subtract(1, 'years').format('YYYY-MM-DD'));
        }
        if (!$('#toDt_S').val()) {
            $('#toDt_S').val(moment().format('YYYY-MM-DD'));
        }

        // Initial load
        load_jsmind();

        // Date change triggers reload
        $('#fromDt_S, #toDt_S').on('change', function() {
            load_jsmind();
        });


        // 뒤로가기 시 목록 화면으로 이동
        history.pushState(top.location.href, null, top.location.href);
        window.addEventListener('popstate', function(event) {
            location.href = "/static/index.html";
        });

        // [툴팁]
        // 동적으로 생성된 jmnode 요소에 대한 이벤트 위임
        $(document).on('mouseenter', 'jmnode', function(e) {
            var nodeid = $(this).attr('nodeid');
            if (!jm) return;

            var node = jm.get_node(nodeid);
            if (node && node.data) {
                showTooltip(e, node);
            }
        }).on('mouseleave', 'jmnode', function() {
            $('#node-tooltip').hide();
        }).on('mousemove', 'jmnode', function(e) {
            moveTooltip(e);
        }).on('dblclick', 'jmnode', function(e) {
            var nodeid = $(this).attr('nodeid');
            if (!jm) return;
            var node = jm.get_node(nodeid);

            // 중첩된 데이터를 처리합니다(node.data 또는 node.data.data 해결).
            var data = node.data;
            if (data && data.data) data = data.data;

            // Ensure dataType matches robustly
            var dataType = (data && data.dataType) ? String(data.dataType) : "";

            // [접기/펼치기 vs 상세조회] 자식이 있는 노드는 더블클릭 시 접기/펼치기,
            // 마지막(자식이 없는 말단) 노드는 더블클릭 시 해당 자료 상세 팝업을 연다.
            if (node.children && node.children.length > 0) {
                jm.toggle_node(nodeid);
                return;
            }

            if (dataType == '3') {
               if (data && data.salesCd) {
                    var paramObj = {
                        "coCd": data.coCd,
                        "salesCd": data.salesCd,
                        "planVerNo": "",
                        "histYn": 'N',
                    };
                    openModal("/static/html/user/wb/wb22/WB2201P01.html", 1400, 900, "WBS 계획등록", paramObj, function () {
                        load_jsmind();
                    });
                }
            } else if (dataType == '4') {
                // [Type 4] Issue Correction (실적문제수정)
                var paramObj = {
                   "actionType"     : "U4",
                   "coCd"           : data.coCd,
                   "salesCd"        : data.salesCd,
                   "issFileTrgtKey" : data.fileTrgtKey
                };
                openModal("/static/html/user/wb/wb24/WB2401P11.html", 1200, 870, "WBS 실적문제수정", paramObj, function (){
                    load_jsmind(); // Refresh on close
                });

            } else if (dataType == '5') {
               if (data.reqNo) {
                    // 발주요청번호가 존재하면 발주요청서 수정 업무 시작
                    var paramObj = {
                        "actionType" : "U",
                        "reqNo"    : data.reqNo,
                        "coCd" 	   : data.coCd,
                        "userId"   : jwt.userId,
                        "deptId"   : jwt.deptId,
                        "issNo"    : data.issNo,
                        "pgmId"    : "QM0101M01"
                    };
                    openModal("/static/html/user/qm/qm01/QM0101P01.html", 1600, 870, "", paramObj, function(data) {
                        if (data == 'ok') load_jsmind();
                    });
                }
            }
        });

        // ==========================================
        // 마인드맵 확대/축소 (Ctrl + Mouse Wheel) 및 이동 (Space + Drag / Mouse Wheel) 기능 이벤트 바인딩
        // ==========================================
        var container = document.getElementById('jsmind_container');

        // 1. 확대/축소 (Ctrl + Mouse Wheel) / 상하 이동 (Mouse Wheel)
        container.addEventListener('wheel', function(e) {
            if (e.ctrlKey) {
                e.preventDefault();

                var rect = container.getBoundingClientRect();
                var mouseX = e.clientX - rect.left;
                var mouseY = e.clientY - rect.top;

                var mapX = (mouseX - zoomOffset.x) / zoomScale;
                var mapY = (mouseY - zoomOffset.y) / zoomScale;

                var scaleStep = 0.1;
                var nextScale = zoomScale + (e.deltaY < 0 ? scaleStep : -scaleStep);
                nextScale = Math.max(0.3, Math.min(3.0, nextScale));

                zoomOffset.x = mouseX - mapX * nextScale;
                zoomOffset.y = mouseY - mapY * nextScale;
                zoomScale = nextScale;

                updateTransform();
            } else {
                // Ctrl 없이 휠만 사용하면 마인드맵을 위아래로 이동
                e.preventDefault();

                var nextOffsetY = zoomOffset.y - e.deltaY;

                // 마인드맵 자료가 화면에서 완전히 사라지지 않도록 상하 이동 한계 적용
                var bounds = getMapBounds();
                if (bounds) {
                    var containerHeight = container.clientHeight;
                    var margin = 80;
                    var scaledTop = bounds.minY * zoomScale;
                    var scaledBottom = bounds.maxY * zoomScale;

                    var minOffsetY = margin - scaledBottom;
                    var maxOffsetY = containerHeight - margin - scaledTop;

                    if (minOffsetY > maxOffsetY) {
                        minOffsetY = maxOffsetY = (minOffsetY + maxOffsetY) / 2;
                    }

                    nextOffsetY = Math.max(minOffsetY, Math.min(maxOffsetY, nextOffsetY));
                }

                zoomOffset.y = nextOffsetY;
                updateTransform();
            }
        }, { passive: false });

        // 2. Space 키 감지 (입력창 포커스 중이 아닐 때만 작동)
        $(document).on('keydown', function(e) {
            var activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
            if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') {
                return;
            }
            if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
                e.preventDefault();
                if (!isSpacePressed) {
                    isSpacePressed = true;
                    $('#jsmind_container').css('cursor', 'grab');
                }
            }
        });

        $(document).on('keyup', function(e) {
            if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
                isSpacePressed = false;
                isDragging = false;
                $('#jsmind_container').css('cursor', 'default');
            }
        });

        // 3. 마우스 드래그를 이용한 위치 이동
        $('#jsmind_container').on('mousedown', function(e) {
            if (isSpacePressed && e.button === 0) {
                isDragging = true;
                $(this).css('cursor', 'grabbing');
                dragStartPos.x = e.clientX;
                dragStartPos.y = e.clientY;
                dragStartOffset.x = zoomOffset.x;
                dragStartOffset.y = zoomOffset.y;
                e.preventDefault();
            }
        });

        $(document).on('mousemove', function(e) {
            if (isDragging) {
                var dx = e.clientX - dragStartPos.x;
                var dy = e.clientY - dragStartPos.y;

                zoomOffset.x = dragStartOffset.x + dx;
                zoomOffset.y = dragStartOffset.y + dy;

                updateTransform();
            }
        });

        $(document).on('mouseup mouseleave', function() {
            if (isDragging) {
                isDragging = false;
                if (isSpacePressed) {
                    $('#jsmind_container').css('cursor', 'grab');
                } else {
                    $('#jsmind_container').css('cursor', 'default');
                }
            }
        });
 	});

    function showTooltip(e, node) {
        if (!node.data) return;
        var data = node.data.data;

        var html = '<div class="tooltip-header">' + (node.topic || 'Node Info') + '</div>';
        html += '<table>';

        var fields = [
            { key: 'id', label: 'ID' },
            { key: 'ordrsNo', label: '수주번호' },
            { key: 'salesCd', label: 'Sales Code' },
            { key: 'ordrsClntNm', label: '고객사' },
            { key: 'clntPjtNm', label: 'Project' },
            { key: 'mctypeNm', label: '설비유형' },
            { key: 'issNo', label: '문제번호' },
            { key: 'reqNo', label: '발주요청번호' },
            { key: 'issSts', label: '문제상태' },
            { key: 'reqStNm', label: '발주요청서상태' },
            { key: 'actNm', label: '담당자' },
            { key: 'grpCdNm', label: '장애유형분류' },
            { key: 'subCdNm', label: '장애유형' },
            { key: 'dataType', label: 'Data Type' },
            { key: 'issCnts', label: '문제내용' },
            { key: 'reqRmk', label: '발주요청서비고' },
            { key: 'issAmt', label: '비용' },
            { key: 'actMh', label: '투입공수' },
            { key: 'sumTeamMd', label: '총합공수' },
            { key: 'saleTeamMd', label: '영업공수' },
            { key: 'dsgnTeamMd', label: '설계공수' },
            { key: 'matrTeamMd', label: '구매공수' },
            { key: 'prodTeamMd', label: '생산공수' }
        ];

        var dataTypeMap = {
            "1": "담당자",
            "2": "수주 자료",
            "3": "기계설비",
            "4": "문제발생자료",
            "5": "요인별발주요청서 자료",
            "7": "장애유형분류",
            "8": "장애유형"
        };

        // Pre-fetch reqStNm for the override logic using the helper
        var reqStNmVal = getValueIgnoreCase(data, 'reqStNm');

        var issStsMap = {
            "ISSSTS01": "접수중",
            "ISSSTS02": "진행중",
            "ISSSTS03": "완료"
        };

        fields.forEach(function(f) {
            var val = getValueIgnoreCase(data, f.key);
            if (f.key === 'id') {return ;}
            // Override logic: if issSts is being processed and reqStNm exists, use reqStNm
            if (f.key === 'issSts') {
                 if (reqStNmVal) {
                     val = reqStNmVal;
                 } else if (val && issStsMap[val]) {
                     val = issStsMap[val];
                 }
            }

            // Apply dataType mapping
            if (f.key === 'dataType' && val && dataTypeMap[val]) {
                val = dataTypeMap[val];
            }

            // Format issAmt
            if (f.key === 'issAmt') {
                var amt = Number(val) || 0;
                if (amt === 0) {
                    return;
                }
                val = fmtAmt(amt) + '천원';
            }

            // Format actMh, sumTeamMd, team MDs
            if (f.key === 'actMh' || f.key === 'sumTeamMd' || f.key === 'saleTeamMd' || f.key === 'dsgnTeamMd' || f.key === 'matrTeamMd' || f.key === 'prodTeamMd') {
                var num = Number(val) || 0;
                if (num === 0) {
                    return;
                }
                val = fmtMh(num);
            }

            if (val !== undefined && val !== null && val !== '') {
                html += '<tr><th>' + f.label + '</th><td>' + val + '</td></tr>';
            }
        });

        html += '</table>';

        $('#node-tooltip').html(html).show();
        moveTooltip(e);
    }

    // Helper to find value with various key formats
    function getValueIgnoreCase(data, key) {
        if (data[key]) return data[key];

        var upperKey = key.toUpperCase();
        if (data[upperKey]) return data[upperKey];

        // Try Snake Case conversion (e.g. ordrsNo -> ORDRS_NO)
        var snakeKey = key.replace(/([A-Z])/g, "_$1").toUpperCase();
        if (data[snakeKey]) return data[snakeKey];

        return "";
    }

    function moveTooltip(e) {
        var tooltip = $('#node-tooltip');
        var offset = 15; // Distance from mouse cursor

        // Calculate position
        var top = e.pageY + offset;
        var left = e.pageX + offset;

        // Boundary checks (optional, but good for UX)
        if (left + tooltip.outerWidth() > $(window).width()) {
            left = e.pageX - tooltip.outerWidth() - offset;
        }
        if (top + tooltip.outerHeight() > $(window).height()) {
            top = e.pageY - tooltip.outerHeight() - offset;
        }

        tooltip.css({
            top: top,
            left: left
        });
    }

    // 비용은 천원 단위로 표시 (원 → 천원 반올림) - 툴팁/렌더 공용
    function fmtAmt(n) {
        return Math.round(Number(n || 0) / 1000).toLocaleString('ko-KR');
    }
    function fmtMh(n) {
        return Number(n || 0).toLocaleString('ko-KR', {maximumFractionDigits: 1});
    }

     function renderMind(dbList) {
         if (!dbList || dbList.length === 0) {
             alert("조회된 데이터가 없습니다.");
             return;
         }

         // Transform DB list to jsMind node_array
         var nodeArray = [];

         // [건수] 노드별 하위 문제(dataType 4) 건수 계산 (issNo 기준 중복 제거)
         var childMap = {};
         var itemById = {};
         dbList.forEach(function(it) {
             var cid = it.id || it.ID;
             var cpid = it.parentid || it.PARENTID || '';
             itemById[cid] = it;
             if (!childMap[cpid]) childMap[cpid] = [];
             childMap[cpid].push(cid);
         });
         var issCountCache = {};
         var issAmtCache = {};

         function collectIssNos(nodeId, acc) {
             var it = itemById[nodeId];
             if (it && String(it.dataType) === '4') {
                 var issNo = getValueIgnoreCase(it, 'issNo') || nodeId;
                 acc[issNo] = true;
             }
             (childMap[nodeId] || []).forEach(function(c) { collectIssNos(c, acc); });
             return acc;
         }
         function getIssCount(nodeId) {
             if (issCountCache[nodeId] === undefined) {
                 issCountCache[nodeId] = Object.keys(collectIssNos(nodeId, {})).length;
             }
             return issCountCache[nodeId];
         }

         function collectIssAmts(nodeId, acc) {
             var it = itemById[nodeId];
             if (it && String(it.dataType) === '4') {
                 var issNo = getValueIgnoreCase(it, 'issNo') || nodeId;
                 var amt = Number(getValueIgnoreCase(it, 'issAmt')) || 0;
                 acc[issNo] = amt;
             }
             (childMap[nodeId] || []).forEach(function(c) { collectIssAmts(c, acc); });
             return acc;
         }
         function getIssAmt(nodeId) {
             if (issAmtCache[nodeId] === undefined) {
                 var amtMap = collectIssAmts(nodeId, {});
                 issAmtCache[nodeId] = Object.values(amtMap).reduce(function(sum, amt) { return sum + amt; }, 0);
             }
             return issAmtCache[nodeId];
         }

         var issMhCache = {};
         var issTeamMdCache = {};

         function collectIssMhs(nodeId, acc) {
             var it = itemById[nodeId];
             if (it && String(it.dataType) === '4') {
                 var issNo = getValueIgnoreCase(it, 'issNo') || nodeId;
                 var mh = Number(getValueIgnoreCase(it, 'actMh')) || 0;
                 acc[issNo] = (acc[issNo] || 0) + mh;
             }
             (childMap[nodeId] || []).forEach(function(c) { collectIssMhs(c, acc); });
             return acc;
         }
         function getIssMh(nodeId) {
             if (issMhCache[nodeId] === undefined) {
                 var mhMap = collectIssMhs(nodeId, {});
                 issMhCache[nodeId] = Object.values(mhMap).reduce(function(sum, mh) { return sum + mh; }, 0);
             }
             return issMhCache[nodeId];
         }

         function collectIssTeamMds(nodeId, acc) {
             var it = itemById[nodeId];
             if (it && String(it.dataType) === '4') {
                 var issNo = getValueIgnoreCase(it, 'issNo') || nodeId;
                 var teamMd = Number(getValueIgnoreCase(it, 'sumTeamMd')) || 0;
                 acc[issNo] = teamMd;
             }
             (childMap[nodeId] || []).forEach(function(c) { collectIssTeamMds(c, acc); });
             return acc;
         }
         function getIssTeamMd(nodeId) {
             if (issTeamMdCache[nodeId] === undefined) {
                 var teamMdMap = collectIssTeamMds(nodeId, {});
                 issTeamMdCache[nodeId] = Object.values(teamMdMap).reduce(function(sum, teamMd) { return sum + teamMd; }, 0);
             }
             return issTeamMdCache[nodeId];
         }

         dbList.forEach(function(item) {
             var id = item.id || item.ID;
             var topic = item.topic || item.TOPIC || id;

             // [Multi-line Support] Convert <br> to \n
             if (topic && typeof topic === 'string') {
                 topic = topic.replace(/<br\s*\/?>/gi, '\n');
             }

             var parentid = item.parentid || item.PARENTID;
             // DB field can be camel/snake/upper depending on mapper
             var dataType = (item.dataType != null ? item.dataType : '');

             // Data Fields
             var actNm = item.actNm || item.ACT_NM || '';
             var reqSt = item.reqSt || item.REQ_ST || '';
             var issSts = item.issSts || item.ISS_STS || '';
             var direction = item.direction || item.DIRECTION || '';

             var salesCd = getValueIgnoreCase(item, 'salesCd');
             var ordrsNo = getValueIgnoreCase(item, 'ordrsNo');
             var displayPrefix = salesCd ? salesCd : ordrsNo;

             var subCdNm = getValueIgnoreCase(item, 'subCdNm');

             // Topic Formatting
             var displayTopic = topic;

             if (dataType == '5') {
                 // Type 5: actNm / topic (+ warning if not REQST03)
                 displayTopic = actNm + ' / ' + topic;
                 if (reqSt !== 'REQST03') {
                     displayTopic += ' <i class="fa fa-exclamation-circle" style="color:red; font-size:14px; margin-left:4px;" title="미완료"></i>';
                 }
             } else if (dataType == '4') {
                 // Type 4: 좌우 분기 - direction에 따라 다른 prefix 표시
                 if (direction === 'right') {
                     // 우측: 장애유형 쪽 (salesCd 사용)
                     displayTopic = (salesCd || '') + ' / ' + topic;
                 } else if (direction === 'left') {
                     // 좌측: 설비 쪽 (subCdNm 사용)
                     displayTopic = (subCdNm || '') + ' / ' + topic;
                 } else {
                     displayTopic = actNm + ' / ' + topic;
                 }
                 // Type 4: Build badge with cost/mh/teammd
                 var badgeParts = [];
                 var issAmt = Number(getValueIgnoreCase(item, 'issAmt')) || 0;
                 if (issAmt > 0) {
                     badgeParts.push('비용 ' + fmtAmt(issAmt) + '천원');
                 }
                 var actMh = Number(getValueIgnoreCase(item, 'actMh')) || 0;
                 if (actMh > 0) {
                     badgeParts.push('공수 ' + fmtMh(actMh));
                 }
                 var sumTeamMd = Number(getValueIgnoreCase(item, 'sumTeamMd')) || 0;
                 if (sumTeamMd > 0) {
                     badgeParts.push('팀공수 ' + fmtMh(sumTeamMd));
                 }
                 if (badgeParts.length > 0) {
                     displayTopic += ' <span style="font-size:11px; opacity:0.85;">[' + badgeParts.join(' / ') + ']</span>';
                 }
                 if (issSts !== 'ISSSTS03') {
                     displayTopic += ' <i class="fa fa-exclamation-circle" style="color:red; font-size:14px; margin-left:4px;" title="미완료"></i>';
                 }
             } else if (dataType == '2' || dataType == '3') {
                 // Type 2,3: displayPrefix + topic
                 displayTopic = displayPrefix + ' <br> ' + topic;
             }
             // Types 1, 7, 8: topic만 사용 (기본값)

             // [건수/금액/공수/팀공수] 문제/발주요청 이외 노드에는 하위 문제의 통계 표시
             if (dataType != '4' && dataType != '5') {
                 var issCount = getIssCount(id);
                 var issAmt = getIssAmt(id);
                 var issMh = getIssMh(id);
                 var issTeamMd = getIssTeamMd(id);
                 var countStr = issCount + '건';
                 if (issAmt > 0) {
                     countStr += ' / 비용 ' + fmtAmt(issAmt) + '천원';
                 }
                 if (issMh > 0) {
                     countStr += ' / 공수 ' + fmtMh(issMh);
                 }
                 if (issTeamMd > 0) {
                     countStr += ' / 팀공수 ' + fmtMh(issTeamMd);
                 }
                 var badgeHtml = ' <span style="font-size:11px; opacity:0.85;">(' + countStr + ')</span>';
                 if (dataType == '2' || dataType == '3') {
                     // 수주/설비 노드: 코드(salesCd/ordrsNo) 바로 뒤 첫 줄에 배지, 둘째 줄에 명칭
                     displayTopic = displayPrefix + badgeHtml + ' <br> ' + topic;
                 } else {
                     displayTopic += badgeHtml;
                 }
             }

             var node = {
                 id: id,
                 topic: displayTopic,
                 direction: direction
             };

             if (parentid && parentid !== 'ROOT' && parentid !== '') {
                 node.parentid = parentid;
             } else {
                 node.isroot = true;
             }

             // Color Logic
             if ((dataType == '4' && issSts === 'ISSSTS03') ||
                 (dataType == '5' && reqSt === 'REQST03')) {
                  // Completed Issue/Request -> Neutral/No Color
                  node['background-color'] = '#f0f0f0';
                  node['foreground-color'] = '#777'; // Dimmed text
             } else {
                  node['background-color'] = sunsetBliss[gPasIntChk(dataType)];
                  node['foreground-color'] = '#fff';
             }

             // Extra metadata for details
             node.data = Object.assign({}, item);

             nodeArray.push(node);
         });

         var mind = {
             meta: { name: 'ProjectMap', author: 'GBS', version: '1.0', },
             format: 'node_array',
             data: nodeArray
         };

         var options = {
             container: 'jsmind_container',
             editable: false,
             theme: 'greensea',
             support_html: true, // Enable HTML for icons
             view:{ line_width: 2, line_color: '#ccc', },
             layout: { hspace: 30, vspace: 5, pspace: 15, } //노드간의 간격조정 hspace:수평, vspace:수직, pspace:부모자식간격
         };

         // Clear previous map
         $('#jsmind_container').empty();

         jm = new jsMind(options);
         jm.show(mind);

         // 새로 그릴 때마다 줌/이동 상태 초기화
         zoomScale = 1.0;
         zoomOffset = { x: 0, y: 0 };
         updateTransform();
     }


      /**
       * [Common] Capture the entire mind map including off-screen nodes.
       * Uses CSS Transform to shift all content into the visible area before capturing.
       */
      function captureMindMap() {
          return new Promise((resolve, reject) => {
              const container = document.querySelector('#jsmind_container');
              if (!container) return reject('Container not found');

              // jsMind scroll container is `.jsmind-inner` (not `#jsmind_container`).
              // If we use the wrong scroll offsets, the capture bounds become too small and
              // the lower nodes get clipped in image/print.
              const panel = container.querySelector('.jsmind-inner') || container;
              const captureEl = panel;

              const originalStyles = {
                  containerWidth: container.style.width,
                  containerHeight: container.style.height,
                  containerOverflow: container.style.overflow,
                  panelWidth: panel.style.width,
                  panelHeight: panel.style.height,
                  panelOverflow: panel.style.overflow,
                  transforms: []
              };

              const shiftChildren = Array.from(panel.children);
              shiftChildren.forEach(child => {
                  originalStyles.transforms.push(child.style.transform);
              });

              // Make overflow visible so html2canvas can draw outside the viewport.
              container.style.overflow = 'visible';
              panel.style.overflow = 'visible';

              // Calculate bounding box of ALL nodes relative to the scrollable panel.
              let minX = Infinity, minY = Infinity;
              let maxX = -Infinity, maxY = -Infinity;

              const panelRect = panel.getBoundingClientRect();
              const nodes = panel.querySelectorAll('jmnode');

              if (nodes.length === 0) {
                  minX = 0; minY = 0;
                  maxX = panel.clientWidth; maxY = panel.clientHeight;
              } else {
                  nodes.forEach(node => {
                      const rect = node.getBoundingClientRect();
                      const relLeft = rect.left - panelRect.left + panel.scrollLeft;
                      const relTop = rect.top - panelRect.top + panel.scrollTop;
                      minX = Math.min(minX, relLeft);
                      minY = Math.min(minY, relTop);
                      maxX = Math.max(maxX, relLeft + rect.width);
                      maxY = Math.max(maxY, relTop + rect.height);
                  });
              }

              const padding = 50;
              const shiftX = padding - minX;
              const shiftY = padding - minY;
              const captureWidth = Math.ceil((maxX - minX) + (padding * 2));
              const captureHeight = Math.ceil((maxY - minY) + (padding * 2));

              // Resize to fit everything (both container + panel to avoid 100% sizing surprises).
              container.style.width = captureWidth + 'px';
              container.style.height = captureHeight + 'px';
              panel.style.width = captureWidth + 'px';
              panel.style.height = captureHeight + 'px';

              // Reset scroll so our translation is predictable.
              panel.scrollLeft = 0;
              panel.scrollTop = 0;

              // Shift canvas + nodes together (they are siblings under the panel).
              shiftChildren.forEach(child => {
                  child.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
              });

              // Prevent large captures from silently clipping due to browser canvas limits.
        // [User Request] High resolution scale (Text Ratio)
        const desiredScale = 3;
        const maxDim = 16384;
        const safeScale = Math.max(0.1, Math.min(desiredScale, maxDim / captureWidth, maxDim / captureHeight));

        html2canvas(captureEl, {
            scale: safeScale,
            width: captureWidth,
            height: captureHeight,
            windowWidth: captureWidth,
            windowHeight: captureHeight,
            x: 0,
            y: 0,
            scrollX: 0,
            scrollY: 0,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#f4f4f4',
            logging: false,
            onclone: function(clonedDoc) {
                // [User Request] Thinner borders and robust text sizing
                const nodes = clonedDoc.querySelectorAll('jmnode');
                nodes.forEach(node => {
                    node.style.borderWidth = '1px';
                });
            }
        }).then(canvas => {
                  // Cleanup / Restore
                  container.style.width = originalStyles.containerWidth;
                  container.style.height = originalStyles.containerHeight;
                  container.style.overflow = originalStyles.containerOverflow;
                  panel.style.width = originalStyles.panelWidth;
                  panel.style.height = originalStyles.panelHeight;
                  panel.style.overflow = originalStyles.panelOverflow;
                  shiftChildren.forEach((child, i) => {
                      child.style.transform = originalStyles.transforms[i];
                  });
                  resolve(canvas);
              }).catch(err => {
                  // Cleanup on error
                  container.style.width = originalStyles.containerWidth;
                  container.style.height = originalStyles.containerHeight;
                  container.style.overflow = originalStyles.containerOverflow;
                  panel.style.width = originalStyles.panelWidth;
                  panel.style.height = originalStyles.panelHeight;
                  panel.style.overflow = originalStyles.panelOverflow;
                  shiftChildren.forEach((child, i) => {
                      child.style.transform = originalStyles.transforms[i];
                  });
                  reject(err);
              });
          });
      }

     /**
      * [Export] Save Mind Map as PNG image
      */
     function saveMindMapImage() {
         captureMindMap().then(canvas => {
             const actNm = $('#actNm_S').val() || "MindMap";
             const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
             const filename = `MindMap_${actNm}_${dateStr}.png`;

             const link = document.createElement('a');
             link.download = filename;
             link.href = canvas.toDataURL("image/png");
             document.body.appendChild(link);
             link.click();
             document.body.removeChild(link);
         }).catch(err => {
             console.error("Image export failed:", err);
             alert("이미지 저장 중 오류가 발생했습니다.");
         });
     }

     /**
      * [Print] Print Mind Map (Fit to Page)
      */
     function printMindMap() {
         captureMindMap().then(canvas => {
             var imgData = canvas.toDataURL("image/png");
             var w = window.open("");
             w.document.write("<html><head><title>Mind Map Print</title>");
             // Set page margin to 0 or small value, and center content
             w.document.write("<style>@page { size: landscape; margin: 5mm; } body { margin: 0; text-align: center; display: flex; align-items: center; justify-content: center; height: 100vh; background: #fff; }</style>");
             w.document.write("</head><body>");
             // Fit image: max-width/height 100% preserves aspect ratio and fits in the page
             w.document.write("<img src='" + imgData + "' style='max-width:100%; max-height:100%; object-fit: contain; border: 1px solid #ddd;'>");
             w.document.write("</body></html>");
             w.document.close();

             setTimeout(function () {
                 w.print();
                 w.close();
             }, 500);
         }).catch(err => {
             console.error("Print capture failed:", err);
             alert("출력 중 오류가 발생했습니다.");
         });
     }

     // User Search Modal
     function userSearch() {

         if (!(jwt.authInfo && jwt.authInfo.indexOf('AUTH001') > -1)) { return; }
         openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "담당자 검색", {

             var id = tree.get_checked()[0];

             var node = tree.get_node(id);
             $('#actId_S').val(node.id);
             $('#actNm_S').val(node.text);

             load_jsmind();
         });
     }
