			$('#btnApplySelected').prop("disabled", true).css({ "opacity": "0.45", "cursor": "not-allowed" }).attr("title", "일정이 이미 확정된 상태입니다. (일정 Ver.Up 후 수정 가능)");
			$('#btnApplyAll').prop("disabled", true).css({ "opacity": "0.45", "cursor": "not-allowed" }).attr("title", "일정이 이미 확정된 상태입니다. (일정 Ver.Up 후 수정 가능)");
			$('#badgeSelectedCount').after('<span class="badge" style="background: #dc2626; font-size: 11px; padding: 2px 6px; margin-left: 4px;" title="일정확정 상태에서는 템플릿을 통한 변경이 차단됩니다."><i class="fas fa-lock" style="margin-right: 2px;"></i>일정확정 상태 (적용불가)</span>');
		}
	});

	// 그리드 초기화 (ax5grid - 스크롤바 없는 맞춤형 설정)
	function initGrids() {
		// 1. 좌측 템플릿 마스터 그리드 (너비 338px 내 완벽 수용, 가로/세로스크롤 0)
		gridTmplatMaster = new ax5.ui.grid();
		gridTmplatMaster.setConfig({
			target: $('[data-ax5grid="grid-tmplat-master"]'),
			showRowSelector: false,
			multipleSelect: false,
			sortable: true,
			header: { align: "center", columnHeight: 26 },
			body: {
				columnHeight: 26,
				onClick: function() {
					this.self.select(this.dindex);
					selectTemplateRow(this.item);
				}
			},
			columns: [
				{ key: "sortOrd",   label: "순서", width: 36,  align: "center" },
				{ key: "tmplatNm",  label: "템플릿 명칭", width: 185, align: "left", styleClass: function() { return "font-weight: 600;"; } },
				{ key: "tmplatDiv", label: "구분", width: 65,  align: "center" },
				{ key: "useYn",     label: "사용", width: 42,  align: "center" }
			]
		});

		// 2. 우측 16개 단계 상세 그리드 (16개 행 세로 스크롤 없음, 가로 스크롤 없음)
		// 너비 합계: 체크박스(28) + 34 + 75 + 130 + 85 + 85 + 60 + 48 + 62 + 240 = 847px (뷰포트 890px보다 여유로움)
		gridTmplatDetail = new ax5.ui.grid();
		gridTmplatDetail.setConfig({
			target: $('[data-ax5grid="grid-tmplat-detail"]'),
			showRowSelector: true,
			multipleSelect: true,
			sortable: false,
			header: {
				align: "center",
				columnHeight: 26,
				selector: true
			},
			body: {
				columnHeight: 26,
				onClick: function() {
					updateSelectedCountBadge();
				}
			},
			columns: [
				{ key: "sortOrd",          label: "No.", width: 34, align: "center" },
				{ key: "wbsPlanCodeId",    label: "단계코드", width: 75, align: "center", styleClass: "font-mono" },
				{ key: "wbsPlanCodeNm",    label: "단계명", width: 130, align: "left", formatter: function() {
					return "<b>" + (this.value || "") + "</b>";
				}},
				{ key: "startOffset",      label: "시작 오프셋(일)", width: 85, align: "right", editor: { type: "number" }, formatter: function() {
					return (this.value !== null && this.value !== undefined && this.value !== "") ? ("D + " + this.value + " 일") : "<span style='color:#94a3b8;'>- (제외)</span>";
				}},
				{ key: "endOffset",        label: "종료 오프셋(일)", width: 85, align: "right", editor: { type: "number" }, formatter: function() {
					return (this.value !== null && this.value !== undefined && this.value !== "") ? ("D + " + this.value + " 일") : "<span style='color:#94a3b8;'>- (제외)</span>";
				}},
				{ key: "daycnt",           label: "소요일수", width: 60, align: "right", formatter: function() {
					var s = this.item.startOffset;
					var e = this.item.endOffset;
					if (s !== null && s !== undefined && s !== "" && e !== null && e !== undefined && e !== "") {
						var diff = parseInt(e) - parseInt(s) + 1;
						return (diff > 0 ? diff : 1) + " 일";
					}
					return "-";
				}},
				{ key: "outYn",            label: "외작", width: 48, align: "center", formatter: function() {
					return (this.value === "Y") ? "<span class='badge' style='background:#f59e0b;font-size:10px;'>외작</span>" : "<span style='color:#64748b;'>내작</span>";
				}},
				{ key: "useYn",            label: "포함여부", width: 62, align: "center", formatter: function() {
					var s = this.item.startOffset;
					var hasOffset = (s !== null && s !== undefined && s !== "");
					return hasOffset ? "<span class='badge' style='background:#10b981;font-size:10px;'>일정포함</span>" : "<span class='badge' style='background:#94a3b8;font-size:10px;'>일정제외</span>";
				}},
				{ key: "rmk",              label: "비고", width: 240, align: "left", editor: { type: "text" } }
			]
		});
	}

	// 템플릿 마스터 목록 조회
	function initTmplatMaster(targetSelectId) {
		var param = {
			coCd: coCd,
			useYn: ""
		};

		postAjax("/user/wb/wb30/selectWbsTmplatList", param, null, function(data) {
			var list = (data && data.result) ? data.result : [];
			if (list.length > 0) {
				tmplatMasterList = list;
			} else {
				// DB에 데이터가 없으면 내장 폴백 템플릿 자동 구성
				tmplatMasterList = buildFallbackMasterList();
			}
			renderMasterGrid(targetSelectId);
		}, function(err) {
			console.warn("DB 템플릿 목록 조회 실패(내장 템플릿 폴백 적용):", err);
			tmplatMasterList = buildFallbackMasterList();
			renderMasterGrid(targetSelectId);
		});
	}

	// 내장 템플릿 기반 마스터 리스트 구성 (Fallback)
	function buildFallbackMasterList() {
		var list = [];
		var idx = 1;
		for (var k in FALLBACK_TEMPLATES) {
			var item = FALLBACK_TEMPLATES[k];
			list.push({
				coCd: coCd,
				tmplatId: k,
				tmplatNm: item.name,
				tmplatDiv: item.div || "COMMON",
				dlvDaycnt: item.deliveryDay || 0,
				rtnDaycnt: item.returnDay || 0,
				rmk: item.name,
				useYn: "Y",
				sortOrd: idx++
			});
		}
		return list;
	}

	function renderMasterGrid(targetSelectId) {
		gridTmplatMaster.setData(tmplatMasterList);
		if (tmplatMasterList.length > 0) {
			var selectIdx = 0;
			if (targetSelectId) {
				var foundIdx = tmplatMasterList.findIndex(function(m) { return m.tmplatId === targetSelectId; });
				if (foundIdx >= 0) selectIdx = foundIdx;
			} else if (parentParam.currentTmplatId) {
				var foundIdx = tmplatMasterList.findIndex(function(m) { return m.tmplatId === parentParam.currentTmplatId; });
				if (foundIdx >= 0) selectIdx = foundIdx;
			}
			gridTmplatMaster.select(selectIdx);
			selectTemplateRow(tmplatMasterList[selectIdx]);
		}
	}

	// 템플릿 행 선택 시 상세 정보 및 단계 로드
	function selectTemplateRow(item) {
		if (!item) return;
		currentSelectedTmplat = item;

		// 폼 바인딩
		$('#popTmplatId').val(item.tmplatId || "").prop("readonly", isBuiltInTemplate(item.tmplatId));
		$('#popTmplatNm').val(item.tmplatNm || "");
		$('#popTmplatDiv').val(item.tmplatDiv || "MOLD");
		$('#popDlvDaycnt').val(item.dlvDaycnt || "0");
		$('#popRtnDaycnt').val(item.rtnDaycnt || "0");
		$('#popSortOrd').val(item.sortOrd || "1");
		$('#popUseYn').val(item.useYn || "Y");
		$('#popRmk').val(item.rmk || "");

		$('#txtDetailTmplTitle').text("[" + (item.tmplatNm || item.tmplatId) + "] 단계 상세 설정");

		// 단계 상세 조회
		loadTemplateDetails(item.tmplatId);
	}

	function isBuiltInTemplate(id) {
		return ["MOLD_ALL", "MC_ALL", "FBF_MOLD", "HAF_MOLD", "HAF_MC", "EMPTY"].indexOf(id) >= 0;
	}

	// 단계 상세 목록 조회
	function loadTemplateDetails(tmplatId) {
		var param = {
			coCd: coCd,
			tmplatId: tmplatId
		};

		postAjax("/user/wb/wb30/selectWbsTmplatDetailList", param, null, function(data) {
			var list = (data && data.result) ? data.result : [];
			if (list.length > 0) {
				currentDetailList = list;
			} else {
				// DB에 단계 데이터가 없으면 기본 16개 표준 공정 체계 및 오프셋으로 빌드
				currentDetailList = buildFallbackDetailList(tmplatId);
			}
			renderDetailGrid();
		}, function(err) {
			console.warn("DB 단계 목록 조회 실패(내장 오프셋 폴백 적용):", err);
			currentDetailList = buildFallbackDetailList(tmplatId);
			renderDetailGrid();
		});
	}

	// 내장 오프셋 기반 단계 목록 빌드 (Fallback)
	function buildFallbackDetailList(tmplatId) {
		var tmpl = FALLBACK_TEMPLATES[tmplatId] || {};
		var offsets = tmpl.offsets || {};

		var list = [];
		BASE_16_STANDARDS.forEach(function(base, idx) {
			var off = offsets[base.codeId];
			var sOff = (off && off.length >= 2) ? off[0] : null;
			var eOff = (off && off.length >= 2) ? off[1] : null;
			var dCnt = (sOff !== null && eOff !== null) ? (eOff - sOff + 1) : 0;
			var isIncluded = (sOff !== null);

			list.push({
				coCd: coCd,
				tmplatId: tmplatId,
				wbsPlanCodeId: base.codeId,
				wbsPlanCodeNm: base.codeNm,
				startOffset: sOff,
				endOffset: eOff,
				daycnt: dCnt,
				planMh: base.defaultMh || 0,
				outYn: base.outYn || "N",
				useYn: isIncluded ? "Y" : "N",
				sortOrd: idx + 1,
				rmk: ""
			});
		});
		return list;
	}

	// 단계 그리드 렌더링 및 유효 단계 기본 선택
	function renderDetailGrid() {
		gridTmplatDetail.setData(currentDetailList);

		// 오프셋이 설정되어 일정에 포함되는 단계는 자동으로 체크박스 선택 처리
		var selectIndices = [];
		currentDetailList.forEach(function(item, idx) {
			if (item.startOffset !== null && item.startOffset !== undefined && item.startOffset !== "") {
				selectIndices.push(idx);
			}
		});

		selectIndices.forEach(function(i) {
			gridTmplatDetail.select(i);
		});

		updateSelectedCountBadge();
	}

	function updateSelectedCountBadge() {
		var sel = gridTmplatDetail.getList("selected") || [];
		$('#badgeSelectedCount').text("선택 " + sel.length + " / " + currentDetailList.length + " 건");
	}

	function selectAllDetailRows(isSelect) {
		if (isSelect) {
			currentDetailList.forEach(function(item, idx) {
				gridTmplatDetail.select(idx);
			});
		} else {
			gridTmplatDetail.select({ clear: true });
		}
		updateSelectedCountBadge();
	}

	// 신규 템플릿 추가
	function addNewTemplate() {
		var newId = "TMPL_" + new Date().getTime().toString().slice(-6);
		$('#popTmplatId').val(newId).prop("readonly", false).focus();
		$('#popTmplatNm').val("사용자 정의 신규 템플릿");
		$('#popTmplatDiv').val("COMMON");
		$('#popDlvDaycnt').val("90");
		$('#popRtnDaycnt').val("120");
		$('#popSortOrd').val(String(tmplatMasterList.length + 1));
		$('#popUseYn').val("Y");
		$('#popRmk').val("");

		currentSelectedTmplat = {
			coCd: coCd,
			tmplatId: newId,
			tmplatNm: "사용자 정의 신규 템플릿",
			tmplatDiv: "COMMON",
			dlvDaycnt: 90,
			rtnDaycnt: 120,
			sortOrd: tmplatMasterList.length + 1,
			useYn: "Y"
		};

		// 16개 표준 단계 뼈대 자동 생성
		currentDetailList = buildFallbackDetailList("MC_ALL");
		currentDetailList.forEach(function(d) { d.tmplatId = newId; });
		renderDetailGrid();

		alert("신규 템플릿 기본정보와 표준 단계가 생성되었습니다.\\n정보를 수정한 후 [템플릿 저장]을 눌러주십시오.");
	}

	// 템플릿 삭제
	function deleteSelectedTemplate() {
		var tmplatId = $('#popTmplatId').val();
		if (!tmplatId) {
			alert("삭제할 템플릿을 선택하십시오.");
			return;
		}
		if (isBuiltInTemplate(tmplatId)) {
			alert("시스템 기본 표준 템플릿은 삭제할 수 없습니다.\\n(사용자 추가 템플릿만 삭제 가능)");
			return;
		}

		if (confirm("정말 [" + tmplatId + "] 템플릿을 삭제하시겠습니까?\\n연결된 모든 단계 설정도 함께 삭제됩니다.")) {
			var param = {
				coCd: coCd,
				tmplatId: tmplatId
			};

			postAjax("/user/wb/wb30/deleteWbsTmplat", param, null, function(data) {
				if (data && data.resultCode == 200) {
					alert("템플릿이 삭제되었습니다.");
					initTmplatMaster();
				} else {
					alert("템플릿 삭제 실패: " + ((data && data.resultMessage) ? data.resultMessage : "오류"));
				}
			}, function(err) {
				alert("삭제 요청 중 통신 오류가 발생했습니다.");
			});
		}
	}

	// 템플릿 저장 (마스터 및 단계 상세)
	function saveTemplateData() {
		var tmplatId = $('#popTmplatId').val();
		var tmplatNm = $('#popTmplatNm').val();
		if (!tmplatId || !String(tmplatId).trim()) {
			alert("템플릿 ID를 입력하십시오.");
			$('#popTmplatId').focus();
			return;
		}
		if (!tmplatNm || !String(tmplatNm).trim()) {
			alert("템플릿 명칭을 입력하십시오.");
			$('#popTmplatNm').focus();
			return;
		}

		var masterData = {
			coCd: coCd,
			tmplatId: String(tmplatId).trim().toUpperCase(),
			tmplatNm: String(tmplatNm).trim(),
			tmplatDiv: $('#popTmplatDiv').val() || "MOLD",
			dlvDaycnt: parseInt($('#popDlvDaycnt').val() || "0"),
			rtnDaycnt: parseInt($('#popRtnDaycnt').val() || "0"),
			sortOrd: parseInt($('#popSortOrd').val() || "1"),
			useYn: $('#popUseYn').val() || "Y",
			rmk: $('#popRmk').val() || "",
			userId: jwt.userId,
			pgmId: "WB3001P01"
		};

		// 상세 그리드 목록
		var detailRows = gridTmplatDetail.getList();
		var detailList = [];
		detailRows.forEach(function(elem, idx) {
			var sOff = (elem.startOffset !== null && elem.startOffset !== undefined && elem.startOffset !== "") ? parseInt(elem.startOffset) : null;
			var eOff = (elem.endOffset !== null && elem.endOffset !== undefined && elem.endOffset !== "") ? parseInt(elem.endOffset) : null;
			var daycnt = (sOff !== null && eOff !== null) ? (eOff - sOff + 1) : 0;

			detailList.push({
				coCd: coCd,
				tmplatId: masterData.tmplatId,
				wbsPlanCodeId: elem.wbsPlanCodeId,
				wbsPlanCodeNm: elem.wbsPlanCodeNm || "",
				startOffset: sOff,
				endOffset: eOff,
				daycnt: daycnt > 0 ? daycnt : 0,
				planMh: elem.planMh || 0,
				outYn: elem.outYn || "N",
				useYn: (sOff !== null) ? "Y" : "N",
				sortOrd: idx + 1,
				rmk: elem.rmk || "",
				userId: jwt.userId,
				pgmId: "WB3001P01"
			});
		});

		masterData.detailList = detailList;

		postAjax("/user/wb/wb30/saveWbsTmplat", masterData, null, function(data) {
			if (data && data.resultCode == 200) {
				alert("WBS 기준 템플릿이 성공적으로 저장되었습니다.");
				initTmplatMaster(masterData.tmplatId);
				// 부모 창의 템플릿 셀렉트박스 옵션 갱신
				if (typeof parent.loadWbsTemplateOptions === "function") {
					parent.loadWbsTemplateOptions(masterData.tmplatId);
				}
			} else {
				alert("템플릿 저장 실패: " + ((data && data.resultMessage) ? data.resultMessage : "오류"));
			}
		}, function(err) {
			alert("템플릿 저장 요청 중 통신 오류가 발생했습니다.");
		});
	}

	// =========================================================================
	// [핵심 기능] 선택된 단계만 부모 화면의 WBS 일정으로 즉시 적용
	// =========================================================================
	function applySelectedTasksToProject() {
		if (parentParam.wbsPlanCloseYn === "Y") {
			alert("일정이 이미 확정된 상태에서는 템플릿 일정을 적용할 수 없습니다.\\n과제 확정 상태에서는 일정 변경이 불가하며, 수정이 필요한 경우 먼저 [일정 Ver.Up]을 진행해 주십시오.");
			return;
		}

		var selectedRows = gridTmplatDetail.getList("selected") || [];
		if (selectedRows.length === 0) {
			alert("적용할 WBS 단계를 1건 이상 체크박스로 선택해 주십시오.");
			return;
		}

		var tmplatNm = $('#popTmplatNm').val() || $('#popTmplatId').val();
		if (!confirm("선택된 " + selectedRows.length + "개 단계를 현재 과제 일정으로 적용하시겠습니까?\\n(착수일: " + beginDt + " 기준 오프셋 계산)")) {
			return;
		}

		// 부모 화면의 적용 콜백 함수 실행
		if (typeof parentParam.callback === "function") {
			parentParam.callback(selectedRows, {
				tmplatId: $('#popTmplatId').val(),
				tmplatNm: tmplatNm,
				dlvDaycnt: parseInt($('#popDlvDaycnt').val() || "0"),
				rtnDaycnt: parseInt($('#popRtnDaycnt').val() || "0")
			});
			modalStack.close();
		} else {
			alert("부모 화면 콜백이 지정되지 않았습니다.");
		}
	}

	// 템플릿의 전체 단계(오프셋 있는 모든 단계)를 부모 화면의 WBS 일정으로 적용
	function applyAllTasksToProject() {
		// [비즈니스 규칙] 과제 일괄적용은 신규등록 상태이거나 과제가 미확정 상태일 때만 가능
		var isNew = (parentParam.actionType === "C" || !parentParam.fileTrgtKey);
		var isProjectNotClosed = (parentParam.closeYn !== "Y");
		var canApplyAll = (isNew || isProjectNotClosed);

		if (!canApplyAll) {
			alert("과제 일괄적용은 신규등록 상태이거나 과제가 미확정 상태일 때만 가능합니다.\\n현재 과제는 이미 확정된 상태이므로 전체 템플릿 일괄적용이 불가능합니다.\\n(수정이 필요한 경우 먼저 상단 [과제 Ver.Up]을 진행해 주십시오.)");
			return;
		}

		if (parentParam.wbsPlanCloseYn === "Y") {
			alert("일정이 이미 확정된 상태에서는 템플릿 일정을 적용할 수 없습니다.\\n수정이 필요한 경우 먼저 WBS 영역의 [일정 Ver.Up]을 진행해 주십시오.");
			return;
		}

		var allRows = gridTmplatDetail.getList() || [];
		var validRows = allRows.filter(function(r) {
			return r.startOffset !== null && r.startOffset !== undefined && r.startOffset !== "";
		});

		if (validRows.length === 0) {
			alert("현재 템플릿에 유효한 일정 오프셋이 설정된 단계가 없습니다.");
			return;
		}

		var tmplatNm = $('#popTmplatNm').val() || $('#popTmplatId').val();
		if (!confirm("현재 템플릿 [" + tmplatNm + "]의 전체 단계(" + validRows.length + "건)를 과제 일정으로 적용하시겠습니까?")) {
			return;
		}

		if (typeof parentParam.callback === "function") {
			parentParam.callback(validRows, {
				tmplatId: $('#popTmplatId').val(),
				tmplatNm: tmplatNm,
				dlvDaycnt: parseInt($('#popDlvDaycnt').val() || "0"),
				rtnDaycnt: parseInt($('#popRtnDaycnt').val() || "0")
			});
			modalStack.close();
		} else {
			alert("부모 화면 콜백이 지정되지 않았습니다.");
		}
	}
</script>
