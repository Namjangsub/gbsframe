<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">
		<!-- 페이지 상단 버튼 -->
		<div class="contents no_bg">

				<li class="btn_r">

		<!-- 검색 콘텐츠 -->

			<input type="hidden" id="pgmId" name="pgmId" value="GM0101M01">
			<input type="hidden" id="coCd_S" name="coCd_S" data-search="coCd" value="GUN">
			<div class="">

					<colgroup>
						<col width="9%">
						<col width="23%">
						<col width="9%">
						<col width="14%">
						<col width="8%">
						<col width="12%">

						<col width="16%">
					</colgroup>
					<tr>
						<th class="hit">불출일자</th>
						<td>
							<div class="date_input" style="display:flex;align-items:center;gap:0px;">
								<input type="text" class="input_calendar" id="outDtFrom_S" name="outDtFrom_S" data-search="outDtFrom" autocomplete="off" onkeyup="dateMask(this);" style="cursor:pointer;" msg="시작일자">
								<span>~</span>
								<input type="text" class="input_calendar" id="outDtTo_S" name="outDtTo_S" data-search="outDtTo" autocomplete="off" onkeyup="dateMask(this);" style="cursor:pointer;" msg="종료일자">
							</div>
						</td>
						<th>USB 종류</th>
						<td>
							<select id="usbCd_S" name="usbCd_S" data-kind="GM01USB" data-search="usbCd" onchange="DataSearch();">
								<option value="">전체</option>
							</select>
						</td>
						<th>상태</th>
						<td>
							<select id="stsCd_S" name="stsCd_S" data-search="stsCd" onchange="DataSearch();">
								<option value="">전체</option>
								<option value="OUT">불출중</option>
								<option value="IN">반입완료</option>
							</select>
						</td>
						<th>관리부서</th>
						<td>
							<div class="search_form" style="width: 100%;">
								<input type="hidden" id="outDeptId_S" name="outDeptId_S" data-search="outDeptId">
								<input type="text" id="outDeptNm_S" name="outDeptNm_S" data-search="outDeptNm"
									onkeyup="(event.keyCode == 8 || event.keyCode == 46) ? outDeptId_S.value = '' : event.keyCode == 13 ? DataSearch() : '';">
								<a onclick="openOutDeptTree('S');"><i class="i_search_w"></i></a>
							</div>
						</td>

							<div class="search_form" style="width: 100%;">
								<input type="hidden" id="ownUserId_S" name="ownUserId_S" data-search="ownUserId">
								<input type="text" id="ownUserNm_S" name="ownUserNm_S" data-search="ownUserNm"
									onkeyup="(event.keyCode == 8 || event.keyCode == 46) ? ownUserId_S.value = '' : event.keyCode == 13 ? DataSearch() : '';">

							</div>
						</td>
						<th>외주업체</th>

							<div class="search_form" style="width: 100%;">

								<input type="text" id="vendClntNm_S" name="vendClntNm_S" data-search="vendClntNm"
									onkeyup="(event.keyCode == 8 || event.keyCode == 46) ? vendClntCd_S.value = '' : event.keyCode == 13 ? DataSearch() : '';">

							</div>
						</td>

						<td>

								<input type="text" id="salesCd_S" name="salesCd_S" data-search="salesCd"

		<!-- 콘텐츠 -->
		<div class="contents no_bg">
			<!-- 콘텐츠 타이틀 -->
			<div class="contents_tit">
				<span style="height: 30px; line-height: 30px; font-size: 15px;">보안USB 불출 목록</span>
				<div class="add_btn_small pdl10">
					<a onclick="openOutModal();" style="height: 30px; line-height: 28px; width: 80px;" authchk>불출등록</a>
					<a onclick="openInModal();" style="height: 30px; line-height: 28px; width: 80px;" authchk>반입처리</a>
					<a onclick="cancelSecUsbIn();" style="height: 30px; line-height: 28px; width: 80px;" authchk>반입취소</a>
					<a onclick="deleteSecUsb();" style="height: 30px; line-height: 28px; width: 60px;" authchk>삭 제</a>
					<a onclick="excelDown();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-file-excel"></i> 엑셀다운로드</a>
					<a onclick="openGridColumnConfig();" style="height: 30px; line-height: 28px; width: 90px;"><i class="fas fa-cog"></i> 그리드설정</a>
				</div>
			</div>
		</div>

		<!-- 콘텐츠 -->
		<div class="contents">
			<div class="ax5_grid" style="width: 100%">
				<div data-ax5grid="first-grid" data-ax5grid-config="{}" style="height: 100%; width: 100%; min-height: 400px;"></div>
			</div>
		</div>

</html>

<script type="text/javascript">

	// 상태 포맷터 (반입일자 유무로 판정)
	ax5.ui.grid.formatter["usbSts"] = function () {
		return (this.item && this.item.inDt) ? "반입완료" : "<span style='color:red;'>불출중</span>";
	};

	// 날짜 포맷터 (YYYYMMDD -> YYYY-MM-DD)
	ax5.ui.grid.formatter["formatDate"] = function () {
		var v = this.value;
		if (!v) return "";
		var s = String(v).replace(/\-/g, "");
		if (s.length < 8) return v;
		return s.substring(0, 4) + "-" + s.substring(4, 6) + "-" + s.substring(6, 8);
	};

	// 관리부서 포맷터 (undefined 표기 방지 안전 포맷터)
	ax5.ui.grid.formatter["outDeptFormatter"] = function () {
		var v = this.value || (this.item ? (this.item.outDeptNm || this.item.outDeptId) : "");
		if (!v || v === "undefined") return "";
		return v;
	};

	// Sales Code 건수 포맷터 (호버 툴팁 형식)
	ax5.ui.grid.formatter["salesCdCntFormatter"] = function () {
		var item = this.item || {};
		var firstSalesCd = item.firstSalesCd || item.salesCd || this.value || '';
		var cnt = item.salesCdCnt ? parseInt(item.salesCdCnt) : (firstSalesCd ? 1 : 0);
		var mngNo = item.mngNo || '';

		if (!firstSalesCd && cnt === 0) return "-";
		var displayText = firstSalesCd;
		if (cnt > 1) {
			displayText = (firstSalesCd ? (firstSalesCd + ' ') : '') + '외 ' + (cnt - 1) + '개';
		}
		return '<span class="sales-cd-hover" data-mng-no="' + mngNo + '" style="cursor:pointer;color:blue;text-decoration:underline;">' + displayText + '</span>';
	};

	// 기본 컬럼 정의 (사용자별 컬럼설정 병합 대상)
	var defaultColumns = [
		 {key: "coCd",        label: "회사코드",     width:  80, align: "center", hidden: true}
		,{key: "stsCd",       label: "상태",        width:  60, align: "center", formatter: "usbSts"}
		,{key: "outDt",       label: "불출일자",     width:  80, align: "center", formatter: "formatDate"}
		,{key: "inDt",        label: "반입일자",     width:  80, align: "center", formatter: "formatDate"}
		,{key: "inUserNm",    label: "반입확인자",   width:  90, align: "center"}
		,{key: "inDttm",      label: "반입일시",     width: 110, align: "center"}
		,{key: "usbCd",       label: "종류코드",     width:  80, align: "center", hidden: true}
		,{key: "usbNm",       label: "USB 종류",     width: 80, align: "center"}
		,{key: "outDeptId",   label: "관리부서코드", width:  90, align: "center", hidden: true}
		,{key: "outDeptNm",   label: "관리부서",     width: 100, align: "center"}
		,{key: "vendClntCd",  label: "외주업체코드", width:  90, align: "center", hidden: true}
		,{key: "vendClntNm",  label: "외주업체",     width: 130, align: "left"}
		,{key: "vendUserNm",  label: "업체담당",     width:  90, align: "center"}
		,{key: "salesCd",     label: "Sales Code", width: 180, align: "left", formatter: "salesCdCntFormatter"}
		,{key: "rmk",         label: "내용",        width: 250, align: "left"}
		,{key: "creatId",     label: "등록자ID",     width:  90, align: "center", hidden: true}
		,{key: "creatNm",     label: "등록자",       width:  60, align: "center"}
		,{key: "creatDttm",   label: "등록일시",     width: 110, align: "center"}
		,{key: "mngNo",       label: "관리번호",     width: 100, align: "center"}
	];

	// 동적 반응형 그리드 높이 조절 함수 (화면 하단 꽉 차게 계산)
	function adjustGridHeight() {
		var winHeight = $(window).height();
		var isIframe = (window.self !== window.top);
		if (isIframe) {
			try {
				if (window.top.innerHeight) winHeight = window.top.innerHeight;
			} catch (e) {
				winHeight = $(window).height();
			}
		}

		var $grid = $('[data-ax5grid="first-grid"]');
		if ($grid.length > 0) {
			var gridTop = $grid.offset().top || 200;
			var availableH = winHeight - gridTop - 20; // 하단 여백 20px만 남기고 화면 하단까지 꽉 차게
			if (availableH < 350) availableH = 350;
			$grid.css("height", availableH + "px");
		}

		if (gridView && gridView.target && gridView.target.align) {
			gridView.target.align();
		}
	}

	$(window).on("resize", function() {
		adjustGridHeight();
	});

	// 사용자별 컬럼 설정 팝업 호출
	function openGridColumnConfig() {
		GridColumnConfig.openEditor("GM0101M01", "first-grid", defaultColumns, function() {
			$('[data-ax5grid="first-grid"]').empty();
			gridView.initView().setData(0);
		});
	}

	var gridView = {
		initView : function() {
			adjustGridHeight();
			var cols = GridColumnConfig.apply("GM0101M01", "first-grid", defaultColumns);
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber : true,
				lineNumberColumnWidth : 40,
				showRowSelector : true,
				multipleSelect : false,
				sortable : true,
				target : $('[data-ax5grid="first-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						this.self.select(this.dindex);
					},
					onDBLClick : function() {
						openOutModal("U");
					}
				},
				page : {
					display : true,
					navigationItemCount : 10,
					height : 30,
					onChange : function() {
						gridView.setData(this.page.selectPage);
					}
				},
				columns : cols
			});
			return this;
		},
		setData : function(_pageNo) {
			var pageNo = _pageNo || 0;
			var formData = {
				 "coCd"       : "GUN"
				,"outDtFrom"  : $('#outDtFrom_S').val().replace(/\-/g, '')
				,"outDtTo"    : $('#outDtTo_S').val().replace(/\-/g, '')
				,"usbCd"      : $('#usbCd_S').val()
				,"stsCd"      : $('#stsCd_S').val()
				,"outDeptId"  : $('#outDeptId_S').val()
				,"ownUserId"  : $('#ownUserId_S').val()
				,"vendClntCd" : $('#vendClntCd_S').val()
				,"salesCd"    : $('#salesCd_S').val()
				,"rmk"        : $('#rmk_S').val()
				,"pageNo"     : pageNo + 1
			};
			postAjax("/user/gm/gm01/selectSecUsbList", formData, null, function(data) {
				try {
					gridView.target.setData({
						list : data.result,
						page : {
							currentPage   : pageNo,
							pageSize      : data.paginationInfo.pageSize,
							totalElements : data.paginationInfo.totalRecordCount,
							totalPages    : data.paginationInfo.totalPageCount
						}
					});
				} catch (error) {
					alert("오류 발생!! 전산실 연락 바랍니다");
					return null;
				}
			});
		}
	};

	// 본인 소속 부서(부서코드 앞 5자리 동일) 검증 함수
	function isMyDeptRow(row) {
		if (!row || !row.outDeptId) return true;
		var userDept5 = (jwt.deptId || '').substring(0, 5);
		if (userDept5 === "GUN80") return true;
		var rowDept5  = (row.outDeptId || '').substring(0, 5);
		if (userDept5 && rowDept5 && userDept5 !== rowDept5) {
			alert("자신의 부서(동일 소속 부서)의 보안USB만 처리할 수 있습니다.");
			return false;
		}
		return true;
	}

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("보안관리", "보안USB 관리대장");
		// 공통코드 set (검색영역만 - 모달과 DOM 을 공유하므로 범위 한정)
		setCommonSelect($("#main_area .contents.search select[data-kind]"));

		// USB 종류 검색 조건에 '전체' 옵션 보장
		if ($('#usbCd_S option[value=""]').length == 0) {
			$('#usbCd_S').prepend('<option value="" selected>전체</option>');
		}
		$('#usbCd_S').val("");

		$('#coCd_S').val("GUN");

		// 시작일/종료일 셋팅 (1개월 전 ~ 당일)
		$('#outDtFrom_S').val(moment().add(-1, "M").format("YYYY-MM-DD"));
		$('#outDtTo_S').val(moment().format("YYYY-MM-DD"));

		// TR0101M01.html 과 동일한 날짜 범위 선택기 (DateRangePicker)
		$('#outDtFrom_S, #outDtTo_S').on('click', function(){
			DateRangePicker.open({
				startDt: $('#outDtFrom_S').val() || null,
				endDt:   $('#outDtTo_S').val()   || null,
				excludeSelectors: ['#outDtFrom_S', '#outDtTo_S'],
				onApply: function(sd, ed){
					$('#outDtFrom_S').val(sd);
					$('#outDtTo_S').val(ed);
					gridView.setData(0);
				}
			});
		});

		gridView.initView().setData(0);

		authChk("GM0101M01");
	});

	// 검색 버튼
	function DataSearch() {
		gridView.setData(0);
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$('#coCd_S').val("GUN");
		$('#usbCd_S').val("");
		$('#stsCd_S').val("");
		$('#outDtFrom_S').val(moment().add(-1, "M").format("YYYY-MM-DD"));
		$('#outDtTo_S').val(moment().format("YYYY-MM-DD"));
		gridView.setData(0);
	}

	// 엑셀 다운로드
	function excelDown() {
		var targetObj = gridView.target;
		if (targetObj.list.length == 0) {
			alert("출력할 목록이 없습니다.");
			return;
		}
		targetObj.exportExcel("보안USB_불출목록_" + moment().format("YYYYMMDD") + ".xls");
	}

	// 선택 행 취득
	function getSelectedRow() {
		var list = gridView.target.getList("selected");
		if (!list || list.length < 1) {
			alert("대상 자료를 선택하세요.");
			return null;
		}
		return list[0];
	}

	/* 불출등록(C) / 불출내용 수정·조회(U) 모달 */
	function openOutModal(_actionType) {
		var actionType = (_actionType == "U") ? "U" : "C";
		var paramObj = {
			 "actionType" : actionType
			,"coCd"       : "GUN"
			,"userId"     : jwt.userId
			,"userNm"     : jwt.userNm
			,"pgmId"      : "GM0101P01"
		};

		if (actionType == "U") {
			var row = getSelectedRow();
			if (!row) return;
			if (!isMyDeptRow(row)) return;
			$.each(row, function(key, val) {
				paramObj[key] = (typeof(val) == "undefined") ? "" : val;
			});
			paramObj.coCd = "GUN";
		}

		openModal("/static/html/user/gm/gm01/GM0101P01.html", 1100, 620, "", paramObj, function(data) {
			gridView.setData(0);
		});
	}

	/* 반입처리 모달 */
	function openInModal() {
		var row = getSelectedRow();
		if (!row) return;
		if (!isMyDeptRow(row)) return;

		if (row.inDt) {
			alert("이미 반입처리된 자료입니다.");
			return;
		}

		var paramObj = {
			 "actionType" : "I"
			,"coCd"       : "GUN"
			,"userId"     : jwt.userId
			,"userNm"     : jwt.userNm
			,"pgmId"      : "GM0101P02"
		};
		$.each(row, function(key, val) {
			paramObj[key] = (typeof(val) == "undefined") ? "" : val;
		});
		paramObj.coCd = "GUN";

		openModal("/static/html/user/gm/gm01/GM0101P02.html", 900, 520, "", paramObj, function(data) {
			gridView.setData(0);
		});
	}

	/* 반입취소 */
	function cancelSecUsbIn() {
		var row = getSelectedRow();
		if (!row) return;
		if (!isMyDeptRow(row)) return;

		if (!row.inDt) {
			alert("반입완료 상태의 보안USB만 반입취소할 수 있습니다.");
			return;
		}

		if (!confirm("선택한 보안USB의 반입을 취소하고 '불출중' 상태로 원복하시겠습니까?")) return;

		var formData = {
			 "coCd"   : "GUN"
			,"mngNo"  : row.mngNo
			,"userId" : jwt.userId
			,"pgmId"  : "GM0101M01"
		};
		putAjax("/user/gm/gm01/cancelSecUsbIn", formData, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode == 200) {
				gridView.setData(0);
			}
		});
	}

	/* 삭제 */
	function deleteSecUsb() {
		var row = getSelectedRow();

		if (!isMyDeptRow(row)) return;

		if (row.inDt) {
			alert("반입완료된 보안USB는 삭제할 수 없습니다.\n(반입취소 후 삭제하십시오.)");
			return;
		}

		if (!confirm("삭제하시겠습니까?")) return;

		var formData = {
			 "coCd"   : "GUN"
			,"mngNo"  : row.mngNo
			,"userId" : jwt.userId
			,"pgmId"  : "GM0101M01"
		};
		putAjax("/user/gm/gm01/deleteSecUsb", formData, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode == 200) {
				gridView.setData(0);
			}
		});
	}

	/* 관리부서(조직) 검색 */

			,"deptId" : $('#outDeptId' + sfx).val()
			,"deptNm" : $('#outDeptNm' + sfx).val()
			,"useYn"  : "Y"
		};

			var checkedId = tree.get_checked()[0];

			$('#outDeptId' + sfx).val(checkedNode.id);
			$('#outDeptNm' + sfx).val(checkedNode.text);

	/* 당사담당(사원) 검색 */

			 "coCd"   : ''
			,"userId" : $('#ownUserId' + sfx).val()
			,"userNm" : $('#ownUserNm' + sfx).val()
			,"useYn"  : "Y"

				$('.popup_area #ownDeptId').val(checkedNode.original.deptId || '');

	/* 외주업체(거래처) 검색 */

	/* Sales Code 검색 (프로젝트/장비명 동시 세팅) */

	// 호버 툴팁 관련 변수 및 함수
	var salesCdHoverCache = {}; // {mngNo: {salesCd, clntPjt, clntPjtNm, eqpNm, ...}}
	var salesCdHoverTimeout = null;
	var currentHoverMngNo = null;

	// gridView.setData() 호출 시 캐시 초기화
	var originalSetData = gridView.setData;
	gridView.setData = function(_pageNo) {
		salesCdHoverCache = {}; // 캐시 clear
		originalSetData.call(this, _pageNo);
	};

	// Sales Code 상세 데이터 fetch (너무 자주 호출되면 캐시 활용)
	function fetchSalesCdDetails(mngNo, callback) {
		if (salesCdHoverCache[mngNo]) {
			callback(salesCdHoverCache[mngNo]);
			return;
		}

		var formData = {
			"coCd"  : "GUN",
			"mngNo" : mngNo
		};

		$.ajax({
			type: "POST",
			url: "/user/gm/gm01/selectSecUsbDtlList",
			contentType: "application/json; charset=utf-8",
			data: JSON.stringify(formData),
			beforeSend: function(request) {
				request.setRequestHeader("Authorization", authorizationToken);
			},
			success: function(data) {
				if (data && data.result) {
					salesCdHoverCache[mngNo] = data.result;
					callback(data.result);
				}
			},
			error: function() {
				// 오류 발생 시 빈 배열 반환
				callback([]);
			}
		});
	}

	// 호버 툴팁 표시
	function showSalesCdTooltip(elem, mngNo) {
		currentHoverMngNo = mngNo;

		fetchSalesCdDetails(mngNo, function(dtlList) {
			// stale response 가드: 현재 hover가 다른 행으로 바뀌었으면 무시
			if (currentHoverMngNo !== mngNo) return;

			// 기존 tooltip 제거
			$('#salesCdHoverTip').remove();

			if (!dtlList || dtlList.length === 0) {
				return; // 상세가 없으면 표시하지 않음
			}

			// 테이블 HTML 생성
			var html = '<table style="border-collapse:collapse;width:100%;font-size:11px;">';
			html += '<tr style="background:#f0f0f0;"><th style="border:1px solid #999;padding:4px;">Sales Code</th><th style="border:1px solid #999;padding:4px;">프로젝트</th><th style="border:1px solid #999;padding:4px;">장비명</th></tr>';
			$.each(dtlList, function(i, item) {
				html += '<tr>';
				html += '<td style="border:1px solid #ddd;padding:4px;">' + (item.salesCd || '') + '</td>';
				html += '<td style="border:1px solid #ddd;padding:4px;">' + (item.clntPjtNm || '') + '</td>';
				html += '<td style="border:1px solid #ddd;padding:4px;">' + (item.eqpNm || '') + '</td>';
				html += '</tr>';
			});
			html += '</table>';

			var tooltip = $('<div id="salesCdHoverTip" style="position:fixed;background:white;border:1px solid #999;box-shadow:0 2px 8px rgba(0,0,0,0.2);padding:8px;z-index:9999;max-width:500px;border-radius:3px;">' + html + '</div>');
			$('body').append(tooltip);

			// 위치 계산
			var rect = elem.getBoundingClientRect();
			var left = rect.left;
			var top = rect.bottom + 5;

			// 오른쪽 끝 체크: 너무 오른쪽으로 나가면 조정
			var w = tooltip.outerWidth() || 400;
			if (left + w > window.innerWidth) {
				left = window.innerWidth - w - 10;
			}

			tooltip.css({
				'left': left + 'px',
				'top': top + 'px'
			});
		});
	}

	// 호버 이벤트 처리 (이벤트 위임)
	$(document).on('mouseenter', '.sales-cd-hover', function(e) {
		clearTimeout(salesCdHoverTimeout);
		var mngNo = $(this).data('mng-no');
		showSalesCdTooltip(this, mngNo);
	});

	// 마우스가 텍스트를 벗어났을 때
	$(document).on('mouseleave', '.sales-cd-hover', function() {
		salesCdHoverTimeout = setTimeout(function() {
			// tooltip에 마우스가 있는지 확인
			if (!$('#salesCdHoverTip:hover').length) {
				$('#salesCdHoverTip').remove();
				currentHoverMngNo = null;
			}
		}, 150);
	});

	// tooltip 위에 마우스가 있을 때
	$(document).on('mouseenter', '#salesCdHoverTip', function() {
		clearTimeout(salesCdHoverTimeout);
	});

	// tooltip을 벗어났을 때
	$(document).on('mouseleave', '#salesCdHoverTip', function() {
		salesCdHoverTimeout = setTimeout(function() {
			$('#salesCdHoverTip').remove();
			currentHoverMngNo = null;
		}, 150);
	});

</script>
