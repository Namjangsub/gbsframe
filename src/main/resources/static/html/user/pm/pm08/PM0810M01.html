	<script type="text/javascript">
		var months = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
		var monthNames = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];

		function initYearSelect() {
			var currentYear = new Date().getFullYear();
			var select = $('#yy_S');
			for (var i = 2025; i <= currentYear + 1; i++) {
				select.append('<option value="' + i + '">' + i + '년</option>');
			}
			select.val(currentYear);
		}

		function setDefaultDeptInfo() {
			if (typeof jwt === "undefined" || !jwt.userId) return;

			$('#userId_S').val(jwt.userId);
			$('#userNm_S').val(jwt.userNm || "");

			// 로그인 사용자의 백엔드 상세 정보(부서코드) 조회 및 검색조건 자동 세팅
			postAjax("/admin/cm/cm06/selectUserInfo", { "userId": jwt.userId }, null, function(data) {
				// CM06Ctr.selectUserInfo()는 model.addAttribute("userInfo", ...)로 응답 (result 아님)
				var userInfo = (data && data.userInfo) ? data.userInfo : (data || {});
				var rawDeptId = userInfo.deptId || jwt.deptId || "";
				var deptId5 = rawDeptId.length > 5 ? rawDeptId.substring(0, 5) : rawDeptId;
				if (!deptId5) return;

				$('#deptCd_S').val(deptId5);

				// TB_CM06M01.DEPT_ID(사용자 소속)는 5자리보다 긴 세부코드일 수 있어 selectUserInfo의 DEPT_NM(전체 코드 정확일치 조회)이
				// NULL이 되는 경우가 있음 - 화면의 부서 필터와 동일하게 5자리로 자른 코드로 TB_CM04M01을 직접 조회해서 부서명을 채움
				postAjax("/admin/cm/cm04/selectDeptInfo", { "deptId": deptId5 }, null, function(deptData) {
					// CM04Ctr.selectDeptInfo()는 model.addAttribute("deptInfo", ...)로 응답 (result 아님)
					var deptInfo = (deptData && deptData.deptInfo) ? deptData.deptInfo : (deptData || {});
					var deptNmVal = deptInfo.deptNm || jwt.deptNm || "";
					if (deptNmVal && deptNmVal !== "undefined") {
						$('#deptNm_S').val(deptNmVal);
					}
				});
			});
		}

		function initSearch() {
			var curYy = moment().format("YYYY");
			$('#yy_S').val(curYy);
			$('#deptCd_S').val('');
			$('#deptNm_S').val('');
			$('#userId_S').val('');
			$('#userNm_S').val('');
			$('#useYn_S').val('Y');

			setDefaultDeptInfo();
			searchSubstVacationStatus();
		}

		$(document).ready(function() {
			mainDefaultLoad("인사관리", "대체휴가 현황");
			setCommonSelect($('[data-kind]'));
			initYearSelect();

			setDefaultDeptInfo();
			searchSubstVacationStatus();
		});

		function searchSubstVacationStatus() {
			var curYy = $('#yy_S').val() || moment().format("YYYY");
			$('#yy_S').val(curYy);
			$('#displayYyTitle').text(curYy);

			var rawDeptCd = $('#deptCd_S').val() || "";
			var deptCd5Val = rawDeptCd.length > 5 ? rawDeptCd.substring(0, 5) : rawDeptCd;

			var paramObj = {
				"coCd": $('#coCd_S').val() || "GUN",
				"yy": curYy,
				"deptCd_S": deptCd5Val,
				"deptNm_S": $('#deptNm_S').val() || "",
				"userId_S": $('#userId_S').val() || "",
				"userNm_S": $('#userNm_S').val() || "",
				"useYn_S": $('#useYn_S').val() || ""
			};

			postAjax("/user/pm/pm08/selectSubstituteVacationStatusList", paramObj, null, function(data) {
				if (data && data.result && data.result.length > 0) {
					renderTable(data.result);
				} else {
					$('#tableContainer').html('<div class="empty-state"><i class="fas fa-inbox"></i><p>조회 결과가 없습니다.</p></div>');
				}
			});
		}

		// 모든 시간/일수 값은 소숫점 이하 1자리까지 표시
		function fmt1(val) {
			var n = Number(val);
			if (isNaN(n)) return '0.0';
			return n.toFixed(1);
		}

		// 백엔드 LISTAGG 결과("일자:REQ_NO,일자:REQ_NO,...")를 호버/더블클릭 가능한 span으로 변환
		function renderDayCell(cellStr, kind, userId, userNm) {
			if (!cellStr) return '';
			var tokens = String(cellStr).split(',');
			var htmlParts = [];
			for (var t = 0; t < tokens.length; t++) {
				var pair = tokens[t].split(':');
				var day = pair[0];
				var reqNo = pair.length > 1 ? pair.slice(1).join(':') : '';
				if (!day) continue;
				htmlParts.push('<span class="day-token" data-kind="' + kind + '" data-reqno="' + reqNo + '" data-userid="' + (userId || '') + '" data-usernm="' + (userNm || '') + '">' + day + '</span>');
			}
			return htmlParts.join(', ');
		}

		// PM0711M01.html showVacationPopover() 톤앤매너 100% 계승 - 일자 호버 시 실시간 신청서 상세 팝오버
		var DAY_POPOVER_TIMER = null;
		var DAY_POPOVER_REQUEST_ID = 0; // 마우스를 빠르게 여러 일자로 옮길 때 늦게 도착한 이전 요청의 응답이 현재 팝업을 덮어쓰는 것을 막기 위한 순번
		var DAY_POPOVER_SHOW_TIMER = null; // 마우스 호버 후 0.3초 이상 머물렀을 때만 조회하기 위한 지연 타이머

		function cancelDayPopoverShow() {
			if (DAY_POPOVER_SHOW_TIMER) {
				clearTimeout(DAY_POPOVER_SHOW_TIMER);
				DAY_POPOVER_SHOW_TIMER = null;
			}
		}

		function showDayPopover($el) {
			if (DAY_POPOVER_TIMER) {
				clearTimeout(DAY_POPOVER_TIMER);
				DAY_POPOVER_TIMER = null;
			}

			var myRequestId = ++DAY_POPOVER_REQUEST_ID;

			if (!$el || $el.length === 0 || typeof $el.offset !== 'function') return;
			var offset = $el.offset();
			if (!offset || typeof offset.top === 'undefined') return;

			var kind = $el.data('kind');
			var reqNo = $el.data('reqno');
			var userId = $el.data('userid');
			var userNm = $el.data('usernm') || '사원';
			if (!reqNo) return;

			var $pop = $('#dayInfoPopover');
			if ($pop.length === 0) {
				$('body').append(
					'<div id="dayInfoPopover" class="vacation-info-popover">' +
						'<div class="popover-title"><i class="fas fa-calendar-check"></i> <span id="popDayUserNm"></span> 님의 신청서 이력</div>' +
						'<div id="popDayContent"></div>' +
					'</div>'
				);
				$pop = $('#dayInfoPopover');

				$pop.on('mouseenter', function() {
					if (DAY_POPOVER_TIMER) {
						clearTimeout(DAY_POPOVER_TIMER);
						DAY_POPOVER_TIMER = null;
					}
				}).on('mouseleave', function() {
					hideDayPopoverImmediately();
				});
			}

			$('#popDayUserNm').text(userNm);

			var elHeight = (typeof $el.outerHeight === 'function') ? $el.outerHeight() : 20;
			$pop.css({
				top: (offset.top + elHeight + 2) + 'px',
				left: Math.max(10, offset.left - 20) + 'px'
			}).show();
			$('#popDayContent').html('<div class="popover-item" style="color: #888888;"><i class="fas fa-spinner fa-spin"></i> 실시간 신청서 백엔드 조회 중...</div>');

			var coCd = $('#coCd_S').val() || 'GUN';

			if (kind === 'sw') {
				postAjax("/user/pm/pm08/selectSubstituteWorkDtl", { "coCd": coCd, "reqNo": reqNo }, null, function(data) {
					if (myRequestId !== DAY_POPOVER_REQUEST_ID) return;
					var dtl = (data && data.result) ? data.result : null;
					if (!dtl || Object.keys(dtl).length === 0) {
						$('#popDayContent').html('<div class="popover-item" style="color: #888888;">신청서 정보를 찾을 수 없습니다.</div>');
						return;
					}
					var dtText = dtl.holidayDt || '';
					var tmText = (dtl.stTm && dtl.edTm) ? (' (' + dtl.stTm + '~' + dtl.edTm + ')') : '';
					var reason = dtl.specialReason ? (' [' + $.trim(dtl.specialReason) + ']') : '';
					var htmlStr = '<div class="popover-item"><i class="fas fa-check-circle" style="color: #337ab7; margin-right: 5px;"></i> ' + dtText + tmText + ' 휴일대체근무' + reason + '</div>';
					$('#popDayContent').html(htmlStr);
				});
			} else if (kind === 'vac') {
				postAjax("/user/pm/pm07/selectVacationCalendarList", {
					"coCd": coCd,
					"reqId": userId,
					"userId": userId,
					"reqDtFrom": "19000101",
					"reqDtTo": "99991231",
					"stDt": "19000101",
					"edDt": "99991231"
				}, null, function(data) {
					if (myRequestId !== DAY_POPOVER_REQUEST_ID) return;
					var list = data.result || data.resultList || data.list || [];
					var htmlStr = '';
					$.each(list, function(i, row) {
						if (String(row.reqNo || row.req_no) !== String(reqNo)) return true;
						var vNm = cleanVacationTypeNm(row.vacTypeNm || row.vac_type_nm) || '대체휴가';
						var stDisp = row.stDt || row.st_dt || '';
						var edDisp = row.edDt || row.ed_dt || '';
						var dtText = formatVacationDateRange(stDisp, edDisp);
						var vDays = row.deductDays || row.deduct_days || row.vacDays || row.vac_days || '';
						var daysText = vDays ? (' (' + vDays + '일)') : '';
						var rmk = row.reqRmk || row.req_rmk || row.rmk || '';
						var rmkText = rmk ? (' [' + $.trim(rmk) + ']') : '';
						htmlStr += '<div class="popover-item"><i class="fas fa-check-circle" style="color: #337ab7; margin-right: 5px;"></i> ' + dtText + ' ' + vNm + daysText + rmkText + '</div>';
						return true;
					});
					if (!htmlStr) {
						htmlStr = '<div class="popover-item" style="color: #888888;">등록된 신청 이력이 없습니다.</div>';
					}
					$('#popDayContent').html(htmlStr);
				});
			}
		}

		function hideDayPopover() {
			cancelDayPopoverShow();
			if (DAY_POPOVER_TIMER) clearTimeout(DAY_POPOVER_TIMER);
			DAY_POPOVER_TIMER = setTimeout(function() {
				$('#dayInfoPopover').hide();
				DAY_POPOVER_TIMER = null;
			}, 300);
		}

		function hideDayPopoverImmediately() {
			cancelDayPopoverShow();
			if (DAY_POPOVER_TIMER) {
				clearTimeout(DAY_POPOVER_TIMER);
				DAY_POPOVER_TIMER = null;
			}
			$('#dayInfoPopover').hide();
		}

		$(document).off('mouseenter mouseleave', '#tableContainer .day-token').on({
			mouseenter: function() {
				var $el = $(this);
				cancelDayPopoverShow();
				DAY_POPOVER_SHOW_TIMER = setTimeout(function() {
					DAY_POPOVER_SHOW_TIMER = null;
					showDayPopover($el);
				}, 300);
			},
			mouseleave: function() {
				hideDayPopover();
			}
		}, '#tableContainer .day-token');

		// 대체근무일(sw)/대체휴가일(vac) 일자 더블클릭 시 해당 신청서 팝업 오픈
		function openReqDetailModal(kind, reqNo) {
			if (!reqNo) return;
			var coCd = $('#coCd_S').val() || 'GUN';
			var paramObj = {
				"actionType" : "U",
				"coCd"       : coCd,
				"userId"     : (typeof jwt !== "undefined" ? jwt.userId : ""),
				"userNm"     : (typeof jwt !== "undefined" ? jwt.userNm : ""),
				"reqNo"      : reqNo
			};
			if (kind === 'sw') {
				paramObj.pgmId = "PM0801P01";
				openModal("/static/html/user/pm/pm08/PM0801P01.html", 1100, 800, "", paramObj, function() {
					searchSubstVacationStatus();
				});
			} else if (kind === 'vac') {
				paramObj.pgmId = "PM0701P01";
				openModal("/static/html/user/pm/pm07/PM0701P01.html", 1100, 700, "", paramObj, function() {
					searchSubstVacationStatus();
				});
			}
		}

		$(document).off('dblclick', '#tableContainer .day-token').on('dblclick', '#tableContainer .day-token', function() {
			openReqDetailModal($(this).data('kind'), $(this).data('reqno'));
		});

		function renderTable(dataList) {
			if (!dataList || dataList.length === 0) {
				$('#tableContainer').html('<div class="empty-state"><i class="fas fa-inbox"></i><p>조회 결과가 없습니다.</p></div>');
				return;
			}

			var html = '<table class="subst-vac-table">';

			// 헤더 (단일 헤더 행 - rowspan 불필요)
			html += '<thead><tr>';
			html += '<th style="width: 35px;">번호</th>';
			html += '<th style="width: 55px;">성명</th>';
			html += '<th style="width: 55px;">직책</th>';
			html += '<th style="background-color: #ffffcc; width: 70px;">발생된<br>대체휴가</th>';
			html += '<th style="background-color: #ffffcc; width: 70px;">사용한<br>대체휴가</th>';
			html += '<th style="width: 70px;">남은<br>대체휴가</th>';
			html += '<th style="width: 70px;">항목</th>';
			for (var m = 0; m < monthNames.length; m++) {
				html += '<th>' + monthNames[m] + '</th>';
			}
			html += '<th>합계</th>';
			html += '</tr></thead>';

			html += '<tbody>';
			for (var i = 0; i < dataList.length; i++) {
				var row = dataList[i];
				var rowNum = i + 1;
				var grantDays = Number(row['grantDays']) || 0;
				var usedDays = Number(row['usedDays']) || 0;
				var balanceDays = grantDays - usedDays;

				// 연차휴가일 행
				html += '<tr>';
				html += '<td rowspan="5" class="fixed-col">' + rowNum + '</td>';
				html += '<td rowspan="5" class="fixed-col left">' + (row['userNm'] || '') + '</td>';
				html += '<td rowspan="5" class="fixed-col">' + (row['levelNm'] || '') + '</td>';
				html += '<td rowspan="5" class="grant-col" style="background-color: #ffffcc;"><strong>' + fmt1(grantDays) + '</strong></td>';
				html += '<td rowspan="5" class="used-col" style="background-color: #ffffcc;"><strong>' + fmt1(usedDays) + '</strong></td>';
				html += '<td rowspan="5" class="balance-col ' + (balanceDays > 0 ? 'highlight' : '') + '"><strong>' + fmt1(balanceDays) + '</strong></td>';
				html += '<td style="font-weight: 600;">연차휴가일</td>';
				var annSum = Number(row['annSum']) || 0;
				for (var m = 0; m < months.length; m++) {
					var annDayKey = 'annDay' + 'M' + months[m];
					html += '<td>' + renderDayCell(row[annDayKey], 'vac', row['userId'], row['userNm']) + '</td>';
				}
				html += '<td style="font-weight: 600;">' + (annSum > 0 ? fmt1(annSum) : '') + '</td>';
				html += '</tr>';

				// 대체근무일 행
				html += '<tr>';
				html += '<td style="font-weight: 600;">대체근무일</td>';
				for (var m = 0; m < months.length; m++) {
					var swKey = 'sw' + 'M' + months[m];
					html += '<td>' + renderDayCell(row[swKey], 'sw', row['userId'], row['userNm']) + '</td>';
				}
				html += '<td style="font-weight: 600;">' + (row['swSum'] || 0) + '</td>';
				html += '</tr>';

				// 대체휴가일 행
				html += '<tr>';
				html += '<td style="font-weight: 600;">대체휴가일</td>';
				for (var m = 0; m < months.length; m++) {
					var vacDayKey = 'vacDay' + 'M' + months[m];
					html += '<td>' + renderDayCell(row[vacDayKey], 'vac', row['userId'], row['userNm']) + '</td>';
				}
				html += '<td style="font-weight: 600;">' + (usedDays > 0 ? fmt1(usedDays) : '') + '</td>';
				html += '</tr>';

				// 월 근무시간 행
				html += '<tr>';
				html += '<td style="font-weight: 600;">월 근무시간<br>(정상+연장)</td>';
				for (var m = 0; m < months.length; m++) {
					var totKey = 'workTot' + 'M' + months[m];
					var otKey = 'workOt' + 'M' + months[m];
					var tot = Number(row[totKey]) || 0;
					var ot = Number(row[otKey]) || 0;
					var norm = tot - ot;
					var displayVal = (tot > 0) ? fmt1(tot) + '<br>(' + fmt1(norm) + '+' + fmt1(ot) + ')' : '';
					html += '<td>' + displayVal + '</td>';
				}
				html += '<td></td>';
				html += '</tr>';

				// 작업일보 집계시간 행
				html += '<tr>';
				html += '<td style="font-weight: 600;">작업일보<br>집계시간</td>';
				for (var m = 0; m < months.length; m++) {
					var rptKey = 'rptHour' + 'M' + months[m];
					var val = Number(row[rptKey]) || 0;
					var displayVal = val > 0 ? fmt1(val) : '';
					html += '<td>' + displayVal + '</td>';
				}
				html += '<td></td>';
				html += '</tr>';
			}

			html += '</tbody></table>';
			$('#tableContainer').html(html);
		}

		function excelDown() {
			alert('엑셀다운로드 기능은 준비 중입니다.');
		}

		function openReqUserTree(gbn) {
			var sfx = (gbn == 'S') ? '_S' : '';
			var paramObj = {
				"coCd": $('#coCd' + sfx).val() || "GUN",
				"userId": $('#userId' + sfx).val(),
				"userNm": $('#userNm' + sfx).val(),
				"useYn": "Y"
			};
			openModal("/static/html/cmn/modal/userSearch.html", 450, 650, "사원 검색", paramObj, function(tree) {
				var checkedId = tree.get_checked()[0];
				var checkedNode = tree.get_node(checkedId);
				if (!checkedNode || checkedNode.type != 'person') {
					alert("사원을 선택하세요.");
					return;
				}
				$('#userId' + sfx).val(checkedNode.id);
				$('#userNm' + sfx).val(checkedNode.text);
				if (gbn == 'S') searchSubstVacationStatus();
			});
		}

		function openReqDeptTree(gbn) {
			var sfx = (gbn == 'S') ? '_S' : '';
			var rawDeptId = $('#deptCd' + sfx).val() || '';
			var paramObj = {
				"coCd": $('#coCd' + sfx).val() || "GUN",
				"deptId": rawDeptId.length > 5 ? rawDeptId.substring(0, 5) : rawDeptId,
				"deptNm": $('#deptNm' + sfx).val(),
				"useYn": "Y"
			};
			openModal("/static/html/cmn/modal/deptSearch.html", 300, 500, "부서 검색", paramObj, function(tree) {
				var checkedId = tree.get_checked()[0];
				var checkedNode = tree.get_node(checkedId);
				var fullDeptId = (checkedNode && checkedNode.id) ? checkedNode.id : '';
				var deptId5 = fullDeptId.length > 5 ? fullDeptId.substring(0, 5) : fullDeptId;
				$('#deptCd' + sfx).val(deptId5);
				$('#deptNm' + sfx).val(checkedNode.text);
				if (gbn == 'S') searchSubstVacationStatus();
			});
		}
	</script>
</body>
</html>
