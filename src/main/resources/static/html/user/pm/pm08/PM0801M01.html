<script type="text/javascript">

	// 결재상태 신호등 포맷터 (표준 결재상태 코드 대응)
	ax5.ui.grid.formatter["sanctnStsFormatter"] = function () {
		var v = this.value;
		if (!v) return '-';
		var stsMap = {
			"REQ":      '<span style="color:#f0ad4e; font-size:12px;">●</span> 승인요청',
			"SANCTN02": '<span style="color:#f0ad4e; font-size:12px;">●</span> 승인요청',
			"ING":      '<span style="color:#5cb85c; font-size:12px;">●</span> 진행중',
			"SANCTN03": '<span style="color:#5cb85c; font-size:12px;">●</span> 진행중',
			"END":      '<span style="color:#337ab7; font-size:12px;">●</span> 완료',
			"SANCTN04": '<span style="color:#337ab7; font-size:12px;">●</span> 완료'
		};
		return stsMap[v] || v;
	};

	// 날짜 포맷터 (YYYYMMDD -> YYYY-MM-DD)
	ax5.ui.grid.formatter["formatDate"] = function () {
		var v = this.value;
		if (!v) return "";
		var s = String(v).replace(/\-/g, "");
		if (s.length < 8) return v;
		return s.substring(0, 4) + "-" + s.substring(4, 6) + "-" + s.substring(6, 8);
	};

	// 시각 포맷터 (HHMM -> HH:MM)
	ax5.ui.grid.formatter["formatTime"] = function () {
		var v = this.value;
		if (!v) return "";
		var s = String(v).replace(/:/g, "");
		if (s.length < 4) return v;
		return s.substring(0, 2) + ":" + s.substring(2, 4);
	};

	// 신청 총시간 화면 유동 계산 포맷터
	ax5.ui.grid.formatter["totalTmFormatter"] = function () {
		var st = this.item ? this.item.stTm : "";
		var ed = this.item ? this.item.edTm : "";
		if (!st || !ed) return this.value || "";
		var mSt = moment(st, ['HH:mm', 'HHmm'], true);
		var mEd = moment(ed, ['HH:mm', 'HHmm'], true);
		if (mSt.isValid() && mEd.isValid()) {
			var diffMin = mEd.diff(mSt, 'minutes');
			if (diffMin < 0) diffMin += 24 * 60;
			var hrs = (diffMin / 60).toFixed(1);
			return (hrs.indexOf('.0') > -1 ? parseInt(hrs, 10) : hrs) + " 시간";
		}
		return this.value || "";
	};

	// 실제 총시간 화면 유동 계산 포맷터
	ax5.ui.grid.formatter["realTotalTmFormatter"] = function () {
		var st = this.item ? this.item.realStTm : "";
		var ed = this.item ? this.item.realEdTm : "";
		if (!st || !ed) return this.value || "";
		var mSt = moment(st, ['HH:mm', 'HHmm'], true);
		var mEd = moment(ed, ['HH:mm', 'HHmm'], true);
		if (mSt.isValid() && mEd.isValid()) {
			var diffMin = mEd.diff(mSt, 'minutes');
			if (diffMin < 0) diffMin += 24 * 60;
			var hrs = (diffMin / 60).toFixed(1);
			return (hrs.indexOf('.0') > -1 ? parseInt(hrs, 10) : hrs) + " 시간";
		}
		return this.value || "";
	};

	// 기본 컬럼 정의 (사용자별 컬럼설정 병합 대상)
	var defaultColumns = [
		{key: "deptNm",      label: "부서",        width: 110, align: "left"}
		,{key: "reqNm",       label: "신청자",       width:  80, align: "center"}
		,{key: "reqStatus",   label: "신청상태",     width:  80, align: "left", formatter: "sanctnStsFormatter"}
		,{key: "resultStatus", label: "결과상태",    width:  80, align: "left", formatter: "sanctnStsFormatter"}
		,{key: "holidayDt",   label: "휴일근무일자", width:  90, align: "center", formatter: "formatDate"}
		,{key: "substituteDt", label: "대체휴무일",  width:  90, align: "center", formatter: "formatDate", hidden: true}
		,{key: "stTm",        label: "시작시간",     width:  70, align: "center", formatter: "formatTime"}
		,{key: "edTm",        label: "종료시간",     width:  70, align: "center", formatter: "formatTime"}
		,{key: "totalTm",     label: "총시간",       width:  75, align: "center", formatter: "totalTmFormatter"}
		,{key: "specialReason", label: "신청사유",   width: 150, align: "left"}
		,{key: "realStTm",    label: "실제시작시간", width:  70, align: "center", formatter: "formatTime"}
		,{key: "realEdTm",    label: "실제종료시간", width:  70, align: "center", formatter: "formatTime"}
		,{key: "realTotalTm", label: "실제총시간",   width:  75, align: "center", formatter: "realTotalTmFormatter"}
		,{key: "clntNm",      label: "고객사",       width: 120, align: "left"}
		,{key: "pjtNm",       label: "프로젝트",     width: 100, align: "left"}
		,{key: "creatDttm",   label: "등록일시",     width: 130, align: "center"}
		,{key: "reqNo",       label: "신청번호",     width: 120, align: "center"}
		,{key: "coCd",        label: "회사코드",     width:  80, align: "center", hidden: true}
		,{key: "deptId",      label: "부서코드",     width:  90, align: "center", hidden: true}
		,{key: "reqId",       label: "등록사번",     width:  70, align: "center", hidden: true}
		,{key: "salesCd",     label: "영업담당",     width: 120, align: "center", hidden: true}
	];

	// 동적 반응형 그리드 높이 조절 함수
	function adjustGridHeight() {
		var winHeight = $(window).height();
		var isIframe = (window.self !== window.top);
		if (isIframe) {
			try {
				if (window.top.innerHeight) winHeight = window.top.innerHeight;
			} catch (e) {
				winHeight = $(window).height();
			}
		}

		var $grid = $('[data-ax5grid="first-grid"]');
		if ($grid.length > 0) {
			var gridTop = $grid.offset().top || 200;
			var availableH = winHeight - gridTop - 20;
			if (availableH < 350) availableH = 350;
			$grid.css("height", availableH + "px");
		}

		if (gridView && gridView.target && gridView.target.align) {
			gridView.target.align();
		}
	}

	$(window).on("resize", function() {
		adjustGridHeight();
	});

	// 사용자별 컬럼 설정 팝업 호출
	function openGridColumnConfig() {
		GridColumnConfig.openEditor("PM0801M01", "first-grid", defaultColumns, function() {
			$('[data-ax5grid="first-grid"]').empty();
			gridView.initView().setData(0);
		});
	}

	var gridView = {
		initView : function() {
			adjustGridHeight();

			var cols = GridColumnConfig.apply("PM0801M01", "first-grid", defaultColumns);
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber : true,
				lineNumberColumnWidth : 40,
				showRowSelector : true,
				multipleSelect : false,
				sortable : true,
				target : $('[data-ax5grid="first-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						this.self.select(this.dindex);
					},
					onDBLClick : function() {
						openSubstituteWorkModal("U");
					}
				},
				page : {
					display : true,
					navigationItemCount : 10,
					height : 30,
					onChange : function() {
						gridView.setData(this.page.selectPage);
					}
				},
				columns : cols
			});
			return this;
		},
		setData : function(_pageNo) {
			var pageNo = _pageNo || 0;
			var formData = {
				 "coCd"       : "GUN"
				,"holidayDtFrom" : $('#holidayDtFrom_S').val().replace(/\-/g, '')
				,"holidayDtTo"   : $('#holidayDtTo_S').val().replace(/\-/g, '')
				,"reqStatus"  : $('#reqStatus_S').val()
				,"reqId"      : $('#reqId_S').val()
				,"reqNm"      : $('#reqIdNm_S').val()
				,"deptId"     : $('#reqDeptId_S').val()
				,"deptNm"     : $('#reqDeptNm_S').val()
				,"pageNum"    : pageNo + 1
				,"pageSize"   : 100
			};
			postAjax("/user/pm/pm08/selectSubstituteWorkList", formData, null, function(data) {
				try {
					gridView.target.setData({
						list : data.result,
						page : {
							currentPage   : pageNo,
							pageSize      : data.paginationInfo.pageSize,
							totalElements : data.paginationInfo.totalRecordCount,
							totalPages    : data.paginationInfo.totalPageCount
						}
					});
				} catch (error) {
					alert("오류 발생!! 전산실 연락 바랍니다");
					return null;
				}
			});
		}
	};

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("생산관리", "휴일대체근무");

		$('#coCd_S').val("GUN");
		// 처음 화면 로딩 시 로그인한 본인 아이디 기본 설정 (본인 데이터 우선 조회)
		$('#reqId_S').val(jwt.userId);
		$('#reqIdNm_S').val(jwt.userNm);

		// 시작일/종료일 셋팅 (3개월 전 1일 ~ 당월 말일)
		$('#holidayDtFrom_S').val(moment().subtract(3, 'months').startOf('month').format("YYYY-MM-DD"));
		$('#holidayDtTo_S').val(moment().endOf('month').format("YYYY-MM-DD"));

		// 날짜 범위 선택기
		$('#holidayDtFrom_S, #holidayDtTo_S').on('click', function(){
			DateRangePicker.open({
				startDt: $('#holidayDtFrom_S').val() || null,
				endDt:   $('#holidayDtTo_S').val()   || null,
				excludeSelectors: ['#holidayDtFrom_S', '#holidayDtTo_S'],
				onApply: function(sd, ed){
					$('#holidayDtFrom_S').val(sd);
					$('#holidayDtTo_S').val(ed);
					gridView.setData(0);
				}
			});
		});

		gridView.initView().setData(0);

		authChk("PM0801M01");
	});

	// 검색 버튼
	function DataSearch() {
		gridView.setData(0);
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$('#coCd_S').val("GUN");
		$('#reqStatus_S').val("");
		$('#holidayDtFrom_S').val(moment().subtract(3, 'months').startOf('month').format("YYYY-MM-DD"));
		$('#holidayDtTo_S').val(moment().endOf('month').format("YYYY-MM-DD"));
		gridView.setData(0);
	}

	// 엑셀 다운로드
	function excelDown() {
		var targetObj = gridView.target;
		if (targetObj.list.length == 0) {
			alert("출력할 목록이 없습니다.");
			return;
		}
		targetObj.exportExcel("휴일대체근무_" + moment().format("YYYYMMDD") + ".xls");
	}

	// 선택 행 취득
	function getSelectedRow() {
		var list = gridView.target.getList("selected");
		if (!list || list.length < 1) {
			alert("대상 자료를 선택하세요.");
			return null;
		}
		return list[0];
	}

	// 신청 등록 / 수정 모달
	function openSubstituteWorkModal(_actionType, targetRow, _openStage) {
		var actionType = (_actionType == "U") ? "U" : "C";
		var paramObj = {
			 "actionType" : actionType
			,"openStage"  : _openStage || ""
			,"coCd"       : "GUN"
			,"userId"     : jwt.userId
			,"userNm"     : jwt.userNm
			,"pgmId"      : "PM0801P01"
		};

		if (actionType == "U") {
			var row = targetRow || getSelectedRow();
			if (!row) return;

			$.each(row, function(key, val) {
				paramObj[key] = (typeof(val) == "undefined") ? "" : val;
			});
			paramObj.coCd = "GUN";
			if (_openStage) paramObj.openStage = _openStage;
		}

		openModal("/static/html/user/pm/pm08/PM0801P01.html", 1100, 800, "", paramObj, function(data) {
			gridView.setData(0);
		});
	}

	// 결과 등록 (목록에서 신청서 선택 후 결과등록 클릭)
	function openResultModal() {
		var selectedRows = gridView.target.getList("selected");
		var row = (selectedRows && selectedRows.length > 0) ? selectedRows[0] : null;
		if (!row && gridView.target.focusedRow !== undefined && gridView.target.focusedRow !== null && gridView.target.focusedRow > -1) {
			row = gridView.target.list[gridView.target.focusedRow];
		}

		if (!row || !row.reqNo) {
			alert("근무결과를 등록할 신청건을 먼저 목록에서 선택해 주세요.");
			return;
		}

		// 수정 및 근무결과 작성 전용 모드로 팝업 호출
		openSubstituteWorkModal("U", row, "RESULT");
	}

	// 삭제
	function deleteSubstituteWork() {
		var row = getSelectedRow();
		if (!row) return;

		if (!confirm("삭제하시겠습니까?")) return;

		var formData = {
			 "coCd"   : "GUN"
			,"reqNo"  : row.reqNo
			,"userId" : jwt.userId
			,"pgmId"  : "PM0801M01"
		};
		putAjax("/user/pm/pm08/deleteSubstituteWork", formData, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode == 200) {
				gridView.setData(0);
			}
		});
	}

	// 신청자(사원) 검색
	function openReqUserTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"userId" : $('#reqId' + sfx).val()
			,"userNm" : $('#reqIdNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "신청자 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			if (!checkedNode || checkedNode.type != 'person') {
				alert("사원을 선택하세요.");
				return;
			}
			$('#reqId' + sfx).val(checkedNode.id);
			$('#reqIdNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}

	// 부서 검색
	function openReqDeptTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"deptId" : $('#reqDeptId' + sfx).val()
			,"deptNm" : $('#reqDeptNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/deptSearch.html", 300, 500, "부서 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#reqDeptId' + sfx).val(checkedNode.id);
			$('#reqDeptNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}

</script>
