<div id="timeSelectPopup" style="display:none; position:fixed; z-index:999999; background:#fff; border:1px solid #c2c2c2; padding:15px; box-shadow:0 4px 15px rgba(0,0,0,0.2); border-radius:6px; width:280px;">

<script type="text/javascript">

	var editInitialSnapshot = null;

	// 그리드 동적 높이 조절 (내부 데이터 행 수만큼 유동성 조절 - 안전 탐색 지원)
	function gridResize(gridObj, size) {
		if (!gridObj || !gridObj.target) return;

		var gridName = '';
		if (gridObj.target.$target && gridObj.target.$target.get(0)) {
			gridName = gridObj.target.$target.attr('data-ax5grid') || '';
		} else if (gridObj.target.config && gridObj.target.config.target) {
			gridName = $(gridObj.target.config.target).attr('data-ax5grid') || '';
		}

		var count = (size !== undefined && size !== null) ? Number(size) : (gridObj.target.getList ? gridObj.target.getList().length : 0);

		var tagHeight = 65;
		if (gridName === 'projectGrid') {
			tagHeight = (count === 0) ? 65 : (count * 27) + 38;
			tagHeight = Math.max(65, Math.min(tagHeight, 350));
		} else if (gridName === 'approvalGridReq' || gridName === 'approvalGridResult' || gridName === 'approvalGrid') {
			tagHeight = (count === 0) ? 90 : (count * 26) + 60;
			tagHeight = Math.max(90, Math.min(tagHeight, 260));
		} else {
			tagHeight = (count * 27) + 38;
			tagHeight = Math.max(65, Math.min(tagHeight, 350));
		}

		if (gridObj.target.setHeight) {
			gridObj.target.setHeight(tagHeight);
		}
		if (gridName) {
			$('[data-ax5grid="' + gridName + '"]').css('height', tagHeight + 'px');
		}
	}

	// 시간 포맷팅 (HH:MM)
	function formatTime(timeStr) {
		if (!timeStr) return "";
		var s = String(timeStr).replace(/[^0-9]/g, '');
		if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);
		return timeStr;
	}

	// 시간 계산 (HH:MM 형식에서 경과시간 계산, 결과: "H시간 M분")
	function calcDuration(stTmStr, edTmStr) {
		if (!stTmStr || !edTmStr) return "";
		try {
			var stParts = String(stTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			var edParts = String(edTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			if (!stParts || !edParts) return "";
			var stMin = parseInt(stParts[1], 10) * 60 + parseInt(stParts[2], 10);
			var edMin = parseInt(edParts[1], 10) * 60 + parseInt(edParts[2], 10);
			if (edMin < stMin) edMin += 24 * 60; // 자정 넘김
			var diffMin = edMin - stMin;
			var hrs = Math.floor(diffMin / 60);
			var mins = diffMin % 60;
			if (hrs === 0 && mins === 0) return "";
			return (hrs > 0 ? hrs + "시간 " : "") + (mins > 0 ? mins + "분" : "").trim();
		} catch (e) {
			console.error(e);
			return "";
		}
	}

	// 휴일 여부 판정 함수 (토/일 또는 회사공휴일)
	function isHolidayDate(dtStr) {
		if (!dtStr || dtStr.length < 10) return false;
		try {
			var parts = dtStr.split('-');
			if (parts.length === 3) {
				var y = parseInt(parts[0], 10);
				var m = parseInt(parts[1], 10) - 1;
				var d = parseInt(parts[2], 10);
				var dt = new Date(y, m, d);
				var day = dt.getDay();
				if (day === 0 || day === 6) return true; // 주말(토/일)

				if (typeof yearHolidayTable === 'function') {
					var yearHolidays = yearHolidayTable(y) || [];
					var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
					for (var i = 0; i < yearHolidays.length; i++) {
						if (yearHolidays[i] === targetStr) {
							return true; // 공휴일
						}
					}
				}
			}
		} catch (e) {
			console.error(e);
		}
		return false;
	}

	// 휴일근무일자 변경 이벤트 (반드시 휴일이어야 함 — PM07과 반대)
	function onHolidayDtChanged() {
		var dtStr = $('#holidayDt').val();
		if (!dtStr) {
			$('#holidayCheckWarningRow').hide();
			$('#holidayCheckWarning').text('');
			return;
		}

		// PM08: 휴일이 *아니면* 경고 (PM07은 반대)
		if (!isHolidayDate(dtStr)) {
			var msg = '⚠ 선택하신 날짜(' + dtStr + ')는 휴무일(주말/공휴일)이 아닙니다. 휴일대체근무는 토/일요일 또는 공휴일에만 신청 가능합니다.';
			$('#holidayCheckWarning').text(msg);
			$('#holidayCheckWarningRow').show();
		} else {
			$('#holidayCheckWarningRow').hide();
			$('#holidayCheckWarning').text('');
		}
	}

	// 대체휴무일 변경 이벤트 (평일이어야 함)
	function onSubstituteDtChanged() {
		var dtStr = $('#substituteDt').val();
		if (!dtStr) {
			return;
		}

		// 대체휴무일은 평일이어야 함 (휴일이면 경고)
		if (isHolidayDate(dtStr)) {
			alert('대체휴무일(' + dtStr + ')은 평일(근무일)이어야 합니다.');
			$('#substituteDt').val('');
		}
	}

	// 시간 입력 변경 이벤트 (시작/종료 시간 → 총시간 자동계산)
	function onTimeChanged() {
		var stTm = $('#stTm').val();
		var edTm = $('#edTm').val();
		if (stTm && edTm) {
			$('#totalTm').val(calcDuration(stTm, edTm));
		} else {
			$('#totalTm').val('');
		}
	}

	// 실제 시간 입력 변경 이벤트 (실제 시작/종료 → 실제 총시간 자동계산)
	function onRealTimeChanged() {
		var realStTm = $('#realStTm').val();
		var realEdTm = $('#realEdTm').val();
		if (realStTm && realEdTm) {
			$('#realTotalTm').val(calcDuration(realStTm, realEdTm));
		} else {
			$('#realTotalTm').val('');
		}
	}

	// 작업 프로젝트 그리드
	var projectGridView = null;

	// 프로젝트 행 추가
	function addProjectRow() {
		var paramObj = { "coCd": jwt.coCd };
		openSecondModal("/static/html/cmn/modal/wbsSalesCodeSearch.html", 1200, 700, "SALES CODE 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			if (!row) return;
			var eqpNmVal = row.eqpNm || row.eqpNmS || '';
			if (!eqpNmVal && row.salesCd) {
				postAjaxSync("/user/wb/wb26/selectSalesCodeInfo", { "coCd": jwt.coCd, "salesCd": row.salesCd }, null, function(sData) {
					if (sData && sData.result && sData.result.eqpNm) {
						eqpNmVal = sData.result.eqpNm;
					}
				});
			}
			projectGridView.target.addRow({
				ordrsNo: row.ordrsNo || '',
				salesCd: row.salesCd || '',
				coCd: row.coCd || '',
				pjtCd: row.clntPjt || '',
				pjtNm: row.clntPjtNm || row.pjtNm || '',
				eqpNm: eqpNmVal,
				clntCd: row.ordrsClntCd || row.clntCd || '',
				clntNm: row.ordrsClntNm || row.clntNm || '',
				etc: ''
			}, "last");
			if (typeof gridResize === 'function') {
				gridResize(projectGridView, projectGridView.target.getList().length);
			}

	// 결재자/공유자 선택 삭제
	function deleteShareUser(targetType) {
		targetType = targetType || 'REQ';
		var targetView = (targetType === 'RESULT') ? approvalGridViewResult : approvalGridViewReq;
		var gridTarget = targetView.target;
		if (!gridTarget || !gridTarget.list) return;

		var deleteIndexes = [];
		var selectedList = gridTarget.getList("selected");
		if (selectedList && selectedList.length > 0) {
			$.each(selectedList, function(i, item) {
				var idx = gridTarget.list.indexOf(item);
				if (idx > -1 && deleteIndexes.indexOf(idx) < 0) {
					deleteIndexes.push(idx);
				}
			});
		}

		var selMap = gridTarget.selectedDataIndexs;
		if (selMap) {
			if (Array.isArray(selMap)) {
				$.each(selMap, function(i, idxVal) {
					var idx = parseInt(idxVal, 10);
					if (!isNaN(idx) && idx > -1 && deleteIndexes.indexOf(idx) < 0) {
						deleteIndexes.push(idx);
					}
				});
			} else if (typeof selMap === 'object') {
				for (var k in selMap) {
					if (selMap[k]) {
						var idx = parseInt(k, 10);
						if (!isNaN(idx) && idx > -1 && deleteIndexes.indexOf(idx) < 0) {
							deleteIndexes.push(idx);
						}
					}
				}
			}
		}

		if (deleteIndexes.length === 0 && gridTarget.focusedRow !== undefined && gridTarget.focusedRow !== null) {
			var fIdx = parseInt(gridTarget.focusedRow, 10);
			if (!isNaN(fIdx) && fIdx > -1 && deleteIndexes.indexOf(fIdx) < 0) {
				deleteIndexes.push(fIdx);
			}
		}

		if (deleteIndexes.length === 0) {
			alert("삭제할 결재자 또는 공유자 행을 선택하세요.");
			return;
		}

		var hasApproved = false;
		$.each(deleteIndexes, function(i, idx) {
			var item = gridTarget.list[idx];
			if (item && (item.sanctnSttus === 'Y' || (item.todoCfDt && item.todoCfDt.trim().length > 0))) {
				hasApproved = true;
				return false;
			}
		});

		if (hasApproved) {
			alert("이미 승인(확인) 완료된 결재자는 삭제할 수 없습니다.");
			return;
		}

		deleteIndexes.sort(function(a, b) { return b - a; });
		$.each(deleteIndexes, function(i, idx) {
			gridTarget.removeRow(idx);
		});

		if (typeof $.gridNoSet === 'function') {
			$.gridNoSet(targetView, "sanctnSn");
		}

		var listLen = gridTarget.getList ? gridTarget.getList().length : gridTarget.list.length;
		gridResize(targetView, listLen);
	}

		var reqId = $('#popForm').find('#reqId').val() || jwt.userId;

			if (addedIds[key]) return;

			autoList.push({

				todoId: u.id,

		postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": reqId }, null, function(data) {

					pushApprover(data.result);

	// 기존 결재선 로드 (신청 결재선 vs 결과 결재선 구분 분리, 결재/공유 모두 포함)
	function loadApprovalLine(reqNo) {
		if (!reqNo || $.trim(reqNo) === '') {
			setDefaultResultApprovalLine();
			return;
		}

		var reqRows = [];
		var resultRows = [];

		var divList = [
			{ cd: "TODODIV2410", gb: "결재", target: "REQ" },
			{ cd: "TODODIV1410", gb: "공유", target: "REQ" },
			{ cd: "TODODIV2420", gb: "결재", target: "RESULT" },
			{ cd: "TODODIV1420", gb: "공유", target: "RESULT" }
		];

		$.each(divList, function(i, div) {
			postAjaxSync("/user/wb/wb20/selectGetApprovalList",
				{ "todoNo": reqNo, "todoDiv2CodeId": div.cd }, null, function(data) {
					$.each(data.resultList || [], function(idx, r) {
						var item = {
							gb            : div.gb,
							sanctnSn      : Number(r.sanctnSn || 0),
							coCd          : r.coCd || "GUN",
							usrNm         : r.todoId,
							empNo         : r.empNo || r.todoId,
							name          : r.todoNm || r.name,
							jik           : r.jik,
							reqDate       : r.reqDate || r.creatDttm || "",
							todoCfDt      : r.todoCfDt || "",
							todoCfOpn     : r.todoCfOpn || "",
							dtNm          : r.dtNm,
							todoId        : r.todoId,
							todoKey       : r.todoKey || "",
							flag          : r.flag || "",
							sanctnSttusNm : r.sanctnSttusNm
						};

						if (div.target === "REQ") {
							reqRows.push(item);
						} else if (div.target === "RESULT") {
							resultRows.push(item);
						}
					});
				});
		});

		// 정렬: gb (결재 우선) -> sanctnSn (순번)
		var gbOrder = { "결재": 0, "공유": 1 };
		reqRows.sort(function(a, b) {
			var gbDiff = (gbOrder[a.gb] || 0) - (gbOrder[b.gb] || 0);
			if (gbDiff !== 0) return gbDiff;
			return a.sanctnSn - b.sanctnSn;

	// to-do결재요청 알림톡
	function commKaKaoSendTodo(param) {
		var maxMessageId = null;
		var talkMessage = null;
		var mobile = null;
		var todoDiv2CodeNm = null;
		var sendList = [];
		let talkParam = {};
		let talkBody = {};
		let sendCnt = 0;
		postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function(data) {
			if(data.resultList.length > 0 ) {
				if( data.resultList[0].maxMessageId != "" ) {
					sendList = data.resultList;
				} else {
					alert("알림톡 발송을 위한 messageId 생성에 실패 했습니다.");
					return;
				}
			}
		});

		$.each(sendList, function (key, sendObj) {
			maxMessageId = sendObj.maxMessageId;
			talkMessage = sendObj.messageDesc;
			mobile =  sendObj.telNo;
			param.rcvId = sendObj.todoId;
			param.rcvNm = sendObj.name;
			param.nameTo = sendObj.name;
			todoDiv2CodeNm = sendObj.todoTitl;
			param.todoDiv2CodeNm = todoDiv2CodeNm;
			param.sendDt = sendObj.sendDt;

			if(mobile == "" || mobile == null) {
				alert('수신전화번호가 없습니다.');
				return;
			}
			// customMessage(화면에서 직접 조립한 본문)가 있으면 DB 템플릿(TB_BM17M01) 내용 유무와
			// 무관하게 그 내용을 사용한다. PM5101P01.html의 동일 패턴 참고.
			if((talkMessage == "" || talkMessage == null) && !param.customMessage) {
				alert('발송할 내용이 없습니다.');
				return;
			}

			let message = param.customMessage ? param.customMessage : talkMessage;
			let splitStr = Array.from(message.matchAll('\\{(.*?)\\}'), match => `${match[0]}`);
			$.each(splitStr, function (key, val) {
				let compKey = val.substring(1, val.length-1);
				if( compKey != "" && compKey != "undefined" ) {
					if( typeof(param[compKey]) != "undefined" ) {
						let val2 = '#'+val;
						message = message.replaceAll(val2, param[compKey]);
					}
				}
			});

			talkParam.authToken = "e/eDfZOFCsrBqadaECQ0+g==";
			talkParam.serverName = "gyitt2400";
			talkParam.paymentType = "P";
			talkBody.service = "2310086157";
			talkBody.messageId = maxMessageId;
			talkBody.title = param.title;
			talkBody.message = message;
			talkBody.mobile = mobile;
			talkBody.template = "10003";
			let talkJson = JSON.stringify(talkBody);
			if (typeof jwt !== 'undefined' && jwt.kakaoSend) {
				sendCnt = kakaoSendReal(talkJson, talkParam, param);
			}
		});

		if( sendCnt > 0 ) {
			kakaoCnt++;
		}
	}

	// HH:MM 시간 차이(총시간) 계산 헬퍼
	function calcDuration(st, ed) {
		var mSt = moment(st, ['HH:mm', 'HHmm'], true);
		var mEd = moment(ed, ['HH:mm', 'HHmm'], true);
		if (mSt.isValid() && mEd.isValid()) {
			var diffMin = mEd.diff(mSt, 'minutes');
			if (diffMin < 0) diffMin += 24 * 60;
			var hrs = (diffMin / 60).toFixed(1);
			return (hrs.indexOf('.0') > -1 ? parseInt(hrs, 10) : hrs) + " 시간";
		}
		return "";
	}

	var _mx = 0, _my = 0;
	$(document).off('mousemove.timePopPos').on('mousemove.timePopPos', function(e) {
		_mx = e.clientX || (e.pageX - $(window).scrollLeft());
		_my = e.clientY || (e.pageY - $(window).scrollTop());
	});

	// 시작~종료 시간 선택 미니 팝업 (클릭한 인풋박스 좌측 하단에 100% 밀착 표출)
	var activeTimeCallback = null;
	function openTimeSelectPopup(stId, edId, callback, targetInputEl) {
		var curSt = $(stId).val() || '08:30';
		var curEd = $(edId).val() || '17:30';
		var stParts = curSt.split(':');
		var edParts = curEd.split(':');

		$('#popStartHour').val(stParts[0] || '08');
		$('#popStartMin').val(stParts[1] || '00');
		$('#popEndHour').val(edParts[0] || '17');
		$('#popEndMin').val(edParts[1] || '00');

		activeTimeCallback = function(startTime, endTime) {
			$(stId).val(startTime);
			$(edId).val(endTime);
			if (typeof callback === 'function') callback();
		};

		var $pop = $('#timeSelectPopup');
		if ($pop.parent()[0] !== document.body) {
			$('body').append($pop);
		}
		$pop.show();

		var popW = $pop.outerWidth() || 280;
		var popH = $pop.outerHeight() || 180;
		var winW = $(window).width();
		var winH = $(window).height();

		// 클릭한 실제 대상 인풋박스 DOM 추출
		var clickEl = targetInputEl || $(stId)[0];
		if (!clickEl || !$(clickEl).is(':visible')) clickEl = $(stId)[0];

		var rect = (clickEl && typeof clickEl.getBoundingClientRect === 'function') ? clickEl.getBoundingClientRect() : null;

		var leftPos = rect ? rect.left : _mx;
		var topPos = rect ? (rect.bottom + 2) : (_my + 10);

		// 화면 바깥 우측/하단 이탈 방지 보정
		if (leftPos + popW > winW - 10) {
			leftPos = winW - popW - 10;
		}
		if (leftPos < 10) leftPos = 10;

		if (topPos + popH > winH - 10 && rect) {
			topPos = rect.top - popH - 4;
		}
		if (topPos < 10) topPos = 10;

		$pop.css({
			position: 'fixed',
			left: leftPos + 'px',
			top: topPos + 'px',
			zIndex: 999999
		});
	}

	// ===== 화면 진입 모드 (6종) =====
	// 1.CREATE(신규등록) 2.EDIT(신청서 수정모드) 3.REQ_APPROVAL(신청서결재모드, 읽기전용)
	// 4.RESULT_CREATE(결과등록모드) 5.RESULT_EDIT(결과수정모드) 6.RESULT_APPROVAL(결과결재모드, 읽기전용)
	// 신청서 영역과 결과 영역은 각각 독립적으로 모드가 결정된다(예: 신청서는 REQ_APPROVAL로 잠기고
	// 결과는 RESULT_CREATE로 입력 가능한 상태가 동시에 존재할 수 있음).
	var SCREEN_MODE = {
		CREATE          : 'CREATE',
		EDIT            : 'EDIT',
		REQ_APPROVAL    : 'REQ_APPROVAL',
		RESULT_CREATE   : 'RESULT_CREATE',
		RESULT_EDIT     : 'RESULT_EDIT',
		RESULT_APPROVAL : 'RESULT_APPROVAL'
	};

	// REQ_STATUS/RESULT_STATUS는 REQ(신청됨, 본인/자동승인만 진행)/ING(결재 진행중)/END(결재완료)
	// 3가지만 사용한다. NULL은 "자료없음"(결재선 미등록)을 뜻하며 REQ와 동일하게 편집 가능하다.
	// TEMP/RTN 상태값은 더 이상 쓰지 않는다.

	// 신청서 영역 모드 판정: REQ_STATUS가 NULL(자료없음) 또는 REQ(본인·자동승인만 진행, 실제 결재자
	// 미확인)이면 계속 수정 가능(EDIT). ING(실제 결재자 확인 진행중)/END(완료)이면 읽기전용(REQ_APPROVAL).
	function getReqAreaMode(actionType, dtlData) {
		var hasReq = !!(dtlData.reqNo || $('#reqNo').val());
		if (actionType === 'C' && !hasReq) return SCREEN_MODE.CREATE;
		var reqStatus = dtlData.reqStatus;
		if (!reqStatus || reqStatus === 'REQ') return SCREEN_MODE.EDIT;
		return SCREEN_MODE.REQ_APPROVAL;
	}

	// 결과 영역 모드 판정: 신청서와 동일한 상태규칙(RESULT_STATUS NULL(자료없음)/REQ=편집가능,
	// ING/END=읽기전용)을 적용하되, 편집 가능한 경우에도 실제 결과 데이터가 한 번이라도
	// 입력된 적 있는지로 최초입력(RESULT_CREATE)과 재수정(RESULT_EDIT)을 구분한다.
	function getResultAreaMode(dtlData) {
		var resultStatus = dtlData.resultStatus;
		if (resultStatus === 'ING' || resultStatus === 'END') return SCREEN_MODE.RESULT_APPROVAL;
		var hasResultData = !!(dtlData.realStTm || dtlData.realEdTm || dtlData.workResult);
		return hasResultData ? SCREEN_MODE.RESULT_EDIT : SCREEN_MODE.RESULT_CREATE;
	}

	// 유효한 근무결과 등록 여부 정밀 판단 헬퍼 (00:00, 0000, 빈값은 미입력 취급)
	function checkHasRealResult(dtlData) {
		dtlData = dtlData || {};
		var isValidTm = function(tm) {
			if (!tm) return false;
			var s = String(tm).replace(/[^0-9]/g, '');
			return s.length > 0 && s !== '0000';
		};
		return isValidTm(dtlData.realStTm) || isValidTm(dtlData.realEdTm)
			|| !!(dtlData.workResult && $.trim(dtlData.workResult) !== '')
			|| !!(dtlData.resultStatus);
	}

	// 팝업 전달 파라미터 안전 추출 헬퍼
	function getModalParamObj() {
		if (typeof modalStack !== 'undefined' && modalStack && typeof modalStack.last === 'function' && modalStack.last() && modalStack.last().paramObj) {
			return modalStack.last().paramObj;
		} else if (typeof window.paramObj !== 'undefined' && window.paramObj) {
			return window.paramObj;
		}
		return {};
	}

	// 상태별 화면 및 권한 제어 (신청등록 시 결과 영역 숨김, 결과 작성 시 신청서 영역 수정 금지)
	function applyApprStatusPolicy(dtlData) {
		dtlData = dtlData || {};
		var actionType = $('#actionType').val() || 'C';
		var hasReq = !!(dtlData.reqNo || $('#reqNo').val());
		var hasResult = checkHasRealResult(dtlData);
		var pObj = getModalParamObj();
		var openStage = (pObj && pObj.openStage) ? pObj.openStage : ($('#popForm').find('#openStage').val() || '');

		var currentUserId = (typeof jwt !== 'undefined' && jwt.userId) ? jwt.userId : "";
		var reqUserId = dtlData.reqId || $('#popForm').find('#reqId').val() || "";
		var isWriter = (!reqUserId || reqUserId === currentUserId);

		if (actionType === 'C' && !hasReq) {
			// [1. 신규 신청서 작성 모드]
			$('#secResult').hide();
			$('#secReq').show();

			$('#secReq').find('input, select, textarea').prop('disabled', false).css({'background': '', 'pointer-events': ''});
			$('#reqTitl, #reqDeptDisplay, #totalTm').prop('readonly', true).css('background', '#fafafa !important');
			$('#secReq').find('.input_calendar').css({'cursor': 'pointer', 'pointer-events': ''});
			bindHolidayDatePicker();
			$('#btnProjectArea, #btnReqApprovalArea').show();

			$('#btnSubmitApproval').text('신청결재 상신').show();
			$('#btnSubmitResult, #btnDelete').hide();
		} else if (openStage === 'RESULT' || (hasResult && openStage !== 'REQ')) {
			// [2. 목록에서 [결과등록] 버튼 클릭 또는 근무결과가 이미 등록된 상태]
			$('#secResult').show();

			// 신청서 영역 전체 수정 금지 (Read-Only / Pointer Events None)
			$('#secReq').find('input, select, textarea, button, a').prop('disabled', true).attr('readonly', true).css({'background': '#fafafa !important', 'pointer-events': 'none'});
			$('#secReq').find('.input_calendar').off('click').css({'cursor': 'default', 'pointer-events': 'none'});
			$('#btnProjectArea, #btnReqApprovalArea, #btnSubmitApproval').hide();

			var resultStatus = dtlData.resultStatus;
			var isResultEditable = (!resultStatus || resultStatus === 'REQ');

			if (!isResultEditable) {
				// 결과 결재 진행 중(ING) 또는 완료(END) 시 읽기 전용
				$('#secResult').find('input, select, textarea').prop('disabled', true).css('background', '#fafafa !important');
				$('#btnResultApprovalArea, #btnSubmitResult, #btnDelete').hide();
			} else {
				// 결과 작성/수정 가능 모드
				$('#secResult').find('input, select, textarea').prop('disabled', false).css('background', '');
				$('#realTotalTm').prop('readonly', true).css('background', '#fafafa !important');
				$('#btnResultApprovalArea').show();

				var isFirstResult = !hasResult;
				$('#btnSubmitResult').text(isFirstResult ? '결과결재 상신' : '결과수정').show();
				$('#btnDelete').text('결과삭제').toggle(!isFirstResult);
			}
		} else {
			// [3. 결과 없이 신청서만 등록된 상태 (더블클릭 상세/수정)]
			$('#secResult').hide();
			$('#secReq').show();

			var reqStatus = dtlData.reqStatus;
			var isReqEditable = (!reqStatus || reqStatus === 'REQ');

			$('#secReq').find('input, select, textarea').prop('disabled', !isReqEditable).css('background', isReqEditable ? '' : '#fafafa !important');
			if (isReqEditable) {
				$('#secReq').find('.input_calendar').css({'cursor': 'pointer', 'pointer-events': ''});
				bindHolidayDatePicker();
			} else {
				$('#secReq').find('.input_calendar').off('click').css({'cursor': 'default', 'pointer-events': 'none'});
			}
			$('#reqTitl, #reqDeptDisplay, #totalTm').prop('readonly', true).css('background', '#fafafa !important');
			$('#btnProjectArea, #btnReqApprovalArea').toggle(isReqEditable);

			$('#btnSubmitApproval').text('신청서수정').toggle(isReqEditable);
			$('#btnDelete').text('삭 제').toggle(isReqEditable);
			$('#btnSubmitResult').hide();
		}

		// 1) 결재접근 모드(actionType === 'A' || 'V')이거나 2) 작성자 본인이 아닌 경우:
		// 수정, 상신, 삭제 버튼 100% 숨김 및 폼 전체 읽기전용 처리
		var isApprovalMode = (actionType === 'A' || actionType === 'V');
		if (isApprovalMode || !isWriter) {
			$('#btnSubmitApproval, #btnSubmitResult, #btnDelete').hide();
			$('#btnProjectArea, #btnReqApprovalArea, #btnResultApprovalArea').hide();
			$('#secReq, #secResult').find('input, select, textarea').prop('disabled', true).css('background', '#fafafa !important');
			$('#secReq, #secResult').find('.input_calendar').off('click').css({'cursor': 'default', 'pointer-events': 'none'});
		}
	}

	// 근무일자 단일 데이트 피커 바인딩 헬퍼 (PM0101P01.html 작성일자 데이트피커 방식 100% 이식)
	function bindHolidayDatePicker() {
		try { $('#holidayDt').datepicker('destroy'); } catch(e){}

		if ($('#holidayDt').is(':disabled') || $('#holidayDt').prop('readonly') || $('#holidayDt').css('pointer-events') === 'none') {
			$('#holidayDt').attr('readonly', true).css({'background-color': '#fafafa', 'pointer-events': 'none'});
			return;
		}

		$('#holidayDt').datepicker({
			format : "yyyy-mm-dd",
			language : "ko",
			autoclose : true
		}).off('changeDate').on('changeDate', function() {
			onHolidayDtChanged();
		});
	}

	// 팝업 타이틀 동적 부여 헬퍼 (맨 뒤에 [신청등록], [결과등록], [신청수정], [결과수정], [신청상세], [결과상세], [신청결재], [결과결재] 표기)
	function updatePopupTitle(actionType, dtlData) {
		dtlData = dtlData || {};
		var pObj = getModalParamObj();
		var openStage = (pObj && pObj.openStage) ? pObj.openStage : ($('#popForm').find('#openStage').val() || '');
		var hasReq = !!(dtlData.reqNo || $('#reqNo').val());
		var hasResult = checkHasRealResult(dtlData);

		var tag = "";
		if (actionType === 'A' || actionType === 'V') {
			tag = (openStage === 'RESULT' || hasResult) ? "[결과결재]" : "[신청결재]";
		} else if (actionType === 'C' && !hasReq) {
			tag = "[신청등록]";
		} else if (openStage === 'RESULT') {
			if (!hasResult) {
				tag = "[결과등록]";
			} else if (dtlData.resultStatus === 'ING' || dtlData.resultStatus === 'END') {
				tag = "[결과상세]";
			} else {
				tag = "[결과수정]";
			}
		} else if (hasResult) {
			tag = (dtlData.resultStatus === 'ING' || dtlData.resultStatus === 'END') ? "[결과상세]" : "[결과수정]";
		} else {
			tag = (dtlData.reqStatus === 'ING' || dtlData.reqStatus === 'END') ? "[신청상세]" : "[신청수정]";
		}

		$('#popupTitle').text("휴일대체근무 신청 " + tag);
	}

	// 초기화
	$(document).ready(function() {
		var paramObj = {};
		if (typeof modalStack !== 'undefined' && modalStack && typeof modalStack.last === 'function' && modalStack.last() && modalStack.last().paramObj && Object.keys(modalStack.last().paramObj).length > 0) {
			paramObj = modalStack.last().paramObj;
		} else if (typeof window.paramObj !== 'undefined' && window.paramObj && Object.keys(window.paramObj).length > 0) {
			paramObj = window.paramObj;
		} else {
			try {
				paramObj = JSON.parse(sessionStorage.getItem('paramObj') || '{}');
			} catch(e) {
				paramObj = {};
			}
		}

		var reqNoVal = paramObj.reqNo || paramObj.todoNo || "";

		// 근무일자(holidayDt) 단일 날짜 피커 초기화 (입력 박스 좌측 하단 라인에 100% 밀착 정렬)
		bindHolidayDatePicker();

		// 시간 선택 미니 팝업 셀렉트박스 옵션 초기화 및 이벤트 바인딩 (PM5101P01.html과 동일한 구조)
		(function() {
			var hHtml = '';
			for (var i = 0; i < 24; i++) {
				var hVal = (i < 10 ? '0' : '') + i;
				hHtml += '<option value="' + hVal + '">' + hVal + '</option>';
			}
			var mHtml = '';
			for (var j = 0; j < 60; j += 10) { // 10분 단위
				var mVal = (j < 10 ? '0' : '') + j;
				mHtml += '<option value="' + mVal + '">' + mVal + '</option>';
			}
			$('#popStartHour, #popEndHour').html(hHtml);
			$('#popStartMin, #popEndMin').html(mHtml);

			$('#btnTimePopApply').off('click').on('click', function() {
				var startTime = $('#popStartHour').val() + ':' + $('#popStartMin').val();
				var endTime = $('#popEndHour').val() + ':' + $('#popEndMin').val();
				if (activeTimeCallback) {
					activeTimeCallback(startTime, endTime);
				}
				$('#timeSelectPopup').hide();
			});
			$('#btnTimePopCancel').off('click').on('click', function() {
				$('#timeSelectPopup').hide();
			});
		})();

		// 근무시간 / 실제 근무시간 클릭 시 시간 선택 팝업 오픈 (클릭한 인풋박스 좌측 하단 100% 밀착 표출)
		$('#stTm, #edTm').off('click').on('click', function(e) {
			if ($(this).is(':disabled')) return;
			openTimeSelectPopup('#stTm', '#edTm', onTimeChanged, this);
		});
		$('#realStTm, #realEdTm').off('click').on('click', function(e) {
			if ($(this).is(':disabled')) return;
			openTimeSelectPopup('#realStTm', '#realEdTm', onRealTimeChanged, this);
		});

		// 공통코드 설정 (필요시)
		setCommonSelect($('.popup_area select[data-kind]'));

		// AX5-Grid offset.top 파싱 에러 방지를 위해 초기화 시점에서 secResult를 잠시 보여준 후 초기화
		$('#secResult').show();
		approvalGridViewReq.initView();
		approvalGridViewResult.initView();
		initProjectGrid();

		// 파일첨부 초기화
		if (typeof treeModule !== 'undefined') {
			var fileReqNo = reqNoVal || "";
			var fileParam = {
				fileTrgtTyp : "PM0801P01",
				fileTrgtKey : fileReqNo,
				todoNo      : fileReqNo,
				comonCd     : "FITR9902"
			};
			treeModule.initAll('deptTreeOrdars', 'file-grid', 'FILETREE', fileParam, 'fileList_area');
			if (typeof treeModule.setFileNodeId === 'function') {
				treeModule.setFileNodeId("FITR9902");
			}
			setTimeout(function() {
				if (typeof treeModule.selectDeptTree === 'function') {
					treeModule.selectDeptTree("FITR9902");
				}
			}, 300);
		}

		// 팝업 제목 및 데이터 설정
		var actionType = paramObj.actionType;
		if (!actionType || (actionType === "C" && reqNoVal)) {
			actionType = reqNoVal ? "U" : "C";
		}
		$('#actionType').val(actionType);

		if (actionType === "C" && !reqNoVal) {
			$('#popupTitle').text("휴일대체근무 신청 - 신청등록");
			var isMng = isMngUser();
			if (isMng) {
				$('#btnReqUserSearch').show();
				$('#reqTitl').css({"cursor": "pointer", "background": "#ffffff !important"}).attr("placeholder", "클릭하여 신청자 선택");
			} else {
				$('#btnReqUserSearch').hide();
				$('#reqTitl').css({"cursor": "default", "background": "#fafafa !important"});
			}

			// 로그인 사용자 정보 자동 채움
			var curUserId = (jwt && jwt.userId) ? jwt.userId : "";
			var curUserNm = (jwt && jwt.userNm) ? jwt.userNm : "";
			var curDeptId = (jwt && jwt.deptId) ? jwt.deptId : "00000";
			var curDeptNm = (jwt && jwt.deptNm && jwt.deptNm !== "undefined") ? jwt.deptNm : "";

			if (!curDeptNm && curUserId) {
				postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": curUserId }, null, function(uData) {
					if (uData && uData.userInfo && uData.userInfo.deptNm) {
						curDeptNm = uData.userInfo.deptNm;
					}
				});
			}
			if (curDeptNm === "undefined") curDeptNm = "";

			$('#popForm').find('#reqId').val(curUserId);
			$('#popForm').find('#reqDeptId').val(curDeptId);
			$('#popForm').find('#reqDeptNm').val(curDeptNm);
			$('#reqTitl').val(curUserNm);
			$('#reqDeptDisplay').val(curDeptNm);

			// 오늘 날짜로 기본 세팅
			var todayStr = (typeof moment !== 'undefined') ? moment().format('YYYY-MM-DD') : new Date().toISOString().substring(0, 10);
			$('#holidayDt').val(todayStr);

			// 기본 시간 08:30 ~ 17:30 초기값 설정
			$('#stTm').val('08:30');
			$('#edTm').val('17:30');
			onTimeChanged();

			setDefaultApprovalLine();
			applyApprStatusPolicy();
			updatePopupTitle('C', {});
		} else if (reqNoVal && (actionType === "U" || actionType === "A" || actionType === "V" || actionType === "C")) {
			// 수정/상세/결재 모드 (문서번호 reqNoVal 기준 데이터 상세 조회)
			var coCdVal  = paramObj.coCd || "GUN";

			var dtlData = {};
			postAjaxSync("/user/pm/pm08/selectSubstituteWorkDtl", { "coCd": coCdVal, "reqNo": reqNoVal }, null, function(data) {
				if (data && data.result) {
					dtlData = data.result;
				}
			});

			if (reqNoVal && (!dtlData || Object.keys(dtlData).length === 0)) {
				alert("자료가 존재하지 않습니다.");
				modalStack.close();
				return;
			}

			var targetReqId = dtlData.reqId || (jwt ? jwt.userId : "");
			var targetDeptNm = dtlData.deptNm || dtlData.reqDeptNm || "";
			if (!targetDeptNm || targetDeptNm === "undefined" || targetDeptNm === "null") {
				targetDeptNm = "";
				if (targetReqId) {
					postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": targetReqId }, null, function(uData) {
						if (uData && uData.userInfo && uData.userInfo.deptNm) {
							targetDeptNm = uData.userInfo.deptNm;
						}
					});
				}
			}
			if (targetDeptNm === "undefined") targetDeptNm = "";

			$('#coCd').val(dtlData.coCd || coCdVal);
			$('#reqNo').val(dtlData.reqNo || reqNoVal);
			$('#popForm').find('#reqId').val(targetReqId);
			$('#popForm').find('#reqDeptId').val(dtlData.deptId || dtlData.reqDeptId || (jwt ? jwt.deptId : ""));
			$('#popForm').find('#reqDeptNm').val(targetDeptNm);
			$('#reqTitl').val(dtlData.reqNm || "");
			$('#reqDeptDisplay').val(targetDeptNm);

			var formatDtStr = function(dt) {
				if (!dt) return "";
				var s = String(dt).replace(/[^0-9]/g, '');
				if (s.length === 8) return s.substring(0, 4) + "-" + s.substring(4, 6) + "-" + s.substring(6, 8);
				return dt;
			};
			var formatTmStr = function(tm) {
				if (!tm || tm === '0000' || tm === '00:00') return "";
				if (String(tm).indexOf(':') > -1) {
					var parts = String(tm).split(':');
					var h = parts[0] ? (parts[0].length === 1 ? '0' + parts[0] : parts[0]) : "00";
					var m = parts[1] ? (parts[1].length === 1 ? '0' + parts[1] : parts[1]) : "00";
					return h + ":" + m;
				}
				var s = String(tm).replace(/[^0-9]/g, '');
				if (s.length === 4 && s !== '0000') return s.substring(0, 2) + ":" + s.substring(2, 4);
				return tm === '0000' ? "" : tm;
			};

			$('#holidayDt').val(formatDtStr(dtlData.holidayDt));
			$('#stTm').val(formatTmStr(dtlData.stTm || dtlData.rawStTm));
			$('#edTm').val(formatTmStr(dtlData.edTm || dtlData.rawEdTm));
			onTimeChanged();
			$('#specialReason').val(dtlData.specialReason || "");
			$('#reqMngOpn').val(dtlData.reqMngOpn || "");

			var realStVal = formatTmStr(dtlData.realStTm || dtlData.rawRealStTm);
			var realEdVal = formatTmStr(dtlData.realEdTm || dtlData.rawRealEdTm);
			$('#realStTm').val(realStVal);
			$('#realEdTm').val(realEdVal);
			onRealTimeChanged();
			$('#workResult').val(dtlData.workResult || "");
			$('#resultMngOpn').val(dtlData.resultMngOpn || "");

			// 작업 프로젝트 목록 로드
			var projectList = dtlData.projectList || [];
			projectGridView.target.setData({
				list: projectList,
				page: { display: false, totalElements: projectList.length }
			});
			if (typeof gridResize === 'function') {
				gridResize(projectGridView, projectList.length);
			}

			// 기존 결재선 로드
			loadApprovalLine(dtlData.reqNo || reqNoVal);

			// 상세보기 시 결재 진행상태에 따라 편집 가능 여부 및 버튼 표출 결정
			applyApprStatusPolicy(dtlData);
			updatePopupTitle(actionType, dtlData);

			if (isMngUser() && (!dtlData.reqStatus || dtlData.reqStatus === 'REQ')) {
				$('#btnReqUserSearch').show();
			} else {
				$('#btnReqUserSearch').hide();
			}
		}

		// 신청사유 동적 높이 자동 조절 이벤트 등록 및 최초 수행
		$('#specialReason').off('input.autoresize keyup.autoresize change.autoresize paste.autoresize').on('input.autoresize keyup.autoresize change.autoresize paste.autoresize', autoResizeSpecialReason);
		setTimeout(autoResizeSpecialReason, 100);
	});

	// 신청사유 입력 줄 수에 따른 동적 높이 조절 (최소 70px ~ 최대 500px 제한)
	function autoResizeSpecialReason() {
		var $el = $('#specialReason');
		if (!$el.length) return;
		var el = $el[0];

		// 스크롤 높이 정밀 측정을 위한 auto 리셋
		el.style.height = 'auto';

		var minHeight = 70;
		var maxHeight = 500;
		var scrollH = el.scrollHeight;

		var newHeight = scrollH;
		if (newHeight < minHeight) {
			newHeight = minHeight;
		}

		if (newHeight >= maxHeight) {
			newHeight = maxHeight;
			el.style.overflowY = 'auto';
		} else {
			el.style.overflowY = 'hidden';
		}

		el.style.height = newHeight + 'px';
	}
</script>
