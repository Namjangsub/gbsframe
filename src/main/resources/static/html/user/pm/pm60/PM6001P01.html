<style>
.worker-tag-item {
	display: inline-flex;
	align-items: center;
	background-color: #e9ecef;
	border: 1px solid #ced4da;
	border-radius: 12px;
	padding: 2px 8px;
	font-size: 12px;
	color: #495057;
}
.worker-tag-item .tag-del-btn {
	margin-left: 6px;
	cursor: pointer;
	color: #868e96;
	font-weight: bold;
}
.worker-tag-item .tag-del-btn:hover {
	color: #fa5252;
}
</style>
<div class="popup_area of_a" style="width: 100%; height: 100%;">
	<div class="tit_contents">
		<h4 class="tit" id="popTitle">외주 투입 등록</h4>
	</div>

	<form id="popForm" onSubmit="return false;">
		<div class="form-group popup_table">
			<input type="hidden" id="pgmId" name="pgmId" value="PM6001P01">
			<input type="hidden" id="actionType" name="actionType">
			<input type="hidden" id="vndrRsvNo" name="rsvNo">
			<input type="hidden" id="vndrClntCd" name="clntCd">

			<table class="table_input">
				<colgroup>
					<col width="15%">
					<col width="35%">
					<col width="15%">
					<col width="35%">
				</colgroup>
				<tr>
					<th class="hit">외주업체</th>
					<td colspan="3">
						<div class="search_form" style="width: 100%; display: flex; align-items: center; gap: 5px;">
							<input type="text" id="vndrNm" name="vndrNm" class="form-control input-sm" placeholder="거래처 검색 (클릭)" readonly style="background-color: #fafafa !important; cursor: pointer; flex: 1;" onclick="openVndrClntSearch();" required msg="외주업체">
							<a onclick="openVndrClntSearch();" style="cursor: pointer;"><i class="i_search_w"></i></a>
						</div>
					</td>
				</tr>
				<tr>
					<th>외주 인력</th>
					<td colspan="3">
						<div style="display: flex; gap: 5px; margin-bottom: 5px;">
							<input type="text" id="workerNmInput" class="form-control input-sm" placeholder="작업자명 입력 후 추가 (예: 김길동)" onkeypress="if(event.keyCode==13){addWorkerTag(); return false;}" style="flex: 1;">
							<a class="btn btn-default btn-sm" onclick="addWorkerTag();" style="height: 30px; line-height: 20px; padding: 4px 10px;">추 가</a>
						</div>
						<div id="workerTagContainer" style="display: flex; flex-wrap: wrap; gap: 5px; min-height: 34px; padding: 5px; border: 1px solid #ccc; background: #fafafa; border-radius: 3px;">
						</div>
						<div style="font-size: 11px; color: #737373; margin-top: 4px;">여러 명의 작업자를 텍스트로 추가하여 동시에 투입 등록할 수 있습니다.</div>
					</td>
				</tr>
				<tr>
					<th class="hit">국내/해외</th>
					<td>
						<select id="vndrTripDiv" name="tripDiv" class="form-control input-sm" data-kind="PM51DIV" required msg="국내/해외" style="width: 100%;">
							<option value="">선택하세요</option>
						</select>
					</td>
					<th class="hit">예약상태</th>
					<td>
						<select id="vndrRsvStsCd" name="rsvStsCd" class="form-control input-sm" data-kind="PM60STS" required msg="예약상태" style="width: 100%;">
							<option value="">선택하세요</option>
						</select>
					</td>
				</tr>
				<tr>
					<th class="hit">출장유형</th>
					<td>
						<select id="vndrTripTypeCds" name="tripTypeCds" class="form-control input-sm" data-kind="PM51TYPE" required msg="출장유형" style="width: 100%;">
							<option value="">선택하세요</option>
						</select>
					</td>
					<th class="hit">유상/무상</th>
					<td>
						<select id="vndrTripCondCd" name="tripCondCd" class="form-control input-sm" data-kind="PM51COND" required msg="유상/무상" style="width: 100%;">
							<option value="">선택하세요</option>
						</select>
					</td>
				</tr>
				<tr>
					<th>현장명</th>
					<td>
						<input type="text" id="vndrTripPlace" name="tripPlace" class="form-control input-sm" placeholder="예: 서울 강남" style="width: 100%;">
					</td>
					<th>프로젝트</th>
					<td>
						<select id="vndrClntPjtCd" name="clntPjtCd" class="form-control input-sm" data-kind="PRJCTCD" style="width: 100%;">
							<option value="">선택하세요</option>
						</select>
					</td>
				</tr>
				<tr>
					<th class="hit">출장 시작일</th>
					<td>
						<input type="text" id="vndrWorkStDt" name="workStDt" class="input_calendar form-control input-sm" onkeyup="dateMask(this);" autocomplete="off" style="cursor:pointer; width: 100%;" placeholder="YYYY-MM-DD" required msg="출장 시작일">
					</td>
					<th class="hit">출장 종료일</th>
					<td>
						<input type="text" id="vndrWorkEdDt" name="workEdDt" class="input_calendar form-control input-sm" onkeyup="dateMask(this);" autocomplete="off" style="cursor:pointer; width: 100%;" placeholder="YYYY-MM-DD" required msg="출장 종료일">
					</td>
				</tr>
				<tr>
					<th>야간 숙박일수</th>
					<td>
						<input type="hidden" id="vndrNightCnt" name="nightCnt" value="0">
						<span id="nightCntDisp" style="font-weight: bold; font-size: 13px; color: #333; line-height: 28px; padding-left: 5px;">0</span>
					</td>
					<th>출장 일수</th>
					<td>
						<input type="hidden" id="vndrDayCnt" name="dayCnt" value="1">
						<span id="dayCntDisp" style="font-weight: bold; font-size: 13px; color: #333; line-height: 28px; padding-left: 5px;">1</span>
					</td>
				</tr>
				<tr>
					<th>비고</th>
					<td colspan="3">
						<textarea id="vndrEtc" name="etc" class="form-control input-sm" style="width: 100%; height: 50px;" placeholder="기타 사항 입력"></textarea>
					</td>
				</tr>
			</table>
		</div>
	</form>

	<!-- 하단 버튼 (gbsframe 표준 톤앤매너 버튼 적용) -->
	<div class="popup_bottom_btn">
		<button type="button" class="btn btn-default btn-sm" id="actionBtn" authchk>등 록</button>
		<button type="button" class="btn btn-default btn-sm" id="deleteBtn" onclick="deleteVndr();" authchk style="display:none; background-color: #d9534f; color: #fff; border-color: #d43f3a;">삭 제</button>
		<button type="button" class="btn btn-default btn-sm close_btn" onclick="modalStack.close();">닫 기</button>
	</div>
</div>

<script type="text/javascript">
	(function() {
		var p = modalStack.last().paramObj || {};
		var actionType = p.actionType || 'C';
		$('#actionType').val(actionType);

		// 출장관련 공통 콤보박스 (PM0101P01.html 표준 setCommonSelect 적용)
		var $popForm = $('#popForm');
		setCommonSelect($popForm.find('select[data-kind]'));

		var setComboVals = function() {
			if (p.tripTypeCds) $popForm.find('#vndrTripTypeCds').val(p.tripTypeCds);
			if (p.tripDiv) $popForm.find('#vndrTripDiv').val(p.tripDiv);
			if (p.tripCondCd) $popForm.find('#vndrTripCondCd').val(p.tripCondCd);
			if (p.rsvStsCd) $popForm.find('#vndrRsvStsCd').val(p.rsvStsCd);
			$popForm.find('#vndrClntPjtCd').val(p.clntPjtCd || '');
		};

		if (actionType === 'U') {
			// 수정 모드 (단일 레코드)
			$('#popTitle').text('외주 투입 수정');
			$('#vndrRsvNo').val(p.rsvNo || '');
			$('#vndrClntCd').val(p.clntCd || '');
			$('#vndrNm').val(p.vndrNm || '');
			$('#vndrTripPlace').val(p.tripPlace || '');
			$('#vndrClntPjtCd').val(p.clntPjtCd || '');
			$('#vndrClntPjtNm').val(p.clntPjtNm || '');

			clearWorkerTags();
			if (p.workerNm) {
				addWorkerTag(p.workerNm);
			}

			var workStDt = p.workStDt || p.workDt || '';
			if (workStDt && workStDt.length === 8) {
				workStDt = workStDt.substring(0, 4) + '-' + workStDt.substring(4, 6) + '-' + workStDt.substring(6, 8);
			}
			var workEdDt = p.workEdDt || p.workDt || p.workStDt || '';
			if (workEdDt && workEdDt.length === 8) {
				workEdDt = workEdDt.substring(0, 4) + '-' + workEdDt.substring(4, 6) + '-' + workEdDt.substring(6, 8);
			}

			$('#vndrWorkStDt').val(workStDt);
			$('#vndrWorkEdDt').val(workEdDt);
			$('#vndrWorkEdDt').prop('readonly', false).css('background-color', '');

			setComboVals();

			$('#vndrWorkHour').val(p.workHour || '');
			$('#vndrEtc').val(p.etc || '');

			$('#actionBtn').text('수 정');
			$('#deleteBtn').show();
		} else {
			// 신규 등록 모드 (시작~종료일 지정)
			$('#popTitle').text('외주 투입 등록');
			$('#vndrRsvNo').val('');
			$('#vndrClntCd').val(p.clntCd || '');
			$('#vndrNm').val(p.vndrNm || '');
			$('#vndrTripPlace').val(p.tripPlace || '');
			$('#vndrClntPjtCd').val(p.clntPjtCd || '');
			$('#vndrClntPjtNm').val(p.clntPjtNm || '');

			clearWorkerTags();
			if (p.workerNm) {
				addWorkerTag(p.workerNm);
			}

			var stDt = p.stDt || '';
			var edDt = p.edDt || stDt;
			$('#vndrWorkStDt').val(stDt);
			$('#vndrWorkEdDt').val(edDt);
			$('#vndrWorkEdDt').prop('readonly', false).css('background-color', '');

			setComboVals();

			$('#vndrWorkHour').val('');
			$('#vndrEtc').val('');

			$('#actionBtn').text('등 록');
			$('#deleteBtn').hide();
		}

		$('#actionBtn').off('click').on('click', saveVndr);

		// DateRangePicker from-till 팝업 바인딩
		$('#vndrWorkStDt, #vndrWorkEdDt').off('click.drp').on('click.drp', function () {
			if ($(this).prop('readonly')) return;
			DateRangePicker.open({
				title: '외주 근무기간선택',
				startLabel: '출장 시작일',
				endLabel: '출장 종료일',
				startDt: $('#vndrWorkStDt').val() || null,
				endDt: $('#vndrWorkEdDt').val() || null,
				excludeSelectors: ['#vndrWorkStDt', '#vndrWorkEdDt'],
				onApply: function (sd, ed) {
					$('#vndrWorkStDt').val(sd);
					$('#vndrWorkEdDt').val(ed);
					calculateDays();
				}
			});
		});

		$('#vndrWorkStDt, #vndrWorkEdDt').off('change').on('change', calculateDays);
		calculateDays();
	})();

	function calculateDays() {
		var st = $('#vndrWorkStDt').val();
		var ed = $('#vndrWorkEdDt').val();
		if (st && ed) {
			var mSt = moment(st, 'YYYY-MM-DD');
			var mEd = moment(ed, 'YYYY-MM-DD');
			if (mSt.isValid() && mEd.isValid() && mEd.isSameOrAfter(mSt)) {
				var diffDays = mEd.diff(mSt, 'days') + 1;
				var diffNights = diffDays - 1;
				$('#nightCntDisp').text(diffNights);
				$('#dayCntDisp').text(diffDays);
				$('#vndrNightCnt').val(diffNights);
				$('#vndrDayCnt').val(diffDays);
				return;
			}
		}
		$('#nightCntDisp').text('0');
		$('#dayCntDisp').text('0');
		$('#vndrNightCnt').val(0);
		$('#vndrDayCnt').val(0);
	}

	function openVndrClntSearch() {
		var paramObj = {
			"searchValue": $('#vndrNm').val() || ''
		};
		openSecondModal("/static/html/cmn/modal/clntSearch.html", 650, 650, "거래처 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			if (row) {
				$('#vndrClntCd').val(row.clntCd || '');
				$('#vndrNm').val(row.clntNm || '');
			}
		});
	}


	function addWorkerTag(workerNm) {
		var name = $.trim(workerNm || $('#workerNmInput').val());
		if (!name) return;
		var exists = false;
		$('#workerTagContainer .worker-tag-item').each(function() {
			if ($(this).attr('data-worker-nm') === name) {
				exists = true;
				return false;
			}
		});
		if (exists) {
			alert('이미 추가된 작업자입니다.');
			$('#workerNmInput').val('').focus();
			return;
		}
		var html = '<span class="worker-tag-item" data-worker-nm="' + name.replace(/"/g, '&quot;') + '">' +
			'<span>' + name + '</span>' +
			'<span class="tag-del-btn" onclick="$(this).parent().remove();">&times;</span>' +
			'</span>';
		$('#workerTagContainer').append(html);
		$('#workerNmInput').val('').focus();
	}

	function clearWorkerTags() {
		$('#workerTagContainer').empty();
	}

	function getWorkerTagList() {
		var list = [];
		$('#workerTagContainer .worker-tag-item').each(function() {
			var name = $(this).attr('data-worker-nm');
			if (name) list.push(name);
		});
		return list;
	}

	function saveVndr() {
		var $f = $('#popForm');
		// 유효성 검사
		var clntCd = $.trim($f.find('#vndrClntCd').val());
		var vndrNm = $.trim($f.find('#vndrNm').val());
		var workStDt = $.trim($f.find('#vndrWorkStDt').val());
		var workEdDt = $.trim($f.find('#vndrWorkEdDt').val()) || workStDt;
		var tripPlace = $.trim($f.find('#vndrTripPlace').val());
		var clntPjtCd = $.trim($f.find('#vndrClntPjtCd').val());
		var $pjtOpt = $f.find('#vndrClntPjtCd option:selected');
		var clntPjtNm = (clntPjtCd && $pjtOpt.length > 0 && $pjtOpt.text() !== '선택하세요') ? $.trim($pjtOpt.text()) : '';
		var tripTypeCds = $.trim($f.find('#vndrTripTypeCds').val());
		var tripDiv = $.trim($f.find('#vndrTripDiv').val());
		var tripCondCd = $.trim($f.find('#vndrTripCondCd').val());
		var rsvStsCd = $.trim($f.find('#vndrRsvStsCd').val());
		var workHour = $.trim($f.find('#vndrWorkHour').val());

		if (!vndrNm) {
			alert('외주업체를 선택하세요.');
			openVndrClntSearch();
			return;
		}
		if (!workStDt || !workEdDt) {
			alert('필수 필드(근무 시작일, 종료일)를 모두 입력하세요.');
			return;
		}
		if (!tripTypeCds) {
			alert('출장유형을 선택하세요.');
			$f.find('#vndrTripTypeCds').focus();
			return;
		}
		if (workEdDt < workStDt) {
			alert('종료일이 시작일보다 빠를 수 없습니다.');
			return;
		}

		// 작업자 태그 목록 추출
		var workers = getWorkerTagList();
		var pendingInput = $.trim($('#workerNmInput').val());
		if (pendingInput) {
			addWorkerTag(pendingInput);
			workers = getWorkerTagList();
		}
		if (workers.length === 0) {
			// 작업자를 지정하지 않은 경우 빈 값으로 등록 처리
			workers = [''];
		}

		var rsvNo = $.trim($('#vndrRsvNo').val());
		var etc = $.trim($('#vndrEtc').val());
		var hourVal = (workHour !== '') ? (parseFloat(workHour) || 0) : 8;

		var stDayStr = workStDt.replace(/-/g, '');
		var edDayStr = workEdDt.replace(/-/g, '');
		var nightCnt = parseInt($('#vndrNightCnt').val(), 10) || 0;
		var dayCnt = parseInt($('#vndrDayCnt').val(), 10) || 1;

		// 각 작업자별로 시작일~종료일 구간 단일 1행 레코드로 등록/수정
		function saveWorkers(idx) {
			if (idx >= workers.length) {
				// alert('저장되었습니다.');
				modalStack.last().callback({resultCode: '200'});
				modalStack.close();
				return;
			}

			var wNm = workers[idx];
			var endpoint = (rsvNo && idx === 0) ? '/user/pm/pm60/updateVndr' : '/user/pm/pm60/insertVndr';
			var payload = {
				rsvNo: (rsvNo && idx === 0) ? rsvNo : undefined,
				clntCd: clntCd,
				vndrNm: vndrNm,
				workerNm: wNm,
				workStDt: stDayStr,
				workEdDt: edDayStr,
				workDt: stDayStr,
				workHour: hourVal,
				tripPlace: tripPlace,
				clntPjtCd: clntPjtCd,
				clntPjtNm: clntPjtNm,
				tripTypeCds: tripTypeCds,
				tripDiv: tripDiv,
				tripCondCd: tripCondCd,
				rsvStsCd: rsvStsCd,
				nightCnt: nightCnt,
				dayCnt: dayCnt,
				etc: etc,
				coCd: 'GUN',  	//회사코드 하드코딩 총괄일정으로 GUN하나로만 관리함. (테이블 구조 동기화용)
				creatId: jwt.userId
			};

			postAjax(endpoint, payload, null, function(data) {
				if (data && (data.resultCode === '200' || data.resultCode === 200)) {
					saveWorkers(idx + 1);
				} else {
					alert('저장에 실패했습니다: ' + (data ? data.resultMessage : '알 수 없는 오류'));
				}
			});
		}

		saveWorkers(0);
	}

	function deleteVndr() {
		if (!confirm('정말 삭제하시겠습니까?')) {
			return;
		}

		var rsvNo = $.trim($('#vndrRsvNo').val());
		if (!rsvNo) {
			alert('삭제할 데이터가 없습니다.');
			return;
		}

		putAjax("/user/pm/pm60/deleteVndr", {
			rsvNo: rsvNo
		}, null, function(data) {
			if (data && (data.resultCode === '200' || data.resultCode === 200)) {
				// alert('삭제되었습니다.');
				modalStack.last().callback(data);
				modalStack.close();
			} else {
				alert('삭제에 실패했습니다: ' + (data.resultMessage || ''));
			}
		});
	}
</script>
