<script type="text/javascript">

	function formatApprovalStatus(totCnt, doneCnt, stsNm) {
		var tot = totCnt || 0;
		var nm = stsNm || "미상신";
		if (tot === 0) nm = "결재자없음";
		var done = doneCnt || 0;
		var color = "red";

		if (tot === 0) {
			color = "red";
		} else if (tot > 0 && done === 0) {
			color = "gray";
		} else if (tot > 0 && done > 0 && done < tot) {
			color = "green";
		} else if (tot > 0 && done === tot) {
			color = "blue";
		}

		return '<i class="fas fa-circle" style="color: ' + color + ';" title="' + nm + '"></i>';
	}

	var gridView = {
		initView: function () {
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				target: $('[data-ax5grid="grid"]'),
				showRowSelector: true,
				multipleSelect: false,
				sortable: true,
				header: {
					align: "center",
					selector: true
				},
				body: {
					onClick: function () {
						this.self.select(this.dindex);
					},
					onDBLClick: function () {
						if (this.item && this.item.tripRptNo) {
							updateTripRptModal(this.item.tripRptNo);
						}
					}
				},
				page: { display: false },
				columns: [
					{ key: "actPeriod", label: "출장기간", width: 150, align: "center", formatter: function() {
						if (!this.value) return "";
						var parts = this.value.split("~");
						var res = [];
						parts.forEach(function(p) {
							var val = p.replace(/[^0-9]/g, "");
							if (val.length >= 8) {
								res.push(val.substring(0,4) + "-" + val.substring(4,6) + "-" + val.substring(6,8));
							} else {
								res.push(p);
							}
						});
						return res.join(" ~ ");
					}},
					{ key: "clntNm", label: "고객사", width: 130, align: "left" },
					{ key: "clntPjtNm", label: "프로젝트", width: 80, align: "left" },
					{ key: "tripDivNm", label: "구분", width: 50, align: "center" },
					{ key: "travelerList", label: "출장자", width: 60, align: "center" },
					{ key: "tripTypeCdsNm", label: "유형", width: 120, align: "left" },
					{ key: "salesCd", label: "SalesCd", width: 120, align: "center" },
					{
						key: "aprvStsNm", label: "결재", width: 50, align: "center",
						formatter: function() {
							return formatApprovalStatus(this.item.appTotCnt, this.item.appDoneCnt, this.item.aprvStsNm);
						}
					},
					{ key: "tripPlace", label: "출장지", width: 130, align: "left" },
					{ key: "equipNm", label: "장비명", width: 120, align: "left" },
					{ key: "currCdNm", label: "통화", width: 50, align: "center" },
					{
						key: "payAprvStsNm", label: "지급", width: 50, align: "center",
						formatter: function() {
							return formatApprovalStatus(this.item.payAppTotCnt, this.item.payAppDoneCnt, this.item.payAprvStsNm);
						}
					},
					{ key: "payDt", label: "지급일자", width: 80, align: "center" },
					{ key: "payNm", label: "지급자", width: 60, align: "center" },
					{ key: 'settleAmtKrw', label: '정산(KRW)', width: 80, align: 'right', formatter: "money" },
					{ key: 'settleAmtUsd', label: '정산(USD)', width: 80, align: 'right', formatter: "money" },
					{ key: 'tripRptNo', label: '복명서번호', width: 120, align: 'center' },
					{ key: 'tripReqNo', label: '신청서번호', width: 120, align: 'center' }
				]
			});

			return this;
		},

		setData: function (_pageNo) {
			var targetObj = this.target;
			var formData = {
				"pageNo": _pageNo + 1,
			};

			$.each($('#main_area [data-search]'), function (idx, elem) {
				var val = elem.value;
				if ($(elem).hasClass("input_calendar")) {
					val = deleteHyphenStr(val);
				}
				formData[$(elem).data('search')] = val;
			});

			postAjax("/user/pm/pm51/selectTripRptList", formData, null, function (data) {
				try {
					var list = data.result || [];
					list = list.map(function(row) {
						row.travelerList = row.travelerList || '-';
						row.actPeriod = (row.actStDtm || '').substring(0, 8) + ' ~ ' + (row.actEdDtm || '').substring(0, 8);
						return row;
					});

					targetObj.setData({
						list: list,
						page: { totalElements: list.length }
					});
				} catch (error) {
					customAlert("Grid data load failed: " + error.message);
				}
			});
		}
	}


	var selectReqGridView = null;

	$(document).ready(function () {
		mainDefaultLoad("생산관리", "출장복명서");
		setCommonSelect($("#main_area select[data-kind]"));
		authChk();

		// 시작일/종료일 셋팅 (1개월 전 초일부터 당월 말일까지)
		$('#srchStDt_S').val(moment(new Date()).subtract(1, "months").startOf("month").format("YYYY-MM-DD"));
		$('#srchEdDt_S').val(moment(new Date()).endOf("month").format("YYYY-MM-DD"));

		// 날짜 범위 선택기
		$('#srchStDt_S, #srchEdDt_S').on('click', function () {
			DateRangePicker.open({
				startDt: $('#srchStDt_S').val() || null,
				endDt: $('#srchEdDt_S').val() || null,
				excludeSelectors: ['#srchStDt_S', '#srchEdDt_S'],
				onApply: function (sd, ed) {
					$('#srchStDt_S').val(sd);
					$('#srchEdDt_S').val(ed);
					gridView.setData(0);
				}
			});
		});

		// 검색조건 변경 시 자동 검색
		$('[data-search]').on("change", function () {
			gridView.setData(0);
		});

		gridView.initView().setData(0);
	});

	// 출장자(사용자) 검색 팝업 (WB2001M01 컨디션)
	function openUserTree() {
		var paramObj = {
			"coCd": $('#coCd_S').val() || "GUN",
			"userId": $('#travelerNm_S').val(),
			"useYn": "Y"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "사용자 검색", paramObj, function (tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#travelerId_S').val(checkedNode.id);
			$('#travelerNm_S').val(checkedNode.text);
			gridView.setData(0);
		});
	}

	// Sales Code 검색 팝업 (WB2001M01 컨디션)
	function wbsSalesCodeSearch() {
		var paramObj = {
			"coCd": $('#coCd_S').val() || "GUN",
			"salesCd": $('#salesCd_S').val()
		};
		openSecondModal("/static/html/cmn/modal/wbsSalesCodeSearch.html", 1200, 700, "SALES CODE 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$('#salesCd_S').val(row.salesCd);
			gridView.setData(0);
		});
	}

	// 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$("#tripDiv_S").val("");
		$("#payYn_S").val("");
		$("#srchStDt_S").val(dateToStr(moment(new Date()).startOf("month").toDate()));
		$("#srchEdDt_S").val(dateToStr(moment(new Date()).endOf("month").toDate()));
		gridView.setData(0);
	}

	// 신규 팝업 - 복명대상 선택 모달
	function insertTripRptModal() {
		// 복명대상 신청서 조회
		postAjax("/user/pm/pm51/selectTripReqForRpt", { coCd: jwt.coCd }, null, function (data) {
			try {
				var list = data.result || [];
				if (list.length === 0) {
					alert("복명 대상 신청서가 없습니다.");
					return;
				}

				// 모달을 먼저 보이게 한 뒤 그리드를 초기화해야 함 (display:none 상태에서 그리드를 초기화하면
				// 컨테이너 크기가 0으로 계산되어 데이터를 넣어도 화면에 표시되지 않음)
				$('#selectReqModal').css('display', 'flex');

				// 선택 그리드 초기화 및 표시
				initSelectReqGrid();
				selectReqGridView.setData({
					list: list,
					page: { totalElements: list.length }
				});
				if (selectReqGridView.repaint) {
					selectReqGridView.repaint();
				}
			} catch (error) {
				customAlert("오류 발생: " + error.message);
			}
		});
	}

	// 선택 모달 그리드 초기화
	function initSelectReqGrid() {
		selectReqGridView = new ax5.ui.grid();
		selectReqGridView.setConfig({
			target: $('[data-ax5grid="selectReqGrid"]'),
			showRowSelector: true,
			multipleSelect: false,
			sortable: true,
			header: {
				align: "center",
				selector: true
			},
			body: {
				onClick: function () {
					this.self.select(this.dindex);
				},
				onDBLClick: function () {
					this.self.select(this.dindex);
					confirmSelectReq();
				}
			},
			page: { display: false },
			columns: [
				{ key: 'tripReqNo', label: '신청번호', width: 120, align: 'center' },
				{ key: 'tripDiv', label: '구분', width: 80, align: 'center' },
				{ key: 'tripPlace', label: '출장지', width: 150, align: 'left' },
				{ key: 'equipNm', label: '설비명', width: 120, align: 'left' },
				{ key: 'tripPeriod', label: '기간', width: 150, align: 'center' }
			]
		});
	}

	// 선택 모달 닫기
	function closeSelectReqModal() {
		$('#selectReqModal').css('display', 'none');
		selectReqGridView = null;
	}

	// 선택 확인
	function confirmSelectReq() {
		var selectedRows = selectReqGridView ? selectReqGridView.getList("selected") : [];
		if (!selectedRows || selectedRows.length === 0) {
			alert("신청서를 선택해주세요.");
			return;
		}

		if (selectedRows.length > 1) {
			alert("1건만 선택해주세요.");
			return;
		}

		var selectedRow = selectedRows[0];

		// 백엔드 API를 호출하여 해당 신청서(tripReqNo)로 복명서(동일 회계자료)가 이미 존재(생성)하는지 실시간 판별
		var checkParam = {
			tripReqNo: selectedRow.tripReqNo,
			coCd: jwt.coCd
		};
		postAjax("/user/pm/pm51/selectTripRptList", checkParam, null, function (data) {
			var list = data.resultList || [];
			if (list.length > 0) {
				alert("선택하신 신청서로 작성된 복명서(회계자료)가 이미 존재합니다.");
				closeSelectReqModal();
				gridView.setData(0);
			} else {
				closeSelectReqModal();
				var paramObj = {
					"actionType": "C",
					"tripReqNo": selectedRow.tripReqNo,
					"pgmId": "PM5102P01"
				};
				openModal("/static/html/user/pm/pm51/PM5102P01.html", 1400, 860, "출장복명서 등록", paramObj, function (data) {
					gridView.setData(0);
				});
			}
		});
	}

	// 수정 팝업
	function updateTripRptModal(tripRptNo) {
		var paramObj = {
			"actionType": "U",
			"tripRptNo": tripRptNo,
			"pgmId": "PM5102P01"
		};
		openModal("/static/html/user/pm/pm51/PM5102P01.html", 1500, 860, "출장복명서 수정", paramObj, function (data) {
			gridView.setData(0);
		});
	}

	// 삭제
	function deleteTripRptM01() {
		var selectedRows = gridView.target.getList("selected");
		if (selectedRows.length === 0) {
			alert("삭제할 항목을 선택해주세요.");
			return;
		}

		if (selectedRows.length > 1) {
			alert("삭제는 1건씩 가능합니다.");
			return;
		}

		var row = selectedRows[0];

		if (row.appDoneCnt > 0) {
			alert("결재처리가 이미 진행중이거나 완료된 복명서는 삭제할 수 없습니다.");
			return;
		}

		if (!confirm("선택한 출장복명서를 삭제하시겠습니까?")) return;

		var param = {
			tripRptNo: row.tripRptNo,
			fileTrgtKey: row.tripRptNo,
			userId: jwt.userId
		};

		putAjax("/user/pm/pm51/deleteTripRpt", param, null, function(data) {
			if (data.resultCode == 200) {
				alert(data.resultMessage);
				gridView.setData(0);
			} else {
				alert(data.resultMessage);
			}
		});
	}

	// 회계담당자 판정 (공통코드 SPECRTS15 등록 여부 기준 - PM5102P01.html의 isAccountingUser()와 동일 로직)
	function isAccountingUserM01() {
		var auth = false;
		postAjaxSync("/admin/cm/cm05/selectChildCodeList", { codeId: 'SPECRTS15' }, null, function(data) {
			var list = data.childCodeList || data.resultList || data.result || [];
			var allUserIds = [];
			$.each(list, function(idx, item) {
				var codeEtc = item.codeEtc || '';
				if (codeEtc) {
					allUserIds = allUserIds.concat(codeEtc.replace(/\s/g, '').split(','));
				}
			});
			if ($.inArray(jwt.userId, allUserIds) > -1) {
				auth = true;
			}
		});
		return auth;
	}

	// 지급완료취소
	function updateRptPayCancel() {
		if (!isAccountingUserM01()) {
			alert("회계담당자만 지급완료 취소할 수 있습니다.");
			return;
		}
		var selectedRows = gridView.target.getList("selected");
		if (selectedRows.length === 0) {
			alert("지급완료 취소할 행을 선택해주세요.");
			return;
		}
		if (selectedRows.length > 1) {
			alert("지급완료 취소는 1건씩 가능합니다.");
			return;
		}
		var row = selectedRows[0];
		if (!row.payDt) {
			alert("지급완료 처리된 출장복명서가 아닙니다.");
			return;
		}
		if (!confirm("지급완료를 취소하시겠습니까?")) return;

		putAjax("/user/pm/pm51/updateTripRptPayCancel", {
			tripRptNo: row.tripRptNo,
			userId: jwt.userId,
			pgmId: "PM5102M01"
		}, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode === 200) gridView.setData(0);
		});
	}

	// 출력
	function printTripRptM01() {
		var selectedRows = gridView.target.getList("selected");
		if (selectedRows.length === 0) {
			alert("출력할 항목을 선택해주세요.");
			return;
		}

		if (selectedRows.length > 1) {
			alert("출력은 1건씩 가능합니다.");
			return;
		}

		var row = selectedRows[0];

		var fileName = "PM5102R01.jrf";
		var arg = "coCd#" + jwt.coCd
				+ "#tripRptNo#" + row.tripRptNo
				+ "#";

		callReport(fileName, arg, 1150, 720, '출장복명서');
	}

	// 엑셀 다운로드
	function excelDown() {
		var paramObj = { "pageNo": 1, "recordCnt": 9999999 };
		$.each($('[data-search]'), function (idx, elem) {
			var val = elem.value;
			if ($(elem).hasClass("input_calendar")) {
				val = deleteHyphenStr(val);
			}
			paramObj[$(elem).data("search")] = val;
		});

		postAjax("/user/pm/pm51/selectTripRptList", paramObj, null, function (data) {
			var list = data.result || [];
			var excelHeader = gridView.target.columns;
			var excelData = [];

			list.forEach(row => {
				excelData.push({
					clntNm: row.clntNm,
					clntPjtNm: row.clntPjtNm,
					tripDivNm: row.tripDivNm,
					actPeriod: (function(v) {
						if (!v) return "";
						var parts = v.split("~");
						var res = [];
						parts.forEach(function(p) {
							var val = p.replace(/[^0-9]/g, "");
							if (val.length >= 8) res.push(val.substring(0,4) + "-" + val.substring(4,6) + "-" + val.substring(6,8));
							else res.push(p);
						});
						return res.join(" ~ ");
					})(row.actPeriod),
					aprvStsNm: (function(tot, done, nm) {
						if (tot === 0) return "결재자없음";
						if (tot > 0 && done === 0) return "미결재";
						if (tot > 0 && done > 0 && done < tot) return "결재진행중";
						if (tot > 0 && done === tot) return "결재완료";
						return nm || "미상신";
					})(row.appTotCnt, row.appDoneCnt, row.aprvStsNm),
					tripTypeCdsNm: row.tripTypeCdsNm,
					travelerList: row.travelerList,
					tripPlace: row.tripPlace,
					salesCd: row.salesCd,
					equipNm: row.equipNm,
					currCdNm: row.currCdNm,
					payAprvStsNm: (function(tot, done, nm) {
						if (tot === 0) return "결재자없음";
						if (tot > 0 && done === 0) return "미결재";
						if (tot > 0 && done > 0 && done < tot) return "결재진행중";
						if (tot > 0 && done === tot) return "결재완료";
						return nm || "미상신";
					})(row.payAppTotCnt, row.payAppDoneCnt, row.payAprvStsNm),
					payDt: row.payDt,
					payNm: row.payNm,
					settleAmtKrw: row.settleAmtKrw,
					settleAmtUsd: row.settleAmtUsd,
					finalEvalNm: row.finalEvalNm,
					tripRptNo: row.tripRptNo,
					tripReqNo: row.tripReqNo
				});
			});
			var todayDate = new Date().format('yyyyMMddHHmmss');
			exportJSONToExcel(excelData, excelHeader, "출장복명서_" + todayDate);
		});
	}

</script>
