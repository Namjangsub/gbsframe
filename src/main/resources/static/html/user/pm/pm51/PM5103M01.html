	<style>
		/* Google Calendar 멀티데이 트랙 캘린더 스타일 */
		.gcal-container {
			width: 100%;
			border: 1px solid #dadce0;
			border-radius: 8px;
			overflow: hidden;
			background: #ffffff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		.gcal-header {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			background: #f8f9fa;
			border-bottom: 1px solid #dadce0;
			text-align: center;
			font-weight: 600;
			font-size: 13px;
			color: #5f6368;
			padding: 8px 0;
		}
		.gcal-header .sun { color: #d93025; }
		.gcal-header .sat { color: #1a73e8; }

		.gcal-week-row {
			position: relative;
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			min-height: 125px;
			border-bottom: 1px solid #dadce0;
		}
		.gcal-week-row:last-child {
			border-bottom: none;
		}

		/* 배경 날짜 셀 */
		.gcal-day-cell {
			border-right: 1px solid #dadce0;
			padding: 6px;
			box-sizing: border-box;
			background: #ffffff;
		}
		.gcal-day-cell:last-child {
			border-right: none;
		}
		.gcal-day-cell.other-month {
			background: #f8f9fa;
		}
		.gcal-day-cell.today {
			background: #e8f0fe;
		}
		.gcal-day-num {
			font-size: 12px;
			font-weight: 600;
			color: #3c4043;
			display: inline-block;
			width: 22px;
			height: 22px;
			line-height: 22px;
			text-align: center;
			border-radius: 50%;
		}
		.gcal-day-cell.today .gcal-day-num {
			background: #1a73e8;
			color: #ffffff;
		}
		.gcal-day-cell.sun .gcal-day-num { color: #d93025; }
		.gcal-day-cell.sat .gcal-day-num { color: #1a73e8; }
		.gcal-day-cell.today.sun .gcal-day-num,
		.gcal-day-cell.today.sat .gcal-day-num { color: #ffffff; }

		/* 수평 이벤트 트랙 레이어 (구글 캘린더 핵심) */
		.gcal-events-layer {
			position: absolute;
			top: 32px;
			left: 0;
			right: 0;
			bottom: 4px;
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			grid-auto-rows: 22px;
			row-gap: 3px;
			pointer-events: none;
		}
		.gcal-event-bar {
			pointer-events: auto;
			height: 22px;
			line-height: 22px;
			padding: 0 8px;
			font-size: 11px;
			font-weight: bold;
			border-radius: 4px;
			color: #ffffff;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			box-shadow: 0 1px 3px rgba(60,64,67,0.18);
			transition: transform 0.1s, box-shadow 0.1s;
			z-index: 5;
			text-decoration: none !important;
		}
		.gcal-event-bar:hover {
			transform: translateY(-1px);
			box-shadow: 0 2px 5px rgba(60,64,67,0.3);
			z-index: 10;
			color: #ffffff;
		}
		.gcal-event-bar.cont-left {
			border-top-left-radius: 0;
			border-bottom-left-radius: 0;
		}
		.gcal-event-bar.cont-right {
			border-top-right-radius: 0;
			border-bottom-right-radius: 0;
		}

		/* 범주 (Legend) */
		.legend-box {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-size: 12px;
			color: #555;
			margin-left: 15px;
			font-weight: normal;
		}
	</style>
</head>

<script type="text/javascript">
	var currentTripCalendarData = [];

	// 사람별 고유 파스텔/비비드 14색 팔레트 (구글 캘린더 톤앤매너)
	var USER_COLOR_PALETTE = [
		{ bg: "#1a73e8", text: "#ffffff" }, // 구글 블루
		{ bg: "#e37400", text: "#ffffff" }, // 구글 오렌지
		{ bg: "#1e8e3e", text: "#ffffff" }, // 구글 그린
		{ bg: "#a142f4", text: "#ffffff" }, // 구글 퍼플
		{ bg: "#d93025", text: "#ffffff" }, // 구글 레드
		{ bg: "#f9ab00", text: "#ffffff" }, // 구글 옐로우
		{ bg: "#129eaf", text: "#ffffff" }, // 구글 시안
		{ bg: "#e52592", text: "#ffffff" }, // 구글 핑크
		{ bg: "#616161", text: "#ffffff" }, // 구글 그레이
		{ bg: "#185abc", text: "#ffffff" }, // 딥 블루
		{ bg: "#b06000", text: "#ffffff" }, // 딥 오렌지
		{ bg: "#0d652d", text: "#ffffff" }, // 딥 그린
		{ bg: "#681da8", text: "#ffffff" }, // 딥 퍼플
		{ bg: "#a50e0e", text: "#ffffff" }  // 딥 레드
	];

	// 사람 이름 기반 해시 색상 할당 함수
	function getUserColorStyle(userName) {
		if (!userName) return USER_COLOR_PALETTE[0];
		var hash = 0;
		for (var i = 0; i < userName.length; i++) {
			hash = userName.charCodeAt(i) + ((hash << 5) - hash);
		}
		var index = Math.abs(hash) % USER_COLOR_PALETTE.length;
		return USER_COLOR_PALETTE[index];
	}

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("생산관리", "출장자 캘린더 현황");
		// 공통코드 set
		setCommonSelect($("#main_area .contents.search select[data-kind]"));

		$('#coCd_S').val(jwt.coCd || "GUN");

		// 시작일/종료일 셋팅 (PM5101M01.html 기준: 1개월 전 초일부터 당월 말일까지)
		$('#srchStDt_S').val(moment(new Date()).subtract(1, "months").startOf("month").format("YYYY-MM-DD"));
		$('#srchEdDt_S').val(moment(new Date()).endOf("month").format("YYYY-MM-DD"));

		// 날짜 범위 선택기
		$('#srchStDt_S, #srchEdDt_S').on('click', function () {
			DateRangePicker.open({
				startDt: $('#srchStDt_S').val() || null,
				endDt: $('#srchEdDt_S').val() || null,
				excludeSelectors: ['#srchStDt_S', '#srchEdDt_S'],
				onApply: function (sd, ed) {
					$('#srchStDt_S').val(sd);
					$('#srchEdDt_S').val(ed);
					DataSearch();
				}
			});
		});

		// 검색조건 변경 시 자동 검색
		$('[data-search]').on("change", function () {
			DataSearch();
		});

		// 초기조회
		DataSearch();

		// authChk("PM5103M01");
	});

	// 달 이동 함수 (-1: 이전달, 1: 다음달)
	function moveMonth(diff) {
		var stDt = $('#srchStDt_S').val() || moment().format("YYYY-MM-DD");
		var targetDate = moment(stDt, "YYYY-MM-DD").add(diff, 'months');
		$('#srchStDt_S').val(targetDate.startOf('month').format("YYYY-MM-DD"));
		$('#srchEdDt_S').val(targetDate.endOf('month').format("YYYY-MM-DD"));
		DataSearch();
	}

	// 오늘 날짜 달력으로 이동
	function goToday() {
		$('#srchStDt_S').val(moment().startOf('month').format("YYYY-MM-DD"));
		$('#srchEdDt_S').val(moment().endOf('month').format("YYYY-MM-DD"));
		DataSearch();
	}

	// 데이터 검색 및 캘린더 바인딩
	function DataSearch() {
		var stVal = $('#srchStDt_S').val();
		var edVal = $('#srchEdDt_S').val();

		if (!stVal || !edVal) return;

		var formData = {};
		$.each($('#main_area [data-search]'), function (idx, elem) {
			var val = elem.value;
			if ($(elem).hasClass("input_calendar")) {
				val = deleteHyphenStr(val);
			}
			formData[$(elem).data('search')] = val;
		});
		formData["coCd"] = $('#coCd_S').val() || "GUN";

		// 현재 표시 년월 타이틀 업데이트
		var viewMoment = moment(stVal, "YYYY-MM-DD");
		$('#calCurrentYm').text(viewMoment.format("YYYY년 MM월"));

		postAjax("/user/pm/pm51/selectTripReqList", formData, null, function(data) {
			try {
				currentTripCalendarData = data.result || [];
				renderGoogleCalendar(viewMoment.format("YYYY"), viewMoment.format("MM"), currentTripCalendarData);
			} catch (error) {
				alert("오류 발생!! 전산실 연락 바랍니다: " + error.message);
			}
		});
	}

	// 구글 캘린더 수평 트랙 렌더링 알고리즘
	function renderGoogleCalendar(yy, mm, tripList) {
		var $gcalBody = $('#gcalBody');
		$gcalBody.empty();

		var firstDay = moment(yy + "-" + mm + "-01", "YYYY-MM-DD");
		var startDayOfWeek = firstDay.day(); // 0: 일요일 ~ 6: 토요일
		var todayStr = moment().format("YYYY-MM-DD");

		var currentDayMoment = moment(firstDay).subtract(startDayOfWeek, 'days');
		var targetMonthInt = parseInt(mm, 10);

		// 총 6주 행 생성
		for (var week = 0; week < 6; week++) {
			var weekStartMoment = moment(currentDayMoment);
			var weekEndMoment = moment(currentDayMoment).add(6, 'days');
			var hasCurrentMonthDay = false;

			var $weekRow = $('<div class="gcal-week-row"></div>');

			// 1. 7일간의 배경 날짜 셀 바인딩
			for (var dow = 0; dow < 7; dow++) {
				var dateStr = currentDayMoment.format("YYYY-MM-DD");
				var dayNum = currentDayMoment.date();
				var isCurrentMonth = (currentDayMoment.month() + 1 === targetMonthInt);

				if (isCurrentMonth) hasCurrentMonthDay = true;

				var cellClass = "gcal-day-cell";
				if (!isCurrentMonth) cellClass += " other-month";
				if (dateStr === todayStr) cellClass += " today";
				if (dow === 0) cellClass += " sun";
				if (dow === 6) cellClass += " sat";

				var cellHtml = '<div class="' + cellClass + '">';
				cellHtml += '<span class="gcal-day-num">' + dayNum + '</span>';
				cellHtml += '</div>';

				$weekRow.append(cellHtml);
				currentDayMoment.add(1, 'days');
			}

			// 2. 당주에 포함되는 출장 이벤트 추출 및 수평 컬럼 위치(0~6) 계산
			var weekEvents = [];
			if (tripList && tripList.length > 0) {
				var weekStartStr = weekStartMoment.format("YYYYMMDD");
				var weekEndStr = weekEndMoment.format("YYYYMMDD");

				$.each(tripList, function(idx, item) {
					var st = item.tripStDtm || item.stDt;
					var ed = item.tripEdDtm || item.edDt;
					if (!st || !ed) return true;

					st = String(st).replace(/[^0-9]/g, "").substring(0, 8);
					ed = String(ed).replace(/[^0-9]/g, "").substring(0, 8);

					// 당주와 일정 겹치는지 체크
					if (st <= weekEndStr && ed >= weekStartStr) {
						var stMom = moment(st, "YYYYMMDD");
						var edMom = moment(ed, "YYYYMMDD");

						var startCol = 0;
						var endCol = 6;
						var contLeft = false;
						var contRight = false;

						if (stMom.isAfter(weekStartMoment)) {
							startCol = stMom.diff(weekStartMoment, 'days');
						} else if (stMom.isBefore(weekStartMoment)) {
							contLeft = true;
						}

						if (edMom.isBefore(weekEndMoment)) {
							endCol = edMom.diff(weekStartMoment, 'days');
						} else if (edMom.isAfter(weekEndMoment)) {
							contRight = true;
						}

						weekEvents.push({
							item: item,
							startCol: Math.max(0, startCol),
							endCol: Math.min(6, endCol),
							contLeft: contLeft,
							contRight: contRight,
							st: st,
							ed: ed
						});
					}
				});
			}

			// 3. 수평 트랙(Slot Level) 충돌 회피 알고리즘 적용
			weekEvents.sort(function(a, b) {
				if (a.startCol !== b.startCol) return a.startCol - b.startCol;
				return (b.endCol - b.startCol) - (a.endCol - a.startCol);
			});

			var slots = []; // slots[level][col] = true
			$.each(weekEvents, function(i, ev) {
				var assignedLevel = -1;
				for (var level = 0; level < 4; level++) {
					if (!slots[level]) slots[level] = [];
					var isFree = true;
					for (var c = ev.startCol; c <= ev.endCol; c++) {
						if (slots[level][c]) {
							isFree = false;
							break;
						}
					}
					if (isFree) {
						assignedLevel = level;
						for (var c = ev.startCol; c <= ev.endCol; c++) {
							slots[level][c] = true;
						}
						break;
					}
				}
				ev.level = (assignedLevel !== -1) ? assignedLevel : 3;
			});

			// 4. 수평 이벤트 레이어 렌더링 (구글 캘린더 멀티데이 바)
			if (weekEvents.length > 0) {
				var $eventsLayer = $('<div class="gcal-events-layer"></div>');

				$.each(weekEvents, function(i, ev) {
					var item = ev.item;
					var travelerStr = item.travelerList || item.userNm || item.creatNm || "출장자";
					var placeStr = item.tripPlace || item.clntPjtNm || item.salesCd || "출장지";
					var userColor = getUserColorStyle(travelerStr);

					var colSpan = ev.endCol - ev.startCol + 1;
					var startGridCol = ev.startCol + 1; // 1-indexed

					var barCls = "gcal-event-bar";
					if (ev.contLeft) barCls += " cont-left";
					if (ev.contRight) barCls += " cont-right";

					var gridStyleStr = 'grid-column: ' + startGridCol + ' / span ' + colSpan + '; '
					                 + 'grid-row: ' + (ev.level + 1) + '; '
					                 + 'background-color: ' + userColor.bg + '; color: ' + userColor.text + ';';

					var titleText = "출장자: " + travelerStr + "\n출장지: " + placeStr + "\n기간: " + (item.tripPeriod || (ev.st + "~" + ev.ed)) + "\n구분: " + (item.tripDivNm || item.tripDiv);

					var barHtml = '<a class="' + barCls + '" style="' + gridStyleStr + '" title="' + titleText + '" onclick="updateTripReqModal(\'' + item.tripReqNo + '\');">';
					barHtml += '<i class="fas fa-plane-departure"></i> ' + travelerStr + ' (' + placeStr + ')';
					barHtml += '</a>';

					$eventsLayer.append(barHtml);
				});

				$weekRow.append($eventsLayer);
			}

			if (hasCurrentMonthDay || week < 5) {
				$gcalBody.append($weekRow);
			}
		}
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$('#coCd_S').val(jwt.coCd || "GUN");
		$('#tripDiv_S').val("");
		$('#payYn_S').val("");
		$('#srchStDt_S').val(moment(new Date()).subtract(1, "months").startOf("month").format("YYYY-MM-DD"));
		$('#srchEdDt_S').val(moment(new Date()).endOf("month").format("YYYY-MM-DD"));
		DataSearch();
	}

	// 신규 출장신청 모달
	function insertTripReqModal() {
		var paramObj = {
			"actionType": "C",
			"pgmId": "PM5101P01"
		};
		openModal("/static/html/user/pm/pm51/PM5101P01.html", 1500, 860, "출장신청서 등록", paramObj, function (data) {
			DataSearch();
		});
	}

	// 상세 수정 모달 (바 클릭 시)
	function updateTripReqModal(tripReqNo) {
		if (!tripReqNo) return;
		var paramObj = {
			"actionType": "U",
			"tripReqNo": tripReqNo,
			"pgmId": "PM5101P01"
		};
		openModal("/static/html/user/pm/pm51/PM5101P01.html", 1500, 860, "출장신청서 수정", paramObj, function (data) {
			DataSearch();
		});
	}

	// 출장자(사용자) 검색 팝업
	function openUserTree() {
		var paramObj = {
			"coCd": $('#coCd_S').val() || "GUN",
			"userId": $('#travelerNm_S').val(),
			"useYn": "Y"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "사용자 검색", paramObj, function (tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#travelerId_S').val(checkedNode.id);
			$('#travelerNm_S').val(checkedNode.text);
			DataSearch();
		});
	}

	// Sales Code 검색 팝업
	function wbsSalesCodeSearch() {
		var paramObj = {
			"coCd": $('#coCd_S').val() || "GUN",
			"salesCd": $('#salesCd_S').val()
		};
		openSecondModal("/static/html/cmn/modal/wbsSalesCodeSearch.html", 1200, 700, "SALES CODE 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			$('#salesCd_S').val(row.salesCd);
			DataSearch();
		});
	}
</script>
