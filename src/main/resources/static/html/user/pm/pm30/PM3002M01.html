	<style>
		/* 프린트 인쇄 스타일 설정 */
		@media print {
			#head_area, #top_area, .contents.no_bg, .search_box_area, .page-label { display: none !important; }
			body { background: #fff !important; margin: 0; padding: 0; }
			.report-container { border: none !important; padding: 0 !important; width: 100% !important; box-shadow: none !important; max-width: 100% !important; }
			.dual-layout { display: flex !important; flex-direction: row !important; gap: 10px !important; }
			.dual-col { width: 50% !important; }
			.pm30-chg-input { border: none !important; background: transparent !important; -webkit-appearance: none !important; appearance: none !important; padding: 0 !important; }
			@page { size: A4 landscape; margin: 5mm; }
		}

		.report-container {
			max-width: 1750px;
			margin: 15px auto;
			padding: 15px;
			background: #ffffff;
			border: 1px solid #c2cad3;
			border-radius: 4px;
			box-shadow: 0 2px 5px rgba(0,0,0,0.05);
			font-family: "Malgun Gothic", "맑은 고딕", Dotum, sans-serif;
			color: #000000;
		}

		/* 양식 전용 테이블 디자인 - 첨부 이미지 서식 100% 재현 */
		.report-table {
			width: 100%;
			border-collapse: collapse;
			table-layout: fixed;
			font-size: 10px;
		}
		.report-table th, .report-table td {
			border: 1px solid #000000;
			text-align: center;
			vertical-align: middle;
			padding: 0;
			height: 22px;
			box-sizing: border-box;
		}
		/* 비고란은 내용 길이와 무관하게 행 높이를 고정한다.
		   table-cell 자체는 height/max-height/overflow가 브라우저에서 제대로 clip 되지 않으므로,
		   내부에 고정 높이 div를 두고 그 div에서 overflow:hidden 처리한다. */
		.report-table td.rmk-cell {
			padding: 0;
			overflow: hidden;
		}
		.report-table td.rmk-cell .rmk-inner {
			height: 22px;
			max-height: 22px;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			line-height: 1.1;
			text-align: right;
			padding: 0;
			box-sizing: border-box;
		}
		
		.bg-saturday { background-color: #d0ebff !important; }
		.bg-sunday { background-color: #fce8d5 !important; }
		.bg-summary { background-color: #f8fafc; font-weight: bold; }
		.bg-pay-summary { background-color: #e2e8f0; font-weight: bold; }
		.bg-yellow-highlight { background-color: #ffff99 !important; font-weight: bold; }
		/* 엑셀 원본 서식(월근태현황.xlsx) 합계 영역 색상 이식: accent5/6/4/3 테마색 + tint 값 그대로 산출 */
		.bg-cat-sat { background-color: #E59EDD !important; }   /* 토요일 관련(가중시간계/급여시간의 '토' 블록) */
		.bg-cat-holi { background-color: #B4E5A2 !important; }  /* 휴일 관련(가중시간계/급여시간의 '휴일' 블록) */
		.bg-cat-deduct { background-color: #84E291 !important; } /* 공제시간 값 */
		.bg-cat-total-label { background-color: #CAEEFB !important; } /* 가중치시간 합계 라벨(약한 톤) */
		.bg-cat-total { background-color: #96DCF8 !important; font-weight: bold; } /* 가중치시간 합계/최종 총계 값 */
		.text-red { color: #d90429; }
		.text-blue { color: #1d4ed8; }

		/* 변동분내역 행 높이 다른 행과 100% 동일(22px)하게 고정 */
		.report-table tr.pm30-chg-row {
			height: 22px !important;
			max-height: 22px !important;
		}
		.report-table tr.pm30-chg-row td {
			height: 22px !important;
			max-height: 22px !important;
			padding: 0 !important;
			vertical-align: middle !important;
			box-sizing: border-box !important;
			overflow: hidden !important;
		}
		.pm30-chg-input {
			width: 100% !important;
			height: 18px !important;
			max-height: 18px !important;
			line-height: 18px !important;
			font-size: 10px !important;
			font-family: inherit !important;
			border: 1px solid #cbd5e1 !important;
			border-radius: 2px !important;
			padding: 0 !important;
			margin: 0 !important;
			box-sizing: border-box !important;
			background: #ffffff;
			text-align: left;
		}
		.pm30-chg-input:focus {
			border-color: #3b82f6 !important;
			outline: none !important;
			background: #eff6ff !important;
		}

		.footer-note {
			margin-top: 6px;
			font-size: 11px;
			font-weight: bold;
			color: #000000;

		}

		.search_box_area {

			display: flex;

			justify-content: space-between;

		.dual-layout {

			width: 100%;

		.dual-col {

		.single-page-wrapper {

			margin: 0 auto;

		.page-label {

			border-left: 3px solid #3b82f6;

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">

		<input type="hidden" id="pgmId" name="pgmId" value="PM3002M01">

		<!-- 상단 검색 및 서식 조절 영역 -->
		<div class="search_box_area">
			<div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
				<div style="display: flex; align-items: center; gap: 6px;">
					<label for="workYm_S" style="font-weight: bold; margin: 0;">조회월:</label>
					<input type="month" id="workYm_S" name="workYm_S" class="form-control input-sm" style="width: 140px; height: 30px;" onchange="loadMonthlyReport();">
				</div>

				<div style="display: flex; align-items: center; gap: 6px;">
					<label for="workRptIdNm_S" style="font-weight: bold; margin: 0;">근무자:</label>
					<div class="search_form" style="width: 220px; display: inline-flex; align-items: center;">
						<input type="hidden" id="workRptId_S" name="workRptId_S">
						<input type="text" id="workRptIdNm_S" name="workRptIdNm_S" class="form-control input-sm" placeholder="사원번호 또는 성명" onchange="onWorkerChange();" onkeyup="if(event.keyCode==13) onWorkerChange();">
						<a onclick="openUserSearch();" style="cursor: pointer; margin-left: -22px; z-index: 10;"><i class="i_search_w"></i></a>
					</div>
				</div>

				<div style="display: flex; align-items: center; gap: 6px;">
					<label for="orgDiv_S" style="font-weight: bold; margin: 0;">직종서식:</label>
					<select id="orgDiv_S" name="orgDiv_S" class="form-control input-sm" style="width: 190px; height: 30px;" onchange="onOrgDivChange();">
						<option value="AUTO">자동 판정 (salesArea)</option>
						<option value="HOURLY_DUAL">시급직 (1p+2p 좌우동시)</option>
						<option value="SALARY_SINGLE">연봉직 (2p 단일)</option>
					</select>
				</div>
			</div>

			<div class="add_btn_small">
				<a onclick="loadMonthlyReport();" style="height: 30px; line-height: 28px; padding: 0 12px; cursor: pointer;"><i class="fas fa-search"></i> 검 색</a>
				<a onclick="window.print();" style="height: 30px; line-height: 28px; padding: 0 12px; background: #475569; color: #fff; cursor: pointer;"><i class="fas fa-print"></i> 인 쇄</a>
			</div>
		</div>

		<!-- 메인 근태 리포트 컨테이너 (시급직 1p+2p 좌우 동시 배치 지원) -->
		<div class="report-container" id="reportPrintArea">
			
			<!-- 동적 서식 테이블 렌더링 영역 -->
			<div id="monthlyReportTableWrapper">
				<!-- JS에서 시급직(1p+2p 좌우) 또는 연봉직(2p) 서식으로 자동 생성됨 -->
			</div>

		</div>

	</div>

	<script type="text/javascript">
		var currentMonthlyData = [];
		var isWorkerAutoMode = true; // 근무자 변경 시 직종서식 자동 연동 모드 플래그

		function onOrgDivChange() {
			var ym = $('#workYm_S').val();
			if (!ym) return;
			var year = parseInt(ym.substr(0, 4), 10);
			var month = parseInt(ym.substr(5, 2), 10);
			var lastDay = new Date(year, month, 0).getDate();
			renderMonthlyReportTable(year, month, lastDay, currentMonthlyData, false);
		}

		/**
		 * PM30AttendanceReportUtil - 향후 유지보수를 위한 월별 근태 및 사원 직종 판정 공통 재사용 스니펫
		 */
		var PM30AttendanceReportUtil = {
			// 개인 마스터에 있는 salesArea 기준 판정: 시급직 = SALESAREA60 이면 2페이지짜리, 나머지는 모두 1페이지용
			isHourlyWorker: function(list, firstItem, currentWorkerInfo) {
				// 1. 조회 데이터 목록(list)의 개인 마스터 salesArea 검사
				if (Array.isArray(list) && list.length > 0) {
					for (var i = 0; i < list.length; i++) {
						var sa = String(list[i].salesArea || list[i].sales_area || '').trim().toUpperCase();
						if (sa === 'SALESAREA60') return true;
					}
				}

				// 2. firstItem 객체의 salesArea 검사
				if (firstItem) {
					var saFirst = String(firstItem.salesArea || firstItem.sales_area || '').trim().toUpperCase();
					if (saFirst === 'SALESAREA60') return true;
				}

				// 3. currentWorkerInfo 객체의 salesArea 검사
				if (currentWorkerInfo) {
					var saInfo = String(currentWorkerInfo.salesArea || currentWorkerInfo.sales_area || '').trim().toUpperCase();
					if (saInfo === 'SALESAREA60') return true;
				}

				// 시급직 = SALESAREA60 외 나머지는 모두 1페이지용 (연봉직)
				return false;
			},

			// 근무자 직종 서식 표준 코드 반환 ('HOURLY_DUAL' | 'SALARY_SINGLE')
			getReportTypeCode: function(listOrItem) {
				return this.isHourlyWorker(listOrItem) ? 'HOURLY_DUAL' : 'SALARY_SINGLE';
			},

			// 휴일대체근무 지정 여부 공통 판정
			isSubstWork: function(rowData) {
				if (!rowData) return false;
				return !!(rowData.workApplNo || String(rowData.substWorkYn).trim() === '1' ||
						(rowData.rmk && rowData.rmk.indexOf('대체근무') !== -1) ||
						(rowData.spclMtr && rowData.spclMtr.indexOf('대체근무') !== -1));
			},

			// 반차 휴가 여부 판정 (공통 모듈 위임)
			isHalfVacation: function(rowData) {
				return isHalfVacationRow(rowData);
			},

			// 휴가신청서 비고 표준 포맷팅 (공통 모듈 위임)
			formatVacationRemark: function(rowData, originalRmk) {
				return formatVacationRemark(rowData, originalRmk);
			},

			// 시각 문자열(HH:mm) 추출 (공통 모듈 위임)
			extractHHmm: function(val) {
				return extractHHmm(val);
			},

			// 해당 일자의 모든 사고내역 종합 비고 생성 (공통 모듈 위임)
			buildDailyAccidentRemarks: function(rowData, isSat, isHoli, normVal) {
				return buildDailyAccidentRemarks(rowData, isSat, isHoli, normVal);
			},

			// 해당 일자의 휴가 인정 정상근무 시간 (공통 모듈 위임)
			getVacationCreditHours: function(rowData) {
				return getVacationCreditHours(rowData);
			}
		};

		$(document).ready(function() {
			mainDefaultLoad("생산관리", "월별 근태현황");

			// 기본 조회월: 당월 (YYYY-MM), 디폴트 직종서식: 자동 판정 (AUTO)
			var now = moment();
			$('#workYm_S').val(now.format('YYYY-MM'));
			$('#orgDiv_S').val('AUTO');

			// 사원정보 초기화
			if (typeof jwt !== 'undefined') {
				$('#workRptId_S').val(jwt.userId || '');
				$('#workRptIdNm_S').val(jwt.userNm || '');
			}

			loadMonthlyReport();

			// 변동분내역 입력칸 자동저장 (focusout 위임) - 15개 전체 필드 지원
			$('#monthlyReportTableWrapper').on('focusout', '.pm30-chg-input', function() {
				var seq = parseInt($(this).data('seq'), 10);
				var $tr = $(this).closest('tr');

				var rowValues = [];
				for (var i = 0; i < 15; i++) rowValues.push('');

				$tr.find('.pm30-chg-input').each(function() {
					var col = parseInt($(this).data('col'), 10);
					if (!isNaN(col) && col >= 0 && col < 15) {
						rowValues[col] = $(this).val() || '';
					}
				});

				var fullString = rowValues.join('|');
				var contentTxt1 = fullString.substring(0, 200);
				var contentTxt2 = fullString.length > 200 ? fullString.substring(200, 400) : '';

				var ym = $('#workYm_S').val();
				var empNo = $('#workRptId_S').val();
				if (!ym || !empNo) return;

				var workYmForDb = ym.replace('-', '');
				var saveParams = {
					coCd: jwt.coCd,
					workYm: workYmForDb,
					empNo: empNo,
					seq: seq,
					contentTxt1: contentTxt1,
					contentTxt2: contentTxt2,
					loginId: jwt.userId || jwt.userNm || ''
				};

				postAjax('/user/pm/pm30/saveAttendanceChange', saveParams, null, function(data) {
					if (data && data.resultCode === '0000') {
						pm30ChangeData[seq] = { seq: seq, contentTxt1: contentTxt1, contentTxt2: contentTxt2 };
					}
				});
			});

			// 입력값 변경 시 실시간으로 하단 집계(합계/가중시간계/공제/급여시간) 자동 반영
			$('#monthlyReportTableWrapper').on('input', '.pm30-chg-input', function() {
				recalcSalaryReportSummary();
			});

			// 엔터키 입력 시 다음 입력칸으로 자연스럽게 이동
			$('#monthlyReportTableWrapper').on('keydown', '.pm30-chg-input', function(e) {
				if (e.keyCode === 13) {
					e.preventDefault();
					var $inputs = $('#monthlyReportTableWrapper').find('.pm30-chg-input');
					var idx = $inputs.index(this);
					if (idx >= 0 && idx < $inputs.length - 1) {
						$inputs.eq(idx + 1).focus().select();
					} else {
						$(this).blur();
					}
				}
			});
		});

		var currentWorkerInfo = {};

		// 사용자 검색 팝업 (1단계 메인 모달 openModal 사용)
		function openUserSearch() {
			var paramObj = {
				coCd: jwt.coCd,
				userId: $('#workRptId_S').val(),
				userNm: $('#workRptIdNm_S').val()
			};
			openModal('/static/html/cmn/modal/userSearch.html', 450, 650, '사용자 검색', paramObj, function(tree, personNodes) {
				var selectedEmpNo = '', selectedUserNm = '', selectedSalesArea = '', selectedOrgDiv = '', selectedDept = '', selectedPos = '';

				if (tree && typeof tree.get_checked === 'function') {
					var checkedId = tree.get_checked()[0];
					if (checkedId) {
						var node = tree.get_node(checkedId);
						var orig = (node && node.original) ? node.original : {};

						selectedEmpNo = orig.empNo || orig.userId || orig.id || node.id || '';
						selectedUserNm = orig.userNm || orig.empNm || orig.name || node.text || '';
						selectedSalesArea = orig.salesArea || orig.sales_area || '';
						selectedOrgDiv = orig.orgDivNm || orig.org_div_nm || '';
						selectedDept = orig.deptNm || orig.dept_nm || '';
						selectedPos = orig.positionNm || orig.position_nm || orig.levelNm || '';
					}
				} else if (personNodes && personNodes.length > 0) {
					var p = personNodes[0];
					var origP = (p && p.original) ? p.original : p;

					selectedEmpNo = origP.empNo || origP.userId || origP.id || p.id || '';
					selectedUserNm = origP.userNm || origP.empNm || origP.name || p.text || '';
					selectedSalesArea = origP.salesArea || origP.sales_area || '';
					selectedOrgDiv = origP.orgDivNm || origP.org_div_nm || '';
					selectedDept = origP.deptNm || origP.dept_nm || '';
					selectedPos = origP.positionNm || origP.position_nm || origP.levelNm || '';
				}

				if (selectedUserNm) selectedUserNm = cleanRemarkText(selectedUserNm);

				currentWorkerInfo = {
					empNo: selectedEmpNo,
					empNm: selectedUserNm,
					deptNm: selectedDept,
					positionNm: selectedPos,
					salesArea: selectedSalesArea,
					orgDivNm: selectedOrgDiv
				};

				// 사원마스터 단건 조회로 salesArea 및 직종 속성 100% 교차 검증
				var checkParam = {
					coCd: jwt.coCd,
					empNo: selectedEmpNo,
					userId: selectedEmpNo,
					userNm: selectedUserNm
				};

				postAjax('/admin/cm/cm06/selectUserInfo', checkParam, null, function(resData) {
					if (resData && resData.userInfo) {
						var uInfo = resData.userInfo;
						currentWorkerInfo.salesArea = uInfo.salesArea || uInfo.sales_area || currentWorkerInfo.salesArea;
						currentWorkerInfo.orgDivNm = uInfo.orgDivNm || uInfo.org_div_nm || currentWorkerInfo.orgDivNm;
						currentWorkerInfo.deptNm = uInfo.deptNm || currentWorkerInfo.deptNm;
						currentWorkerInfo.positionNm = uInfo.positionNm || uInfo.levelNm || currentWorkerInfo.positionNm;

		// 근무자 텍스트/사원 변경 시 리포트 재조회
		function onWorkerChange() {
			var txtVal = $('#workRptIdNm_S').val() || '';
			if (!txtVal) {
				$('#workRptId_S').val('');
				currentWorkerInfo = {};
				loadMonthlyReport();

			var checkParam = {
				coCd: jwt.coCd,
				empNo: $('#workRptId_S').val() || txtVal,
				userId: $('#workRptId_S').val() || txtVal,
				userNm: txtVal
			};
			postAjax('/admin/cm/cm06/selectUserInfo', checkParam, null, function(resData) {

					var uInfo = resData.userInfo;

						empNo: uInfo.empNo || uInfo.userId || uInfo.id || '',
						empNm: uInfo.userNm || uInfo.empNm || uInfo.name || txtVal,
						deptNm: uInfo.deptNm || '',
						positionNm: uInfo.positionNm || uInfo.levelNm || '',
						salesArea: uInfo.salesArea || uInfo.sales_area || '',
						orgDivNm: uInfo.orgDivNm || uInfo.org_div_nm || ''
					};

					}
				}
				loadMonthlyReport();
			});

		// 월별 근태 리포트 데이터 로드 및 서식 생성
		function loadMonthlyReport() {
			var ym = $('#workYm_S').val();
			if (!ym) return;

			var year = parseInt(ym.substr(0, 4), 10);
			var month = parseInt(ym.substr(5, 2), 10);
			var lastDay = new Date(year, month, 0).getDate();

			var stDt = year + ('0' + month).slice(-2) + '01';
			var edDt = year + ('0' + month).slice(-2) + ('0' + lastDay).slice(-2);

			var empIdVal = $('#workRptId_S').val() || '';
			var workerKeywordVal = $('#workRptIdNm_S').val() || '';

			var searchParams = {
				coCd: jwt.coCd,
				stDt: stDt,
				edDt: edDt,
				empNo: empIdVal,
				workerKeyword: workerKeywordVal
			};

			postAjax('/user/pm/pm30/selectAttendanceList', searchParams, null, function(data) {
				var list = (data && data.resultList) ? data.resultList : [];
				currentMonthlyData = list;
				renderMonthlyReportTable(year, month, lastDay, list, true); // 백엔드 조회 자료 기반 직종서식 자동 설정

				// 변동분내역 로드 (사원이 선택된 경우만)
				if (empIdVal) {
					loadAttendanceChangeList(empIdVal, ym);
				}
			});
		}

		// 월근태 변동분내역 로드
		var pm30ChangeData = {};
		function loadAttendanceChangeList(empNo, workYm) {
			// workYm 형식 변환: "YYYY-MM" -> "YYYYMM"
			var workYmForDb = workYm.replace('-', '');
			var params = {
				coCd: jwt.coCd,
				workYm: workYmForDb,
				empNo: empNo
			};
			postAjax('/user/pm/pm30/selectAttendanceChangeList', params, null, function(data) {
				var changeList = (data && data.resultList) ? data.resultList : [];
				pm30ChangeData = {};
				$.each(changeList, function(_, item) {
					pm30ChangeData[item.seq] = item;
				});
				renderAttendanceChangeInputs();
			});
		}

		// 변동분내역 행 데이터 파싱 (15개 열 전체 복원)
		function parseChangeRowValues(chgItem) {
			var arr = [];
			for (var i = 0; i < 15; i++) arr.push('');
			if (!chgItem) return arr;

			var raw = (chgItem.contentTxt1 || '') + (chgItem.contentTxt2 || '');
			if (raw.indexOf('|') !== -1) {
				var parts = raw.split('|');
				for (var p = 0; p < parts.length && p < 15; p++) {
					arr[p] = parts[p] || '';
				}
				return arr;
			}

			// 구버전 단일 문자열 호환 (col 2, col 3)
			if (chgItem.contentTxt1) arr[2] = chgItem.contentTxt1;
			if (chgItem.contentTxt2) arr[3] = chgItem.contentTxt2;
			return arr;
		}

		// 변동분내역 모든 셀(15개 전체) 입력칸 렌더링
		function renderAttendanceChangeInputs() {
			$('.pm30-chg-row').each(function() {
				var seq = parseInt($(this).data('seq'), 10);
				var chgItem = pm30ChangeData[seq];
				var rowValues = parseChangeRowValues(chgItem);

				var cells = $(this).find('td');
				for (var c = 0; c < cells.length && c < 15; c++) {
					var val = rowValues[c] || '';
					var txt = '<input type="text" class="pm30-chg-input" data-seq="' + seq + '" data-col="' + c + '" value="' + val + '">';
					cells.eq(c).html(txt);
				}
			});

			// 로드된 변동분 데이터로 즉시 집계 재계산
			recalcSalaryReportSummary();
		}

		// 기본 일자(1일~31일) 집계값 보관 객체
		var pm30BaseDailySums = null;

		// 변동분내역 수치 실시간 자동 합산 집계 함수
		function recalcSalaryReportSummary() {
			if (!pm30BaseDailySums) return;

			var norm = pm30BaseDailySums.sumNorm || 0;
			var ot = pm30BaseDailySums.sumOt || 0;
			var night = pm30BaseDailySums.sumNight || 0;
			var satNorm = pm30BaseDailySums.sumSatNormVal || 0;
			var satOt = pm30BaseDailySums.sumSatOtVal || 0;
			var satNight = pm30BaseDailySums.sumSatNightVal || 0;
			var holiNorm = pm30BaseDailySums.sumHoliNormVal || 0;
			var holiOt = pm30BaseDailySums.sumHoliOtVal || 0;
			var holiNight = pm30BaseDailySums.sumHoliNightVal || 0;
			var deduct = pm30BaseDailySums.deductTimeTotal || 0;

			// 화면에 렌더링된 2개 공백 행의 각 셀 input 값을 파싱하여 합산
			$('.pm30-chg-row').each(function() {
				$(this).find('.pm30-chg-input').each(function() {
					var col = parseInt($(this).data('col'), 10);
					var val = parseFloat($(this).val());
					if (!isNaN(val) && val > 0) {
						if (col === 2) norm += val;
						else if (col === 3) ot += val;
						else if (col === 4) night += val;
						else if (col === 5) satNorm += val;
						else if (col === 6) satOt += val;
						else if (col === 7) satNight += val;
						else if (col === 8) holiNorm += val;
						else if (col === 9) holiOt += val;
						else if (col === 10) holiNight += val;
						else if (col === 11) deduct += val;
					}
				});
			});

			var totalHours = norm + ot + night + satNorm + satOt + satNight + holiNorm + holiOt + holiNight;
			var weightedNorm = (norm * 1) + (ot * 1.5) + (night * 2);
			var weightedSat = (satNorm * 1.5) + (satOt * 1.5) + (satNight * 2);
			var weightedHoli = (holiNorm * 1.5) + (holiOt * 2) + (holiNight * 2.5);
			var weightedGrand = weightedNorm + weightedSat + weightedHoli;

			// 합계 행 갱신
			$('#sum_norm').text(norm > 0 ? norm.toFixed(1) : '');
			$('#sum_ot').text(ot > 0 ? ot.toFixed(1) : '');
			$('#sum_night').text(night > 0 ? night.toFixed(1) : '');
			$('#sum_sat_norm').text(satNorm > 0 ? satNorm.toFixed(1) : '');
			$('#sum_sat_ot').text(satOt > 0 ? satOt.toFixed(1) : '');
			$('#sum_sat_night').text(satNight > 0 ? satNight.toFixed(1) : '');
			$('#sum_holi_norm').text(holiNorm > 0 ? holiNorm.toFixed(1) : '');
			$('#sum_holi_ot').text(holiOt > 0 ? holiOt.toFixed(1) : '');
			$('#sum_holi_night').text(holiNight > 0 ? holiNight.toFixed(1) : '');
			$('#sum_deduct').text(deduct > 0 ? deduct.toFixed(1) : '');
			$('#sum_total_hours').text(totalHours > 0 ? totalHours.toFixed(1) : '');

			// 가중시간계 행 갱신
			$('#weighted_norm').text(weightedNorm > 0 ? weightedNorm.toFixed(1) : '');
			$('#weighted_sat').text(weightedSat > 0 ? weightedSat.toFixed(1) : '');
			$('#weighted_holi').text(weightedHoli > 0 ? weightedHoli.toFixed(1) : '');
			$('#weighted_grand').text(weightedGrand > 0 ? weightedGrand.toFixed(1) : '');

			// 공제시간 행 갱신
			$('#sum_deduct_summary').text(deduct > 0 ? deduct.toFixed(1) : '');

			// 급여시간 행 갱신
			$('#pay_ot').text(ot > 0 ? ot.toFixed(2) : '');
			$('#pay_sat_norm').text(satNorm > 0 ? satNorm.toFixed(2) : '');
			$('#pay_holi_norm').text(holiNorm > 0 ? holiNorm.toFixed(2) : '');
		}

		// 시급직 (1p + 2p 좌우 배치) vs 연봉직 (2p 단일) 렌더링
		function renderMonthlyReportTable(year, month, lastDay, list, forceAutoSync) {
			list = list || [];
			var dataMap = {};
			var firstItem = (list && list.length > 0) ? jQuery.extend({}, list[0]) : {};

			// 백엔드 근태데이터가 0건일 경우 currentWorkerInfo 객체 보존 적용
			if (!firstItem.empNo && currentWorkerInfo.empNo) {
				firstItem.empNo = currentWorkerInfo.empNo;
				firstItem.empNm = currentWorkerInfo.empNm;
				firstItem.deptNm = currentWorkerInfo.deptNm;
				firstItem.positionNm = currentWorkerInfo.positionNm;
				firstItem.salesArea = currentWorkerInfo.salesArea;
				firstItem.orgDivNm = currentWorkerInfo.orgDivNm;
			}
			if (!firstItem.empNm) {
				firstItem.empNm = $('#workRptIdNm_S').val() || '';
				firstItem.empNo = $('#workRptId_S').val() || '';
			}

			for (var i = 0; i < list.length; i++) {
				var item = list[i] || {};
				var dtKey = String(item.workDt || '').replace(/[^0-9]/g, '');
				if (dtKey) dataMap[dtKey] = item;
			}

			// 개인 마스터 salesArea 기준 직종 판정: 시급직 = SALESAREA60 이면 2페이지짜리, 나머지는 모두 1페이지용
			var isHourly = PM30AttendanceReportUtil.isHourlyWorker(list, firstItem, currentWorkerInfo);
			var reportTypeCode = isHourly ? 'HOURLY_DUAL' : 'SALARY_SINGLE';

			var selectOrgDiv = $('#orgDiv_S').val() || 'AUTO';
			var showHourlyDual = false;

			if (selectOrgDiv === 'HOURLY_DUAL') {
				// 사용자가 명시적으로 '시급직' 옵션 선택 시 해당 서식만 표출
				showHourlyDual = true;
			} else if (selectOrgDiv === 'SALARY_SINGLE') {
				// 사용자가 명시적으로 '연봉직' 옵션 선택 시 해당 서식만 표출
				showHourlyDual = false;
			} else {
				// 디폴트: '자동 판정 (AUTO)'인 경우 사원 직종에 따라 화면 렌더링
				showHourlyDual = (reportTypeCode === 'HOURLY_DUAL');
			}

			if (showHourlyDual) {
				// 시급직 (salesArea === 'SALESAREA60'): 1페이지와 2페이지를 좌우 Side-by-Side 로 동시에 렌더링!
				var dualHtml = '<div class="dual-layout">';
				
				// 좌측 1페이지 (시급직 전용 양식)
				dualHtml += '<div class="dual-col">';
				dualHtml += '<div class="page-label">1 페이지 (시급직 양식)</div>';
				// dualHtml += buildEmployeeInfoHeader(firstItem);
				dualHtml += buildHourlyReportTableHtml(year, month, lastDay, dataMap);
				dualHtml += '</div>';

				// 우측 2페이지 (월별 근태 양식)
				dualHtml += '<div class="dual-col">';
				dualHtml += '<div class="page-label">2 페이지 (근태 현황 양식)</div>';
				// dualHtml += buildEmployeeInfoHeader(firstItem);
				dualHtml += buildSalaryReportTableHtml(year, month, lastDay, dataMap);
				dualHtml += '</div>';

				dualHtml += '</div>';

				$('#monthlyReportTableWrapper').html(dualHtml);
			} else {
				// 연봉직 (2p 단일): 시급직 듀얼 시 한쪽 페이지 너비(860px)와 100% 동일한 폭으로 중앙 정렬!
				var singleHtml = '<div class="single-page-wrapper">';
				// singleHtml += buildEmployeeInfoHeader(firstItem);
				singleHtml += buildSalaryReportTableHtml(year, month, lastDay, dataMap);
				singleHtml += '</div>';
				$('#monthlyReportTableWrapper').html(singleHtml);
			}
		}

		// 사원 정보 헤더 표 HTML 생성 (널 방어 가드 보완)
		function buildEmployeeInfoHeader(item) {

		// ─ [1페이지 서식] 시급직 전용 HTML 생성 ─
		// 주의: 페이지 1은 사내근무 그룹에 야간(야간) 서브헤더가 없음. 야간시간은 표시되지 않으나 가중치 계산에는 포함됨.
		// 근무형태별(사내/설치시운전/설치장애/A/S무상/기타) 5개 카테고리로 분류하여 각 카테고리별 요일유형별 시간 누적
		function buildHourlyReportTableHtml(year, month, lastDay, dataMap) {
			var html = '<table class="report-table">';
			html += '<colgroup>';
			html += '<col width="4%"><col width="4%"><col width="4%">'; // 일자, 요일, 일수
			html += '<col width="5%"><col width="5%"><col width="5%">'; // 사내근무
			html += '<col width="3.5%"><col width="5%"><col width="5%"><col width="5%">'; // 설치시운전
			html += '<col width="3.5%"><col width="5%"><col width="5%"><col width="5%">'; // 설치장애
			html += '<col width="3.5%"><col width="5%"><col width="5%"><col width="5%">'; // A/S무상
			html += '<col width="3.5%"><col width="5%"><col width="5%"><col width="5%">'; // 기타
			html += '<col width="10%">'; // 비고
			html += '</colgroup>';

			html += '<thead>';
			html += '<tr style="background: #f8fafc; font-size: 9px;">';
			html += '<th rowspan="2">일<br>자</th><th rowspan="2">요<br>일</th>';
			html += '<th colspan="4">사내 근무</th>';
			html += '<th colspan="4">설치 시운전</th>';
			html += '<th colspan="4">설치장애</th>';
			html += '<th colspan="4">A/S(무상)</th>';
			html += '<th colspan="4">기타</th>';
			html += '<th rowspan="2">비고<br>(P/J 장비명)</th>';
			html += '</tr>';
			html += '<tr style="background: #f8fafc; font-size: 9px;">';
			html += '<th>일수</th><th>정상</th><th>연장</th><th>야간</th>';
			html += '<th>일수</th><th>정상</th><th>연장</th><th>야간</th>';
			html += '<th>일수</th><th>정상</th><th>연장</th><th>야간</th>';
			html += '<th>일수</th><th>정상</th><th>연장</th><th>야간</th>';
			html += '<th>일수</th><th>정상</th><th>연장</th><th>야간</th>';
			html += '</tr>';
			html += '</thead><tbody>';

			var dayNames = ['일', '월', '화', '수', '목', '금', '토'];

			// 카테고리별 누적 변수 초기화 (5개 category × 3개 요일유형 × 4개 시간항목)
			var categories = {
				'inhouse': { weekday: {dayCnt:0, normal:0, ot:0, night:0}, sat: {dayCnt:0, normal:0, ot:0, night:0}, holi: {dayCnt:0, normal:0, ot:0, night:0} },
				'install': { weekday: {dayCnt:0, normal:0, ot:0, night:0}, sat: {dayCnt:0, normal:0, ot:0, night:0}, holi: {dayCnt:0, normal:0, ot:0, night:0} },
				'fault':   { weekday: {dayCnt:0, normal:0, ot:0, night:0}, sat: {dayCnt:0, normal:0, ot:0, night:0}, holi: {dayCnt:0, normal:0, ot:0, night:0} },
				'asFree':  { weekday: {dayCnt:0, normal:0, ot:0, night:0}, sat: {dayCnt:0, normal:0, ot:0, night:0}, holi: {dayCnt:0, normal:0, ot:0, night:0} },
				'etcTrip': { weekday: {dayCnt:0, normal:0, ot:0, night:0}, sat: {dayCnt:0, normal:0, ot:0, night:0}, holi: {dayCnt:0, normal:0, ot:0, night:0} }
			};

			for (var d = 1; d <= 31; d++) {
				if (d > lastDay) {
					html += '<tr><td>' + d + '</td><td></td><td></td>';
					for (var c = 0; c < 20; c++) html += '<td></td>';
					html += '</tr>';
					continue;
				}

				var dStr = (d < 10 ? '0' : '') + d;
				var ymStr = year + ('0' + month).slice(-2) + dStr;
				var dateObj = new Date(year, month - 1, d);
				var dow = dateObj.getDay();
				var dowName = dayNames[dow];

				var isSat = (dow === 6);
				var isSun = (dow === 0);
				var isHoli = isSun || (typeof isRedHolidayYmd === 'function' && isRedHolidayYmd(ymStr));

				var rowClass = isSat ? 'bg-saturday' : (isHoli ? 'bg-sunday' : '');
				var dowClass = isSat ? 'text-blue' : (isHoli ? 'text-red' : '');

				var rowData = dataMap[ymStr] || {};
				var isExcluded = (String(rowData.workTypeNm || '').trim() === '제외');
				var normVal = isExcluded ? 0 : (parseFloat(rowData.clsNormal) || 0);
				var otVal = isExcluded ? 0 : (parseFloat(rowData.clsOt) || 0);
				var nghtVal = isExcluded ? 0 : (parseFloat(rowData.clsNight) || 0);

				var vacCreditHours = PM30AttendanceReportUtil.getVacationCreditHours(rowData);
				var isHalfVac = PM30AttendanceReportUtil.isHalfVacation(rowData);
				var isSubstWork = PM30AttendanceReportUtil.isSubstWork(rowData);
				// 야간시간만 있는 날(정상/연장은 0)도 근무일수/집계에 포함되어야 함
				var workDayCnt = (normVal > 0 || otVal > 0 || nghtVal > 0) ? 1 : 0;

				var dowName = dayNames[dow];

				var isSat = (dow === 6);
				var isSun = (dow === 0);
				var isHoli = isSun || (typeof isRedHolidayYmd === 'function' && isRedHolidayYmd(ymStr));

				var rowClass = isSat ? 'bg-saturday' : (isHoli ? 'bg-sunday' : '');
				var dowClass = isSat ? 'text-blue' : (isHoli ? 'text-red' : '');

				var rowData = dataMap[ymStr] || {};
				var isExcluded = (String(rowData.workTypeNm || '').trim() === '제외');
				var normVal = isExcluded ? 0 : (parseFloat(rowData.clsNormal) || 0);
				var otVal = isExcluded ? 0 : (parseFloat(rowData.clsOt) || 0);
				var nghtVal = isExcluded ? 0 : (parseFloat(rowData.clsNight) || 0);
				var totalVal = isExcluded ? 0 : (parseFloat(rowData.clsTotal) || 0);
				var holiNormVal = isHoli ? (normVal || totalVal) : 0;

				var vacCreditHours = PM30AttendanceReportUtil.getVacationCreditHours(rowData);
				var isHalfVac = PM30AttendanceReportUtil.isHalfVacation(rowData);
				var isSubstWork = PM30AttendanceReportUtil.isSubstWork(rowData);

				// 공제확인: 평일(월~금)에 정상근무시간이 8시간 미만이면 부족한 시간을 표시 (엑셀 AS열: =IF(평일,IF(정상<8,8-정상,""),""))
				// 조퇴, 외출인 경우에는 기본근무시간이 8시간에서 빠지는 시간이 공제확인으로 정확하게 표기됨
				// 연차 등 8시간 전일 휴가 및 반차(4시간) 휴가도 기본 정상 근무를 한 것으로 감안하여 공제확인 시간 계산에 반영
				var isWeekdayForDeduct = !isSat && !isHoli;
				var effectiveNormVal = normVal + vacCreditHours;
				var deductVal = (!isExcluded && isWeekdayForDeduct && effectiveNormVal < 8) ? (8 - effectiveNormVal) : 0;
				deductTimeTotal += deductVal;

				// 해당 일자의 모든 사고내역(지각 시각, 조퇴 시각, 외출, 오후반차 등) 종합 비고 텍스트 생성
				var rmkTxt = PM30AttendanceReportUtil.buildDailyAccidentRemarks(rowData, isSat, isHoli, normVal);

				// 비고에 대체근무 정보 추가 (원래 비고 텍스트는 보존)
				if (isSubstWork && rmkTxt.indexOf('대체근무') === -1) {
					rmkTxt = (rmkTxt ? '[대체근무] ' + rmkTxt : '대체근무');
				}

				if (isSubstWork || (!isSat && !isHoli)) {
					sumNorm += normVal;
					sumOt += otVal;
					sumNight += nghtVal;
				} else if (isSat) {
					sumSatNormVal += normVal;
					sumSatOtVal += otVal;
					sumSatNightVal += nghtVal;
				} else if (isHoli) {
					sumHoliNormVal += (holiNormVal || normVal);
					sumHoliOtVal += otVal;
					sumHoliNightVal += nghtVal;
				}

				// lateTxt/earlyLeaveTxt/vacationTxt는 '1'(또는 값 있음)/null 플래그, 일수 카운트
				if (rowData.lateTxt) lateCntTotal += 1;
				if (rowData.earlyLeaveTxt) earlyCntTotal += 1;
				if (rowData.vacationTxt) vacationCntTotal += 1;

				html += '<tr class="' + rowClass + '">';
				html += '<td>' + d + '</td>';
				html += '<td class="' + dowClass + '">' + dowName + '</td>';

				if (isSubstWork || (!isSat && !isHoli)) {
					html += '<td>' + (normVal > 0 ? normVal.toFixed(1) : '') + '</td>';
					html += '<td>' + (otVal > 0 ? otVal.toFixed(1) : '') + '</td>';
					html += '<td>' + (nghtVal > 0 ? nghtVal.toFixed(1) : '') + '</td>';
				} else {
					html += '<td></td><td></td><td></td>';
				}

				if (isSat && !isSubstWork) {
					html += '<td>' + (normVal > 0 ? normVal.toFixed(1) : '') + '</td>';
					html += '<td>' + (otVal > 0 ? otVal.toFixed(1) : '') + '</td>';
					html += '<td>' + (nghtVal > 0 ? nghtVal.toFixed(1) : '') + '</td>';
				} else {
					html += '<td></td><td></td><td></td>';
				}

				if (isHoli && !isSubstWork) {
					html += '<td>' + (holiNormVal > 0 ? holiNormVal.toFixed(1) : (normVal > 0 ? normVal.toFixed(1) : '')) + '</td>';
					html += '<td>' + (otVal > 0 ? otVal.toFixed(1) : '') + '</td>';
					html += '<td>' + (nghtVal > 0 ? nghtVal.toFixed(1) : '') + '</td>';
				} else {
					html += '<td></td><td></td><td></td>';
				}

				// 공제확인: 필드 없음 (빈 셀)
				// 출장대기수당: rowData.tripAllwnc
				// 출장근무지: 국가명-지역 형태
				var tripAllwncTxt = rowData.tripAllwnc || '';
				var placeTxt = '';
				if (rowData.tripNationNm || rowData.tripWorkPlace) {
					if (rowData.tripNationNm) {
						placeTxt = rowData.tripNationNm + '-' + (rowData.tripWorkPlace || '');
					} else {
						placeTxt = rowData.tripWorkPlace || '';
					}
				}

				html += '<td>' + (deductVal > 0 ? deductVal.toFixed(1) : '') + '</td>'; // 공제확인
				html += '<td>' + tripAllwncTxt + '</td>'; // 출장대기수당
				html += '<td style="text-align:left; padding: 0;">' + placeTxt + '</td>'; // 출장근무지
				html += '<td class="rmk-cell"><div class="rmk-inner">' + rmkTxt + '</div></td>'; // 비고
				html += '</tr>';
			}

			// 날짜 마지막에 필요시 수동 입력/수정이 가능한 공백 2라인 추가
			// 주의: 변동분내역 편집 기능에서 사용할 입력칸으로 리용됨
			for (var b2 = 0; b2 < 2; b2++) {
				html += '<tr class="blank-row pm30-chg-row" data-seq="' + (b2 + 1) + '">';
				for (var c2 = 0; c2 < 15; c2++) html += '<td></td>';
				html += '</tr>';
			}

			// 기본 일자 집계값 보존
			pm30BaseDailySums = {
				sumNorm: sumNorm,
				sumOt: sumOt,
				sumNight: sumNight,
				sumSatNormVal: sumSatNormVal,
				sumSatOtVal: sumSatOtVal,
				sumSatNightVal: sumSatNightVal,
				sumHoliNormVal: sumHoliNormVal,
				sumHoliOtVal: sumHoliOtVal,
				sumHoliNightVal: sumHoliNightVal,
				deductTimeTotal: deductTimeTotal,
				lateCntTotal: lateCntTotal,
				earlyCntTotal: earlyCntTotal,
				vacationCntTotal: vacationCntTotal
			};

			html += '</tbody><tfoot>';
			html += '<tr class="bg-summary">';
			html += '<td colspan="2">합계</td>';
			html += '<td id="sum_norm">' + (sumNorm > 0 ? sumNorm.toFixed(1) : '') + '</td>';
			html += '<td id="sum_ot">' + (sumOt > 0 ? sumOt.toFixed(1) : '') + '</td>';
			html += '<td id="sum_night">' + (sumNight > 0 ? sumNight.toFixed(1) : '') + '</td>';
			html += '<td id="sum_sat_norm">' + (sumSatNormVal > 0 ? sumSatNormVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_sat_ot">' + (sumSatOtVal > 0 ? sumSatOtVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_sat_night">' + (sumSatNightVal > 0 ? sumSatNightVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_holi_norm">' + (sumHoliNormVal > 0 ? sumHoliNormVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_holi_ot">' + (sumHoliOtVal > 0 ? sumHoliOtVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_holi_night">' + (sumHoliNightVal > 0 ? sumHoliNightVal.toFixed(1) : '') + '</td>';
			html += '<td id="sum_deduct">' + (deductTimeTotal > 0 ? deductTimeTotal.toFixed(1) : '') + '</td>'; // 공제확인 월 합계
			html += '<td></td>'; // 출장대기수당(합계 의미 없음)
			html += '<td style="font-size: 10px;">(시간합계)</td>';
			var totalHours = sumNorm + sumOt + sumNight + sumSatNormVal + sumSatOtVal + sumSatNightVal + sumHoliNormVal + sumHoliOtVal + sumHoliNightVal;
			html += '<td id="sum_total_hours" style="text-align: right; padding: 0;">' + (totalHours > 0 ? totalHours.toFixed(1) : '') + '</td>';
			html += '</tr>';

			// 가중시간 = 정상*1 + 연장*1.5 + 야간*2 (시급직/연봉직/토요일/휴일 모두 동일 가중치 적용)
			// 평일: 정상 + 연장*1.5 + 야간*2
			var weightedNorm = (sumNorm * 1) + (sumOt * 1.5) + (sumNight * 2);
			// 토요일: 정상*1.5 + 연장*1.5 + 야간*2 (정상은 별도로 토요일이므로 1.5배)
			var weightedSat = (sumSatNormVal * 1.5) + (sumSatOtVal * 1.5) + (sumSatNightVal * 2);
			// 휴일: 정상*1.5 + 연장*2 + 야간*2.5 (엑셀 원본 서식 공식 기준)
			var weightedHoli = (sumHoliNormVal * 1.5) + (sumHoliOtVal * 2) + (sumHoliNightVal * 2.5);
			var weightedGrand = weightedNorm + weightedSat + weightedHoli;

			html += '<tr class="bg-summary">';
			html += '<td colspan="2" style="font-size: 10px;">가중시간계</td>';
			html += '<td style="font-size: 10px;">(평일)</td>';
			html += '<td id="weighted_norm" colspan="2" style="text-align: center;">' + (weightedNorm > 0 ? weightedNorm.toFixed(1) : '') + '</td>';
			html += '<td class="bg-cat-sat" style="font-size: 10px;">(토)</td>';
			html += '<td id="weighted_sat" colspan="2" class="bg-cat-sat" style="text-align: center;">' + (weightedSat > 0 ? weightedSat.toFixed(1) : '') + '</td>';
			html += '<td class="bg-cat-holi" style="font-size: 10px;">(휴일)</td>';
			html += '<td id="weighted_holi" colspan="2" class="bg-cat-holi" style="text-align: center;">' + (weightedHoli > 0 ? weightedHoli.toFixed(1) : '') + '</td>';
			html += '<td colspan="3" class="bg-cat-total-label" style="font-size: 10px;">(가중시간 합계)</td>';
			html += '<td id="weighted_grand" class="bg-cat-total" style="text-align: right; padding: 0;">' + (weightedGrand > 0 ? weightedGrand.toFixed(1) : '') + '</td>';
			html += '</tr>';

			html += '<tr class="bg-summary">';
			html += '<td colspan="2">공제시간</td>';
			html += '<td id="sum_deduct_summary" colspan="3" class="bg-cat-deduct" style="font-size: 10px;">' + (deductTimeTotal > 0 ? deductTimeTotal.toFixed(1) : '') + '</td>';
			html += '<td colspan="6"></td>';
			html += '<td colspan="2" style="font-size: 10px;">지각합계 </td>';
			html += '<td style="font-size: 10px;">조퇴합계</td>';
			html += '<td style="font-size: 10px;">휴가합계</td>';
			html += '</tr>';

			html += '<tr class="bg-pay-summary">';
			html += '<td colspan="2">급여시간</td>';
			// 급여시간: 209시간 (법정 기준 고정값)
			html += '<td>209.00</td>';
			html += '<td id="pay_ot">' + (sumOt > 0 ? sumOt.toFixed(2) : '') + '</td>';
			html += '<td></td>';
			html += '<td id="pay_sat_norm" class="bg-cat-sat">' + (sumSatNormVal > 0 ? sumSatNormVal.toFixed(2) : '') + '</td>';
			html += '<td class="bg-cat-sat"></td><td class="bg-cat-sat"></td>';
			html += '<td id="pay_holi_norm" class="bg-cat-holi">' + (sumHoliNormVal > 0 ? sumHoliNormVal.toFixed(2) : '') + '</td>';
			html += '<td class="bg-cat-holi"></td><td class="bg-cat-holi"></td><td colspan="2">' + lateCntTotal + '</td>';
			html += '<td>' + earlyCntTotal + '</td>';
			html += '<td>' + vacationCntTotal + '</td>';
			html += '</tr>';

			html += '</tfoot></table>';
			html += '<div class="footer-note">※ 기본급 지급의 기준은 209시간이며, 공제시간을 뺀 시간으로 정산.,  비고란에 지각, 조퇴, 휴가(연차,포상), 공휴일 기록</div>';
			return html;
		}
	</script>

</body>
</html>
