<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1"/>
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<title>근태마감관리</title>

	<!-- Bootstrap & Common CSS -->
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">

	<!-- Common -->
	<link rel="stylesheet" href="/static/css/gnb.css">
	<link rel="stylesheet" href="/static/css/main.css">
	<link rel="stylesheet" href="/static/css/sub.css">
	<link rel="stylesheet" href="/static/css/common.css">

	<!-- jQuery & Libraries -->
	<script type="text/javascript" src="/static/js/jquery-latest.min.js"></script>
	<script type="text/javascript" src="/static/bootstrap/js/bootstrap.min.js"></script>

	<!-- Global & Common -->
	<script type="text/javascript" src="/static/js/global.js"></script>

	<style>
		.close-management-container {
			max-width: 800px;
			margin: 30px auto;
			padding: 30px;
			background: #ffffff;
			border: 1px solid #c2cad3;
			border-radius: 4px;
			box-shadow: 0 2px 5px rgba(0,0,0,0.05);
		}

		.close-info-panel {
			background: #f1f5f9;
			border-left: 4px solid #3b82f6;
			padding: 20px;
			margin-bottom: 30px;
			border-radius: 4px;
		}

		.close-info-panel h4 {
			margin-top: 0;
			color: #1e293b;
			font-weight: bold;
		}

		.close-info-row {
			display: flex;
			align-items: center;
			margin-bottom: 15px;
		}

		.close-info-row:last-child {
			margin-bottom: 0;
		}

		.close-info-label {
			font-weight: bold;
			color: #475569;
			min-width: 120px;
		}

		.close-info-value {
			color: #1e293b;
			font-size: 16px;
			padding: 8px 12px;
			background: #ffffff;
			border: 1px solid #cbd5e1;
			border-radius: 3px;
			flex: 1;
		}

		.close-info-value.active {
			color: #d90429;
			font-weight: bold;
		}

		.form-section {
			margin-bottom: 30px;
		}

		.form-section h5 {
			color: #1e293b;
			font-weight: bold;
			margin-bottom: 15px;
			padding-bottom: 10px;
			border-bottom: 2px solid #cbd5e1;
		}

		.form-group-row {
			display: flex;
			align-items: center;
			gap: 15px;
			margin-bottom: 15px;
		}

		.form-group-row label {
			font-weight: bold;
			color: #475569;
			min-width: 100px;
			margin: 0;
		}

		.form-group-row input[type="month"] {
			flex: 1;
			max-width: 200px;
		}

		.input-hint {
			font-size: 12px;
			color: #64748b;
			margin-top: 5px;
		}

		.button-group {
			display: flex;
			gap: 10px;
			margin-top: 30px;
			justify-content: center;
		}

		.btn-primary-custom, .btn-danger-custom {
			padding: 10px 30px;
			font-weight: bold;
			border: none;
			border-radius: 4px;
			cursor: pointer;
			transition: all 0.3s ease;
			font-size: 14px;
			text-align: center;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
		}

		.btn-primary-custom {
			background: #3b82f6;
			color: #ffffff;
		}

		.btn-primary-custom:hover {
			background: #2563eb;
		}

		.btn-danger-custom {
			background: #ef4444;
			color: #ffffff;
		}

		.btn-danger-custom:hover {
			background: #dc2626;
		}

		.btn-disabled {
			opacity: 0.5;
			cursor: not-allowed;
		}

		.alert-warning-custom {
			background: #fef3c7;
			border: 1px solid #fcd34d;
			border-left: 4px solid #f59e0b;
			color: #92400e;
			padding: 15px;
			border-radius: 4px;
			margin-bottom: 20px;
			font-size: 13px;
			line-height: 1.5;
		}

		.alert-success-custom {
			background: #dcfce7;
			border: 1px solid #bbf7d0;
			border-left: 4px solid #22c55e;
			color: #166534;
			padding: 15px;
			border-radius: 4px;
			margin-top: 15px;
			font-size: 13px;
		}
	</style>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">

		<input type="hidden" id="pgmId" name="pgmId" value="PM3003M01">

		<div class="close-management-container">
			<!-- 페이지 제목 -->
			<h2 style="text-align: center; color: #1e293b; margin-bottom: 30px; font-weight: bold;">
				<i class="fas fa-lock" style="margin-right: 10px; color: #3b82f6;"></i>근태마감관리
			</h2>

			<!-- 현재 마감 상태 표시 -->
			<div class="close-info-panel">
				<h4><i class="fas fa-info-circle"></i> 현재 마감 상태</h4>
				<div class="close-info-row">
					<div class="close-info-label">마감 년월:</div>
					<div class="close-info-value" id="currentCloseYmDisplay">
						조회 중...
					</div>
				</div>
				<div class="close-info-row" style="font-size: 12px; color: #64748b;">
					<i class="fas fa-check-circle" style="color: #22c55e; margin-right: 5px;"></i>
					마감 연월 이하의 모든 근태 자료(근태변환, 휴가, 출장, 휴일대체근무)는 수정 불가
				</div>
			</div>

			<!-- 마감 설정 섹션 -->
			<div class="form-section">
				<h5><i class="fas fa-cog" style="margin-right: 8px;"></i>마감 설정</h5>

				<div class="alert-warning-custom">
					<i class="fas fa-exclamation-triangle" style="margin-right: 8px;"></i>
					<strong>주의:</strong> 마감 연월을 설정하면 해당 연월 이하의 모든 근태 자료는 등록, 수정, 삭제가 불가능하게 됩니다. 신중하게 처리해주십시오.
				</div>

				<div class="form-group-row">
					<label for="closeYmInput">마감 년월:</label>
					<input type="month" id="closeYmInput" class="form-control input-sm" placeholder="YYYY-MM" style="flex: 1; max-width: 200px;">
					<div class="input-hint">예: 2026-09 (2026년 9월 및 그 이전 모두 잠금)</div>
				</div>

				<div class="button-group">
					<button type="button" class="btn-primary-custom" id="btnSetClose" onclick="setCloseYm();">
						<i class="fas fa-lock"></i> 마감 설정
					</button>
					<button type="button" class="btn-danger-custom" id="btnReleaseClose" onclick="releaseCloseYm();">
						<i class="fas fa-unlock"></i> 마감 해제
					</button>
				</div>

				<div id="messageArea" style="margin-top: 20px;"></div>
			</div>
		</div>

	</div>

	<script type="text/javascript">
		$(document).ready(function() {
			mainDefaultLoad("생산관리", "근태마감관리");
			loadCurrentCloseYm();
		});

		// 현재 마감 년월 조회
		function loadCurrentCloseYm() {
			var params = {};
			postAjax('/user/pm/pm30/selectAttendanceCloseYm', params, null, function(data) {
				if (data && data.resultCode === '0000') {
					var closeYm = data.closeYm;
					if (closeYm && closeYm.trim()) {
						$('#currentCloseYmDisplay').html(
							'<span class="active">' + formatCloseYm(closeYm) + '</span>'
						).removeClass('active').css('color', '#d90429');
						$('#btnReleaseClose').removeClass('btn-disabled');
					} else {
						$('#currentCloseYmDisplay').html(
							'<span style="color: #22c55e; font-weight: bold;">마감 없음 (전체 수정 가능)</span>'
						);
						$('#btnReleaseClose').addClass('btn-disabled').attr('disabled', 'disabled');
					}
				}
			});
		}

		// 마감 년월 포맷팅 (YYYYMM -> YYYY년 MM월)
		function formatCloseYm(ym) {
			if (!ym || ym.length !== 6) return ym;
			return ym.substring(0, 4) + '년 ' + ym.substring(4, 6) + '월';
		}

		// 마감 설정
		function setCloseYm() {
			var closeYmInput = $('#closeYmInput').val();
			if (!closeYmInput || !closeYmInput.trim()) {
				alert('마감 연월을 선택해주세요.');
				return;
			}

			// 형식 검증: YYYY-MM
			var match = closeYmInput.match(/^(\d{4})-(\d{2})$/);
			if (!match) {
				alert('올바른 형식이 아닙니다. (YYYY-MM)');
				return;
			}

			var closeYm = match[1] + match[2]; // YYYYMM 형식으로 변환

			var confirmMsg = formatCloseYm(closeYm) + '을(를) 마감하시겠습니까?\n\n';
			confirmMsg += '정말 마감하시겠습니까? 이 연월 이하 근태/휴가/출장/휴일대체근무 자료는 수정·삭제가 불가능해집니다.';

			if (!confirm(confirmMsg)) {
				return;
			}

			var params = {
				closeYm: closeYm,
				loginId: (typeof jwt !== 'undefined' ? jwt.userId : '')
			};

			postAjax('/user/pm/pm30/saveAttendanceCloseYm', params, null, function(data) {
				if (data && data.resultCode === '0000') {
					$('#messageArea').html(
						'<div class="alert-success-custom">' +
						'<i class="fas fa-check-circle"></i> ' + formatCloseYm(closeYm) + '이 마감되었습니다.' +
						'</div>'
					);
					$('#closeYmInput').val('');
					setTimeout(function() {
						loadCurrentCloseYm();
						$('#messageArea').html('');
					}, 2000);
				} else {
					alert('마감 설정 실패: ' + (data ? data.resultMessage : '알 수 없는 오류'));
				}
			});
		}

		// 마감 해제
		function releaseCloseYm() {
			var confirmMsg = '마감을 해제하시겠습니까?\n현재 마감된 모든 근태 자료의 수정·삭제가 다시 가능하게 됩니다.';

			if (!confirm(confirmMsg)) {
				return;
			}

			var params = {
				closeYm: '',
				loginId: (typeof jwt !== 'undefined' ? jwt.userId : '')
			};

			postAjax('/user/pm/pm30/saveAttendanceCloseYm', params, null, function(data) {
				if (data && data.resultCode === '0000') {
					$('#messageArea').html(
						'<div class="alert-success-custom">' +
						'<i class="fas fa-check-circle"></i> 마감이 해제되었습니다. 모든 근태 자료 수정이 가능합니다.' +
						'</div>'
					);
					$('#closeYmInput').val('');
					setTimeout(function() {
						loadCurrentCloseYm();
						$('#messageArea').html('');
					}, 2000);
				} else {
					alert('마감 해제 실패: ' + (data ? data.resultMessage : '알 수 없는 오류'));
				}
			});
		}
	</script>

</body>
</html>
