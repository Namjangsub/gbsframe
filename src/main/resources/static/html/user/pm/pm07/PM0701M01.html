<script type="text/javascript">

	// 결재상태 신호등 포맷터 (표준 결재상태 코드 대응)
	ax5.ui.grid.formatter["sanctnStsFormatter"] = function () {
		var v = this.value;
		if (!v) return "";
		var stsMap = {
			"TEMP":     '<span style="color:#888888; font-size:12px;">●</span> 임시저장',
			"SANCTN01": '<span style="color:#888888; font-size:12px;">●</span> 임시저장',
			"REQ":      '<span style="color:#f0ad4e; font-size:12px;">●</span> 승인요청',
			"SANCTN02": '<span style="color:#f0ad4e; font-size:12px;">●</span> 승인요청',
			"ING":      '<span style="color:#5cb85c; font-size:12px;">●</span> 진행중',
			"SANCTN03": '<span style="color:#5cb85c; font-size:12px;">●</span> 진행중',
			"END":      '<span style="color:#337ab7; font-size:12px;">●</span> 완료',
			"SANCTN04": '<span style="color:#337ab7; font-size:12px;">●</span> 완료',
			"RTN":      '<span style="color:#d9534f; font-size:12px;">●</span> 반려',
			"SANCTN05": '<span style="color:#d9534f; font-size:12px;">●</span> 반려'
		};
		return stsMap[v] || v;
	};

	// 날짜 포맷터 (YYYYMMDD -> YYYY-MM-DD)
	ax5.ui.grid.formatter["formatDate"] = function () {
		var v = this.value;
		if (!v) return "";
		var s = String(v).replace(/\-/g, "");
		if (s.length < 8) return v;
		return s.substring(0, 4) + "-" + s.substring(4, 6) + "-" + s.substring(6, 8);
	};

	// 시각 포맷터 (HHMM -> HH:MM)
	ax5.ui.grid.formatter["formatTime"] = function () {
		var v = this.value;
		if (!v) return "";
		var s = String(v).replace(/:/g, "");
		if (s.length < 4) return v;
		return s.substring(0, 2) + ":" + s.substring(2, 4);
	};

	// 오전오후 포맷터 (PM07AMPM01 -> 오전, PM07AMPM02 -> 오후)
	ax5.ui.grid.formatter["ampmFormatter"] = function () {
		var v = this.value;
		if (this.item && this.item.ampmNm) return this.item.ampmNm;
		if (!v) return "";
		if (v === "PM07AMPM01" || v === "PM07AMPM10" || v === "AM") return "오전";
		if (v === "PM07AMPM02" || v === "PM07AMPM20" || v === "PM") return "오후";
		return v;
	};

	// 기본 컬럼 정의 (사용자별 컬럼설정 병합 대상)
	var defaultColumns = [
		 {key: "coCd",        label: "회사코드",     width:  80, align: "center", hidden: true}
		,{key: "sanctnSts",   label: "결재상태",     width:  80, align: "left", formatter: "sanctnStsFormatter"}
		,{key: "reqTitl",     label: "신청이름",     width: 80, align: "center"}
		,{key: "reqDeptId",   label: "부서코드",     width:  90, align: "center", hidden: true}
		,{key: "reqDeptNm",   label: "부서",        width: 100, align: "left"}
		,{key: "vacTypeCd",   label: "휴가유형코드", width:  90, align: "center", hidden: true}
		,{key: "vacTypeNm",   label: "휴가유형",     width: 130, align: "left"}
		,{key: "ampmCd",      label: "AMPM",        width:  60, align: "center", formatter: "ampmFormatter"}
		,{key: "stDt",        label: "시작일",       width:  80, align: "center"}
		,{key: "edDt",        label: "종료일",       width:  80, align: "center"}
		,{key: "stTm",        label: "시작시각",     width:  70, align: "center", hidden: true}
		,{key: "edTm",        label: "종료시각",     width:  70, align: "center", hidden: true}
		,{key: "vacDays",     label: "휴가일수",     width:  70, align: "right"}
		,{key: "deductDays",  label: "차감일수",     width:  70, align: "right"}
		,{key: "reqRmk",      label: "신청사유",     width: 240, align: "left"}
		,{key: "mngRmk",      label: "근태담당자사유", width: 240, align: "left", editor: {type: "text"}}
		,{key: "reqId",       label: "등록사번",   width:  70, align: "center", hidden: true}
		,{key: "reqIdNm",     label: "등록",       width:  70, align: "center"}
		,{key: "creatDttm",   label: "등록일시",     width: 130, align: "center"}
		,{key: "reqNo",       label: "신청번호",     width: 120, align: "center"}
	];

	// 동적 반응형 그리드 높이 조절 함수
	function adjustGridHeight() {
		var winHeight = $(window).height();
		var isIframe = (window.self !== window.top);
		if (isIframe) {
			try {
				if (window.top.innerHeight) winHeight = window.top.innerHeight;
			} catch (e) {
				winHeight = $(window).height();
			}
		}

		var $grid = $('[data-ax5grid="first-grid"]');
		if ($grid.length > 0) {
			var gridTop = $grid.offset().top || 200;
			var availableH = winHeight - gridTop - 20;
			if (availableH < 350) availableH = 350;
			$grid.css("height", availableH + "px");
		}

		if (gridView && gridView.target && gridView.target.align) {
			gridView.target.align();
		}
	}

	$(window).on("resize", function() {
		adjustGridHeight();
	});

	// 사용자별 컬럼 설정 팝업 호출
	function openGridColumnConfig() {
		GridColumnConfig.openEditor("PM0701M01", "first-grid", defaultColumns, function() {
			$('[data-ax5grid="first-grid"]').empty();
			gridView.initView().setData(0);
		});
	}

	// 근태관리 담당자 전용 권한 체크 함수 (SPECRTS18 공통코드 등록 사번 순수 동적 검증)
	function isMngUser() {
		var isMng = false;
		if (jwt && jwt.userId) {
			postAjaxSync("/admin/cm/cm05/selectChildCodeList", { "codeId": "SPECRTS18" }, null, function(data) {
				var list = (data && data.childCodeList) ? data.childCodeList : [];
				if (list.length > 0) {
					var codeEtc = list[0].codeEtc || '';
					if (codeEtc) {
						var idList = codeEtc.split(',').map(function(id) { return $.trim(id).toLowerCase(); });
						if (idList.indexOf(String(jwt.userId).toLowerCase()) >= 0) {
							isMng = true;
						}
					}
				}
			});
		}
		return isMng;
	}

	var gridView = {
		initView : function() {
			adjustGridHeight();

			// 근태담당자 권한이 있는 경우에만 근태담당자사유(mngRmk) 편집 허용
			var isMng = isMngUser();
			defaultColumns.forEach(function(col) {
				if (col.key === "mngRmk") {
					col.editor = isMng ? {type: "text"} : false;
				}
			});

			var cols = GridColumnConfig.apply("PM0701M01", "first-grid", defaultColumns);
			this.target = new ax5.ui.grid();
			this.target.setConfig({
				showLineNumber : true,
				lineNumberColumnWidth : 40,
				showRowSelector : true,
				multipleSelect : false,
				sortable : true,
				target : $('[data-ax5grid="first-grid"]'),
				header : {
					align : "center",
					selector : false
				},
				body : {
					onClick : function() {
						this.self.select(this.dindex);
					},
					onDBLClick : function() {
						openVacationModal("U");
					},
					onDataChanged : function() {
						if (this.key === "mngRmk") {
							if (!isMngUser()) {
								alert("근태담당자만 근태담당자사유를 수정할 수 있습니다.");
								return;
							}
							var newVal = (this.value !== undefined && this.value !== null) ? String(this.value).trim() : "";
							var oldVal = (this.oldValue !== undefined && this.oldValue !== null) ? String(this.oldValue).trim() : "";
							if (newVal === oldVal) {
								return; // 값이 변경되지 않았으면 DB 저장 스킵
							}
							var item = this.item;
							var paramObj = {
								 "coCd"   : item.coCd || "GUN"
								,"reqNo"  : item.reqNo
								,"mngRmk" : item.mngRmk || ""
								,"userId" : jwt.userId
							};
							postAjax("/user/pm/pm07/updateMngRmk", paramObj, null, function(data) {
								if (data.resultCode == 200) {
									if (typeof toast !== "undefined" && toast.push) {
										toast.push("근태담당자 사유가 자동 저장되었습니다.");
									}
								} else {
									alert("저장 실패: " + data.resultMessage);
								}
							});
						}
					}
				},
				page : {
					display : true,
					navigationItemCount : 10,
					height : 30,
					onChange : function() {
						gridView.setData(this.page.selectPage);
					}
				},
				columns : cols
			});
			return this;
		},
		setData : function(_pageNo) {
			var pageNo = _pageNo || 0;
			var formData = {
				 "coCd"       : "GUN"
				,"reqDtFrom"  : $('#reqDtFrom_S').val().replace(/\-/g, '')
				,"reqDtTo"    : $('#reqDtTo_S').val().replace(/\-/g, '')
				,"vacTypeCd"  : $('#vacTypeCd_S').val()
				,"sanctnSts"  : $('#sanctnSts_S').val()
				,"reqId"      : $('#reqId_S').val()
				,"reqIdNm"    : $('#reqIdNm_S').val()
				,"reqDeptId"  : $('#reqDeptId_S').val()
				,"reqDeptNm"  : $('#reqDeptNm_S').val()
				,"pageNo"     : pageNo + 1
				,"recordCnt": 100
			};
			postAjax("/user/pm/pm07/selectVacationList", formData, null, function(data) {
				try {
					gridView.target.setData({
						list : data.result,
						page : {
							currentPage   : pageNo,
							pageSize      : data.paginationInfo.pageSize,
							totalElements : data.paginationInfo.totalRecordCount,
							totalPages    : data.paginationInfo.totalPageCount
						}
					});
				} catch (error) {
					alert("오류 발생!! 전산실 연락 바랍니다");
					return null;
				}
			});
		}
	};

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("생산관리", "휴가신청");
		// 공통코드 set (검색영역만 - 모달과 DOM 을 공유하므로 범위 한정)
		setCommonSelect($("#main_area .contents.search select[data-kind]"));

		// 휴가유형 검색 조건에 '전체' 옵션 보장
		if ($('#vacTypeCd_S option[value=""]').length == 0) {
			$('#vacTypeCd_S').prepend('<option value="" selected>전체</option>');
		}
		$('#vacTypeCd_S').val("");

		$('#coCd_S').val("GUN");
		// 처음 화면 로딩 시 로그인한 본인 아이디 기본 설정 (본인 데이터 우선 조회)
		$('#reqId_S').val(jwt.userId);
		$('#reqIdNm_S').val(jwt.userNm);

		// 시작일/종료일 셋팅 (3개월 전 1일 ~ 당월 말일)
		$('#reqDtFrom_S').val(moment().subtract(3, 'months').startOf('month').format("YYYY-MM-DD"));
		$('#reqDtTo_S').val(moment().endOf('month').format("YYYY-MM-DD"));

		// 날짜 범위 선택기
		$('#reqDtFrom_S, #reqDtTo_S').on('click', function(){
			DateRangePicker.open({
				startDt: $('#reqDtFrom_S').val() || null,
				endDt:   $('#reqDtTo_S').val()   || null,
				excludeSelectors: ['#reqDtFrom_S', '#reqDtTo_S'],
				onApply: function(sd, ed){
					$('#reqDtFrom_S').val(sd);
					$('#reqDtTo_S').val(ed);
					gridView.setData(0);
				}
			});
		});

		gridView.initView().setData(0);

		authChk("PM0701M01");
	});

	// 검색 버튼
	function DataSearch() {
		gridView.setData(0);
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$('#coCd_S').val("GUN");
		$('#vacTypeCd_S').val("");
		$('#sanctnSts_S').val("");
		$('#reqDtFrom_S').val(moment().subtract(3, 'months').startOf('month').format("YYYY-MM-DD"));
		$('#reqDtTo_S').val(moment().endOf('month').format("YYYY-MM-DD"));
		gridView.setData(0);
	}

	// 엑셀 다운로드
	function excelDown() {
		var targetObj = gridView.target;
		if (targetObj.list.length == 0) {
			alert("출력할 목록이 없습니다.");
			return;
		}
		targetObj.exportExcel("휴가신청_" + moment().format("YYYYMMDD") + ".xls");
	}

	// 선택 행 취득
	function getSelectedRow() {
		var list = gridView.target.getList("selected");
		if (!list || list.length < 1) {
			alert("대상 자료를 선택하세요.");
			return null;
		}
		return list[0];
	}

	// 신청 등록 / 수정 모달
	function openVacationModal(_actionType) {
		var actionType = (_actionType == "U") ? "U" : "C";
		var paramObj = {
			 "actionType" : actionType
			,"coCd"       : "GUN"
			,"userId"     : jwt.userId
			,"userNm"     : jwt.userNm
			,"pgmId"      : "PM0701P01"
		};

		if (actionType == "U") {
			var row = getSelectedRow();
			if (!row) return;

			$.each(row, function(key, val) {
				paramObj[key] = (typeof(val) == "undefined") ? "" : val;
			});
			paramObj.coCd = "GUN";
		}

		openModal("/static/html/user/pm/pm07/PM0701P01.html", 1100, 700, "", paramObj, function(data) {
			gridView.setData(0);
		});
	}

	// 삭제
	function deleteVacation() {
		var row = getSelectedRow();
		if (!row) return;

		if (!confirm("삭제하시겠습니까?")) return;

		var formData = {
			 "coCd"   : "GUN"
			,"reqNo"  : row.reqNo
			,"userId" : jwt.userId
			,"pgmId"  : "PM0701M01"
		};
		putAjax("/user/pm/pm07/deleteVacation", formData, null, function(data) {
			alert(data.resultMessage);
			if (data.resultCode == 200) {
				gridView.setData(0);
			}
		});
	}



	// 신청자(사원) 검색
	function openReqUserTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"userId" : $('#reqId' + sfx).val()
			,"userNm" : $('#reqIdNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "신청자 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			if (!checkedNode || checkedNode.type != 'person') {
				alert("사원을 선택하세요.");
				return;
			}
			$('#reqId' + sfx).val(checkedNode.id);
			$('#reqIdNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}

	// 부서 검색
	function openReqDeptTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"deptId" : $('#reqDeptId' + sfx).val()
			,"deptNm" : $('#reqDeptNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/deptSearch.html", 300, 500, "부서 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#reqDeptId' + sfx).val(checkedNode.id);
			$('#reqDeptNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}

	// 연차부여 (사원·연도별) 내역 전체 입력/수정/조회 관리 모달 오픈
	function openAnnualGrantModal() {
		var paramObj = {
			"coCd": "GUN",
			"yy": moment().format("YYYY")
		};
		openModal("/static/html/user/pm/pm07/PM0701P02.html", 1200, 900, "연차부여 내역 관리 (사원·연도별)", paramObj);
	}

</script>
