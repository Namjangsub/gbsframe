<!--
	========================================================================================
	[PM0711M01.html] 연차 사용 현황 화면 (PM0701P02.html 팝오버 톤앤매너 계승)
	----------------------------------------------------------------------------------------
	1. 직종 구분 (TB_CM06M01.SALES_AREA 기준):
	   - SALESAREA60 : 생산직
	   - SALESAREA00 : 임원 (※ 연차 대상 제외: U.SALES_AREA != 'SALESAREA00')
	   - 기타/NULL   : 사무직 (U.SALES_AREA IS NULL OR U.SALES_AREA != 'SALESAREA60')
	2. 부서 코드 및 정렬:
	   - 부서 매핑: VIEW_DEPT_ID (SUBSTR(NVL(U.VIEW_DEPT_ID, U.DEPT_ID), 1, 5)) 상위 5자리
	   - 제외 부서: GUN95xx (실적관리용/특수부서 제외)
	   - 정렬 순서: D.SORT_NO ASC, A.DEPT_NM ASC, A.USER_NM ASC (조직도 기본 정렬순)
	3. 실시간 팝오버 호버 툴팁 기능 (showVacationPopover):
	   - 1월~12월 수치 셀 마우스 호버/클릭 시 /user/pm/pm07/selectVacationCalendarList 실시간 호출
	   - PM0701P02.html 의 vacation-info-popover 디자인 및 파란색 돋보기 포맷터 100% 동일 계승
	   - 연차 (1일), 반차/오전/오후반차 (0.5일) 상세 신청서 사유 [REQ_RMK] 실시간 표시
	========================================================================================
-->

/* PM0701P02.html 메모 팝오버 디자인 톤앤매너 100% 계승 툴팁 레이어 */
.vacation-info-popover {
	position: absolute;
	z-index: 999999;
	display: none;
	background: #ffffff;
	border: 1px solid #337ab7;
	border-radius: 5px;
	box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
	padding: 10px 14px;
	min-width: 240px;
	max-width: 360px;
	font-size: 12px;
	color: #333333;
	pointer-events: auto;
}
.vacation-info-popover .popover-title {
	font-weight: bold;
	color: #337ab7;
	border-bottom: 1px solid #e9ecef;
	padding-bottom: 5px;
	margin-bottom: 6px;
	font-size: 12px;
}
.vacation-info-popover .popover-item {
	padding: 4px 0;
	line-height: 1.4;
	color: #444444;
	border-bottom: 1px dashed #f0f0f0;
}
.vacation-info-popover .popover-item:last-child {
	border-bottom: none;
}

	<script type="text/javascript">
		var statusGridView = {
			initView: function() {
				this.target = new ax5.ui.grid();
				this.target.setConfig({
					target: $('[data-ax5grid="statusGridView"]'),
					showLineNumber: false,
					showRowSelector: false,
					multipleSelect: false,
					sortable: true,
					header: {
						align: "center",
						columnHeight: 28,
						columns: [
							{key: "no",           label: "NO",       rowspan: 2, width: 45},
							{key: "deptNm",       label: "부서",     rowspan: 2, width: 120},
							{key: "userNm",       label: "이름",     rowspan: 2, width: 90},
							{label: "근무기간",   colspan: 3},
							{key: "grantDays",    label: "연차휴가<br>발생일수", rowspan: 2, width: 75},
							{key: "prevDays",     label: "전년<br>연차",     rowspan: 2, width: 60},
							{label: "연차휴가사용내역", colspan: 12},
							{key: "usedDaysSum",  label: "연차휴가<br>사용일수", rowspan: 2, width: 75},
							{key: "balanceDays",  label: "미사용<br>일수",     rowspan: 2, width: 70},
							{key: "rmk",          label: "비고",     rowspan: 2, width: 110}
						]
					},
					body: {
						mergeCells: ['deptNm'],
						columnHeight: 26,
						trStyleClass: function() {
							if (this.item && this.item.useYn === 'N') {
								return "grid-font-red-strikethrough";
							}
							return "";
						},
						onClick: function() {
							this.self.select(this.dindex);
							if (this.column.key && (this.column.key.indexOf('m') === 0 || this.column.key === 'usedDaysSum')) {
								var $cell = $(this.element);
								if ($cell.length === 0 || typeof $cell.offset !== 'function' || !$cell.offset()) {
									$cell = $('[data-ax5grid="statusGridView"] [data-ax5grid-data-index="' + this.dindex + '"] [data-ax5grid-column-key="' + this.column.key + '"]');
								}
								showVacationPopover($cell, this.item, this.column.key);
							}
						}
					},
					page: {
						display: false
					},
					columns: [
						 {key: "no",           label: "NO",       width:  45, align: "center", formatter: function() { return this.dindex + 1; }}
						,{key: "deptNm",       label: "부서",     width: 120, align: "left"}
						,{key: "userNm",       label: "이름",     width:  90, align: "center"}
						,{key: "enterDt",      label: "입사일자", width: 100, align: "center"}
						,{key: "baseDt",       label: "기준일자", width: 100, align: "center"}
						,{key: "workYears",    label: "근속연수", width: 100, align: "center"}
						,{key: "grantDays",    label: "발생일수", width:  75, align: "center", formatter: "zeroEmptyFormatter"}
						,{key: "prevDays",     label: "전년연차", width:  60, align: "center", formatter: "zeroEmptyFormatter"}
						,{key: "m01",          label: "1월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m01"), styleClass: makeMonthCellStyleClass(1)}
						,{key: "m02",          label: "2월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m02"), styleClass: makeMonthCellStyleClass(2)}
						,{key: "m03",          label: "3월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m03"), styleClass: makeMonthCellStyleClass(3)}
						,{key: "m04",          label: "4월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m04"), styleClass: makeMonthCellStyleClass(4)}
						,{key: "m05",          label: "5월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m05"), styleClass: makeMonthCellStyleClass(5)}
						,{key: "m06",          label: "6월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m06"), styleClass: makeMonthCellStyleClass(6)}
						,{key: "m07",          label: "7월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m07"), styleClass: makeMonthCellStyleClass(7)}
						,{key: "m08",          label: "8월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m08"), styleClass: makeMonthCellStyleClass(8)}
						,{key: "m09",          label: "9월",      width:  50, align: "center", formatter: makeMonthCellFormatter("m09"), styleClass: makeMonthCellStyleClass(9)}
						,{key: "m10",          label: "10월",     width:  50, align: "center", formatter: makeMonthCellFormatter("m10"), styleClass: makeMonthCellStyleClass(10)}
						,{key: "m11",          label: "11월",     width:  50, align: "center", formatter: makeMonthCellFormatter("m11"), styleClass: makeMonthCellStyleClass(11)}
						,{key: "m12",          label: "12월",     width:  50, align: "center", formatter: makeMonthCellFormatter("m12"), styleClass: makeMonthCellStyleClass(12)}
						,{key: "usedDaysSum",  label: "사용일수", width:  75, align: "center", styleClass: "grid-font-bold", formatter: "zeroEmptyFormatter"}
						,{key: "balanceDays",  label: "미사용일수",width: 70, align: "center", styleClass: "grid-font-blue-bold", formatter: "zeroEmptyFormatter"}
						,{key: "rmk",          label: "비고",     width: 110, align: "left"}
					]
				});
				return this;
			},
			setData: function(list) {
				var rawList = list || [];
				this.target.setData({
					list: rawList,
					page: { display: false, totalElements: rawList.length }
				});
				adjustGridHeightToWindow();
			}
		};

		// 0 또는 빈값은 공백("")으로 표기하는 포맷터
		ax5.ui.grid.formatter["zeroEmptyFormatter"] = function() {
			var val = Number(this.value);
			if (isNaN(val) || val === 0) return "";
			return val % 1 === 0 ? val : val.toFixed(1);
		};

		// 월별 연차 사용내역 포맷터 (PM0701P02.html usedDaysInfoFormatter 톤앤매너 계승)
		// 주의: AX5-Grid 포맷터 컨텍스트(this)는 value/item만 보장되고 this.column은 제공되지 않아
		// (실제로 항상 undefined) 컬럼키를 얻을 수 없었음 -> 컬럼별로 키를 클로저에 고정한 포맷터를 생성해서 해결
		function makeMonthCellFormatter(monthKey) {
			return function() {
				var val = Number(this.value);
				if (isNaN(val) || val === 0) return "";
				var displayVal = (val % 1 === 0 ? val : val.toFixed(1));
				return '<span class="used-days-info-trigger" data-col-key="' + monthKey + '" style="cursor: pointer; color: #337ab7; font-weight: bold;">' + displayVal + ' <i class="fas fa-search-plus" style="font-size: 10px; color: #5bc0de;"></i></span>';
			};
		}

		// 입사전월 및 퇴사일 이후 cell 배경색 스타일 클래스 판정 함수 (주황색 배경: .grid-cell-pre-enter)
		function makeMonthCellStyleClass(monthNum) {
			return function() {
				if (!this.item) return "";
				var currentYy = parseInt($('#yy_S').val() || moment().format("YYYY"), 10);

				// 1. 입사전월 체크
				if (this.item.enterDt) {
					var enterDt = String(this.item.enterDt).replace(/[^0-9]/g, '');
					if (enterDt.length >= 6) {
						var enterYear = parseInt(enterDt.substring(0, 4), 10);
						var enterMonth = parseInt(enterDt.substring(4, 6), 10);

						// 조회연도가 입사연도보다 이전이면 1~12월 모두 입사전월
						if (currentYy < enterYear) {
							return "grid-cell-pre-enter";
						}
						// 조회연도가 입사연도와 같고 해당 월이 입사월 이전이면 입사전월
						if (currentYy === enterYear && monthNum < enterMonth) {
							return "grid-cell-pre-enter";
						}
					}
				}

				// 2. 퇴사일 이후 체크
				if (this.item.leaveDt) {
					var leaveDt = String(this.item.leaveDt).replace(/[^0-9]/g, '');
					if (leaveDt.length >= 6) {
						var leaveYear = parseInt(leaveDt.substring(0, 4), 10);
						var leaveMonth = parseInt(leaveDt.substring(4, 6), 10);

						// 조회연도가 퇴사연도보다 이후이면 1~12월 모두 퇴사후월
						if (currentYy > leaveYear) {
							return "grid-cell-pre-enter";
						}
						// 조회연도가 퇴사연도와 같고 해당 월이 퇴사월 이후이면 퇴사후월
						if (currentYy === leaveYear && monthNum > leaveMonth) {
							return "grid-cell-pre-enter";
						}
					}
				}

				return "";
			};
		}

		var VACATION_POPOVER_TIMER = null;
		var VACATION_POPOVER_REQUEST_ID = 0; // 마우스를 빠르게 여러 월 셀로 옮길 때 늦게 도착한 이전 요청의 응답이 현재 팝업을 덮어쓰는 것을 막기 위한 순번
		var VACATION_POPOVER_SHOW_TIMER = null; // 마우스 호버 후 0.3초 이상 머물렀을 때만 조회하기 위한 지연 타이머

		function cancelVacationPopoverShow() {
			if (VACATION_POPOVER_SHOW_TIMER) {
				clearTimeout(VACATION_POPOVER_SHOW_TIMER);
				VACATION_POPOVER_SHOW_TIMER = null;
			}
		}

		// 사용일수 마우스 호버 시 백엔드 API("/user/pm/pm07/selectVacationCalendarList") 실시간 호출 팝오버 툴팁 표출 함수
		function showVacationPopover($el, item, colKey) {
			if (VACATION_POPOVER_TIMER) {
				clearTimeout(VACATION_POPOVER_TIMER);
				VACATION_POPOVER_TIMER = null;
			}

			var myRequestId = ++VACATION_POPOVER_REQUEST_ID;

			if (!$el || $el.length === 0 || typeof $el.offset !== 'function') {
				return;
			}
			var offset = $el.offset();
			if (!offset || typeof offset.top === 'undefined') {
				return;
			}

			var $pop = $('#vacationInfoPopover');
			if ($pop.length === 0) {
				$('body').append(
					'<div id="vacationInfoPopover" class="vacation-info-popover">' +
						'<div class="popover-title"><i class="fas fa-calendar-check"></i> <span id="popUserNm"></span> 님의 휴가신청 이력</div>' +
						'<div id="popContent"></div>' +
					'</div>'
				);
				$pop = $('#vacationInfoPopover');

				// 팝오버 창 위에 마우스가 위치했을 때 닫힘 방지
				$pop.on('mouseenter', function() {
					if (VACATION_POPOVER_TIMER) {
						clearTimeout(VACATION_POPOVER_TIMER);
						VACATION_POPOVER_TIMER = null;
					}
				}).on('mouseleave', function() {
					hideVacationPopoverImmediately();
				});
			}

			var userNm = (item ? (item.userNm || item.USER_NM || item.name) : '') || '사원';
			var userId = (item ? (item.userId || item.USER_ID || item.user_id || item.usrNm || item.id) : '');
			$('#popUserNm').text(userNm);

			var curYy = $('#yy_S').val() || moment().format("YYYY");
			var key = String(colKey || '').toLowerCase();
			var stDt = curYy + "0101";
			var edDt = curYy + "1231";
			var targetMonthStr = "";

			// 특정 월(m01~m12, m1~m12)을 마우스 호버했을 경우 해당 월의 범위(YYYYMM01 ~ YYYYMMLastDay) 설정
			var mMatch = key.match(/^m(\d{1,2})$/i);
			if (mMatch) {
				var monthInt = parseInt(mMatch[1], 10);
				if (monthInt >= 1 && monthInt <= 12) {
					var monthNum = (monthInt < 10 ? "0" : "") + monthInt; // "01" ~ "12"
					targetMonthStr = curYy + monthNum; // 예: "202601"
					var lastDay = moment(curYy + "-" + monthNum, "YYYY-MM").daysInMonth();
					stDt = curYy + monthNum + "01";
					edDt = curYy + monthNum + (lastDay < 10 ? "0" + lastDay : lastDay);
				}
			}

			$('#popContent').html('<div class="popover-item" style="color: #888888;"><i class="fas fa-spinner fa-spin"></i> 실시간 휴가이력 백엔드 조회 중...</div>');
			var elHeight = (typeof $el.outerHeight === 'function') ? $el.outerHeight() : 20;
			$pop.css({
				top: (offset.top + elHeight + 2) + 'px',
				left: Math.max(10, offset.left - 20) + 'px'
			}).show();

			var paramObj = {
				"coCd": $('#coCd_S').val() || "GUN",
				"reqId": userId,
				"userId": userId,
				"reqDtFrom": stDt,
				"reqDtTo": edDt,
				"stDt": stDt,
				"edDt": edDt
			};

			// 백엔드 API 실시간 조회를 실행하여 최신 휴가 신청서 내역을 가져와 표시 (해당 월 내역만 엄격 필터링)
			postAjax("/user/pm/pm07/selectVacationCalendarList", paramObj, null, function(data) {
				// 이 응답이 도착하기 전에 다른 월 셀로 마우스가 이동해 새 요청이 나갔다면(=이 요청이 더 이상 최신이 아니면) 무시
				if (myRequestId !== VACATION_POPOVER_REQUEST_ID) return;

				var list = data.result || data.resultList || data.list || [];
				var htmlStr = '';
				var validCount = 0;

				if (list && list.length > 0) {
					$.each(list, function(i, row) {
						// 공통코드(CODE_NM) 정제는 vacationColorConfig.js의 cleanVacationTypeNm() 공용 함수 사용
						var vNm = cleanVacationTypeNm(row.vacTypeNm || row.vac_type_nm) || '연차';

						var stVal = row.rawStDt || row.stDt || row.st_dt || '';
						var edVal = row.rawEdDt || row.edDt || row.ed_dt || '';
						var stCompact = String(stVal).replace(/[^0-9]/g, "").substring(0, 8);
						var edCompact = String(edVal).replace(/[^0-9]/g, "").substring(0, 8);

						// 특정 월(m01~m12) 호버 시, 해당 월(targetMonthStr: YYYYMM) 범위에 포함되는 휴가건만 엄격 체크!
						if (targetMonthStr) {
							var stMm = stCompact.substring(0, 6);
							var edMm = edCompact.substring(0, 6);
							if (!stMm || !edMm) return true;
							var inMonth = (stMm <= targetMonthStr && edMm >= targetMonthStr);
							if (!inMonth) return true; // 호버한 해당 월이 아니면 스킵!
						}

						// PM0701P02.html과 동일하게 연차 전용 코드만 표시한다.
						var vacTypeCd = row.vacTypeCd || row.vac_type_cd || '';
						if (/^PM07TYPE0[12]$/.test(vacTypeCd)) {
							var stDisp = row.stDt || row.st_dt || stVal;
							var edDisp = row.edDt || row.ed_dt || edVal;
							var dtText = formatVacationDateRange(stDisp, edDisp);
							var vDays = row.deductDays || row.deduct_days || row.vacDays || row.vac_days || '';
							if (!vDays || Number(vDays) === 0) {
								vDays = "1";
							}

							var daysText = ' (' + vDays + '일)';
							var rmk = row.reqRmk || row.req_rmk || row.rmk || '';
							var rmkText = rmk ? (' [' + $.trim(rmk) + ']') : '';

							htmlStr += '<div class="popover-item"><i class="fas fa-check-circle" style="color: #337ab7; margin-right: 5px;"></i> ' + dtText + ' ' + vNm + daysText + rmkText + '</div>';
							validCount++;
						}
					});
				}

				if (validCount === 0) {
					htmlStr = '<div class="popover-item" style="color: #888888;">등록된 연차/반차 상세 신청 이력이 없습니다.</div>';
				}

				$('#popContent').html(htmlStr);
			});
		}

		function hideVacationPopover() {
			cancelVacationPopoverShow();
			if (VACATION_POPOVER_TIMER) {
				clearTimeout(VACATION_POPOVER_TIMER);
			}
			VACATION_POPOVER_TIMER = setTimeout(function() {
				$('#vacationInfoPopover').hide();
				VACATION_POPOVER_TIMER = null;
			}, 300);
		}

		function hideVacationPopoverImmediately() {
			cancelVacationPopoverShow();
			if (VACATION_POPOVER_TIMER) {
				clearTimeout(VACATION_POPOVER_TIMER);
				VACATION_POPOVER_TIMER = null;
			}
			$('#vacationInfoPopover').hide();
		}

		// PM0701P02.html 그리드 셀 마우스 호버/클릭 이벤트 바인딩 100% 동일 구현
		$(document).off('mouseenter mouseleave click', '.used-days-info-trigger, [data-ax5grid="statusGridView"] [data-ax5grid-column-attr]');
		$(document).on({
			mouseenter: function(e) {
				var $el = $(this);
				var $tr = $el.closest('[data-ax5grid-data-index]');
				var rowIdx = $tr.attr('data-ax5grid-data-index');
				var colKey = $el.attr('data-col-key');
				if (!colKey) {
					var $td = $el.closest('[data-ax5grid-column-key], [data-ax5grid-column-attr]');
					colKey = $td.attr('data-ax5grid-column-key') || $td.attr('data-ax5grid-column-attr');
				}

				cancelVacationPopoverShow();
				if (rowIdx !== undefined && statusGridView.target.list && statusGridView.target.list[rowIdx]) {
					var item = statusGridView.target.list[rowIdx];
					// 마우스가 0.3초 이상 해당 셀에 머무른 경우에만 조회
					VACATION_POPOVER_SHOW_TIMER = setTimeout(function() {
						VACATION_POPOVER_SHOW_TIMER = null;
						showVacationPopover($el, item, colKey);
					}, 300);
				}
			},
			mouseleave: function(e) {
				hideVacationPopover();
			},
			click: function(e) {
				e.stopPropagation();
				var $el = $(this);
				var $tr = $el.closest('[data-ax5grid-data-index]');
				var rowIdx = $tr.attr('data-ax5grid-data-index');
				var colKey = $el.attr('data-col-key');
				if (!colKey) {
					var $td = $el.closest('[data-ax5grid-column-key], [data-ax5grid-column-attr]');
					colKey = $td.attr('data-ax5grid-column-key') || $td.attr('data-ax5grid-column-attr');
				}

				if (rowIdx !== undefined && statusGridView.target.list && statusGridView.target.list[rowIdx]) {
					var item = statusGridView.target.list[rowIdx];
					showVacationPopover($el, item, colKey);
				}
			}
		}, '.used-days-info-trigger');

		// 화면 해상도에 맞춰 그리드 높이를 동적으로 하단 여백 없이 꽉 차게 계산
		function adjustGridHeightToWindow() {
			var $gridTarget = $('[data-ax5grid="statusGridView"]');
			if ($gridTarget.length === 0) return;

			var winHeight = window.innerHeight || $(window).height();
			try {
				if (window.top && window.top.innerHeight) {
					var topWinHeight = window.top.innerHeight;
					if (topWinHeight > 0) {
						winHeight = topWinHeight;
					}
				}
			} catch (e) {
				winHeight = $(window).height();
			}

			var gridTop = $gridTarget.offset().top;
			if (!gridTop || gridTop < 50) {
				gridTop = 220;
			}

			// 하단 여백 없이 화면 바닥까지 가득 채우기 (20px 오프셋)
			var calcHeight = winHeight - gridTop - 20;
			if (calcHeight < 400) {
				calcHeight = 400;
			}

			$gridTarget.css('height', calcHeight + 'px');
			if (statusGridView && statusGridView.target && statusGridView.target.setHeight) {
				statusGridView.target.setHeight(calcHeight);
			}
		}

		// 연차 사용 현황 데이터 조회
		function searchAnnualUseStatusGrid() {
			var curYy = $('#yy_S').val() || moment().format("YYYY");
			$('#yy_S').val(curYy);
			$('#displayYyTitle').text(curYy);
			$('#subStDt').text(curYy + "-01-01");
			$('#subEdDt').text(curYy + "-12-31");

			var rawDeptCd = $('#deptCd_S').val() || "";
			var deptCd5Val = rawDeptCd.length > 5 ? rawDeptCd.substring(0, 5) : rawDeptCd;

			var paramObj = {
				"coCd": $('#coCd_S').val() || "GUN",
				"yy": curYy,
				"deptCd_S": deptCd5Val,
				"deptNm_S": $('#deptNm_S').val() || "",
				"userId_S": $('#userId_S').val() || "",
				"userNm_S": $('#userNm_S').val() || "",
				"useYn_S": $('#useYn_S').val() || "",
				"salesArea_S": $('#salesArea_S').val() || ""
			};

			postAjax("/user/pm/pm07/selectAnnualUseStatusList", paramObj, null, function(data) {
				if (data && data.result) {
					statusGridView.setData(data.result);
				} else {
					statusGridView.setData([]);
				}
				setTimeout(function() {
					adjustGridHeightToWindow();
				}, 100);
			});
		}

		// 초기화
		function initSearch() {
			var curYy = moment().format("YYYY");
			$('#yy_S').val(curYy);
			$('#deptCd_S').val("");
			$('#deptNm_S').val("");
			$('#userId_S').val("");
			$('#userNm_S').val("");
			$('#useYn_S').val("Y");
			$('#salesArea_S').val("");
			searchAnnualUseStatusGrid();
		}

		// 사원 검색 트리
		function openReqUserTree(gbn) {
			var sfx = (gbn == 'S') ? '_S' : '';
			var paramObj = {
				"coCd": $('#coCd' + sfx).val() || "GUN",
				"userId": $('#userId' + sfx).val(),
				"userNm": $('#userNm' + sfx).val(),
				"useYn": "Y"
			};
			openModal("/static/html/cmn/modal/userSearch.html", 450, 650, "사원 검색", paramObj, function(tree) {
				var checkedId = tree.get_checked()[0];
				var checkedNode = tree.get_node(checkedId);
				if (!checkedNode || checkedNode.type != 'person') {
					alert("사원을 선택하세요.");
					return;
				}
				$('#userId' + sfx).val(checkedNode.id);
				$('#userNm' + sfx).val(checkedNode.text);
				if (gbn == 'S') searchAnnualUseStatusGrid();
			});
		}

		// 부서 검색 트리
		function openReqDeptTree(gbn) {
			var sfx = (gbn == 'S') ? '_S' : '';
			var rawDeptId = $('#deptCd' + sfx).val() || '';
			var paramObj = {
				"coCd": $('#coCd' + sfx).val() || "GUN",
				"deptId": rawDeptId.length > 5 ? rawDeptId.substring(0, 5) : rawDeptId,
				"deptNm": $('#deptNm' + sfx).val(),
				"useYn": "Y"
			};
			openModal("/static/html/cmn/modal/deptSearch.html", 300, 500, "부서 검색", paramObj, function(tree) {
				var checkedId = tree.get_checked()[0];
				var checkedNode = tree.get_node(checkedId);
				var fullDeptId = (checkedNode && checkedNode.id) ? checkedNode.id : '';
				var deptId5 = fullDeptId.length > 5 ? fullDeptId.substring(0, 5) : fullDeptId;
				$('#deptCd' + sfx).val(deptId5);
				$('#deptNm' + sfx).val(checkedNode.text);
				if (gbn == 'S') searchAnnualUseStatusGrid();
			});
		}

		// 엑셀 내보내기
		function excelDown() {
			var curYy = $('#yy_S').val() || moment().format("YYYY");
			statusGridView.target.exportExcel(curYy + "년도_연차_사용_현황.xls");
		}

		// 그리드 칼럼 설정 팝업
		function openGridColumnConfig() {
			if (typeof GridColumnConfig !== 'undefined') {
				GridColumnConfig.open(statusGridView.target, "PM0711M01");
			} else {
				alert("그리드 설정 모듈이 준비되지 않았습니다.");
			}
		}

		// 조회연도 셀렉트박스 동적 옵션 생성 (기준연도 : 2025년 ~ 현재+1년)
		function setGrantYm() {
			var now = new Date();
			var nyear = now.getFullYear();

			$("#yy_S").empty();
			for (var sy = 2025; sy <= nyear + 1; sy++) {
				$("#yy_S").append("<option value='" + sy + "'>" + sy + "년</option>");
			}

			$("#yy_S").val(nyear);
		}

		$(document).ready(function() {
			// 기본적인 left(#head_area) 및 top(#top_area) 공통 레이아웃 구조 로드
			mainDefaultLoad("인사관리", "연차 사용 현황");

			// PM0103M01.html 패턴의 회사/공통 셀렉트박스 동적 세팅 (data-kind="CO")
			setCommonSelect($('[data-kind]'));

			// PM0701P02.html 패턴의 부여연도 셀렉트박스 동적 생성을 통한 초기화
			setGrantYm();

			// 처음 화면 진입 시 로그인 유저(jwt.userId, jwt.userNm)로 초기 검색 조건 설정
			if (typeof jwt !== "undefined" && jwt.userId) {
				$('#userId_S').val(jwt.userId);
				$('#userNm_S').val(jwt.userNm || "");
			}

			// 부서 검색조건도 로그인 유저 기준으로 초기화 (본 화면 상단 주석의 부서 매핑 규칙과 동일하게 상위 5자리)
			// jwt.deptNm은 비어있는 경우가 많아서(PM0810M01.html과 동일한 이유), TB_CM04M01을 직접 조회해서 부서명을 채운다.
			if (typeof jwt !== "undefined" && jwt.deptId) {
				var deptId5 = jwt.deptId.slice(0, 5);
				$('#deptCd_S').val(deptId5);
				postAjax("/admin/cm/cm04/selectDeptInfo", { "deptId": deptId5 }, null, function(deptData) {
					// CM04Ctr.selectDeptInfo()는 model.addAttribute("deptInfo", ...)로 응답 (result 아님)
					var deptInfo = (deptData && deptData.deptInfo) ? deptData.deptInfo : (deptData || {});
					var deptNmVal = deptInfo.deptNm || jwt.deptNm || "";
					if (deptNmVal && deptNmVal !== "undefined") {
						$('#deptNm_S').val(deptNmVal);
					}
				});
			}

			// 그리드 렌더링
			statusGridView.initView();

			// 초기 조회
			searchAnnualUseStatusGrid();

			// 초기 렌더링 완료 후 해상도 수직 맞춤 및 윈도우 리사이즈 이벤트 바인딩
			setTimeout(function() {
				adjustGridHeightToWindow();
			}, 150);

			$(window).on('resize', function() {
				adjustGridHeightToWindow();
			});
		});
	</script>
</body>
