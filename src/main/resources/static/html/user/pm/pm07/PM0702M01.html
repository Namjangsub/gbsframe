	<style>
		html, body {
			overflow-y: hidden;
		}
		/* Google Calendar 멀티데이 트랙 캘린더 스타일 */
		.gcal-container {
			width: 100%;
			border: 1px solid #dadce0;
			border-radius: 8px;
			overflow: hidden;
			background: #ffffff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
		}
		.gcal-header {
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			background: #f8f9fa;
			border-bottom: 1px solid #dadce0;
			text-align: center;
			font-weight: 600;
			font-size: 13px;
			color: #5f6368;
			padding: 8px 0;
		}
		.gcal-header .sun { color: #d93025; }
		.gcal-header .sat { color: #1a73e8; }

		.gcal-week-row {
			position: relative;
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			min-height: 90px;
			border-bottom: 1px solid #dadce0;
		}
		.gcal-week-row:last-child {
			border-bottom: none;
		}

		/* 배경 날짜 셀 */
		.gcal-day-cell {
			border-right: 1px solid #dadce0;
			padding: 6px;
			box-sizing: border-box;
			background: #ffffff;
		}
		.gcal-day-cell:last-child {
			border-right: none;
		}
		.gcal-day-cell.other-month {
			background-color: #fafafa;
			opacity: 0.5;
		}
		.gcal-day-cell.other-month .gcal-day-num {
			color: #9ca3af !important;
			font-weight: 500;
		}
		.gcal-day-cell.today {
			background: #e8f0fe;
		}
		.gcal-day-num {
			font-size: 12px;
			font-weight: 600;
			color: #3c4043;
			display: inline-block;
			width: 22px;
			height: 22px;
			line-height: 22px;
			text-align: center;
			border-radius: 50%;
		}
		.gcal-day-cell.today .gcal-day-num {
			background: #1a73e8;
			color: #ffffff;
		}
		.gcal-day-cell.sun .gcal-day-num { color: #d93025; }
		.gcal-day-cell.sat .gcal-day-num { color: #1a73e8; }
		.gcal-day-cell.today.sun .gcal-day-num,
		.gcal-day-cell.today.sat .gcal-day-num { color: #ffffff; }

		/* 수평 이벤트 트랙 레이어 (구글 캘린더 핵심) */
		.gcal-events-layer {
			position: absolute;
			top: 32px;
			left: 0;
			right: 0;
			bottom: 4px;
			display: grid;
			grid-template-columns: repeat(7, 1fr);
			grid-auto-rows: 22px;
			row-gap: 3px;
			pointer-events: none;
		}
		.gcal-event-bar {
			pointer-events: auto;
			height: 22px;
			line-height: 22px;
			padding: 0 6px !important;
			margin-top: 0 !important;
			margin-bottom: 0 !important;
			margin-left: 0 !important;
			margin-right: 2px !important;
			box-sizing: border-box !important;
			font-size: 11px;
			font-weight: bold;
			border-radius: 4px;
			border-left-width: 1px !important;
			border-left-style: solid !important;
			color: #ffffff;
			cursor: pointer;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			box-shadow: 0 1px 3px rgba(60,64,67,0.18);
			transition: transform 0.1s, box-shadow 0.1s;
			z-index: 5;
			text-decoration: none !important;
		}
		.gcal-event-bar:hover {
			transform: translateY(-1px);
			box-shadow: 0 2px 5px rgba(60,64,67,0.3);
			z-index: 10;
			color: #ffffff;
		}
		.gcal-event-bar.active-front {
			position: relative;
			z-index: 50 !important;
			transform: translateY(-1px);
			box-shadow: 0 2px 6px rgba(60,64,67,0.38);
		}
		.gcal-event-bar.cont-left {
			border-top-left-radius: 0 !important;
			border-bottom-left-radius: 0 !important;
			margin-left: 0 !important;
		}
		.gcal-event-bar.cont-right {
			border-top-right-radius: 0 !important;
			border-bottom-right-radius: 0 !important;
			margin-right: 0 !important;
		}

		/* 범주 (Legend) */
		.legend-box {
			display: inline-flex;
			align-items: center;
			gap: 10px;
			font-size: 12px;
			color: #555;
			margin-left: 15px;
			font-weight: normal;
		}

		/* 마우스 호버 시 표시되는 근태 상세 팝오버 툴팁 레이어 */
		.vacation-info-popover {
			position: fixed;
			z-index: 999999;
			display: none;
			background: #ffffff;
			border: 1px solid #3b62b1;
			border-radius: 6px;

		}
		.vacation-info-popover .popover-item {
			padding: 3px 0;
			line-height: 1.4;
			color: #444444;
		}
	</style>

<script type="text/javascript">
	var currentCalendarData = [];

	// 화면 해상도 및 캘린더 주(Week) 행 수에 맞춰 수직 스크롤 생성을 철저히 방지하는 동적 높이 계산 함수
	function adjustCalendarHeightToWindow() {
		var $gcalBody = $('#gcalBody');
		if ($gcalBody.length === 0) return;

		var winHeight = window.innerHeight || $(window).height();
		try {
			if (window.top && window.top.innerHeight) {
				var topWinHeight = window.top.innerHeight;
				if (topWinHeight > 0) winHeight = topWinHeight;
			}
		} catch (e) {
			winHeight = $(window).height();
		}

		var bodyTop = $gcalBody.offset() ? $gcalBody.offset().top : 220;
		if (!bodyTop || bodyTop < 50) bodyTop = 220;

		var calcBodyHeight = winHeight - bodyTop - 25;
		if (calcBodyHeight < 350) calcBodyHeight = 350;

		$gcalBody.css({
			'height': calcBodyHeight + 'px',
			'overflow-y': 'auto'
		});

		var $weekRows = $gcalBody.find('.gcal-week-row');
		var weekCount = $weekRows.length;
		if (weekCount > 0) {
			var eachRowHeight = Math.floor(calcBodyHeight / weekCount);
			if (eachRowHeight >= 70) {
				$weekRows.css('height', eachRowHeight + 'px').css('min-height', 'auto');
			}
		}
	}

	$(document).ready(function() {
		// 페이지 타이틀 set
		mainDefaultLoad("생산관리", "휴가신청자 캘린더 현황");
		// 공통코드 set
		setCommonSelect($("#main_area .contents.search select[data-kind]"));

		// 년/월 셀렉트박스 옵션 생성
		initYearMonthCombo();

		$('#coCd_S').val("GUN");

		// 처음 화면 진입 시 로그인 유저(jwt.userId, jwt.userNm)로 초기 검색 조건 설정
		if (typeof jwt !== "undefined" && jwt.userId) {
			$('#reqId_S').val(jwt.userId);
			$('#reqIdNm_S').val(jwt.userNm || "");
		}
		setDefaultReqDept();

		// 초기조회
		DataSearch();

		// 초기 렌더링 완료 후 해상도 수직 맞춤 및 윈도우 리사이즈 이벤트 바인딩
		setTimeout(function() {
			adjustCalendarHeightToWindow();
		}, 150);

		$(window).on('resize', function() {
			adjustCalendarHeightToWindow();
		});

		// 마우스 휠 스크롤을 통한 달(Month) 이동 제어 (Debounce/Throttle 연속폭주 안전 제어)
		var isWheelScrolling = false;
		$('.gcal-container').on('wheel', function(e) {
			e.preventDefault();
			if (isWheelScrolling) return;

			isWheelScrolling = true;
			var delta = e.originalEvent.deltaY;
			if (delta > 0) {
				moveMonth(1);  // 휠 아래로 굴림: 다음달 이동
			} else if (delta < 0) {
				moveMonth(-1); // 휠 위로 굴림: 이전달 이동
			}

			setTimeout(function() {
				isWheelScrolling = false;
			}, 350); // 350ms 동안 연속 휠 요청 폭주 방지
		});

		// authChk("PM0702M01");
	});

	// 연월 콤보박스 데이터 초기화
	function initYearMonthCombo() {
		var curYy = moment().format("YYYY");
		var curMm = moment().format("MM");

		var $yy = $('#yy_S');
		$yy.empty();
		for (var y = Number(curYy) - 3; y <= Number(curYy) + 3; y++) {
			$yy.append('<option value="' + y + '">' + y + '년</option>');
		}
		$yy.val(curYy);

		var $mm = $('#mm_S');
		$mm.empty();
		for (var m = 1; m <= 12; m++) {
			var mmStr = (m < 10 ? '0' : '') + m;
			$mm.append('<option value="' + mmStr + '">' + m + '월</option>');
		}
		$mm.val(curMm);
	}

	// 달 이동 함수 (-1: 이전달, 1: 다음달)
	function moveMonth(diff) {
		var yy = parseInt($('#yy_S').val(), 10);
		var mm = parseInt($('#mm_S').val(), 10);

		var targetDate = moment([yy, mm - 1, 1]).add(diff, 'months');
		$('#yy_S').val(targetDate.format("YYYY"));
		$('#mm_S').val(targetDate.format("MM"));
		DataSearch();
	}

	// 오늘 년월로 이동
	function goToday() {
		$('#yy_S').val(moment().format("YYYY"));
		$('#mm_S').val(moment().format("MM"));
		DataSearch();
	}

	// 검색조건 초기화 함수 (초기화 시 신청자는 로그인 유저로 기본 재설정)
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$(".contents.search select").val("");

		$('#coCd_S').val("GUN");
		initYearMonthCombo();

		if (typeof jwt !== "undefined" && jwt.userId) {
			$('#reqId_S').val(jwt.userId);
			$('#reqIdNm_S').val(jwt.userNm || "");
		}
		setDefaultReqDept();

		DataSearch();
	}

	// 로그인 유저 부서로 부서 검색조건 기본값 설정 (신청자 기본값 설정과 동일한 지점에서 호출)
	// jwt.deptNm은 비어있는 경우가 많아서(PM0711M01.html/PM0810M01.html과 동일한 이유),
	// TB_CM04M01을 직접 조회해서 부서명을 채운다.
	function setDefaultReqDept() {
		if (typeof jwt === "undefined" || !jwt.deptId) return;
		var deptId5 = jwt.deptId.slice(0, 5);
		$('#reqDeptId_S').val(deptId5);
		postAjax("/admin/cm/cm04/selectDeptInfo", { "deptId": deptId5 }, null, function(deptData) {
			// CM04Ctr.selectDeptInfo()는 model.addAttribute("deptInfo", ...)로 응답 (result 아님)
			var deptInfo = (deptData && deptData.deptInfo) ? deptData.deptInfo : (deptData || {});
			var deptNmVal = deptInfo.deptNm || jwt.deptNm || "";
			if (deptNmVal && deptNmVal !== "undefined") {
				$('#reqDeptNm_S').val(deptNmVal);
			}
		});
	}

	// 데이터 검색 및 캘린더 바인딩 (캘린더 표출 전체 날짜 범위 조회)
	function DataSearch() {
		var yy = $('#yy_S').val() || moment().format("YYYY");
		var mm = $('#mm_S').val() || moment().format("MM");

		var year = parseInt(yy, 10);
		var month = parseInt(mm, 10);
		var calendarStart = moment([year, month - 1, 1]).startOf('month').startOf('week');
		var calendarEnd = moment([year, month - 1, 1]).endOf('month').endOf('week');

		var formData = {
			 "coCd"       : "GUN"
			,"reqDtFrom"  : calendarStart.format("YYYYMMDD")
			,"reqDtTo"    : calendarEnd.format("YYYYMMDD")
			,"vacTypeCd"  : $('#vacTypeCd_S').val() || ""
			,"sanctnSts"  : $('#sanctnSts_S').val() || ""
			,"reqId"      : $('#reqId_S').val() || ""
			,"reqIdNm"    : $('#reqIdNm_S').val() || ""
			,"reqDeptId"  : $('#reqDeptId_S').val() || ""
			,"reqDeptNm"  : $('#reqDeptNm_S').val() || ""
		};

		postAjax("/user/pm/pm07/selectVacationCalendarList", formData, null, function(data) {
			try {
				currentCalendarData = data.result || [];
				renderGoogleCalendar(yy, mm, currentCalendarData);
			} catch (error) {
				console.error("휴가 캘린더 렌더링 오류:", error);
				alert("오류 발생!! 전산실 연락 바랍니다");
			}
		});
	}

	// 구글 캘린더 수평 트랙 렌더링 알고리즘 (휴가용)
	function renderGoogleCalendar(yy, mm, vacList) {
		var $gcalBody = $('#gcalBody');
		$gcalBody.empty();

		var firstDay = moment(yy + "-" + mm + "-01", "YYYY-MM-DD");
		var startDayOfWeek = firstDay.day(); // 0: 일요일 ~ 6: 토요일
		var todayStr = moment().format("YYYY-MM-DD");

		var currentDayMoment = moment(firstDay).subtract(startDayOfWeek, 'days');
		var targetMonthInt = parseInt(mm, 10);

		// 총 6주 행 생성
		for (var week = 0; week < 6; week++) {
			var weekStartMoment = moment(currentDayMoment);
			var weekEndMoment = moment(currentDayMoment).add(6, 'days');
			var hasCurrentMonthDay = false;

			var $weekRow = $('<div class="gcal-week-row"></div>');

			// 1. 7일간의 배경 날짜 셀 바인딩
			for (var dow = 0; dow < 7; dow++) {
				var dateStr = currentDayMoment.format("YYYY-MM-DD");
				var dayNum = currentDayMoment.date();
				var isCurrentMonth = (currentDayMoment.month() + 1 === targetMonthInt);

				if (isCurrentMonth) hasCurrentMonthDay = true;

				var cellClass = "gcal-day-cell";
				if (!isCurrentMonth) cellClass += " other-month";
				if (dateStr === todayStr) cellClass += " today";

				// 일요일 또는 법정/대체 공휴일인 경우 날짜 숫자를 붉은색(#d93025)으로 표출
				var ymdCompact = currentDayMoment.format("YYYYMMDD");
				var isRedHoliday = (typeof isRedHolidayYmd === 'function') ? isRedHolidayYmd(ymdCompact) : false;
				if (dow === 0 || isRedHoliday) cellClass += " sun";
				if (dow === 6 && !isRedHoliday) cellClass += " sat";

				var cellHtml = '<div class="' + cellClass + '">';
				cellHtml += '<span class="gcal-day-num">' + dayNum + '</span>';
				cellHtml += '</div>';

				$weekRow.append(cellHtml);
				currentDayMoment.add(1, 'days');
			}

			// 2. 당주에 포함되는 휴가 이벤트 추출 및 수평 컬럼 위치(0~6) 계산
			var weekEvents = [];
			if (vacList && vacList.length > 0) {
				var weekStartStr = weekStartMoment.format("YYYYMMDD");
				var weekEndStr = weekEndMoment.format("YYYYMMDD");

				$.each(vacList, function(idx, item) {
					var st = item.stDt || item.rawStDt;
					var ed = item.edDt || item.rawEdDt;
					if (!st || !ed) return true;

					st = String(st).replace(/[^0-9]/g, "").substring(0, 8);
					ed = String(ed).replace(/[^0-9]/g, "").substring(0, 8);

					// 당주와 일정 겹치는지 체크
					if (st <= weekEndStr && ed >= weekStartStr) {
						var stMom = moment(st, "YYYYMMDD");
						var edMom = moment(ed, "YYYYMMDD");

						var wStart = weekStartMoment.clone().startOf('day');
						var wEnd = weekEndMoment.clone().startOf('day');
						var sDay = stMom.clone().startOf('day');
						var eDay = edMom.clone().startOf('day');

						var startCol = 0;
						var endCol = 6;
						var contLeft = false;
						var contRight = false;

						if (sDay.isAfter(wStart)) {
							startCol = sDay.diff(wStart, 'days');
						} else if (sDay.isBefore(wStart)) {
							contLeft = true;
						}

						if (eDay.isBefore(wEnd)) {
							endCol = eDay.diff(wStart, 'days');
						} else if (eDay.isAfter(wEnd)) {
							contRight = true;
						}

						weekEvents.push({
							item: item,
							startCol: Math.max(0, startCol),
							endCol: Math.min(6, endCol),
							contLeft: contLeft,
							contRight: contRight,
							st: st,
							ed: ed
						});
					}
				});
			}

			// 3. 수평 트랙(Slot Level) 충돌 회피 알고리즘 적용
			weekEvents.sort(function(a, b) {
				if (a.startCol !== b.startCol) return a.startCol - b.startCol;
				return (b.endCol - b.startCol) - (a.endCol - a.startCol);
			});

			var slots = [];
			$.each(weekEvents, function(i, ev) {
				var assignedLevel = -1;
				for (var level = 0; level < 4; level++) {
					if (!slots[level]) slots[level] = [];
					var isFree = true;
					for (var c = ev.startCol; c <= ev.endCol; c++) {
						if (slots[level][c]) {
							isFree = false;
							break;
						}
					}
					if (isFree) {
						assignedLevel = level;
						for (var c = ev.startCol; c <= ev.endCol; c++) {
							slots[level][c] = true;
						}
						break;
					}
				}
				ev.level = (assignedLevel !== -1) ? assignedLevel : 3;
			});

			// 4. 수평 이벤트 레이어 렌더링 (구글 캘린더 멀티데이 바)
			if (weekEvents.length > 0) {
				var $eventsLayer = $('<div class="gcal-events-layer"></div>');

				var year = parseInt(yy, 10);
				var month = parseInt(mm, 10);
				var monthStartStr = moment([year, month - 1, 1]).startOf('month').format("YYYYMMDD");
				var monthEndStr = moment([year, month - 1, 1]).endOf('month').format("YYYYMMDD");

				$.each(weekEvents, function(i, ev) {
					var item = ev.item;
					var reqIdNm = item.reqIdNm || item.userNm || "신청자";
					var vacTypeNm = item.vacTypeNm || "휴가";
					var ampmLabel = (item.ampmNm) ? (" (" + item.ampmNm + ")") : "";

					// 당월이 아닌 기간의 이벤트 여부 판단 (완전 전월/익월 또는 해당월 밖 일정)
					var isCurrentMonthEvent = !(ev.st > monthEndStr || ev.ed < monthStartStr);
					var typeColor = isCurrentMonthEvent ? getVacationStyle(item.vacTypeCd, vacTypeNm) : {
						bg: "#f3f4f6",
						text: "#8c959f",
						border: "#d0d7de"
					};

					var colSpan = ev.endCol - ev.startCol + 1;
					var startGridCol = ev.startCol + 1; // 1-indexed

					var barCls = "gcal-event-bar";
					if (ev.contLeft) barCls += " cont-left";
					if (ev.contRight) barCls += " cont-right";
					if (!isCurrentMonthEvent) barCls += " other-month-bar";

					var borderCss = typeColor.border ? (' border: 1px solid ' + typeColor.border + ' !important; border-left-width: 1px !important;') : ' border: 1px solid transparent !important; border-left-width: 1px !important;';
					var opacityStyle = !isCurrentMonthEvent ? ' opacity: 0.7;' : '';
					var gridStyleStr = 'grid-column: ' + startGridCol + ' / span ' + colSpan + '; '
					                 + 'grid-row: ' + (ev.level + 1) + '; '
					                 + 'margin-left: 0px !important; '
					                 + 'background-color: ' + typeColor.bg + '; color: ' + typeColor.text + ';' + borderCss + opacityStyle;
					if (isCurrentMonthEvent && typeColor.pattern) {
						gridStyleStr += ' background-image: ' + typeColor.pattern + ';';
					}

					var deptNm = item.deptNm || item.reqDeptNm || "부서미지정";
					var barHtml = '<a class="' + barCls + '" style="' + gridStyleStr + '" '
					            + 'onmouseenter="showGcalEventPopover(event, \'' + reqIdNm.replace(/'/g, "\\'") + '\', \'' + vacTypeNm.replace(/'/g, "\\'") + '\', \'' + ampmLabel.replace(/'/g, "\\'") + '\', \'' + ev.st + '\', \'' + ev.ed + '\', \'' + (item.reqRmk || '').replace(/'/g, "\\'") + '\', \'' + deptNm.replace(/'/g, "\\'") + '\');" '
					            + 'onmousemove="moveGcalEventPopover(event);" '
					            + 'onmouseleave="hideGcalEventPopover();" '
					            + 'onclick="openVacationDetailModal(\'' + item.reqNo + '\');">';
					barHtml += '<i class="fas fa-user-clock"></i> ' + reqIdNm + ' ' + vacTypeNm + ampmLabel;
					barHtml += '</a>';

					$eventsLayer.append(barHtml);
				});

				$weekRow.append($eventsLayer);
			}

			if (hasCurrentMonthDay || week < 5) {
				$gcalBody.append($weekRow);
			}
		}

		adjustCalendarHeightToWindow();
	}

	// 구글 캘린더 수평 이벤트 바 마우스 호버 근태 팝오버 툴팁 함수
	function bringGcalBarToFront(targetBar) {
		$('.gcal-event-bar').removeClass('active-front');
		$(targetBar).addClass('active-front');
	}

	$(document).on('mouseenter', '.gcal-event-bar', function() {
		bringGcalBarToFront(this);
	});

	function showGcalEventPopover(e, reqIdNm, vacTypeNm, ampmLabel, st, ed, reqRmk, deptNm) {
		var $pop = $('#vacationInfoPopover');
		if ($pop.length === 0) {
			$pop = $('<div id="vacationInfoPopover" class="vacation-info-popover"></div>');
			$('body').append($pop);
		}
		var html = '<div class="popover-title"><i class="fas fa-user-clock" style="margin-right: 5px;"></i>' + reqIdNm + ' (' + (deptNm || "부서미지정") + ')</div>';
		html += '<div class="popover-item"><b>휴가유형:</b> ' + vacTypeNm + ampmLabel + '</div>';
		html += '<div class="popover-item"><b>휴가기간:</b> ' + st + ' ~ ' + ed + '</div>';
		html += '<div class="popover-item"><b>휴가사유:</b> ' + (reqRmk || '없음') + '</div>';
		$pop.html(html);

		var mouseX = e.clientX || (e.originalEvent ? e.originalEvent.clientX : 0);
		var mouseY = e.clientY || (e.originalEvent ? e.originalEvent.clientY : 0);

		$pop.css({
			'top': (mouseY + 15) + 'px',
			'left': (mouseX + 15) + 'px',
			'display': 'block'
		});
	}

	function moveGcalEventPopover(e) {
		var $pop = $('#vacationInfoPopover');
		if ($pop.is(':visible')) {
			var mouseX = e.clientX || (e.originalEvent ? e.originalEvent.clientX : 0);
			var mouseY = e.clientY || (e.originalEvent ? e.originalEvent.clientY : 0);
			$pop.css({
				'top': (mouseY + 15) + 'px',
				'left': (mouseX + 15) + 'px'
			});
		}
	}

	function hideGcalEventPopover() {
		$('#vacationInfoPopover').hide();
	}

	// 검색조건 초기화
	function initSearch() {
		$(".contents.search input[type='text']").val("");
		$(".contents.search input[type='hidden']").val("");
		$('#coCd_S').val("GUN");
		$('#vacTypeCd_S').val("");
		$('#sanctnSts_S').val("");
		initYearMonthCombo();
		DataSearch();
	}

	// 신청 등록 / 상세 수정 모달
	function openVacationModal(actionType) {
		var paramObj = {
			 "actionType" : actionType || "C"
			,"coCd"       : "GUN"
			,"userId"     : jwt.userId
			,"userNm"     : jwt.userNm
			,"pgmId"      : "PM0701P01"
		};

		openModal("/static/html/user/pm/pm07/PM0701P01.html", 1100, 700, "", paramObj, function(data) {
			DataSearch();
		});
	}

	// 상세 정보 모달 (reqNo 클릭 시)
	function openVacationDetailModal(reqNo) {
		if (!reqNo) return;
		var paramObj = {
			 "coCd"   : "GUN"
			,"reqNo"  : reqNo
		};

		postAjax("/user/pm/pm07/selectVacationDtl", paramObj, null, function(data) {
			if (data && data.result) {
				var row = data.result;
				row.actionType = "U";
				row.coCd = "GUN";
				row.userId = jwt.userId;
				row.userNm = jwt.userNm;
				row.pgmId = "PM0701P01";

				openModal("/static/html/user/pm/pm07/PM0701P01.html", 1100, 700, "", row, function(res) {
					DataSearch();
				});
			}
		});
	}

	// 신청자(사원) 검색
	function openReqUserTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"userId" : $('#reqId' + sfx).val()
			,"userNm" : $('#reqIdNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/userSearch.html", 450, 650, "신청자 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			if (!checkedNode || checkedNode.type != 'person') {
				alert("사원을 선택하세요.");
				return;
			}
			$('#reqId' + sfx).val(checkedNode.id);
			$('#reqIdNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}

	// 부서 검색
	function openReqDeptTree(gbn) {
		var sfx = (gbn == 'S') ? '_S' : '';
		var paramObj = {
			 "coCd"   : ''
			,"deptId" : $('#reqDeptId' + sfx).val()
			,"deptNm" : $('#reqDeptNm' + sfx).val()
			,"useYn"  : "Y"
		};
		openSecondModal("/static/html/cmn/modal/deptSearch.html", 300, 500, "부서 검색", paramObj, function(tree) {
			var checkedId = tree.get_checked()[0];
			var checkedNode = tree.get_node(checkedId);
			$('#reqDeptId' + sfx).val(checkedNode.id);
			$('#reqDeptNm' + sfx).val(checkedNode.text);
			if (gbn == 'S') DataSearch();
		});
	}
</script>
