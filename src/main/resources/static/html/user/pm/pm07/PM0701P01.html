<div class="popup_area of_a" style="width: 100%; height: 100%;">
	<div class="tit_contents">
		<h4 class="tit" id="popupTitle">휴가신청</h4>
	</div>

	<form id="popForm" onSubmit="return false;">
		<div class="form-group popup_table">
			<input type="hidden" id="coCd" name="coCd" value="GUN">
			<input type="hidden" id="actionType" name="actionType" value="C">
			<input type="hidden" id="reqNo" name="reqNo" value="">

			<!-- 기본정보 및 휴가기간 입력 테이블 -->
			<table class="popup_table" style="margin-bottom: 15px;">
				<colgroup>
					<col width="15%">
					<col width="35%">
					<col width="15%">
					<col width="35%">
				</colgroup>
				<tbody>
					<!-- 1행: 휴가신청자 / 휴가유형 -->
					<tr>
						<th class="hit">휴가신청자</th>
						<td>
							<div class="search_form">
								<input type="hidden" id="reqId" name="reqId">
								<input type="hidden" id="reqDeptId" name="reqDeptId">
								<input type="hidden" id="reqDeptNm" name="reqDeptNm">
								<input type="text" id="reqTitl" name="reqTitl" class="form-control input-sm" placeholder="휴가신청자 성명" readonly style="cursor: default; background: #fafafa !important;" onclick="if (typeof isMngUser === 'function' && isMngUser()) openReqUserTree();">
								<a id="btnReqUserSearch" onclick="openReqUserTree();" style="display: none;" title="신청자 선택/변경 (근태담당자 전용)"><i class="i_search_w"></i></a>
							</div>
						</td>
						<th class="hit">휴가유형</th>
						<td>
							<select id="vacTypeCd" name="vacTypeCd" data-kind="PM07TYPE" class="form-control input-sm" style="width: 100%;" onchange="onVacTypeChanged();">
								<option value="">선택하세요</option>
							</select>
						</td>
					</tr>
					<!-- 2행: 구분(오전/오후) -->
					<tr>
						<th></th>
						<td></td>
						<th id="ampmTh">구분(오전/오후)</th>
						<td>
							<select id="ampmCd" name="ampmCd" data-kind="PM07AMPM" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" disabled onchange="onAmPmChanged();">
								<option value="">선택하세요</option>
							</select>
						</td>
					</tr>
					<!-- 3행: 시작일자 ~ 종료일자 -->
					<tr>
						<th class="hit">시작일자</th>
						<td>
							<input type="text" id="stDt" name="stDt" class="input_calendar form-control input-sm" autocomplete="off" style="cursor:pointer; width: 100%;" msg="시작일자" onchange="onStDtChanged();">
						</td>
						<th class="hit">종료일자</th>
						<td>
							<input type="text" id="edDt" name="edDt" class="input_calendar form-control input-sm" autocomplete="off" style="cursor:pointer; width: 100%;" msg="종료일자" onchange="onEdDtChanged();">
						</td>
					</tr>
					<!-- 겹침 경고 -->
					<tr id="vacOverlapWarningRow" style="display: none;">
						<td colspan="4" style="padding: 4px 8px;">
							<span id="vacOverlapWarning" style="color: #d9534f; font-size: 12px; font-weight: bold;"></span>
						</td>
					</tr>
					<!-- 4행: 휴가일수 / 차감일수 -->
					<tr>
						<th>휴가일수</th>
						<td>
							<input type="text" id="vacDays" name="vacDays" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" readonly>
						</td>
						<th>차감일수</th>
						<td>
							<input type="text" id="deductDays" name="deductDays" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" readonly>
						</td>
					</tr>
					<!-- 5행: 사유 -->
					<tr>
						<th id="reqRmkTh">사유</th>
						<td colspan="3">
							<textarea id="reqRmk" name="reqRmk" class="form-control input-sm" style="width: 100%; height: 70px; resize: vertical;" placeholder="" maxlength="1000"></textarea>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- 결재선 및 공유선 통합 그리드 -->
			<div style="margin-top: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
				<span style="font-size: 13px; font-weight: bold; color: blue;">결재선 및 공유선</span>
				<div class="add_btn_small pdl10">
					<a onclick="insertShareUser();" style="height: 30px; line-height: 28px; width: 130px;" authchk>결재자/공유자 지정</a>
					<a onclick="deleteShareUser();" style="height: 30px; line-height: 28px; width: 75px;" authchk>선택 삭제</a>
				</div>
			</div>
			<div class="ax5_grid" style="width: 100%;">
				<div data-ax5grid="approvalGrid" data-ax5grid-config="{}" style="height: 220px; width: 100%;"></div>
			</div>

			<!-- 첨부파일 영역 -->
			<div style="margin-top: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
				<span style="font-size: 13px; font-weight: bold; color: blue;">첨부파일</span>
				<!-- 파일추가/삭제 버튼을 직접 만들지 않는다.
				     treeModule.initAll() 이 fileList_area 안에 그리드와 파일 input, 행별 삭제 버튼을
				     스스로 생성한다(fileTree.js createFileInput / deleteFile(dindex)).
				     treeModule 공개 API 에 addFile() 은 존재하지 않는다. -->

			</div>
			<!-- 공통 파일 영역 -->
			<div id="fileList_area"></div>

			<!-- 임시저장 작업일보 미생성 안내 문구 -->
			<div style="margin-top: 10px; margin-bottom: 5px;">
				<p style="color: #d9534f; font-size: 12px; font-weight: bold; line-height: 1.5; margin: 0; padding: 6px 10px; background-color: #fdf2f2; border: 1px solid #f5c6cb; border-radius: 3px;">
					<i class="fas fa-exclamation-circle"></i> <span>안내: 임시저장 상태에서는 작업일보에 휴가가 자동 등록되지 않으며, 결재자 지정 후 결재 상신(신청) 시에만 작업일보에 등록됩니다.</span>
				</p>
			</div>

			<!-- 하단 버튼 영역 -->
			<div class="col-xs-12 text-right popup_bottom_btn" style="margin-top: 15px; padding-right: 0;">
				<button type="button" class="btn btn-primary btn-sm" id="btnSaveVacation" onclick="saveVacation();">저 장</button>
				<button type="button" class="btn btn-danger btn-sm" id="btnDeleteVacation" onclick="deleteVacationInModal();" style="display: none;">삭 제</button>
				<button type="button" class="btn btn-default btn-sm" onclick="modalStack.close();">닫 기</button>
			</div>
		</div>
	</form>
</div>

<script type="text/javascript">

	/*****************************************************************************************
	 * 휴가코드     차감일수  구분	분류 유형
	 * PM07TYPE01	1			연차
	 * PM07TYPE02	0.5			반차 (오전, 오후 여부. 시간 기록)
	 * PM07TYPE03				조퇴 (시간 기록)
	 * PM07TYPE04				외출 (시간 기록)
	 * PM07TYPE05				교육/훈련 (내용 기록)
	 * PM07TYPE06	1			경조휴가 (사유 기록)
	 * PM07TYPE07	1			포상휴가 (사유 기록)
	 * PM07TYPE08	0.5			포상휴가반차 (사유 기록)
	 * PM07TYPE09	1			하계휴가 (대체)
	 * PM07TYPE10				재택근무 (사유 기록)
	 * PM07TYPE11	1			대체휴가 (내용 기록)
	 * PM07TYPE12	0.5			대체휴가반차 (내용 기록)
	 * PM07TYPE13				병가 (무급)
	 * PM07TYPE14				지각 (시간 기록)
	 *****************************************************************************************/    

	// 유형 판정 함수 (코드명 기반 — 코드값 확정 시 교체)
	var editInitialSnapshot = null;

	// 반차 유형 판정 함수(코드값 + 코드명 확인)
	// 코드값 이외에 코드명에 "반차"가 포함된 경우
	function isHalfDayType(codeNm) {
		var code = $('#vacTypeCd').val() || '';
		return code === 'PM07TYPE02' || code === 'PM07TYPE08' || code === 'PM07TYPE12'
			|| (!!codeNm && codeNm.indexOf("반차") >= 0);
	}

	function getVacationEditSnapshot() {
		var values = {};
		$.each(['reqTitl', 'reqId', 'reqDeptId', 'vacTypeCd', 'ampmCd', 'stDt', 'edDt', 'reqRmk'], function(i, id) {
			values[id] = $.trim($('#' + id).val() || '');
		});
		var approvalList = (typeof approvalGridView !== 'undefined' && approvalGridView.target && approvalGridView.target.list) ? approvalGridView.target.list : [];
		values.approval = JSON.stringify(approvalList.map(function(item) {
			return [item.usrNm, item.name, item.gb, item.sanctnSttus, item.todoCfDt];
		}));
		var fileList = [];
		var deletedFileList = [];
		if (typeof treeModule !== 'undefined') {
			if (typeof treeModule.getFileArr === 'function') {
				fileList = (treeModule.getFileArr() || []).map(function(file) {
					return [file.fileKey || '', file.fileNm || file.name || '', file.fileSize || file.size || ''];
				});
			}
			if (typeof treeModule.getDeleteFileArr === 'function') {
				deletedFileList = treeModule.getDeleteFileArr() || [];
			}
		}
		values.files = JSON.stringify(fileList);
		values.deletedFiles = JSON.stringify(deletedFileList);
		return JSON.stringify(values);
	}

	function isTimeType(codeNm) {
		var code = $('#vacTypeCd').val() || '';
		if (code === 'PM07TYPE14') return true;
		if (!codeNm) return false;
		return codeNm.indexOf("조퇴") >= 0 || codeNm.indexOf("외출") >= 0 || codeNm.indexOf("지각") >= 0;
	}

	// 연차, 교육훈련, 경조휴가, 포상휴가, 하계휴가, 대체휴가, 병가만 From-Till 기간선택 가능 판정
	function isMultiDayType(codeNm) {
		if (!codeNm) return true;
		var code = $('#vacTypeCd').val() || '';
		if (code === 'PM07TYPE14') return false;
		var nm = $.trim(codeNm);
		if (nm.indexOf("반차") >= 0 || nm.indexOf("조퇴") >= 0 || nm.indexOf("외출") >= 0 || nm.indexOf("지각") >= 0) {
			return false;
		}
		return nm.indexOf("연차") >= 0
			|| nm.indexOf("교육") >= 0
			|| nm.indexOf("훈련") >= 0
			|| nm.indexOf("경조") >= 0
			|| nm.indexOf("포상") >= 0
			|| nm.indexOf("하계") >= 0
			|| nm.indexOf("대체") >= 0
			|| nm.indexOf("병가") >= 0;
	}

	// 연차, 반차, 조퇴, 외출, 하계휴가(대체), 병가, 지각은 사유 필수입력 제외 판정
	function isRmkOptional(codeNm) {
		if (!codeNm) return false;
		var code = $('#vacTypeCd').val() || '';
		if (code === 'PM07TYPE14') return true;
		var nm = codeNm.trim();
		return nm.indexOf("연차") >= 0
			|| nm.indexOf("반차") >= 0
			|| nm.indexOf("조퇴") >= 0
			|| nm.indexOf("외출") >= 0
			|| nm.indexOf("하계") >= 0
			|| nm.indexOf("대체") >= 0
			|| nm.indexOf("병가") >= 0
			|| nm.indexOf("지각") >= 0;
	}

	// 구분(오전/오후) 선택 변경 이벤트
	function onAmPmChanged() {
		onDateChanged();
	}

	// 시작일자 수동/피커 변경 시 양방향 동일일자 동기화 (단일일 유형)
	function onStDtChanged() {
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text() || '';
		if (!isMultiDayType(selectedNm)) {
			var stVal = $('#stDt').val();
			if (stVal) {
				$('#edDt').val(stVal);
			}
		}
		onDateChanged();
	}

	// 종료일자 수동/피커 변경 시 양방향 동일일자 동기화 (단일일 유형)
	function onEdDtChanged() {
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text() || '';
		if (!isMultiDayType(selectedNm)) {
			var edVal = $('#edDt').val();
			if (edVal) {
				$('#stDt').val(edVal);
			}
		}
		onDateChanged();
	}

	// 휴가유형 변경 이벤트
	function onVacTypeChanged() {
		var selectedCd = $('#vacTypeCd').val();
		if (!selectedCd) {
			$('#ampmCd').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#ampmTh').removeClass("hit");
			$('#reqRmkTh').removeClass("hit");
			$('#reqRmk').attr("placeholder", "");
			return;
		}

		// 선택된 옵션의 코드명 취득
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text();

		// 사유 필수 여부 제어 (연차, 반차, 조퇴, 외출, 하계, 대체, 병가는 필수입력 아님)
		if (isRmkOptional(selectedNm)) {
			$('#reqRmkTh').removeClass("hit");
			$('#reqRmk').attr("placeholder", "");
		} else {
			$('#reqRmkTh').addClass("hit");
			$('#reqRmk').attr("placeholder", "");
		}

		// 반차류(반차, 포상휴가반차, 대체휴가반차)
		if (isHalfDayType(selectedNm)) {
			$('#ampmCd').prop("disabled", false).css("background", "#ffffff !important");
			$('#ampmTh').addClass("hit");  // 구분(오전/오후) 열리면 필수 표시
		}
		// 그 외(전일 연차, 조퇴/외출 등)
		else {
			$('#ampmCd').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#ampmTh').removeClass("hit");
		}

		// 기간선택 불가 단일일 전용 유형(반차, 조퇴, 외출 등) 선택 시 종료일자를 시작일자와 동일하게 자동 설정
		if (!isMultiDayType(selectedNm)) {
			var stVal = $('#stDt').val();
			if (stVal) {
				$('#edDt').val(stVal);
			}
		}

		onDateChanged();
	}

	// 겹침 여부 서버 조회. 반환값 true = 겹침 없음(정상), false = 겹침 있음(경고 표시됨).
	// 신청자는 로그인 사용자 본인(jwt.userId) 기준 — PM07 화면에는 별도 신청자ID 필드가 없다(kakaoTodo() 주석 참고).
	function checkVacationOverlap(showAlert) {
		var stDtVal = $('#stDt').val();
		var edDtVal = $('#edDt').val();
		if (!stDtVal || !edDtVal || stDtVal.length < 10 || edDtVal.length < 10) {
			$('#vacOverlapWarningRow').hide();
			$('#vacOverlapWarning').text('');
			return true;
		}

		var stDt = stDtVal.replace(/\-/g, '');
		var edDt = edDtVal.replace(/\-/g, '');
		var stTm = ($('#stTm').val() || '').replace(/:/g, '') || '0000';
		var edTm = ($('#edTm').val() || '').replace(/:/g, '') || '2359';

		var paramObj = {
			"coCd"  : $('#coCd').val() || "GUN",
			"reqId" : $('#popForm').find('#reqId').val() || jwt.userId,
			"stDt"  : stDt,
			"edDt"  : edDt,
			"stTm"  : stTm,
			"edTm"  : edTm,
			"reqNo" : $('#reqNo').val() || ""
		};

		var overlapList = [];
		postAjaxSync("/user/pm/pm07/selectVacationOverlapCheck", paramObj, null, function(data) {
			overlapList = (data && data.resultList) ? data.resultList : [];
		});

		if (overlapList.length > 0) {
			var msgLines = overlapList.map(function(r) {
				var dtStr = r.stDt + ((r.edDt && r.edDt !== r.stDt) ? (' ~ ' + r.edDt) : '');
				var tmInfo = '';
				if (r.stTm && r.edTm && !(r.stTm === '00:00' && r.edTm === '23:59')) {
					tmInfo = ', ' + r.stTm + '~' + r.edTm;
				}
				return dtStr + ' (' + (r.vacTypeNm || '') + tmInfo + ')';
			});
			var warnMsg = '⚠ 이전에 신청한 휴가일자와 겹칩니다: ' + msgLines.join(', ');
			$('#vacOverlapWarning').text(warnMsg);
			$('#vacOverlapWarningRow').show();
			if (showAlert) {
				alert(warnMsg);
			}
			return false;
		} else {
			$('#vacOverlapWarningRow').hide();
			$('#vacOverlapWarning').text('');
			return true;
		}
	}

	// 휴무일(주말/공휴일) 여부 판정 함수
	function isHolidayDate(dtStr) {
		if (!dtStr || dtStr.length < 10) return false;
		try {
			var parts = dtStr.split('-');
			if (parts.length === 3) {
				var y = parseInt(parts[0], 10);
				var m = parseInt(parts[1], 10) - 1;
				var d = parseInt(parts[2], 10);
				var dt = new Date(y, m, d);
				var day = dt.getDay();
				if (day === 0 || day === 6) return true; // 주말(토/일)

				if (typeof yearHolidayTable === 'function') {
					var yearHolidays = yearHolidayTable(y) || [];
					var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
					for (var i = 0; i < yearHolidays.length; i++) {
						if (yearHolidays[i] === targetStr) {
							return true; // 공휴일
						}
					}
				}
			}
		} catch (e) {
			console.error(e);
		}
		return false;
	}

	// 날짜 변경 이벤트 (휴가일수/차감일수 자동계산)
	function onDateChanged() {
		var stDt = $('#stDt').val();
		var edDt = $('#edDt').val();
		var vacTypeCd = $('#vacTypeCd').val();

		if (!stDt || !edDt || !vacTypeCd) {
			$('#vacDays').val("");
			$('#deductDays').val("");
			return;
		}

		// YYYY-MM-DD 형식 유지 (listWorkingDays 필수)
		if (stDt.length < 10 || edDt.length < 10) {
			$('#vacDays').val("");
			$('#deductDays').val("");
			return;
		}

		// 휴가신청일자 휴무일(주말/공휴일) 체크 alert
		if (stDt === edDt) {
			if (isHolidayDate(stDt)) {
				alert("선택하신 휴가신청일자(" + stDt + ")는 휴무일(주말/공휴일)입니다.");
			}
		} else {
			if (isHolidayDate(stDt)) {
				alert("선택하신 시작일자(" + stDt + ")는 휴무일(주말/공휴일)입니다.");
			} else if (isHolidayDate(edDt)) {
				alert("선택하신 종료일자(" + edDt + ")는 휴무일(주말/공휴일)입니다.");
			}
		}

		// 영업일 목록 조회 (주말·공휴일 제외, workingDayCalc.js 사용)
		var vacDays = 0;
		try {
			if (typeof listWorkingDays === 'function' && typeof KoreanLunarCalendar !== 'undefined') {
				var dayList = listWorkingDays(stDt, edDt);
				vacDays = (dayList && dayList.length > 0) ? dayList.length : 0;
			} else {
				var stDate = moment(stDt, "YYYY-MM-DD");
				var edDate = moment(edDt, "YYYY-MM-DD");
				vacDays = edDate.diff(stDate, 'days') + 1;
			}
		} catch (e) {
			var stDate = moment(stDt, "YYYY-MM-DD");
			var edDate = moment(edDt, "YYYY-MM-DD");
			vacDays = edDate.diff(stDate, 'days') + 1;
		}

		// 최종 차감일수 평가는 백엔드 DB 저장하기전에 재평가하여 산정함.
		// 휴가코드 05.교육/훈련 13.병가는 휴가일수 차감 대상 아님
		// 반차/포상휴가반차/대체휴가반차는 0.5
		// 그외 휴가는 휴가일수
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text();
		var deductDays = 0;

		var isNonDeduct = selectedNm.indexOf("교육") >= 0 || selectedNm.indexOf("훈련") >= 0 || selectedNm.indexOf("병가") >= 0
				|| selectedNm.indexOf("조퇴") >= 0 || selectedNm.indexOf("외출") >= 0 || selectedNm.indexOf("재택") >= 0 || selectedNm.indexOf("지각") >= 0;

		if (isHalfDayType(selectedNm)) {
			deductDays = 0.5;
		} else if (isNonDeduct) {
			deductDays = 0;
		} else {
			deductDays = vacDays;
		}

		$('#vacDays').val(vacDays.toFixed(1));
		$('#deductDays').val(deductDays.toFixed(1));
		checkVacationOverlap(true);
	}

	// 기본 결재라인 자동 구성 : 담당자 -> 담당자팀장 -> 휴가관리 결재라인(공통코드 SPECRTS17)
	function setDefaultApprovalLine() {
		var reqId = $('#popForm').find('#reqId').val() || jwt.userId;
		if (!reqId) return;

		var autoList = [];
		var addedIds = {};

		function pushApprover(u) {
			if (!u || !u.id) return;
			var key = String(u.id).toLowerCase();
			if (addedIds[key]) return;		// 동일인 중복 결재행 방지
			addedIds[key] = true;
			autoList.push({
				gb    : "결재",
				usrNm : u.id,
				todoId: u.id,
				name  : u.name || u.id,
				jik   : u.levelNm || '',
				dtNm  : u.deptNm || '',
				telNo : u.telNo || '',
				email : u.email || '',
				sanctnSttusNm : '미승인'
			});
		}

		// 1) 담당자(신청자) 본인
		// - 로그인 유저가 자기 휴가를 신청할 때 (reqId === jwt.userId): 1번 결재선에 등록하고 자동 승인(Y)
		// - 근태/휴가관리담당자가 본인 외 다른 사원을 대리 선택 시 (reqId !== jwt.userId): 신청인 결재라인 스킵
		var isTeamMgr = false;
		postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": reqId }, null, function(data) {
			if (data && data.userInfo) {
				isTeamMgr = (data.userInfo.teamManager === 'TEAM01');
				if (reqId === jwt.userId) {
					var uObj = data.userInfo;
					var key = String(uObj.id).toLowerCase();
					addedIds[key] = true;
					autoList.push({
						gb            : "결재",
						usrNm         : uObj.id,
						todoId        : uObj.id,
						name          : uObj.name || uObj.id,
						jik           : uObj.levelNm || '',
						dtNm          : uObj.deptNm || '',
						telNo         : uObj.telNo || '',
						email         : uObj.email || '',
						sanctnSttus   : 'Y',
						sanctnSttusNm : '승인'
					});
				}
			}
		});

		// 2) 담당자 팀장 (신청자가 팀장 본인이면 건너뛴다)
		if (!isTeamMgr) {
			postAjaxSync("/user/wb/wb24/selectTeamManagerInfo", { "userId": reqId }, null, function(data) {
				if (data && data.result) {
					pushApprover(data.result);
				}
			});
		}

		// 3) 휴가관리 결재라인 (SPECRTS17 의 CODE_ETC 등록 순서대로)
		postAjaxSync("/admin/cm/cm05/selectChildCodeList", { "codeId": "SPECRTS17" }, null, function(data) {
			var list = (data && data.childCodeList) ? data.childCodeList : [];
			if (list.length === 0) return;
			var codeEtc = list[0].codeEtc || '';
			if (!codeEtc) return;

			$.each(codeEtc.split(','), function(idx, rawId) {
				var uId = $.trim(rawId);
				if (!uId) return true;
				postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": uId }, null, function(userData) {
					if (userData && userData.userInfo) {
						pushApprover(userData.userInfo);
					}
				});
			});
		});

		// 순번은 배열 순서 그대로 (순차결재 순서 = 담당자 -> 팀장 -> 경영지원팀)
		$.each(autoList, function(idx, row) { row.sanctnSn = idx + 1; });

		approvalGridView.setData(autoList);
	}

	// 기존 문서의 결재선/공유선을 조회해 그리드에 표시한다. (수정·상세 진입 시)
	// 결재선은 TB_WB20M03 에 있으므로 WB20 공통 조회 API 를 쓴다.
	function loadApprovalLine(reqNo) {
		if (!reqNo) return;

		var rows = [];
		var divList = [
			{ cd: "TODODIV2300", gb: "결재" },
			{ cd: "TODODIV1300", gb: "공유" }
		];

		$.each(divList, function(i, div) {
			postAjaxSync("/user/wb/wb20/selectGetApprovalList",
				{ "todoNo": reqNo, "todoDiv2CodeId": div.cd }, null, function(data) {
					$.each(data.resultList || [], function(idx, r) {
						rows.push({
							gb            : div.gb,
							sanctnSn      : Number(r.sanctnSn || 0),
							coCd          : r.coCd || "GUN",
							usrNm         : r.todoId,
							empNo         : r.empNo || r.todoId,
							name          : r.todoNm || r.name,
							jik           : r.jik,
							reqDate       : r.reqDate || r.creatDttm || "",
							todoCfDt      : r.todoCfDt || "",
							todoCfOpn     : r.todoCfOpn || "",
							dtNm          : r.dtNm,
							todoId        : r.todoId,
							todoKey       : r.todoKey || "",
							flag          : r.flag || "",
							sanctnSttusNm : r.sanctnSttusNm
						});
					});
				});
		});

		// 본인 외 상급 결재자(gb == '결재', todoId != jwt.userId) 중 실제로 승인/반려(sanctnSttusNm이 '승인' 또는 '반려')를 완료한 건이 있는지 체크
		var hasOtherApproverActed = rows.some(function(r) {
			var isApprover = (r.gb === "결재") && r.usrNm && r.usrNm !== jwt.userId;
			if (!isApprover) return false;
			var sanctnSttusNm = r.sanctnSttusNm || "";
			return (sanctnSttusNm.indexOf("승인") > -1 && sanctnSttusNm.indexOf("미승인") === -1)
				|| (sanctnSttusNm.indexOf("반려") > -1);
		});

		if (!hasOtherApproverActed) {
			// 상급 결재자가 아직 결재를 안 함 (본인만 승인되었거나 결재 대기중) -> 삭제/수정 버튼 표출 및 UI 해제
			$('#btnDeleteVacation').show();
			$('#btnSaveVacation').show();
			$('.popup_area #popForm input, .popup_area #popForm select, .popup_area #popForm textarea')
				.not('#reqId, #reqDeptId, #reqDeptNm, #reqDays, #deductDays').prop("disabled", false).css("background-color", "#ffffff");
			$('.popup_area .add_btn_small').show();
		} else {
			// 상급 결재자가 결재를 완료함 -> 삭제/수정 버튼 숨김 및 UI 잠금
			$('#btnDeleteVacation').hide();
			$('#btnSaveVacation').hide();
			$('.popup_area #popForm input, .popup_area #popForm select, .popup_area #popForm textarea')
				.prop("disabled", true).css("background-color", "#fafafa");
			$('.popup_area .add_btn_small').hide();
		}

		// 결재 -> 공유 순, 각 구분 안에서는 결재순번(순차결재 순서)대로 정렬
		rows.sort(function(a, b) {
			if (a.gb !== b.gb) return (a.gb === "결재") ? -1 : 1;
			return a.sanctnSn - b.sanctnSn;
		});

		approvalGridView.setData(rows);
	}

	// 결재자/공유자 선택 삭제 (AX5 Grid 선택 인덱스 정밀 수집)
	function deleteShareUser() {
		var gridTarget = approvalGridView.target;
		if (!gridTarget || !gridTarget.list) return;

		var deleteIndexes = [];

		// 1차: getList("selected") 체크박스 및 선택 상태 행 수집
		var selectedList = gridTarget.getList("selected");
		if (selectedList && selectedList.length > 0) {
			$.each(selectedList, function(i, item) {
				var idx = gridTarget.list.indexOf(item);
				if (idx > -1 && deleteIndexes.indexOf(idx) < 0) {
					deleteIndexes.push(idx);
				}
			});
		}

		// 2차: selectedDataIndexs 객체/배열 탐색 ({ "0": true, "1": true })
		var selMap = gridTarget.selectedDataIndexs;
		if (selMap) {
			if (Array.isArray(selMap)) {
				$.each(selMap, function(i, idxVal) {
					var idx = parseInt(idxVal, 10);
					if (!isNaN(idx) && idx > -1 && deleteIndexes.indexOf(idx) < 0) {
						deleteIndexes.push(idx);
					}
				});
			} else if (typeof selMap === 'object') {
				for (var k in selMap) {
					if (selMap[k]) {
						var idx = parseInt(k, 10);
						if (!isNaN(idx) && idx > -1 && deleteIndexes.indexOf(idx) < 0) {
							deleteIndexes.push(idx);
						}
					}
				}
			}
		}

		// 3차: focusedRow 포커스 행 탐색
		if (deleteIndexes.length === 0 && gridTarget.focusedRow !== undefined && gridTarget.focusedRow !== null) {
			var fIdx = parseInt(gridTarget.focusedRow, 10);
			if (!isNaN(fIdx) && fIdx > -1 && deleteIndexes.indexOf(fIdx) < 0) {
				deleteIndexes.push(fIdx);
			}
		}

		if (deleteIndexes.length === 0) {
			alert("삭제할 결재자 또는 공유자 행을 선택하세요.");
			return;
		}

		// 승인완료 검증
		var hasApproved = false;
		$.each(deleteIndexes, function(i, idx) {
			var item = gridTarget.list[idx];
			if (item && (item.sanctnSttus === 'Y' || (item.todoCfDt && item.todoCfDt.trim().length > 0))) {
				hasApproved = true;
				return false;
			}
		});

		if (hasApproved) {
			alert("이미 승인(확인) 완료된 결재자는 삭제할 수 없습니다.");
			return;
		}

		// 역순(내림차순) 정렬하여 removeRow 실행 (배열 인덱스 시프트 꼬임 방지)
		deleteIndexes.sort(function(a, b) { return b - a; });

		$.each(deleteIndexes, function(i, idx) {
			gridTarget.removeRow(idx);
		});

		// 순번(sanctnSn) 재정립
		if (typeof $.gridNoSet === 'function') {
			$.gridNoSet(approvalGridView, "sanctnSn");
		}

		// 그리드 높이 유동 조절 (전역 규칙)
		if (typeof gridResize === 'function') {
			var listLen = gridTarget.getList ? gridTarget.getList().length : gridTarget.list.length;
			gridResize(approvalGridView, listLen);
		}
	}

	// 결재선 배열 생성
	function processApprovalGrid() {
		var approvalArr = [];
		var allList = approvalGridView.target.list || [];

		$.each(allList, function(idx, item) {
			var todoDiv1CodeId = "";
			var todoDiv2CodeId = "";
			if (item.gb === "결재") {
				todoDiv1CodeId = "TODODIV20";
				todoDiv2CodeId = "TODODIV2300";

	// to-do결재요청 알림톡
	function commKaKaoSendTodo(param) {
		var maxMessageId = null;
		var talkMessage = null;
		var mobile = null;
		var todoDiv2CodeNm = null;
		var sendList = [];
		let talkParam = {};
		let talkBody = {};
		let sendCnt = 0;
		postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function(data) {
			if(data.resultList.length > 0 ) {
				if( data.resultList[0].maxMessageId != "" ) {
					sendList = data.resultList;
				} else {
					alert("알림톡 발송을 위한 messageId 생성에 실패 했습니다.");
					return;
				}
			}
		});

		$.each(sendList, function (key, sendObj) {
			maxMessageId = sendObj.maxMessageId;
			talkMessage = sendObj.messageDesc;
			mobile =  sendObj.telNo;
			param.rcvId = sendObj.todoId;
			param.rcvNm = sendObj.name;
			param.nameTo = sendObj.name;
			todoDiv2CodeNm = sendObj.todoTitl;
			param.todoDiv2CodeNm = todoDiv2CodeNm;
			param.sendDt = sendObj.sendDt;

			if(mobile == "" || mobile == null) {
				alert('수신전화번호가 없습니다.');
				return;
			}
			if(talkMessage == "" || talkMessage == null) {
				alert('발송할 내용이 없습니다.');
				return;
			}

			let message = talkMessage;
			let splitStr = Array.from(message.matchAll('\\{(.*?)\\}'), match => `${match[0]}`);
			$.each(splitStr, function (key, val) {
				let compKey = val.substring(1, val.length-1);
				if( compKey != "" && compKey != "undefined" ) {
					if( typeof(param[compKey]) != "undefined" ) {
						let val2 = '#'+val;
						message = message.replaceAll(val2, param[compKey]);
					}
				}
			});

			talkParam.authToken = "e/eDfZOFCsrBqadaECQ0+g==";
			talkParam.serverName = "gyitt2400";
			talkParam.paymentType = "P";
			talkBody.service = "2310086157";
			talkBody.messageId = maxMessageId;
			talkBody.title = param.title;
			talkBody.message = message;
			talkBody.mobile = mobile;
			talkBody.template = "10003";
			let talkJson = JSON.stringify(talkBody);
			if (typeof jwt !== 'undefined' && jwt.kakaoSend) {
				sendCnt = kakaoSendReal(talkJson, talkParam, param);
			}
		});

		if( sendCnt > 0 ) {
			kakaoCnt++;
		}
	}

	// 저장
	function saveVacation() {
		if ($('#actionType').val() === 'U' && editInitialSnapshot !== null
			&& editInitialSnapshot === getVacationEditSnapshot()) {
			alert("수정된 내용이 없습니다.");
			modalStack.close();
			return;
		}
		if (!validateForm()) return;

		var stDtVal = $('#stDt').val() || "";
		var edDtVal = $('#edDt').val() || "";
		var stDt = stDtVal.replace(/-/g, '');
		var edDt = edDtVal.replace(/-/g, '');
		var stTm = ($('#stTm').val() || "").replace(/:/g, '');
		var edTm = ($('#edTm').val() || "").replace(/:/g, '');

		var approvalArr = processApprovalGrid();

		// 휴가일자 목록 생성 (주말·공휴일 제외)
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text();
		var workHour = isHalfDayType(selectedNm) ? 4 : 8;  // 반차류 4, 그 외 8
		var vacDtArr = [];
		if (typeof listWorkingDays === 'function') {
			var dayList = listWorkingDays(stDtVal, edDtVal);  // YYYY-MM-DD 형식
			vacDtArr = dayList.map(function(d) {
				return { vacDt : d.replace(/\-/g, ''), workHour : workHour };  // 서버는 YYYYMMDD
			});
		}

		var formData = new FormData();
		formData.append("coCd", "GUN");
		formData.append("actionType", $('#actionType').val());
		formData.append("reqNo", $('#reqNo').val());
		formData.append("reqTitl", $('#reqTitl').val());
		formData.append("reqId", $('#popForm').find('#reqId').val() || jwt.userId);
		formData.append("reqDeptId", $('#popForm').find('#reqDeptId').val() || jwt.deptId);
		formData.append("vacTypeCd", $('#vacTypeCd').val());
		formData.append("ampmCd", $('#ampmCd').val());
		formData.append("stDt", stDt);
		formData.append("edDt", edDt);
		formData.append("stTm", "");
		formData.append("edTm", "");
		formData.append("vacDays", $('#vacDays').val());
		formData.append("deductDays", $('#deductDays').val());
		formData.append("reqRmk", $('#reqRmk').val());
		formData.append("vacDtArr", JSON.stringify(vacDtArr));
		formData.append("approvalArr", JSON.stringify(approvalArr));
		formData.append("userId", jwt.userId);
		formData.append("pgmId", "PM0701P01");
		// 파일 첨부 처리 (treeModule 신규 바이너리 파일 append 및 uploadFileArr 전송)
		if (typeof treeModule !== 'undefined' && typeof treeModule.getFileArr === 'function') {
			if (typeof treeModule.setFileNodeId === 'function') {
				treeModule.setFileNodeId("FITR9902");
			}
			formData.append("comonCd", "FITR9902");

			var fileUploadArr = [];
			var totalFileSize = 0;
			$.each(treeModule.getFileArr(), function (idx, obj) {
				if (obj.fileKey == 0 || !obj.fileKey) {
					formData.append('files', obj.file);
					if (obj.file && obj.file.size) {
						totalFileSize += obj.file.size;
					}
					var cloneObj = $.extend({}, obj);
					cloneObj.file = '';
					fileUploadArr.push(cloneObj);
				}
			});

			formData.append('uploadFileArr', JSON.stringify(fileUploadArr));
			formData.append('deleteFileArr', JSON.stringify(treeModule.getDeleteFileArr()));
		}

		var apiUrl = ($('#actionType').val() === "C") ? "/user/pm/pm07/insertVacation" : "/user/pm/pm07/updateVacation";

		filePostAjax(apiUrl, formData, function(data) {
			if (data && (data.resultCode == 200 || data.resultCode == "200")) {
				var resReqNo = (data.result && data.result.reqNo) ? data.result.reqNo : (data.reqNo || "");
				if (resReqNo && $('#reqNo').val() === "") {
					$('#reqNo').val(resReqNo);
				}
				try {
					kakaoTodo();
				} catch (e) {
					console.error("알림톡 발송 실패 (저장은 정상 처리됨):", e);
				}
				alert("저장되었습니다.");
				refreshParentScreens();
				modalStack.close();
			} else {
				var msg = (data && data.resultMessage) ? data.resultMessage : ((data && data.result && data.result.resultMessage) ? data.result.resultMessage : "저장 실패");
				alert(msg);
			}
		});
	}

				if (!dt) return "";
				var s = String(dt).replace(/[^0-9]/g, '');

			};
			var formatTmStr = function(tm) {
				if (!tm) return "";
				var s = String(tm).replace(/[^0-9]/g, '');
				if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);

			//   ING - 1명 이상 승인, END - 전원 승인완료, RTN - 반려(승인action 발생).
			// TEMP/REQ 는 "결재 진행된 게 없는" 상태이므로 수정 가능해야 한다.

				$('.popup_area .add_btn_small').hide();

					return $(this).text().replace(/\s/g, '') === "저장";
				}).hide();

				// 첨부 편집 차단 - treeModule 이 fileList_area 안에 그린 파일추가/삭제 컨트롤을 숨긴다.
				// (다운로드는 그대로 가능해야 하므로 영역 전체를 숨기지 않는다.)
				$('.popup_area #fileList_area button').filter(function() {

					return t === "삭제" || t === "파일추가" || t === "추가";
				}).hide();
				$('.popup_area #fileList_area input[type="file"]').prop("disabled", true);
			}
		}

		// 수정 모드의 조회 완료값을 기준으로 변경 여부를 판단한다.
		if (actionType === 'U') {
			setTimeout(function() {
				editInitialSnapshot = getVacationEditSnapshot();
			}, 700);
		}

		// 날짜 picker 초기화 (연차, 교육훈련, 경조, 포상, 하계, 대체, 병가만 From-Till 기간선택, 그 외 팝업달력 실시간 양방향 동일일자 동기화)
		$('#stDt, #edDt').off('click').on('click', function(){
			if ($('#stDt').is(':disabled') || $('#edDt').is(':disabled') || $('#reqRmk').is(':disabled')) return;
			var clickedId = $(this).attr('id'); // 'stDt' 또는 'edDt'
			var selectedOption = $('#vacTypeCd').find('option:selected');
			var selectedNm = selectedOption.text() || '';
			var isMulti = isMultiDayType(selectedNm);

			DateRangePicker.open({
				startDt: $('#stDt').val() || null,
				endDt:   $('#edDt').val() || null,
				singleMode: !isMulti,
				excludeSelectors: ['#stDt', '#edDt'],
				onApply: function(sd, ed){
					var selectedOption = $('#vacTypeCd').find('option:selected');
					var selectedNm = selectedOption.text() || '';
					if (isMultiDayType(selectedNm)) {
						// 허용된 7가지 유형(연차, 교육, 훈련, 경조, 포상, 하계, 대체, 병가)은 From-Till 기간선택 적용
						$('#stDt').val(sd || '');
						$('#edDt').val(ed || sd || '');
					} else {
						// 반차, 조퇴, 외출 등 단일일 전용 옵션인 경우:
						// 시작일(#stDt)을 클릭해서 바꾸면 종료일(#edDt)도 동일날짜로 선택!
						// 종료일(#edDt)을 클릭해서 바꾸면 시작일(#stDt)도 동일날짜로 변경!
						var chosenDt = (clickedId === 'edDt') ? (ed || sd || '') : (sd || ed || '');
						$('#stDt').val(chosenDt);
						$('#edDt').val(chosenDt);
					}
					onDateChanged();
				}
			});
		});
	});

</script>
