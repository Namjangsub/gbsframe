<div class="popup_area of_a" style="width: 100%; height: 100%;">
	<div class="tit_contents">
		<h4 class="tit" id="popupTitle">휴가신청</h4>
	</div>

	<form id="popForm" onSubmit="return false;">
		<div class="form-group popup_table">
			<input type="hidden" id="coCd" name="coCd" value="GUN">
			<input type="hidden" id="actionType" name="actionType" value="C">
			<input type="hidden" id="reqNo" name="reqNo" value="">

			<!-- 기본정보 및 휴가기간 입력 테이블 -->
			<table class="popup_table" style="margin-bottom: 15px;">
				<colgroup>
					<col width="15%">
					<col width="35%">
					<col width="15%">
					<col width="35%">
				</colgroup>
				<tbody>
					<!-- 1행: 휴가신청자 / 휴가유형 -->
					<tr>
						<th class="hit">휴가신청자</th>
						<td>
							<input type="text" id="reqTitl" name="reqTitl" class="form-control input-sm" placeholder="휴가신청자 성명" maxlength="200" style="width: 100%;">
						</td>
						<th class="hit">휴가유형</th>
						<td>
							<select id="vacTypeCd" name="vacTypeCd" data-kind="PM07TYPE" class="form-control input-sm" style="width: 100%;" onchange="onVacTypeChanged();">
								<option value="">선택하세요</option>
							</select>
						</td>
					</tr>
					<!-- 2행: 구분(오전/오후) / 시각 -->
					<tr>
						<th id="ampmTh">구분(오전/오후)</th>
						<td>
							<select id="ampmCd" name="ampmCd" data-kind="PM07AMPM" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" disabled onchange="onAmPmChanged();">
								<option value="">선택하세요</option>
							</select>
						</td>
						<th>시각 (시작 ~ 종료)</th>
						<td>
							<div style="display: flex; align-items: center; gap: 5px; cursor: pointer;" onclick="openTimeRangePicker();">
								<input type="text" id="stTm" name="stTm" class="form-control input-sm" style="width: 48%; cursor: pointer; background: #fafafa !important;" placeholder="08:30" maxlength="5" onclick="openTimeRangePicker();" onkeyup="timeMask(this);" onchange="onDateChanged();" disabled>
								<span>~</span>
								<input type="text" id="edTm" name="edTm" class="form-control input-sm" style="width: 48%; cursor: pointer; background: #fafafa !important;" placeholder="17:30" maxlength="5" onclick="openTimeRangePicker();" onkeyup="timeMask(this);" onchange="onDateChanged();" disabled>
							</div>
						</td>
					</tr>
					<!-- 3행: 시작일자 ~ 종료일자 -->
					<tr>
						<th class="hit">시작일자</th>
						<td>
							<input type="text" id="stDt" name="stDt" class="input_calendar form-control input-sm" autocomplete="off" style="cursor:pointer; width: 100%;" msg="시작일자" onchange="onDateChanged();">
						</td>
						<th class="hit">종료일자</th>
						<td>
							<input type="text" id="edDt" name="edDt" class="input_calendar form-control input-sm" autocomplete="off" style="cursor:pointer; width: 100%;" msg="종료일자" onchange="onDateChanged();">
						</td>
					</tr>
					<!-- 겹침 경고 -->
					<tr id="vacOverlapWarningRow" style="display: none;">
						<td colspan="4" style="padding: 4px 8px;">
							<span id="vacOverlapWarning" style="color: #d9534f; font-size: 12px; font-weight: bold;"></span>
						</td>
					</tr>
					<!-- 4행: 휴가일수 / 차감일수 -->
					<tr>
						<th>휴가일수</th>
						<td>
							<input type="text" id="vacDays" name="vacDays" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" readonly>
						</td>
						<th>차감일수</th>
						<td>
							<input type="text" id="deductDays" name="deductDays" class="form-control input-sm" style="width: 100%; background: #fafafa !important;" readonly>
						</td>
					</tr>
					<!-- 5행: 사유 -->
					<tr>
						<th id="reqRmkTh">사유</th>
						<td colspan="3">
							<textarea id="reqRmk" name="reqRmk" class="form-control input-sm" style="width: 100%; height: 70px; resize: vertical;" placeholder="사유를 입력하세요" maxlength="1000"></textarea>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- 결재선 및 공유선 통합 그리드 -->
			<div style="margin-top: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
				<span style="font-size: 13px; font-weight: bold; color: blue;">결재선 및 공유선</span>
				<div class="add_btn_small pdl10">
					<a onclick="insertShareUser();" style="height: 30px; line-height: 28px; width: 130px;" authchk>결재자/공유자 지정</a>
					<a onclick="deleteShareUser();" style="height: 30px; line-height: 28px; width: 75px;" authchk>선택 삭제</a>
				</div>
			</div>
			<div class="ax5_grid" style="width: 100%;">
				<div data-ax5grid="approvalGrid" data-ax5grid-config="{}" style="height: 220px; width: 100%;"></div>
			</div>

			<!-- 첨부파일 영역 -->
			<div style="margin-top: 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
				<span style="font-size: 13px; font-weight: bold; color: blue;">첨부파일</span>
				<!-- 파일추가/삭제 버튼을 직접 만들지 않는다.
				     treeModule.initAll() 이 fileList_area 안에 그리드와 파일 input, 행별 삭제 버튼을
				     스스로 생성한다(fileTree.js createFileInput / deleteFile(dindex)).
				     treeModule 공개 API 에 addFile() 은 존재하지 않는다. -->

			</div>
			<!-- 공통 파일 영역 -->
			<div id="fileList_area"></div>

			<!-- 임시저장 작업일보 미생성 안내 문구 -->
			<div style="margin-top: 10px; margin-bottom: 5px;">
				<p style="color: #d9534f; font-size: 12px; font-weight: bold; line-height: 1.5; margin: 0; padding: 6px 10px; background-color: #fdf2f2; border: 1px solid #f5c6cb; border-radius: 3px;">
					<i class="fas fa-exclamation-circle"></i> <span>안내: 임시저장 상태에서는 작업일보에 휴가가 자동 등록되지 않으며, 결재자 지정 후 결재 상신(신청) 시에만 작업일보에 등록됩니다.</span>
				</p>
			</div>

			<!-- 하단 버튼 영역 -->
			<div class="col-xs-12 text-right popup_bottom_btn" style="margin-top: 15px; padding-right: 0;">
				<button type="button" class="btn btn-default btn-sm" onclick="saveVacation();">저 장</button>
				<button type="button" class="btn btn-default btn-sm" onclick="modalStack.close();">닫 기</button>
			</div>
		</div>
	</form>
</div>

<script type="text/javascript">

	// 유형 판정 함수 (코드명 기반 — 코드값 확정 시 교체)
	// TODO: 공통코드 PM07TYPE 코드값 확정 후 아래 함수들의 판정 로직을 코드값 기반으로 변경할 것
	function isHalfDayType(codeNm) {
		if (!codeNm) return false;
		return codeNm.indexOf("반차") >= 0;
	}

	function isTimeType(codeNm) {
		if (!codeNm) return false;
		return codeNm.indexOf("조퇴") >= 0 || codeNm.indexOf("외출") >= 0;
	}

	// 연차, 반차, 조퇴, 외출, 하계휴가(대체), 병가는 사유 필수입력 제외 판정
	function isRmkOptional(codeNm) {
		if (!codeNm) return false;
		var nm = codeNm.trim();
		return nm.indexOf("연차") >= 0
			|| nm.indexOf("반차") >= 0
			|| nm.indexOf("조퇴") >= 0
			|| nm.indexOf("외출") >= 0
			|| nm.indexOf("하계") >= 0
			|| nm.indexOf("대체") >= 0
			|| nm.indexOf("병가") >= 0;
	}

	// 구분(오전/오후) 선택 변경 이벤트
	function onAmPmChanged() {
		var ampmVal = $('#ampmCd').val();
		var ampmText = $('#ampmCd').find('option:selected').text();

		// 오전 근무 (08:30 ~ 12:30)
		if (ampmText.indexOf("오전") >= 0 || ampmVal === "AM" || ampmVal === "PM07AMPM10") {
			$('#stTm').val("08:30");
			$('#edTm').val("12:30");
		}
		// 오후 근무 (13:30 ~ 17:30)
		else if (ampmText.indexOf("오후") >= 0 || ampmVal === "PM" || ampmVal === "PM07AMPM20") {
			$('#stTm').val("13:30");
			$('#edTm').val("17:30");
		}
		onDateChanged();
	}

	// 휴가유형 변경 이벤트
	function onVacTypeChanged() {
		var selectedCd = $('#vacTypeCd').val();
		if (!selectedCd) {
			$('#ampmCd').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#ampmTh').removeClass("hit");
			$('#stTm').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#edTm').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#reqRmkTh').removeClass("hit");
			$('#reqRmk').attr("placeholder", "사유를 입력하세요");
			return;
		}

		// 선택된 옵션의 코드명 취득
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text();

		// 사유 필수 여부 제어 (연차, 반차, 조퇴, 외출, 하계, 대체, 병가는 필수입력 아님)
		if (isRmkOptional(selectedNm)) {
			$('#reqRmkTh').removeClass("hit");
			$('#reqRmk').attr("placeholder", "사유를 입력하세요 (선택)");
		} else {
			$('#reqRmkTh').addClass("hit");
			$('#reqRmk').attr("placeholder", "사유를 입력하세요 (필수)");
		}

		// 반차류(반차, 포상휴가반차, 대체휴가반차)
		if (isHalfDayType(selectedNm)) {
			$('#ampmCd').prop("disabled", false).css("background", "#ffffff !important");
			$('#ampmTh').addClass("hit");  // 구분(오전/오후) 열리면 필수 표시
			$('#stTm').prop("disabled", false).css("background", "#ffffff !important");
			$('#edTm').prop("disabled", false).css("background", "#ffffff !important");
			if ($('#ampmCd').val()) {
				onAmPmChanged();
			} else {
				if (!$('#stTm').val()) $('#stTm').val("08:30");
				if (!$('#edTm').val()) $('#edTm').val("12:30");
			}
		}
		// 조퇴/외출 (시간 입력 필요)
		else if (isTimeType(selectedNm)) {
			$('#ampmCd').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#ampmTh').removeClass("hit");
			$('#stTm').prop("disabled", false).css("background", "#ffffff !important");
			$('#edTm').prop("disabled", false).css("background", "#ffffff !important");
			if (!$('#stTm').val()) $('#stTm').val("08:30");
			if (!$('#edTm').val()) $('#edTm').val("17:30");
		}
		// 그 외(전일 연차 등)
		else {
			$('#ampmCd').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#ampmTh').removeClass("hit");
			$('#stTm').prop("disabled", true).val("").css("background", "#fafafa !important");
			$('#edTm').prop("disabled", true).val("").css("background", "#fafafa !important");
		}

		onDateChanged();
	}

	// 겹침 여부 서버 조회. 반환값 true = 겹침 없음(정상), false = 겹침 있음(경고 표시됨).
	// 신청자는 로그인 사용자 본인(jwt.userId) 기준 — PM07 화면에는 별도 신청자ID 필드가 없다(kakaoTodo() 주석 참고).
	function checkVacationOverlap(showAlert) {
		var stDtVal = $('#stDt').val();
		var edDtVal = $('#edDt').val();
		if (!stDtVal || !edDtVal || stDtVal.length < 10 || edDtVal.length < 10) {
			$('#vacOverlapWarningRow').hide();
			$('#vacOverlapWarning').text('');
			return true;
		}

		var stDt = stDtVal.replace(/\-/g, '');
		var edDt = edDtVal.replace(/\-/g, '');
		var stTm = ($('#stTm').val() || '').replace(/:/g, '') || '0000';
		var edTm = ($('#edTm').val() || '').replace(/:/g, '') || '2359';

		var paramObj = {
			"coCd"  : $('#coCd').val() || "GUN",
			"reqId" : jwt.userId,
			"stDt"  : stDt,
			"edDt"  : edDt,
			"stTm"  : stTm,
			"edTm"  : edTm,
			"reqNo" : $('#reqNo').val() || ""
		};

		var overlapList = [];
		postAjaxSync("/user/pm/pm07/selectVacationOverlapCheck", paramObj, null, function(data) {
			overlapList = (data && data.resultList) ? data.resultList : [];
		});

		if (overlapList.length > 0) {
			var msgLines = overlapList.map(function(r) {
				var dtStr = r.stDt + ((r.edDt && r.edDt !== r.stDt) ? (' ~ ' + r.edDt) : '');
				var tmInfo = '';
				if (r.stTm && r.edTm && !(r.stTm === '00:00' && r.edTm === '23:59')) {
					tmInfo = ', ' + r.stTm + '~' + r.edTm;
				}
				return dtStr + ' (' + (r.vacTypeNm || '') + tmInfo + ')';
			});
			var warnMsg = '⚠ 이전에 신청한 휴가일자와 겹칩니다: ' + msgLines.join(', ');
			$('#vacOverlapWarning').text(warnMsg);
			$('#vacOverlapWarningRow').show();
			if (showAlert) {
				alert(warnMsg);
			}
			return false;
		} else {
			$('#vacOverlapWarningRow').hide();
			$('#vacOverlapWarning').text('');
			return true;
		}
	}

	// 날짜 변경 이벤트 (휴가일수/차감일수 자동계산)
	function onDateChanged() {
		var stDt = $('#stDt').val();
		var edDt = $('#edDt').val();
		var vacTypeCd = $('#vacTypeCd').val();

		if (!stDt || !edDt || !vacTypeCd) {
			$('#vacDays').val("");
			$('#deductDays').val("");
			return;
		}

		// YYYY-MM-DD 형식 유지 (listWorkingDays 필수)
		if (stDt.length < 10 || edDt.length < 10) {
			$('#vacDays').val("");
			$('#deductDays').val("");
			return;
		}

		// 영업일 목록 조회 (주말·공휴일 제외, workingDayCalc.js 사용)
		var vacDays = 0;
		try {
			if (typeof listWorkingDays === 'function' && typeof KoreanLunarCalendar !== 'undefined') {
				var dayList = listWorkingDays(stDt, edDt);
				vacDays = (dayList && dayList.length > 0) ? dayList.length : 0;
			} else {
				var stDate = moment(stDt, "YYYY-MM-DD");
				var edDate = moment(edDt, "YYYY-MM-DD");
				vacDays = edDate.diff(stDate, 'days') + 1;
			}
		} catch (e) {
			var stDate = moment(stDt, "YYYY-MM-DD");
			var edDate = moment(edDt, "YYYY-MM-DD");
			vacDays = edDate.diff(stDate, 'days') + 1;
		}

		// 반차/포상휴가반차/대체휴가반차는 0.5
		var selectedOption = $('#vacTypeCd').find('option:selected');
		var selectedNm = selectedOption.text();
		var deductDays = 0;

		if (isHalfDayType(selectedNm)) {
			deductDays = 0.5;
		} else if (selectedNm.indexOf("연차") >= 0) {
			deductDays = vacDays;
		} else {
			deductDays = 0;
		}

		$('#vacDays').val(vacDays.toFixed(1));
		$('#deductDays').val(deductDays.toFixed(1));
		checkVacationOverlap(true);
	}

	// 시작~종료 시간범위 선택 통합 피커 팝업
	function openTimeRangePicker() {
		if ($('#stTm').is(':disabled') || $('#edTm').is(':disabled') || $('#reqRmk').is(':disabled')) return;

		$('#timeRangePickerLayer').remove();

		var timeOptions = [
			"08:00", "08:30", "09:00", "09:30", "10:00", "10:30",
			"11:00", "11:30", "12:00", "12:30", "13:00", "13:30",
			"14:00", "14:30", "15:00", "15:30", "16:00", "16:30",
			"17:00", "17:30", "18:00", "18:30", "19:00"
		];

		var curStTm = $('#stTm').val() || "09:00";
		var curEdTm = $('#edTm').val() || "13:00";

		var html = '<div id="timeRangePickerLayer" style="position: absolute; z-index: 999999; background: #ffffff; border: 1px solid #3b62b1; box-shadow: 0 4px 18px rgba(0,0,0,0.22); border-radius: 6px; padding: 12px; width: 340px;">';
		html += '<div style="font-weight: bold; font-size: 13px; color: #3b62b1; margin-bottom: 8px; text-align: center; border-bottom: 1px solid #e1e8f5; padding-bottom: 6px;">시작 ~ 종료 시각 선택</div>';
		html += '<div style="display: flex; gap: 10px;">';
		
		// 시작시간 컬럼
		html += '<div style="flex: 1;">';
		html += '<div style="font-size: 11px; font-weight: bold; color: #555; text-align: center; margin-bottom: 4px;">시작시각 (From)</div>';
		html += '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; max-height: 180px; overflow-y: auto;">';
		$.each(timeOptions, function(idx, tm) {
			var activeStyle = (curStTm === tm) ? 'background: #3b62b1; color: #fff; font-weight: bold; border-color: #3b62b1;' : 'background: #f4f6fa; color: #333;';
			html += '<button type="button" class="st-time-btn" data-tm="' + tm + '" style="border: 1px solid #ccd5e6; border-radius: 3px; padding: 5px 0; font-size: 11px; cursor: pointer; ' + activeStyle + '" onclick="setRangePickerStTm(\'' + tm + '\');">' + tm + '</button>';
		});
		html += '</div></div>';

		// 종료시간 컬럼
		html += '<div style="flex: 1;">';
		html += '<div style="font-size: 11px; font-weight: bold; color: #555; text-align: center; margin-bottom: 4px;">종료시각 (To)</div>';
		html += '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; max-height: 180px; overflow-y: auto;">';
		$.each(timeOptions, function(idx, tm) {
			var activeStyle = (curEdTm === tm) ? 'background: #28a745; color: #fff; font-weight: bold; border-color: #28a745;' : 'background: #f4f6fa; color: #333;';
			html += '<button type="button" class="ed-time-btn" data-tm="' + tm + '" style="border: 1px solid #ccd5e6; border-radius: 3px; padding: 5px 0; font-size: 11px; cursor: pointer; ' + activeStyle + '" onclick="setRangePickerEdTm(\'' + tm + '\');">' + tm + '</button>';
		});
		html += '</div></div>';

		html += '</div>';

		// 하단 버튼
		html += '<div style="text-align: right; margin-top: 10px; border-top: 1px solid #e1e8f5; padding-top: 8px;">';
		html += '<button type="button" class="btn btn-xs btn-primary" onclick="applyTimeRangePicker();">확 인</button> ';
		html += '<button type="button" class="btn btn-xs btn-default" onclick="$(\'#timeRangePickerLayer\').remove();">취 소</button>';
		html += '</div>';

		html += '</div>';

		$('body').append(html);

		var $target = $('#stTm');
		var offset = $target.offset();
		$('#timeRangePickerLayer').css({
			top: (offset.top + $target.outerHeight() + 2) + 'px',
			left: offset.left + 'px'
		});

		setTimeout(function() {
			$(document).one('click', function(e) {
				if (!$(e.target).closest('#timeRangePickerLayer, #stTm, #edTm').length) {
					$('#timeRangePickerLayer').remove();
				}
			});
		}, 10);
	}

	function setRangePickerStTm(tm) {
		$('#stTm').val(tm);
		$('.st-time-btn').css({ background: '#f4f6fa', color: '#333', 'font-weight': 'normal', 'border-color': '#ccd5e6' });
		$('.st-time-btn[data-tm="' + tm + '"]').css({ background: '#3b62b1', color: '#fff', 'font-weight': 'bold', 'border-color': '#3b62b1' });
	}

	// 기본 결재라인 자동 구성 : 담당자 -> 담당자팀장 -> 경영지원팀(공통코드 SPECRTS17)
	// PM5101P01.html 의 setApplicantDefaultApprovalLine / setApplicantDefaultApprovalLineMng 와 동일 방식.
	// 경영지원팀 결재자는 공통코드 CODE_ID='SPECRTS17' 의 CODE_ETC 에 사번을 콤마로 나열하고,
	// 그 나열 순서가 곧 결재 순번이 된다. (사용자가 Tibero 에 등록해야 함)
	function setDefaultApprovalLine() {
		var reqId = jwt.userId;
		if (!reqId) return;

		var autoList = [];
		var addedIds = {};

		function pushApprover(u) {
			if (!u || !u.id) return;
			var key = String(u.id).toLowerCase();
			if (addedIds[key]) return;		// 동일인 중복 결재행 방지
			addedIds[key] = true;
			autoList.push({
				gb    : "결재",
				usrNm : u.id,
				todoId: u.id,
				name  : u.name || u.id,
				jik   : u.levelNm || '',
				dtNm  : u.deptNm || '',
				telNo : u.telNo || '',
				email : u.email || '',
				sanctnSttusNm : '미승인'
			});
		}

		// 1) 담당자(신청자) 본인
		var isTeamMgr = false;
		postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": reqId }, null, function(data) {
			if (data && data.userInfo) {
				isTeamMgr = (data.userInfo.teamManager === 'TEAM01');
				pushApprover(data.userInfo);
			}
		});

		// 2) 담당자 팀장 (신청자가 팀장 본인이면 건너뛴다)
		if (!isTeamMgr) {
			postAjaxSync("/user/wb/wb24/selectTeamManagerInfo", { "userId": reqId }, null, function(data) {
				if (data && data.result) {
					pushApprover(data.result);
				}
			});
		}

		// 3) 경영지원팀 (SPECRTS17 의 CODE_ETC 등록 순서대로)
		postAjaxSync("/admin/cm/cm05/selectChildCodeList", { "codeId": "SPECRTS17" }, null, function(data) {
			var list = (data && data.childCodeList) ? data.childCodeList : [];
			if (list.length === 0) return;
			var codeEtc = list[0].codeEtc || '';
			if (!codeEtc) return;

			$.each(codeEtc.split(','), function(idx, rawId) {
				var uId = $.trim(rawId);
				if (!uId) return true;
				postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": uId }, null, function(userData) {
					if (userData && userData.userInfo) {
						pushApprover(userData.userInfo);
					}
				});
			});
		});

		// 순번은 배열 순서 그대로 (순차결재 순서 = 담당자 -> 팀장 -> 경영지원팀)
		$.each(autoList, function(idx, row) { row.sanctnSn = idx + 1; });

		approvalGridView.setData(autoList);
	}

	// 기존 문서의 결재선/공유선을 조회해 그리드에 표시한다. (수정·상세 진입 시)
	// 결재선은 TB_WB20M03 에 있으므로 WB20 공통 조회 API 를 쓴다.
	function loadApprovalLine(reqNo) {
		if (!reqNo) return;

		var rows = [];
		var divList = [
			{ cd: "TODODIV2300", gb: "결재" },
			{ cd: "TODODIV1300", gb: "공유" }
		];

		$.each(divList, function(i, div) {
			postAjaxSync("/user/wb/wb20/selectGetApprovalList",
				{ "todoNo": reqNo, "todoDiv2CodeId": div.cd }, null, function(data) {
					$.each(data.resultList || [], function(idx, r) {
						rows.push({
							gb            : div.gb,
							sanctnSn      : Number(r.sanctnSn || 0),
							coCd          : r.coCd || "GUN",
							usrNm         : r.todoId,
							empNo         : r.empNo || r.todoId,
							name          : r.todoNm || r.name,
							jik           : r.jik,
							reqDate       : r.reqDate || r.creatDttm || "",
							todoCfDt      : r.todoCfDt || "",
							todoCfOpn     : r.todoCfOpn || "",
							dtNm          : r.dtNm,
							todoId        : r.todoId,
							todoKey       : r.todoKey || "",
							flag          : r.flag || "",
							sanctnSttusNm : r.sanctnSttusNm
						});
					});
				});
		});

		// 결재 -> 공유 순, 각 구분 안에서는 결재순번(순차결재 순서)대로 정렬
		rows.sort(function(a, b) {
			if (a.gb !== b.gb) return (a.gb === "결재") ? -1 : 1;
			return a.sanctnSn - b.sanctnSn;
		});

		approvalGridView.setData(rows);
	}

	// to-do결재요청 알림톡
	function commKaKaoSendTodo(param) {
		var maxMessageId = null;
		var talkMessage = null;
		var mobile = null;
		var todoDiv2CodeNm = null;
		var sendList = [];
		let talkParam = {};
		let talkBody = {};
		let sendCnt = 0;
		postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function(data) {
			if(data.resultList.length > 0 ) {
				if( data.resultList[0].maxMessageId != "" ) {
					sendList = data.resultList;
				} else {
					alert("알림톡 발송을 위한 messageId 생성에 실패 했습니다.");
					return;
				}
			}
		});

		$.each(sendList, function (key, sendObj) {
			maxMessageId = sendObj.maxMessageId;
			talkMessage = sendObj.messageDesc;
			mobile =  sendObj.telNo;
			param.rcvId = sendObj.todoId;
			param.rcvNm = sendObj.name;
			param.nameTo = sendObj.name;
			todoDiv2CodeNm = sendObj.todoTitl;
			param.todoDiv2CodeNm = todoDiv2CodeNm;
			param.sendDt = sendObj.sendDt;

			if(mobile == "" || mobile == null) {
				alert('수신전화번호가 없습니다.');
				return;
			}
			if(talkMessage == "" || talkMessage == null) {
				alert('발송할 내용이 없습니다.');
				return;
			}

			let message = talkMessage;
			let splitStr = Array.from(message.matchAll('\\{(.*?)\\}'), match => `${match[0]}`);
			$.each(splitStr, function (key, val) {
				let compKey = val.substring(1, val.length-1);
				if( compKey != "" && compKey != "undefined" ) {
					if( typeof(param[compKey]) != "undefined" ) {
						let val2 = '#'+val;
						message = message.replaceAll(val2, param[compKey]);
					}
				}
			});

			talkParam.authToken = "e/eDfZOFCsrBqadaECQ0+g==";
			talkParam.serverName = "gyitt2400";
			talkParam.paymentType = "P";
			talkBody.service = "2310086157";
			talkBody.messageId = maxMessageId;
			talkBody.title = param.title;
			talkBody.message = message;
			talkBody.mobile = mobile;
			talkBody.template = "10003";
			let talkJson = JSON.stringify(talkBody);
			if (typeof jwt !== 'undefined' && jwt.kakaoSend) {
				sendCnt = kakaoSendReal(talkJson, talkParam, param);
			}
		});

		if( sendCnt > 0 ) {
			kakaoCnt++;
		}
	}

				return { vacDt : d.replace(/\-/g, ''), workHour : workHour };  // 서버는 YYYYMMDD
			});

		var formData = new FormData();
		formData.append("coCd", "GUN");
		formData.append("actionType", $('#actionType').val());
		formData.append("reqNo", $('#reqNo').val());
		formData.append("reqTitl", $('#reqTitl').val());

		formData.append("stTm", stTm);
		formData.append("edTm", edTm);
		formData.append("vacDays", $('#vacDays').val());
		formData.append("deductDays", $('#deductDays').val());
		formData.append("reqRmk", $('#reqRmk').val());
		formData.append("vacDtArr", JSON.stringify(vacDtArr));
		formData.append("approvalArr", JSON.stringify(approvalArr));
		formData.append("userId", jwt.userId);
		formData.append("pgmId", "PM0701P01");
		// 첨부 삭제분. 이걸 안 보내면 화면에서 첨부를 지워도 서버에 그대로 남는다. (CM1601P01 동일 패턴)
		formData.append("deleteFileArr", JSON.stringify(treeModule.getDeleteFileArr()));

		var apiUrl = ($('#actionType').val() === "C") ? "/user/pm/pm07/insertVacation" : "/user/pm/pm07/updateVacation";

		filePostAjax(apiUrl, formData, function(data) {
			if (data.resultCode == 200) {
				// 신청번호 설정
				if ($('#reqNo').val() === "") {
					$('#reqNo').val(data.result.reqNo || "");
				}
				// 알림톡 발송 (jwt.kakaoSend 가드는 kakaoTodo 내에서 처리).
				// 알림톡은 동기(postAjaxSync) 호출이라 내부에서 예외가 나면 그대로 전파되어
				// 아래 그리드 갱신/모달 닫기까지 도달하지 못한다. 저장은 이미 성공했으므로 격리한다.
				try {
					kakaoTodo();
				} catch (e) {
					console.error("알림톡 발송 실패 (저장은 정상 처리됨):", e);
				}
				alert("저장되었습니다.");
				// 목록 갱신 - modalStack.close() 는 openModal 의 callback 을 호출하지 않으므로
				// (global.js ModalStack.prototype.close 는 pop 후 close 만 한다) 부모 그리드를 직접 갱신한다.
				if (typeof gridView !== 'undefined' && gridView.setData) {
					gridView.setData(0);
				}
				modalStack.close();
			} else {
				alert(data.resultMessage || "저장 실패");
			}
		});
	}

	// 시간 마스크 (HH:MM)
	function timeMask(obj) {
		var v = obj.value.replace(/[^0-9]/g, '');
		if (v.length > 4) v = v.substring(0, 4);
		if (v.length >= 3) {
			obj.value = v.substring(0, 2) + ':' + v.substring(2);
		} else {
			obj.value = v;
		}
	}

	// 초기화
	$(document).ready(function() {
		// 부모 화면(PM0701M01)이 openModal 로 넘긴 파라미터. 이 선언이 없으면 paramObj 가
		// undefined 라 항상 신규등록(C) 모드로 떨어져 더블클릭 조회가 동작하지 않는다.
		var paramObj = modalStack.last().paramObj || {};

		// 공통코드 set
		setCommonSelect($('.popup_area select[data-kind]'));

		// 그리드 초기화
		approvalGridView.initView();

		// 파일첨부 초기화 (treeModule은 전역, 부모 PM0701M01이 fileTree.js 로드)
		if (typeof treeModule !== 'undefined') {
			var reqNo = paramObj.reqNo ? paramObj.reqNo : "";
			var fileParam = {
				fileTrgtTyp : "PM0701P01",
				fileTrgtKey : reqNo,
				todoNo      : reqNo
			};
			treeModule.initAll('deptTreeOrdars', 'file-grid', 'FILETREE', fileParam, 'fileList_area');
		}

		// 팝업 제목 및 데이터 설정
		var actionType = paramObj.actionType ? paramObj.actionType : "C";
		$('#actionType').val(actionType);

		if (actionType === "U") {
			$('#popupTitle').text("휴가신청 - 상세/수정");
			var reqNoVal = paramObj.reqNo || "";
			var coCdVal  = paramObj.coCd || "GUN";

			// 처리 시점에 DB 상세 자료를 직접 검색하여 폼에 출력
			var dtlData = {};
			postAjaxSync("/user/pm/pm07/selectVacationDtl", { "coCd": coCdVal, "reqNo": reqNoVal }, null, function(data) {
				if (data && data.result) {
					dtlData = data.result;
				}
			});

			$('#coCd').val(dtlData.coCd || coCdVal);
			$('#reqNo').val(dtlData.reqNo || reqNoVal);
			$('#reqTitl').val(dtlData.reqTitl || "");
			$('#vacTypeCd').val(dtlData.vacTypeCd || "").change();
			$('#ampmCd').val(dtlData.ampmCd || "");
			var formatDtStr = function(dt) {
				if (!dt) return "";
				var s = String(dt).replace(/[^0-9]/g, '');
				if (s.length === 8) return s.substring(0, 4) + "-" + s.substring(4, 6) + "-" + s.substring(6, 8);
				return dt;
			};
			var formatTmStr = function(tm) {
				if (!tm) return "";
				var s = String(tm).replace(/[^0-9]/g, '');
				if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);
				return tm;
			};

			$('#stDt').val(formatDtStr(dtlData.stDt));
			$('#edDt').val(formatDtStr(dtlData.edDt));
			$('#stTm').val(formatTmStr(dtlData.stTm));
			$('#edTm').val(formatTmStr(dtlData.edTm));
			$('#vacDays').val(dtlData.vacDays || "");
			$('#deductDays').val(dtlData.deductDays || "");
			$('#reqRmk').val(dtlData.reqRmk || "");

			// 기존 결재선/공유선 표시
			loadApprovalLine(dtlData.reqNo || reqNoVal);

			// 결재가 실제로 진행(누군가 승인/반려)되었거나 완료된 건만 읽기 전용 제어.
			// selectVacationDtl 의 SANCTN_STS 산출 기준(pm07.xml selectVacationDtl):
			//   TEMP - 결재선 없음, REQ - 결재선은 있으나 아무도 승인 안 함(=결재 진행된 게 없음),
			//   ING - 1명 이상 승인, END - 전원 승인완료, RTN - 반려(승인action 발생).
			// TEMP/REQ 는 "결재 진행된 게 없는" 상태이므로 수정 가능해야 한다.
			var sanctnSts = dtlData.sanctnSts || paramObj.sanctnSts || "";
			var isEditable = (!sanctnSts || sanctnSts === "TEMP" || sanctnSts === "SANCTN01" || sanctnSts === "0" || sanctnSts === "REQ");

			if (!isEditable) {
				var stsNm = (sanctnSts === "END" || sanctnSts === "SANCTN04" || sanctnSts === "Y") ? "결재완료" : "결재진행중";
				$('#popupTitle').text("휴가신청 - 상세 (" + stsNm + " - 수정불가)");
				// 셀렉터는 .popup_area 로 한정한다 (모달이 목록 화면과 같은 DOM 을 공유하므로 전역 #popForm 금지)
				$('.popup_area #popForm input, .popup_area #popForm select, .popup_area #popForm textarea')
					.prop("disabled", true).css("background-color", "#fafafa");
				// 결재자/공유자 지정·선택삭제 버튼과 저장 버튼 숨김
				$('.popup_area .add_btn_small').hide();
				$('.popup_area .popup_bottom_btn button').filter(function() {
					return $(this).text().replace(/\s/g, '') === "저장";
				}).hide();

				// 첨부 편집 차단 - treeModule 이 fileList_area 안에 그린 파일추가/삭제 컨트롤을 숨긴다.
				// (다운로드는 그대로 가능해야 하므로 영역 전체를 숨기지 않는다.)
				$('.popup_area #fileList_area button').filter(function() {
					var t = $(this).text().replace(/\s/g, '');
					return t === "삭제" || t === "파일추가" || t === "추가";
				}).hide();
				$('.popup_area #fileList_area input[type="file"]').prop("disabled", true);
			}
		} else {
			$('#popupTitle').text("휴가신청 - 신청등록");
			if (typeof jwt !== 'undefined' && jwt.userNm) {
				$('#reqTitl').val(jwt.userNm);
			}
			// 신규 등록 시 기본 시작일자, 종료일자는 현재일자로 기본 설정
			var todayStr = (typeof moment !== 'undefined') ? moment().format('YYYY-MM-DD') : new Date().toISOString().substring(0, 10);
			$('#stDt').val(todayStr);
			$('#edDt').val(todayStr);

			// 기본 결재라인 자동 구성 (담당자 -> 담당자팀장 -> 경영지원팀)
			setDefaultApprovalLine();
		}

		// 날짜 picker 초기화 (PM5102P01.html / PM5101P01.html 과 100% 동일한 DateRangePicker 패턴)
		$('#stDt, #edDt').off('click').on('click', function(){
			if ($('#stDt').is(':disabled') || $('#edDt').is(':disabled') || $('#reqRmk').is(':disabled')) return;
			DateRangePicker.open({
				startDt: $('#stDt').val() || null,
				endDt:   $('#edDt').val() || null,
				excludeSelectors: ['#stDt', '#edDt'],
				onApply: function(sd, ed){
					$('#stDt').val(sd || '');
					$('#edDt').val(ed || sd || '');
					onDateChanged();
				}
			});
		});
	});

</script>
