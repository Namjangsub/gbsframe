<style>
         .card {
             display: table;
             border: 1px solid #EEEEEE;
             margin-bottom: 10px;
             width: 100%;
         }
        .tg { border-collapse: collapse; border-spacing: 0; width: 100%;}
        .tg td { border-color: black; border-width: 0.5px; font-size: 10px; overflow: hidden; padding: 10px 5px; word-break: normal;}
	    .tg .tg-title { background-color:#EEEEEE; text-align: left; vertical-align: middle;}
        .tg .tg-menu { background-color:#EEEEEE;text-align: right; vertical-align: middle; font-size: 11px;  padding-right: 5px;}
        .tg .tg-rspn { width: 10px; text-align: left; vertical-align: middle; font-size: 11px;  padding-left: 5px;}

        /* 터치 친화버튼 */
         button {
             margin: 1px;
        }
		/* 모바일 여백조정 */
         .card-container {
             display: table;
		     width: 100%;
		     margin-bottom: 1px;
		     height: 10px;
         }
#main_area {
    padding: 0px 0px;
    overflow: auto;}

</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
      		<a class="back_btn"></a>
    	</div>
		<h1 class="logo">
      		<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
    	</h1>
	</div>

	<div id="main_area">
	    <div id="wbsPopup" class="popup_area" >
	        <div class="tit_contents">
	            <h4 class="tit">To-Do List</h4>
	        </div>
			<!-- 카드를 표시할 div 추가 -->
			<div id="cardContainer" class="card-container"></div>
			<!-- 카드를 표시할 div 끝 -->
		</div>
	</div>

<script type="text/javascript">
	var list = [];   //전체 list 저장용
	var sameTimeResult = '';

	$(document).ready(function () {

		var newScreenWidth = $(window).width();
    	var newScreenHeight = $(window).height();

    	$('.popup_area').css('min-width', (newScreenWidth-15) + 'px');
    	toDoList();
    	
    	authChk();
	});

	function toDoList () {
 	    var formData = {
				// "coCd"		: jwt.coCd,
                "salesMngId" : jwt.userId, // 공유대상자
                "boardParam" : "BOARD",
				"sanctnSttus" : "N",  //공유건은 미확인만
                "pageNo" :  1,
				"recordCnt" : 999999999,
 	           };
 	    if(jwt.userId =='EMJ8105') {
 	    	formData.beforeNotConfirm = "Yes" //전무님은 순차결재완료 된것만 조회가능하게 변경 2025.03.06
 	    }
		postAjax("/user/wb/wb20/M08selectToDoList", formData, null, function(data){
			list = data.resultList;

			let cardContainer = $("#cardContainer");
			cardContainer.empty();
            // 데이터를 이용하여 카드 생성 및 표시
            if (list.length > 0) {
	            $.each(list, function (index, item){
			    	var cardClass = "card-" + index;
			    	if  (item.teamManager==undefined) item.teamManager ='';

			    	// 이전 미결자 존재 여부 (1명 이상 복수 미결자 포함 동일 판정)
			    	var isBeforeNotConfirm = checkSequentialPending(item);
			    	var pendingBadge = isBeforeNotConfirm 
			    		? '<span style="display: inline-block; background-color: #d9534f; color: #ffffff; font-size: 11px; font-weight: bold; padding: 2px 6px; border-radius: 3px; margin-left: 6px; vertical-align: middle;">[이전결재 미결]</span>' 
			    		: '';
			    	var div1NameText = item.todoDiv1CodeNm + (isBeforeNotConfirm ? ' <span style="color: #d9534f; font-weight: bold; font-size: 10px;">(순차대기)</span>' : '');
			    	var btnClass = isBeforeNotConfirm ? 'btn-warning' : 'btn-success';
			    	var cardBorderStyle = isBeforeNotConfirm ? 'border: 2px solid #d9534f;' : 'border: 1px solid #EEEEEE;';

		            var cardHtml =
		                `<div class="square-box">
		                    <div class="card ${cardClass}" style="${cardBorderStyle} margin-bottom: 10px;">
		                        <table class="tg">
		                            <tr>
		                            <td class="tg-title" colspan="4">${item.todoTitl} ${pendingBadge}</td>
			                        </tr>
			                        <tr>
			                         	<td class="tg-menu">작업내용</td>
			                            <td class="tg-rspn" colspan="3">${item.todoDiv2CodeNm}</td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">SALES CODE</td>
			                            <td class="tg-rspn">${item.salesCd}</td>
			                            <td class="tg-menu">구분</td>
			                            <td class="tg-rspn">${div1NameText}</td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">요청자</td>
			                            <td class="tg-rspn">${item.creatNm}</td>
			                            <td class="tg-menu">요청일자</td>
			                            <td class="tg-rspn">${item.creatDttm}</td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">관리번호</td>
			                            <td class="tg-rspn">${item.todoNo}</td>
			                            <td class="tg-menu">평가대상</td>
			                            <td class="tg-rspn" style="color: blue;">${item.teamManager}</td>
			                        </tr>
			                        <tr>
			                            <td class="tg-rspn" colspan="4" style="text-align: center; padding: 6px 0;">
			                            <button class="btn btn-primary" style="height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; line-height: 1;" onclick="openSecondModal(${index})">상세조회</button>
			                            <button class="btn ${btnClass}" style="height: 30px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; line-height: 1; margin-left: 6px;" onclick="toDoConfirmApproval(${index})">${item.todoDiv1CodeNm}</button>
			                            </td>
		                            </tr>

		                        </table>
		                    </div>
		                </div>`;

	        		cardContainer.append(cardHtml);

	                // 각 카드에 고유한 클래스를 부여
	                $(".card." + cardClass).addClass(cardClass);
	        	});
	            // 코드 끝
            } else {

            	cardContainer.append('<h6 style="font-size:20px;">결재 확인 자료가 없습니다.</h6>');
            }
    	});
	}

	// 순차 미결재(이전 결재자가 1명 이상 미결인 상태) 여부 판정
	function checkSequentialPending(item) {
		if (!item || item.todoDiv1CodeNm !== '결재') return false;

		// 1) 동일 결재선 내 이전 미결자 수가 1명 이상인 경우 (복수 미결자 포함)
		if (Number(item.beforeNotConfirm || 0) > 0) {
			return true;
		}

		// 2) 2단계 순차결재 문서(관리부서 결재자 TODODIV2191, TODODIV2201 등)의 경우 선행 신청부서 결재선(TODODIV2190, TODODIV2200) 미결자 존재 여부 검사
		if (typeof PM51_SEQ_GENERAL_OF !== 'undefined') {
			var generalDiv = PM51_SEQ_GENERAL_OF[item.todoDiv2CodeId];
			if (generalDiv && item.todoNo) {
				var isGenPending = false;
				postAjaxSync("/user/wb/wb20/selectGetApprovalList", { todoNo: item.todoNo, todoDiv2CodeId: generalDiv }, null, function(data) {
					var list = data.resultList || [];
					$.each(list, function(idx, row) {
						if (row.sanctnSttus !== 'Y' && row.todoDiv1CodeId !== 'TODODIV10') {
							isGenPending = true;
							return false;
						}
					});
				});
				if (isGenPending) {
					return true;
				}
			}
		}

		return false;
	}

	// 공유확인/결재 처리
	function toDoConfirmApproval(selRow){
		if (list[selRow].teamManager == '평가') {
			alert("평가 대상 결재건은 상세조회로 결재처리 바랍니다.");
			return false;
		}
		if( isNaN(selRow) ) {
			alert("선택된 행이 없습니다.");
			return;
		} else {
			if( selRow > -1 ) {
				var row = list[selRow];
				if( row.todoDiv1CodeNm == "공유" ) {
					if( row.sanctnSttus == "N" ) {
						if( confirm("확인 처리 하시겠습니까?") ) {
							toDoConfirm(row);
						}
					} else {
						alert("이미 확인처리 하였습니다.");
					}
				} else if( row.todoDiv1CodeNm == "결재" ) {
					// 이전 순번 미결재(복수 미결자 포함)로 인한 차단 처리
					if (checkSequentialPending(row)) {
						if (row.todoDiv2CodeId == 'TODODIV2190' || row.todoDiv2CodeId == 'TODODIV2191'
								|| row.todoDiv2CodeId == 'TODODIV2200' || row.todoDiv2CodeId == 'TODODIV2201') {
							openSecondModal(selRow);
							return;
						} else {
							alert("이전 결재자가 승인하지 않은 순차 결재 대기 건입니다.\r\n이전 결재가 완료된 후 결재를 진행하실 수 있습니다.");
							return false;
						}
					}
					// 출장신청서(2190/2191) / 출장복명서(2200/2201)는 상세조회와 결재 모두 동일하게
					// 각 상세화면(PM5101P01_M / PM5102P01_M)에서 처리한다.
					// 공통 결재창에서는 영업확인/출장조건/고객사지원범위 입력, 순차결재 안내 등을 처리할 수 없다.
					if (row.todoDiv2CodeId == 'TODODIV2190' || row.todoDiv2CodeId == 'TODODIV2191'
							|| row.todoDiv2CodeId == 'TODODIV2200' || row.todoDiv2CodeId == 'TODODIV2201') {
						openSecondModal(selRow);
						return;
					}
					var paramObj = {
							 "coCd":row.coCd
							 , "salesCd":row.salesCd
							 , "issNo":row.todoNo
							 , "todoDiv1CodeId":row.todoDiv1CodeId
							 , "todoDiv1CodeNm":row.todoDiv1CodeNm
							 , "todoDiv2CodeId":row.todoDiv2CodeId
							 , "todoDiv2CodeNm":row.todoDiv2CodeNm
							 , "todoFileTrgtKey":row.todoFileTrgtKey
							 , "todoTitl":row.todoTitl
							 , "sanctnSn":row.sanctnSn
							 , "pgmId": "M08"
							 , "userId": jwt.userId
							 , "histNo" : row.etcField2
					};
					if(row.todoDiv2CodeId == 'TODODIV2020'  || row.todoDiv2CodeId == 'TODODIV1040'){
						// 동시 등록 체크 함수
						selectQtyReqInfo(row.todoNo)
						if (sameTimeResult == 'Y') {
							paramObj.sameTimeResultChk = sameTimeResult;
						}
					}
					//세션에 파라미터 저장후 전달하고 URL redirect 처리
					sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
					var nextUrl = '/static/mobile/modal/WB2001P01.html';
					insertPgmHistory(nextUrl);
					location.href = nextUrl;
				}
			}
		}
		return;
	}


	function toDoConfirm(row){
		if (row.todoKey != undefined) {
			var today = new Date();
			var strDate = today.getFullYear()+"-"+('0'+(today.getMonth()+1)).slice(-2)+"-"+('0'+today.getDate()).slice(-2);

			var formData = new FormData();
			formData.append("todoKey", row.todoKey);
			formData.append("creatId", jwt.userId);
			formData.append("creatPgm", "WB2001M01");
			//formData.append("todoCfDt", strDate);
			filePutAjax("/user/wb/wb20/toDoCfDtUpdate", formData, function(data){
				if(data.resultCode == 200){
// 					alert("공유 확인되었습니다.");
					toDoList();
				}
			});
		}
	}

	//모달 오픈
	function openSecondModal(index) {
		//선택한 데이터
		const gridList = list[index];
	    var paramObj = {
	    		"fileTrgtKey" : gridList.todoFileTrgtKey,
	            "coCd"     : jwt.coCd,
	            "userId"   : jwt.userId,
	            "rsltNo" : gridList.todoNo,
	            //"salesCd"  : row.salesCd,
	            // "pgmId"    : "QM0101M01_M"
	            "pgmId"    : gridList.creatPgm
	    };
	    //todoFileTrgtKey 존재하면 해당 gridList 데이터 paramObj에 추가
	    if( gridList.todoFileTrgtKey > 0 || gridList.todoFileTrgtKey != ''  ) {
	        $.each(gridList, function (key, val) {
				if( typeof(val) == "undefined") val = "";
				paramObj[key] = val;
	        });
		}
	    //기본 실행 코드
	    var nextUrl = '/static/mobile/html/user/qm/qm01/M_TODO_VIEW.html';
		//todo 결재 구분 : 발주 및 출장 요청
		if(gridList.todoDiv2CodeId == 'TODODIV2020'  || gridList.todoDiv2CodeId == 'TODODIV1040'){
			// 동시 등록 체크 함수
			selectQtyReqInfo(gridList.todoNo)
			if (sameTimeResult == 'Y') {
				paramObj.sameTimeResultChk = sameTimeResult;
			}
	    	nextUrl = '/static/mobile/html/user/qm/qm01/QM0101P01_M.html';
		    //todo 결재 구분 : 발주 및 출장 요청서 (결과)
        } else if(gridList.todoDiv2CodeId == 'TODODIV2030'  || gridList.todoDiv2CodeId == 'TODODIV1050'){
      		nextUrl = '/static/mobile/html/user/qm/qm01/QM0101P02_M.html';
		    //todo 결재 구분 : 수주목표원가
        } else if(gridList.todoDiv2CodeId == 'TODODIV2100'  || gridList.todoDiv2CodeId == 'TODODIV1100'){
      		nextUrl = '/static/mobile/html/user/cr/cr02/CR0202P02_M.html';
          	//todo 결재 구분 : 발주 및 출장 요청서 (결과)
        } else if(gridList.todoDiv2CodeId == 'TODODIV1030' || gridList.todoDiv2CodeId == 'TODODIV1090'
               || gridList.todoDiv2CodeId == 'TODODIV2060' || gridList.todoDiv2CodeId == 'TODODIV2090'){
          	//todo 결재 구분 : 이슈결재
      		nextUrl = '/static/mobile/html/user/wb/wb24/WB2401P02_M.html';
        } else if(gridList.todoDiv2CodeId == 'TODODIV1060' || gridList.todoDiv2CodeId == 'TODODIV2070'){
          	//프로젝트이슈 결재 구분 : 이슈결재
      		nextUrl = '/static/mobile/html/user/bm/bm16/BM1601P02_M.html';
        } else if (gridList.todoDiv2CodeId == 'TODODIV2130'  || gridList.todoDiv2CodeId == 'TODODIV1130') {
			//업무요청관리 결재 구분 : 업무요청관리
			nextUrl = '/static/mobile/html/admin/cm/cm16/CM1601P01_M.html';
		} else if(gridList.todoDiv2CodeId == 'TODODIV2190' || gridList.todoDiv2CodeId == 'TODODIV1190'
				|| gridList.todoDiv2CodeId == 'TODODIV2191' || gridList.todoDiv2CodeId == 'TODODIV1191'){
			//todo 결재 구분 : 출장신청서(신청부서/관리부서)
			nextUrl = '/static/mobile/html/user/pm/pm51/PM5101P01_M.html';
		} else if(gridList.todoDiv2CodeId == 'TODODIV2200' || gridList.todoDiv2CodeId == 'TODODIV1200'
				|| gridList.todoDiv2CodeId == 'TODODIV2201' || gridList.todoDiv2CodeId == 'TODODIV1201'){
			//todo 결재 구분 : 출장복명서(신청부서/관리부서)
			nextUrl = '/static/mobile/html/user/pm/pm51/PM5102P01_M.html';
		}
      	//세션에 파라미터 저장후 전달하고 URL redirect 처리
	 	//sessionStorage : 변경된 사항은 현재 페이지가 닫힐 때 까지 저장되어 사용가능, 새로고침은 유지
	 	//JSON.stringify : 인수로 전달받은 자바스크립트 객체를 문자열로 변환하여 반환

        sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
	    insertPgmHistory(nextUrl);
	    location.href = nextUrl;
	}

	function selectQtyReqInfo (todoNo) {
		var formData = {
			"reqNo"			: todoNo
		}
		postAjaxSync("/user/qm/qm01/selectQtyReqInfo", formData, null, function(data) { 
			var list = data.result;
			sameTimeResult = list.sameTimeResult
		})
	}
		</script>
	</body>
</html>
