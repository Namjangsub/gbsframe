<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.css">
    <link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
    <link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
    <link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
    <link rel="stylesheet" href="/static/css/gnb.css" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/sub.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />

    <script src="/static/js/jquery-latest.min.js"></script>
    <script src="/static/js/jquery.serializeObject.js"></script>
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
    <script src="/static/js/moment/moment-with-locales.js"></script>
    <script src="/static/js/ax5/ax5core.min.js"></script>
    <script src="/static/js/ax5/ax5grid.min.js"></script>
    <script src="/static/js/ax5/ax5mask.min.js"></script>
    <script src="/static/js/ax5/ax5modal.min.js"></script>
    <script src="/static/js/global.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
<style>
    .card {
        display: table;
        border: 1px solid #EEEEEE;
        margin-bottom: 10px;
        width: 100%;
    }
    .tg { border-collapse: collapse; border-spacing: 0; width: 100%;}
    .tg td { border-color: black; border-width: 0.5px; font-size: 10px; overflow: hidden; padding: 10px 5px; word-break: normal;}
    .tg .tg-title { background-color:antiquewhite; text-align: left; vertical-align: middle;}
    .tg .tg-menu { background-color:#EEEEEE;text-align: right; vertical-align: middle; font-size: 11px;  padding-right: 5px;}
    .tg .tg-rspn { width: 10px; text-align: left; vertical-align: middle; font-size: 11px;  padding-left: 5px;}

    table.search td {
    	border-right : none !important;
    	border-bottom-width: 1px;
    }
    /* 터치 친화버튼 */
    button {
        margin: 1px;
    }
    /* 모바일 여백조정 */
    .card-container {
        display: table;
        width: 100%;
        margin-bottom: 1px;
        height: 10px;
    }
#main_area {
    padding: 0px 0px;
    overflow: auto;}

</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
      		<a class="back_btn"></a>
    	</div>
		<h1 class="logo">
      		<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
    	</h1>
	</div>

	<div id="main_area">
	    <div class="popup_area" >
	        <div class="tit_contents">
	            <h4 class="tit">보안USB 관리대장</h4>
	        </div>
	        <table class="search" style="width:100%; table-layout:fixed;">
					<colgroup>
						<col style="width:60px;">
						<col style="width:auto;">
					</colgroup>
					<tr>
						<th style="text-align:center; font-size:12px; padding:3px 2px;">불출일자</th>
						<td style="padding: 3px 2px;" colspan="3">
							<div style="display:flex; align-items:center; width:100%; box-sizing:border-box;">
								<input type="text" id="outDtFrom" name="outDtFrom" class="input_calendar" readonly autocomplete="off" style="flex:1; min-width:0; width:100%; font-size:11px; padding:2px 18px 2px 2px; height:28px; background:#ffffff; cursor:pointer; text-align:center;" data-search="outDtFrom">
								<span style="padding:0 2px; font-weight:bold; flex-shrink:0;">~</span>
								<input type="text" id="outDtTo" name="outDtTo" class="input_calendar" readonly autocomplete="off" style="flex:1; min-width:0; width:100%; font-size:11px; padding:2px 18px 2px 2px; height:28px; background:#ffffff; cursor:pointer; text-align:center;" data-search="outDtTo">
							</div>
						</td>
					</tr>
					<tr>
						<th style="text-align:center; font-size:12px; padding:3px 2px;">상태</th>
						<td style="padding: 3px 2px;">
							<select id="stsCd" name="stsCd" style="width:100px; font-size:12px; height:30px; padding:2px;" onchange="secUsbList();">
								<option value="OUT" selected>불출중</option>
								<option value="IN">반입완료</option>
								<option value="">전체</option>
							</select>
						</td>
						<td style="padding: 3px 2px; text-align:right;" colspan="2">
							<button type="button" class="btn btn-success" style="height: 30px; line-height: 16px; font-size: 12px; padding: 4px 10px;" onClick="openOutCreate(event)">불출등록</button>
						</td>
					</tr>
			</table>


			<!-- 카드를 표시할 div 추가 -->
			<div id="cardContainer" class="card-container"></div>
			<!-- 카드를 표시할 div 끝 -->
		</div>
	</div>

<script type="text/javascript">
	var list = [];

	$(document).ready(function () {

		var newScreenWidth = $(window).width();
    	var newScreenHeight = $(window).height();

    	var beDay = moment().add(-1, "M").format("YYYY-MM-DD");

        // 불출일자 From (현재날짜로부터 -1개월)
		$('#outDtFrom').datepicker({
  			format : "yyyy-mm-dd",
  			language : "ko",
  			autoclose : true,
  			todayHighlight: true
  		})
  		.datepicker("setDate", beDay)
  		.on("changeDate", function(e) {
  			if (e && e.format) {
  				$("#outDtFrom").val(e.format(0, "yyyy-mm-dd"));
  			}
  			secUsbList();
  		});

  		// 불출일자 To / Till (현재날짜)
  		$('#outDtTo').datepicker({
  			format : "yyyy-mm-dd",
  			language : "ko",
  			autoclose : true,
  			todayHighlight: true
  		})
  		.datepicker("setDate", new Date())
  		.on("changeDate", function(e) {
  			if (e && e.format) {
  				$("#outDtTo").val(e.format(0, "yyyy-mm-dd"));
  			}
  			secUsbList();
  		});

		$('#stsCd').val("OUT");
    	secUsbList();
    	$('.popup_area').css('min-width', (newScreenWidth-15) + 'px');
        authChk();
	});

	function secUsbList() {
		var fromVal = $("#outDtFrom").val() || "";
		var toVal   = $("#outDtTo").val() || "";
		var stsVal  = $("#stsCd").val();
		if (typeof stsVal === "undefined" || stsVal === null) stsVal = "OUT";

 	    var formData = {
				"coCd"		: "GUN",
                "outDtFrom" : fromVal.replace(/-/g, ''),
                "outDtTo"   : toVal.replace(/-/g, ''),
                "stsCd"     : stsVal,
                "pageNo"    : 1,
                "recordCnt" : 999999999
 	           };
		postAjax("/user/gm/gm01/selectSecUsbList", formData, null, function(data){
			list = data.result || [];
			let cardContainer = $("#cardContainer");
			cardContainer.empty();
            // 데이터를 이용하여 카드 생성 및 표시
            if (list.length > 0) {
	            $.each(list, function (index, item){
	            	if  (item.mngNo==undefined) item.mngNo ='';
	            	if  (item.usbNm==undefined) item.usbNm ='';
	            	if  (item.outDt==undefined) item.outDt ='';
	            	if  (item.inDt==undefined) item.inDt ='';
	            	if  (item.outDeptNm==undefined) item.outDeptNm ='';
	            	if  (item.ownDeptNm==undefined) item.ownDeptNm ='';
	            	if  (item.ownUserNm==undefined) item.ownUserNm ='';
	            	if  (item.vendClntNm==undefined) item.vendClntNm ='';
	            	if  (item.vendUserNm==undefined) item.vendUserNm ='';
	            	if  (item.salesCd==undefined) item.salesCd ='';
	            	if  (item.clntPjtNm==undefined) item.clntPjtNm ='';
	            	if  (item.eqpNm==undefined) item.eqpNm ='';
	            	if  (item.rmk==undefined) item.rmk ='';
			            var cardClass = "card-" + index;
			            var statusBadge = (item.inDt) ? '<span style="background:#333;color:white;padding:2px 6px;border-radius:3px;font-size:9px;white-space:nowrap;display:inline-block;">반입완료</span>'
			                                           : '<span style="background:#ff0000;color:white;padding:2px 6px;border-radius:3px;font-size:9px;white-space:nowrap;display:inline-block;">불출중</span>';
			            var inProcBtn = (item.inDt) ? '' : '<button type="button" class="btn btn-primary btn-sm" style="text-align: center; background-color: #5cb85c; height: 26px; line-height: 12px; font-size: 11px; padding: 2px 6px; background-image : linear-gradient(to bottom, #5cb85c 0, #458b45 100%); border-color : #357935; white-space: nowrap;" onclick="openInProc(event, '+index+')">반입처리</button>';
			            var detailBtn = '<button type="button" class="btn btn-primary btn-sm" style="height: 26px; line-height: 12px; font-size: 11px; padding: 2px 6px; white-space: nowrap;" onclick="openDetail(event, '+index+')">상세</button>';
			            var cardHtml =
			                `<div class="square-box">
			                    <div class="card ${cardClass}" style="border: 1px solid #EEEEEE; margin-bottom: 10px;">
			                        <table class="tg">
			                            <tr>
			                            <td class="tg-title" colspan="2" style="width:28%; border-right: 0px; word-break: break-all;">
			                            <span>
			                            ${item.mngNo} (${item.usbNm})
			                            </span>
			                            </td>
			                            <td class="tg-title" style="width:60px; text-align: center; vertical-align: middle; border-right: 0px; padding:2px; white-space: nowrap;">
			                            ${statusBadge}
			                            </td>
			                            <td class="tg-title" style="text-align: right; vertical-align: middle; border-left: 0px; padding:2px; white-space: nowrap;">
			                            <div style="display: flex; justify-content: flex-end; align-items: center; gap: 3px; white-space: nowrap;">
			                            ${inProcBtn}
			                            ${detailBtn}
			                            </div>
			                            </td>


			                        </tr>
			                        <tr>
			                         	<td class="tg-menu">불출일자</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${toDashDate(item.outDt)}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">반입일자</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${toDashDate(item.inDt)}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">관리부서</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${item.outDeptNm || ''}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">외주업체</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${item.vendClntNm} / ${item.vendUserNm}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">Sales Code</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${item.salesCd}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">프로젝트명</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${item.clntPjtNm}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">장비명</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block;">${item.eqpNm}</span></td>
			                        </tr>
			                        <tr>
			                            <td class="tg-menu">내용</td>
			                            <td class="tg-rspn" colspan="3"><span style="display: block; white-space: pre;">${item.rmk}</span></td>
			                        </tr>

		                        </table>
		                    </div>
		                </div>`;

	        		cardContainer.append(cardHtml);

	                // 각 카드에 고유한 클래스를 부여
	                $(".card." + cardClass).addClass(cardClass);
	        	});
	            // 코드 끝
            } else {

            	cardContainer.append('<h6 style="font-size:20px;">보안USB 불출/반입 자료가 없습니다.</h6>');
            }
    	});
	}

	// yyyyMMdd -> yyyy-MM-dd
	function toDashDate(v) {
		if (!v) return '';
		var s = String(v).replace(/\-/g, '');
		if (s.length < 8) return String(v);
		return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
	}

	// 본인 소속 부서(부서코드 앞 5자리 동일) 검증 함수
	function isMyDeptRow(row) {
		if (!row || !row.outDeptId) return true;
		var userDept5 = (jwt.deptId || '').substring(0, 5);
		var rowDept5  = (row.outDeptId || '').substring(0, 5);
		if (userDept5 && rowDept5 && userDept5 !== rowDept5) {
			alert("자신의 부서(동일 소속 부서)의 보안USB만 처리할 수 있습니다.");
			return false;
		}
		return true;
	}

	// 불출등록
	function openOutCreate(e) {
		if (e) { e.preventDefault(); e.stopPropagation(); }
	    var paramObj = {
				"actionType"  : "C",
				"coCd" 	      : "GUN",
				"userId"      : jwt.userId,
				"userNm"      : jwt.userNm,
				"pgmId"       : "GM0101M01_M"
			};

	    var nextUrl = '/static/mobile/html/user/gm/gm01/GM0101P01_M.html';

        sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
	    insertPgmHistory(nextUrl);
	    location.href = nextUrl;
	}

	// 상세조회
	function openDetail(e, index) {
		if (e) { e.preventDefault(); e.stopPropagation(); }
		var row = list[index];
		if (!row) return;
		if (!isMyDeptRow(row)) return;

	    var paramObj = {
	    		"actionType"  : "U"
	    };
	    $.each(row, function (key, val) {
			if( typeof(val) == "undefined") val = "";
			paramObj[key] = val;
        });
		paramObj.coCd = "GUN";

	    var nextUrl = '/static/mobile/html/user/gm/gm01/GM0101P01_M.html';

        sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
	    insertPgmHistory(nextUrl);
	    location.href = nextUrl;
	}

	// 반입처리
	function openInProc(e, index) {
		if (e) { e.preventDefault(); e.stopPropagation(); }
		var row = list[index];
		if (!row) return;
		if (!isMyDeptRow(row)) return;

	    var paramObj = {
	    		"actionType"  : "I",
	    		"pgmId"       : "GM0101P02_M"
	    };
	    $.each(row, function (key, val) {
			if( typeof(val) == "undefined") val = "";
			paramObj[key] = val;
        });
		paramObj.coCd = "GUN";

	    var nextUrl = '/static/mobile/html/user/gm/gm01/GM0101P02_M.html';

        sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
	    insertPgmHistory(nextUrl);
	    location.href = nextUrl;
	}

</script>
</body>

</html>
