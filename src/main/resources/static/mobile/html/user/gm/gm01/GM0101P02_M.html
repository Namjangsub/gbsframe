<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
    <link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
    <link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
    <link rel="stylesheet" href="/static/fontawesome/css/all.css">
    <link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
    <link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
    <link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
    <link rel="stylesheet" href="/static/css/gnb.css" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/sub.css" />
    <link rel="stylesheet" href="/static/css/m_common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />

    <script src="/static/js/jquery-latest.min.js"></script>
    <script src="/static/js/jquery.serializeObject.js"></script>
    <script src="/static/bootstrap/js/bootstrap.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
    <script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
    <script src="/static/js/moment/moment-with-locales.js"></script>

    <script src="/static/js/ax5/ax5grid.min.js"></script>
    <script src="/static/js/ax5/ax5mask.min.js"></script>
    <script src="/static/js/ax5/ax5modal.min.js"></script>
    <script src="/static/js/global.js"></script>
	<script src="/static/js/heic2any.min.js"></script>

        tr {
          height: 26px;
        }
		#main_area{
		    padding: 0px 0px;
		    overflow: auto;
	    }
    </style>

<body>
    <div id="head_area" class="off" >
        <div class="left_btn" onclick="history.back(-1)">
              <a class="back_btn"></a>
        </div>
        <h1 class="logo">
              <img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
        </h1>
    </div>

<div id="main_area">
    <div class="popup_area">
        <div class="tit_contents">
            <h4 class="tit">보안USB 반입 처리</h4>
        </div>
		<form id="inPopForm" onSubmit="return false;">
			<input type="hidden" id="inCoCd"  name="inCoCd">
			<input type="hidden" id="inMngNo" name="inMngNo">
			<input type="hidden" id="inPgmId" name="inPgmId" value="GM0101P02_M">
			<input type="hidden" id="inUserId" name="inUserId">

            <div class="form-group popup_table" style="width: 100%;">
                <table>
                    <colgroup>
                    <col width="30%">
                    <col width="70%">
                    </colgroup>

                    <!-- 불출 정보 (조회 전용) -->
                    <tr>
                        <th>불출일자</th>
                        <td><input type="text" id="inViewOutDt" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>관리번호</th>
                        <td><input type="text" id="inViewMngNo" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>USB 종류</th>
                        <td><input type="text" id="inViewUsbNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>외주업체</th>
                        <td><input type="text" id="inViewVendNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>업체담당</th>
                        <td><input type="text" id="inViewVendUserNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>관리부서</th>
                        <td><input type="text" id="inViewOutDeptNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>Sales Code</th>
                        <td><input type="text" id="inViewSalesCd" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>장비명</th>
                        <td><input type="text" id="inViewEqpNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>프로젝트명</th>
                        <td><input type="text" id="inViewClntPjtNm" class="form-control" readonly style="background: #fafafa !important;"></td>
                    </tr>
                    <tr>
                        <th>불출내용</th>
                        <td>
                            <textarea id="inViewRmk" class="form-control" rows="3" readonly style="width: 100%; background: #fafafa !important;"></textarea>
                        </td>
                    </tr>

                    <tr><td colspan="2"><div style="padding-bottom:15px;"></div></td></tr>

                    <!-- 반입 입력 -->
                    <tr>
                        <th class="hit">반입일자</th>
                        <td>
                            <input type="text" class="input_calendar" id="inDt" name="inDt" autocomplete="off" required msg="반입일자" onkeyup="dateMask(this);">
                        </td>
                    </tr>
                    <tr>
                        <th class="hit">반입확인자</th>
                        <td>
                            <input type="text" id="inUserNm" name="inUserNm" class="form-control" required msg="반입확인자" readonly style="background: #fafafa !important;">
                        </td>
                    </tr>
                    <tr>
                        <th>반입비고</th>
                        <td>
                            <textarea id="inRmk" name="inRmk" class="form-control" rows="3" maxlength="500" style="width: 100%;"></textarea>
                        </td>
                    </tr>
                </table>
            </div>
        </form>

        <!-- 하단 버튼 -->
        <div class="mobile_mid_btn">
            <button type="button" style="height: 35px;  width: 90px;" onclick="saveSecUsbIn();">반입처리</button>
            <button type="button" class="close_btn" style="height: 35px;  width: 90px;" onclick="location.href='/static/mobile/html/user/gm/gm01/GM0101M01_M.html';">목록</button>
        </div>
    </div>
</div>

<script type="text/javascript">

var paramObj = null;

$(document).ready(function() {

    $("body").css("font-size", "12px");
    $("body").css("zoom", "100%");

    var newScreenWidth = $(window).width();
    var newScreenHeight = $(window).height();
    $('.popup_area').css('min-width', (newScreenWidth-15) + 'px');

    // 반입일자 datepicker
    $('#inDt').datepicker({
        format : "yyyy-mm-dd",
        language : "ko",
        autoclose : true
    }).datepicker("setDate", new Date());

    // 세션에서 paramObj 수신
    try {
        var strParam = sessionStorage.getItem('paramObj');
        if (strParam && strParam !== "undefined") {
            paramObj = JSON.parse(strParam);
        }
    } catch(e) {
        paramObj = null;
    }

    if (paramObj) {
        $('#inCoCd').val("GUN");
        $('#inMngNo').val(paramObj.mngNo);
        $('#inUserId').val(paramObj.userId || jwt.userId);

        // 불출 정보 표시
        $('#inViewMngNo').val(paramObj.mngNo || '');
        $('#inViewOutDt').val(toDashDate(paramObj.outDt));
        $('#inViewUsbNm').val(paramObj.usbNm || '');
        $('#inViewOutDeptNm').val(paramObj.outDeptNm || '');
        $('#inViewVendNm').val(paramObj.vendClntNm || '');
        $('#inViewVendUserNm').val(paramObj.vendUserNm || '');
        $('#inViewSalesCd').val(paramObj.salesCd || '');
        $('#inViewEqpNm').val(paramObj.eqpNm || '');
        $('#inViewClntPjtNm').val(paramObj.clntPjtNm || '');
        $('#inViewRmk').val(paramObj.rmk || '');

        // 반입확인자 기본값
        $('#inUserNm').val(paramObj.userNm || jwt.userNm);

        authChk();
    }

});

// yyyyMMdd -> yyyy-MM-dd
function toDashDate(v) {
    if (!v) return '';
    var s = String(v).replace(/\-/g, '');
    if (s.length < 8) return String(v);
    return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
}

/* 반입처리 저장 */
function saveSecUsbIn() {

    if (!inputValidation($('.popup_area [required]'))) return;

    var outDt = String($('#inViewOutDt').val() || '').replace(/\-/g, '');
    var inDt  = String($('#inDt').val() || '').replace(/\-/g, '');

    if (outDt && inDt && inDt < outDt) {
        alert("반입일자는 불출일자보다 빠를 수 없습니다.");
        return;
    }

    if (!confirm("반입처리 하시겠습니까?")) return;

    var formData = {
         "coCd"     : $('#inCoCd').val()
        ,"mngNo"    : $('#inMngNo').val()
        ,"inDt"     : inDt
        ,"inUserId" : $('#inUserId').val()
        ,"inUserNm" : $('#inUserNm').val()
        ,"inRmk"    : $('#inRmk').val()
        ,"userId"   : jwt.userId
        ,"pgmId"    : "GM0101P02_M"
    };

    putAjax("/user/gm/gm01/updateSecUsbIn", formData, null, function(data) {
        alert(data.resultMessage);
        if (data.resultCode == 200) {
            location.href = '/static/mobile/html/user/gm/gm01/GM0101M01_M.html';
        }
    });
}

</script>

</body>

</html>
