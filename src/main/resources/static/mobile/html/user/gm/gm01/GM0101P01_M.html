<body>
    <div id="head_area" class="off" >
        <div class="left_btn" onclick="history.back(-1)">

<div id="main_area">
    <div class="popup_area">
        <div class="tit_contents">
            <h4 class="tit">보안USB 불출 등록</h4>
        </div>
		<form id="popForm" onSubmit="return false;">
			<input type="hidden" id="actionType" name="actionType">
			<input type="hidden" id="coCd" name="coCd">
			<input type="hidden" id="mngNo" name="mngNo">
			<input type="hidden" id="pgmId" name="pgmId" value="GM0101P01_M">
			<input type="hidden" id="outDeptId" name="outDeptId">
			<input type="hidden" id="ownDeptId" name="ownDeptId">
			<input type="hidden" id="ownUserId" name="ownUserId">
			<input type="hidden" id="vendClntCd" name="vendClntCd">
			<input type="hidden" id="clntPjt" name="clntPjt">

            <div class="form-group popup_table" style="width: 100%;">
                <table>
                    <colgroup>
                    <col width="30%">
                    <col width="70%">
                    </colgroup>

                    <tr>
                        <th class="hit">불출일자</th>
                        <td>
                            <input id="outDt" name="outDt" class="input_calendar form-control" autocomplete="off" onkeyup="dateMask(this);" required msg="불출일자" date>
                        </td>
                    </tr>
                    <tr>
                        <th class="hit">USB 종류</th>
                        <td>
                            <select id="usbCd" name="usbCd" data-kind="GM01USB" required msg="USB 종류" class="form-control" style="width: 100%;">
                                <option value="">선택</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <th>관리부서</th>
                        <td>
                            <input type="text" id="outDeptNm" name="outDeptNm" readonly class="form-control" style="background: #fafafa !important;">
                        </td>
                    </tr>
                    <tr>
                        <th class="hit">당사담당</th>
                        <td>
                            <div class="search_form" style="width: 100%;">
                                <input type="text" id="ownUserNm" name="ownUserNm" required msg="당사담당" readonly class="form-control">
                                <a onclick="openOwnUserTree();"><i class="i_search_w"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>당사부서</th>
                        <td>
                            <input type="text" id="ownDeptNm" name="ownDeptNm" class="form-control" readonly>
                        </td>
                    </tr>
                    <tr>
                        <th class="hit">외주업체</th>
                        <td>
                            <div class="search_form" style="width: 100%;">
                                <input type="text" id="vendClntNm" name="vendClntNm" required msg="외주업체" readonly class="form-control">
                                <a onclick="openVendClntSearch();"><i class="i_search_w"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>업체담당</th>
                        <td>
                            <input type="text" id="vendUserNm" name="vendUserNm" class="form-control" maxlength="50" placeholder="외주업체 직원명">
                        </td>
                    </tr>
                    <!-- Sales Code 여러 건 (U/C 공통) -->
                    <tbody id="salesCdRows_multi">
                    <tr>
                        <th class="hit">Sales Code</th>
                        <td>
                            <div class="search_form" style="width: 100%;">
                                <input type="text" id="salesCdAddView" readonly class="form-control" placeholder="검색으로 추가 (여러 건 가능)">
                                <a onclick="openSalesCodeSearchAdd();"><i class="i_search_w"></i></a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <th>추가목록</th>
                        <td>
                            <table class="popup_table" style="width: 100%;">
                                <colgroup>
                                <col width="34%">
                                <col width="33%">
                                <col width="33%">
                                </colgroup>
                                <thead>
                                    <tr>
                                        <th>Sales Code</th>
                                        <th>프로젝트/장비</th>
                                        <th>삭제</th>
                                    </tr>
                                </thead>
                                <tbody id="salesCdListBody"></tbody>
                            </table>
                        </td>
                    </tr>
                    </tbody>
                    <tr>
                        <th class="hit">내용</th>
                        <td>
                            <textarea id="rmk" name="rmk" class="form-control" rows="4" maxlength="1000" style="width: 100%;" required msg="내용"></textarea>
                        </td>
                    </tr>
                </table>
            </div>
        </form>

        <!-- 하단 버튼 -->
        <div class="mobile_mid_btn">
            <button type="button" id="saveBtn" style="height: 35px;  width: 90px;" authChk>저장</button>
            <button type="button" class="close_btn" style="height: 35px;  width: 90px;" onclick="location.href='/static/mobile/html/user/gm/gm01/GM0101M01_M.html';">목록</button>
        </div>
    </div>
</div>

<script type="text/javascript">

var actionType = null;
var paramObj = null;
var windowWidth = $(window).width();
var windowHeight = $(window).height();
// 등록(C) 모드 - 추가된 Sales Code 목록 (같은 USB를 공유하는 여러 건)
var salesCdList = [];

$(document).ready(function() {

    $("body").css("font-size", "12px");
    $("body").css("zoom", "100%");

    var newScreenWidth = $(window).width();
    var newScreenHeight = $(window).height();
    $('.popup_area').css('min-width', (newScreenWidth-15) + 'px');

    // 불출일자 datepicker
    $('#outDt').datepicker({
        format : "yyyy-mm-dd",
        language : "ko",
        autoclose : true
    });

    // 세션에서 paramObj 수신
    try {
        var strParam = sessionStorage.getItem('paramObj');
        if (strParam && strParam !== "undefined") {
            paramObj = JSON.parse(strParam);
        }
    } catch(e) {
        paramObj = null;
    }

    if (paramObj) {
        $("#popForm #coCd").val("GUN");
        actionType = paramObj.actionType || "U";
        $("#actionType").val(actionType);

        // 공통코드 설정
        setCommonSelect($(".popup_area select[data-kind]"));
        filterUsbCdByMyDept();

        // U/C 공통: 멀티 UI 사용
        $('#salesCdRows_multi').show();

        if (actionType == "C") {
            // 불출등록 (신규) - Sales Code 여러 건(같은 USB에 여러 프로젝트 데이터를 담아가는 경우) 입력
            renderSalesCdList();

            $('#outDt').datepicker("setDate", new Date());
            $('#ownUserId').val(paramObj.userId || '');
            $('#ownUserNm').val(paramObj.userNm || '');
            $('#ownDeptId').val(jwt.deptId || '');
            $('#ownDeptNm').val(jwt.deptNm || '');
            setOutDeptByUsbCd();

            $('#usbCd').off("change").on("change", function() {
                setOutDeptByUsbCd();
            });

            $('#saveBtn').text("저장");
            $('#saveBtn').off("click").on("click", function() {
                saveSecUsbOut();
            });

        } else if (actionType == "U") {
            // 불출내용 수정 또는 조회 - Sales Code 상세 목록 조회
            $.each(paramObj, function(key, val) {
                var $el = $("#popForm #" + key);
                if ($el.length > 0 && $el.prop("tagName")) {
                    $el.val(val);
                }
            });

            $('#outDt').val(formatDateStr(paramObj.outDt || ''));
            $('#usbCd').val(paramObj.usbCd || '');
            setOutDeptByUsbCd();

            // 기존 Sales Code 상세 목록 조회
            postAjax("/user/gm/gm01/selectSecUsbDtlList", {coCd: "GUN", mngNo: paramObj.mngNo}, null, function(data) {
                if (data && data.result) {
                    salesCdList = (data.result || []).map(function(r) {
                        return {
                             salesCd   : r.salesCd
                            ,clntPjt   : r.clntPjt
                            ,clntPjtNm : r.clntPjtNm
                            ,eqpNm     : r.eqpNm
                        };
                    });
                }
                renderSalesCdList();

                // 반입완료 건은 조회 전용 (모든 필드 readonly, 저장버튼 숨김) - renderSalesCdList 후 재적용
                if (paramObj.inDt) {
                    $('#popForm input, #popForm textarea').prop("readonly", true);
                    $('#popForm select').prop("disabled", true);
                    $('.popup_area .search_form a').hide();
                    $('#saveBtn').hide();
                }
            });

            $('#saveBtn').text("수정");
            $('#saveBtn').off("click").on("click", function() {
                saveSecUsbOut();
            });
        }

        // 불출되지 않은(현재 불출 중이지 않은) USB만 옵션에 표시
        filterIssuedUsbCd();

        authChk();
    }

});

/* 접속자 소속 부서(부서코드 앞 5자리)와 일치하는 USB 종류만 셀렉트 옵션 표시 */
function filterUsbCdByMyDept() {
    var userDept5 = (jwt.deptId || '').substring(0, 5);
    if (!userDept5 || userDept5 === "GUN80") return;
    $('#usbCd option').each(function() {
        var etcDept = $(this).attr('data-etc') || '';
        var etcDept5 = etcDept.substring(0, 5);
        if (etcDept && etcDept5 && userDept5 !== etcDept5) {
            $(this).remove();
        }
    });
}

// 현재 불출 중인(미반입) USB를 옵션 목록에서 제거 (불출되지 않은 USB만 선택 가능)
function filterIssuedUsbCd() {
    var curUsbCd = $('#usbCd').val();
    postAjax("/user/gm/gm01/selectSecUsbList", { "coCd": "GUN", "stsCd": "OUT", "firstIndex": 1, "lastIndex": 9999 }, null, function(data) {
        if (data && data.result && data.result.length > 0) {
            var issuedCds = [];
            $.each(data.result, function(idx, item) {
                if (item.usbCd && item.usbCd !== curUsbCd) {
                    issuedCds.push(item.usbCd);
                }
            });
            $(".popup_area #usbCd option").each(function() {
                var val = $(this).val();
                if (val && $.inArray(val, issuedCds) !== -1) {
                    $(this).remove();
                }
            });
        }
    });
}

// 종류(보안USB) 변경 시 data-etc의 관리부서 자동 연동
function setOutDeptByUsbCd() {
    var $opt = $(".popup_area #usbCd option:selected");
    var etcVal = $opt.attr("data-etc") || $opt.data("etc") || "";

    if (etcVal) {
        var deptId = etcVal;
        if (etcVal.indexOf(":") > -1) {
            var parts = etcVal.split(":");
            deptId = parts[0];
            $("#outDeptId").val(parts[0]);
            $("#outDeptNm").val(parts[1]);
        } else {
            $("#outDeptId").val(deptId);
            postAjax("/admin/cm/cm04/selectDeptInfo", { "deptId": deptId }, null, function(data) {
                if (data && data.deptInfo && data.deptInfo.deptNm) {
                    $("#outDeptNm").val(data.deptInfo.deptNm);
                } else {
                    $("#outDeptNm").val(deptId);
                }
            });
        }
    } else if (actionType == "C") {
        $("#outDeptId").val(jwt.deptId || '');
        $("#outDeptNm").val(jwt.deptNm || '');
    }
}

/* Sales Code 검색 (등록 모드 - 목록에 추가) */
function openSalesCodeSearchAdd() {
    var paramObj = {
         "coCd"    : jwt.coCd
        ,"salesCd" : ""
    };
    openSecondModal("/static/mobile/modal/wbsSalesCodeSearch_M.html", windowWidth, windowHeight-20, "SALES CODE 검색", paramObj, function(grid) {
        var row = grid.target.getList("selected")[0];
        if (!row) return;
        var dup = false;
        $.each(salesCdList, function(idx, item) {
            if (item.salesCd == row.salesCd) { dup = true; return false; }
        });
        if (dup) {
            alert("이미 추가된 Sales Code 입니다.");
            return;
        }
        salesCdList.push({
             salesCd   : row.salesCd
            ,clntPjt   : row.clntPjt
            ,clntPjtNm : row.clntPjtNm
            ,eqpNm     : row.eqpNm
        });
        renderSalesCdList();
    });
}

/* 추가된 Sales Code 목록 렌더링 */
function renderSalesCdList() {
    var $tbody = $('#salesCdListBody');
    $tbody.empty();
    if (salesCdList.length == 0) {
        $tbody.append('<tr><td colspan="3" style="text-align:center;color:#999;">추가된 항목 없음</td></tr>');
        return;
    }
    $.each(salesCdList, function(idx, item) {
        var $tr = $('<tr></tr>');
        $tr.append($('<td></td>').text(item.salesCd || ''));
        $tr.append($('<td></td>').text((item.clntPjtNm || '') + (item.eqpNm ? (' / ' + item.eqpNm) : '')));
        var $delTd = $('<td style="text-align:center;"></td>');
        var $delA = $('<a href="javascript:void(0);"><i class="fas fa-times"></i></a>');
        $delA.on('click', (function(i) { return function() { removeSalesCdRow(i); }; })(idx));
        $delTd.append($delA);
        $tr.append($delTd);
        $tbody.append($tr);
    });
}

/* 추가된 Sales Code 목록에서 제거 */
function removeSalesCdRow(idx) {
    salesCdList.splice(idx, 1);
    renderSalesCdList();
}

// yyyyMMdd -> yyyy-MM-dd
function formatDateStr(v) {
    if (!v) return '';
    var s = String(v).replace(/\-/g, '');
    if (s.length < 8) return String(v);
    return s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6, 8);
}

/* 불출등록 / 수정 저장 */
function saveSecUsbOut() {

    if (!inputValidation($('.popup_area [required]'))) return;

    // Sales Code 검증
    if (salesCdList.length == 0) {
        alert("Sales Code를 1건 이상 추가하세요.");
        return;
    }

    if (!confirm("저장하시겠습니까?")) return;

    var commonData = {
         "coCd"        : $('#coCd').val()
        ,"mngNo"       : $('#mngNo').val()
        ,"outDt"       : $('#outDt').val().replace(/\-/g, '')
        ,"usbCd"       : $('#usbCd').val()
        ,"outDeptId"   : $('#outDeptId').val()
        ,"outDeptNm"   : $('#outDeptNm').val()
        ,"ownDeptId"   : $('#ownDeptId').val()
        ,"ownDeptNm"   : $('#ownDeptNm').val()
        ,"ownUserId"   : $('#ownUserId').val()
        ,"ownUserNm"   : $('#ownUserNm').val()
        ,"vendClntCd"  : $('#vendClntCd').val()
        ,"vendClntNm"  : $('#vendClntNm').val()
        ,"vendUserNm"  : $('#vendUserNm').val()
        ,"rmk"         : $('#rmk').val()
        ,"userId"      : jwt.userId
        ,"pgmId"       : "GM0101P01_M"
        ,"dtlList"     : salesCdList
    };

    $('#saveBtn').prop('disabled', true);

    if (actionType == "C") {
        // 신규 등록: insertSecUsbOut (단일 호출)
        postAjax("/user/gm/gm01/insertSecUsbOut", commonData, null, function(data) {
            $('#saveBtn').prop('disabled', false);
            alert(data.resultMessage);
            if (data.resultCode == 200) {
                location.href = '/static/mobile/html/user/gm/gm01/GM0101M01_M.html';
            }
        });
    } else {
        // 수정: updateSecUsbOut (단일 호출)
        putAjax("/user/gm/gm01/updateSecUsbOut", commonData, null, function(data) {
            $('#saveBtn').prop('disabled', false);
            alert(data.resultMessage);
            if (data.resultCode == 200) {
                location.href = '/static/mobile/html/user/gm/gm01/GM0101M01_M.html';
            }
        });
    }
}

/* 관리부서(조직) 검색 */
function openOutDeptTree() {
    var paramObj = {
         "coCd"   : ''
        ,"deptId" : $('#outDeptId').val()
        ,"deptNm" : $('#outDeptNm').val()
        ,"useYn"  : "Y"
    };
    openSecondModal("/static/html/cmn/modal/deptSearch.html", windowWidth, windowHeight-20, "관리부서(조직) 검색", paramObj, function(tree) {
        var checkedId = tree.get_checked()[0];
        var checkedNode = tree.get_node(checkedId);
        $('#outDeptId').val(checkedNode.id);
        $('#outDeptNm').val(checkedNode.text);
    });
}

/* 당사담당(사원) 검색 */
function openOwnUserTree() {
    var paramObj = {
         "coCd"   : ''
        ,"userId" : $('#ownUserId').val()
        ,"userNm" : $('#ownUserNm').val()
        ,"useYn"  : "Y"
    };
    openSecondModal("/static/html/cmn/modal/userSearch.html", windowWidth, windowHeight-20, "당사담당 검색", paramObj, function(tree) {
        var checkedId = tree.get_checked()[0];
        var checkedNode = tree.get_node(checkedId);
        if (!checkedNode || checkedNode.type != 'person') {
            alert("사원을 선택하세요.");
            return;
        }
        $('#ownUserId').val(checkedNode.id);
        $('#ownUserNm').val(checkedNode.text);
        $('#ownDeptNm').val(checkedNode.original.deptNm || '');
        $('#ownDeptId').val(checkedNode.original.deptId || '');
    });
}

/* 외주업체(거래처) 검색 */
function openVendClntSearch() {
    var paramObj = {
        "searchValue" : $('#vendClntNm').val()
    };
    openSecondModal("/static/mobile/modal/clntSearch_M.html", windowWidth, windowHeight-20, "외주업체 검색", paramObj, function(grid) {
        var row = grid.target.getList("selected")[0];
        $('#vendClntCd').val(row.clntCd);
        $('#vendClntNm').val(row.clntNm);
    });
}

/* Sales Code 검색 (프로젝트/장비명 동시 세팅) */
function openSalesCodeSearch() {
    var paramObj = {
         "coCd"    : jwt.coCd
        ,"salesCd" : $('#salesCd').val()
    };
    openSecondModal("/static/mobile/modal/wbsSalesCodeSearch_M.html", windowWidth, windowHeight-20, "SALES CODE 검색", paramObj, function(grid) {
        var row = grid.target.getList("selected")[0];
        $('#salesCd').val(row.salesCd);
        $('#clntPjt').val(row.clntPjt);
        $('#clntPjtNm').val(row.clntPjtNm);
        $('#eqpNm').val(row.eqpNm);
    });
}

</script>

</body>
