<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />
	<link rel="stylesheet" href="/static/css/common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>

	<style>
		/* ── PM0701M01_M 디자인 시스템 계승 : 작업일보 고찰 목록 모바일 최적화 ── */
		:root {
			--pm-navy: #304a8a;
			--pm-navy-dark: #253a6e;
			--pm-bg: #dfe4ec;
			--pm-ink: #22262f;
			--pm-sub: #6b7280;
			--pm-line: #e6e9f0;
		}

		html, body {
			background: var(--pm-bg);
			font-size: 13px;
			color: var(--pm-ink);
			margin: 0;
			padding: 0;
		}

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 28px;
			box-sizing: border-box;
		}

		/* ─ 필터 영역 (PM0701M01_M 동일 규격) ─ */
		.pm-filter {
			width: 100%;
			background: #ffffff;
			border: 1px solid var(--pm-line);
			border-radius: 12px;
			padding: 14px;
			margin-bottom: 14px;
			box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
			box-sizing: border-box;
		}

		.pm-filter-label {
			font-size: 11px;
			font-weight: 700;
			color: var(--pm-sub);
			letter-spacing: .02em;
			margin-bottom: 6px;
		}

		.pm-date-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 10px;
		}

		.pm-date-row .date_input {
			flex: 1 1 0;
			min-width: 0;
		}

		.pm-date-row input.input_calendar {
			width: 100% !important;
			height: 38px;
			border: 1px solid var(--pm-line);
			border-radius: 8px;
			font-size: 13px;
			padding: 0 10px;
			box-sizing: border-box;
			background-color: #fff;
			background-position: 95% 50%;
		}

		.pm-tilde {
			color: var(--pm-sub);
			font-size: 12px;
			flex: 0 0 auto;
		}

		.pm-filter-row2 {
			display: flex;
			gap: 8px;
			justify-content: flex-end;
		}

		.pm-btn-new {
			flex: 0 0 auto;
			height: 38px;
			padding: 0 16px;
			border: none;
			border-radius: 8px;
			background: var(--pm-navy);
			color: #fff;
			font-size: 13px;
			font-weight: 700;
			white-space: nowrap;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			cursor: pointer;
			transition: background 0.15s ease;
		}
		.pm-btn-new:active { background: var(--pm-navy-dark); }
		.pm-btn-new.team { background: #059669; }
		.pm-btn-new.team:active { background: #047857; }
		.pm-btn-new i { font-size: 12px; }

		/* ─ 카드 리스트 (PM0701M01_M 동일 규격) ─ */
		.pm-card-list {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		.pm-card {
			background: #ffffff;
			border: 1px solid #c3cad8;
			border-left: 5px solid var(--pm-navy);
			border-radius: 10px;
			padding: 15px 16px 13px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, 0.09);
			cursor: pointer;
			transition: box-shadow .12s ease, transform .12s ease;
		}
		.pm-card:active {
			box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
			transform: scale(0.995);
		}
		.pm-card.team {
			border-left-color: #059669;
		}

		.pm-card-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 10px;
			padding-bottom: 8px;
			border-bottom: 1px solid var(--pm-line);
		}

		.pm-card-title {
			font-size: 16px;
			font-weight: 800;
			color: #14161c;
			line-height: 1.35;
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.pm-badge {
			display: inline-flex;
			align-items: center;
			gap: 5px;
			padding: 3px 9px 3px 7px;
			border-radius: 999px;
			font-size: 11px;
			font-weight: 700;
			white-space: nowrap;
			background: #f3f4f6;
			color: var(--pm-sub);
		}
		.pm-badge .dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: currentColor;
		}
		.pm-badge.personal { background: #eaf0fb; color: var(--pm-navy); }
		.pm-badge.team { background: #ecfdf5; color: #059669; }

		.pm-card-body-items {
			display: flex;
			flex-direction: column;
			gap: 6px;
			margin-bottom: 10px;
		}

		.pm-item-row {
			background: #f8fafc;
			border-radius: 6px;
			padding: 6px 10px;
			border-left: 3px solid #cbd5e1;
		}

		.pm-item-label {
			font-size: 11px;
			font-weight: 700;
			color: #475569;
			margin-bottom: 2px;
			display: flex;
			align-items: center;
			gap: 5px;
		}

		.pm-item-text {
			font-size: 12.5px;
			color: #1e293b;
			line-height: 1.45;
			white-space: pre-wrap;
			word-break: break-all;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.pm-card-foot {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-top: 8px;
			border-top: 1px solid var(--pm-line);
		}

		.pm-card-btn-del {
			border: 1px solid #fecaca;
			background: #fef2f2;
			color: #dc2626;
			font-size: 11.5px;
			font-weight: 700;
			border-radius: 6px;
			padding: 4px 10px;
			display: inline-flex;
			align-items: center;
			gap: 4px;
			cursor: pointer;
		}
		.pm-card-btn-del:active {
			background: #fee2e2;
		}

		.pm-card-more {
			font-size: 12.5px;
			font-weight: 700;
			color: var(--pm-navy);
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}

		.pm-empty {
			text-align: center;
			color: var(--pm-sub);
			font-size: 13px;
			padding: 60px 20px;
			background: #fff;
			border: 1px dashed var(--pm-line);
			border-radius: 12px;
		}
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="location.href = '/static/mobile/menu.html';">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div id="wbsPopup" class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit">작업일보 고찰</h4>
			</div>

			<div class="pm-page">
				<!-- 필터 영역 -->
				<div class="pm-filter">
					<div class="pm-filter-label">조회년월</div>
					<div class="pm-date-row">
						<div class="date_input">
							<input id="reqDtFrom" name="reqDtFrom" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" data-search="reqDtFrom">
						</div>
						<span class="pm-tilde">~</span>
						<div class="date_input">
							<input id="reqDtTo" name="reqDtTo" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" data-search="reqDtTo">
						</div>
					</div>
					<div class="pm-filter-row2">
						<button type="button" class="pm-btn-new" onclick="openCreateModal()"><i class="fas fa-plus"></i>등록(개인)</button>
						<button type="button" class="pm-btn-new team" id="teamButton" style="display:none;" onclick="openCreateTeamModal()"><i class="fas fa-users"></i>등록(팀)</button>
					</div>
				</div>

				<!-- 카드 리스트 영역 -->
				<div id="cardContainer" class="pm-card-list"></div>
			</div>
		</div>
	</div>

<script type="text/javascript">
	var list = [];
	var userDept = jwt.deptId.substr(0, 5);

	$(document).ready(function () {
		const now = moment().startOf("month");
		var beDay = now.add(-2, "M").format("YYYY-MM");

		// 시작일 (현재날짜의 2달 전 월)
		$('#reqDtFrom').datepicker({
			format : "yyyy-mm",
			minViewMode: 1,
			language : "ko",
			autoclose : true
		})
		.datepicker("setDate", beDay)
		.on("changeDate", function(){
			if($('#reqDtFrom').val() > $('#reqDtTo').val()){
				$('#reqDtTo').datepicker("setDate", new Date($('#reqDtFrom').val()));
			}
			gochalList();
		});

		// 종료일 (현재날짜의 월)
		$('#reqDtTo').datepicker({
			format : "yyyy-mm",
			minViewMode: 1,
			language : "ko",
			autoclose : true
		})
		.datepicker("setDate", new Date())
		.on("changeDate", function(){
			if($('#reqDtFrom').val() > $('#reqDtTo').val()){
				$('#reqDtFrom').datepicker("setDate", new Date($('#reqDtTo').val()));
			}
			gochalList();
		});

		if (jwt.authInfo && jwt.authInfo.indexOf("AUTH001") > -1) {
			$("#teamButton").show();
		} else {
			$("#teamButton").hide();
		}

		gochalList();
		authChk();
	});

	function gochalList() {
		var formData = {
			"coCd"      : jwt.coCd,
			"strtDt"    : $("#reqDtFrom").val().replace(/\-/g, ''),
			"endDt"     : $("#reqDtTo").val().replace(/\-/g, ''),
			"userNm"    : jwt.userNm,
			"userId"    : jwt.userId,
			"pageNo"    : 1,
			"recordCnt" : 999999999,
		};
		postAjax("/user/pm/pm40/selectMainGridList", formData, null, function(data){
			list = data.result || [];
			let cardContainer = $("#cardContainer");
			cardContainer.empty();

			if (list.length > 0) {
				$.each(list, function (index, item){
					var isTeam = (item.workDiv === "팀");
					var cardTypeClass = isTeam ? "team" : "personal";
					var badgeClass = isTeam ? "team" : "personal";
					var badgeLabel = item.workDiv || "개인";

					var workYmRaw = item.workYm || "";
					var formattedYm = workYmRaw.length === 6 
						? workYmRaw.substring(0, 4) + "-" + workYmRaw.substring(4, 6) 
						: workYmRaw;

					var workGood = item.workGoodTxt || "";
					var workBad = item.workBadTxt || "";
					var workNeed = item.workNeedTxt || "";
					var workProposal = item.workProposalTxt || "";
					var workRmk = item.workRmk || "";

					var bodyHtml = "";
					if (workGood) {
						bodyHtml += `<div class="pm-item-row" style="border-left-color: #10b981;">
							<div class="pm-item-label"><i class="fas fa-check-circle" style="color: #10b981;"></i>잘된점</div>
							<div class="pm-item-text">${workGood}</div>
						</div>`;
					}
					if (workBad) {
						bodyHtml += `<div class="pm-item-row" style="border-left-color: #f59e0b;">
							<div class="pm-item-label"><i class="fas fa-exclamation-circle" style="color: #f59e0b;"></i>아쉬운점</div>
							<div class="pm-item-text">${workBad}</div>
						</div>`;
					}
					if (workNeed) {
						bodyHtml += `<div class="pm-item-row" style="border-left-color: #8b5cf6;">
							<div class="pm-item-label"><i class="fas fa-arrow-alt-circle-up" style="color: #8b5cf6;"></i>개선할점</div>
							<div class="pm-item-text">${workNeed}</div>
						</div>`;
					}
					if (workProposal) {
						bodyHtml += `<div class="pm-item-row" style="border-left-color: #06b6d4;">
							<div class="pm-item-label"><i class="fas fa-lightbulb" style="color: #06b6d4;"></i>건의사항</div>
							<div class="pm-item-text">${workProposal}</div>
						</div>`;
					}
					if (workRmk) {
						bodyHtml += `<div class="pm-item-row" style="border-left-color: #64748b;">
							<div class="pm-item-label"><i class="fas fa-comment-dots" style="color: #64748b;"></i>비고</div>
							<div class="pm-item-text">${workRmk}</div>
						</div>`;
					}
					if (!bodyHtml) {
						bodyHtml = `<div style="font-size: 12px; color: #94a3b8; padding: 6px 0;">작성된 고찰 내용이 없습니다.</div>`;
					}

					var isApproved = (item.sanctnSttus === 'Y');
					var delBtnHtml = "";
					if (item.userId === jwt.userId) {
						if (isApproved) {
							delBtnHtml = `<span class="pm-badge" style="background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; font-size: 11px;"><i class="fas fa-lock" style="margin-right: 3px;"></i>결재진행(삭제불가)</span>`;
						} else {
							delBtnHtml = `<button type="button" class="pm-card-btn-del" onclick="event.stopPropagation(); delete_pm40(${index});"><i class="far fa-trash-alt"></i>삭제</button>`;
						}
					} else {
						delBtnHtml = `<div></div>`;
					}

					var cardHtml = `
						<div class="pm-card ${cardTypeClass}" onclick="openSecondModal(${index})">
							<div class="pm-card-head">
								<div class="pm-card-title">
									<i class="far fa-calendar-alt" style="color: var(--pm-navy);"></i>
									<span>${formattedYm}</span>
								</div>
								<span class="pm-badge ${badgeClass}">
									<span class="dot"></span>${badgeLabel}
								</span>
							</div>
							<div class="pm-card-body-items">
								${bodyHtml}
							</div>
							<div class="pm-card-foot">
								${delBtnHtml}
								<span class="pm-card-more">상세보기 <i class="fas fa-chevron-right"></i></span>
							</div>
						</div>`;

					cardContainer.append(cardHtml);
				});
			} else {
				cardContainer.append(`
					<div class="pm-empty">
						<i class="fas fa-clipboard-list" style="font-size: 32px; color: #cbd5e1; margin-bottom: 10px; display: block;"></i>
						작업일보 고찰 자료가 없습니다.
					</div>
				`);
			}
		});
	}

	/*삭제 버튼 클릭 시*/
	function delete_pm40(index) {
		const gridList = list[index];
		if (gridList.userId != jwt.userId) {
			alert("작성자 본인만 삭제할 수 있습니다.");
			return;
		}

		// 1차 클라이언트 체크: 이미 조회 시점에 1명이라도 결재 완료된 경우 즉시 차단
		if (gridList.sanctnSttus === 'Y') {
			alert("결재가 1명 이상 완료(진행)되어 삭제할 수 없습니다.");
			return;
		}

		var formData = {
			"coCd"        : gridList.coCd,
			"reqNo"       : gridList.workNo,
			"workNo"      : gridList.workNo,
			"salesCd"     : gridList.workNo,
			"workYm"      : gridList.workYm,
			"resDiv"      : gridList.resDiv,
			"userId"      : gridList.userId,
			"deptCd"      : userDept,
			"fileTrgtTyp" : "PM4001M01_M",
			"pgmId"       : "PM4001M01_M"
		};

		// 2차 서버 실시간 결재 상태 체크 (동시성 결재 승인 방지)
		postAjaxSync("/user/qm/qm01/selectApprovalChk", formData, null, function(data) {
			var chkResult = data.result && data.result[0];
			var status = (typeof chkResult === 'object' && chkResult !== null) ? (chkResult.SANCTN_STTUS || chkResult.sanctnSttus) : chkResult;
			if (status == 'Y'){
				alert("결재가 1명 이상 완료(진행)되어 삭제할 수 없습니다.");
				gochalList();
				return;
			}

			if (confirm("삭제하시겠습니까?")) {
				putAjax("/user/pm/pm40/delete_pm40", formData, null, function(res) {
					alert(res.resultMessage);
					if (res.resultCode == 200) {
						gochalList();
					}
				});
			}
		});
	}

	//모달 오픈 (상세조회)
	function openSecondModal(index) {
		const gridList = list[index];
		var type = "U";

		var paramObj = {
			"fileTrgtKey" : gridList.todoFileTrgtKey,
			"actionType"  : type,
			"coCd"        : jwt.coCd,
			"userId"      : jwt.userId,
			"userNm"      : jwt.userNm,
			"resDt"       : gridList.workYm,
			"workYm"      : gridList.workYm,
			"workNo"      : gridList.workNo,
			"pgmId"       : "PM4001P01_M"
		};

		if( gridList.todoFileTrgtKey > 0 || gridList.todoFileTrgtKey != '' ) {
			$.each(gridList, function (key, val) {
				if( typeof(val) == "undefined") val = "";
				paramObj[key] = val;
			});
		}

		var nextUrl = '/static/mobile/html/user/pm/pm40/PM4001P01_M.html';
		if(gridList.workDiv === "팀"){
			paramObj.pgmId = "PM4001P02_M";
			nextUrl = '/static/mobile/html/user/pm/pm40/PM4001P02_M.html';
		}

		sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
		insertPgmHistory(nextUrl);
		location.href = nextUrl;
	}

	//신규 등록(개인) 모달 오픈
	function openCreateModal() {
		var paramObj = {
			"actionType"  : "C",
			"fileTrgtKey" : 0,
			"coCd"        : jwt.coCd,
			"userId"      : jwt.userId,
			"userNm"      : jwt.userNm,
			"pgmId"       : "PM4001M01_M"
		};

		var nextUrl = '/static/mobile/html/user/pm/pm40/PM4001P01_M.html';
		sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
		insertPgmHistory(nextUrl);
		location.href = nextUrl;
	}

	//신규 등록(팀) 모달 오픈
	function openCreateTeamModal() {
		var paramObj = {
			"actionType"  : "C",
			"fileTrgtKey" : 0,
			"coCd"        : jwt.coCd,
			"userId"      : jwt.userId,
			"userNm"      : jwt.userNm,
			"pgmId"       : "PM4001M01_M"
		};

		var nextUrl = '/static/mobile/html/user/pm/pm40/PM4001P02_M.html';
		sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
		insertPgmHistory(nextUrl);
		location.href = nextUrl;
	}
</script>

</body>
</html>
