	<style>
		/* ── 모바일 전용 DateRangePicker (#globalDRP) 레이아웃 및 팝업 정밀 보정 ── */
		#globalDRP {
			position: fixed !important;
			z-index: 999999 !important;
			top: 50% !important;
			left: 50% !important;
			transform: translate(-50%, -50%) !important;
			width: 92% !important;
			max-width: 360px !important;
			min-width: unset !important;
			background: #ffffff !important;
			border-radius: 14px !important;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4) !important;
			padding: 16px !important;
			box-sizing: border-box !important;
			margin: 0 !important;
			touch-action: manipulation !important;
		}

		#globalDRP .drp-body {
			display: flex !important;
			flex-direction: column !important;
			gap: 12px !important;
		}

		#globalDRP .drp-col {
			width: 100% !important;
		}

		#globalDRP .datepicker {
			font-size: 13px !important;
			width: 100% !important;
		}

		#globalDRP .datepicker table {
			width: 100% !important;
		}

		/* 스마트폰 손가락 터치 영역 최적화 (36px x 36px 터치 타겟) */
		#globalDRP .datepicker table td.day {
			width: 36px !important;
			height: 36px !important;
			line-height: 36px !important;
			font-size: 14px !important;
			border-radius: 50% !important;
			padding: 0 !important;
		}

		#globalDRP .datepicker table td.day.active {
			background-color: #304a8a !important;
			color: #ffffff !important;
			font-weight: bold !important;
		}

		#globalDRP .datepicker table th {
			text-align: center !important;
			padding: 6px 0 !important;
			font-size: 12px !important;
			color: #555555 !important;
		}

		#globalDRP .drp-col-label {
			font-size: 13px !important;
			font-weight: bold !important;
			padding: 6px 0 !important;
			background: #eef3fb !important;
			color: #304a8a !important;
			border-radius: 6px !important;
			text-align: center !important;
		}

		#globalDRP .drp-footer {
			margin-top: 14px !important;
			padding-top: 10px !important;
			display: flex !important;
			justify-content: center !important;
			gap: 8px !important;
		}

		#globalDRP .drp-footer button {
			flex: 1 !important;
			padding: 10px 16px !important;
			font-size: 14px !important;
			font-weight: bold !important;
			border-radius: 8px !important;
			margin: 0 !important;
		}

		/* ── PM0701P01_M 전용 : 휴가신청 입력/조회 (스마트폰 세로보기, PM0701M01_M 목록화면과 톤 통일) ── */
		:root {
			--pm07-navy: #304a8a;
			--pm07-navy-dark: #253a6e;
			--pm07-bg: #dfe4ec;
			--pm07-ink: #14161c;
			--pm07-sub: #6b7280;
			--pm07-line: #c3cad8;
		}

		html, body { background: var(--pm07-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.toggle-group { display: none; }
		.toggle-group.show { display: block; }

		.pm07p-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 100px;
			box-sizing: border-box;
		}

		.pm07p-notice {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 8px;
			background: #fff7e6;
			border: 1px solid #f3d38a;
			color: #92660a;
			font-size: 12.5px;
			font-weight: 600;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
			box-sizing: border-box;
		}

		.pm07p-section {
			width: 100%;
			background: #ffffff;
			border: 1px solid var(--pm07-line);
			border-radius: 11px;
			padding: 13px;
			margin-bottom: 11px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, .06);
			box-sizing: border-box;
		}

		.pm07p-section-title {
			font-size: 12.5px;
			font-weight: 800;
			color: var(--pm07-navy);
			letter-spacing: .02em;
			margin: 0 0 9px;
			padding-bottom: 6px;
			border-bottom: 2px solid #eef1f6;
		}

		.pm07p-field { margin-bottom: 11px; }
		.pm07p-field:last-child { margin-bottom: 0; }

		.pm07p-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			margin-bottom: 6px;
		}
		.pm07p-label.hit::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}

		.pm07p-input {
			width: 100% !important;
			height: 41px;
			border: 1px solid var(--pm07-line) !important;
			border-radius: 8px !important;
			font-size: 14.5px !important;
			padding: 0 12px !important;
			box-sizing: border-box;
			background-color: #fff;
			color: var(--pm07-ink);
		}
		.pm07p-input:focus {
			outline: none;
			border-color: var(--pm07-navy) !important;
			box-shadow: 0 0 0 3px rgba(48, 74, 138, .14);
		}
		.pm07p-input:disabled, .pm07p-input[readonly] {
			background-color: #f3f4f7;
			color: #7c828d;
		}
		.pm07p-input.input_calendar { background-position: 96% 50%; cursor: pointer; }

		textarea.pm07p-input {
			height: auto;
			min-height: 100px;
			padding: 10px 12px !important;
			line-height: 1.55;
			resize: vertical;
		}

		.pm07p-field-row { display: flex; gap: 10px; }
		.pm07p-field-row .pm07p-field { flex: 1 1 0; min-width: 0; }

		/* 결재정보 - PC PM0701P01.html의 approvalGrid(TB_WB20M03 결재선)와 동일한 데이터를
		   읽기전용 리스트로 보여준다. */

			display: flex;
			align-items: center;
			gap: 10px;
			padding: 7px 0;
			border-bottom: 1px solid #eef1f6;
		}
		.pm07p-approval-row:last-child { border-bottom: none; }
		.pm07p-approval-sn {
			flex: 0 0 auto;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background: #eef2fa;
			color: var(--pm07-navy);
			font-size: 10.5px;
			font-weight: 800;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.pm07p-approval-info { flex: 1 1 0; min-width: 0; }
		.pm07p-approval-name { font-size: 12.5px; font-weight: 700; color: var(--pm07-ink); }
		.pm07p-approval-date { font-size: 10.5px; color: var(--pm07-sub); margin-top: 1px; }
		.pm07p-approval-status {
			flex: 0 0 auto;
			font-size: 10.5px;
			font-weight: 700;
			padding: 3px 9px;
			border-radius: 999px;
			background: #f1f2f4;
			color: #6b7280;
			white-space: nowrap;
		}
		.pm07p-approval-status.end { background: #e8f7ee; color: #15803d; }
		.pm07p-approval-status.rtn { background: #fdecec; color: #b91c1c; }

		/* 첨부파일 영역: 기존 treeModule이 그리는 내부 마크업은 그대로 두고 컨테이너만 톤 맞춤 */
		#fileList_area { font-size: 13px; }

		.pm07p-bottom-bar {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			gap: 10px;
			padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
			background: #ffffff;
			border-top: 1px solid var(--pm07-line);
			box-shadow: 0 -2px 10px rgba(16, 24, 40, .08);
			z-index: 60;
		}
		.pm07p-bottom-bar button {
			flex: 1 1 0;
			height: 46px;
			border-radius: 10px;
			font-size: 15px;
			font-weight: 800;
			border: none;
		}
		.pm07p-bottom-bar #actionBtn {
			background: var(--pm07-navy);
			color: #fff;
		}
		.pm07p-bottom-bar #actionBtn:active { background: var(--pm07-navy-dark); }
		.pm07p-bottom-bar .close_btn {
			background: #ffffff;
			border: 1px solid var(--pm07-line) !important;
			color: #3a3f4a;
		}
		.pm07p-bottom-bar .close_btn:active { background: #f3f4f7; }
		.pm07p-bottom-bar #deleteBtn {
			background: #dc3545;
			color: #fff;
		}
		.pm07p-bottom-bar #deleteBtn:active { background: #b02a37; }
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />

	</div>

	<div id="main_area">
		<div class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit">휴가신청</h4>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="pgmId" name="pgmId" value="PM0701P01_M">

						<span>결재가 진행 중이거나 완료된 신청은 수정할 수 없습니다.</span>
					</div>

					<div class="pm07p-section">
						<div class="pm07p-section-title">신청 정보</div>

						<div class="pm07p-field">
							<label class="pm07p-label hit" for="reqTitl">휴가신청자</label>
							<input type="text" id="reqTitl" name="reqTitl" required readonly class="pm07p-input" msg="휴가신청자" placeholder="휴가신청자 성명" style="background: #fafafa !important;">
						</div>

						<div class="pm07p-field">
							<label class="pm07p-label hit" for="vacTypeCd">휴가유형</label>
							<select id="vacTypeCd" name="vacTypeCd" required class="pm07p-input" data-kind="PM07TYPE" msg="휴가유형" onchange="onVacTypeChanged()">

							</select>
						</div>

						<div id="ampmRow" class="toggle-group pm07p-field">
							<label class="pm07p-label" for="ampmCd">오전/오후</label>
							<select id="ampmCd" name="ampmCd" class="pm07p-input" data-kind="PM07AMPM">
								<option value="">-- 선택 --</option>
							</select>
						</div>
					</div>

					<div class="pm07p-section">
						<div class="pm07p-section-title">기간</div>

						<div class="pm07p-field-row">
							<div class="pm07p-field">
								<label class="pm07p-label hit" for="stDt">시작날짜</label>
								<div class="date_input">
									<input type="text" id="stDt" name="stDt" required class="pm07p-input input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="시작날짜" onclick="openDateRangePicker();" style="cursor: pointer;">

							</div>
							<div class="pm07p-field">
								<label class="pm07p-label hit" for="edDt">종료날짜</label>
								<div class="date_input">
									<input type="text" id="edDt" name="edDt" required class="pm07p-input input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="종료날짜" onclick="openDateRangePicker();" style="cursor: pointer;">
								</div>

						<div id="stTmRow" class="toggle-group pm07p-field" style="display: none;">

						<!-- 휴가일수/차감일수는 화면에 별도 노출하지 않지만, 저장 시 서버로 보내야 하는 계산값이라 숨김 필드로 유지 -->

					<div class="pm07p-section">

					<!-- 결재 처리 위젯 (M08 결재 대기목록 등 결재 진입 시 생성 - 하단 버튼 바로 위에 위치) -->

			<button type="button" id="approvalBtn" style="display: none !important; background: #007bff; color: #ffffff; font-weight: bold;" onclick="doMobileVacationApproval();">승인</button>
			<button type="button" id="actionBtn" style="display: none !important;">저장</button>

	<script type="text/javascript">
		var actionType = null;
		var paramObj = null;
		var isReadonly = false;

		// selectVacationDtl이 이미 TO_CHAR(...,'YYYY-MM-DD')로 변환해서 내려주므로
		// 'YYYY-MM-DD'(10자, 대시 포함)로 들어오면 그대로 쓰고, 혹시 원시 'YYYYMMDD'(8자)로
		// 오는 경우에만 대시를 넣어준다. (PM0701M01_M.html의 toDashDate와 동일한 이유)
		function toDashDate(dateStr) {
			if (!dateStr) return '';
			if (dateStr.length === 10 && dateStr.indexOf('-') > -1) return dateStr;
			if (dateStr.length !== 8) return '';
			return dateStr.substring(0, 4) + '-' + dateStr.substring(4, 6) + '-' + dateStr.substring(6, 8);
		}

		function isHalfDayType(nm) {
			return nm && (nm.indexOf('반차') > -1);
		}

		function isTimeType(nm) {
			var timeTypeNames = ['조퇴', '외출'];
			return nm && (timeTypeNames.indexOf(nm) > -1);
		}

		function isMultiDayType(codeNm) {
			if (!codeNm) return true;
			var nm = $.trim(codeNm);
			if (nm.indexOf("반차") >= 0 || nm.indexOf("조퇴") >= 0 || nm.indexOf("외출") >= 0) {
				return false;
			}
			return nm.indexOf("연차") >= 0
				|| nm.indexOf("교육") >= 0
				|| nm.indexOf("훈련") >= 0
				|| nm.indexOf("경조") >= 0
				|| nm.indexOf("포상") >= 0
				|| nm.indexOf("하계") >= 0
				|| nm.indexOf("대체") >= 0
				|| nm.indexOf("병가") >= 0;
		}

		function isRmkOptional(codeNm) {
			if (!codeNm) return false;
			var nm = $.trim(codeNm);
			return nm.indexOf("연차") >= 0
				|| nm.indexOf("반차") >= 0
				|| nm.indexOf("조퇴") >= 0
				|| nm.indexOf("외출") >= 0
				|| nm.indexOf("하계") >= 0
				|| nm.indexOf("대체") >= 0
				|| nm.indexOf("병가") >= 0;
		}

		function isHolidayDate(dtStr) {
			if (!dtStr || dtStr.length < 10) return false;
			try {
				var parts = dtStr.split('-');
				if (parts.length === 3) {
					var y = parseInt(parts[0], 10);
					var m = parseInt(parts[1], 10) - 1;
					var d = parseInt(parts[2], 10);
					var dt = new Date(y, m, d);
					var day = dt.getDay();
					if (day === 0 || day === 6) return true; // 주말(토/일)

					if (typeof yearHolidayTable === 'function') {
						var yearHolidays = yearHolidayTable(y) || [];
						var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
						for (var i = 0; i < yearHolidays.length; i++) {
							if (yearHolidays[i] === targetStr) {
								return true; // 공휴일
							}
						}
					}
				}
			} catch (e) {
				console.error(e);
			}
			return false;
		}

		function onStDtChanged() {
			var stVal = $("#stDt").val();
			var edVal = $("#edDt").val();
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var selectedNm = selectedOption.text() || '';

			if (!isMultiDayType(selectedNm)) {
				// stVal === edVal 이면 이미 동기화된 상태이므로 다시 쓰지 않는다.
				// datepicker('setDate', ...)가 값이 그대로여도 change를 재발화하면
				// onEdDtChanged ↔ onStDtChanged가 서로를 무한히 호출해 콜스택이 터진다.
				if (stVal && stVal !== edVal) {
					$("#edDt").val(stVal);
					$('#edDt').datepicker('setDate', stVal);
				}
			} else {
				if (stVal && edVal && stVal > edVal) {
					$("#edDt").val(stVal);
					$('#edDt').datepicker('setDate', stVal);
				}
			}
			onDateChanged();
		}

		function onEdDtChanged() {
			var stVal = $("#stDt").val();
			var edVal = $("#edDt").val();
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var selectedNm = selectedOption.text() || '';

			if (!isMultiDayType(selectedNm)) {
				// edVal === stVal 이면 이미 동기화된 상태이므로 다시 쓰지 않는다. (onStDtChanged와 동일한 이유)
				if (edVal && edVal !== stVal) {
					$("#stDt").val(edVal);
					$('#stDt').datepicker('setDate', edVal);
				}
			} else {
				if (stVal && edVal && edVal < stVal) {
					$("#stDt").val(edVal);
					$('#stDt').datepicker('setDate', edVal);
				}
			}
			onDateChanged();
		}

			if (isHalfDayType(vacTypeName)) {

			} else if (vacTypeName.indexOf('연차') >= 0) {
				return vacDays || 0;
			} else {

			}
		}

		function loadMobileFileImgPreview(idx, fileKey, fileName) {
			if (!fileKey) return;
			var coCdVal = $("#coCd").val() || jwt.coCd || "GUN";
			var xhr = new XMLHttpRequest();
			xhr.open("GET", "/admin/cm/cm08/fileDownloadAuth2?fileKey=" + fileKey + "&userId=" + jwt.userId + "&coCd=" + coCdVal, true);
			xhr.responseType = "blob";
			if (typeof authorizationToken !== 'undefined') {
				xhr.setRequestHeader("Authorization", authorizationToken);
			}
			xhr.setRequestHeader("X-GBS-Source", "pdfjs-viewer");

			xhr.onload = function() {
				if (xhr.status === 200 && xhr.response) {
					var ext = fileName ? fileName.substring(fileName.lastIndexOf('.') + 1).toLowerCase() : '';
					if (ext === 'heic' || ext === 'heif') {
						// HEIC/HEIF는 브라우저가 직접 렌더링하지 못하므로 heic2any로 jpeg 변환 후 미리보기 (PM0101P01_M.html 방식과 동일)
						if (typeof heic2any !== "undefined") {
							heic2any({ blob: xhr.response, toType: "image/jpeg" }).then(function(resultBlob) {
								var reader = new FileReader();
								reader.onload = function(e) {
									$('#mobileImgThumb_' + idx).attr('src', e.target.result).show();
									$('#mobileImgPlaceholder_' + idx).hide();
								};
								reader.readAsDataURL(resultBlob);
							}).catch(function(error) {
								console.error("HEIC 미리보기 변환 오류:", error);
							});
						} else {
							console.error("heic2any 라이브러리가 로딩되지 않음");
						}
						return;
					}
					var reader = new FileReader();
					reader.onload = function(e) {
						$('#mobileImgThumb_' + idx).attr('src', e.target.result).show();
						$('#mobileImgPlaceholder_' + idx).hide();
					};
					reader.readAsDataURL(xhr.response);
				} else {
					console.error("이미지 미리보기 실패, status: " + xhr.status);
				}
			};
			xhr.send();
		}

		// 플로터 앱에서 실제로 호출하는 네이티브 콜백 함수 (PM0101P01_M.html uploadFile()과 100% 동일 계약)
		// Flutter 측 호출부: uploadFile("$fileName", "$base64", "${pickedFile.path}", "image")
		// base64ImageData를 실제 File 객체로 변환한 뒤 첨부목록에 추가 (base64ToFile/downloadImageFromBase64는 global.js 공용 함수)
		function uploadFile(fileName, base64ImageData, fileObj, type) {
			if (!fileName) return;
			var typeArr = fileName.split(".");
			var fileType = typeArr[typeArr.length - 1];
			var uploadDate = new Date();
			var file;

			if (type == "image") {
				file = downloadImageFromBase64(base64ImageData, fileName, fileType, type);
				file = new File([file], fileName, { type: 'image/' + fileType, lastModified: uploadDate });
			} else {
				file = base64ToFile(base64ImageData, fileName, fileType, type);
				file = new File([file], fileName, { type: 'application/octet-stream', lastModified: uploadDate });
			}

			attachedFiles.push(file);
			renderMobileFileList();
		}

		// PC PM0701P01.html의 loadApprovalLine(reqNo)와 동일한 조회(WB20 공통 결재선 API)를
		// 읽기전용 리스트로 렌더링한다. 결재선이 없으면(임시저장 등) 섹션 자체를 숨긴다.
		function loadApprovalLine(reqNo) {
			if (!reqNo) return;

			postAjax("/user/wb/wb20/selectGetApprovalList", { "todoNo": reqNo }, null, function(data) {
				var rows = data.resultList || data.result || [];
				var isApprovalMode = (actionType === "A" || (paramObj && (
					paramObj.pgmId === "M08" || paramObj.todoDiv1CodeId === "TODODIV20" ||
					paramObj.todoDiv1CodeId === "TODODIV10" || paramObj.sanctnSn
				)));

				// 본인 외 상급 결재자(TODODIV20, todoId != jwt.userId) 중 실제로 결재(승인/반려)를 처리한 건이 있는지 동적 판단한다.
				// (결재선에 상급 결재자가 여러 명 등록되어 있더라도, 아직 아무도 결재를 진행하지 않았다면
				//  본인 혼자만 기결재 상태인 대기중 건이므로 수정/삭제가 모두 가능하다.)
				var hasOtherApproverActed = rows.some(function(r) {
					var approverId = r.todoId || r.TODO_ID;
					var div1 = r.todoDiv1CodeId || r.TODO_DIV1_CODE_ID;
					var isApprover = (!div1 || div1 === 'TODODIV20') && approverId && approverId !== jwt.userId;
					if (!isApprover) return false;

					var sanctnSttus = r.sanctnSttus || r.SANCTN_STTUS || '';
					var sanctnSttusNm = r.sanctnSttusNm || r.SANCTN_STTUS_NM || '';

					return (sanctnSttus === 'Y' || sanctnSttus === 'R')
						|| (sanctnSttusNm.indexOf('승인') > -1 && sanctnSttusNm.indexOf('미승인') === -1)
						|| (sanctnSttusNm.indexOf('반려') > -1);
				});

				if (!isApprovalMode && !hasOtherApproverActed) {
					// 본인 외에는 아직 아무도 결재하지 않음 -> 수정/삭제 100% 가능하도록 UI 잠금 해제 및 버튼 표시
					isReadonly = false;
					$("#popForm").find("input, select, textarea").not("#actionBtn, #deleteBtn").prop("readonly", false).prop("disabled", false);
					$(".toggle-group select").prop("disabled", false);
					$("#actionBtn").show();
					$("#deleteBtn").show();
					$("#readonlyNotice").hide();
					$("#btnMobileFileAdd").show();
					$("#mobileFileListArea").css({ "opacity": "1" });
				} else if (!isApprovalMode) {
					// 상급 결재자가 이미 결재(승인/반려)를 진행함 -> 수정/삭제 불가 (Readonly 잠금)
					isReadonly = true;
					$("#popForm").find("input, select, textarea").not("#actionBtn, #deleteBtn").prop("readonly", true).prop("disabled", true);
					$(".toggle-group select").prop("disabled", true);
					$("#actionBtn").hide();
					$("#deleteBtn").hide();
					$("#readonlyNotice").css("display", "flex");
					$("#btnMobileFileAdd").hide();
					$("#mobileFileListArea").css({ "opacity": "0.8" });
				}

				if (rows.length === 0) {
					$("#approvalSection").hide();
					return;
				}

				rows.sort(function(a, b) { return Number(a.sanctnSn || 0) - Number(b.sanctnSn || 0); });

				var html = '';
				$.each(rows, function(idx, r) {
					var statusNm = r.sanctnSttusNm || '';
					var statusCls = 'wait';
					if (statusNm.indexOf('반려') > -1) {
						statusCls = 'rtn';
					} else if (statusNm.indexOf('미승인') === -1 && statusNm.indexOf('승인') > -1) {
						statusCls = 'end';
					}
					var nm = r.todoNm || r.name || '';
					var jik = r.jik ? (' ' + r.jik) : '';
					var cfDt = r.todoCfDt || '';

					html += '<div class="pm07p-approval-row">' +
						'<div class="pm07p-approval-sn">' + (r.sanctnSn || (idx + 1)) + '</div>' +
						'<div class="pm07p-approval-info">' +
							'<div class="pm07p-approval-name">' + nm + jik + '</div>' +
							(cfDt ? ('<div class="pm07p-approval-date">' + cfDt + '</div>') : '') +
						'</div>' +
						'<span class="pm07p-approval-status ' + statusCls + '">' + statusNm + '</span>' +
					'</div>';
				});

				$("#approvalList").html(html);
				// 결재자 진입 모드에서는 상단 결재정보 요약 카드를 숨기고,
				// 하단 결재 처리 위젯만 표시한다.
				if (isApprovalMode) {
					$("#approvalSection").hide();
				} else {
					$("#approvalSection").css("display", "block");
				}
			});
		}

				});
				formData.append("deleteFileArr", JSON.stringify(deleteFileArr));

				filePostAjax("/user/pm/pm07/insertVacation", formData, function(data) {
					if (data.resultCode == 200) {
						alert("휴가신청이 저장되었습니다.");
						var resReqNo = (data.result && data.result.reqNo) ? data.result.reqNo : (data.reqNo || "");
						if (resReqNo && $("#reqNo").val() === "") {
							$("#reqNo").val(resReqNo);
						}
						try {
							kakaoTodo();
						} catch (e) {
							console.error("알림톡 발송 실패 (저장은 정상 처리됨):", e);
						}
						goBack();
					} else {
						alert(data.resultMessage || "저장 중 오류가 발생했습니다.");
					}
				});
			}
		}

		function updateVacation() {
			if (inputValidation($('.popup_area [required]'))) {
				var stDtVal = $("#stDt").val();
				var edDtVal = $("#edDt").val();
				var vacTypeOption = $("#vacTypeCd").find("option:selected");
				var selectedNm = vacTypeOption.text();
				var workHour = isHalfDayType(selectedNm) ? 4 : 8;
				var dayList = listWorkingDays(stDtVal, edDtVal);
				var vacDtArr = dayList.map(function(d) {
					return { vacDt : d.replace(/\-/g, ''), workHour : workHour };
				});

				var formData = new FormData();
				formData.append("coCd", $("#coCd").val());
				formData.append("reqNo", $("#reqNo").val());
				formData.append("reqTitl", $("#reqTitl").val());
				formData.append("vacTypeCd", $("#vacTypeCd").val());
				formData.append("ampmCd", $("#ampmCd").val());
				formData.append("stDt", stDtVal.replace(/-/g, ''));
				formData.append("edDt", edDtVal.replace(/-/g, ''));
				formData.append("stTm", $("#stTm").val());
				formData.append("edTm", $("#edTm").val());
				formData.append("reqRmk", $("#reqRmk").val());
				formData.append("vacDays", parseFloat($("#vacDays").val()) || 0);
				formData.append("deductDays", parseFloat($("#deductDays").val()) || 0);
				formData.append("vacDtArr", JSON.stringify(vacDtArr));
				formData.append("pgmId", $("#pgmId").val());
				formData.append("reqId", jwt.userId);
				formData.append("reqDeptId", jwt.deptId);
				formData.append("userId", jwt.userId);
				formData.append("comonCd", "FITR9902");
				formData.append("approvalArr", JSON.stringify(processApprovalGrid()));
				$.each(attachedFiles, function(idx, fileObj) {
					formData.append("files", fileObj);
				});
				formData.append("deleteFileArr", JSON.stringify(deleteFileArr));

				filePostAjax("/user/pm/pm07/updateVacation", formData, function(data) {
					if (data.resultCode == 200) {
						alert("휴가신청이 수정되었습니다.");
						try {
							kakaoTodo();
						} catch (e) {
							console.error("알림톡 발송 실패 (수정은 정상 처리됨):", e);
						}
						goBack();
					} else {
						alert(data.resultMessage || "수정 중 오류가 발생했습니다.");
					}
				});
			}
		}

		// 결재선에 본인 외 다른 결재자가 없을 때만 노출되는 삭제 버튼 (PM0701M01.html deleteVacation()과 동일 API)
		function deleteMobileVacation() {
			var reqNo = $("#reqNo").val();
			if (!reqNo) return;
			if (!confirm("삭제하시겠습니까?")) return;

			var formData = {
				 "coCd"   : $("#coCd").val() || jwt.coCd
				,"reqNo"  : reqNo
				,"userId" : jwt.userId
				,"pgmId"  : "PM0701P01_M"
			};
			putAjax("/user/pm/pm07/deleteVacation", formData, null, function(data) {
				alert(data.resultMessage);
				if (data.resultCode == 200) {
					goBack();
				}
			});
		}

		// 모바일 결재선 구성 (PC 화면과 동일하게 순차결재선 구성: 신청자 본인 -> 팀장 -> SPECRTS17 다단계)
		function processApprovalGrid() {
			var approvalArr = [];
			var autoList = [];
			var addedIds = {};

			function pushApprover(u) {
				if (!u || !u.id) return;
				var key = String(u.id).toLowerCase();
				if (addedIds[key]) return;
				addedIds[key] = true;
				autoList.push({
					gb    : "결재",
					usrNm : u.id,
					todoId: u.id,
					name  : u.name || u.id,
					jik   : u.levelNm || '',
					dtNm  : u.deptNm || '',
					telNo : u.telNo || '',
					email : u.email || '',
					sanctnSttusNm : '미승인'
				});
			}

			// 1) 신청자 본인 (로그인 유저, 자동 승인 Y)
			var reqId = jwt.userId;
			var isTeamMgr = false;
			postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": reqId }, null, function(data) {
				if (data && data.userInfo) {
					isTeamMgr = (data.userInfo.teamManager === 'TEAM01');
					var uObj = data.userInfo;
					var key = String(uObj.id).toLowerCase();
					addedIds[key] = true;
					autoList.push({
						gb            : "결재",
						usrNm         : uObj.id,
						todoId        : uObj.id,
						name          : uObj.name || uObj.id,
						jik           : uObj.levelNm || '',
						dtNm          : uObj.deptNm || '',
						telNo         : uObj.telNo || '',
						email         : uObj.email || '',
						sanctnSttus   : 'Y',
						sanctnSttusNm : '승인'
					});
				}
			});

			// 2) 담당자 팀장 (신청자가 팀장 본인이면 건너뛴다)
			if (!isTeamMgr) {
				postAjaxSync("/user/wb/wb24/selectTeamManagerInfo", { "userId": reqId }, null, function(data) {
					if (data && data.result) {
						pushApprover(data.result);
					}
				});
			}

			// 3) 휴가관리 결재라인 (SPECRTS17 의 CODE_ETC 등록 순서대로)
			postAjaxSync("/admin/cm/cm05/selectChildCodeList", { "codeId": "SPECRTS17" }, null, function(data) {
				var list = (data && data.childCodeList) ? data.childCodeList : [];
				if (list.length === 0) return;
				var codeEtc = list[0].codeEtc || '';
				if (!codeEtc) return;

				$.each(codeEtc.split(','), function(idx, rawId) {
					var uId = $.trim(rawId);
					if (!uId) return true;
					postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": uId }, null, function(userData) {
						if (userData && userData.userInfo) {
							pushApprover(userData.userInfo);
						}
					});
				});
			});

			// 순번은 배열 순서 그대로 (순차결재 순서)
			$.each(autoList, function(idx, row) { row.sanctnSn = idx + 1; });

			$.each(autoList, function(idx, item) {
				approvalArr.push({
					coCd           : $("#coCd").val() || "GUN",
					todoCoCd       : $("#coCd").val() || "GUN",
					todoDiv1CodeId : "TODODIV20",
					todoDiv2CodeId : "TODODIV2300",
					salesCd        : $("#reqNo").val() || "",
					sanctnSn       : item.sanctnSn || (idx + 1),
					sanctnSttus    : item.sanctnSttus || "N",
					todoNo         : $("#reqNo").val() || "",
					todoTitl       : "휴가신청서",
					pgPath         : "/static/mobile/html/user/pm/pm07/PM0701P01_M.html",
					pgParam        : JSON.stringify({
						actionType : "U",
						coCd       : $("#coCd").val() || "GUN",
						reqNo      : $("#reqNo").val() || "",
						pgmId      : "PM0701P01_M"
					}),
					todoId         : item.usrNm,
					empNo          : item.usrNm,
					name           : item.name,
					telNo          : item.telNo || '',
					email          : item.email || '',
					gb             : item.gb
				});
			});

			return approvalArr;
		}

		function goBack() {
			if (typeof modalStack !== 'undefined' && modalStack && typeof modalStack.close === 'function' && modalStack.length > 0) {
				modalStack.close();
				return;
			}
			if (window.parent && typeof window.parent.closeModal === 'function') {
				window.parent.closeModal();
				return;
			}
			var isApprovalMode = (actionType === "A" || (paramObj && (paramObj.pgmId === "M08" || paramObj.todoDiv1CodeId === "TODODIV20" || paramObj.sanctnSn)));
			var nextUrl = isApprovalMode ? '/static/mobile/admin/cm/cm11/M08.html' : '/static/mobile/html/user/pm/pm07/PM0701M01_M.html';
			insertPgmHistory(nextUrl);
			location.href = nextUrl;
		}
	</script>
