<head>
	<meta charset="utf-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">

	<style>
		/* ── PM0701P01_M 전용 : 휴가신청 입력/조회 (스마트폰 세로보기, PM0701M01_M 목록화면과 톤 통일) ── */
		:root {
			--pm07-navy: #304a8a;
			--pm07-navy-dark: #253a6e;
			--pm07-bg: #dfe4ec;
			--pm07-ink: #14161c;
			--pm07-sub: #6b7280;
			--pm07-line: #c3cad8;
		}

		html, body { background: var(--pm07-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.toggle-group { display: none; }
		.toggle-group.show { display: block; }

		.pm07p-page {
			width: 100%;
			max-width: 480px;
			margin: 0 auto;
			padding: 12px 12px 100px;
			box-sizing: border-box;
		}

		.pm07p-notice {
			display: flex;
			align-items: center;
			gap: 8px;
			background: #fff7e6;
			border: 1px solid #f3d38a;
			color: #92660a;
			font-size: 12.5px;
			font-weight: 600;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
		}

		.pm07p-section {
			background: #ffffff;
			border: 1px solid var(--pm07-line);
			border-radius: 11px;
			padding: 13px;
			margin-bottom: 11px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, .06);
		}

		.pm07p-section-title {
			font-size: 12.5px;
			font-weight: 800;
			color: var(--pm07-navy);
			letter-spacing: .02em;
			margin: 0 0 9px;
			padding-bottom: 6px;
			border-bottom: 2px solid #eef1f6;
		}

		.pm07p-field { margin-bottom: 11px; }
		.pm07p-field:last-child { margin-bottom: 0; }

		.pm07p-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			margin-bottom: 6px;
		}
		.pm07p-label.hit::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}

		.pm07p-input {
			width: 100% !important;
			height: 41px;
			border: 1px solid var(--pm07-line) !important;
			border-radius: 8px !important;
			font-size: 14.5px !important;
			padding: 0 12px !important;
			box-sizing: border-box;
			background-color: #fff;
			color: var(--pm07-ink);
		}
		.pm07p-input:focus {
			outline: none;
			border-color: var(--pm07-navy) !important;
			box-shadow: 0 0 0 3px rgba(48, 74, 138, .14);
		}
		.pm07p-input:disabled, .pm07p-input[readonly] {
			background-color: #f3f4f7;
			color: #7c828d;
		}
		.pm07p-input.input_calendar { background-position: 96% 50%; cursor: pointer; }

		textarea.pm07p-input {
			height: auto;
			min-height: 100px;
			padding: 10px 12px !important;
			line-height: 1.55;
			resize: vertical;
		}

		.pm07p-field-row { display: flex; gap: 10px; }
		.pm07p-field-row .pm07p-field { flex: 1 1 0; min-width: 0; }

		/* 결재정보 - PC PM0701P01.html의 approvalGrid(TB_WB20M03 결재선)와 동일한 데이터를
		   읽기전용 리스트로 보여준다. */
		.pm07p-approval-row {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 7px 0;
			border-bottom: 1px solid #eef1f6;
		}
		.pm07p-approval-row:last-child { border-bottom: none; }
		.pm07p-approval-sn {
			flex: 0 0 auto;
			width: 20px;
			height: 20px;
			border-radius: 50%;
			background: #eef2fa;
			color: var(--pm07-navy);
			font-size: 10.5px;
			font-weight: 800;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.pm07p-approval-info { flex: 1 1 0; min-width: 0; }
		.pm07p-approval-name { font-size: 12.5px; font-weight: 700; color: var(--pm07-ink); }
		.pm07p-approval-date { font-size: 10.5px; color: var(--pm07-sub); margin-top: 1px; }
		.pm07p-approval-status {
			flex: 0 0 auto;
			font-size: 10.5px;
			font-weight: 700;
			padding: 3px 9px;
			border-radius: 999px;
			background: #f1f2f4;
			color: #6b7280;
			white-space: nowrap;
		}
		.pm07p-approval-status.end { background: #e8f7ee; color: #15803d; }
		.pm07p-approval-status.rtn { background: #fdecec; color: #b91c1c; }

		/* 첨부파일 영역: 기존 treeModule이 그리는 내부 마크업은 그대로 두고 컨테이너만 톤 맞춤 */
		#fileList_area { font-size: 13px; }

		.pm07p-bottom-bar {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			gap: 10px;
			padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
			background: #ffffff;
			border-top: 1px solid var(--pm07-line);
			box-shadow: 0 -2px 10px rgba(16, 24, 40, .08);
			z-index: 60;
		}
		.pm07p-bottom-bar button {
			flex: 1 1 0;
			height: 46px;
			border-radius: 10px;
			font-size: 15px;
			font-weight: 800;
			border: none;
		}
		.pm07p-bottom-bar #actionBtn {
			background: var(--pm07-navy);
			color: #fff;
		}
		.pm07p-bottom-bar #actionBtn:active { background: var(--pm07-navy-dark); }
		.pm07p-bottom-bar .close_btn {
			background: #ffffff;
			border: 1px solid var(--pm07-line) !important;
			color: #3a3f4a;
		}
		.pm07p-bottom-bar .close_btn:active { background: #f3f4f7; }
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit">휴가신청</h4>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="pgmId" name="pgmId" value="PM0701P01_M">

				<div class="pm07p-page">
					<div id="readonlyNotice" class="pm07p-notice" style="display: none;">
						<i class="fas fa-circle-info"></i>
						<span>결재가 진행 중이거나 완료된 신청은 수정할 수 없습니다.</span>
					</div>

					<div class="pm07p-section">
						<div class="pm07p-section-title">신청 정보</div>

						<div class="pm07p-field">
							<label class="pm07p-label hit" for="reqTitl">요청이름</label>
							<input type="text" id="reqTitl" name="reqTitl" required class="pm07p-input" msg="요청이름" placeholder="예: OO월 연차 신청">
						</div>

						<div class="pm07p-field">
							<label class="pm07p-label hit" for="vacTypeCd">휴가유형</label>
							<select id="vacTypeCd" name="vacTypeCd" required class="pm07p-input" data-kind="PM07TYPE" msg="휴가유형" onchange="onVacTypeChanged()">
								<option value="">-- 선택 --</option>
							</select>
						</div>

						<div id="ampmRow" class="toggle-group pm07p-field">
							<label class="pm07p-label" for="ampmCd">오전/오후</label>
							<select id="ampmCd" name="ampmCd" class="pm07p-input" data-kind="PM07AMPM">
								<option value="">-- 선택 --</option>
							</select>
						</div>
					</div>

					<div class="pm07p-section">
						<div class="pm07p-section-title">기간</div>

						<div class="pm07p-field-row">
							<div class="pm07p-field">
								<label class="pm07p-label hit" for="stDt">시작날짜</label>
								<div class="date_input">
									<input type="text" id="stDt" name="stDt" required class="pm07p-input input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="시작날짜" onchange="onStDtChanged()">
								</div>
							</div>
							<div class="pm07p-field">
								<label class="pm07p-label hit" for="edDt">종료날짜</label>
								<div class="date_input">
									<input type="text" id="edDt" name="edDt" required class="pm07p-input input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="종료날짜" onchange="onEdDtChanged()">
								</div>
							</div>
						</div>

						<div id="stTmRow" class="toggle-group pm07p-field" style="display: none;">
							<label class="pm07p-label" for="stTm">시작시각</label>
							<input type="text" id="stTm" name="stTm" class="pm07p-input" placeholder="HHMM">
						</div>

						<div id="edTmRow" class="toggle-group pm07p-field" style="display: none;">
							<label class="pm07p-label" for="edTm">종료시각</label>
							<input type="text" id="edTm" name="edTm" class="pm07p-input" placeholder="HHMM">
						</div>

						<!-- 휴가일수/차감일수는 화면에 별도 노출하지 않지만, 저장 시 서버로 보내야 하는 계산값이라 숨김 필드로 유지 -->
						<input type="hidden" id="vacDays" name="vacDays">
						<input type="hidden" id="deductDays" name="deductDays">
					</div>

					<div class="pm07p-section">
						<label class="pm07p-section-title pm07p-label hit" id="reqRmkTh" for="reqRmk" style="display: block; border-bottom: none; margin-bottom: 10px;">사유</label>
						<textarea rows="4" id="reqRmk" name="reqRmk" required class="pm07p-input" msg="사유" placeholder="휴가 사유를 입력하세요"></textarea>
					</div>

					<div class="pm07p-section" id="approvalSection" style="display: none;">
						<div class="pm07p-section-title">결재정보</div>
						<div id="approvalList"></div>
					</div>

					<div class="pm07p-section">
						<div class="pm07p-section-title">첨부파일</div>
						<div id="fileList_area"></div>
					</div>
				</div>
			</form>
		</div>

		<div class="pm07p-bottom-bar">
			<button type="button" class="close_btn" onclick="goBack()">목록</button>
			<button type="button" id="actionBtn">저장</button>
		</div>
	</div>

	<script type="text/javascript">
		var actionType = null;
		var paramObj = null;
		var isReadonly = false;

		// selectVacationDtl이 이미 TO_CHAR(...,'YYYY-MM-DD')로 변환해서 내려주므로
		// 'YYYY-MM-DD'(10자, 대시 포함)로 들어오면 그대로 쓰고, 혹시 원시 'YYYYMMDD'(8자)로
		// 오는 경우에만 대시를 넣어준다. (PM0701M01_M.html의 toDashDate와 동일한 이유)
		function toDashDate(dateStr) {
			if (!dateStr) return '';
			if (dateStr.length === 10 && dateStr.indexOf('-') > -1) return dateStr;
			if (dateStr.length !== 8) return '';
			return dateStr.substring(0, 4) + '-' + dateStr.substring(4, 6) + '-' + dateStr.substring(6, 8);
		}

		function isHalfDayType(nm) {
			return nm && (nm.indexOf('반차') > -1);
		}

		function isTimeType(nm) {
			var timeTypeNames = ['조퇴', '외출'];
			return nm && (timeTypeNames.indexOf(nm) > -1);
		}

		function isMultiDayType(codeNm) {
			if (!codeNm) return true;
			var nm = $.trim(codeNm);
			if (nm.indexOf("반차") >= 0 || nm.indexOf("조퇴") >= 0 || nm.indexOf("외출") >= 0) {
				return false;
			}
			return nm.indexOf("연차") >= 0
				|| nm.indexOf("교육") >= 0
				|| nm.indexOf("훈련") >= 0
				|| nm.indexOf("경조") >= 0
				|| nm.indexOf("포상") >= 0
				|| nm.indexOf("하계") >= 0
				|| nm.indexOf("대체") >= 0
				|| nm.indexOf("병가") >= 0;
		}

		function isRmkOptional(codeNm) {
			if (!codeNm) return false;
			var nm = $.trim(codeNm);
			return nm.indexOf("연차") >= 0
				|| nm.indexOf("반차") >= 0
				|| nm.indexOf("조퇴") >= 0
				|| nm.indexOf("외출") >= 0
				|| nm.indexOf("하계") >= 0
				|| nm.indexOf("대체") >= 0
				|| nm.indexOf("병가") >= 0;
		}

		function isHolidayDate(dtStr) {
			if (!dtStr || dtStr.length < 10) return false;
			try {
				var parts = dtStr.split('-');
				if (parts.length === 3) {
					var y = parseInt(parts[0], 10);
					var m = parseInt(parts[1], 10) - 1;
					var d = parseInt(parts[2], 10);
					var dt = new Date(y, m, d);
					var day = dt.getDay();
					if (day === 0 || day === 6) return true; // 주말(토/일)

					if (typeof yearHolidayTable === 'function') {
						var yearHolidays = yearHolidayTable(y) || [];
						var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
						for (var i = 0; i < yearHolidays.length; i++) {
							if (yearHolidays[i] === targetStr) {
								return true; // 공휴일
							}
						}
					}
				}
			} catch (e) {
				console.error(e);
			}
			return false;
		}

		function onStDtChanged() {
			var stVal = $("#stDt").val();
			var edVal = $("#edDt").val();
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var selectedNm = selectedOption.text() || '';

			if (!isMultiDayType(selectedNm)) {
				// stVal === edVal 이면 이미 동기화된 상태이므로 다시 쓰지 않는다.
				// datepicker('setDate', ...)가 값이 그대로여도 change를 재발화하면
				// onEdDtChanged ↔ onStDtChanged가 서로를 무한히 호출해 콜스택이 터진다.
				if (stVal && stVal !== edVal) {
					$("#edDt").val(stVal);
					$('#edDt').datepicker('setDate', stVal);
				}
			} else {
				if (stVal && edVal && stVal > edVal) {
					$("#edDt").val(stVal);
					$('#edDt').datepicker('setDate', stVal);
				}
			}
			onDateChanged();
		}

		function onEdDtChanged() {
			var stVal = $("#stDt").val();
			var edVal = $("#edDt").val();
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var selectedNm = selectedOption.text() || '';

			if (!isMultiDayType(selectedNm)) {
				// edVal === stVal 이면 이미 동기화된 상태이므로 다시 쓰지 않는다. (onStDtChanged와 동일한 이유)
				if (edVal && edVal !== stVal) {
					$("#stDt").val(edVal);
					$('#stDt').datepicker('setDate', edVal);
				}
			} else {
				if (stVal && edVal && edVal < stVal) {
					$("#stDt").val(edVal);
					$('#stDt').datepicker('setDate', edVal);
				}
			}
			onDateChanged();
		}

		function getDeductDays(vacTypeCd, vacTypeName, vacDays) {
			if (!vacTypeName) return 0;
			if (isHalfDayType(vacTypeName)) {
				return (vacDays || 0) * 0.5;
			} else if (vacTypeName.indexOf('연차') >= 0) {
				return vacDays || 0;
			} else {
				return 0;
			}
		}

		$(document).ready(function() {
			$("body").css("font-size", "12px");
			$("body").css("zoom", "100%");
			var newScreenWidth = $(window).width();
			$('.popup_area').css('min-width', (newScreenWidth - 15) + 'px');

			paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
			sessionStorage.removeItem('paramObj');

			$("#popForm #coCd").val(jwt.coCd);

			const hasParamValue = (paramObj !== null && paramObj !== undefined);
			if (hasParamValue) {
				actionType = paramObj.actionType;

				if (actionType == "C") {
					$("#actionBtn").text("저장");
					$("#actionBtn").on("click", function() {
						insertVacation();
					});

					$('#stDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});
					$('#edDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});

				} else if (actionType == "U") {
					var reqNo = paramObj.reqNo;
					$("#reqNo").val(reqNo);
					$("#actionBtn").text("저장");
					$("#actionBtn").on("click", function() {
						updateVacation();
					});

					selectVacationDtl(reqNo);
				}

				// 파일첨부 초기화 - 여기서 실패해도 위의 상세 데이터 조회/화면 구성에는 영향이 없도록 분리
				try {
					if (typeof treeModule !== 'undefined') {
						var fileReqNo = (actionType == "U") ? paramObj.reqNo : "";
						var fileParam = {
							fileTrgtTyp : "PM0701P01",
							fileTrgtKey : fileReqNo,
							todoNo      : fileReqNo
						};
						treeModule.initAll('deptTreeOrdars', 'file-grid', 'FILETREE', fileParam, 'fileList_area');
					}
				} catch (e) {
					console.error('파일첨부 영역 초기화 실패:', e);
				}
			} else {
				goBack();
			}

			setCommonSelect($(".popup_area select[data-kind]"));
		});

		function selectVacationDtl(reqNo) {
			var formData = {
				"coCd": jwt.coCd,
				"reqNo": reqNo
			};

			postAjax("/user/pm/pm07/selectVacationDtl", formData, null, function(data) {
				if (data.result) {
					var row = data.result;
					$("#reqTitl").val(row.reqTitl || '');
					$("#vacTypeCd").val(row.vacTypeCd || '');
					$("#ampmCd").val(row.ampmCd || '');
					$("#stDt").val(toDashDate(row.stDt));
					$("#edDt").val(toDashDate(row.edDt));
					$("#stTm").val(row.stTm || '');
					$("#edTm").val(row.edTm || '');
					$("#reqRmk").val(row.reqRmk || '');
					$("#vacDays").val(row.vacDays || '');
					$("#deductDays").val(row.deductDays || '');

					$('#stDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});
					$('#edDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});

					onVacTypeChanged();
					onDateChanged();

					// 결재 진행 건 (REQ/ING/END 등)은 readonly
					var sanctnSts = row.sanctnSts || "";
					var isTemp = (!sanctnSts || sanctnSts === "TEMP" || sanctnSts === "SANCTN01" || sanctnSts === "0");
					if (!isTemp) {
						isReadonly = true;
						$("#popForm").find("input, select, textarea").not("#actionBtn").prop("readonly", true).prop("disabled", true);
						$(".toggle-group select").prop("disabled", true);
						$("#actionBtn").hide();
						$("#readonlyNotice").css("display", "flex");
						// 첨부파일 영역(treeModule이 그리는 업로드/삭제 버튼)도 읽기전용으로 잠근다.
						// treeModule에 별도 readonly 옵션이 없어서, 컨테이너에 pointer-events:none을
						// 걸어 이후에 렌더링되는 내부 버튼까지 포함해 상호작용을 막는다.
						$("#fileList_area").css({ "pointer-events": "none", "opacity": "0.75" });
					}

					loadApprovalLine(reqNo);
				}
			});
		}

		// PC PM0701P01.html의 loadApprovalLine(reqNo)와 동일한 조회(WB20 공통 결재선 API)를
		// 읽기전용 리스트로 렌더링한다. 결재선이 없으면(임시저장 등) 섹션 자체를 숨긴다.
		function loadApprovalLine(reqNo) {
			if (!reqNo) return;

			postAjax("/user/wb/wb20/selectGetApprovalList", { "todoNo": reqNo, "todoDiv2CodeId": "TODODIV2300" }, null, function(data) {
				var rows = data.resultList || [];
				if (rows.length === 0) {
					$("#approvalSection").hide();
					return;
				}

				rows.sort(function(a, b) { return Number(a.sanctnSn || 0) - Number(b.sanctnSn || 0); });

				var html = '';
				$.each(rows, function(idx, r) {
					var statusNm = r.sanctnSttusNm || '';
					var statusCls = 'wait';
					if (statusNm.indexOf('반려') > -1) {
						statusCls = 'rtn';
					} else if (statusNm.indexOf('미승인') === -1 && statusNm.indexOf('승인') > -1) {
						statusCls = 'end';
					}
					var nm = r.todoNm || r.name || '';
					var jik = r.jik ? (' ' + r.jik) : '';
					var cfDt = r.todoCfDt || '';

					html += '<div class="pm07p-approval-row">' +
						'<div class="pm07p-approval-sn">' + (r.sanctnSn || (idx + 1)) + '</div>' +
						'<div class="pm07p-approval-info">' +
							'<div class="pm07p-approval-name">' + nm + jik + '</div>' +
							(cfDt ? ('<div class="pm07p-approval-date">' + cfDt + '</div>') : '') +
						'</div>' +
						'<span class="pm07p-approval-status ' + statusCls + '">' + statusNm + '</span>' +
					'</div>';
				});

				$("#approvalList").html(html);
				$("#approvalSection").css("display", "block");
			});
		}

		function onVacTypeChanged() {
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var vacTypeName = selectedOption.text();
			$("#ampmRow").removeClass("show");

			if (isHalfDayType(vacTypeName)) {
				$("#ampmRow").addClass("show");
			}

			if (isRmkOptional(vacTypeName)) {
				$("#reqRmkTh").removeClass("hit");
				$("#reqRmk").removeAttr("required");
			} else {
				$("#reqRmkTh").addClass("hit");
				$("#reqRmk").attr("required", "required");
			}

			if (!isMultiDayType(vacTypeName)) {
				var stVal = $("#stDt").val();
				var edVal = $("#edDt").val();
				if (stVal && stVal !== edVal) {
					$("#edDt").val(stVal);
					$('#edDt').datepicker('setDate', stVal);
				}
			}

			onDateChanged();
		}

		function onDateChanged() {
			var stDtVal = $("#stDt").val();
			var edDtVal = $("#edDt").val();
			var vacTypeCd = $("#vacTypeCd").val();
			var vacTypeOption = $("#vacTypeCd").find("option:selected");
			var vacTypeName = vacTypeOption.text();

			if (!stDtVal || !edDtVal) {
				$("#vacDays").val('');
				$("#deductDays").val('');
				return;
			}

			if (stDtVal === edDtVal) {
				if (isHolidayDate(stDtVal)) {
					alert("선택하신 휴가신청일자(" + stDtVal + ")는 휴무일(주말/공휴일)입니다.");
				}
			} else {
				if (isHolidayDate(stDtVal)) {
					alert("선택하신 시작일자(" + stDtVal + ")는 휴무일(주말/공휴일)입니다.");
				} else if (isHolidayDate(edDtVal)) {
					alert("선택하신 종료일자(" + edDtVal + ")는 휴무일(주말/공휴일)입니다.");
				}
			}

			// listWorkingDays 사용 (음력/공휴일 포함)
			var dayList = listWorkingDays(stDtVal, edDtVal);
			var vacDays = dayList.length;

			$("#vacDays").val(vacDays || '');

			var deductDays = getDeductDays(vacTypeCd, vacTypeName, vacDays);
			$("#deductDays").val(deductDays || '');
		}

		function insertVacation() {
			if (inputValidation($('.popup_area [required]'))) {
				var stDtVal = $("#stDt").val();
				var edDtVal = $("#edDt").val();
				var vacTypeOption = $("#vacTypeCd").find("option:selected");
				var selectedNm = vacTypeOption.text();
				var workHour = isHalfDayType(selectedNm) ? 4 : 8;
				var dayList = listWorkingDays(stDtVal, edDtVal);
				var vacDtArr = dayList.map(function(d) {
					return { vacDt : d.replace(/\-/g, ''), workHour : workHour };
				});

				var formData = new FormData();
				formData.append("coCd", $("#coCd").val());
				formData.append("reqTitl", $("#reqTitl").val());
				formData.append("vacTypeCd", $("#vacTypeCd").val());
				formData.append("ampmCd", $("#ampmCd").val());
				formData.append("stDt", stDtVal.replace(/-/g, ''));
				formData.append("edDt", edDtVal.replace(/-/g, ''));
				formData.append("stTm", $("#stTm").val());
				formData.append("edTm", $("#edTm").val());
				formData.append("reqRmk", $("#reqRmk").val());
				formData.append("vacDays", parseFloat($("#vacDays").val()) || 0);
				formData.append("deductDays", parseFloat($("#deductDays").val()) || 0);
				formData.append("vacDtArr", JSON.stringify(vacDtArr));
				formData.append("pgmId", $("#pgmId").val());
				// 신청자 정보. 빠지면 REQ_ID / REQ_DEPT_ID / CREAT_ID 가 NULL 로 들어가고,
				// 연차 집계(REQ_ID 기준)와 최종승인 시 일일업무일지 생성(REQ_DEPT_ID 로 업무코드 조회)이 모두 깨진다.
				formData.append("reqId", jwt.userId);
				formData.append("reqDeptId", jwt.deptId);
				formData.append("userId", jwt.userId);
				// 첨부 삭제분. 이걸 안 보내면 화면에서 첨부를 지워도 서버에 그대로 남는다. (PC PM0701P01 동일)
				formData.append("deleteFileArr", JSON.stringify(treeModule.getDeleteFileArr()));

				filePostAjax("/user/pm/pm07/insertVacation", formData, function(data) {
					if (data.resultCode == 200) {
						alert("휴가신청이 저장되었습니다.");
						goBack();
					} else {
						alert(data.resultMessage || "저장 중 오류가 발생했습니다.");
					}
				});
			}
		}

		function goBack() {
