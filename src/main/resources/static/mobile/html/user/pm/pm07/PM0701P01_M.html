<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />
	<link rel="stylesheet" href="/static/css/m_common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
	<script src="/static/js/workingDayCalc.js"></script>
	<script src="/static/js/fileTreeMobile.js"></script>

	<style>
		tr {
			height: 26px;
		}
		#main_area {
			padding: 0px 0px;
			overflow: auto;
		}
		.readonly-field {
			background-color: #f5f5f5;
			cursor: not-allowed;
		}
		.toggle-group {
			display: none;
		}
		.toggle-group.show {
			display: block;
		}
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div class="popup_area">
			<div class="tit_contents">
				<h4 class="tit">휴가신청</h4>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="pgmId" name="pgmId" value="PM0701P01_M">

				<div class="form-group popup_table" style="width: 100%;">
					<table>
						<colgroup>
							<col width="30%">
							<col width="70%">
						</colgroup>

						<tr>
							<th class="hit">요청이름</th>
							<td>
								<input type="text" id="reqTitl" name="reqTitl" required class="form-control" msg="요청이름">
							</td>
						</tr>

						<tr>
							<th class="hit">휴가유형</th>
							<td>
								<select id="vacTypeCd" name="vacTypeCd" required class="form-control" data-kind="PM07TYPE" msg="휴가유형" onchange="onVacTypeChanged()">
									<option value="">-- 선택 --</option>
								</select>
							</td>
						</tr>

						<tr id="ampmRow" class="toggle-group">
							<th>오전/오후</th>
							<td>
								<select id="ampmCd" name="ampmCd" class="form-control" data-kind="PM07AMPM">
									<option value="">-- 선택 --</option>
								</select>
							</td>
						</tr>

						<tr>
							<th class="hit">시작날짜</th>
							<td>
								<div class="date_input">
									<input type="text" id="stDt" name="stDt" required class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="시작날짜" onchange="onDateChanged()">
								</div>
							</td>
						</tr>

						<tr>
							<th class="hit">종료날짜</th>
							<td>
								<div class="date_input">
									<input type="text" id="edDt" name="edDt" required class="input_calendar" autocomplete="off" onkeyup="dateMask(this);" date="date" msg="종료날짜" onchange="onDateChanged()">
								</div>
							</td>
						</tr>

						<tr id="stTmRow" class="toggle-group">
							<th>시작시각</th>
							<td>
								<input type="text" id="stTm" name="stTm" class="form-control" placeholder="HHMM">
							</td>
						</tr>

						<tr id="edTmRow" class="toggle-group">
							<th>종료시각</th>
							<td>
								<input type="text" id="edTm" name="edTm" class="form-control" placeholder="HHMM">
							</td>
						</tr>

						<tr>
							<th class="hit">사유</th>
							<td>
								<textarea rows="4" id="reqRmk" name="reqRmk" required class="form-control" msg="사유"></textarea>
							</td>
						</tr>

						<tr>
							<th>휴가일수</th>
							<td>
								<input type="text" id="vacDays" name="vacDays" class="form-control readonly-field" readonly>
							</td>
						</tr>

						<tr>
							<th>차감일수</th>
							<td>
								<input type="text" id="deductDays" name="deductDays" class="form-control readonly-field" readonly>
							</td>
						</tr>

					</table>
				</div>

				<!-- 첨부파일 영역 -->
				<div style="margin-top: 15px; margin-bottom: 8px;">
					<span style="font-size: 13px; font-weight: bold; color: blue;">첨부파일</span>
				</div>
				<!-- 공통 파일 영역 -->
				<div id="fileList_area"></div>

			</form>
		</div>

		<div class="mobile_mid_btn">
			<button type="button" style="height: 35px; width: 90px;" id="actionBtn">저장</button>
			<button type="button" class="close_btn" style="height: 35px; width: 90px;" onclick="goBack()">목록</button>
		</div>
	</div>

	<script type="text/javascript">
		var actionType = null;
		var paramObj = null;
		var isReadonly = false;

		function isHalfDayType(nm) {
			return nm && (nm.indexOf('반차') > -1);
		}

		function isTimeType(nm) {
			var timeTypeNames = ['조퇴', '외출'];
			return nm && (timeTypeNames.indexOf(nm) > -1);
		}

		function getDeductDays(vacTypeCd, vacTypeName, vacDays) {
			if (!vacTypeName) return 0;
			if (isHalfDayType(vacTypeName)) {
				return (vacDays || 0) * 0.5;
			} else if (vacTypeName === '연차') {
				return vacDays || 0;
			} else {
				return 0;
			}
		}

		$(document).ready(function() {
			$("body").css("font-size", "12px");
			$("body").css("zoom", "100%");
			var newScreenWidth = $(window).width();
			$('.popup_area').css('min-width', (newScreenWidth - 15) + 'px');

			paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
			sessionStorage.removeItem('paramObj');

			$("#popForm #coCd").val(jwt.coCd);

			const hasParamValue = (paramObj !== null && paramObj !== undefined);
			if (hasParamValue) {
				actionType = paramObj.actionType;

					// 파일첨부 초기화
			if (typeof treeModule !== 'undefined') {
				var reqNo = (actionType == "U") ? paramObj.reqNo : "";
				var fileParam = {
					fileTrgtTyp : "PM0701P01",
					fileTrgtKey : reqNo,
					todoNo      : reqNo
				};
				treeModule.initAll('deptTreeOrdars', 'file-grid', 'FILETREE', fileParam, 'fileList_area');
			}
				if (actionType == "C") {
					$("#actionBtn").text("저장");
					$("#actionBtn").on("click", function() {
						insertVacation();
					});

					$('#stDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});
					$('#edDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});

				} else if (actionType == "U") {
					var reqNo = paramObj.reqNo;
					$("#reqNo").val(reqNo);
					$("#actionBtn").text("저장");
					$("#actionBtn").on("click", function() {
						updateVacation();
					});

					selectVacationDtl(reqNo);
				}
			} else {
				goBack();
			}

			setCommonSelect($(".popup_area select[data-kind]"));
		});

		function selectVacationDtl(reqNo) {
			var formData = {
				"coCd": jwt.coCd,
				"reqNo": reqNo
			};

			postAjax("/user/pm/pm07/selectVacationDtl", formData, null, function(data) {
				if (data.result) {
					var row = data.result;
					$("#reqTitl").val(row.reqTitl || '');
					$("#vacTypeCd").val(row.vacTypeCd || '');
					$("#ampmCd").val(row.ampmCd || '');
					$("#stDt").val(row.stDt ? row.stDt.substring(0, 4) + '-' + row.stDt.substring(4, 6) + '-' + row.stDt.substring(6, 8) : '');
					$("#edDt").val(row.edDt ? row.edDt.substring(0, 4) + '-' + row.edDt.substring(4, 6) + '-' + row.edDt.substring(6, 8) : '');
					$("#stTm").val(row.stTm || '');
					$("#edTm").val(row.edTm || '');
					$("#reqRmk").val(row.reqRmk || '');
					$("#vacDays").val(row.vacDays || '');
					$("#deductDays").val(row.deductDays || '');

					$('#stDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});
					$('#edDt').datepicker({
						format: "yyyy-mm-dd",
						language: "ko",
						autoclose: true
					});

					onVacTypeChanged();
					onDateChanged();

					// 결재 진행 건 (REQ/ING/END 등)은 readonly
					var sanctnSts = row.sanctnSts || "";
					var isTemp = (!sanctnSts || sanctnSts === "TEMP" || sanctnSts === "SANCTN01" || sanctnSts === "0");
					if (!isTemp) {
						isReadonly = true;
						$("#popForm").find("input, select, textarea").not("#actionBtn").prop("readonly", true).prop("disabled", true);
						$(".toggle-group select").prop("disabled", true);
						$("#actionBtn").hide();
					}
				}
			});
		}

		function onVacTypeChanged() {
			var selectedOption = $("#vacTypeCd").find("option:selected");
			var vacTypeName = selectedOption.text();
			$("#ampmRow, #stTmRow, #edTmRow").removeClass("show");

			if (isHalfDayType(vacTypeName)) {
				$("#ampmRow, #stTmRow, #edTmRow").addClass("show");
			} else if (isTimeType(vacTypeName)) {
				$("#stTmRow, #edTmRow").addClass("show");
			}

			onDateChanged();
		}

		function onDateChanged() {
			var stDtVal = $("#stDt").val();
			var edDtVal = $("#edDt").val();
			var vacTypeCd = $("#vacTypeCd").val();
			var vacTypeOption = $("#vacTypeCd").find("option:selected");
			var vacTypeName = vacTypeOption.text();

			if (!stDtVal || !edDtVal) {
				$("#vacDays").val('');
				$("#deductDays").val('');
				return;
			}

			// listWorkingDays 사용 (음력/공휴일 포함)
			var dayList = listWorkingDays(stDtVal, edDtVal);
			var vacDays = dayList.length;

			$("#vacDays").val(vacDays || '');

			var deductDays = getDeductDays(vacTypeCd, vacTypeName, vacDays);
			$("#deductDays").val(deductDays || '');
		}

		function insertVacation() {
			if (inputValidation($('.popup_area [required]'))) {
				var stDtVal = $("#stDt").val();
				var edDtVal = $("#edDt").val();
				var vacTypeOption = $("#vacTypeCd").find("option:selected");
				var selectedNm = vacTypeOption.text();
				var workHour = isHalfDayType(selectedNm) ? 4 : 8;
				var dayList = listWorkingDays(stDtVal, edDtVal);
				var vacDtArr = dayList.map(function(d) {
					return { vacDt : d.replace(/\-/g, ''), workHour : workHour };
				});

				var formData = new FormData();
				formData.append("coCd", $("#coCd").val());
				formData.append("reqTitl", $("#reqTitl").val());
				formData.append("vacTypeCd", $("#vacTypeCd").val());
				formData.append("ampmCd", $("#ampmCd").val());
				formData.append("stDt", stDtVal.replace(/-/g, ''));
				formData.append("edDt", edDtVal.replace(/-/g, ''));
				formData.append("stTm", $("#stTm").val());
				formData.append("edTm", $("#edTm").val());
				formData.append("reqRmk", $("#reqRmk").val());
				formData.append("vacDays", parseFloat($("#vacDays").val()) || 0);
				formData.append("deductDays", parseFloat($("#deductDays").val()) || 0);
				formData.append("vacDtArr", JSON.stringify(vacDtArr));
				formData.append("pgmId", $("#pgmId").val());
				// 신청자 정보. 빠지면 REQ_ID / REQ_DEPT_ID / CREAT_ID 가 NULL 로 들어가고,
				// 연차 집계(REQ_ID 기준)와 최종승인 시 일일업무일지 생성(REQ_DEPT_ID 로 업무코드 조회)이 모두 깨진다.
				formData.append("reqId", jwt.userId);
				formData.append("reqDeptId", jwt.deptId);
				formData.append("userId", jwt.userId);
				// 첨부 삭제분. 이걸 안 보내면 화면에서 첨부를 지워도 서버에 그대로 남는다. (PC PM0701P01 동일)
				formData.append("deleteFileArr", JSON.stringify(treeModule.getDeleteFileArr()));

				filePostAjax("/user/pm/pm07/insertVacation", formData, function(data) {
					if (data.resultCode == 200) {
						alert("휴가신청이 저장되었습니다.");
						goBack();
					} else {
						alert(data.resultMessage || "저장 중 오류가 발생했습니다.");
					}
				});
			}
		}

		function updateVacation() {
			if (inputValidation($('.popup_area [required]'))) {
				var stDtVal = $("#stDt").val();
				var edDtVal = $("#edDt").val();
				var vacTypeOption = $("#vacTypeCd").find("option:selected");
				var selectedNm = vacTypeOption.text();
				var workHour = isHalfDayType(selectedNm) ? 4 : 8;
				var dayList = listWorkingDays(stDtVal, edDtVal);
				var vacDtArr = dayList.map(function(d) {
					return { vacDt : d.replace(/\-/g, ''), workHour : workHour };
				});

				var formData = new FormData();
				formData.append("coCd", $("#coCd").val());
				formData.append("reqNo", $("#reqNo").val());
				formData.append("reqTitl", $("#reqTitl").val());
				formData.append("vacTypeCd", $("#vacTypeCd").val());
				formData.append("ampmCd", $("#ampmCd").val());
				formData.append("stDt", stDtVal.replace(/-/g, ''));
				formData.append("edDt", edDtVal.replace(/-/g, ''));
				formData.append("stTm", $("#stTm").val());
				formData.append("edTm", $("#edTm").val());
				formData.append("reqRmk", $("#reqRmk").val());
				formData.append("vacDays", parseFloat($("#vacDays").val()) || 0);
				formData.append("deductDays", parseFloat($("#deductDays").val()) || 0);
				formData.append("vacDtArr", JSON.stringify(vacDtArr));
				formData.append("pgmId", $("#pgmId").val());
				// 신청자 정보. 빠지면 REQ_ID / REQ_DEPT_ID / CREAT_ID 가 NULL 로 들어가고,
				// 연차 집계(REQ_ID 기준)와 최종승인 시 일일업무일지 생성(REQ_DEPT_ID 로 업무코드 조회)이 모두 깨진다.
				formData.append("reqId", jwt.userId);
				formData.append("reqDeptId", jwt.deptId);
				formData.append("userId", jwt.userId);
				// 첨부 삭제분. 이걸 안 보내면 화면에서 첨부를 지워도 서버에 그대로 남는다. (PC PM0701P01 동일)
				formData.append("deleteFileArr", JSON.stringify(treeModule.getDeleteFileArr()));

				filePostAjax("/user/pm/pm07/updateVacation", formData, function(data) {
					if (data.resultCode == 200) {
						alert("휴가신청이 수정되었습니다.");
						goBack();
					} else {
						alert(data.resultMessage || "수정 중 오류가 발생했습니다.");
					}
				});
			}
		}

		function goBack() {
			var nextUrl = '/static/mobile/html/user/pm/pm07/PM0701M01_M.html';
			insertPgmHistory(nextUrl);
			location.href = nextUrl;
		}
	</script>
</body>

</html>
