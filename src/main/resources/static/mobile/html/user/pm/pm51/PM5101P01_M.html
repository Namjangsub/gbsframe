<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/css/gnb.css" />
    <link rel="stylesheet" href="/static/css/main.css" />
    <link rel="stylesheet" href="/static/css/sub.css" />
    <link rel="stylesheet" href="/static/css/m_common.css" />
    <link rel="stylesheet" href="/static/css/mobile.css" />

    <script src="/static/js/jquery-latest.min.js"></script>
    <script src="/static/js/jquery.serializeObject.js"></script>
    <script src="/static/js/moment/moment-with-locales.js"></script>
    <script src="/static/js/global.js"></script>
    <!-- 공통결재 (CR0202P02_M.html과 동일 패턴으로 결재 처리 위젯 재사용) -->
    <script src="/static/js/commApprovalMobile.js"></script>

    <style type="text/css">
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
        }

        .popup_area {
            padding: 0;
            background: white;
            min-height: 100vh;
        }

        .popup_content {
            padding: 0;
        }

        .content_section {
            padding: 15px;
            border-bottom: 8px solid #f0f0f0;
        }

        .section_title {
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #007bff;
        }

        .info_table {
            width: 100%;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .info_table tr {
            border-bottom: 1px solid #e8ebf2;
        }

        .info_table th {
            background-color: #f0f0f0;
            text-align: left;
            padding: 8px;
            font-weight: bold;
            color: #333;
            width: 30%;
        }

        .info_table td {
            padding: 8px;
            text-align: left;
            color: #666;
        }

        .approval_line_group {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 10px;
            background-color: #fafafa;
            margin-bottom: 8px;
        }

        .approval_line_title {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
            padding-bottom: 3px;
            border-bottom: 1px solid #ddd;
        }

        .approval_row {
            display: flex;
            align-items: center;
            padding: 3px 0;
            font-size: 13px;
            border-bottom: 1px solid #e8ebf2;
        }

        .approval_row:last-child {
            border-bottom: none;
        }

        .approval_sn {
            width: 30px;
            text-align: center;
            font-weight: bold;
            color: #007bff;
            margin-right: 5px;
        }

        .approval_name {
            flex: 1;
            color: #333;
        }

        .approval_status {
            width: 50px;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 5px;
            border-radius: 3px;
        }

        .approval_status.pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .approval_status.approved {
            background-color: #d4edda;
            color: #155724;
        }

        .approval_date {
            width: 80px;
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-left: 5px;
        }

        /* M08.html 스타일: 버튼을 붙여서 가로폭 기준 가운데 배치 */
        .action_area {
            padding: 12px 15px;
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        .action_btn {
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1;
            margin: 0 2px;
            transition: all 0.2s;
        }

        /* 공용 결재위젯(commApprovalMobile.js)의 버튼바(.mobile_mid_btn)도 M08.html처럼 중앙 배치 및 가로폭 통일 */
        #approval_area .mobile_mid_btn {
            position: static;
            width: 100%;
            bottom: auto;
            padding: 10px 0;
            margin-top: 10px;
            text-align: center !important;
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 6px !important;
        }

        #approval_area .mobile_mid_btn button {
            height: 36px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 0 16px !important;
            font-size: 13px !important;
            font-weight: bold !important;
            border-radius: 4px !important;
            line-height: 1 !important;
            margin: 0 2px !important;
            width: auto !important;
            min-width: 80px !important;
        }

        .btn_confirm {
            background-color: #28a745;
            color: white;
        }

        .btn_confirm:hover:not(:disabled) {
            background-color: #218838;
        }

        .btn_confirm:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .btn_close {
            background-color: #6c757d;
            color: white;
        }

        .btn_close:hover {
            background-color: #5a6268;
        }

        .no_approval {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 12px;
        }

        .traveler_section {
            margin-top: 10px;
        }

        .traveler_title {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .traveler_info {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        .loading_spinner {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .error_message {
            background-color: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 12px;
        }

        .confirm_opinion {
            font-size: 11px;
            color: #666;
            font-style: italic;
            margin-top: 3px;
        }

        #popupTit {
            flex: 1;
            text-align: center;
        }

        #salesPmSection input[type="checkbox"] {
            width: 15px !important;
            height: 15px !important;
            min-width: 15px !important;
            min-height: 15px !important;
            margin: 0 4px 0 0 !important;
            vertical-align: middle !important;
            cursor: pointer;
            accent-color: #007bff;
        }
        #salesPmSection label {
            display: inline-flex !important;
            align-items: center !important;
            margin-right: 12px;
            font-size: 13px;
            font-weight: normal;
            color: #333;
            cursor: pointer;
        }
        .hidden-fields {
            display: none;
        }
    </style>
</head>
<body>

    <div class="left_btn" onclick="history.back(-1)">

        <img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />

</div>

<div id="main_area">
<div class="popup_area">
    <div class="tit_contents">
        <h4 class="tit" id="popupTit">출장신청서</h4>
    </div>

    <div class="popup_content">

            <i class="fa fa-spinner fa-spin"></i> 로딩 중...

        <!-- 출장신청 기본정보 -->
        <div class="content_section">
            <div class="section_title">출장신청 정보</div>
            <table class="info_table">
                <tr>
                    <th>신청자</th>

                </tr>
                <tr>
                    <th>신청부서</th>
                    <td id="reqDeptNm">-</td>
                </tr>
                <tr>
                    <th>Sales Code</th>
                    <td id="salesCdVal">-</td>
                </tr>
                <tr>
                    <th>영업PM명</th>
                    <td id="pmNmVal">-</td>
                </tr>
                <tr>
                    <th>출장구분</th>
                    <td id="tripDivNm">-</td>
                </tr>
                <tr id="tripNationNmRow" style="display:none;">
                    <th>출장국가명</th>
                    <td id="tripNationNm">-</td>
                </tr>
                <tr>
                    <th>출장기간</th>
                    <td id="tripPeriod">-</td>
                </tr>
                <tr>
                    <th>출장지</th>
                    <td id="tripPlace">-</td>
                </tr>
                <tr>
                    <th>출장목적</th>
                    <td id="tripPurpose">-</td>
                </tr>
                <tr>
                    <th>고객사</th>
                    <td id="clntPjtNm">-</td>
                </tr>
                <tr>
                    <th>출장유형</th>
                    <td id="tripType">-</td>
                </tr>
            </table>

            <!-- 출장자 정보 -->
            <div class="traveler_section">
                <div class="traveler_title">출장자</div>
                <div class="traveler_info" id="travelerInfo">-</div>
            </div>
        </div>

        <!-- 영업PM 확인 및 선택 영역 (영업PM 결재 건일 경우에 표시) -->
        <div class="content_section" id="salesPmSection" style="display:none; background-color: #f4fbf4; border: 1px solid #b8e0b8;">
            <div class="section_title" style="border-bottom-color: #28a745; color: #1a5e1a;">영업PM 확인 및 설정</div>
            
            <div style="margin-bottom: 10px; padding: 8px 10px; background: #fff; border-radius: 4px; border: 1px solid #c3e6cb;">
                <label style="font-weight: bold; color: #155724; margin-right: 0;">
                    <input type="checkbox" id="salesCnfrmYn" name="salesCnfrmYn" value="Y">
                    영업팀 확인 (필수)
                </label>
                <span id="salesCnfrmUserInfo" style="font-size: 11px; color: #666; margin-left: 6px;"></span>
            </div>

            <div style="margin-bottom: 10px;">
                <div style="font-size: 12px; font-weight: bold; color: #333; margin-bottom: 4px;">출장조건</div>
                <div style="font-size: 12px; color: #555; background: #fff; padding: 6px 10px; border-radius: 4px; border: 1px solid #ddd; display: flex; align-items: center; flex-wrap: wrap; gap: 4px;">
                    <label><input type="checkbox" name="tripCondCd" value="TRIPCOND01"> 유상</label>
                    <label><input type="checkbox" name="tripCondCd" value="TRIPCOND02"> 무상</label>
                    <label><input type="checkbox" name="tripCondCd" value="TRIPCOND99" id="chkTripCondEtc" onchange="$('#tripCondEtc').toggle(this.checked);"> 기타</label>
                    <input type="text" id="tripCondEtc" name="tripCondEtc" class="form-control input-sm" placeholder="기타 내용 입력" style="width: 100%; margin-top: 4px; display: none;">
                </div>
            </div>

            <div style="margin-bottom: 10px;">
                <div style="font-size: 12px; font-weight: bold; color: #333; margin-bottom: 4px;">고객사 지원범위</div>
                <div style="font-size: 12px; color: #555; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #ddd; line-height: 1.6;">
                    <!-- 교통비 -->
                    <div style="margin-bottom: 6px; display: flex; align-items: flex-start;">
                        <span style="font-weight: bold; color: #333; min-width: 55px; padding-top: 1px;">교통비:</span>
                        <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 4px;">
                            <label><input type="checkbox" name="sprtTrfcSub" value="비행기"> 비행기</label>
                            <label><input type="checkbox" name="sprtTrfcSub" value="기차"> 기차</label>
                            <label><input type="checkbox" name="sprtTrfcSub" value="렌트비"> 렌트비</label>
                            <label><input type="checkbox" name="sprtTrfcSub" value="유류비"> 유류비</label>
                            <label><input type="checkbox" name="sprtTrfcSub" value="교통비"> 교통비</label>
                        </div>
                    </div>
                    <!-- 숙박비 -->
                    <div style="margin-bottom: 6px; display: flex; align-items: flex-start;">
                        <span style="font-weight: bold; color: #333; min-width: 55px; padding-top: 1px;">숙박비:</span>
                        <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 4px;">
                            <label><input type="checkbox" name="sprtChk" value="숙박비" data-col="sprtLdgYn"> 숙박비</label>
                        </div>
                    </div>
                    <!-- 식비 -->
                    <div style="margin-bottom: 6px; display: flex; align-items: flex-start;">
                        <span style="font-weight: bold; color: #333; min-width: 55px; padding-top: 1px;">식비:</span>
                        <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 4px;">
                            <label><input type="checkbox" name="sprtMealSub" value="아침"> 아침</label>
                            <label><input type="checkbox" name="sprtMealSub" value="점심"> 점심</label>
                            <label><input type="checkbox" name="sprtMealSub" value="저녁"> 저녁</label>
                        </div>
                    </div>
                    <!-- 기타 -->
                    <div style="display: flex; align-items: flex-start;">
                        <span style="font-weight: bold; color: #333; min-width: 55px; padding-top: 1px;">기타:</span>
                        <div style="flex: 1; display: flex; flex-wrap: wrap; gap: 4px;">
                            <label style="font-weight: bold; color: #333;"><input type="checkbox" name="sprtChk" value="ETC" data-col="sprtEtcYn" id="chkSprtEtc" onchange="$('#sprtEtcTxt').toggle(this.checked);"> 기타 지원</label>
                            <input type="text" id="sprtEtcTxt" name="sprtEtcTxt" class="form-control input-sm" placeholder="기타 지원 내용 입력" style="width: 100%; margin-top: 4px; display: none;">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 결재선 현황 -->
        <div class="content_section">
            <div class="section_title">결재 현황</div>
            <div id="approvalLinesArea"></div>
        </div>

        <!-- 결재 처리 (M08에서 선택한 해당 건에 대한 승인/보완요청 - 공용 결재위젯, CR0202P02_M.html과 동일 패턴) -->
        <div class="content_section" id="approvalActionSection" style="display:none;">
            <div class="section_title">결재 처리</div>
            <div id="approval_area"></div>
        </div>
    </div>

    <!-- 액션 영역 -->
    <div class="action_area" id="actionArea">
        <button class="action_btn btn_confirm" id="salesConfirmBtn" onclick="handleSalesConfirm();" disabled style="display:none;">
            영업확인
        </button>
        <button class="action_btn btn_close" onclick="window.history.back();">닫기</button>

<script type="text/javascript">
    // ==================== 전역 변수 ====================
    var paramObj = null;
    var tripReqData = null;
    var approvalLineReq = [];
    var approvalLineMng = [];
    var tripTypeCdMap = {};
    var tripDivCdMap = {};
    var kakaoErr = [];
    var kakaoCnt = 0;
    var commApproval = null; // commApprovalMobile.js의 전역 approvalConfirm()/approvalMemoComment()가 참조하는 이름이므로 반드시 이 스코프에 선언한다.

    // ==================== 초기화 ====================
    $(document).ready(function() {
        initPage();
    });

    function initPage() {
        paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
        if (!paramObj || !paramObj.fileTrgtKey) {
            showError('유효한 파라미터가 없습니다.');
            return;
        }

        showLoading(true);
        loadTripReqData();
        initApprovalWidget();
    }

    function showLoading(show) {
        if (show) {
            $('#loading').show();
        } else {
            $('#loading').hide();
        }
    }

    function showError(msg) {
        $('#errorMsg').text(msg).show();
    }

    // ==================== 데이터 로드 ====================
    function loadTripReqData() {
        var formData = {
            tripReqNo: paramObj.fileTrgtKey,
            userId: jwt.userId
        };

        postAjax("/user/pm/pm51/selectTripReqDtl", formData, null, function(data) {
            if (data.result) {
                var master = data.result.m01 || {};
                var travelerList = data.result.d01 || [];
                tripReqData = data.result;
                $('#tripReqNo').val(master.tripReqNo || paramObj.fileTrgtKey);
                $('#pmId').val(master.pmId || '');
                $('#pgmId').val(master.pgmId || paramObj.pgmId || 'PM5101P01');
                $('#payDt').val(master.payDt || '');

                // 코드명(tripTypeCds 변환용)을 먼저 채운 뒤에 렌더링해야 코드값이 아닌 코드명이 표시된다.
                loadComboCodeList(master, travelerList);
            } else {
                showError('출장신청 정보를 조회할 수 없습니다.');
                showLoading(false);
            }
        });
    }

    function loadComboCodeList(master, travelerList) {
        var paramCodeList = {
            "codeKindList": "PM51TYPE,PM51DIV"
        };

        postAjax("/admin/cm/cm05/selectComboCodeList", paramCodeList, null, function(data) {
            if (data.resultList) {
                data.resultList.forEach(function(item) {
                    if (item.codeKind === 'PM51TYPE') {
                        tripTypeCdMap[item.codeId] = item.codeNm || item.codeId;
                    } else if (item.codeKind === 'PM51DIV') {
                        tripDivCdMap[item.codeId] = item.codeNm || item.codeId;
                    }
                });
            }
            renderTripReqInfo(master, travelerList);
            loadApprovalLines();
        });
    }

    function loadApprovalLines() {
        var param = {
            todoNo: paramObj.fileTrgtKey,
            todoDiv2CodeIds: 'TODODIV2190,TODODIV1190'
        };

        postAjax("/user/wb/wb20/selectGetApprovalList", param, null, function(data) {
            var rawList = data.resultList || [];
            approvalLineReq = mapApprovalData(rawList);

            var paramMng = {
                todoNo: paramObj.fileTrgtKey,
                todoDiv2CodeIds: 'TODODIV2191,TODODIV1191'
            };
            postAjax("/user/wb/wb20/selectGetApprovalList", paramMng, null, function(dataMng) {
                var rawListMng = dataMng.resultList || [];
                approvalLineMng = mapApprovalData(rawListMng);
                renderApprovalLines();
                updateSalesConfirmButton();
                showLoading(false);
            });
        });
    }

    function mapApprovalData(rawList) {
        return rawList.map(function(item) {
            return {
                gb: item.todoDiv2CodeId === 'TODODIV1190' || item.todoDiv2CodeId === 'TODODIV1191' ? '공유' : '결재',
                usrNm: item.todoId,
                name: item.todoNm,
                jik: item.jik || '',
                dtNm: item.dtNm || '',
                telNo: item.telNo || '',
                offTelNo: item.offTelNo || '',
                email: item.email || '',
                todoId: item.todoId,
                todoKey: item.todoKey,
                todoDiv1CodeId: item.todoDiv1CodeId || 'TODODIV20',
                todoDiv2CodeId: item.todoDiv2CodeId,
                todoDiv2CodeNm: item.todoDiv2CodeNm || '',
                sanctnSn: item.sanctnSn,
                sanctnSttus: item.sanctnSttus,
                reqDate: item.reqDate || '',
                todoCfDt: item.todoCfDt || '',
                etcField1: item.etcField1 || '',
                todoCfOpn: item.todoCfOpn || '',
                coCd: item.coCd || jwt.coCd
            };
        });
    }

    // ==================== 화면 렌더링 ====================
    function renderTripReqInfo(master, travelerList) {
        $('#reqName').text(master.userNm || master.userId || '-');
        $('#reqDeptNm').text(master.userDeptNm || master.reqDeptNm || '-');
        $('#salesCdVal').text(master.salesCd || '-');
        $('#pmNmVal').text(master.pmNm || '-');

        // 출장구분 코드명 변환
        var divName = master.tripDivNm || tripDivCdMap[master.tripDiv] || master.tripDiv || '-';
        $('#tripDivNm').text(divName);

        // 해외 출장(TRIPDIV02)인 경우 출장국가명 노출
        if (master.tripDiv === 'TRIPDIV02' || master.tripNationNm) {
            $('#tripNationNm').text(master.tripNationNm || '-');
            $('#tripNationNmRow').show();
        } else {
            $('#tripNationNmRow').hide();
        }

        var tripStDt = master.tripStDt || (master.tripStDtm ? formatToDate(master.tripStDtm) : '');
        var tripEdDt = master.tripEdDt || (master.tripEdDtm ? formatToDate(master.tripEdDtm) : '');
        var tripPeriod = (tripStDt || '') + '~' + (tripEdDt || '');
        $('#tripPeriod').text(tripPeriod);

        $('#tripPlace').text(master.tripPlace || '-');
        $('#tripPurpose').text(master.tripPurpose || '-');
        $('#clntPjtNm').text(master.clntPjtNm || '-');

        // tripTypeCds 코드명으로 표시
        var tripTypeStr = '-';
        if (master.tripTypeCds) {
            var tripTypeCode = master.tripTypeCds.split(',')[0];
            tripTypeStr = tripTypeCdMap[tripTypeCode] || tripTypeCode;
        }
        $('#tripType').text(tripTypeStr);

        // 영업확인 정보 복원 (master)
        if (master.salesCnfrmYn === 'Y') {
            $('#salesCnfrmYn').prop('checked', true);
            var infoText = (master.salesCnfrmNm || '') + (master.salesCnfrmDt ? ' (' + formatToDate(master.salesCnfrmDt) + ')' : '');
            $('#salesCnfrmUserInfo').text(infoText);

            $('#salesCnfrmYn').prop('checked', false);
            $('#salesCnfrmUserInfo').text('');
        }

        // 출장조건 복원
        $('input[name="tripCondCd"]').prop('checked', false);
        if (master.tripCondCd) {
            $('input[name="tripCondCd"][value="' + master.tripCondCd + '"]').prop('checked', true);
            if (master.tripCondCd === 'TRIPCOND99') {
                $('#tripCondEtc').val(master.etc || '').show();
            }
        }

        // 고객사 지원범위 복원
        $('input[name="sprtTrfcSub"]').prop('checked', false);
        if (master.sprtTrfcTxt) {
            var trfcs = master.sprtTrfcTxt.split(',');
            trfcs.forEach(function(val) {
                $('input[name="sprtTrfcSub"][value="' + val.trim() + '"]').prop('checked', true);
            });
        }

        $('input[name="sprtChk"][value="숙박비"]').prop('checked', master.sprtLdgYn === 'Y');

        $('input[name="sprtMealSub"]').prop('checked', false);
        if (master.sprtMealTxt) {
            var meals = master.sprtMealTxt.split(',');
            meals.forEach(function(val) {
                $('input[name="sprtMealSub"][value="' + val.trim() + '"]').prop('checked', true);
            });
        }

        if (master.sprtEtcYn === 'Y' || master.sprtEtcTxt) {
            $('input[name="sprtChk"][value="ETC"]').prop('checked', true);
            $('#sprtEtcTxt').val(master.sprtEtcTxt || '').show();
        } else {
            $('input[name="sprtChk"][value="ETC"]').prop('checked', false);
            $('#sprtEtcTxt').val('').hide();
        }

        // 출장자 목록 및 각 출장자별 비고(rmk) 내용 상세 표기
        var travelerHtml = '-';
        if (travelerList && travelerList.length > 0) {
            travelerHtml = travelerList.map(function(t) {
                var nameStr = t.userNm || t.userId || '';
                var rmkStr = t.rmk ? ' (비고: ' + t.rmk + ')' : '';
                return nameStr + rmkStr;
            }).join('<br>');
        }
        $('#travelerInfo').html(travelerHtml);

        var titleStr = (master.tripPlace || '') + (master.clntPjtNm ? ', ' + master.clntPjtNm : '');
        if (titleStr) {
            $('#popupTit').text('출장신청 - ' + titleStr);
        }

    function formatToDate(dtm) {
        if (!dtm || dtm.length < 8) return '';
        return dtm.substring(0, 4) + '-' + dtm.substring(4, 6) + '-' + dtm.substring(6, 8);
    }

    function renderApprovalLines() {
        var html = '';

        var reqApprovals = approvalLineReq.filter(function(r) { return r.todoDiv2CodeId === 'TODODIV2190'; });
        var reqShares = approvalLineReq.filter(function(r) { return r.todoDiv2CodeId === 'TODODIV1190'; });

        if (reqApprovals.length > 0) {
            html += renderApprovalGroup('신청부서 결재', reqApprovals);
        }
        if (reqShares.length > 0) {
            html += renderApprovalGroup('신청부서 공유', reqShares);
        }

        var mngApprovals = approvalLineMng.filter(function(r) { return r.todoDiv2CodeId === 'TODODIV2191'; });
        var mngShares = approvalLineMng.filter(function(r) { return r.todoDiv2CodeId === 'TODODIV1191'; });

        if (mngApprovals.length > 0) {
            html += renderApprovalGroup('관리부서 결재', mngApprovals);
        }
        if (mngShares.length > 0) {
            html += renderApprovalGroup('관리부서 공유', mngShares);
        }

        if (html === '') {
            html = '<div class="no_approval">결재선 정보가 없습니다.</div>';
        }

        $('#approvalLinesArea').html(html);
    }

    function renderApprovalGroup(title, approvals) {
        var html = '<div class="approval_line_group">';
        html += '<div class="approval_line_title">' + title + '</div>';

        approvals.sort(function(a, b) {
            var aSn = Number(a.sanctnSn) || 9999;
            var bSn = Number(b.sanctnSn) || 9999;
            return aSn - bSn;
        });

        approvals.forEach(function(row) {
            // 서버(selectGetApprovalList)는 미결 결재자의 todoCfDt를 빈 문자열이 아니라 공백 한 칸(' ')으로 내려주므로 반드시 trim 후 진위 판정한다.
            var todoCfDtTrim = $.trim(row.todoCfDt || '');
            var isDone = todoCfDtTrim || row.sanctnSttus === 'Y';
            var statusClass = isDone ? 'approved' : 'pending';
            var statusText = isDone ? '완료' : '대기';

            html += '<div class="approval_row">';
            if (row.sanctnSn) {
                html += '<div class="approval_sn">' + row.sanctnSn + '</div>';
            }
            html += '<div class="approval_name">' + (row.name || row.usrNm || '-') + '</div>';
            html += '<div class="approval_status ' + statusClass + '">' + statusText + '</div>';
            if (todoCfDtTrim) {
                html += '<div class="approval_date">' + todoCfDtTrim + '</div>';
            }
            html += '</div>';
            if (row.todoCfOpn) {
                html += '<div class="confirm_opinion">의견: ' + row.todoCfOpn + '</div>';
            }
        });

        html += '</div>';
        return html;
    }

    // ==================== 영업PM 확인 처리 ====================
    function updateSalesConfirmButton() {
        var $btn = $('#salesConfirmBtn');

        if (!isSalesPmUser()) {
            $('#salesPmSection').hide();
            $btn.hide();
            return;
        }

        // 영업PM 사용자인 경우 영업PM 확인 및 설정 섹션을 노출
        $('#salesPmSection').show();

        if (isSalesPmApprovalPending()) {
            // 영업확인(영업PM 결재) 대기 상태인 경우 상단의 일반 결재 처리 영역(#approvalActionSection)을 무조건 숨긴다.
            $('#approvalActionSection').hide();
            $btn.show().prop('disabled', false);
        } else {
            $btn.show().prop('disabled', true);
            // 이미 승인 처리 완료되었거나 대기 중이 아니면 입력폼 비활성화
            $('#salesPmSection input').prop('disabled', true);
        }

    function isSalesPmUser() {
        var pmId = $('#pmId').val() || '';
        return !!pmId && pmId === jwt.userId;
    }

    function isSalesPmApprovalPending() {
        if (!isSalesPmUser()) return false;

        // 지급완료 상태면 불가
        if ($('#payDt').val()) {
            return false;
        }

        var allApprovals = approvalLineReq.concat(approvalLineMng);
        var pending = false;
        $.each(allApprovals, function(idx, elem) {
            var userId = elem.usrNm || '';
            if (userId === jwt.userId && elem.gb === '결재') {
                pending = !($.trim(elem.todoCfDt || '') || elem.sanctnSttus === 'Y');
                return false;
            }
        });
        return pending;
    }

        if (!$('#salesCnfrmYn').is(':checked')) {

            return false;
        }
        if (!$('input[name="tripCondCd"]:checked').val()) {
            alert("출장조건을 선택해주세요.");

            return false;
        }
        if ($('input[name="tripCondCd"]:checked').val() === 'TRIPCOND99' && !$.trim($('#tripCondEtc').val() || '')) {
            alert("출장조건 기타 내용을 입력해주세요.");
            $('#tripCondEtc').focus();

        }

            $('#sprtEtcTxt').focus();

    function handleSalesConfirm() {
        // 필수 검증 (PC버전 PM5101P01.html validateSalesRequired와 동일)
        if (!validateSalesRequiredMobile()) {
            return;
        }

        if (!confirm('영업확인 자료를 저장하고 결재를 승인 처리 하시겠습니까?')) {
            return;
        }

        // 사전조건 검증
        if ($('#payDt').val()) {
            alert('지급완료 상태는 수정할 수 없습니다.');
            return;
        }

        showLoading(true);

        // 선택값 수집
        var tripCondCdVal = $('input[name="tripCondCd"]:checked').val() || '';
        var etcVal = (tripCondCdVal === 'TRIPCOND99') ? $('#tripCondEtc').val() : '';

        var trfcSubVals = [];
        $('input[name="sprtTrfcSub"]:checked').each(function() {
            trfcSubVals.push($(this).val());
        });

        var mealSubVals = [];
        $('input[name="sprtMealSub"]:checked').each(function() {
            mealSubVals.push($(this).val());
        });

        var sprtLdgYnVal = $('input[name="sprtChk"][value="숙박비"]').is(':checked') ? 'Y' : 'N';
        var sprtEtcYnVal = $('input[name="sprtChk"][value="ETC"]').is(':checked') ? 'Y' : 'N';
        var sprtEtcTxtVal = sprtEtcYnVal === 'Y' ? $('#sprtEtcTxt').val() : '';

        var param = {
            tripReqNo: $('#tripReqNo').val(),
            salesCnfrmYn: 'Y',
            salesCnfrmDt: moment().format('YYYYMMDD'),
            tripCondCd: tripCondCdVal,
            etc: etcVal,
            sprtTrfcYn: trfcSubVals.length > 0 ? 'Y' : 'N',
            sprtTrfcTxt: trfcSubVals.join(','),
            sprtLdgYn: sprtLdgYnVal,
            sprtMealYn: mealSubVals.length > 0 ? 'Y' : 'N',
            sprtMealTxt: mealSubVals.join(','),
            sprtEtcYn: sprtEtcYnVal,
            sprtEtcTxt: sprtEtcTxtVal,
            userId: jwt.userId,
            pgmId: $('#pgmId').val() || 'PM5101P01'
        };

        // 백엔드 pm51Svc.updateTripReqSalesInfo 내부에서 영업확인 저장 + 영업PM 본인 결재 승인(insertApprovalLine)까지 원스톱으로 처리함
        postAjax("/user/pm/pm51/updateTripReqSalesInfo", param, null, function (data) {
            showLoading(false);
            if (data.resultCode === 200) {
                // 본인 행 로컬 갱신
                markSelfApprovedRowLocally();

                // 결재 승인 후 다음 차례 결재자에게 알림톡 발송
                kakaoTodo($('#tripReqNo').val());

                // 상단 결재/공유 건수 강제 최신화 (Storage 이벤트 전파)
                if (typeof myTodoStatusRtv === 'function') {
                    myTodoStatusRtv(true);
                }

                alert(data.resultMessage || '영업확인 자료 저장 및 결재 승인 처리가 완료되었습니다.');

                // 부모 창 목록 재조회 함수 호출 (존재 시)
                if (window.opener && typeof window.opener.gridView !== 'undefined' && typeof window.opener.gridView.setData === 'function') {
                    window.opener.gridView.setData(0);
                } else if (parent && parent.gridView && typeof parent.gridView.setData === 'function') {
                    parent.gridView.setData(0);
                }

                // 팝업 창 닫기 또는 모바일 뷰 이탈 처리
                if (typeof modalStack !== 'undefined' && modalStack.last()) {
                    modalStack.close();
                } else if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.close();
                }
            } else {
                showError('영업확인 처리 중 오류가 발생했습니다: ' + (data.resultMessage || ''));
            }
        });
    }

    // 본인 행만 로컬 갱신 (순번 상관없이)
    function markSelfApprovedRowLocally() {
        var allRows = approvalLineReq.concat(approvalLineMng);
        $.each(allRows, function(idx, row) {
            if (row.gb === '결재' && String(row.usrNm || '') === String(jwt.userId)) {

    // ==================== 카카오 알림톡 발송 로직 ====================
    function kakaoTodo(docNo) {
        if (!docNo) return;

        if (kakaoErr.length == 0) {
            var msgParam = {
                "userId": jwt.userId,
                "codeKind": "KAKAOMSG"
            };
            postAjaxSync("/user/sm/sm02/selectCurrToday", msgParam, null, function (data) {
                if (data.resultList && data.resultList.length > 0) {
                    kakaoErr = data.resultList;
                }
            });
        }

        var clntNm = (jwt.coCd == "GUN") ? "(주)건양ITT" : "트루넷";

        var teleNo = "";
        var telParam = {
            "coCd": jwt.coCd,
            "userId": jwt.userId
        };
        postAjaxSync("/user/wb/wb24/selectMemberTelNo", telParam, null, function (data) {
            if (data.result && data.result[0] && data.result[0].telNo) {
                teleNo = data.result[0].telNo;
            } else {
                teleNo = "051-312-2400";
            }
        });

        var reqActiveSn = getFirstPendingApprovalSn(approvalLineReq);
        if (reqActiveSn) {
            kakaoSendBody(docNo, 'TODODIV20', 'TODODIV2190', '결재', clntNm, teleNo, reqActiveSn);
        }
        kakaoSendBody(docNo, 'TODODIV10', 'TODODIV1190', '공유', clntNm, teleNo);

        if (isApprovalFullyCompleted(approvalLineReq)) {
            var mngActiveSn = getFirstPendingApprovalSn(approvalLineMng);
            if (mngActiveSn) {
                kakaoSendBody(docNo, 'TODODIV20', 'TODODIV2191', '결재', clntNm, teleNo, mngActiveSn);
            }
            kakaoSendBody(docNo, 'TODODIV10', 'TODODIV1191', '공유', clntNm, teleNo);
        }

        if (kakaoCnt > 0) {
            kakaoCnt = 0;
        }
    }

    function getFirstPendingApprovalSn(approvals) {
        if (!approvals || approvals.length === 0) return null;

        var minPendingSn = null;
        $.each(approvals, function(idx, row) {
            if (row.gb !== '결재') return true;
            var isDone = $.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y';
            if (!isDone) {
                var sn = Number(row.sanctnSn);
                if (!isNaN(sn) && (minPendingSn === null || sn < minPendingSn)) {
                    minPendingSn = sn;
                }
            }
        });
        return minPendingSn;
    }

    function isApprovalFullyCompleted(approvals) {
        if (!approvals || approvals.length === 0) return false;

        var resultRows = approvals.filter(function(r) { return r.gb === '결재'; });
        if (resultRows.length === 0) return false;

        var allDone = true;
        $.each(resultRows, function(idx, row) {
            var isDone = $.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y';
            if (!isDone) {
                allDone = false;
                return false;
            }
        });
        return allDone;
    }

    function buildTripReqGanttStyleTitle() {
        if (!tripReqData || !tripReqData.m01) return '';

        var data = tripReqData.m01;
        var titleTripPlace = data.tripPlace || '';
        var titleClntPjtNm = data.clntPjtNm || '';
        var titleTripTypeCode = data.tripTypeCds ? data.tripTypeCds.split(',')[0] : '';
        var titleTripTypeNm = tripTypeCdMap[titleTripTypeCode] || titleTripTypeCode;

        return titleTripPlace + (titleClntPjtNm ? '_' + titleClntPjtNm : '') + (titleTripTypeNm ? '(' + titleTripTypeNm + ')' : '') + ' 출장신청';
    }

    function kakaoSendBody(docNo, todoDiv1CodeId, todoDiv2CodeId, sanctnDiv2, clntNm, teleNo, sanctnSn) {
        var param = {
            "tmplatDiv": "TMPLATDIV02",
            "coCd": jwt.coCd,
            "todoDiv1CodeId": todoDiv1CodeId,
            "todoDiv2CodeId": todoDiv2CodeId,
            "todoDiv1CodeNm": sanctnDiv2,
            "title": buildTripReqGanttStyleTitle(),
            "sanctnDiv2": sanctnDiv2,
            "todoNo": docNo,
            "clntCd": "1",
            "clntNm": clntNm,
            "ordrgMngNm": jwt.userNm,
            "ordrgMngTelNo": teleNo,
            "creatPgm": "PM5101P01",
            "chkSentYn": "Y",
            "customMessage": buildTripReqKakaoMessage(sanctnDiv2, clntNm, teleNo)
        };
        if (sanctnSn) {
            param.sanctnSn = sanctnSn;
        }
        commKaKaoSendTodo(param);
    }

    function buildTripReqKakaoMessage(sanctnDiv2, clntNm, teleNo) {
        if (!tripReqData || !tripReqData.m01) return '';

        var master = tripReqData.m01;
        var travelerList = tripReqData.d01 || [];

        var tripPlace = master.tripPlace || '';
        var equipNm = master.equipNm || '';
        var tripTypeCode = master.tripTypeCds ? master.tripTypeCds.split(',')[0] : '';
        var tripTypeNm = tripTypeCdMap[tripTypeCode] || tripTypeCode;

        var names = [];
        var stDt = '';
        var edDt = '';
        travelerList.forEach(function(row) {
            if (row.userNm) names.push(row.userNm);
            var rowStDt = row.tripStDt || (row.tripStDtm ? formatToDate(row.tripStDtm) : '');
            var rowEdDt = row.tripEdDt || (row.tripEdDtm ? formatToDate(row.tripEdDtm) : '');
            if (rowStDt && (!stDt || rowStDt < stDt)) stDt = rowStDt;
            if (rowEdDt && (!edDt || rowEdDt > edDt)) edDt = rowEdDt;
        });

        var travelerTxt = names.length === 0 ? '' : (names.length === 1 ? names[0] : names[0] + '외 ' + (names.length - 1) + '명');
        var period = (stDt && edDt) ? stDt + '~' + edDt : '';

        var info = tripPlace + ', ' + equipNm + ', ' + tripTypeNm;
        var msg = '내용 : [출장신청서, ' + info + '] ' + sanctnDiv2 + ' 요청 건';
        msg += '\n업무 : ' + info + ', ' + period + ' ' + travelerTxt;
        var purpose = master.tripPurpose || '';
        if (purpose) {
            msg += '\n' + purpose;
        }
        msg += '\n\n요청일시 : #{sendDt}';
        msg += '\n요청자 : ' + jwt.userNm;
        msg += '\n\n' + sanctnDiv2 + ' 확인 바랍니다.';
        msg += '\n\n' + clntNm + '/' + teleNo;
        return msg;
    }

    function commKaKaoSendTodo(param) {
        var maxMessageId = null;
        var talkMessage = null;
        var mobile = null;
        var todoDiv2CodeNm = null;
        var sendList = [];
        var talkParam = {};
        var talkBody = {};
        var sendCnt = 0;

        postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function (data) {
            if (data.resultList && data.resultList.length > 0) {
                if (data.resultList[0].maxMessageId != "") {
                    sendList = data.resultList;
                } else {
                    alert("알림톡 발송을 위한 messageId 생성에 실패했습니다.");
                    return;
                }
            }
        });

        $.each(sendList, function (key, sendObj) {
            maxMessageId = sendObj.maxMessageId;
            talkMessage = sendObj.messageDesc;
            mobile = sendObj.telNo;
            param.rcvId = sendObj.todoId;
            param.rcvNm = sendObj.name;
            param.nameTo = sendObj.name;
            todoDiv2CodeNm = sendObj.todoTitl;
            param.todoDiv2CodeNm = todoDiv2CodeNm;
            param.sendDt = sendObj.sendDt;

            if (mobile == "" || mobile == null) {
                alert('수신전화번호가 없습니다.\r\n[' + sendObj.name + '] 사용자의 전화번호를 확인해 주십시오.');
                return;
