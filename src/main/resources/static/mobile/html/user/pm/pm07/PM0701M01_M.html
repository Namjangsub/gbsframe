<!DOCTYPE html>
<html lang="ko">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">
	<link rel="stylesheet" href="/static/bootstrap/css/dashboard.css">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-datepicker.css">
	<link rel="stylesheet" href="/static/fontawesome/css/all.css">
	<link rel="stylesheet" href="/static/css/ax5/ax5grid.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5mask.css" />
	<link rel="stylesheet" href="/static/css/ax5/ax5modal.css" />
	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />
	<link rel="stylesheet" href="/static/css/common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />

	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.min.js"></script>
	<script src="/static/bootstrap/js/bootstrap-datepicker.ko.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/ax5/ax5core.min.js"></script>
	<script src="/static/js/ax5/ax5grid.min.js"></script>
	<script src="/static/js/ax5/ax5mask.min.js"></script>
	<script src="/static/js/ax5/ax5modal.min.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
	<script src="/static/js/korean-lunar-calendar.min.js"></script>
	<script src="/static/js/workingDayCalc.js"></script>

	<style>
		/* ── PM0701M01_M 전용 : 휴가신청 목록 (스마트폰 세로보기 최적화) ──
		   브랜드 톤(.tit_contents 등 기존 팝업/타이틀바에 이미 쓰이는 #304a8a 네이비)에
		   맞춰 필터 영역과 카드 리스트를 다시 짰다. */
		:root {
			--pm07-navy: #304a8a;
			--pm07-navy-dark: #253a6e;
			--pm07-bg: #dfe4ec;
			--pm07-ink: #22262f;
			--pm07-sub: #6b7280;
			--pm07-line: #e6e9f0;
		}

		html, body { background: var(--pm07-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm07-page {
			width: 100%;
			max-width: 480px;
			margin: 0 auto;
			padding: 12px 12px 28px;
			box-sizing: border-box;
		}

		/* ─ 필터 영역 ─ */
		.pm07-filter {
			background: #ffffff;
			border: 1px solid var(--pm07-line);
			border-radius: 12px;
			padding: 14px;
			margin-bottom: 14px;
			box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
		}

		.pm07-filter-label {
			font-size: 11px;
			font-weight: 700;
			color: var(--pm07-sub);
			letter-spacing: .02em;
			margin-bottom: 6px;
		}

		.pm07-date-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 10px;
		}

		.pm07-date-row .date_input { flex: 1 1 0; min-width: 0; }

		.pm07-date-row input.input_calendar {
			width: 100% !important;
			height: 38px;
			border: 1px solid var(--pm07-line);
			border-radius: 8px;
			font-size: 13px;
			padding: 0 10px;
			box-sizing: border-box;
			background-color: #fff;
			background-position: 95% 50%;
		}

		.pm07-tilde {
			color: var(--pm07-sub);
			font-size: 12px;
			flex: 0 0 auto;
		}

		.pm07-filter-row2 {
			display: flex;
			gap: 8px;
		}

		.pm07-status-select {
			flex: 1 1 auto;
			min-width: 0 !important; /* mobile.css의 전역 select{min-width:100%} 규칙을 눌러줘야 옆 버튼이 화면 밖으로 밀리지 않는다 */
			height: 38px !important;
			border: 1px solid var(--pm07-line) !important;
			border-radius: 8px !important;
			font-size: 13px !important;
			padding: 0 8px !important;
		}

		.pm07-btn-new {
			flex: 0 0 auto;
			height: 38px;
			padding: 0 16px;
			border: none;
			border-radius: 8px;
			background: var(--pm07-navy);
			color: #fff;
			font-size: 13px;
			font-weight: 700;
			white-space: nowrap;
			display: inline-flex;
			align-items: center;
			gap: 6px;
		}
		.pm07-btn-new:active { background: var(--pm07-navy-dark); }
		.pm07-btn-new i { font-size: 12px; }

		/* ─ 카드 리스트 ─ */
		.pm07-card-list {
			display: flex;
			flex-direction: column;
			gap: 14px;
		}

		/* 카드 사이 경계를 뚜렷하게: 흰 배경 + 진한 테두리 + 상태색 왼쪽 스트라이프로
		   옅은 배경(--pm07-bg)과의 대비, 카드 간 구분, 상태 스캔 가능성을 한번에 해결 */
		.pm07-card {
			background: #ffffff;
			border: 1px solid #c3cad8;
			border-left: 5px solid #aab2c2;
			border-radius: 10px;
			padding: 15px 16px 13px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, 0.09);
			cursor: pointer;
			transition: box-shadow .12s ease, transform .12s ease;
		}
		.pm07-card:active {
			box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
			transform: scale(0.995);
		}
		.pm07-card.temp { border-left-color: #6b7280; }
		.pm07-card.req  { border-left-color: #d97706; }
		.pm07-card.ing  { border-left-color: var(--pm07-navy); }
		.pm07-card.end  { border-left-color: #16a34a; }
		.pm07-card.rtn  { border-left-color: #dc2626; }

		.pm07-card-head {
			display: flex;
			align-items: flex-start;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 4px;
		}

		.pm07-card-title {
			font-size: 16px;
			font-weight: 800;
			color: #14161c;
			line-height: 1.35;
			word-break: keep-all;
			letter-spacing: -.01em;
		}

		.pm07-badge {
			flex: 0 0 auto;
			display: inline-flex;
			align-items: center;
			gap: 5px;
			padding: 3px 9px 3px 7px;
			border-radius: 999px;
			font-size: 11px;
			font-weight: 700;
			white-space: nowrap;
			background: #f3f4f6;
			color: var(--pm07-sub);
		}
		.pm07-badge .dot {
			width: 6px;
			height: 6px;
			border-radius: 50%;
			background: currentColor;
		}
		.pm07-badge.temp { background: #f1f2f4; color: #5b6472; }
		.pm07-badge.req  { background: #fef3e2; color: #b45309; }
		.pm07-badge.ing  { background: #eaf0fb; color: var(--pm07-navy); }
		.pm07-badge.end  { background: #e8f7ee; color: #15803d; }
		.pm07-badge.rtn  { background: #fdecec; color: #b91c1c; }

		.pm07-card-sub {
			font-size: 12px;
			color: var(--pm07-sub);
			margin-bottom: 8px;
		}

		.pm07-card-rmk {
			font-size: 12.5px;
			color: #454b57;
			line-height: 1.5;
			background: #f9fafb;
			border-radius: 8px;
			padding: 8px 10px;
			margin-bottom: 8px;
			white-space: pre-wrap;
			word-break: break-all;
			display: -webkit-box;
			-webkit-line-clamp: 2;
			-webkit-box-orient: vertical;
			overflow: hidden;
		}

		.pm07-card-foot {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-top: 8px;
			border-top: 1px solid var(--pm07-line);
		}

		.pm07-card-reqdt {
			font-size: 11px;
			color: #9aa1ab;
		}

		.pm07-card-more {
			font-size: 12px;
			font-weight: 700;
			color: var(--pm07-navy);
			display: inline-flex;
			align-items: center;
			gap: 4px;
		}
		.pm07-card-more i { font-size: 10px; }

		.pm07-empty {
			text-align: center;
			color: var(--pm07-sub);
			font-size: 13px;
			padding: 60px 20px;
			background: #fff;
			border: 1px dashed var(--pm07-line);
			border-radius: 12px;
		}
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div id="vacPopup" class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit">휴가신청</h4>
			</div>

			<div class="pm07-page">
				<div class="pm07-filter">
					<div class="pm07-filter-label">신청일자</div>
					<div class="pm07-date-row">
						<div class="date_input">
							<input id="reqDtFrom" name="reqDtFrom" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);">
						</div>
						<span class="pm07-tilde">~</span>
						<div class="date_input">
							<input id="reqDtTo" name="reqDtTo" class="input_calendar" autocomplete="off" onkeyup="dateMask(this);">
						</div>
					</div>
					<div class="pm07-filter-row2">
						<select id="sanctnSts" name="sanctnSts" class="pm07-status-select">
							<option value="">전체 상태</option>
							<option value="TEMP">임시저장</option>
							<option value="REQ">신청</option>
							<option value="ING">진행중</option>
							<option value="END">완료</option>
							<option value="RTN">반려</option>
						</select>
						<button type="button" class="pm07-btn-new" onclick="openCreateModal()"><i class="fas fa-plus"></i>신청등록</button>
					</div>
				</div>

				<div id="cardContainer" class="pm07-card-list"></div>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		var list = [];
		var userDept = jwt.deptId.substr(0, 5);

		function toDashDate(dateStr) {
			// selectVacationList가 이미 TO_CHAR(...,'YYYY-MM-DD')로 변환해서 내려주므로
			// 'YYYY-MM-DD'(10자, 대시 포함)로 들어오면 그대로 쓰고, 혹시 원시 'YYYYMMDD'(8자)로
			// 오는 경우에만 대시를 넣어준다.
			if (!dateStr) return '';
			if (dateStr.length === 10 && dateStr.indexOf('-') > -1) return dateStr;
			if (dateStr.length !== 8) return '';
			return dateStr.substring(0, 4) + '-' + dateStr.substring(4, 6) + '-' + dateStr.substring(6, 8);
		}

		function getSanctnStsNm(sts) {
			var stsMap = {
				'TEMP': '임시저장',
				'REQ': '신청',
				'ING': '진행중',
				'END': '완료',
				'RTN': '반려'
			};
			return stsMap[sts] || sts;
		}

		function getSanctnBadgeClass(sts) {
			var classMap = {
				'TEMP': 'temp',
				'REQ': 'req',
				'ING': 'ing',
				'END': 'end',
				'RTN': 'rtn'
			};
			return classMap[sts] || '';
		}

		$(document).ready(function() {
			const now = moment();
			const oneMonthAgo = now.clone().add(-1, 'M');

			$('#reqDtFrom').datepicker({
				format: "yyyy-mm-dd",
				language: "ko",
				autoclose: true
			})
			.datepicker("setDate", oneMonthAgo.toDate())
			.on("changeDate", function() {
				if ($('#reqDtFrom').val() > $('#reqDtTo').val()) {
					$('#reqDtTo').datepicker("setDate", new Date($('#reqDtFrom').val()));
				}
				vacationList();
			});

			$('#reqDtTo').datepicker({
				format: "yyyy-mm-dd",
				language: "ko",
				autoclose: true
			})
			.datepicker("setDate", now.toDate())
			.on("changeDate", function() {
				if ($('#reqDtFrom').val() > $('#reqDtTo').val()) {
					$('#reqDtFrom').datepicker("setDate", new Date($('#reqDtTo').val()));
				}
				vacationList();
			});

			$('#sanctnSts').on('change', vacationList);

			vacationList();
// 			authChk();
		});

		function vacationList() {
			var formData = {
				"coCd": jwt.coCd,
				"reqId": jwt.userId,
				"reqDtFrom": $("#reqDtFrom").val().replace(/\-/g, ''),
				"reqDtTo": $("#reqDtTo").val().replace(/\-/g, ''),
				"sanctnSts": $("#sanctnSts").val(),
				"pageNo": 1,
				"recordCnt": 999999999
			};

			postAjax("/user/pm/pm07/selectVacationList", formData, null, function(data) {
				list = data.result || [];
				let cardContainer = $("#cardContainer");
				cardContainer.empty();

				if (list.length > 0) {
					$.each(list, function(index, item) {
						if (item.vacTypeCd === undefined) item.vacTypeCd = '';
						if (item.vacTypeNm === undefined) item.vacTypeNm = '';
						if (item.stDt === undefined) item.stDt = '';
						if (item.edDt === undefined) item.edDt = '';
						if (item.reqRmk === undefined) item.reqRmk = '';
						if (item.reqDt === undefined) item.reqDt = '';
						if (item.sanctnSts === undefined) item.sanctnSts = '';
						if (item.sanctnStsNm === undefined) item.sanctnStsNm = '';

						var stDtDisplay = toDashDate(item.stDt);
						var edDtDisplay = toDashDate(item.edDt);
						var reqDtDisplay = toDashDate(item.reqDt);
						var vacTypeDisplay = item.vacTypeNm || item.vacTypeCd || '';
						var titleText = stDtDisplay + (vacTypeDisplay ? (' - ' + vacTypeDisplay) : '');
						var rangeText = (edDtDisplay && edDtDisplay !== stDtDisplay) ? (stDtDisplay + ' ~ ' + edDtDisplay) : stDtDisplay;
						var badgeCls = getSanctnBadgeClass(item.sanctnSts);
						var badgeNm = item.sanctnStsNm || getSanctnStsNm(item.sanctnSts);

						var cardHtml =
							`<div class="pm07-card ${badgeCls}" onclick="openDetailModal(${index})">
								<div class="pm07-card-head">
									<div class="pm07-card-title">${titleText}</div>
									<span class="pm07-badge ${badgeCls}"><span class="dot"></span>${badgeNm}</span>
								</div>
								<div class="pm07-card-sub">${rangeText}</div>
								${item.reqRmk ? `<div class="pm07-card-rmk">${item.reqRmk}</div>` : ''}
								<div class="pm07-card-foot">
									<span class="pm07-card-reqdt">신청일자 ${reqDtDisplay}</span>
									<span class="pm07-card-more">상세 <i class="fas fa-chevron-right"></i></span>
								</div>
							</div>`;
						cardContainer.append(cardHtml);
					});
				} else {
					cardContainer.append('<div class="pm07-empty">조회 기간에 신청한 휴가가 없습니다.</div>');
				}
			});
		}

		function openDetailModal(index) {
			const gridList = list[index];
			var paramObj = {
				"actionType": "U",
				"coCd": jwt.coCd,
				"userId": jwt.userId,
				"userNm": jwt.userNm,
				"reqNo": gridList.reqNo,
				"pgmId": "PM0701M01_M"
			};
			$.each(gridList, function(key, val) {
				if (typeof(val) === "undefined") val = "";
				paramObj[key] = val;
			});

			var nextUrl = '/static/mobile/html/user/pm/pm07/PM0701P01_M.html';
			sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
			insertPgmHistory(nextUrl);
			location.href = nextUrl;
		}

		function openCreateModal() {
			var paramObj = {
				"actionType": "C",
				"coCd": jwt.coCd,
				"userId": jwt.userId,
				"userNm": jwt.userNm,
				"pgmId": "PM0701M01_M"
			};

			var nextUrl = '/static/mobile/html/user/pm/pm07/PM0701P01_M.html';
			sessionStorage.setItem('paramObj', JSON.stringify(paramObj));
			insertPgmHistory(nextUrl);
			location.href = nextUrl;
		}
	</script>
</body>

</html>
