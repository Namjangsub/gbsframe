<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap.min.css">
	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />
	<link rel="stylesheet" href="/static/css/m_common.css" />
	<link rel="stylesheet" href="/static/css/mobile.css" />
	<script src="/static/js/jquery-latest.min.js"></script>
	<script src="/static/js/jquery.serializeObject.js"></script>
	<script src="/static/bootstrap/js/bootstrap.min.js"></script>
	<script src="/static/js/moment/moment-with-locales.js"></script>
	<script src="/static/js/global.js"></script>
	<script src="/static/js/jquery.blockUI.js"></script>
	<!-- 공통결재 (CR0202P02_M.html과 동일 패턴으로 결재 처리 위젯 재사용) -->
	<script src="/static/js/commApprovalMobile.js"></script>
	<style>
		.view-section {
			border: 1px solid #ddd;
			border-radius: 4px;
			margin-bottom: 10px;
			overflow: hidden;
		}
		.view-section-header {
			background: #f5f5f5;
			padding: 10px;
			font-weight: bold;
			font-size: 14px;
			border-bottom: 1px solid #ddd;
		}
		.view-section-body {
			padding: 10px;
		}
		.view-row {
			display: flex;
			margin-bottom: 8px;
		}
		.view-label {
			font-weight: bold;
			width: 30%;
			color: #555;
		}
		.view-value {
			width: 70%;
			word-break: break-all;
			font-size: 13px;
		}
		/* bootstrap.min.css의 label 기본 스타일(font-weight:bold, 큰 폰트)이 라디오 옵션 글자에도 그대로 적용되어
		   다른 항목보다 두드러지게 커 보인다. 본문 표준 크기로 맞춘다. */
		.view-value label {
			font-weight: normal;
			font-size: 13px;
			margin-right: 14px;
			display: inline-flex !important;
			flex-direction: row-reverse !important;
			align-items: center !important;
			cursor: pointer;
		}
		.view-value select.form-control {
			height: 30px !important;
			padding: 2px 8px !important;
			font-size: 13px !important;
			line-height: 1.4 !important;
			display: inline-block;
			width: 100%;
			max-width: 200px;
		}
		.view-value input[type="radio"] {
			width: 15px !important;
			height: 15px !important;
			min-width: 15px !important;
			min-height: 15px !important;
			margin: 0 0 0 4px !important;
			vertical-align: middle !important;
			cursor: pointer;
			accent-color: #007bff;
		}
		.approval-table {
			width: 100%;
			border-collapse: collapse;
			font-size: 13px;
		}
		.popup_area .approval-table th {
			background: #e8e8e8;
			padding: 8px;
			text-align: center;
			font-weight: bold;
			font-size: 13px;
			border: 1px solid #ccc;
		}
		.approval-table td {
			padding: 8px;
			border: 1px solid #ccc;
			text-align: center;
		}
		.approval-table .status-waiting { color: #ff6b6b; }
		.approval-table .status-approved { color: #4caf50; }
		.form-group label {
			font-weight: bold;
			font-size: 13px;
		}
		.form-group .form-control {
			font-size: 13px;
		}
		.approval_line_group {
			border: 1px solid #ddd;
			border-radius: 4px;
			padding: 8px 10px;
			background-color: #fafafa;
			margin-bottom: 8px;
		}
		.approval_line_title {
			font-size: 12px;
			font-weight: bold;
			color: #333;
			margin-bottom: 4px;
			padding-bottom: 3px;
			border-bottom: 1px solid #ddd;
		}
		.approval_row {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			padding: 3px 0;
			font-size: 13px;
			border-bottom: 1px solid #e8ebf2;
		}
		.approval_row:last-child {
			border-bottom: none;
		}
		.approval_sn {
			width: 30px;
			text-align: center;
			font-weight: bold;
			color: #007bff;
			margin-right: 5px;
		}
		.approval_name {
			flex: 1;
			color: #333;
		}
		.approval_status {
			width: 50px;
			text-align: center;
			font-size: 12px;
			font-weight: bold;
			padding: 3px 5px;
			border-radius: 3px;
		}
		.approval_status.pending {
			background-color: #fff3cd;
			color: #856404;
		}
		.approval_status.approved {
			background-color: #d4edda;
			color: #155724;
		}
		.approval_date {
			width: 80px;
			text-align: center;
			font-size: 12px;
			color: #999;
			margin-left: 5px;
		}
		.approval_action_btn {
			width: 100%;
			margin-top: 6px;
			height: 32px;
			font-size: 12px;
			font-weight: bold;
			color: #fff;
			background-color: #28a745;
			border: none;
			border-radius: 4px;
		}
		.no_approval {
			text-align: center;
			color: #999;
			padding: 10px;
			font-size: 12px;
		}
		.confirm_opinion {
			font-size: 12px;
			color: #666;
			font-style: italic;
			margin-top: 3px;
		}
		.mobile_mid_btn {
			margin-top: 10px;
			margin-bottom: 10px;
			text-align: center;
		}
		.mobile_mid_btn button {
			margin: 2px;
			height: 40px;
			font-size: 12px;
		}
		/* sub.css의 .mobile_mid_btn은 position:fixed;bottom:15px라 결재 처리 위젯의 고정 버튼바와 겹친다.
		   부서장평가 제출 버튼은 섹션 안에 그대로 머무르는 일반 버튼 행으로 둔다. */
		.inline_btn_row {
			margin-top: 10px;
			text-align: center;
		}
		.inline_btn_row button {
			height: 36px;
			font-size: 13px;
			padding: 0 16px;
		}
		/* 공용 결재위젯(commApprovalMobile.js)의 버튼바(.mobile_mid_btn)는 sub.css에서 position:fixed;bottom:15px로 정의되어
		   화면 최하단에 고정되므로, 스크롤 중인 다른 섹션과 겹쳐 보인다. 이 페이지 안에서는 섹션 내부에 자연스럽게 놓이도록 무효화한다. */
		#approval_area .mobile_mid_btn {
			position: static;
			width: auto;
			bottom: auto;
			padding: 0;
			margin-top: 10px;
		}
	</style>
</head>
<body>
	<div id="head_area" class="off">
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div id="popup_area" class="popup_area" style="width:100%; padding:0;">
			<div class="tit_contents">
				<h4 class="tit" id="popTitle">출장복명서</h4>
			</div>

			<form id="popForm">
				<input type="hidden" id="pgmId" name="pgmId" value="PM5102P01">
				<input type="hidden" id="tripRptNo" name="tripRptNo">
				<input type="hidden" id="reqViewReqId" name="reqViewReqId">
				<input type="hidden" id="actionType" name="actionType" value="V">

				<!-- 1. 출장기본정보 -->
				<div class="view-section">
					<div class="view-section-header">출장기본정보</div>
					<div class="view-section-body">
						<div class="view-row">
							<span class="view-label">신청인</span>
							<span class="view-value" id="reqViewReqNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">신청부서</span>
							<span class="view-value" id="reqViewReqDeptNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">Sales Code</span>
							<span class="view-value" id="reqViewSalesCd"></span>
						</div>
						<div class="view-row">
							<span class="view-label">영업PM명</span>
							<span class="view-value" id="reqViewPmNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">출장구분</span>
							<span class="view-value" id="reqViewTripDivNm"></span>
						</div>
						<div class="view-row" id="reqViewTripNationNmRow" style="display:none;">
							<span class="view-label">출장국가명</span>
							<span class="view-value" id="reqViewTripNationNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">출장지</span>
							<span class="view-value" id="reqViewTripPlace"></span>
						</div>
						<div class="view-row">
							<span class="view-label">프로젝트</span>
							<span class="view-value" id="reqViewClntPjtNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">출장유형</span>
							<span class="view-value" id="reqViewTripTypeNm"></span>
						</div>
						<div class="view-row">
							<span class="view-label">신청기간</span>
							<span class="view-value" id="reqTripPeriodView"></span>
						</div>
						<div class="view-row">
							<span class="view-label">실제기간</span>
							<span class="view-value" id="actTripPeriodView"></span>
						</div>
						<div class="view-row" id="extendRsnRow" style="display:none;">
							<span class="view-label">연장사유</span>
							<span class="view-value" id="extendRsnView" style="color: #d9534f; font-weight: bold;"></span>
						</div>
					</div>
				</div>

				<!-- 2. 출장목적 및 결과 -->
				<div class="view-section">
					<div class="view-section-header">출장목적 및 결과</div>
					<div class="view-section-body">
						<div class="form-group">
							<label>출장목적</label>
							<textarea id="tripPurpose" name="tripPurpose" class="form-control" rows="2" readonly></textarea>
						</div>
						<div class="form-group">
							<label>출장결과</label>
							<textarea id="tripResult" name="tripResult" class="form-control" rows="2" readonly></textarea>
						</div>
						<div class="view-row" style="margin-top: 6px;">
							<span class="view-label" style="width: 25%;">자기평가</span>
							<span class="view-value" id="selfEvalNmView" style="font-weight: bold;">-</span>
						</div>
						<div class="view-row">
							<span class="view-label" style="width: 25%;">경비판단</span>
							<span class="view-value" id="sprtEvalNmView" style="font-weight: bold;">-</span>
						</div>
						<div class="form-group" id="specialNoteGroup" style="display:none; margin-top: 8px;">
							<label>특기사항</label>
							<textarea id="specialNote" name="specialNote" class="form-control" rows="2" readonly></textarea>
						</div>
						<div class="form-group" id="minutesMissRsnGroup" style="display:none;">
							<label style="color: #d9534f;">회의록 누락 사유</label>
							<textarea id="minutesMissRsn" name="minutesMissRsn" class="form-control" rows="2" readonly style="border-color: #f5c6cb; background-color: #fdf7f7;"></textarea>
						</div>
					</div>
				</div>

				<!-- 3. 출장자 정보 -->
				<div class="view-section">
					<div class="view-section-header">출장자 정보</div>
					<div class="view-section-body" id="travelerInfoList" style="font-size: 13px; color: #333; line-height: 1.6;">
						-
					</div>
				</div>

				<!-- 4. 결재선 현황 -->
				<div class="view-section">
					<div class="view-section-header">결재선 현황</div>
					<div class="view-section-body">
						<!-- 신청부서 결재선 -->
						<div class="approval_line_group">
							<div class="approval_line_title">신청부서 결재</div>
							<div id="approvalLineTable"></div>
						</div>

						<!-- 관리부서 결재선 -->
						<div class="approval_line_group">
							<div class="approval_line_title">관리부서 결재</div>
							<div id="approvalMngLineTable"></div>
						</div>
					</div>
				</div>

				<!-- 부서장 평가 (조건부 - 평가 대상만, 결재 처리보다 먼저 표시) -->
				<div class="view-section" id="deptEvalSection" style="display:none;">
					<div class="view-section-header">부서장 평가</div>
					<div class="view-section-body">
						<div class="view-row" style="align-items: center;">
							<span class="view-label">부서장평가 <span style="color:red;">*</span></span>
							<span class="view-value">
								<select id="deptEvalCd" name="deptEvalCd" class="form-control input-sm" data-kind="PM51EVAL">
									<option value="">선택</option>
								</select>
							</span>
						</div>
						<div class="view-row" style="align-items: center; margin-top: 6px;">
							<span class="view-label">경비 판단 <span style="color:red;">*</span></span>
							<span class="view-value">
								<label><input type="radio" name="aprvEvalCd" value="SAVE"> 절약</label>
								<label><input type="radio" name="aprvEvalCd" value="NORM"> 적정</label>
								<label><input type="radio" name="aprvEvalCd" value="OVER"> 과잉</label>
							</span>
						</div>
					</div>
				</div>

				<!-- 결재 처리 (M08에서 선택한 해당 건에 대한 승인/보완요청 - 공용 결재위젯, CR0202P02_M.html과 동일 패턴) -->
				<div class="view-section" id="approvalActionSection" style="display:none;">
					<div class="view-section-header">결재 처리</div>
					<div class="view-section-body">
						<div id="approval_area"></div>
					</div>
				</div>
			</form>
		</div>
	</div>

	<script>
		var popParam = null;
		var currentTripRptMaster = null;
		var approvalList = [];
		var approvalMngList = [];
		var rptTravelerList = [];
		var isUserAccountingAuthCached = null;
		var tripTypeCdMap = {};
		var tripDivCdMap = {};
		var commApproval = null; // commApprovalMobile.js의 전역 approvalConfirm()/approvalMemoComment()가 참조하는 이름이므로 반드시 이 스코프에 선언한다.

		function formatToDate(dtm) {
			if (!dtm || dtm.length < 8) return '';
			return dtm.substring(0, 4) + '-' + dtm.substring(4, 6) + '-' + dtm.substring(6, 8);
		}

		function formatToDateTime(dtm) {
			if (!dtm || dtm.length < 8) return '';
			var d = formatToDate(dtm);
			if (dtm.length >= 12) d += ' ' + dtm.substring(8, 10) + ':' + dtm.substring(10, 12);
			return d;
		}

		// 스크롤 없이 textarea 안의 내용 전체가 보이도록 실제 내용 높이(scrollHeight)에 맞춰 늘린다.
		function autoResizeTextarea(el) {
			if (!el) return;
			el.style.height = 'auto';
			el.style.height = el.scrollHeight + 'px';
		}

		$(document).ready(function() {
			// paramObj를 sessionStorage에서 읽기
			var paramObjStr = sessionStorage.getItem('paramObj');
			if (paramObjStr) {
				popParam = JSON.parse(paramObjStr);
			} else if (typeof modalStack !== 'undefined' && modalStack && modalStack.last && modalStack.last() && modalStack.last().paramObj) {
				popParam = modalStack.last().paramObj;
			}

			if (!popParam) {
				alert('파라미터가 없습니다.');
				history.back();
				return;
			}

			// 공통코드 로드 (data-kind="PM51EVAL" 등) — global.js의 실제 배치 콤보 로더는 setComboKindOptions이다 (setComboBoxList는 존재하지 않는 함수였음)
			setComboKindOptions($('select'));

			// tripRptNo 설정 (M08.html openSecondModal이 넘기는 문서 식별자는 fileTrgtKey/todoFileTrgtKey — todoNo/rsltNo는 결재 TODO 추적번호로 다른 값이다)
			var tripRptNo = popParam.fileTrgtKey || popParam.todoFileTrgtKey || popParam.tripRptNo || popParam.rsltNo || popParam.todoNo;
			$('#tripRptNo').val(tripRptNo);

			// 코드명(tripTypeCds 변환용)을 먼저 채운 뒤 데이터를 로드해야 코드값이 아닌 코드명이 표시된다.
			loadComboCodeList(tripRptNo);
			initApprovalWidget();

			// commApprovalMobile.js의 전역 approvalConfirm()을 감싸서, 부서장평가 대상자가 결재승인을 누르면
			// 평가(validateDeptEvalFields의 검증+saveDeptEvalSync의 저장 로직)가 함께 처리되도록 한다.
			// 원본 함수는 다른 화면(WB2001P01 모달 등)에서 그대로 쓰이므로 여기서는 재할당만 하고
			// commApprovalMobile.js 자체는 건드리지 않는다.
			var originalApprovalConfirm = approvalConfirm;
			approvalConfirm = function() {
				if ($('#deptEvalSection').is(':visible')) {
					if (!validateDeptEvalFields()) {
						return false;
					}
					if (!saveDeptEvalSync()) {
						return false;
					}
				}
				return originalApprovalConfirm();
			};
		});

		var selfEvalCdMap = {};

		// 출장유형, 출장구분, 자기평가/부서장평가 공통코드명 로드
		function loadComboCodeList(tripRptNo) {
			var paramCodeList = {
				"codeKindList": "PM51TYPE,PM51DIV,PM51EVAL"
			};

			postAjax("/admin/cm/cm05/selectComboCodeList", paramCodeList, null, function(data) {
				if (data.resultList) {
					data.resultList.forEach(function(item) {
						if (item.codeKind === 'PM51TYPE') {
							tripTypeCdMap[item.codeId] = item.codeNm || item.codeId;
						} else if (item.codeKind === 'PM51DIV') {
							tripDivCdMap[item.codeId] = item.codeNm || item.codeId;
						} else if (item.codeKind === 'PM51EVAL') {
							selfEvalCdMap[item.codeId] = item.codeNm || item.codeId;
						}
					});
				}
				loadTripRptDetail(tripRptNo);
			});
		}

		// 복명서 상세 정보 로드
		function loadTripRptDetail(tripRptNo) {
			postAjax("/user/pm/pm51/selectTripRptDtl", { tripRptNo: tripRptNo }, null, function (data) {
				if (!data.result) {
					alert('데이터를 로드할 수 없습니다.');
					return;
				}

				var m02 = data.result.m02 || {};
				var d02 = data.result.d02 || [];	// selectTripRptD02: 복명서 자체 출장자 목록(TB_PM52D02)
				var m01 = data.result.m01 || {};
				currentTripRptMaster = m02;
				rptTravelerList = d02;

				// 기본정보 표시 (원본 출장신청서 m01 데이터 활용)
				$('#reqViewReqId').val(m01.userId || '');
				$('#reqViewReqNm').text(m01.userNm || '');
				$('#reqViewReqDeptNm').text(m01.userDeptNm || m01.reqDeptNm || '-');
				$('#reqViewSalesCd').text(m01.salesCd || '-');
				$('#reqViewPmNm').text(m01.pmNm || '-');

				var tripDivName = tripDivCdMap[m01.tripDiv] || m01.tripDivNm || m01.tripDiv || '-';
				$('#reqViewTripDivNm').text(tripDivName);

				if (m01.tripDiv === 'PM51DIV20' && m01.tripNationNm) {
					$('#reqViewTripNationNm').text(m01.tripNationNm);
					$('#reqViewTripNationNmRow').show();
				} else {
					$('#reqViewTripNationNmRow').hide();
				}

				$('#reqViewTripPlace').text(m01.tripPlace || '');
				$('#reqViewClntPjtNm').text(m01.clntPjtNm || '');

		// 결재선 행 렌더 (신청부서/관리부서 공통) — PM5101P01_M.html의 renderApprovalGroup과 동일한 방식
		function renderApprovalRows(containerSel, rows) {
			var $container = $(containerSel);
			$container.empty();

			if (!rows || rows.length === 0) {
				$container.append('<div class="no_approval">결재선이 없습니다.</div>');
				return;
			}

			rows = rows.slice().sort(function(a, b) {
				var aSn = Number(a.sanctnSn) || 9999;
				var bSn = Number(b.sanctnSn) || 9999;
				return aSn - bSn;
			});

			rows.forEach(function(row) {
				var isDone = row.sanctnSttus === 'Y' || $.trim(row.todoCfDt || '');
				var statusClass = isDone ? 'approved' : 'pending';
				var statusText = isDone ? '승인' : '대기';

				var html = '<div class="approval_row">';
				if (row.sanctnSn) {
					html += '<div class="approval_sn">' + row.sanctnSn + '</div>';
				}
				html += '<div class="approval_name">' + (row.todoNm || '-') + '</div>';
				html += '<div class="approval_status ' + statusClass + '">' + statusText + '</div>';
				html += '<div class="approval_date">' + (row.todoCfDt || '-') + '</div>';
				html += '</div>';
				if (row.todoCfOpn) {
					html += '<div class="confirm_opinion">의견: ' + row.todoCfOpn + '</div>';
				}
				$container.append(html);
			});
		}

		// M08.html에서 이 화면으로 넘어올 때 실은 paramObj(coCd/todoDiv1CodeId/todoDiv2CodeId/pgmId/sanctnSn 등)를 그대로 활용한다.
		function initApprovalWidget() {

				todoDiv2CodeId: popParam.todoDiv2CodeId,
				pgmId: popParam.pgmId
			};

			delete widgetParam.sanctnSn;
			delete widgetParam.pgmId;

			$('#approvalActionSection').show();
			commApproval = new Approval(htmlParam, approvalParam, widgetParam);

		// 역할별 UI 표시 (부서장 평가)
		function applyRoleBasedUI() {
			var applicantId = $('#reqViewReqId').val();
			var isTeamManager = isApplicantTeamManager(applicantId);
			var isApproverTeamManager = isCurrentApproverTeamManager(applicantId);
			var isCompleted = isRptPaid() || hasOwnGeneralApprovalCompleted();
			var isEvaluator = (isTeamManager || isApproverTeamManager) && !isAccountingUser();

			// 1. DB에 저장된 값이 있거나 평가 권한이 있는 경우 영역 표시
			var hasSavedValue = !!(currentTripRptMaster && (currentTripRptMaster.deptEvalCd || currentTripRptMaster.aprvEvalCd));
			var showSection = isEvaluator || hasSavedValue;
			$('#deptEvalSection').toggle(showSection);

			// 2. 결재 전(isEvaluator && !isCompleted)이면 수정 가능, 결재 후이거나 조회 전용이면 비활성화(disabled)
			var editable = isEvaluator && !isCompleted;
			$('#deptEvalCd').prop('disabled', !editable);
			$('input[name="aprvEvalCd"]').prop('disabled', !editable);
		}

		// 회계담당자 여부 (공통코드 SPECRTS14 codeEtc에 등록된 사용자 목록) — PC PM5102P01.html:2356과 동일
		function isAccountingUser() {
			if (isUserAccountingAuthCached !== null) return isUserAccountingAuthCached;

			var auth = false;
			postAjaxSync("/admin/cm/cm05/selectChildCodeList", { codeId: 'SPECRTS15' }, null, function(data) {
				var list = data.childCodeList || data.resultList || data.result || [];
				var allUserIds = [];
				$.each(list, function(idx, item) {
					var codeEtc = item.codeEtc || '';
					if (codeEtc) {
						var splitIds = codeEtc.replace(/\s/g, '').split(',');
						allUserIds = allUserIds.concat(splitIds);
					}
				});
				if ($.inArray(jwt.userId, allUserIds) > -1) {
					auth = true;
				}
			});
			isUserAccountingAuthCached = auth;
			return auth;
		}

		// 지급완료 여부 — PC PM5102P01.html:3223과 동일
		function isRptPaid() {
			return !!(currentTripRptMaster && $.trim(currentTripRptMaster.payDt || ''));
		}

		// 로그인 사용자 본인의 신청부서 일반결재가 이미 완료됐는지 — PC PM5102P01.html:3173과 동일(approvalList 기준으로 대체)
		function hasOwnGeneralApprovalCompleted() {
			var completed = false;
			$.each(approvalList, function(idx, row) {
				if (row.todoId === jwt.userId) {
					if ($.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y') {
						completed = true;
					}
					return false;
				}
			});
			return completed;
		}

		// 신청인이 팀장인지 판정
		function isApplicantTeamManager(userId) {
			if (!userId) return false;
			var isTeamManager = false;
			postAjaxSync("/admin/cm/cm06/selectUserInfo", {"userId": userId}, null, function(data) {
				if (data.userInfo && data.userInfo.teamManager === 'TEAM01') {
					isTeamManager = true;
				}
			});
			return isTeamManager;
		}

		// 로그인 사용자가 신청인의 팀장인지 판정
		function isCurrentApproverTeamManager(applicantId) {
			if (!applicantId) return false;
			var isManager = false;
			postAjaxSync("/admin/cm/cm06/selectUserInfo", { userId: applicantId }, null, function(data) {
				if (data.userInfo && data.userInfo.mngId) {
					if (data.userInfo.mngId === jwt.userId) {
						isManager = true;
					}
				}
				// [예외] GUN60 부서(생산팀)는 조직도상 mngId가 등록되어 있지 않아,
				// 로그인ID sms가 GUN60 소속 신청인의 생산팀장 역할을 수행함
				if (!isManager && data.userInfo && data.userInfo.deptId && String(data.userInfo.deptId).indexOf('GUN60') === 0 && jwt.userId === 'sms') {
					isManager = true;
				}
			});
			return isManager;
		}

		// 부서장평가 필드 검증 (deptEvalCd + aprvEvalCd)

		// 부서장평가 동기 저장 — "결재승인" 클릭 시 approvalConfirm()에서만 호출된다(평가 제출 전용 버튼 없음, PC와 동일).
		// 저장 성공 후의 화면 종료/이동은 뒤이어 실행되는 원래 결재승인 로직(commApprovalMobile.js)이 담당하므로 여기서는 하지 않는다.
		function saveDeptEvalSync() {

				tripRptNo: $('#tripRptNo').val(),
				deptEvalCd: $('#deptEvalCd').val(),
				aprvEvalCd: $('input[name="aprvEvalCd"]:checked').val() || '',

		// 카카오 알림톡 발송 (PC PM5102P01.html의 kakaoTodo 패턴, notifyPm51NextApprover 제거)
		function kakaoTodo(docNo) {
			if (!docNo) return;

			var teleNo = "051-312-2400"; // 기본값
			postAjaxSync("/user/wb/wb24/selectMemberTelNo", { coCd: jwt.coCd, userId: jwt.userId }, null, function(data) {
				if (data.result && data.result[0] && data.result[0].telNo) teleNo = data.result[0].telNo;
			});

			var clntNm = (jwt.coCd == "GUN") ? "(주)건양ITT" : "트루넷";

			// 신청부서 결재 알림톡 발송 (다음 결재자)
			var reqActiveSn = getFirstPendingApprovalSn();
			if (reqActiveSn) {
				kakaoSendBody(docNo, 'TODODIV20', 'TODODIV2200', '결재', clntNm, teleNo, reqActiveSn);
			}
			// 신청부서 공유 알림톡 발송
			kakaoSendBody(docNo, 'TODODIV10', 'TODODIV1200', '공유', clntNm, teleNo);

			// 신청부서 결재 완료 후 관리부서 결재 알림톡 발송
			if (isApprovalFullyCompleted()) {
				var mngActiveSn = getFirstPendingApprovalSnFromList(approvalMngList);
				if (mngActiveSn) {
					kakaoSendBody(docNo, 'TODODIV20', 'TODODIV2201', '결재', clntNm, teleNo, mngActiveSn);
				}
				// 관리부서 공유 알림톡 발송
				kakaoSendBody(docNo, 'TODODIV10', 'TODODIV1201', '공유', clntNm, teleNo);
			}
		}

		// 대기중인 첫 번째 결재자 순번 조회
		function getFirstPendingApprovalSn() {
			var minPendingSn = null;
			$.each(approvalList, function(idx, row) {
				if (row.todoDiv2CodeId === 'TODODIV1200' || row.todoDiv2CodeId === 'TODODIV1201') return;
				var isDone = $.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y';
				if (!isDone) {
					var sn = Number(row.sanctnSn);
					if (!isNaN(sn) && (minPendingSn === null || sn < minPendingSn)) {
						minPendingSn = sn;
					}
				}
			});
			return minPendingSn;
		}

		// 리스트에서 대기중인 첫 번째 결재자 순번 조회
		function getFirstPendingApprovalSnFromList(list) {
			var minPendingSn = null;
			$.each(list, function(idx, row) {
				if (row.todoDiv2CodeId !== 'TODODIV1201') {
					var isDone = $.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y';
					if (!isDone) {
						var sn = Number(row.sanctnSn);
						if (!isNaN(sn) && (minPendingSn === null || sn < minPendingSn)) {
							minPendingSn = sn;
						}
					}
				}
			});
			return minPendingSn;
		}

		// 승인 전체 완료 여부
		function isApprovalFullyCompleted() {
			var rows = $.grep(approvalList || [], function(r) { return r.todoDiv2CodeId !== 'TODODIV1200' && r.todoDiv2CodeId !== 'TODODIV1201'; });
			if (rows.length === 0) return false;
			var allDone = true;
			$.each(rows, function(idx, row) {
				var isDone = $.trim(row.todoCfDt || '') || row.sanctnSttus === 'Y';
				if (!isDone) { allDone = false; return false; }
			});
			return allDone;
		}

		// 카카오 메시지 본문 구성 및 발송 (PC PM5102P01.html의 kakaoSendBody 패턴)
		function kakaoSendBody(docNo, todoDiv1CodeId, todoDiv2CodeId, sanctnDiv2, clntNm, teleNo, sanctnSn) {
			var title = buildTripRptGanttStyleTitle();
			var customMsg = buildTripRptKakaoMessage(sanctnDiv2);

			var param = {
				tmplatDiv: "TMPLATDIV02",
				coCd: jwt.coCd,
				todoDiv1CodeId: todoDiv1CodeId,
				todoDiv2CodeId: todoDiv2CodeId,
				todoDiv1CodeNm: sanctnDiv2,
				title: title,
				sanctnDiv2: sanctnDiv2,
				todoNo: docNo,
				clntCd: "1",
				clntNm: clntNm,
				ordrgMngNm: jwt.userNm,
				ordrgMngTelNo: teleNo,
				creatPgm: "PM5102P01",
				chkSentYn: "Y",
				customMessage: customMsg
			};

			if (sanctnSn) {
				param.sanctnSn = sanctnSn;
			}

			commKaKaoSendTodo(param);
		}

		// 간트바 스타일 제목 구성
		function buildTripRptGanttStyleTitle() {
			var titleTripPlace = $('#reqViewTripPlace').text() || '';
			var titleClntPjtNm = $('#reqViewClntPjtNm').text() || '';
			var titleTripTypeNm = $('#reqViewTripTypeNm').text() || '';
			if (titleTripTypeNm === '선택') titleTripTypeNm = '';
			return titleTripPlace + (titleClntPjtNm ? '_' + titleClntPjtNm : '') + (titleTripTypeNm ? '(' + titleTripTypeNm + ')' : '') + ' 출장복명';
		}

		// 카카오 메시지 본문 구성
		function buildTripRptKakaoMessage(sanctnDiv2) {
			var tripPlace = $('#reqViewTripPlace').text() || '';
			var clntPjtNm = $('#reqViewClntPjtNm').text() || '';
			var tripDivNm = $('#reqViewTripTypeNm').text() || '';
			if (tripDivNm === '선택') tripDivNm = '';

			var names = [];
			var stDt = '';
			var edDt = '';
			$.each(rptTravelerList, function(idx, row) {
				if (row.userNm) names.push(row.userNm);
				if (row.tripStDt && (!stDt || row.tripStDt < stDt)) stDt = row.tripStDt;
				if (row.tripEdDt && (!edDt || row.tripEdDt > edDt)) edDt = row.tripEdDt;
			});

			var travelerTxt = names.length === 0 ? '' : (names.length === 1 ? names[0] : names[0] + '외 ' + (names.length - 1) + '명');
			var period = (stDt && edDt) ? stDt.substring(0, 10) + '~' + edDt.substring(0, 10) : '';

			var info = tripPlace + ', ' + clntPjtNm + ', ' + tripDivNm;
			var msg = '내용 : [출장복명서, ' + info + '] ' + sanctnDiv2 + ' 요청 건';
			msg += '\n업무 : ' + info + ', ' + period + ' ' + travelerTxt;

			var tripResult = $('#tripResult').val() || '';
			if (tripResult) msg += '\n결과 : ' + tripResult;

			msg += '\n요청일시 : ' + moment().format('YYYY-MM-DD HH:mm');
			msg += '\n요청자 : ' + jwt.userNm;

			return msg;
		}

		// to-do 결재요청 알림톡 (PC PM5102P01.html의 commKaKaoSendTodo 패턴)
		function commKaKaoSendTodo(param) {
			var maxMessageId = null;
			var talkMessage = null;
			var mobile = null;
			var sendList = [];
			var talkParam = {};
			var talkBody = {};

			postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function (data) {
				if (data.resultList.length > 0) {
					if (data.resultList[0].maxMessageId != "") {
						sendList = data.resultList;
					}
				}
