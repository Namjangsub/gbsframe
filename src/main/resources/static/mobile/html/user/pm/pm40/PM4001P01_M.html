    <style>
		/* ── PM0701M01_M 디자인 시스템 계승 : 작업일보 고찰 모바일 최적화 ── */
		:root {
			--pm-navy: #304a8a;
			--pm-navy-dark: #253a6e;
			--pm-bg: #dfe4ec;
			--pm-ink: #22262f;
			--pm-sub: #6b7280;
			--pm-line: #e6e9f0;
		}

		html, body {
			background: var(--pm-bg);
			font-size: 13px;
			color: var(--pm-ink);
			margin: 0;
			padding: 0;
		}

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 28px;
			box-sizing: border-box;
		}

		/* 모바일 카드 레이아웃 */
		.pm-card {
			background: #ffffff;
			border: 1px solid #c3cad8;
			border-left: 5px solid var(--pm-navy);
			border-radius: 10px;
			padding: 16px;
			margin-bottom: 14px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, 0.09);
			box-sizing: border-box;
		}

		.pm-card-head {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding-bottom: 10px;
			margin-bottom: 14px;
			border-bottom: 1px solid var(--pm-line);
		}

		.pm-card-title {
			font-size: 15px;
			font-weight: 800;
			color: var(--pm-navy);
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.pm-badge-author {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			background: #f1f5f9;
			color: var(--pm-navy);
			font-size: 12px;
			font-weight: 700;
			padding: 3px 8px;
			border-radius: 6px;
		}

		/* 폼 그룹 */
		.pm-form-group {
			margin-bottom: 13px;
		}

		.pm-form-group:last-child {
			margin-bottom: 0;
		}

		.pm-label {
			display: block;
			font-size: 13px;
			font-weight: 700;
			color: #374151;
			margin-bottom: 5px;
		}

		.pm-textarea {
			width: 100% !important;
			border: 1px solid #d1d5db !important;
			border-radius: 8px !important;
			padding: 9px 11px !important;
			font-size: 13px !important;
			line-height: 1.5 !important;
			background-color: #ffffff;
			box-sizing: border-box;
			transition: border-color 0.15s ease, box-shadow 0.15s ease;
			resize: vertical;
		}

		.pm-textarea:focus {
			border-color: var(--pm-navy) !important;
			outline: none;
			box-shadow: 0 0 0 3px rgba(48, 74, 138, 0.15);
		}

		.pm-date-box {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: #f8fafc;
			border: 1px solid #e2e8f0;
			border-radius: 8px;
			padding: 10px 12px;
			margin-bottom: 14px;
		}

		.pm-date-box input.input_calendar {
			height: 36px !important;
			border: 1px solid #cbd5e1 !important;
			border-radius: 6px !important;
			font-size: 13px !important;
			font-weight: 600;
			padding: 0 10px !important;
			background-color: #ffffff;
		}

		/* 하단 버튼 영역 */
		.pm-bottom-actions {
			display: flex;
			gap: 10px;
			margin-top: 16px;
			margin-bottom: 24px;
		}

		.pm-btn-action {
			flex: 1;
			height: 44px;
			border: none;
			border-radius: 8px;
			font-size: 15px;
			font-weight: 700;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			transition: all 0.15s ease;
		}

		.pm-btn-submit {
			background: var(--pm-navy);
			color: #ffffff;
			box-shadow: 0 2px 4px rgba(48, 74, 138, 0.25);
		}

		.pm-btn-submit:active {
			background: var(--pm-navy-dark);
			transform: scale(0.99);
		}

		.pm-btn-close {
			background: #64748b;
			color: #ffffff;
		}

		.pm-btn-close:active {
			background: #475569;
			transform: scale(0.99);
		}
    </style>
</head>

					<div class="pm-form-group">

						<textarea rows="3" id="workNeedTxt" name="workNeedTxt" class="form-control pm-textarea" placeholder="앞으로 개선할 점을 입력하세요." msg="개선할점"></textarea>
					</div>
					<div class="pm-form-group">

						<textarea rows="3" id="workProposalTxt" name="workProposalTxt" class="form-control pm-textarea" placeholder="부서 또는 회사에 건의할 사항을 입력하세요." msg="건의사항"></textarea>
					</div>
					<div class="pm-form-group">
						<label class="pm-label"><i class="fas fa-comment-dots" style="color: #64748b; margin-right: 5px;"></i>비고</label>
						<textarea rows="2" id="workRmk" name="workRmk" class="form-control pm-textarea" placeholder="기타 비고사항을 입력하세요." msg="비고"></textarea>
					</div>
				</div>
			</form>

			<!-- 2. 월간 업무일지 통계 현황 카드 -->

					<div class="pm-card-title">
						<i class="fas fa-chart-pie"></i>월간 업무일지 집계 현황
					</div>
				</div>
				<div class="ax5_grid" style="width: 100%;">
					<div data-ax5grid="first-grid" data-ax5grid-config="{}" style="height: 380px; width: 100%; font-size: 13px;"></div>
				</div>
			</div>

			<!-- 3. 하단 액션 버튼 -->
			<div class="pm-bottom-actions">
				<button type="button" class="pm-btn-action pm-btn-submit" id="actionBtn" authChk>등록</button>
				<button type="button" class="pm-btn-action pm-btn-close" onclick="window.history.back();">닫기</button>
			</div>
		</div>

	var gridView = {
		    initView : function() {
		            this.target = new ax5.ui.grid();
		            this.target.setConfig({
		                showRowSelector: false,
		                multipleSelect: false,
		                sortable: false,
		                target: $('[data-ax5grid="first-grid"]'),
		                header: {
		                    align: "center",
		                    selector: false,
		                    columnHeight: 26,
		                },
		                body: {
		                    columnHeight:26,
		                    mergeCells : ["codeDiv", "codeKind", "codeDesc", "codeNm"],
		                     onClick: function () {
		                        this.self.select(this.dindex);                  
		                    },
		                    onDBLClick: function () {
		                       // insertDailyWorkModal("U");      
		                    },
				            grouping: {
				            	by: ["codeDesc" ],
			                    columns: [
			                    	{
			                            label: function () {
			                                return this.groupBy.labels.join(", ") + " 소계";
			                            }, colspan: 2, align: "center"
			                        },
			                        {key: "totHours", collector: "sum", formatter: "money", align: "right"},
			                        {key: "totPct", collector: "sum", formatter: "money", align: "right"},
			                    ]
			                }		
		                },

		            page : {
		                display : false,
		            },
		            columns : [
			            	 {key: "codeDiv",	    label: "부서구분",		width: 70,		align: "center" , hidden: true}
							,{key: "codeDesc",	    label: "업무분류",		width: 70,		align: "center"}
							,{key: "codeNm",		label: "업무일지", 	    width: "*",		align: "left"}
							,{key: "totHours",		label: "시간", 	    	width: 45,		align: "right"}
							,{key: "totPct",		label: "백분율", 	    width: 55,		align: "right"}
		                ],
					});
		             return this;
		        },

		    setData : function() {
		        var targetObj = this.target;
		        var resDay = $('#writeYm').val().replace('-',''); //사용자가 등록하려는 년월
		        var formData = {
		            "coCd"          : jwt.coCd,
		            "userId"     : jwt.userId,
		            "workYm"     : resDay,
		            "sortType"      : "DATE",	
		            "prdtCd" : "",
		            "recordCnt" 	: 9999999	
		        }
		        
		        postAjax("/user/pm/pm40/selectYearWorkMainList", formData, null, function(data){
					try {
						var list = data.result;
						if (list) {
							targetObj.setData({
									list : list,
									page : {
										totalElements : list.length
									}
								});
						}
					} catch (error) {
						alert("오류 발생!! 전산실 연락 바랍니다", error.message);
						return null; // 오류 발생 시 null 반환
					} finally {
						// console.log("함수 실행 완료.");
					}
				});
			}
		}
	function gridHeightSet() {
		const grdiHeight = $(window).height()-800;
		gridView.target.setHeight(grdiHeight< 400 ? 400 : grdiHeight);
	}
	
	
$(document).ready(function() {
	$("#popForm #ordrgId").val(jwt.userId);
	$("#popForm #ordrgNm").val(jwt.userNm);
	$("#popForm #deptCd").val(jwt.deptId);
	$('#displayUserNm').text(jwt.userNm || '작성자');
	
    // 년월 select 세팅
	SetYm();
    gridView.initView().setData(0);
    gridHeightSet();

	var newScreenWidth = $(window).width();
	var newScreenHeight = $(window).height();

    //작성일자//
    $('#workRptDt').datepicker({
        format : "yyyy-mm-dd",
        language : "ko",
        autoclose : true
    }).datepicker("setDate", new Date());

	const now = moment().startOf("month");
	var beDay = now.add(-2, "M").format("YYYY-MM-DD");	
    $('#cWorkYm').datepicker({
			format : "yyyy-mm",
			minViewMode: 1,
			language : "ko",
			autoclose : true
		})
		.datepicker("setDate", new Date())
		.on("changeDate", function(){
			$('#writeYm').val($('#cWorkYm').val());
			$('#workYm').text($('#cWorkYm').val());
  			gridView.setData(0);
		});

    //세션에 정보를 활용하여 승인처리
    paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
    sessionStorage.removeItem('paramObj');
    if (paramObj && paramObj != "undefined") {
    	$("#popForm #coCd").val(jwt.coCd);
        actionType = paramObj.actionType;
        fileTrgtKey = paramObj.fileTrgtKey;
		$("#fileTrgtKey").val(fileTrgtKey);

		setCommonSelect($(".popup_area select[data-kind]"));

        if (actionType == "C") {
            $('.tit').text('작업일보 고찰 등록-개인');
            $("#actionBtn").text("등록");

            //modal 넘어온값만큼 루프
			$.each(paramObj, function (key, val) {
				if( $("#popForm").find("#"+key).length > 0 ) {
					$("#popForm").find("#"+key).val(val);
				}
			});
			$('#workYmTitle').text('고찰년월: ');
			$('#workYm').text($('#cWorkYm').val() || $('#writeYm').val());
            $('#actionBtn').on("click", function() {
                insert_pm40();
            });

        } else if (actionType == "U") {
            $('.tit').text('작업일보 고찰 수정-개인');

            select_pm40_Info();
            // 수정 시 날짜선택 인풋 숨김 처리
            $('#create_td').css('display', 'none');
           
            //modal 넘어온값만큼 루프
			$.each(paramObj, function (key, val) {
				if( $("#popForm").find("#"+key).length > 0 ) {
					$("#popForm").find("#"+key).val(val);
				}
				if (key == 'workYm'){
					$('#writeYm').val(val);
					$('#cWorkYm').val(val.substring(0, 4)+"-"+val.substring(4, 6));
					$('#workYmTitle').text('고찰년월: ');
					$('#workYm').text(val.substring(0, 4)+"-"+val.substring(4, 6));
				}
			});
            gridView.setData(0);
            $('#actionBtn').text("수정");
            $('#actionBtn').on("click", function() {
                update_pm40();
            });
        }
    } else {
        window.history.back();
    }
});


//입력정보
function select_pm40_Info() {
	var formData = {
		"workNo" : paramObj.workNo,
	}
	
	postAjaxSync("/user/pm/pm40/select_pm40_Info", formData, null, function(data) {
		if (data.result.workNo) {	//해당 자료가 존재해야함
			$.each(data.result, function(key, value) {
				if ($('#popForm #' + key)[0]) {
					$('#popForm #' + key).val(value);
					if ($('#popForm #' + key).is('[comma]')) {
						onlyNumber($('#popForm #' + key)[0]);
					}
				}
				if (key === "userNm") {
		            $("#popForm #ordrgNm").val(value);
		        }
				if (key === "userId") {
		            $("#popForm #ordrgId").val(value);
		            
		            if (value != jwt.userId ) {	//수정 버튼 작성자이면 수정 가능하게 하고 아니면 수정버튼 숨김
						$('.popup_area #actionBtn').hide();
					} else {
						$('.popup_area #actionBtn').show();
					}
		        }
			});

			// 크기 조절할 textarea ID 리스트
			const textAreas = [
			    '#workGoodTxt',  // 잘한점
			    '#workBadTxt',   // 아쉬운점
			    '#workNeedTxt',  // 개선할점
			    '#workProposalTxt', // 건의사항
			    '#workRmk'       // 비고
			];
			// 각 textarea에 대해 크기 조절 함수 호출
			textAreas.forEach(textAreaId => {
			    txtareaHeightResize($(textAreaId));
			});
			
			selectApprovalCheck(data.result.workNo);
			
		} else {
			alert('해당 고찰 자료가 없습니다.  전산실 확인 바랍!')
		}
	});
}

//등록
function insert_pm40() {
	if (inputValidation($('.popup_area [required]'))) {		// 필수 필드의 유효성 검사
		var formData = makeFormData();						// 요청이 통과하면 makeFormData() 함수를 이용해 formData를 생성
		filePostAjax("/user/pm/pm40/insert_pm40", formData,	function(data) {
			alert(data.resultMessage);
			if (data.resultCode == 200) {		//  요청이 성공(200)한 경우, gridView.setData(0)를 호출하여 그리드 뷰를 업데이트하고,
				$('#workNo').val(data.workNo);
				//kakaoTodo();
				 window.history.back();			// 모달을 닫음
			}
		});
	}
}


// 수정
function update_pm40() {
    if (inputValidation($('.popup_area [required]'))) {
    	//문제여부가 이면 제목 입력은 필수처리하기 위함
        $('#actionBtn').hide();
        var formData = makeFormData();
         filePostAjax("/user/pm/pm40/update_pm40", formData,function(data) {
        	 alert(data.resultMessage);
                    if (data.resultCode == 200) {
                            //kakaoTodo();
                        window.history.back();
                    }
                }); 
    }
}

function makeFormData() {
    // 폼데이터 생성
    var formData = new FormData($("#popForm")[0]);

	var writeDt = ($("#writeYm").val() || $("#cWorkYm").val() || "").replace(/\-/g, '');
	$("#deptCd").val(jwt.deptId.slice(0,5));
	formData.append("userId", $("#popForm #ordrgId").val());
	formData.append("workYm", writeDt);
	formData.append("workDiv", "개인");
	formData.append("deptCd", $("#deptCd").val());
	formData.append("jobSource", "MOBILE"); //백엔드 처리시 모바일에서 작성한것인지 구분하기 위함
		
    return formData;
}



function selectApprovalCheck(value) {
    var formData = {
          "reqNo" : value
    }
    postAjaxSync("/user/qm/qm01/selectApprovalChk", formData, null, function(data) {//결재가 진행이 되었는지 안되었는지 DB체크
       var list = data.result[0]
        if (list == 'Y'){//결재가 한개라도 진행이 되었으면 알림창

        	$('.tit').text($('.tit').text() + ' (결재진행으로 수정불가)');
            //input readonly, radio.checkbox disabled
	          $.each($('#popForm select, input, textarea'), function(idx, elem){
	             var id = $(elem).attr("ID");
	             if( id ) {
	                var eleId = "#popForm #"+id;
	                if( $(elem).prop('tagName') == "INPUT" ) $(eleId).attr("readonly", true);
	                if( $(elem).prop('tagName') == "TEXTAREA" ) $(eleId).attr("readonly", true);
	                if( $(elem).prop('tagName') == "SELECT" ) $(eleId).css({'background-color':'#e6e6e6', 'pointer-events':'none'});
	                if( $(elem).prop('type') == "checkbox" || $(elem).prop('type') == "radio") $(eleId).on('click', function(e) {e.preventDefault();});
	             }
	
	          });
	
	          $('.popup_area #actionBtn').remove();
            $("#plus-minus").remove();
        }
    });
 }



function SetYm(){
	var now = new Date();
	var nyear = now.getFullYear();
	var nmon =  (now.getMonth()+1) > 9 ? ''+(now.getMonth()+1) : '0'+(now.getMonth()+1);
	
	$('#writeYm').val(`${nyear}-${nmon}`);
	$('#workYm').text(`${nyear}-${nmon}`);
}

	
function txtareaHeightResize(obj) {
	const rowCount = obj.val().split(/\r\n|\r|\n/).length;

	if(rowCount < 4)
		obj.css('height', "60px");
	else
		obj.css('height', (rowCount * 20) + "px");
}
