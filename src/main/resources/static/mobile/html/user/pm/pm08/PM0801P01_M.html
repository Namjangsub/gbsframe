<html lang="ko">
<head>

	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

	<link rel="stylesheet" href="/static/css/gnb.css" />
	<link rel="stylesheet" href="/static/css/main.css" />
	<link rel="stylesheet" href="/static/css/sub.css" />

	<style>
		:root {
			--pm08-navy: #304a8a;
			--pm08-navy-dark: #253a6e;
			--pm08-bg: #dfe4ec;
			--pm08-ink: #14161c;
			--pm08-sub: #6b7280;
			--pm08-line: #c3cad8;
		}

		html, body { background: var(--pm08-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm08p-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 100px;
			box-sizing: border-box;
		}

		.pm08p-notice {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 8px;
			background: #fff7e6;
			border: 1px solid #f3d38a;
			color: #92660a;
			font-size: 12.5px;
			font-weight: 600;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
			box-sizing: border-box;
		}

		.pm08p-section {
			width: 100%;
			background: #ffffff;
			border: 1px solid var(--pm08-line);
			border-radius: 11px;
			padding: 13px;
			margin-bottom: 11px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, .06);
			box-sizing: border-box;
		}

		.pm08p-section-title {
			font-size: 12.5px;
			font-weight: 800;
			color: var(--pm08-navy);
			letter-spacing: .02em;
			margin: 0 0 9px;
			padding-bottom: 6px;
			border-bottom: 2px solid #eef1f6;
		}

		.pm08p-field { margin-bottom: 11px; }
		.pm08p-field:last-child { margin-bottom: 0; }

		.pm08p-field-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			margin-bottom: 6px;
		}
		.pm08p-field-label.required::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}

		/* 통일된 단일 행 (좌: 라벨 85px 고정, 우: 우측정렬 내용) */
		.pm08p-row-horizontal {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			row-gap: 6px;
			padding: 8px 0;
			border-bottom: 1px solid #eef1f6;
			min-height: 44px;
			box-sizing: border-box;
		}
		.pm08p-row-horizontal:last-child {
			border-bottom: none;
		}
		.pm08p-row-label {
			flex: 0 0 85px;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			line-height: 1.4;
			white-space: nowrap;
		}
		.pm08p-row-label.required::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}
		.pm08p-row-content {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: flex-end;
			flex-wrap: wrap;
			row-gap: 6px;
			gap: 6px;
			min-width: 0;
		}

		.pm08p-input {
			border: 1px solid var(--pm08-line) !important;
			border-radius: 8px !important;
			font-size: 13.5px !important;
			padding: 0 10px !important;
			box-sizing: border-box;
			background-color: #fff;
			color: var(--pm08-ink);
			transition: border-color .15s ease, box-shadow .15s ease;
		}
		.pm08p-input:focus {
			outline: none;
			border-color: var(--pm08-navy) !important;
			box-shadow: 0 0 0 3px rgba(48, 74, 138, .14);
		}
		.pm08p-input:disabled, .pm08p-input[readonly] {
			background-color: #f3f4f7 !important;
			color: #7c828d !important;
		}

		textarea.pm08p-input {
			height: auto;
			min-height: 80px;
			padding: 10px 12px !important;
			line-height: 1.55;
			resize: vertical;
		}

		/* 하단 고정 버튼 바 (PM0701P01_M과 동일) */
		.pm08p-bottom-bar {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			gap: 10px;
			padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
			background: #ffffff;
			border-top: 1px solid var(--pm08-line);
			box-shadow: 0 -2px 10px rgba(16, 24, 40, .08);
			z-index: 60;
		}
		.pm08p-bottom-bar button {
			flex: 1 1 0;
			height: 46px;
			border-radius: 10px;
			font-size: 15px;
			font-weight: 800;
			border: none;
			cursor: pointer;
			transition: all 0.2s;
		}
		.pm08p-bottom-bar #actionBtn {
			background: var(--pm08-navy);
			color: #fff;
		}
		.pm08p-bottom-bar #actionBtn:active { background: var(--pm08-navy-dark); }
		.pm08p-bottom-bar .close_btn {
			background: #ffffff;
			border: 1px solid var(--pm08-line) !important;
			color: #3a3f4a;
		}
		.pm08p-bottom-bar .close_btn:active { background: #f3f4f7; }
		.pm08p-bottom-bar #approvalBtn {
			background: var(--pm08-navy);
			color: #fff;
		}
		.pm08p-bottom-bar #approvalBtn:active { background: var(--pm08-navy-dark); }
		.pm08p-bottom-bar #submitResultBtn {
			background: var(--pm08-navy);
			color: #fff;
		}
		.pm08p-bottom-bar #submitResultBtn:active { background: var(--pm08-navy-dark); }
		.pm08p-btn-sm {
			height: 30px;
			padding: 0 10px;
			border-radius: 8px;
			border: 1px solid var(--pm08-line);
			background: #fff;
			color: var(--pm08-navy);
			font-size: 12px;
			font-weight: 700;
		}

		/* 좌우 짤림 방지: 좁은 화면에서 폭이 고정된 자식(첨부파일 썸네일, 결재선 테이블 등)이
		   화면 밖으로 밀려나가는 대신 그 영역 안에서만 가로 스크롤되게 가둔다. */
		html, body { overflow-x: hidden; }
		#approval_area, #fileList_area {
			max-width: 100%;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		/* 근무시간/실제근무시간 행: 결재(읽기전용) 모드에서 다른 화면 공용 readonly 스타일이
		   input 폭을 늘려버려 08:30 ~ 17:30 이 세 줄로 쪼개지는 문제가 있어, 이 행만은 항상
		   한 줄을 유지하도록 폭과 줄바꿈을 강제로 고정한다. */
		.pm08p-row-nowrap { flex-wrap: nowrap !important; }
		.pm08p-row-nowrap .pm08p-row-content { flex-wrap: nowrap !important; }
		#holidayDt, #substituteDt {
			width: 130px !important;
			flex: 0 0 130px !important;
		}
		#stTm, #edTm, #realStTm, #realEdTm {
			width: 56px !important;
			flex: 0 0 56px !important;
		}
		#totalTm, #realTotalTm {
			width: 52px !important;
			flex: 0 0 52px !important;
		}

		/* 좁은 화면(대략 360px 이하) 보완: 라벨 폭과 시간 입력칸을 살짝 줄여
		   근무시간/실제근무시간 행이 한 줄 안에 여유 있게 들어가게 한다. 색상·폰트는 그대로 유지.
		   (위 고정폭 규칙보다 뒤에 두어야 이 미디어쿼리가 이긴다) */
		@media (max-width: 360px) {
			.pm08p-page { padding-left: 10px; padding-right: 10px; }
			.pm08p-row-label { flex-basis: 72px; }
			#stTm, #edTm, #realStTm, #realEdTm { width: 50px !important; flex: 0 0 50px !important; }
			#totalTm, #realTotalTm { width: 44px !important; flex: 0 0 44px !important; }
		}
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit" id="popupTitle">휴일대체근무 신청</h4>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="GUN">
				<input type="hidden" id="actionType" name="actionType" value="C">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="reqId" name="reqId">

				<div class="pm08p-page">
					<div class="pm08p-notice">
						<i class="fas fa-info-circle"></i>
						<span>신청 정보는 결재진행전까지 수정 가능하며, 자동 결재로 진행됩니다.</span>
					</div>

					<!-- 신청 정보 섹션 -->
					<div class="pm08p-section">
						<div class="pm08p-section-title">신청 정보</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label">신청자</div>
							<div class="pm08p-row-content">
								<input type="text" id="reqTitl" name="reqTitl" readonly placeholder="신청자" style="border: none; background: transparent; font-size: 13px; font-weight: 700; color: #1e293b; text-align: right; padding: 0; outline: none; width: 100%;">
							</div>
						</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label">부서</div>
							<div class="pm08p-row-content">
								<input type="text" id="reqDeptNm" name="reqDeptNm" readonly placeholder="부서" style="border: none; background: transparent; font-size: 13px; font-weight: 600; color: #475569; text-align: right; padding: 0; outline: none; width: 100%;">
							</div>
						</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label required">휴일근무일자</div>
							<div class="pm08p-row-content">
								<input type="text" id="holidayDt" name="holidayDt" class="pm08p-input" placeholder="YYYY-MM-DD" style="width: 130px; height: 36px; text-align: center; padding: 0 8px;" onchange="onHolidayDtChanged();">
							</div>
						</div>

						<div class="pm08p-row-horizontal" style="display: none;">
							<div class="pm08p-row-label required">대체휴무일</div>
							<div class="pm08p-row-content">
								<input type="text" id="substituteDt" name="substituteDt" class="pm08p-input" placeholder="YYYY-MM-DD" style="width: 130px; height: 36px; text-align: center; padding: 0 8px;" onchange="onSubstituteDtChanged();">
							</div>
						</div>

						<div class="pm08p-row-horizontal pm08p-row-nowrap">
							<div class="pm08p-row-label required">근무시간</div>
							<div class="pm08p-row-content">
								<input type="text" id="stTm" name="stTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onTimeChanged();">
								<span style="font-weight: bold; color: #888;">~</span>
								<input type="text" id="edTm" name="edTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onTimeChanged();">
								<span style="display: inline-flex; align-items: center; background: #eef2ff; color: var(--pm08-navy); border-radius: 6px; padding: 4px 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap; margin-left: 2px;">
									<input type="text" id="totalTm" name="totalTm" readonly placeholder="0시간" style="width: 52px; border: none; background: transparent; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--pm08-navy); padding: 0; outline: none;">근무
								</span>
							</div>
						</div>

						<div class="pm08p-field" style="margin-top: 14px;">
							<div class="pm08p-field-label">작업 프로젝트</div>
							<div id="projectCardList" style="display: flex; flex-direction: column; gap: 8px;"></div>
						</div>

						<div class="pm08p-field" style="margin-top: 14px;">
							<div class="pm08p-field-label required">신청사유</div>
							<textarea id="specialReason" name="specialReason" class="pm08p-input" placeholder="신청사유를 입력하세요" style="width: 100%; min-height: 80px; resize: vertical; box-sizing: border-box;"></textarea>
						</div>
					</div>

					<!-- 결과 입력 섹션 (신청 시 숨김, 결과 등록 시 노출) -->
					<div class="pm08p-section" id="secResultSection" style="display: none;">
						<div class="pm08p-section-title">실제 근무 결과</div>

						<div class="pm08p-row-horizontal pm08p-row-nowrap">
							<div class="pm08p-row-label">실제 근무시간</div>
							<div class="pm08p-row-content">
								<input type="text" id="realStTm" name="realStTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onRealTimeChanged();">
								<span style="font-weight: bold; color: #888;">~</span>
								<input type="text" id="realEdTm" name="realEdTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onRealTimeChanged();">
								<span style="display: inline-flex; align-items: center; background: #eef2ff; color: var(--pm08-navy); border-radius: 6px; padding: 4px 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap; margin-left: 2px;">
									<input type="text" id="realTotalTm" name="realTotalTm" readonly placeholder="0시간" style="width: 52px; border: none; background: transparent; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--pm08-navy); padding: 0; outline: none;">근무
								</span>

						</div>

						<div class="pm08p-field" style="margin-top: 14px;">
							<div class="pm08p-field-label">근무결과</div>
							<textarea id="workResult" name="workResult" class="pm08p-input" placeholder="근무결과를 입력하세요" style="width: 100%; min-height: 80px; resize: vertical; box-sizing: border-box;"></textarea>
						</div>

						<div class="pm08p-field" id="resultApprArea" style="display: none; margin-top: 14px;">
							<div class="pm08p-field-label required" style="display: flex; justify-content: space-between; align-items: center;">
								<span>근무결과 결재선 및 공유선</span>
								<span id="btnResultApprovalArea">
									<button type="button" class="pm08p-btn-sm" onclick="insertResultShareUser();">결재자/공유자 지정</button>
								</span>
							</div>
							<div id="resultApprovalList" style="display: flex; flex-direction: column; gap: 6px;"></div>
							<div id="resultApprGuide" class="text-danger" style="display: none; font-size: 12px; margin-top: 6px;">결과 상신은 가능하나 결과 승인은 신청 결재 완료 후 처리됩니다.</div>
						</div>

						<div class="pm08p-field" style="display:none; margin-top: 14px;" id="pm08MngOpnGroup">
							<div class="pm08p-field-label" id="pm08MngOpnLabel">담당팀장 의견</div>
							<textarea id="pm08MngOpn" name="pm08MngOpn" class="pm08p-input" readonly style="width: 100%; min-height: 60px; resize: vertical; background:#f4f4f4; box-sizing: border-box;"></textarea>
						</div>
					</div>

					<!-- 첨부파일 섹션 -->
					<div class="pm08p-section">
						<div class="pm08p-section-title">첨부파일</div>
						<div id="fileList_area"></div>
					</div>

					<!-- 결재 영역 (결재자 진입 모드에서만 표시) -->
					<div class="pm08p-section" id="approvalActionSection" style="display: none;">
						<div class="pm08p-section-title">결재</div>
						<div id="approval_area"></div>
					</div>

				</div> <!-- .pm08p-page -->
			</form>
		</div> <!-- .popup_area -->

		<!-- 하단 플로팅 고정 바 (PM0701P01_M 동일) -->
		<div class="pm08p-bottom-bar" id="bottomBar">
			<button type="button" class="close_btn" id="closeBtn" onclick="closeModal();">닫기</button>
			<button type="button" id="actionBtn" style="display: none;" onclick="saveTempData();">저장</button>
			<button type="button" id="approvalBtn" style="display: none;" onclick="doMobileSubstituteApproval();">승인</button>
			<button type="button" id="submitResultBtn" style="display: none;" onclick="submitResultApproval();">결과결재 상신</button>
		</div>
	</div> <!-- #main_area -->
</body>
</html>

<script type="text/javascript">

	// 모듈 레벨 변수
	var paramObj = null;
	var commApproval = null;
	var isReadonly = false;
		var pm08ResultApprAllowYn = 'N';
		var resultApprovalList = [];
		var resultApprEditable = false;
		// global.js kakaoSendReal() 이 전역 kakaoErr 를 참조한다 (PM0701P01_M 과 동일)
		var kakaoErr = [];
		var kakaoCnt = 0;
		var teleNo = "";

	// 시간 포맷팅
	function formatTime(timeStr) {
		if (!timeStr) return "";
		var s = String(timeStr).replace(/[^0-9]/g, '');
		if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);
		return timeStr;
	}

	// 시간 계산
	function calcDuration(stTmStr, edTmStr) {
		if (!stTmStr || !edTmStr) return "";
		try {
			var stParts = String(stTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			var edParts = String(edTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			if (!stParts || !edParts) return "";
			var stMin = parseInt(stParts[1], 10) * 60 + parseInt(stParts[2], 10);
			var edMin = parseInt(edParts[1], 10) * 60 + parseInt(edParts[2], 10);
			if (edMin < stMin) edMin += 24 * 60;
			var diffMin = edMin - stMin;
			var hrs = Math.floor(diffMin / 60);
			var mins = diffMin % 60;
			if (hrs === 0 && mins === 0) return "";
			return (hrs > 0 ? hrs + "시간 " : "") + (mins > 0 ? mins + "분" : "").trim();
		} catch (e) {
			console.error(e);
			return "";
		}
	}

	// 휴일 여부 판정 함수
	function isHolidayDate(dtStr) {
		if (!dtStr || dtStr.length < 10) return false;
		try {
			var parts = dtStr.split('-');
			if (parts.length === 3) {
				var y = parseInt(parts[0], 10);
				var m = parseInt(parts[1], 10) - 1;
				var d = parseInt(parts[2], 10);
				var dt = new Date(y, m, d);
				var day = dt.getDay();
				if (day === 0 || day === 6) return true;

				if (typeof yearHolidayTable === 'function') {
					var yearHolidays = yearHolidayTable(y) || [];
					var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
					for (var i = 0; i < yearHolidays.length; i++) {
						if (yearHolidays[i] === targetStr) {
							return true;
						}
					}
				}
			}
		} catch (e) {
			console.error(e);
		}
		return false;
	}

		if (typeof authorizationToken !== 'undefined') {
			xhr.setRequestHeader("Authorization", authorizationToken);
		}
		xhr.setRequestHeader("X-GBS-Source", "pdfjs-viewer");

		xhr.onload = function() {

			} else {
				console.error("이미지 미리보기 실패, status: " + xhr.status);
			}
		};
		xhr.send();

	// PC fileTree.js의 downLoadFile()과 동일한 방식(fetch+Blob). fileDownloadAuth2는
	// X-GBS-Source: pdfjs-viewer 헤더가 있어야만 응답하므로 location.href 이동으로는
	// 호출할 수 없다(과거 존재하지 않는 fileDownloadAuth로 이동해 404가 나던 문제 수정).
	function downloadMobileFile(fileKey, fileName) {
		if (!fileKey) return;
		var coCdVal = $("#coCd").val() || jwt.coCd || "GUN";
		fetch("/admin/cm/cm08/fileDownloadAuth2?fileKey=" + fileKey + "&userId=" + jwt.userId + "&coCd=" + coCdVal, {
			method: "GET",
			headers: { "Authorization": authorizationToken, "X-GBS-Source": "pdfjs-viewer" }
		}).then(function(response) {
			if (!response.ok) throw new Error('다운로드 실패');
			return response.blob();
		}).then(function(blob) {
			var url = URL.createObjectURL(blob);
			var a = document.createElement('a');
			a.href = url;
			a.download = fileName;
			document.body.appendChild(a);
			a.click();
			URL.revokeObjectURL(url);
			a.remove();
		}).catch(function(error) {
			console.error("파일 다운로드 중 오류:", error);
			alert("파일 다운로드에 실패했습니다.");
		});
	}

	// ===== 근무결과 등록 및 결과결재 상신 (PC PM0801P01.html 과 동일 규칙) =====
		// 신청자 모드(결재자 진입 아님)에서만 사용. 결재자 진입(M08 → actionType A)은 기존 로직 그대로.
		function checkHasRealResult(dtlData) {
			dtlData = dtlData || {};
			var isValidTm = function(tm) {
				if (!tm) return false;
				var s = String(tm).replace(/[^0-9]/g, '');
				return s.length > 0 && s !== '0000';
			};
			return isValidTm(dtlData.realStTm) || isValidTm(dtlData.realEdTm)
				|| !!(dtlData.workResult && $.trim(dtlData.workResult) !== '')
				|| !!(dtlData.resultStatus);
		}

		// 신청자 모드 편집 규칙 (PC applyApprStatusPolicy 의 신청서/결과 영역 기준과 동일)
		function applyRequesterResultPolicy(dtlData) {
			dtlData = dtlData || {};
			var reqId = dtlData.reqId || $('#reqId').val() || "";
			var isWriter = (!reqId || reqId === jwt.userId);
			var hasResult = checkHasRealResult(dtlData);
			var resultStatus = dtlData.resultStatus;
			var isReqEditable = !hasResult && isWriter && (paramObj.openStage !== 'RESULT')
				&& (!dtlData.reqStatus || dtlData.reqStatus === 'REQ');
			resultApprEditable = isWriter && (!resultStatus || resultStatus === 'REQ');

			$('#holidayDt, #stTm, #edTm, #specialReason').prop('readonly', !isReqEditable);
			$('#actionBtn').toggle(isReqEditable);

			$('#realStTm, #realEdTm, #workResult').prop('readonly', !resultApprEditable);
			$('#resultApprArea').show();
			$('#btnResultApprovalArea').toggle(resultApprEditable);

			var isFirstResult = !hasResult;
			$('#submitResultBtn').text(isFirstResult ? '결과결재 상신' : '결과수정').toggle(resultApprEditable);
			$('#resultApprGuide').toggle(resultApprEditable && isFirstResult && pm08ResultApprAllowYn !== 'Y');
		}

		// 결과 결재선 기본값: 신청자 본인 + 공통코드 SPECRTS19 (PC setDefaultResultApprovalLine 과 동일)
		function setDefaultResultApprovalLine() {
			var reqId = $('#reqId').val() || jwt.userId;
			if (!reqId || $.trim(reqId) === '') return;

			var autoList = [];
			var addedIds = {};

			function pushApprover(u) {
				if (!u || !u.id) return;
				var key = String(u.id).toLowerCase();
				if (addedIds[key]) return;
				addedIds[key] = true;
				autoList.push({
					gb: "결재", usrNm: u.id, todoId: u.id, name: u.name || u.id,
					jik: u.levelNm || '', dtNm: u.deptNm || '', telNo: u.telNo || '', email: u.email || '',
					sanctnSttus: 'N', sanctnSttusNm: ''
				});
			}

			postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": reqId }, null, function(data) {
				if (data && data.userInfo) pushApprover(data.userInfo);
			});

			postAjaxSync("/admin/cm/cm05/selectChildCodeList", { "codeId": "SPECRTS19" }, null, function(data) {
				var list = (data && data.childCodeList) ? data.childCodeList : [];
				if (list.length === 0) return;
				var codeEtc = list[0].codeEtc || '';
				if (!codeEtc) return;
				$.each(codeEtc.split(','), function(idx, rawId) {
					var uId = $.trim(rawId);
					if (!uId) return true;
					postAjaxSync("/admin/cm/cm06/selectUserInfo", { "userId": uId }, null, function(userData) {
						if (userData && userData.userInfo) pushApprover(userData.userInfo);
					});
				});
			});

			$.each(autoList, function(idx, row) { row.sanctnSn = idx + 1; });
			resultApprovalList = autoList;
			renderResultApprovalList();
		}

		// 기존 결과 결재선 로드 (결과결재 TODODIV2420 / 결과공유 TODODIV1420). 없으면 기본 결재선 구성 (PC loadApprovalLine 과 동일)
		function loadResultApprovalLine(reqNo) {
			var rows = [];
			$.each([{ cd: "TODODIV2420", gb: "결재" }, { cd: "TODODIV1420", gb: "공유" }], function(i, div) {
				postAjaxSync("/user/wb/wb20/selectGetApprovalList", { "todoNo": reqNo, "todoDiv2CodeId": div.cd }, null, function(data) {
					$.each(data.resultList || [], function(idx, r) {
						rows.push({
							gb: div.gb,
							sanctnSn: Number(r.sanctnSn || 0),
							usrNm: r.todoId,
							empNo: r.empNo || r.todoId,
							name: r.todoNm || r.name,
							jik: r.jik,
							dtNm: r.dtNm,
							telNo: r.telNo || '',
							email: r.email || '',
							lineType: r.lineType || (div.gb === "공유" ? "REF" : "APPR"),
							sanctnSttus: r.sanctnSttus || 'N'
						});
					});
				});
			});

			var gbOrder = { "결재": 0, "공유": 1 };
			rows.sort(function(a, b) {
				var gbDiff = (gbOrder[a.gb] || 0) - (gbOrder[b.gb] || 0);
				if (gbDiff !== 0) return gbDiff;
				return a.sanctnSn - b.sanctnSn;
			});

			resultApprovalList = rows;
			if (rows.length === 0) {
				setDefaultResultApprovalLine();
				return;
			}
			renderResultApprovalList();
		}

		function renderResultApprovalList() {
			var $area = $('#resultApprovalList');
			$area.empty();
			if (resultApprovalList.length === 0) {
				$area.html('<div style="color: #aaa; font-size: 12px; text-align: center; padding: 12px; background: #fafafa; border: 1px dashed #ddd; border-radius: 6px;">지정된 결재선이 없습니다.</div>');
				return;
			}
			$.each(resultApprovalList, function(idx, row) {
				var isApr = (row.gb === "결재");

		// 결과 결재선 → approvalArr (PC processApprovalGrid("RESULT") 와 동일 구조)
		function buildResultApprovalArr(reqNo, salesCd) {
			var arr = [];
			var coCdVal = $('#coCd').val() || "GUN";
			var seenAppIds = {};
			$.each(resultApprovalList, function(idx, item) {
				if (item.gb === "결재") {
					var uid = item.usrNm || item.todoId || item.empNo;
					if (uid) seenAppIds[uid] = true;
				}
			});
			var appSn = 0;
			var shaSn = 0;
			$.each(resultApprovalList, function(idx, item) {
				var todoDiv1CodeId, todoDiv2CodeId, sanctnSn;
				if (item.gb === "결재") {
					appSn += 1;
					todoDiv1CodeId = "TODODIV20";
					todoDiv2CodeId = "TODODIV2420";
					sanctnSn = appSn;
				} else if (item.gb === "공유") {
					var sUid = item.usrNm || item.todoId || item.empNo;
					if (sUid && seenAppIds[sUid]) return true;
					shaSn += 1;
					todoDiv1CodeId = "TODODIV10";
					todoDiv2CodeId = "TODODIV1420";
					sanctnSn = shaSn;
				} else {
					return true;
				}
				arr.push({
					coCd: coCdVal,
					todoCoCd: coCdVal,
					todoDiv1CodeId: todoDiv1CodeId,
					todoDiv2CodeId: todoDiv2CodeId,
					salesCd: salesCd,
					sanctnSn: sanctnSn,
					sanctnSttus: item.sanctnSttus || "N",
					todoNo: reqNo,
					todoFileTrgtKey: reqNo,
					todoTitl: "휴일대체근무 결과보고서",
					pgPath: "/user/pm/pm08/PM0801P01.html",
					pgParam: JSON.stringify({
						actionType: "A",
						coCd: coCdVal,
						reqNo: reqNo || "",
						todoFileTrgtKey: reqNo || "",
						openStage: "RESULT",
						todoDiv2CodeId: todoDiv2CodeId,
						pgmId: "PM0801P01"
					}),
					todoId: item.usrNm,
					empNo: item.usrNm,
					name: item.name,
					telNo: item.telNo,
					email: item.email,
					gb: item.gb,
					lineType: item.lineType || (item.gb === "공유" ? "REF" : "APPR"),
					userId: jwt.userId,
					pgmId: "PM0801P01"
				});
			});
			return arr;
		}

		// 결과 등록 및 결과결재 상신 (PC submitResultApproval 과 동일 검증/전송 계약 + 모바일 첨부 규약)
		function submitResultApproval() {
			var reqNo = $('#reqNo').val();
			if (!reqNo) {
				alert("신청건이 먼저 등록되어야 결과를 상신할 수 있습니다.");
				return;
			}
			if (!$.trim($('#realStTm').val())) {
				alert("실제 시작시간을 선택하세요.");
				$('#realStTm').focus();
				return;
			}
			if (!$.trim($('#realEdTm').val())) {
				alert("실제 종료시간을 선택하세요.");
				$('#realEdTm').focus();
				return;
			}
			if (!$.trim($('#workResult').val())) {
				alert("실제 근무결과를 입력하세요.");
				$('#workResult').focus();
				return;
			}

			var hasResultApprover = resultApprovalList.some(function(item) { return item.gb === "결재"; });

				? (pList[0].salesCd || pList[0].SALES_CD) : reqNo;

			var approvalList = buildResultApprovalArr(reqNo, firstSalesCd);
			var hasResultApproval = approvalList.some(function(item) { return item.todoDiv2CodeId === "TODODIV2420" && item.gb === "결재"; });
			if (!hasResultApproval) {
				alert("근무결과 결재자를 1명 이상 지정해 주세요.");
				return;
			}

			var reqNm = $('#reqTitl').val() || jwt.userNm;
			var confirmMsg = "신청자(" + reqNm + ")는 등록내용과 틀림없이 휴일대체근무를 진행하였으니 검토 후 재가바랍니다.";

			formData.append("realEdTm", ($('#realEdTm').val() || "").replace(/:/g, ''));

			formData.append("approvalArr", JSON.stringify(approvalList));
			formData.append("approvalStage", "RESULT");
			formData.append("userId", jwt.userId);
			formData.append("pgmId", "PM0801P01_M");

			// 파일 첨부 처리 (saveTempData 와 동일 규약)
			formData.append("comonCd", "FITR9902");
			$.each(attachedFiles, function(idx, fileObj) {
				formData.append('files', fileObj);
			});
			formData.append('deleteFileArr', JSON.stringify(deleteFileArr));

			filePostAjax("/user/pm/pm08/updateSubstituteWork", formData, function(data) {
				if (data && (data.resultCode == 200 || data.resultCode == "200")) {
					try {
						kakaoTodoResult();

						console.error("알림톡 발송 실패 (저장은 정상 처리됨):", e);
					}
					alert("결과결재 상신이 완료되었습니다.");
					closeModal();
				} else {
					var msg = (data && data.resultMessage) ? data.resultMessage : "저장 실패";
					alert(msg);
				}
			});

		// to-do 공유 알림톡 (PC commKaKaoSendTodo 와 동일)
		function commKaKaoSendTodo(param) {
			var maxMessageId = null;
			var talkMessage = null;
			var mobile = null;
			var todoDiv2CodeNm = null;
			var sendList = [];
			let talkParam = {};
			let talkBody = {};
			let sendCnt = 0;
			postAjaxSync("/user/bm/bm18/selectMaxMessageIdTodo", param, null, function(data) {
				if (data.resultList.length > 0) {
					if (data.resultList[0].maxMessageId != "") {
						sendList = data.resultList;
					} else {
						alert("알림톡 발송을 위한 messageId 생성에 실패 했습니다.");
						return;
					}
				}
			});

			$.each(sendList, function(key, sendObj) {
				maxMessageId = sendObj.maxMessageId;
				talkMessage = sendObj.messageDesc;
				mobile = sendObj.telNo;
				param.rcvId = sendObj.todoId;
				param.rcvNm = sendObj.name;
				param.nameTo = sendObj.name;
				todoDiv2CodeNm = sendObj.todoTitl;
				param.todoDiv2CodeNm = todoDiv2CodeNm;
				param.sendDt = sendObj.sendDt;

				if (mobile == "" || mobile == null) {
					alert('수신전화번호가 없습니다.');
					return;
				}
				if ((talkMessage == "" || talkMessage == null) && !param.customMessage) {
					alert('발송할 내용이 없습니다.');
					return;
				}

				let message = param.customMessage ? param.customMessage : talkMessage;
				let splitStr = Array.from(message.matchAll('\\{(.*?)\\}'), match => `${match[0]}`);
				$.each(splitStr, function(key, val) {
					let compKey = val.substring(1, val.length - 1);
					if (compKey != "" && compKey != "undefined") {
						if (typeof (param[compKey]) != "undefined") {
							let val2 = '#' + val;
							message = message.replaceAll(val2, param[compKey]);
						}
					}
				});

				talkParam.authToken = "e/eDfZOFCsrBqadaECQ0+g==";
				talkParam.serverName = "gyitt2400";
				talkParam.paymentType = "P";
				talkBody.service = "2310086157";
				talkBody.messageId = maxMessageId;
				talkBody.title = param.title;
				talkBody.message = message;
				talkBody.mobile = mobile;
				talkBody.template = "10003";
				let talkJson = JSON.stringify(talkBody);
				if (typeof jwt !== 'undefined' && jwt.kakaoSend) {
					sendCnt = kakaoSendReal(talkJson, talkParam, param);
				}
			});

			if (sendCnt > 0) {
				kakaoCnt++;
			}
		}

	// 모드별 화면/버튼 제어 함수 (결재모드, 신규등록, 수정 등)
	// 결과 등록 단계 여부 판정 (신청 단계에서는 false, 결과 등록/결과 결재 단계에서만 true)
	function isResultStageMode(dtl) {
		dtl = dtl || {};
		if (!paramObj) return false;
		if (paramObj.openStage === 'RESULT') return true;
		if (paramObj.todoDiv2CodeId === 'TODODIV2420') return true;
		if (!paramObj.reqNo || paramObj.actionType === 'C') return false;
		if (dtl.resultStatus || (dtl.workResult && $.trim(dtl.workResult) !== '') || dtl.realStTm || dtl.realEdTm) {
			return true;
		}
		return false;
	}

	// 모드별 화면/버튼 제어 함수 (결재모드, 신규등록, 수정 등)
	function renderFinalModeUI(dtlData) {
		if (!paramObj) return;

		dtlData = dtlData || {};
		var isResultStage = isResultStageMode(dtlData);

		// [요구사항] 휴일대체근무 신청 시 실제 근무 결과 숨김, 결과 등록 시에만 노출
		var isApprovalModeNow = (paramObj.actionType === "A" || paramObj.pgmId === "M08");
		if (isResultStage || (!isApprovalModeNow && !!paramObj.reqNo)) {
			$('#secResultSection').show();
		} else {
			$('#secResultSection').hide();
		}
		$('#popupTitle').text(isResultStage ? '휴일대체근무 결과' : '휴일대체근무 신청');

		var isApprovalMode = (paramObj.actionType === "A" || paramObj.pgmId === "M08");

		// 초기 상태: 모든 버튼 숨김
		$("#actionBtn").hide();
		$("#closeBtn").text("닫기").show();
		$("#approvalBtn").hide();
		$("#approvalActionSection").hide();
			$("#resultApprArea, #submitResultBtn").hide();
		$("#pm08MngOpnGroup").hide();

		if (isApprovalMode) {
			// [모드 1] 결재자 진입 모드 (닫기 / 승인 2개 버튼만 노출!)
			isReadonly = true;
			$("#popForm").find("input, select, textarea").not("#pm08MngOpn").prop("readonly", true).prop("disabled", true);

			$("#closeBtn").show();
			$("#approvalBtn").text("승인").show();
			$("#actionBtn").hide();

			$("#approvalActionSection").show();
			$("#pm08MngOpnGroup").show();
			initApprovalWidget();
			return;
		}

		// [모드 2] 신규 작성 또는 수정 모드
		isReadonly = false;
		$("#popForm").find("input, select, textarea").prop("readonly", false).prop("disabled", false);
		$("#pm08MngOpnGroup").hide();
		$("#approvalBtn").hide();
		$("#actionBtn").text("저장").show();
			if (paramObj.reqNo) applyRequesterResultPolicy(dtlData);
		$("#closeBtn").text("닫기").show();
	}

	// 결재 위젯 초기화
	function initApprovalWidget() {
		if (!paramObj) return;

		var htmlParam = { htmlArea: 'approval_area' };
		var approvalParam = {
			coCd: paramObj.coCd || jwt.coCd,
			todoDiv1CodeId: paramObj.todoDiv1CodeId || 'TODODIV20',
			todoDiv2CodeId: paramObj.todoDiv2CodeId,
			todoNo: paramObj.todoNo || paramObj.reqNo,
			pgmId: paramObj.pgmId || 'M08'
		};
		var popParam = Object.assign({}, paramObj);
		popParam.todoNo = paramObj.todoNo || paramObj.reqNo;
		delete popParam.todoKey;
		delete popParam.sanctnSn;
		delete popParam.pgmId;
		delete approvalParam.todoKey;
		delete approvalParam.sanctnSn;

		commApproval = new Approval(htmlParam, approvalParam, popParam);
		var originalMyTodoStatusRtv = window.myTodoStatusRtv;
		window.myTodoStatusRtv = function(isForce) {
			if (typeof originalMyTodoStatusRtv === 'function') originalMyTodoStatusRtv(isForce);
			if (isForce) setTimeout(function() { closeModal(); }, 0);
		};
		commApproval.makeHtml();

		// PM08 전용: 휴일대체근무 결재선 테이블 정밀 보정
		// 1) 휴일대체근무에는 공수 입력이 없으므로 3번째 컬럼(투입공수) 숨김 처리
		$('#appLine th:nth-child(3), #appLine td:nth-child(3), #appLine colgroup col:nth-child(3)').hide();

		// 2) 공용 위젯 내부 자체 버튼바 중복 숨김 처리 (하단 바의 승인/닫기 사용)
		$('#approval_area .mobile_mid_btn, #appBtnDiv').hide();

		// 본인 결재자(jwt.userId)가 아닌 다른 행의 결재의견 입력 차단
		$('#appLine tr[data-dept-id]').each(function() {
			var rowUser = $(this).attr('data-dept-id');
			var $txt = $(this).find('textarea[name="todoCfOpn"]');
			if (rowUser !== jwt.userId) {
				$txt.prop('disabled', true).prop('readonly', true).css({
					'background-color': '#f4f4f4',
					'color': '#888888',
					'cursor': 'not-allowed'
				});
			} else {
				$txt.prop('disabled', false).prop('readonly', false).css({
					'background-color': '#ffffff',
					'color': '#333333'
				});
			}
		});
	}

	// 모바일 휴일대체근무 결재 승인 실행 함수
	function doMobileSubstituteApproval() {
		if (commApproval && typeof commApproval.confirmApproval === 'function') {
			var res = commApproval.confirmApproval();
			if (res !== false) {
				alert("결재 승인이 정상 처리되었습니다.");
				closeModal();
			}
		}
	}

	// 닫기
	function closeModal() {
		if (typeof window.history !== 'undefined') {
			window.history.back();
		}
	}

	// 초기화
	$(document).ready(function() {
		// 파라미터 수신 (sessionStorage에서 M08.html이 전달한 paramObj 수신)
		paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
		sessionStorage.removeItem('paramObj');

		if (!paramObj) {
			// sessionStorage에 paramObj가 없으면(예: 새로고침으로 세션값이 이미 소비된 경우) 이후 로직이
			// paramObj.reqNo 등에서 예외를 던져 화면이 빈 채로 멈추므로, 원인을 알 수 있게 명시적으로 알리고 중단한다.
			alert("문서 정보를 불러오지 못했습니다. 결재함 목록에서 다시 시도해주세요.");
			paramObj = {};
			return;
		}

		// 파일 초기화
		loadMobileFileList(paramObj.reqNo || "");

		// 신규 생성 또는 수정
		if (!paramObj.reqNo) {
			// 신규 등록
			$('#actionType').val('C');
			$('#reqId').val(jwt.userId);
			$('#reqTitl').val(jwt.userNm);
			$('#reqDeptNm').val(jwt.deptNm);

			var todayStr = (typeof moment !== 'undefined') ? moment().format('YYYY-MM-DD') : new Date().toISOString().substring(0, 10);
			$('#holidayDt').val(todayStr);
			$('#substituteDt').val(todayStr);

			// 참여 프로젝트 초기화
			projectCardDataList = [];
			renderProjectCards();

			// 신규 등록 모드 UI 제어
			renderFinalModeUI();
		} else {
			// 수정/조회
			$('#actionType').val('U');
			$('#reqNo').val(paramObj.reqNo);

			postAjaxSync("/user/pm/pm08/selectSubstituteWorkDtl", {
				"coCd": "GUN",
				"reqNo": paramObj.reqNo
			}, null, function(data) {
				if (data && data.result) {
					var dtl = data.result;
					$('#reqId').val(dtl.reqId);
					$('#reqTitl').val(dtl.reqNm);
					$('#reqDeptNm').val(dtl.deptNm);
					$('#holidayDt').val(dtl.holidayDt ? moment(dtl.holidayDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#substituteDt').val(dtl.substituteDt ? moment(dtl.substituteDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#stTm').val(dtl.stTm || '');
					$('#edTm').val(dtl.edTm || '');
					$('#totalTm').val(dtl.totalTm || '');
					$('#specialReason').val(dtl.specialReason || '');
					$('#realStTm').val(dtl.realStTm || '');
					$('#realEdTm').val(dtl.realEdTm || '');
					$('#realTotalTm').val(dtl.realTotalTm || '');
					$('#workResult').val(dtl.workResult || '');
						pm08ResultApprAllowYn = (dtl.resultApprAllowYn === 'Y') ? 'Y' : 'N';

					// 참여 프로젝트 목록 로드
					projectCardDataList = dtl.projectList || [];
					renderProjectCards();

					// 근무결과/담당팀장 의견 렌더링 (결재자 진입 모드일 때만)
					var isResultStage = (paramObj.todoDiv2CodeId == 'TODODIV2420');
					$('#pm08MngOpnLabel').text(isResultStage ? '담당팀장 의견(결과)' : '담당팀장 의견(신청)');
					$('#pm08MngOpn').val((isResultStage ? dtl.resultMngOpn : dtl.reqMngOpn) || "");

					// 모드별 UI 제어 (신규/수정/결재자 진입)
					renderFinalModeUI(dtl);

						// 신청자 모드에서만 결과 결재선 로드 (결재자 진입 모드는 기존 승인 위젯 로직 유지)
						if (!(paramObj.actionType === "A" || paramObj.pgmId === "M08")) {
							loadResultApprovalLine(paramObj.reqNo);
						}
				}
			});
		}
	});

</script>
