<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

	<link rel="stylesheet" href="/static/bootstrap/css/bootstrap-theme.min.css">

	<style>
		:root {
			--pm08-navy: #304a8a;
			--pm08-bg: #dfe4ec;
			--pm08-ink: #14161c;
			--pm08-sub: #6b7280;
			--pm08-line: #c3cad8;
		}

		html, body { background: var(--pm08-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm08p-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 100px;
			box-sizing: border-box;
		}

		.pm08p-section {
			width: 100%;
			background: #ffffff;
			border: 1px solid var(--pm08-line);
			border-radius: 11px;
			padding: 13px;
			margin-bottom: 11px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, .06);
			box-sizing: border-box;
		}

		.pm08p-section-title {
			font-size: 12.5px;
			font-weight: 800;
			color: var(--pm08-navy);
			letter-spacing: .02em;
			margin: 0 0 9px;
			padding-bottom: 6px;
			border-bottom: 2px solid #eef1f6;
		}

		.pm08p-field { margin-bottom: 11px; }
		.pm08p-field:last-child { margin-bottom: 0; }

		.pm08p-field-label {
			font-size: 11.5px;
			font-weight: 700;
			color: var(--pm08-ink);
			margin-bottom: 4px;
		}

		.pm08p-field-label.required::before {
			content: "* ";
			color: #d9534f;
		}

		.pm08p-input {
			width: 100%;
			padding: 9px 10px;
			font-size: 12px;
			border: 1px solid #d8dce6;
			border-radius: 6px;
			box-sizing: border-box;
		}

		.pm08p-input:disabled {
			background: #f8f9fa;
			color: #999;
		}

		.pm08p-button-group {
			display: flex;
			gap: 8px;
			margin-top: 14px;
		}

		.pm08p-button {
			flex: 1;
			padding: 10px 12px;
			font-size: 12.5px;
			font-weight: 600;
			border: none;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.3s;
		}

		.pm08p-button-primary {
			background: var(--pm08-navy);
			color: #ffffff;
		}

		.pm08p-button-default {
			background: #f0f0f0;
			color: var(--pm08-ink);
		}

		.pm08p-notice {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 8px;
			background: #fff7e6;
			border: 1px solid #f3d38a;
			color: #92660a;
			font-size: 12px;
			font-weight: 600;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
			box-sizing: border-box;
		}
	</style>
</head>

<body>
	<div id="head_area"></div>
	<div id="top_area"></div>
	<div id="main_area">
		<div class="pm08p-page">
			<h2 style="margin: 0 0 14px; font-size: 16px; font-weight: 800; color: var(--pm08-navy);">휴일대체근무 신청</h2>

			<div class="pm08p-notice">
				<i class="fas fa-info-circle"></i>
				<span>신청 정보는 언제든지 수정 가능하며, 결재자 지정 후 상신 시에만 결재 진행됩니다.</span>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="GUN">
				<input type="hidden" id="actionType" name="actionType" value="C">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="reqId" name="reqId">

				<!-- 신청 정보 섹션 -->
				<div class="pm08p-section">
					<div class="pm08p-section-title">신청 정보</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">신청자</div>
						<input type="text" id="reqTitl" name="reqTitl" class="pm08p-input" readonly placeholder="신청자">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">부서</div>
						<input type="text" id="reqDeptNm" name="reqDeptNm" class="pm08p-input" readonly placeholder="부서">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label required">휴일근무일자</div>
						<input type="text" id="holidayDt" name="holidayDt" class="pm08p-input" placeholder="YYYY-MM-DD" onchange="onHolidayDtChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label required">대체휴무일</div>
						<input type="text" id="substituteDt" name="substituteDt" class="pm08p-input" placeholder="YYYY-MM-DD" onchange="onSubstituteDtChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label required">시작시간</div>
						<input type="text" id="stTm" name="stTm" class="pm08p-input" placeholder="HH:MM" onchange="onTimeChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label required">종료시간</div>
						<input type="text" id="edTm" name="edTm" class="pm08p-input" placeholder="HH:MM" onchange="onTimeChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">총시간</div>
						<input type="text" id="totalTm" name="totalTm" class="pm08p-input" readonly placeholder="자동계산">
					</div>

					<div class="pm08p-field">
						<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
							<div class="pm08p-field-label" style="margin-bottom: 0;">참여 프로젝트</div>
							<button type="button" class="pm08p-button pm08p-button-primary" style="flex: 0 0 auto; padding: 6px 12px; font-size: 11px; width: auto;" onclick="addProjectCardMobile();">+ 추가</button>
						</div>
						<div id="projectCardList" style="display: flex; flex-direction: column; gap: 8px;"></div>
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label required">신청사유</div>
						<textarea id="specialReason" name="specialReason" class="pm08p-input" placeholder="신청사유를 입력하세요" style="min-height: 60px; resize: vertical;"></textarea>
					</div>
				</div>

				<!-- 결과 입력 섹션 -->
				<div class="pm08p-section">
					<div class="pm08p-section-title">실제 근무 결과</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">실제 시작시간</div>
						<input type="text" id="realStTm" name="realStTm" class="pm08p-input" placeholder="HH:MM" onchange="onRealTimeChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">실제 종료시간</div>
						<input type="text" id="realEdTm" name="realEdTm" class="pm08p-input" placeholder="HH:MM" onchange="onRealTimeChanged();">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">실제 총시간</div>
						<input type="text" id="realTotalTm" name="realTotalTm" class="pm08p-input" readonly placeholder="자동계산">
					</div>

					<div class="pm08p-field">
						<div class="pm08p-field-label">근무결과</div>
						<textarea id="workResult" name="workResult" class="pm08p-input" placeholder="근무결과를 입력하세요" style="min-height: 60px; resize: vertical;"></textarea>
					</div>
				</div>

				<!-- 첨부파일 섹션 -->
				<div class="pm08p-section">
					<div class="pm08p-section-title">첨부파일</div>
					<div id="fileList_area"></div>
				</div>

				<!-- 하단 버튼 -->
				<div class="pm08p-button-group">
					<button type="button" class="pm08p-button pm08p-button-primary" onclick="saveTempData();">저 장</button>
					<button type="button" class="pm08p-button pm08p-button-default" onclick="closeModal();">닫 기</button>
				</div>
			</form>
		</div>
	</div>
</body>
</html>

<script type="text/javascript">

	// 시간 포맷팅
	function formatTime(timeStr) {
		if (!timeStr) return "";
		var s = String(timeStr).replace(/[^0-9]/g, '');
		if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);
		return timeStr;
	}

	// 시간 계산
	function calcDuration(stTmStr, edTmStr) {
		if (!stTmStr || !edTmStr) return "";
		try {
			var stParts = String(stTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			var edParts = String(edTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			if (!stParts || !edParts) return "";
			var stMin = parseInt(stParts[1], 10) * 60 + parseInt(stParts[2], 10);
			var edMin = parseInt(edParts[1], 10) * 60 + parseInt(edParts[2], 10);
			if (edMin < stMin) edMin += 24 * 60;
			var diffMin = edMin - stMin;
			var hrs = Math.floor(diffMin / 60);
			var mins = diffMin % 60;
			if (hrs === 0 && mins === 0) return "";
			return (hrs > 0 ? hrs + "시간 " : "") + (mins > 0 ? mins + "분" : "").trim();
		} catch (e) {
			console.error(e);
			return "";
		}
	}

	// 휴일 여부 판정 함수
	function isHolidayDate(dtStr) {
		if (!dtStr || dtStr.length < 10) return false;
		try {
			var parts = dtStr.split('-');
			if (parts.length === 3) {
				var y = parseInt(parts[0], 10);
				var m = parseInt(parts[1], 10) - 1;
				var d = parseInt(parts[2], 10);
				var dt = new Date(y, m, d);
				var day = dt.getDay();
				if (day === 0 || day === 6) return true;

				if (typeof yearHolidayTable === 'function') {
					var yearHolidays = yearHolidayTable(y) || [];
					var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
					for (var i = 0; i < yearHolidays.length; i++) {
						if (yearHolidays[i] === targetStr) {
							return true;
						}
					}
				}
			}
		} catch (e) {
			console.error(e);
		}
		return false;
	}

	// 휴일근무일자 변경
	function onHolidayDtChanged() {
		var dtStr = $('#holidayDt').val();
		if (!dtStr || !isHolidayDate(dtStr)) {
			alert('휴일근무일자는 휴무일(토/일 또는 공휴일)이어야 합니다.');
		}
	}

	// 대체휴무일 변경
	function onSubstituteDtChanged() {
		var dtStr = $('#substituteDt').val();
		if (dtStr && isHolidayDate(dtStr)) {
			alert('대체휴무일은 평일(근무일)이어야 합니다.');
			$('#substituteDt').val('');
		}
	}

	// 시간 변경
	function onTimeChanged() {
		var stTm = $('#stTm').val();
		var edTm = $('#edTm').val();
		if (stTm && edTm) {
			$('#totalTm').val(calcDuration(stTm, edTm));
		} else {
			$('#totalTm').val('');
		}
	}

	// 실제 시간 변경
	function onRealTimeChanged() {
		var realStTm = $('#realStTm').val();
		var realEdTm = $('#realEdTm').val();
		if (realStTm && realEdTm) {
			$('#realTotalTm').val(calcDuration(realStTm, realEdTm));
		} else {
			$('#realTotalTm').val('');
		}
	}

	// 모바일 참여 프로젝트 리스트
	var projectCardDataList = [];

	// 임시저장
	function saveTempData() {
		var stDtVal = $('#holidayDt').val();
		var edDtVal = $('#substituteDt').val();

		if (!stDtVal || !edDtVal) {
			alert("휴일근무일자와 대체휴무일을 입력하세요.");
			return;
		}

		if (!isHolidayDate(stDtVal)) {
			alert("휴일근무일자는 휴무일이어야 합니다.");
			return;
		}

		if (isHolidayDate(edDtVal)) {
			alert("대체휴무일은 평일이어야 합니다.");
			return;
		}

		if (!$('#specialReason').val()) {
			alert("신청사유를 입력하세요.");
			return;
		}

		var formData = new FormData();
		formData.append("coCd", "GUN");
		formData.append("actionType", $('#actionType').val());
		formData.append("reqNo", $('#reqNo').val());
		formData.append("reqTitl", $('#reqTitl').val());
		formData.append("reqId", $('#reqId').val() || jwt.userId);
		formData.append("reqNm", $('#reqTitl').val());
		formData.append("deptId", "00000");
		formData.append("deptNm", $('#reqDeptNm').val());
		formData.append("holidayDt", stDtVal.replace(/-/g, ''));
		formData.append("substituteDt", edDtVal.replace(/-/g, ''));
		formData.append("stTm", ($('#stTm').val() || "").replace(/:/g, ''));
		formData.append("edTm", ($('#edTm').val() || "").replace(/:/g, ''));
		formData.append("totalTm", $('#totalTm').val());
		formData.append("specialReason", $('#specialReason').val());
		formData.append("realStTm", ($('#realStTm').val() || "").replace(/:/g, ''));
		formData.append("realEdTm", ($('#realEdTm').val() || "").replace(/:/g, ''));
		formData.append("realTotalTm", $('#realTotalTm').val());
		formData.append("workResult", $('#workResult').val());
		formData.append("projectArr", JSON.stringify(projectCardDataList));
		formData.append("approvalArr", JSON.stringify([]));
		formData.append("userId", jwt.userId);
		formData.append("pgmId", "PM0801P01_M");

		// 파일 첨부
		if (typeof treeModule !== 'undefined' && typeof treeModule.getFileArr === 'function') {
			if (typeof treeModule.setFileNodeId === 'function') {
				treeModule.setFileNodeId("FITR9902");
			}
			formData.append("comonCd", "FITR9902");

			var fileUploadArr = [];
			$.each(treeModule.getFileArr(), function (idx, obj) {
				if (obj.fileKey == 0 || !obj.fileKey) {
					formData.append('files', obj.file);
					var cloneObj = $.extend({}, obj);
					cloneObj.file = '';
					fileUploadArr.push(cloneObj);
				}
			});

			formData.append('uploadFileArr', JSON.stringify(fileUploadArr));
			formData.append('deleteFileArr', JSON.stringify(treeModule.getDeleteFileArr()));
		}

		var apiUrl = ($('#actionType').val() === "C") ? "/user/pm/pm08/insertSubstituteWork" : "/user/pm/pm08/updateSubstituteWork";

		filePostAjax(apiUrl, formData, function(data) {
			if (data && (data.resultCode == 200 || data.resultCode == "200")) {
				var resReqNo = (data.result && data.result.reqNo) ? data.result.reqNo : (data.reqNo || "");
				if (resReqNo && $('#reqNo').val() === "") {
					$('#reqNo').val(resReqNo);
				}
				alert("임시저장되었습니다.");
				if (typeof window.history !== 'undefined') {
					window.history.back();
				} else {
					closeModal();
				}
			} else {
				var msg = (data && data.resultMessage) ? data.resultMessage : "저장 실패";
				alert(msg);
			}
		});
	}

	// 참여 프로젝트 추가 (모바일)
	function addProjectCardMobile() {
		var paramObj = { "coCd": "GUN" };
		openSecondModal("/static/html/cmn/modal/wbsSalesCodeSearch.html", 1200, 700, "SALES CODE 검색", paramObj, function (grid) {
			var row = grid.target.getList("selected")[0];
			if (!row) return;
			projectCardDataList.push({
				ordrsNo: row.ordrsNo || '',
				salesCd: row.salesCd || '',
				coCd: row.coCd || '',
				pjtCd: row.clntPjt || '',
				pjtNm: row.clntPjtNm || '',
				clntCd: row.ordrsClntCd || '',
				clntNm: row.ordrsClntNm || '',
				etc: ''
			});
			renderProjectCards();
		});
	}

	// 참여 프로젝트 삭제 (모바일)
	function deleteProjectCardMobile(index) {
		if (index >= 0 && index < projectCardDataList.length) {
			projectCardDataList.splice(index, 1);
			renderProjectCards();
		}
	}

	// 참여 프로젝트 카드 렌더링 (모바일)
	function renderProjectCards() {
		var container = $('#projectCardList');
		container.empty();
		if (projectCardDataList.length === 0) {
			container.html('<div style="text-align: center; color: #999; padding: 20px;">선택된 프로젝트가 없습니다.</div>');
			return;
		}
		$.each(projectCardDataList, function (idx, proj) {
			var card = $('<div>')
				.css({
					'background': '#f8f9fa',
					'border': '1px solid #dee2e6',
					'border-radius': '8px',
					'padding': '10px 12px',
					'position': 'relative',
					'padding-right': '36px'
				})
				.html(
					'<div style="font-size: 12px; font-weight: 600; color: #304a8a; margin-bottom: 4px;">' + (proj.pjtNm || '-') + '</div>' +
					'<div style="font-size: 11px; color: #666; margin-bottom: 2px;">주문번호: ' + (proj.ordrsNo || '-') + '</div>' +
					'<div style="font-size: 11px; color: #666;">고객사: ' + (proj.clntNm || '-') + '</div>' +
					'<button type="button" class="pm08p-button pm08p-button-default" style="position: absolute; top: 50%; right: 6px; transform: translateY(-50%); padding: 4px 8px; font-size: 10px; width: auto;" onclick="deleteProjectCardMobile(' + idx + ');">삭제</button>'
				);
			container.append(card);
		});
	}

	// 닫기
	function closeModal() {
		if (typeof window.history !== 'undefined') {
			window.history.back();
		}
	}

	// 초기화
	$(document).ready(function() {
		// 파라미터 수신
		var paramObj = {};
		if (typeof window.paramObj !== 'undefined' && window.paramObj) {
			paramObj = window.paramObj;
		}

		// 파일 초기화
		if (typeof treeModule !== 'undefined') {
			var fileParam = {
				fileTrgtTyp : "PM0801P01",
				fileTrgtKey : paramObj.reqNo || "",
				todoNo      : paramObj.reqNo || "",
				comonCd     : "FITR9902"
			};
			treeModule.initAll('deptTreeOrdars', 'file-grid', 'FILETREE', fileParam, 'fileList_area');
		}

		// 신규 생성 또는 수정
		if (!paramObj.reqNo) {
			// 신규 등록
			$('#actionType').val('C');
			$('#reqId').val(jwt.userId);
			$('#reqTitl').val(jwt.userNm);
			$('#reqDeptNm').val(jwt.deptNm);

			var todayStr = (typeof moment !== 'undefined') ? moment().format('YYYY-MM-DD') : new Date().toISOString().substring(0, 10);
			$('#holidayDt').val(todayStr);
			$('#substituteDt').val(todayStr);

			// 참여 프로젝트 초기화
			projectCardDataList = [];
			renderProjectCards();
		} else {
			// 수정/조회
			$('#actionType').val('U');
			$('#reqNo').val(paramObj.reqNo);

			postAjaxSync("/user/pm/pm08/selectSubstituteWorkDtl", {
				"coCd": "GUN",
				"reqNo": paramObj.reqNo
			}, null, function(data) {
				if (data && data.result) {
					var dtl = data.result;
					$('#reqId').val(dtl.reqId);
					$('#reqTitl').val(dtl.reqNm);
					$('#reqDeptNm').val(dtl.deptNm);
					$('#holidayDt').val(dtl.holidayDt ? moment(dtl.holidayDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#substituteDt').val(dtl.substituteDt ? moment(dtl.substituteDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#stTm').val(dtl.stTm || '');
					$('#edTm').val(dtl.edTm || '');
					$('#totalTm').val(dtl.totalTm || '');
					$('#specialReason').val(dtl.specialReason || '');
					$('#realStTm').val(dtl.realStTm || '');
					$('#realEdTm').val(dtl.realEdTm || '');
					$('#realTotalTm').val(dtl.realTotalTm || '');
					$('#workResult').val(dtl.workResult || '');

					// 참여 프로젝트 목록 로드
					projectCardDataList = dtl.projectList || [];
					renderProjectCards();
				}
			});
		}
	});

</script>
