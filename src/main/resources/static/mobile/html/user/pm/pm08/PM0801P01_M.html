<head>

	<style>
		:root {
			--pm08-navy: #304a8a;
			--pm08-navy-dark: #253a6e;
			--pm08-bg: #dfe4ec;
			--pm08-ink: #14161c;
			--pm08-sub: #6b7280;
			--pm08-line: #c3cad8;
		}

		html, body { background: var(--pm08-bg); }

		#main_area {
			padding: 0;
			overflow: auto;
		}

		.pm08p-page {
			width: 100%;
			max-width: 100%;
			margin: 0 auto;
			padding: 12px 12px 100px;
			box-sizing: border-box;
		}

		.pm08p-notice {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 8px;
			background: #fff7e6;
			border: 1px solid #f3d38a;
			color: #92660a;
			font-size: 12.5px;
			font-weight: 600;
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
			box-sizing: border-box;
		}

		.pm08p-section {
			width: 100%;
			background: #ffffff;
			border: 1px solid var(--pm08-line);
			border-radius: 11px;
			padding: 13px;
			margin-bottom: 11px;
			box-shadow: 0 2px 6px rgba(16, 24, 40, .06);
			box-sizing: border-box;
		}

		.pm08p-section-title {
			font-size: 12.5px;
			font-weight: 800;
			color: var(--pm08-navy);
			letter-spacing: .02em;
			margin: 0 0 9px;
			padding-bottom: 6px;
			border-bottom: 2px solid #eef1f6;
		}

		.pm08p-field { margin-bottom: 11px; }
		.pm08p-field:last-child { margin-bottom: 0; }

		.pm08p-field-label {
			display: block;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			margin-bottom: 6px;
		}
		.pm08p-field-label.required::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}

		/* 통일된 단일 행 (좌: 라벨 85px 고정, 우: 우측정렬 내용) */
		.pm08p-row-horizontal {
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			row-gap: 6px;
			padding: 8px 0;
			border-bottom: 1px solid #eef1f6;
			min-height: 44px;
			box-sizing: border-box;
		}
		.pm08p-row-horizontal:last-child {
			border-bottom: none;
		}
		.pm08p-row-label {
			flex: 0 0 85px;
			font-size: 12.5px;
			font-weight: 700;
			color: #3a3f4a;
			line-height: 1.4;
			white-space: nowrap;
		}
		.pm08p-row-label.required::before {
			content: "*";
			color: #dc2626;
			margin-right: 3px;
		}
		.pm08p-row-content {
			flex: 1;
			display: flex;
			align-items: center;
			justify-content: flex-end;
			flex-wrap: wrap;
			row-gap: 6px;
			gap: 6px;
			min-width: 0;
		}

		.pm08p-input {
			border: 1px solid var(--pm08-line) !important;
			border-radius: 8px !important;
			font-size: 13.5px !important;
			padding: 0 10px !important;
			box-sizing: border-box;
			background-color: #fff;
			color: var(--pm08-ink);
			transition: border-color .15s ease, box-shadow .15s ease;
		}
		.pm08p-input:focus {
			outline: none;
			border-color: var(--pm08-navy) !important;
			box-shadow: 0 0 0 3px rgba(48, 74, 138, .14);
		}
		.pm08p-input:disabled, .pm08p-input[readonly] {
			background-color: #f3f4f7 !important;
			color: #7c828d !important;
		}

		textarea.pm08p-input {
			height: auto;
			min-height: 80px;
			padding: 10px 12px !important;
			line-height: 1.55;
			resize: vertical;
		}

		/* 하단 고정 버튼 바 (PM0701P01_M과 동일) */
		.pm08p-bottom-bar {
			position: fixed;
			left: 0;
			right: 0;
			bottom: 0;
			display: flex;
			gap: 10px;
			padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
			background: #ffffff;
			border-top: 1px solid var(--pm08-line);
			box-shadow: 0 -2px 10px rgba(16, 24, 40, .08);
			z-index: 60;
		}
		.pm08p-bottom-bar button {
			flex: 1 1 0;
			height: 46px;
			border-radius: 10px;
			font-size: 15px;
			font-weight: 800;
			border: none;
			cursor: pointer;
			transition: all 0.2s;
		}
		.pm08p-bottom-bar #actionBtn {
			background: var(--pm08-navy);
			color: #fff;
		}
		.pm08p-bottom-bar #actionBtn:active { background: var(--pm08-navy-dark); }
		.pm08p-bottom-bar .close_btn {
			background: #ffffff;
			border: 1px solid var(--pm08-line) !important;
			color: #3a3f4a;
		}
		.pm08p-bottom-bar .close_btn:active { background: #f3f4f7; }
		.pm08p-bottom-bar #approvalBtn {
			background: var(--pm08-navy);
			color: #fff;
		}
		.pm08p-bottom-bar #approvalBtn:active { background: var(--pm08-navy-dark); }

		/* 좌우 짤림 방지: 좁은 화면에서 폭이 고정된 자식(첨부파일 썸네일, 결재선 테이블 등)이
		   화면 밖으로 밀려나가는 대신 그 영역 안에서만 가로 스크롤되게 가둔다. */
		html, body { overflow-x: hidden; }
		#approval_area, #fileList_area {
			max-width: 100%;
			overflow-x: auto;
			-webkit-overflow-scrolling: touch;
		}

		/* 근무시간/실제근무시간 행: 결재(읽기전용) 모드에서 다른 화면 공용 readonly 스타일이
		   input 폭을 늘려버려 08:30 ~ 17:30 이 세 줄로 쪼개지는 문제가 있어, 이 행만은 항상
		   한 줄을 유지하도록 폭과 줄바꿈을 강제로 고정한다. */
		.pm08p-row-nowrap { flex-wrap: nowrap !important; }
		.pm08p-row-nowrap .pm08p-row-content { flex-wrap: nowrap !important; }
		#holidayDt, #substituteDt {
			width: 130px !important;
			flex: 0 0 130px !important;
		}
		#stTm, #edTm, #realStTm, #realEdTm {
			width: 56px !important;
			flex: 0 0 56px !important;
		}
		#totalTm, #realTotalTm {
			width: 52px !important;
			flex: 0 0 52px !important;
		}

		/* 좁은 화면(대략 360px 이하) 보완: 라벨 폭과 시간 입력칸을 살짝 줄여
		   근무시간/실제근무시간 행이 한 줄 안에 여유 있게 들어가게 한다. 색상·폰트는 그대로 유지.
		   (위 고정폭 규칙보다 뒤에 두어야 이 미디어쿼리가 이긴다) */
		@media (max-width: 360px) {
			.pm08p-page { padding-left: 10px; padding-right: 10px; }
			.pm08p-row-label { flex-basis: 72px; }
			#stTm, #edTm, #realStTm, #realEdTm { width: 50px !important; flex: 0 0 50px !important; }
			#totalTm, #realTotalTm { width: 44px !important; flex: 0 0 44px !important; }
		}
	</style>
</head>

<body>
	<div id="head_area" class="off" >
		<div class="left_btn" onclick="history.back(-1)">
			<a class="back_btn"></a>
		</div>
		<h1 class="logo">
			<img src="/static/img/Logo_gunyangitt.gif" alt="건양ITT" />
		</h1>
	</div>

	<div id="main_area">
		<div class="popup_area" style="background: transparent; padding: 0;">
			<div class="tit_contents">
				<h4 class="tit" id="popupTitle">휴일대체근무 신청</h4>
			</div>

			<form id="popForm" onSubmit="return false;">
				<input type="hidden" id="coCd" name="coCd" value="GUN">
				<input type="hidden" id="actionType" name="actionType" value="C">
				<input type="hidden" id="reqNo" name="reqNo" value="">
				<input type="hidden" id="reqId" name="reqId">

				<div class="pm08p-page">
					<div class="pm08p-notice">
						<i class="fas fa-info-circle"></i>
						<span>신청 정보는 결재진행전까지 수정 가능하며, 자동 결재로 진행됩니다.</span>
					</div>

					<!-- 신청 정보 섹션 -->
					<div class="pm08p-section">
						<div class="pm08p-section-title">신청 정보</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label">신청자</div>
							<div class="pm08p-row-content">
								<input type="text" id="reqTitl" name="reqTitl" readonly placeholder="신청자" style="border: none; background: transparent; font-size: 13px; font-weight: 700; color: #1e293b; text-align: right; padding: 0; outline: none; width: 100%;">
							</div>
						</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label">부서</div>
							<div class="pm08p-row-content">
								<input type="text" id="reqDeptNm" name="reqDeptNm" readonly placeholder="부서" style="border: none; background: transparent; font-size: 13px; font-weight: 600; color: #475569; text-align: right; padding: 0; outline: none; width: 100%;">
							</div>
						</div>

						<div class="pm08p-row-horizontal">
							<div class="pm08p-row-label required">휴일근무일자</div>
							<div class="pm08p-row-content">
								<input type="text" id="holidayDt" name="holidayDt" class="pm08p-input" placeholder="YYYY-MM-DD" style="width: 130px; height: 36px; text-align: center; padding: 0 8px;" onchange="onHolidayDtChanged();">
							</div>
						</div>

						<div class="pm08p-row-horizontal" style="display: none;">
							<div class="pm08p-row-label required">대체휴무일</div>
							<div class="pm08p-row-content">
								<input type="text" id="substituteDt" name="substituteDt" class="pm08p-input" placeholder="YYYY-MM-DD" style="width: 130px; height: 36px; text-align: center; padding: 0 8px;" onchange="onSubstituteDtChanged();">
							</div>

						<div class="pm08p-row-horizontal pm08p-row-nowrap">
							<div class="pm08p-row-label required">근무시간</div>
							<div class="pm08p-row-content">
								<input type="text" id="stTm" name="stTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onTimeChanged();">
								<span style="font-weight: bold; color: #888;">~</span>
								<input type="text" id="edTm" name="edTm" class="pm08p-input" placeholder="HH:MM" style="width: 56px; height: 36px; text-align: center; padding: 0 2px;" onchange="onTimeChanged();">
								<span style="display: inline-flex; align-items: center; background: #eef2ff; color: var(--pm08-navy); border-radius: 6px; padding: 4px 6px; font-size: 11.5px; font-weight: 700; white-space: nowrap; margin-left: 2px;">
									<input type="text" id="totalTm" name="totalTm" readonly placeholder="0시간" style="width: 52px; border: none; background: transparent; text-align: center; font-size: 11.5px; font-weight: 700; color: var(--pm08-navy); padding: 0; outline: none;">근무
								</span>
							</div>
						</div>

						<div class="pm08p-field" style="margin-top: 14px;">
							<div class="pm08p-field-label">작업 프로젝트</div>

						<div class="pm08p-field" style="margin-top: 14px;">

							<textarea id="specialReason" name="specialReason" class="pm08p-input" placeholder="신청사유를 입력하세요" style="width: 100%; min-height: 80px; resize: vertical; box-sizing: border-box;"></textarea>
						</div>
					</div>

					<!-- 결과 입력 섹션 (신청 시 숨김, 결과 등록 시 노출) -->
					<div class="pm08p-section" id="secResultSection" style="display: none;">

						<div class="pm08p-row-horizontal pm08p-row-nowrap">

							<div class="pm08p-row-content">

							<div class="pm08p-field-label">근무결과</div>

						</div>

						<div class="pm08p-field" style="display:none; margin-top: 14px;" id="pm08MngOpnGroup">
							<div class="pm08p-field-label" id="pm08MngOpnLabel">담당팀장 의견</div>

					<!-- 첨부파일 섹션 -->
					<div class="pm08p-section">
						<div class="pm08p-section-title">첨부파일</div>

					<div class="pm08p-section" id="approvalActionSection" style="display: none;">

				</div> <!-- .pm08p-page -->
			</form>
		</div> <!-- .popup_area -->

		<!-- 하단 플로팅 고정 바 (PM0701P01_M 동일) -->
		<div class="pm08p-bottom-bar" id="bottomBar">
			<button type="button" class="close_btn" id="closeBtn" onclick="closeModal();">닫기</button>
			<button type="button" id="actionBtn" style="display: none;" onclick="saveTempData();">저장</button>
			<button type="button" id="approvalBtn" style="display: none;" onclick="doMobileSubstituteApproval();">승인</button>
		</div>
	</div> <!-- #main_area -->
</body>
</html>

<script type="text/javascript">

	// 모듈 레벨 변수
	var paramObj = null;
	var commApproval = null;
	var isReadonly = false;

	// 시간 포맷팅
	function formatTime(timeStr) {
		if (!timeStr) return "";
		var s = String(timeStr).replace(/[^0-9]/g, '');
		if (s.length === 4) return s.substring(0, 2) + ":" + s.substring(2, 4);
		return timeStr;
	}

	// 시간 계산
	function calcDuration(stTmStr, edTmStr) {
		if (!stTmStr || !edTmStr) return "";
		try {
			var stParts = String(stTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			var edParts = String(edTmStr).replace(/:/g, '').match(/(\d{2})(\d{2})/);
			if (!stParts || !edParts) return "";
			var stMin = parseInt(stParts[1], 10) * 60 + parseInt(stParts[2], 10);
			var edMin = parseInt(edParts[1], 10) * 60 + parseInt(edParts[2], 10);
			if (edMin < stMin) edMin += 24 * 60;
			var diffMin = edMin - stMin;
			var hrs = Math.floor(diffMin / 60);
			var mins = diffMin % 60;
			if (hrs === 0 && mins === 0) return "";
			return (hrs > 0 ? hrs + "시간 " : "") + (mins > 0 ? mins + "분" : "").trim();
		} catch (e) {
			console.error(e);
			return "";
		}
	}

	// 휴일 여부 판정 함수
	function isHolidayDate(dtStr) {
		if (!dtStr || dtStr.length < 10) return false;
		try {
			var parts = dtStr.split('-');
			if (parts.length === 3) {
				var y = parseInt(parts[0], 10);
				var m = parseInt(parts[1], 10) - 1;
				var d = parseInt(parts[2], 10);
				var dt = new Date(y, m, d);
				var day = dt.getDay();
				if (day === 0 || day === 6) return true;

				if (typeof yearHolidayTable === 'function') {
					var yearHolidays = yearHolidayTable(y) || [];
					var targetStr = parts[0] + (m < 9 ? '0' : '') + (m + 1) + (d < 10 ? '0' : '') + d;
					for (var i = 0; i < yearHolidays.length; i++) {
						if (yearHolidays[i] === targetStr) {
							return true;
						}
					}
				}
			}
		} catch (e) {
			console.error(e);
		}
		return false;
	}

	// 휴일근무일자 변경
	function onHolidayDtChanged() {
		var dtStr = $('#holidayDt').val();
		if (!dtStr || !isHolidayDate(dtStr)) {
			alert('휴일근무일자는 휴무일(토/일 또는 공휴일)이어야 합니다.');
		}
	}

	// 대체휴무일 변경
	function onSubstituteDtChanged() {
		var dtStr = $('#substituteDt').val();
		if (dtStr && isHolidayDate(dtStr)) {
			alert('대체휴무일은 평일(근무일)이어야 합니다.');
			$('#substituteDt').val('');
		}
	}

	// 시간 변경
	function onTimeChanged() {
		var stTm = $('#stTm').val();
		var edTm = $('#edTm').val();

	function isImageFile(fileName) {
		if (!fileName) return false;
		var ext = fileName.substring(fileName.lastIndexOf('.') + 1).toLowerCase();
		return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].indexOf(ext) >= 0;
	}

	function loadMobileFileImgPreview(idx, fileKey, fileName) {
		if (!fileKey) return;
		var coCdVal = $("#coCd").val() || jwt.coCd || "GUN";
		var xhr = new XMLHttpRequest();
		xhr.open("GET", "/admin/cm/cm08/fileDownloadAuth2?fileKey=" + fileKey + "&userId=" + jwt.userId + "&coCd=" + coCdVal, true);
		xhr.responseType = "blob";
		if (typeof authorizationToken !== 'undefined') {
			xhr.setRequestHeader("Authorization", authorizationToken);
		}
		xhr.setRequestHeader("X-GBS-Source", "pdfjs-viewer");

		xhr.onload = function() {
			if (xhr.status === 200 && xhr.response) {
				var reader = new FileReader();
				reader.onload = function(e) {
					$('#mobileImgThumb_' + idx).attr('src', e.target.result).show();
					$('#mobileImgPlaceholder_' + idx).hide();
				};
				reader.readAsDataURL(xhr.response);
			} else {
				console.error("이미지 미리보기 실패, status: " + xhr.status);
			}
		};
		xhr.send();
	}

	function openAttachImageViewer(fileKey, fileName) {
		if (!fileKey) return;
		var coCdVal = $("#coCd").val() || jwt.coCd || "GUN";

		var viewFileList = [];
		$.each(existingFiles, function(idx, f) {
			var fK = f.fileKey || f.file_key || f.FILE_KEY;
			var fN = f.fileName || f.file_nm || f.FILE_NAME || '';
			if (fK) {
				viewFileList.push({
					"fileKey"  : fK,
					"fileName" : fN,
					"coCd"     : coCdVal
				});
			}
		});

		var paramObj = {
			"fileKey"  : fileKey,
			"fileName" : fileName,
			"userId"   : jwt.userId,
			"coCd"     : coCdVal,
			"fileList" : viewFileList
		};

		var w = $(window).width() || $('body').width() || 360;
		var h = $(window).height() || $('body').height() || 640;

		var stackLen = (typeof modalStack !== 'undefined' && modalStack && modalStack.length) ? modalStack.length : 1;
		if (stackLen >= 2 && typeof openThirdModal === 'function') {
			openThirdModal("/static/mobile/modal/attachImageView_M.html", w, h - 40, fileName, paramObj, function(data){});
		} else if (stackLen >= 1 && typeof openSecondModal === 'function') {
			openSecondModal("/static/mobile/modal/attachImageView_M.html", w, h - 40, fileName, paramObj, function(data){});
		} else if (typeof openModal === 'function') {
			openModal("/static/mobile/modal/attachImageView_M.html", w, h - 40, fileName, paramObj, function(data){});
		} else {
			location.href = "/admin/cm/cm08/fileDownloadAuth2?fileKey=" + fileKey + "&userId=" + jwt.userId + "&coCd=" + coCdVal;
		}

	// PC fileTree.js의 downLoadFile()과 동일한 방식(fetch+Blob). fileDownloadAuth2는
	// X-GBS-Source: pdfjs-viewer 헤더가 있어야만 응답하므로 location.href 이동으로는
	// 호출할 수 없다(과거 존재하지 않는 fileDownloadAuth로 이동해 404가 나던 문제 수정).
	function downloadMobileFile(fileKey, fileName) {
		if (!fileKey) return;
		var coCdVal = $("#coCd").val() || jwt.coCd || "GUN";
		fetch("/admin/cm/cm08/fileDownloadAuth2?fileKey=" + fileKey + "&userId=" + jwt.userId + "&coCd=" + coCdVal, {
			method: "GET",
			headers: { "Authorization": authorizationToken, "X-GBS-Source": "pdfjs-viewer" }
		}).then(function(response) {
			if (!response.ok) throw new Error('다운로드 실패');
			return response.blob();
		}).then(function(blob) {
			var url = URL.createObjectURL(blob);
			var a = document.createElement('a');
			a.href = url;
			a.download = fileName;
			document.body.appendChild(a);
			a.click();
			URL.revokeObjectURL(url);
			a.remove();
		}).catch(function(error) {
			console.error("파일 다운로드 중 오류:", error);
			alert("파일 다운로드에 실패했습니다.");
		});
	}

	function isResultStageMode(dtl) {

			isReadonly = true;

		$("#closeBtn").text("닫기").show();

				});
			} else {
				$txt.prop('disabled', false).prop('readonly', false).css({
					'background-color': '#ffffff',
					'color': '#333333'
				});
			}
		});
	}

	// 모바일 휴일대체근무 결재 승인 실행 함수
	function doMobileSubstituteApproval() {
		if (commApproval && typeof commApproval.confirmApproval === 'function') {
			var res = commApproval.confirmApproval();
			if (res !== false) {
				alert("결재 승인이 정상 처리되었습니다.");
				closeModal();
			}
		}
	}

	// 닫기
	function closeModal() {
		if (typeof window.history !== 'undefined') {
			window.history.back();
		}
	}

	// 초기화
	$(document).ready(function() {
		// 파라미터 수신 (sessionStorage에서 M08.html이 전달한 paramObj 수신)
		paramObj = JSON.parse(sessionStorage.getItem('paramObj'));
		sessionStorage.removeItem('paramObj');

		if (!paramObj) {
			// sessionStorage에 paramObj가 없으면(예: 새로고침으로 세션값이 이미 소비된 경우) 이후 로직이
			// paramObj.reqNo 등에서 예외를 던져 화면이 빈 채로 멈추므로, 원인을 알 수 있게 명시적으로 알리고 중단한다.
			alert("문서 정보를 불러오지 못했습니다. 결재함 목록에서 다시 시도해주세요.");
			paramObj = {};
			return;
		}

		// 파일 초기화
		loadMobileFileList(paramObj.reqNo || "");

		// 신규 생성 또는 수정
		if (!paramObj.reqNo) {
			// 신규 등록
			$('#actionType').val('C');
			$('#reqId').val(jwt.userId);
			$('#reqTitl').val(jwt.userNm);
			$('#reqDeptNm').val(jwt.deptNm);

			var todayStr = (typeof moment !== 'undefined') ? moment().format('YYYY-MM-DD') : new Date().toISOString().substring(0, 10);
			$('#holidayDt').val(todayStr);
			$('#substituteDt').val(todayStr);

			// 참여 프로젝트 초기화
			projectCardDataList = [];
			renderProjectCards();

			// 신규 등록 모드 UI 제어
			renderFinalModeUI();
		} else {
			// 수정/조회
			$('#actionType').val('U');
			$('#reqNo').val(paramObj.reqNo);

			postAjaxSync("/user/pm/pm08/selectSubstituteWorkDtl", {
				"coCd": "GUN",
				"reqNo": paramObj.reqNo
			}, null, function(data) {
				if (data && data.result) {
					var dtl = data.result;
					$('#reqId').val(dtl.reqId);
					$('#reqTitl').val(dtl.reqNm);
					$('#reqDeptNm').val(dtl.deptNm);
					$('#holidayDt').val(dtl.holidayDt ? moment(dtl.holidayDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#substituteDt').val(dtl.substituteDt ? moment(dtl.substituteDt, 'YYYYMMDD').format('YYYY-MM-DD') : '');
					$('#stTm').val(dtl.stTm || '');
					$('#edTm').val(dtl.edTm || '');
					$('#totalTm').val(dtl.totalTm || '');
					$('#specialReason').val(dtl.specialReason || '');
					$('#realStTm').val(dtl.realStTm || '');
					$('#realEdTm').val(dtl.realEdTm || '');
					$('#realTotalTm').val(dtl.realTotalTm || '');
					$('#workResult').val(dtl.workResult || '');

					// 참여 프로젝트 목록 로드
					projectCardDataList = dtl.projectList || [];
					renderProjectCards();

					// 근무결과/담당팀장 의견 렌더링 (결재자 진입 모드일 때만)
					var isResultStage = (paramObj.todoDiv2CodeId == 'TODODIV2420');
					$('#pm08MngOpnLabel').text(isResultStage ? '담당팀장 의견(결과)' : '담당팀장 의견(신청)');
					$('#pm08MngOpn').val((isResultStage ? dtl.resultMngOpn : dtl.reqMngOpn) || "");

					// 모드별 UI 제어 (신규/수정/결재자 진입)
					renderFinalModeUI(dtl);
				}
			});
		}
	});

</script>
